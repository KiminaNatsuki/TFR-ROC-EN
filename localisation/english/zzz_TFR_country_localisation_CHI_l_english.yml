 CHI_tsmc_idea:0 "Taiwan Semiconductor Manufacturing Company"
 CHI_tsmc_idea_desc:0 "TSMC, or Taiwan Semiconductor Manufacturing Company, is the world's largest semiconductor manufacturing enterprise, providing chip manufacturing services to fabless companies. In the 1990s, the Taiwan region focused on developing a high-tech and service-oriented economy as a transformation priority. TSMC was born in response, originally established to focus on semiconductor manufacturing, thereby pushing Western companies to outsource manufacturing to maximize profits.\n\nToday, TSMC and other Taiwanese companies contribute about two-thirds of the global semiconductor supply and dominate the high-end integrated circuit market. This high dependence on Taiwan's semiconductors forces many developed countries to pressure mainland China to avoid military action, fearing that conflict would completely destroy the supply chain and subsequently cripple the overall economy. This protection, provided by Taiwan's monopoly in semiconductor manufacturing, is known by many as the \"Silicon Shield\"."
