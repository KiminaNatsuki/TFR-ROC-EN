 Rectify_weakening_military_preparedness: "Combat Military Laxity"

 Rectify_weakening_military_preparedness_desc: "As a gathering storm takes shape, signs of instability within the United States are becoming difficult to ignore. The pandemic and energy issues have become entangled with electoral politics, causing a security architecture once considered unshakable to show signs of inertia and fracture.\n\nYet our armed forces remain bound by Cold War relics in how they train and command, leaving our tactical preparedness trapped in the past. Unless we act quickly to enforce strict discipline and restore realistic combat exercises, the price we pay when the storm breaks will be unbearable."

 Tighten_exemption_conditions: "Tighten Conscription Exemptions"

 Tighten_exemption_conditions_desc: "The conscription system has long provided various exemptions and alternative service options to accommodate social and personal needs. But in the new security environment, overly loose standards have gradually eroded the country's mobilizable manpower base.\n\nGiven an increasingly complex regional situation and our defense requirements, we must reexamine these regulations so the draft reflects actual threats and national security priorities. Moderately tightening the exemption criteria will lead more draft-age citizens to take on the responsibility of defending the country, bringing necessary manpower and vitality to the armed forces."

 Prepare_special_budget: "Allocate Special Defense Budget"

 Prepare_special_budget_desc: "As the threat of war draws closer, the regular annual defense budget can no longer meet our urgent military requirements. Updating equipment, stockpiling ammunition, and acquiring key systems must all be completed in the shortest possible time.\n\nTo address this, the government will allocate a one-time special defense budget dedicated to purchasing modern weapons and supporting equipment from friendly nations, accelerating the buildup of our combat capabilities."

 Hire_US_military_instructors: "Hire U.S. Armed Forces Instructors"

 Hire_US_military_instructors_desc: "Modern warfare differs fundamentally from the past. The battlefield is now dominated by joint operations, information integration, and precision strikes. To improve the overall quality of our forces as quickly as possible, bringing in foreign instructors with combat experience and modern training systems is a practical and effective approach.\n\nThe United States has a large number of experienced retired officers and trainers available for hire. With their help, our military can quickly adopt contemporary operational concepts and training methods. Sometimes, relying on outside help is the best way to accelerate reform."

 ROTC: "Recruiting for Talent"

 ROTC_desc: "A truly strong military must be built on a stable, steady stream of talent. Rather than relying on outside experience, we should start with the education system and train our own military professionals.\n\nBy expanding the Reserve Officers' Training Corps (ROTC), we will establish a formal training pipeline in colleges and universities, allowing top students to receive comprehensive military and leadership training while still in school. This will provide the armed forces with a long-term, solid foundation of officers, creating a military tradition that is genuinely our own."

 Introduce_scientific_training_standards: "Implement Scientific Training Standards"

 Introduce_scientific_training_standards_desc: "Traditional training methods rely heavily on experience and convention. While valuable, these methods make it difficult to accurately measure training effectiveness or differences in personnel capabilities. Given the highly technical and information-driven nature of the modern battlefield, our training system urgently requires more systematic and quantitative standards.\n\nBy introducing data analysis, physical fitness monitoring, simulator training, and standardized evaluations, we can train qualified soldiers more efficiently and adjust training regimens in real time to meet actual needs. Training is no longer just repetition and drill; it is a measurable scientific process that we can continuously optimize and improve."

 abolition_of_bayonet: "Abolish Bayonet Training"

 abolition_of_bayonet_desc: "Bayonet charges were once a core part of infantry training, and in an era of scarce ammunition and close-quarters combat, the tactic had real value. Today, however, the battlefield is dominated by firepower, communications, and coordinated operations. The era of relying on cold steel is long gone.\n\nOur forces still retain a large amount of traditional training that is disconnected from actual combat requirements, taking up valuable time and resources. If our troops are to truly adapt to modern warfare, we must be willing to discard exercises that are more symbolic than practical."

 Extend_compulsory_military_service: "Extend Mandatory Service"

 Extend_compulsory_military_service_desc: "The demands the modern battlefield places on soldiers go far beyond basic physical fitness and marksmanship. Operating communications equipment, coordinating in urban combat, and utilizing drones and information systems all require extended periods of comprehensive training and team integration. The current service period is simply too short for recruits to acquire the skills and unit cohesion required of a qualified combatant before their discharge.\n\nTo improve overall troop quality and combat readiness, we must provide our forces with adequate training time. Extending compulsory military service will allow every conscript to receive thorough training, providing the armed forces with a more reliable, combat-ready base of personnel."

 Improve_combat_readiness_level: "Elevate Readiness Phase"

 Improve_combat_readiness_level_desc: "The situation no longer allows us to approach national defense by peacetime standards. With military mobilization and regional pressure escalating across the strait, war is no longer an abstract possibility, but a reality that could happen at any moment.\n\nAll military units must enter a heightened state of readiness, ensuring personnel, equipment, and logistics can mobilize and deploy in the shortest possible time. Any delay or complacency could exact an unbearable price at a critical moment."

 Expand_Ruijie_project: "M1A2T Procurement Expansion"

 Expand_Ruijie_project_desc: "The modern battlefield demands greater mobility and firepower. Building on Project Swift, we continue to modernize our armored forces by acquiring M1A2T main battle tanks and upgrading Clouded Leopard armored vehicles. Doing so will strengthen our joint operational capabilities and improve the ground forces' overall breakthrough and defensive effectiveness."

 Continuation_Thunder_Project: "Continue the HIMARS Program"

 Continuation_Thunder_Project_desc: "The HIMARS Program did not emerge from a vacuum; its spirit traces back to the covert resupply operations during the August 23 Artillery Bombardment.\n\nOutgunned at the time, our armed forces coordinated with the United States to rush heavy artillery to the front lines, using mobile transport to break the blockade and turn the tide of the battle. Today, facing similar challenges in firepower and response time, the nation has chosen to continue the HIMARS Program, working with the United States to purchase self-propelled artillery and rapidly build up our combat capabilities.\n\nThis move does more than just quickly modernize our forces. It translates historical experience into contemporary combat power, establishing an effective deterrent in the shortest possible time and keeping our military aligned with foreign operational standards."

 Special_American_made_armor_piercing_bullets: "Custom U.S. AP Shells"

 Special_American_made_armor_piercing_bullets_desc: "As the M1A2T Procurement Expansion continues, a large number of M1A2T and additionally procured M1A2 main battle tanks are entering service. However, advanced vehicles cannot reach their full combat potential without matching ammunition.\n\nThe armor-piercing fin-stabilized discarding sabot (APFSDS) rounds currently used by the U.S. military are far superior to our existing inventory in materials, propellant, and kinetic design. Acquiring custom variants tuned to our gun barrels and fire control systems would significantly improve our armored units' penetration capabilities in long-range engagements and against heavily armored targets."

 Interception_fighter_jet_from_other_countries: "Obtain Foreign Aircraft Contracts"

 Interception_fighter_jet_from_other_countries_desc: "Since the United States and the Republic of China government in Taiwan signed the Taiwan Relations Act, our powerful ally across the ocean has continued to extend its strong arms to protect a nation that had only just found its footing. More than forty years of foreign military sales have allowed Taiwan to maintain a slight edge in its arms race with the Chinese Communist Party. From the F-104 and F-5 to the F-16V, equipment produced by Lockheed Martin has formed the absolute core of Taiwan's air power.\n\nOver the past two decades, however, Lockheed Martin's deliveries have frequently been delayed. Taiwan usually pays upfront, only to wait three to five years to actually receive the aircraft. But facing the roar of the Eastern Dragon, we don't have the luxury of operating on American time.\n\nRelying on lobbying firms and a few necessary \"gifts,\" we will attempt to intercept all the aircraft currently on the production line. Our diplomats and hired lobbyists will do everything in their power to pacify other clients, making them willingly yield some of their orders to us."

 Complete_makeover: "Full-Scale Rearmament"

 Complete_makeover_desc: "As the latest batch of foreign equipment arrives, our forces can no longer ignore the long-standing problem of mixed equipment and inconsistent specifications. If we continue to operate under our legacy structures and logistics networks, these advanced weapons will never reach their full combat potential. To match our new equipment, we must completely overhaul force organization, training regimens, and logistical support, phasing out incompatible older weapons to establish unified, modernized operational standards.\n\nProcurement is only the beginning. The real challenge lies in transforming the entire military."

 third_oil_crisis: "The Fourth Oil Crisis"

 third_oil_crisis_desc: "With Saudi Arabia embroiled in civil war, the world yet again faces another oil crisis. With the addition of the fall of Wall Street, this economic crisis has only compounded. We must urgently seek alternative sources of oil to alleviate this crisis."

 Unleashing_strategic_oil_reserves: "Release Strategic Oil Reserves"

 Unleashing_strategic_oil_reserves_desc: "Under the Petroleum Management Act, businesses are required to maintain a 60-day supply of petroleum. Combined with the government's 30-day reserve, we have a 90-day buffer before our stockpiles are depleted."

 South_China_Sea_oil_exploration: "Offshore Oil Prospecting"

 South_China_Sea_oil_exploration_desc: "The South China Sea sits atop an abundant amount of oil. We currently control Taiping Island and Zhongzhou Island, which allows us to extract oil from the region."

 Find_alternative_sources: "Search for Alternative Sources"

 Find_alternative_sources_desc: "Besides the oil-rich countries of Arabia, there are other options for oil: Venezuela, Russia, and the Mainland. Although we didn't need to consider these less-than-ideal alternatives in the past, we are now forced to choose a country to trade with."

 Technology_exchange_exchange_for_oil: "Technology-Oil Exchanges"

 Technology_exchange_exchange_for_oil_desc: "Using our technological prowess in the semiconductor industry, we can forge closer ties with major oil-producing nations."

 CHI_Operation_Desert: "§YOperation Desert§!"

 CHI_Operation_Desert_desc: ""

 Electricity_prices_freeze_and_rise: "Electric Price Ceilings"

 Electricity_prices_freeze_and_rise_desc: "The civil war in Saudi Arabia has sparked intense anxiety within the domestic energy market. Major manufacturers such as Formosa Plastics, China Steel, and TSMC are seeking an audience with us for energy security. On the other hand, energy concerns have started to spread amongst our civilian population. The government must immediately intervene to stabilize market prices, reassure the public, and prevent the oil crisis from escalating further."

 Accelerating_the_energy_transition: "Accelerate Energy Transition"

 Accelerating_the_energy_transition_desc: "Since 2016, Tsai Ing-wen's administration has aligned with global trends by launching an energy transition plan aimed at addressing long-standing issues such as air pollution, environmental concerns, and energy self-sufficiency. The plan included key targets for green energy, mandating that 20% of energy generation becomes renewable by 2025.\n\nHowever, the \"Fourth Oil Crisis\" triggered by the Saudi Arabian civil war has once again highlighted the critical importance of energy issues to the Taiwanese public. There is no time for infighting in the Legislature; instead, we must focus on our energy transition agenda to ensure Taiwan survives future crises." 

 Life_extension_of_nuclear_power_unit_three: "Maintain Maanshan's Reactor"

 Life_extension_of_nuclear_power_unit_three_desc: "When an increasingly industrialized Taiwan faced the impact of the first oil crisis in the 1970s, President Chiang Ching-kuo demonstrated visionary leadership by spearheading the \"Ten Major Construction Projects,\" which included investment in and the construction of nuclear power plants. The Third Nuclear Power Plant (NPP3), operational since 1984, has served Taiwan for nearly four decades.\n\nHowever, in the wake of the 2011 earthquake, President Tsai Ing-wen launched the \"Nuclear-Free Homeland\" program under pressure from environmentalists. This program aimed to completely eliminate nuclear power generation by 2025 in order to protect the public from the risks of nuclear energy. Yet, with the ongoing oil crisis, it is evident that Taiwan's energy security must be secured. Every unit of electricity is essential to ensure the continued functioning of the island's economy and to sustain the daily lives of its people"

 Expand_investment_green_energy_companies: "Green Energy Investments"

 Expand_investment_green_energy_companies_desc: "As fossil fuel supply tightens, green energy has taken center stage. Its virtually inexhaustible nature and independence from external control aligns with Taiwan’s strategic vision for our own energy supply. Through measures such as increased subsidies and streamlined environmental impact assessments, we can lay a solid foundation for Taiwan’s energy future."

 CHI_Restart_core_four: "Restart Lungmen Nuclear Power"

 CHI_Restart_core_four_desc: "The Lungmen Nuclear Power Plant's construction plans in Gongliao District, New Taipei City, Taiwan were originally stalled due to fierce local opposition. Although construction resumed after Chen Shui-bian's suspension of the project in 2000, the construction was still hampered by numerous obstacles.\n\nIn 2014, the then-Premier of the Executive Branch chose to mothball the plant to quell public pressure and prepared to ship thousands of fuel rods out of Taiwan.\n\nFortunately, the final batch of fuel rods slated for removal remains stored within the plant's reactors. With a few inspections and risk assessments, the plant can be started at minimal capacity, paving the way for a full restart of all reactors, albeit at the risk of provoking strong resentment among local residents."

 The_power_plant_on_full_fire: "Overloading Power Plants"

 The_power_plant_on_full_fire_desc: "Whether through restarting nuclear power or developing green energy, neither approach can rapidly and reliably stabilize the island's power supply in the short term. Both face stringent operational constraints or lack the resilience to handle sudden energy surges. With our energy generation pushed to the limit, immediate measures must be taken: recalling off-duty Taipower personnel, reactivating units undergoing maintenance, mandating priority handling of natural gas and coal shipments at ports, and implementing year-round shift schedules at power plants."

 Photovoltaic_panels_everywhere: "Solar Panels... Everywhere!"

 Photovoltaic_panels_everywhere_desc: "Solar power is undoubtedly the green energy solution best suited for Taiwan's development; the flexibility of its rapid deployment and the potency of sunlight are exactly what the island needs right now.\n\nSchool rooftops, abandoned farmland, and even the roofs of ordinary townhouses can all serve as power plants. With a little official outreach, combined with subsidies and tax breaks, we could truly \"grow\" electricity right out of the ground."

 island_of_energy_security: "An Island of Secure Energy"

 island_of_energy_security_desc: "Thanks to rapid reforms, our people and industries no longer have to worry about energy issues. Although our economic growth took a major hit during the crisis, everything is now back on track."

