 loc_taiwanese_OCTS_democracy:0 "One Country, Two Systems Democracy"
 CHI_market_socialism_desc:0 "\n\n\n\n\n\n\n£GFX_CHI_ideology_market_socialism\n\n\n\n\n\n\n\n\n\n\"Practicing two systems within one country\" might sound like a fantastical political experiment or a unique plan to weaken national sovereignty and governance, but in the cities on the reefs of East Asia, this peculiar political system has been in practice for nearly forty years. \"One Country, Two Systems\" was born when mainland China's economic strength and political influence were still relatively weak. It was a makeshift measure to balance the intense conflict between two systems—socialism and capitalism. The \"Special Administrative Regions\" established under this system, although sharing the same sovereignty as the main regime, still enjoy the freedom to establish their own government agencies and parliamentary institutions, with almost no restrictions on making and implementing policies. Perhaps its biggest difference from a traditional confederation is that the scale of a \"Special Administrative Region\" is usually limited to a single city or area, so small separatist trends have almost no impact on the stability of the union.\n\nToday, as the balance of power and political environment change, the internal logic embedded in \"One Country, Two Systems\" is gradually shifting. From past protection and isolation to the increasingly deepening multilateral exchanges today, \"One Country, Two Systems\" has become an important platform for promoting peaceful coexistence among people influenced by different ideologies, mutual exchange and integration of different political and economic systems, and ultimately fostering harmony in values."
