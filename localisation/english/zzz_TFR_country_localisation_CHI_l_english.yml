 CHI_thenationisinperil:0 "One Island, Two Wills"
 CHI_thenationisinperil_desc:0 "The shadow of tension that has long hung over the strait has finally become reality. Military actions from across the strait are no longer just threats and drills. Missiles, fighter jets, and fleets are now actively threatening our homeland. Cities have entered a state of alert as reserve mobilizations and combat deployments unfold simultaneously, rapidly shifting society from its daily rhythm to a wartime footing. This is no longer a matter of diplomacy and politics; it is a test of survival and willpower. In this time of national crisis, there is no room for division or hesitation.\n\nOnly unity and determination will allow us to hold the ground beneath our feet."
 CHI_Anticommunist_determination:0 "Anti-Communist Determination"
 CHI_Anticommunist_determination_desc:0 "For a long time, the two sides of the strait have maintained a fragile balance between opposition and exchange. But with the other side resorting to force and intimidation, this balance no longer exists. Facing military pressure and political ambitions from across the strait, we must clearly state our position to audiences at home and abroad: we will defend our current way of life and our institutions, and we will never waver under threat.\n\nWe will declare our determination to the world."
 CHI_Recall_conscripts:0 "Call of the Conscripts"
 CHI_Recall_conscripts_desc:0 "As the situation deteriorates rapidly, our standing forces lack the manpower to meet full combat readiness requirements. We will recall conscripts who have completed their service and returned to civilian life. Having already received complete basic military training, these reservists are the fastest way to replenish our combat power.\n\nThe government will activate an emergency recall mechanism to notify eligible reservists to return to their units for retraining and reorganization, allowing them to rapidly deploy to various defense assignments."
 CHI_National_Spiritual_Mobilization:0 "A New Spiritual Mobilization Movement"
 CHI_National_Spiritual_Mobilization_desc:0 "As the flames of war approach our homeland, military preparation alone is far from enough. What will truly carry the nation through this crisis is the will and action of its citizens. The government will utilize public advocacy, organization, and social mobilization to build a national consensus on defending the homeland, enabling civilian forces to play a key role in logistical support, civil defense, and information transmission. At this moment, every citizen is a part of the national line of defense."
 CHI_Temporary_formation_number:0 "Establish the All-Out Defense Mobilization Agency"
 CHI_Temporary_formation_number_desc:0 "The concept of all-out defense was recorded thousands of years ago in the *Guanzi*: 'When the ruler and the people are one, the state defends the state, and the people defend the people.' National defense is not the responsibility of a few, but requires the collective effort of the entire population.\n\nTo implement the policy of all-out mobilization, the Presidential Office has instructed the Ministry of National Defense to establish the All-Out Defense Mobilization Agency. Beyond driving reserve mobilization reform to achieve the three major goals of unifying reserve and mobilization systems, integrating standing and reserve forces, and ensuring cross-ministerial cooperation, its primary purpose is to demonstrate the government's determination to promote all-out national defense.\n\nFaced with new forms of warfare and non-traditional military threats brought by technological advancement, safeguarding national security is no longer just a task for the armed forces; it is a responsibility that the entire population must shoulder together. Only by establishing and putting the concept of all-out defense into practice can we build the strongest possible national defense and protect our homeland. We will show the world our determination to neither seek war nor fear it, along with our unwavering will to protect the nation."
 CHI_Strengthen_coastal_defense:0 "Reinforce the Coastline"
 CHI_Strengthen_coastal_defense_desc:0 "Facing threats from the sea, our long coastline is both a natural barrier and a potential vulnerability. Should the enemy attempt a seaborne breakthrough, we must immediately form a tight defensive line at our beachheads and harbor perimeters. The government will strengthen coastal monitoring, fortification construction, and troop deployments, integrating our land, sea, air, and civil defense resources to ensure any abnormal movements are rapidly detected and effectively countered. As long as the coastline remains firmly in our hands, we retain the key initiative in homeland defense."
 CHI_Not_step_back:0 "Persist For Our Freedom!"
 CHI_Not_step_back_desc:0 "Looking back, the National Revolutionary Army suffered consecutive defeats in the Chinese Civil War before finally retreating to Taiwan, preserving the last free territory of the Republic of China.\n\nToday, the shadow of history once again hangs over the strait. Military pressure from across the strait is no longer mere intimidation; it is actively closing in on our homeland. If we yield again, there will be nowhere left to fall back to.\n\n*We will retreat no further.*"
 CHI_Fight_to_the_death:0 "Fight Till the Last"
 CHI_Fight_to_the_death_desc:0 "Looking back, the Nationalist Government buried hundreds of thousands of its finest troops in the North China Plain following the Three Major Campaigns, their blood watering a thousand miles of fertile land. Chiang Kai-shek was forced to retreat to Taiwan with the remnants of his shattered army, hoping to one day launch a successful counteroffensive and reclaim the Begonia.\n\nBattered by the times, the Republic of China gradually accepted reality, turning its focus to cultivating a land it had once viewed as a remote frontier. As the bonds between the Republic of China, the Kuomintang, and the Taiwanese people deepened, the nation rediscovered its mission on this tiny island. Faced with the tidal wave of the People's Liberation Army all those years ago, it had abandoned its sons and daughters to flee in panic to Taiwan.\n\nNow, we have nowhere left to retreat. But the Republic of China is long past being the beaten dog it was back then, beset by internal and external crises. Even facing a Goliath like the Chinese Communist Party, tiny David will not hesitate to raise his sling and hurl stone after stone...\n\n**...until he falls.**"
 CHI_Requesting_material_assistance_from_allies:0 "Request Allied Material Aid"
 CHI_Requesting_material_assistance_from_allies_desc:0 "The moment the dictatorial Chinese Communist Party declared war upon us, the PRC's nature as an aggressor was laid bare before the international community. But the Republic of China is different. We are a nation of freedom and democracy, and ours is a righteous war to defend our homeland. As the world recognizes the true face of the communist regime, the Chinese government will face unprecedented sanctions. Meanwhile, our friends in Japan and Europe will extend a helping hand. They know exactly what it would mean for a free world, a world now without America, if China were allowed to breach the First Island Chain. Therefore, we will call upon our allies for aid.\n\nA just cause finds many allies; an unjust cause finds few."
 CHI_Remove_old_equipment:0 "Break Out Old Stockpiles"
 CHI_Remove_old_equipment_desc:0 "Even if not judged by international standards, Taiwan's military equipment can hardly be considered good. Volunteer personnel constantly complain about their active-duty weapons: time-consuming maintenance, mismatched equipment logs, and even helmet liners going unwashed for years are the norm. Let alone the weapons and ammunition piled up in warehouses.\n\nBut our forces have no choice now. Current stockpiles can only guarantee a sufficient supply of T91 rifles and Kestrel rockets for our volunteer troops. The remaining second-line units have to step onto the frontlines armed with heavy T65 rifles and Type 66 rockets. While these armaments may struggle to penetrate communist armored units head-on, with proper tactical coordination, they can still pose a significant threat to ZBL-09s storming our beachheads."
 CHI_Strategic_Traffic_Control_Center:0 "Strategic Traffic Control Center"
 CHI_Strategic_Traffic_Control_Center_desc:0 "The rekindled flames of war now rise over the Taiwan Strait, making the prospect of a normal life impossible in the short term. Our people must bid farewell to seventy years of peace and accept the reality of an unknown life in wartime. For the sake of military deployments and public safety, we will establish traffic control centers to restrict civilian transit. Though an infringement on personal liberty, such temporary wartime measures are necessary when faced with the prospect of communist rule should they emerge victorious.\n\nBetween a temporary loss of freedom and a permanent one, we all know which to choose."
 CHI_Coordinating_Allied_Bombing_Operations:0 "Coordinate Allied Bombing Campaigns"
 CHI_Coordinating_Allied_Bombing_Operations_desc:0 "Our calls for aid have been answered. The allies of the Republic of China stand with us, fighting together for the free world against the red devils of the Chinese Communist Party. The joint air forces of Australia and Japan have already deployed bombers targeting communist naval and ground units, and the Republic of China Air Force will assist them in striking down the arrogance of the enemy forces. Though it will be extremely difficult for our air force to contest air superiority against the People's Liberation Army, our allies have promised to aid our aerial operations. With the support of their powerful air wings, our air force will have the capability to fight the communist air force toe-to-toe.\n\nShouldering the fate of the nation, forever defending the endless skies."
 CHI_Defend_Taiwan:0 "Fortress: Taiwan"
 CHI_Defend_Taiwan_desc:0 "What we are defending is a small but mountainous island. It is not large, yet it carries the lives, memories, and the right to choose the future for twenty-three million people.\n\nFacing military threats from across the strait, this is no longer just a dispute over regimes or historical entanglements; it is a fundamental challenge to our very way of life. Taiwan may have limited resources and a small landmass, but precisely because of this, we understand the cost of losing it all the more clearly.\n\nThe government will fully integrate national defense, civil defense, and social resilience, turning every city, every mountain range, and every community on this island into a line of defense for freedom.\n\n**We are not fighting for politicians; we are fighting to hold onto the land we call home.**"
 CHI_Taiwan_the_Bravest:0 "Taiwan the Bravest"
 CHI_Taiwan_the_Bravest_desc:0 "As the threat approaches, we see not panic, but the courage and resilience this island has built up over time. From cities to rural towns, from the youth to the elderly, people across society are spontaneously volunteering for support and preparation efforts, displaying an astounding level of unity.\n\nThis strength comes not from empty slogans, but from a deep love for our homeland, a cherishing of freedom, and a profound trust in one another. Even under the pressures of war, the people are proving through action that Taiwanese can rely on each other and share this burden together.\n\nLet them witness the unity and fighting spirit of the Taiwanese people."
 CHI_Mobilize_police_force_to_maintain_order:0 "Mobilize The Police Force"
 CHI_Mobilize_police_force_to_maintain_order_desc:0 "In peacetime, the heavy responsibility of internal security falls to the Taiwanese police. From patrol officers to rapid response units, layers of specialized departments form the cornerstone of Taiwan's public safety. Legislators have often jokingly referred to the police as the 'Second Army,' but this is a misconception. Even in wartime, maintaining social order still relies on police support. Beyond simply arresting criminals, the police can also prevent communist forces from striking at our social order and military morale."
 CHI_Wartime_normal_system:0 "Wartime Normalcy"
 CHI_Wartime_normal_system_desc:0 "Taipei City Councilor Miao Poya once explained the nature of contemporary warfare: not everywhere is the frontline. Even if Kinmen and Matsu were invaded by the People's Liberation Army, people on the main island of Taiwan could still go about their daily lives. Historically, during the Eight-Year War of Resistance or the Chinese Civil War, teachers and students in the rear still attended school normally. If this was true for wars fifty years ago, it goes without saying for modern warfare.\n\nWhen the 'torrential flood' truly arrives, residents on the main island will not be heavily impacted. Work, school, and public services will continue to operate normally. The state will only take action if frontline troops fall short or if communist forces launch bombing raids. Therefore, the government urges the public not to panic. The nation will not enter a state of emergency or declare martial law at this time, nor will it actively provoke cross-strait military conflicts.\n\nHowever, a few critics have raised objections. They point out that China historically had a vast territory, meaning the frontlines were extremely far from the cities and schools that continued normal operations. With the growing range and precision of communist weaponry, almost all of Taiwan now falls within the strike range of their coastal bases. Where, then, is the 'rear'?"
 CHI_Martial_law_declared:0 "Declare Martial Law"
 CHI_Martial_law_declared_desc:0 "For many Taiwanese, the words 'martial law' carry heavy historical memories and deep-seated unease. The shadow of that era makes society exceptionally sensitive to any form of power centralization.\n\nHowever, with the flames of war approaching and our communications and transportation facing threats, maintaining social order and the operation of critical infrastructure has become an urgent priority. The government is forced to make a difficult trade-off between security and freedom, initiating temporary emergency control measures to ensure that our overall defense system can operate effectively.\n\nWe are not turning back the clock; rather, this is an extraordinary decision made in extraordinary times to protect this island. Once the crisis has passed, authority will return to normal."
 CHI_Arresting_traitors:0 "Hunt Down Collaborators"
 CHI_Arresting_traitors_desc:0 "As war approaches, threats come not only from beyond our borders; they may also lurk within them. Intelligence indicates that certain factions are secretly coordinating with the enemy, attempting to weaken our resistance from within by spreading rumors, gathering intelligence, and undermining public morale.\n\nThese individuals are known as the Fifth Column.\n\nThey may not wear the enemy's uniform, yet at critical moments, they can be more destructive than a frontal assault. The government has decided to launch a comprehensive anti-infiltration operation. By integrating our intelligence, policing, and security systems, we will prioritize investigating suspected collaboration networks and severing their ties with external forces. However, we must acknowledge that this is a dangerous path. Excessive suspicion could tear society apart, and false accusations could leave irreparable scars. Between security and freedom, the nation is forced to make a trade-off.\n\nBut if we collapse from within, even the strongest defensive line will be rendered meaningless."
 CHI_Inciting_democracyactivists_withinChina:0 "Inciting Democracy Activists Within China"
 CHI_Inciting_democracyactivists_withinChina_desc:0 "臺海戰火陰影下，戰場並不只存在於海峽與空域。真正撼動中共體制根基的，往往是長久被壓抑卻從未消失的聲音。"
 CHI_Frogmen_infiltrate_Fujian:0 "Frogmen Infiltrate Fujian"
 CHI_Frogmen_infiltrate_Fujian_desc:0 ""
 CHI_Protect_the_homeland:0 "Defend Our Home"
 CHI_Protect_the_homeland_desc:0 "Since democratizing in 1996, the democratic system has facilitated countless peaceful transitions of power on this island, but the shadow from across the strait has only deepened. With external pressure mounting, this war is no longer just a military conflict; it is a comprehensive test of Taiwan's decades of development.\n\nFrom transitioning out of an authoritarian regime into a democracy, from shifting an OEM economy into the core of the global supply chain, to carving out a space for survival amidst international isolation, every step Taiwan has taken has been arduous and deliberate. The oppression of the martial law era, the blood and tears of the democratization movement, the growing pains of economic transformation, and the struggle for diplomatic space have all become the shared memory of our society today.\n\nThis island exists not because it is powerful, but because it is free.\n\nWe possess the right to vote, the right to free speech, the right to a diverse society, and the right to choose our way of life.\n\n'Defending our homeland' is not merely a military slogan; it is the manifestation of the public's will.\n\nFactories maintaining operations, ports keeping order, the medical system stabilizing the rear, and the public uniting to help one another. Every post is a part of the defensive line.\n\nAs artillery fire approaches, the Taiwanese people will answer with their history and their will:\n\nWe may have limited resources and a small territory, but we possess the right to choose our own future."
 CHI_Onelifeonthesameisland:0 "§3One §GIsland, §WOne §RDetermination§!§!§!§!"
 CHI_Onelifeonthesameisland_desc:0 "We have done it. The Republic of China has survived the hardest moments of this war. When military experts around the world believed we could not hold out for three months, the stubborn resistance of our soldiers on the frontlines proved the bravery and fearlessness of the Republic of China. Now, the Chinese Communist Party's blitzkrieg plan to rapidly annihilate Taiwan has utterly failed. As the People's Liberation Army's offensive gradually stalls, the sanctions suffered by the Chinese government will only mount. When public resentment boils over across the mainland, that will be our moment to celebrate victory!\n\nMay our Blue Sky, White Sun, and a Wholly Red Earth fly forever in the clear skies!\n\nMay our Blue Sky, White Sun, and a Wholly Red Earth shine brilliantly forever!"
 CHI_CivilWarContinues:0 "Brother Against Brother"
