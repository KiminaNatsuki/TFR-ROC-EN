 ROC.55.a: "Ferdinand Marcos Jr."
 ROC.55.b: "Leni Robredo"
 ROC.55.c: "Manny Pacquiao"
 ROC.77.t: "Black Hawk Down Over Wulai"
 ROC.77.d: "On the morning of January 2, 2020, a Republic of China Air Force UH-60M Black Hawk helicopter departed Zhitan Camp in Xindian District, New Taipei City. The aircraft was carrying out a routine pre-Lunar New Year morale visit and was scheduled to fly to the Dong'ao Ridge Radar Station in Yilan, where senior officers were to inspect operations and offer their encouragement to personnel stationed there. Thirteen people were aboard, including then-Chief of the General Staff General Shen Yi-ming, several other senior military officers, and accompanying personnel.\n\nWhile crossing the mountainous terrain of Wulai District in New Taipei City, the helicopter encountered poor weather, dense cloud cover, and severely reduced visibility before disappearing from radar. The Ministry of National Defense immediately activated emergency search-and-rescue procedures, dispatching both aerial and ground teams into the mountains. After several hours of searching, rescue personnel located the wreckage near the upper reaches of the Tonghou Stream in Wulai.\n\nFive survivors were recovered and transported to hospital for treatment with the assistance of rescue personnel. The subsequent investigation concluded that the crash was associated with the severe mountain weather, dense cloud cover, limited visibility, and decisions made during the flight rather than any mechanical failure of the aircraft. In the aftermath, the ROC Armed Forces conducted a comprehensive review of aviation safety procedures and the risks involved in allowing multiple senior officers to travel aboard the same aircraft, introducing tighter regulations intended to prevent such a concentration of command from ever being placed at risk again."
 ROC.77.a: "Our Deepest Condolences."
 ROC_77_tt: "§YThe accident claimed the lives of eight personnel, while five survived. Those killed were:§!\n\nChief of the General Staff, General §YShen Yi-ming§!\nDeputy Director of the Political Warfare Bureau, Major General §YYu Chin-wen§!\nAssistant Deputy Chief of the General Staff for Intelligence, Major General §YHung Hung-chun§!\nDivision Director, Office of the Deputy Chief of the General Staff for Operations and Planning, Major General §YLiu Chen-fu§!\nStaff Officer, Office of the Chief of the General Staff, Lieutenant Colonel §YHuang Sheng-hang§!\nStaff Officer, Air Force Operations and Planning Office, Lieutenant Colonel §YHan Cheng-hung§!\nAircrew Member, Staff Sergeant §YHsu Hung-pin§!\nAircrew Member, Master Sergeant §YChang Chih-kuang§!"
 ROC.78.t: "China Halts Taiwanese Pineapple Imports”"
 ROC.78.d: "On February 26, 2021, the General Administration of Customs of the People’s Republic of China announced that imports of Taiwanese pineapples would be suspended beginning March 1, citing repeated detections of harmful pests such as scale insects. Because China had long served as the largest overseas market for Taiwanese pineapples, the decision immediately threatened the island’s pineapple industry and the livelihoods of thousands of farmers. What might otherwise have remained a technical dispute over agricultural inspections quickly escalated into a broader political and economic confrontation across the Taiwan Strait.\n\nThe Taiwanese government responded almost immediately, tightening quarantine and quality-control measures while helping producers redirect exports toward alternative markets. Domestic promotional campaigns and government-backed purchasing and processing programs were launched to absorb excess supply. At the same time, private companies, e-commerce platforms, restaurants, local businesses, and municipal governments joined the effort. Across social media, a wave of calls to “Support Taiwanese Pineapples” swept the island. Citizens bought fruit directly from farmers, restaurants devised new pineapple dishes, processed products flooded store shelves, and increasingly elaborate marketing campaigns turned what had begun as an export crisis into a nationwide display of solidarity.\n\nOfficials subsequently announced plans to further diversify Taiwan’s pineapple exports toward markets including Japan, Hong Kong, Singapore, and the Middle East. Yet beneath the cheerful slogans and overflowing boxes of fruit lay a harder lesson. Taiwan’s dependence on a single export market had once again revealed itself as a strategic vulnerability, and the question of how deeply the island’s economy should remain tied to the mainland returned to the center of public debate."
 ROC.78.a: "Their loss!"
 ROC.79.t: "Tragedy on the Taroko Express"
 ROC.79.d: "At 9:28 a.m. on April 2, 2021, a TEMU1000 series train carrying 498 passengers and crew approached the northern entrance of the Qingshui Tunnel on Taiwan Railways’ North-Link Line in Xiulin Township, Hualien County. Moments before entering the tunnel, the train struck a construction vehicle that had slid down the adjacent slope and fallen onto the tracks. The impact derailed the train, but its momentum carried it forward into the tunnel, where several carriages slammed into the tunnel walls and sustained catastrophic damage. The accident left 49 people dead and 309 others injured.\n\nEmergency services and government agencies began rescue and recovery operations almost immediately. Yet the confined interior of the long, narrow tunnel, combined with debris from the derailment and the unstable slope outside, made access extraordinarily difficult. Rescue personnel were forced to work through wreckage in cramped conditions as survivors were extracted and transported for treatment. What had begun as an ordinary journey along Taiwan’s eastern coast became one of the darkest railway disasters in the island’s modern history."
 ROC.79.a: "Find the cause, and never let this happen again."
 ROC.80.t: "7.2 Magnitude Earthquake hits Hualien"
 ROC.80.d: "At 7:58 a.m. on April 3, 2024, a powerful magnitude 7.2 earthquake struck off the eastern coast of Taiwan near Hualien County. With its hypocenter lying roughly twenty kilometers beneath the surface, the tremor violently shook much of the island and became one of the most severe natural disasters to strike eastern Taiwan in recent years. Hualien bore the brunt of the destruction, though the shock was felt far beyond the county as buildings swayed and emergency alarms sounded across Taiwan.\n\nIn the minutes that followed, buildings collapsed or were left dangerously tilted, roads split apart, and bridges and mountain highways suffered extensive damage. Massive rockfalls and landslides thundered down the steep valleys of eastern Taiwan, severing transportation routes and trapping residents and travelers in isolated areas. Power and water services were disrupted, homes and public facilities sustained serious damage, and emergency evacuations began throughout the affected region. Early reports confirmed multiple fatalities and hundreds of injuries, while rescue teams rushed toward Hualien as aftershocks continued to shake the earth beneath them. For those caught among the mountains, the disaster was not yet over."
 ROC.80.a: "Offer Our Condolences to the Bereaved Families."
 ROC.81.t: "Typhoon Danas Makes Landfall in Chiayi"
 ROC.81.d: "On July 6, 2025, Typhoon Danas swept northward through the Taiwan Strait before making landfall at Budai Township in Chiayi County late that night. Torrential rain and violent winds battered central and southern Taiwan as the storm approached, with mountainous areas receiving several hundred millimeters of rainfall and low-lying communities facing an escalating threat of flooding. When Danas finally came ashore, Chiayi, Tainan, Yunlin, and surrounding areas were struck by severe wind damage, inundation, fallen trees, and widespread disruption to transportation and utilities. Roads were blocked, homes and agricultural facilities were damaged, and hundreds of thousands of households lost power as emergency crews struggled to keep pace with the destruction. By the time the storm had passed, two people had been killed and hundreds more injured.\n\nEven after the eye of the storm moved away, the mountains continued to bear its scars. Days of heavy rainfall destabilized already fragile slopes, triggering landslides and rockfalls across several regions. On July 8, a massive collapse along the upper Qingshui River near Caoling in Yunlin blocked the river and formed a large natural barrier lake. With tens of millions of cubic meters of water accumulating behind an unstable wall of earth and debris, authorities placed downstream communities under heightened alert as the possibility of overtopping or collapse threatened to unleash another disaster long after the typhoon itself had departed.\n\nCentral and local authorities mobilized emergency services, engineering units, firefighters, and disaster-response personnel to restore roads, repair damaged utilities, monitor unstable slopes, and protect communities threatened by flooding and landslides. Excavators and heavy equipment were dispatched into affected areas while temporary routes were opened to reconnect isolated settlements. Danas had crossed Taiwan in little more than a night, but in its wake remained flooded streets, shattered roofs, ruined fields, and a landscape that would take far longer to mend."
 ROC.81.a: "Dispatch search and rescue!"
 ROC.82.t: "The Qingming Festival"
 ROC.82.d: "The April rain fell in fine, scattered threads, gathering among the lush green into a veil of pale mist.\n\nOld Xia had known this rain well in his youth. Back then, if he looked closely through the gaps between the swaying willow branches, he could still see countless slender silver needles passing through them, stitching themselves into the deep green earth below. His eyes could no longer make them out so clearly now. Old Xia stepped through the soft spring mud as those delicate strands of rain slipped between the shadow-playing willow branches and through his body as well, as though sewing him gently to the earth, leaving a faint tingling upon his skin. He carried no umbrella. Rain like this had never required one, just as none had been needed during those unrestrained days of his youth in that distant land beneath the white clouds.\n\nToday was the Qingming Festival, and he was on his way to visit several old friends he had not seen in many years. Small hills rose and fell before him, while narrow paths twisted endlessly between them. Once, he would have crossed such country with a light whip and a swift horse; looking back, the faint traces in the grass could scarcely cover the marks he left behind, while only the sound of his carefree laughter remained, ringing out in every direction. Now he walked one step at a time, planting each foot firmly into the same yielding earth. Compared with those distant years, his steps had grown steadier, and he had come to understand more deeply just how solid this land truly was. Solid enough, somehow, to bear the weight of a withered body, and of an old heart slowly sinking beneath the years."
 ROC.82.a: "The world remains, yet those who were are gone; all things have come to rest."
 ROC.83.t: "Along the Hill, We Climb"
 ROC.83.d: "Through the haze, a few dark green specks appeared in the distance. Slowly they gathered into patches, then rose into slender columns. They were willow trees, standing far off at the edge of Old Xia’s blurred sight, their long branches brushing gently through the air, luxuriant beneath the spring breeze. Beneath them lay still more shapes: uneven earthen mounds, one after another, like great measures overturned upon the ground, each with a stone marker standing before it, its face mottled with traces of moss.\n\nOld Xia quickened his pace. The hillside was gentle, and he made his way down without difficulty; with every step, the willows scattered across the fields seemed to draw a little closer together. He had brought wine, and a parcel of braised beef. When he was a boy working as a tenant farmer, such food had belonged only to the landlord’s table. He remembered watching the man’s mouth open and close as half a plate of braised beef disappeared before his eyes, followed soon afterward by the sour reek of liquor and waves of hearty laughter. Once, when the landlord happened to be in good spirits, he tossed the boy a few slices of meat. Only years later did Old Xia learn that what he had eaten that day had not been braised beef at all. Yet for all the years that followed, those few precious slices remained braised beef in his memory.\n\nHe stood among the silent graves beneath the rain. From the damp earth beneath his feet seemed to rise some ancient, swelling vitality, coursing upward through his withered body until it reached the crown of his head. He had almost forgotten this feeling. It was the feeling of youth, of spring, of a world that had once seemed without end. Something warm traced a path down his cheek.\n\nOld Xia missed home."
 ROC.83.a: "After a long while."
 ROC.84.t: "Ere I can speak, the tears begin to fall."
 ROC.84.d: "With trembling hands, Old Xia reached into his pocket and drew out several small cups of spotless white porcelain. He placed them before him, close against the little earthen mounds. For a moment they seemed to form a transparent wall: beyond it stood Old Xia, alone; within it lay the silence of all the others. Then they seemed instead like a road, stretching out from the deepest reaches of his memory and disappearing into those quiet graves, crossing the earth before his feet. He poured the wine slowly, but his hands were steady. His thoughts returned to his years in the army, to those common soldiers upon whom the lot for the forlorn hope had fallen. Some had met it with swaggering bravado; others had trembled so badly they could scarcely hold their bowls. Yet once the wine had been drained, every one of them would roar that they were ready to stake their lives against the enemy, as though death itself were a small thing before a bowl of liquor.\n\nOld Xia raised one cup and drank it down. First came the sting, then the burning heat, then the sharp fumes rushing into his nose. He forced himself to swallow, his eyes watering from the effort. He had never been a drinking man, and even now he could not understand what strange power men found in the stuff. Still, he followed the grey-clad figures preserved in his memory, cup after cup, just as they once had. He drank until the world before him began to wheel and shimmer, until his skull felt heavy and swollen and thought itself seemed to drift loose inside it. Only then did he stop.\n\nHe gathered up the cups that remained full and rose unsteadily to his feet. One by one, he poured them into the earth beside the little mounds. Fine threads of rain fell into the porcelain, stirring faint circles across the surface of the wine before each cup was emptied. When it was done, Old Xia sank to his knees. He bowed his head to the earth again and again, striking it heavily with his brow. His voice trembled, and from his lips came only a few broken sounds, barely words at all:"
 ROC.84.a: "“Brothers... forgive me... I never managed to return to the mainland for you... never managed to bring you home...”"
 ROC.85.t: "Joy in Reunion"
 ROC.85.d: "“...You came?”\n\n“...I came.”\n\nThe pale walls of the hospital room closed in around a gaze that no longer had the strength to wander far. Even the sounds from beyond the room seemed blurred by those walls, broken into indistinct fragments until almost nothing remained.\n\nIt was terribly quiet.\n\nOld Xia pulled out the stool beside the bed and sat down. He moved so gently that only the faintest current of air followed him, stirring the hem of his clothes. Somewhere in the silence, he could hear a heartbeat and the weight of labored breathing, though he could no longer tell whether they belonged to him or to the man lying before him. Old Xia lifted his eyes and met the other man’s gaze, only to find those eyes narrowed almost to slits. He remembered them differently.\n\n“...What happened to your eyes?”\n\n“I can’t see your face clearly anymore. I’m old now.”\n\nThe man’s voice was heavy, as though something had lodged deep within his throat. Even the effort of forming each word seemed to set his teeth faintly trembling. Old Xia reached out and took the hand resting upon the white blanket. It was cold and coarse, its broad surface marked by calluses large and small, scattered across the skin like the remnants of a lifetime’s labor. The hand was so thick and solid that Old Xia needed both of his own to hold it tightly.\n\nSomething caught in Old Xia’s throat. A sudden warmth gathered behind his eyes, but he forced it back, allowing the tears to leave their wounds only somewhere within his heart.\n\n“Tell me, how does a man go from being perfectly fine to this just like that? You were still full of spirit when I left Taipei a few days ago. How did one trip back to Yilan leave you looking like this...?”\n\n"
 ROC.85.a: "For ten years, life and death have lain vast between us..."
 ROC.86.t: "... I try not to think of you."
 ROC.86.d: "His voice began to tremble. Old Zhang brought his other hand over and laid it atop Old Xia’s, then slowly shook his head, as though refusing to accept the grief he saw in his old friend.\n\n“That’s simply what happens when a man grows old. The flesh weakens, the bones grow brittle. You can spend your whole life being careful, but sooner or later, everyone meets a day like this. For some it comes late, for others early. It’s a small thing.”\n\n“I’ve lived long enough. Wars, battles, skirmishes, I’ve fought hundreds, large and small. Men, I’ve killed more than my share. Death? I’m not afraid of death. Every man must die someday...”\n\nOld Zhang turned his eyes away. He could no longer bring himself to look at Old Xia.\n\n“It’s only that... I won’t die at home. I won’t die on the mainland. I never got to see my mother one last time. Never had the chance to fulfill my duty as a son to her, or to my old father. That... that is the greatest regret of my life...”\n\nOld Zhang’s voice gradually weakened until a faint sob crept into it. Slowly, he turned back toward Old Xia. His eyelids fluttered, his clouded eyes shifting unsteadily as though trying to take in every last detail of the old friend before him.\n\n“...It’ll only be a matter of days now... Old Xia, I’m afraid I’m never going back...”\n\nHis voice shook. His hand tightened over Old Xia’s, deep furrows gathering across his brow as every breath grew heavier than the last.\n\n“But I don’t want to be buried here. I don’t want to be buried in Taiwan. Old Xia... this isn’t my home. When I’m gone, I’m begging you, take my ashes home for me. Bury me there. Don’t put up a gravestone. I would be too ashamed to face the generations that come after us...”"
 ROC.86.a: "“How could I ever face the spirits of my parents in Heaven...”"
 ROC.87.t: "Yet I cannot forget."
 ROC.87.d: "The corners of Old Zhang’s eyes tightened, his mouth sagging downward as a broken sob escaped him. He wept like a withered tree alone in the desert, beaten helplessly by a sudden, merciless gale.\n\n“Old Xia... I’m begging you... your brother has only this one wish left...”\n\nOld Xia bit down hard on his lip until the faint metallic taste of blood touched his tongue. He nodded heavily and tightened his grip around Old Zhang’s hand. His throat constricted. The words had already risen to his lips, yet none of them would come. All he could do was sit there in silence and look at his old friend.\n\n“That’s good... that’s good...”\n\nOld Zhang slowly loosened his hand. A contented smile spread across his face as he began murmuring something beneath his breath. His voice grew softer and softer. Old Xia could no longer make out the words, so he could only hold that cold hand tightly in his own. After a while, the hospital room gradually fell silent again, until it was no different from when he had first entered.\n\nHe heard a heartbeat.\n\nHe knew now that it could only be his own."
 ROC.87.a: "Old Zhang has breathed his last."
 CHI.TW.5.t: "Political Ban"
 CHI.TW.5.d: "As the fires of war spread across the island, Taiwan entered a state of full mobilization almost overnight. With the threat of missile strikes rising alongside the prospect of enemy landings, the government turned its attention toward another front, one without trenches or coastlines: the struggle to preserve internal political stability and prevent the war from being fought from within.\n\nLong before the first missiles fell, intelligence agencies had warned that extremist political organizations could become dangerously radicalized under wartime conditions, transforming into potential channels for infiltration, agitation, and sabotage. Fascist groups preaching ultranationalism and authoritarian rule, as well as communist organizations maintaining ideological sympathies with the regime across the Strait, were both regarded as potential threats to wartime unity and national security. In a nation already fighting for its survival, even a small fracture within could become an opening for the enemy.\n\nEffective immediately, all political parties and organizations identified as fascist or communist in character are to be temporarily prohibited from conducting political activities for the duration of the national emergency."
 CHI.TW.5.a: "...Purge the Traitors"
 CHI.11.t: "Taiwan Records Its First Population Decline"
 CHI.11.d: "With the final figures now confirmed by the Department of Household Registration, Taiwan’s demographic statistics for 2020 have revealed a grim reality: for the first time in its history, the island has entered an era of negative population growth. Only 165,000 children were born over the course of the year, the lowest figure ever recorded, while some 173,000 people died. The resulting demographic crossover, grimly described by the media as a year in which “more died than were born,” combined with reduced migration as COVID-19 border restrictions brought international movement to a standstill, has pushed Taiwan’s total population into decline for the first time.\n\nBehind these figures lies something far more troubling than a single year of statistical change. A collapsing birth rate and a rapidly aging society are converging into a demographic storm over the island. Fewer children today will mean fewer workers tomorrow, fewer taxpayers to sustain an aging population, and fewer young men and women available to fill the ranks of the armed forces. Factories that once powered Taiwan’s economic miracle may find themselves starved of labor, while the military charged with defending the island may struggle simply to find enough soldiers to stand watch.\n\nThis is no longer merely a question of population statistics. It is a slow-moving crisis capable of eroding the foundations of national power itself. The government must act before decline becomes self-perpetuating, for once a generation disappears, no decree can summon it back."
 CHI.11.a: "This is a national security crisis we must confront..."
 CHI.3.t: "Elegy for the Pacific"
 CHI.3.d: "The great power that had long upheld the order of the Pacific has now fallen into civil war and division of its own. American ports are blockaded, armies are on the move, and political authority fractures by the day. Maritime routes and commercial networks once taken for granted have suddenly been left without their anchor. Though the fighting rages far across the ocean, its consequences have already reached our shores, shaking the international order upon which our survival has long depended. Financial markets convulse, exports and supply chains are severed, and an unprecedented vacuum opens across the regional security architecture. The Pacific is no longer the sea of peace and prosperity we once knew. It has become a wellspring of instability, uncertainty, and fear.\n\nThe old order lies in ashes. Beyond the horizon, the pillars that once held up our world are burning, and here we remain, an island alone before the coming storm."
 CHI.3.a: "The Old Order, Burnt to Ashes."
 CHI.7.t: "Late night at the Presidential Office"
 CHI.7.d: "[ Report on the Complete Collapse of Order in the United States ]\n\n[ Report on Armed Anti-Government Unrest Across the American Mainland ]\n\n[ Report on Abnormal Movements by the People’s Liberation Army ]\n\nOne report after another was laid upon the President’s desk, until the world before Tsai Ing-wen seemed to collapse beneath the weight of the paper itself. America in chaos. Armed rebellion spreading across the mainland. The People’s Liberation Army moving in ways it should not. For a moment, she could only stare at the pages before her.\n\n“This can’t be possible... America has simply fallen apart?”\n\nBut the truth was already as plain as the fires rising across the American continent. Taiwan had lost the protection upon which it had relied for generations, and from this day forward, it would have to walk its path alone. The economic catastrophe unleashed by America’s collapse suddenly seemed almost secondary beside the greater danger gathering across the Strait. Report after report of abnormal PLA activity pointed toward the same conclusion: after seventy years of uneasy peace, missiles and warplanes would soon cross these skies once more. For a brief moment, panic gripped her. Then Tsai rose from her chair and carefully adjusted her glasses. Whatever world had existed yesterday was gone. Taiwan now stood before an age more dangerous than any it had known in decades, and she understood that the island would need her leadership now more than ever."
 CHI.7.a: "Taiwan Must Stand on Its Own."
 CHI.8.t: "President Han's Televised Address"
 CHI.8.d: "The turmoil in the foreign exchange markets could no longer be concealed. Interbank clearing had slowed almost to a standstill, the value of dollar-denominated assets was collapsing by the hour, and businesses and ordinary citizens alike had retreated into uncertainty, unwilling to spend, invest, or even guess what tomorrow might bring. A civil war raging across the Pacific was now striking directly at the arteries of Taiwan’s economy with unprecedented speed.\n\nFollowing an emergency meeting between senior national security and economic officials, the Presidential Office announced that President Han Kuo-yu would personally address the nation in a televised broadcast. When the self-proclaimed “President of the Common People” appeared before the cameras, his expression was grave, yet his voice remained remarkably steady.\n\n“Fellow citizens, this is not an ordinary economic fluctuation. What we are witnessing is a transformation of the global order itself. The foreign reserves in our hands, the markets upon which we depend, and the world we have grown accustomed to are all disappearing before our eyes.”\n\n“But I ask every one of you to remain calm. The government has already activated emergency measures to preserve the stability of our financial system and ensure that essential supplies continue to reach every household. This will be a severe test for Taiwan, but it may also be the moment when we finally learn to stand firmly upon our own feet. The world around us may be changing, but we will not allow Taiwan to be swept away with it.”"
 CHI.8.a: "\"We will weather this storm.\""
 CHI.9.t: "The Victims and the Perpetrators"
 CHI.9.d: "Today marks the annual ceremony for the annulment of wrongful convictions. Each year, the Transitional Justice Commission holds ceremonies and press conferences of this kind, both to remind the nation of what was done in its past and, inevitably, to tear open wounds that some of the victims have spent a lifetime trying to close.\n\nLan Guoben entered the venue with the support of a volunteer and slowly lowered himself into his seat, his deeply wrinkled hands folded together before him. His father had done little more than voice a few complaints before the Kuomintang government arrested and imprisoned him. For days he was tortured without being released. Guoben's mother contacted every relative and friend from whom she might borrow money, desperately trying to gather enough to bribe the police, but no matter whom she begged, the sum was never enough. In the end, with his father still in custody, Guoben was forced to accept the government's offer: become an informant and keep watch over those students at school who had a habit of \"saying the wrong things.\"\n\nAnd so he followed his friends into one underground reading room after another, quietly leading the authorities toward student after student, young men and women once brimming with life who would disappear one by one. The tables in those hidden rooms were crowded with thick volumes bound in glaring red: Capital, The Communist Manifesto, The State and Revolution... They said such books were written in the blood of the working class and its struggle. To Guoben, however, their pages had come to be bound with something far more intimate: the blood and lives of his own classmates.\n\nPresident Tsai Ing-wen read the names of those whose convictions were being annulled, one after another. Guoben listened in silence. It was only after the lifting of martial law that he had learned the truth: his father had already been beaten to death on the very night Guoben had gone to plead for him. Everything he had done afterward, every friend he had watched, every name he had passed along, had saved no one. He had only helped the men who killed his father destroy still more lives. Even now, Guoben sometimes heard them in his dreams, those young voices, distant yet still painfully clear. Why did you report us? Why did you send us to die?\n\nBut Lan Guoben had no answer. His throat tightened, and he remained silently seated upon the cold iron chair beneath him, its chill seeming to burn through what remained of his soul. The ceremony ended. The officials departed. The families drifted away. Only after the hall had nearly emptied did Guoben finally rise, trembling as he leaned upon the volunteer beside him, and slowly make his way toward the exit."
 CHI.9.a: "This is no pardon for my father’s crimes, but yet another reckoning."
 CHI.99.t: "Operation Desert"
 CHI.99.d: "On the Arabian Peninsula under the scorching sun, there is nothing but yellow dust filling the sky and shimmering heat rising from the ground. An airfield built here stands out conspicuously, with no towering mountains nearby to restrict an attacker's route, nor any densely packed urban areas to construct solid defensive lines.\n\nHowever, for the National Revolutionary Army arriving belatedly to assist their allies, they truly have few choices other than to trust the local defenders.\n\nFollowing the battalion commander's orders, Wang Qiushi unbuckled his shoulder harness and instructed his platoon leaders to have everyone do the same. The smell of mold and sweat from the seatbelts had accompanied him on a flight lasting five or six days. The aging C-130 was not just \"outdated\"; there hadn't even been a chance to clean or replace the various supplies and equipment inside the fuselage. Looking on the bright side, the journey was finally over... Wang Qiushi, clutching his T91 rifle, stepped down from the rear ramp, immediately hit by waves of scalding heat. Why had someone so close to retirement age been reassigned to this desert? Does heaven just love messing with people?\n\nAfter disembarking, falling in, and taking a headcount, a logistics officer from the Arab Republic approached to speak with Captain Wang. Looking confused, Wang Qiushi hurriedly called for the company translator to help. Five minutes later, several sand-colored M35 trucks pulled up beside them. The officer had them board the trucks, which then drove toward the temporary barracks on the outskirts of the airfield, allowing the exhausted soldiers to rest and acclimatize to the Arabian Peninsula's weather before planning any further operations.\n\nThat night, Wang Qiushi joined a group of ROC and Republic officers for a briefing in the command tent. The various heavy weapons, ammunition, and personnel provided by Taiwan as aid had all arrived successively, with Wang Qiushi's group being the last batch. However, due to the tight schedule of the original deployment, there was no time to equip all units with desert gear in Taiwan; the three-color camouflage on the vehicles and the green digital camo uniforms worn by Wang Qiushi and his men would all need to be replaced.\n\nFortunately, the US military had left behind plenty of logistical supplies during Operation Desert Shield years ago, meaning the clothing could be immediately drawn from American stockpiles. As for the army's heavy equipment like tanks, armored vehicles, and trucks, they would have to be painted in desert camouflage at the base before they could be deployed.\n\nAfter the meeting was dismissed, Wang Qiushi stepped out of the command tent and looked up at the night sky. Orange-red fireballs and anti-aircraft fire of various colors danced against the deep blue curtain. He wondered what kind of night sky his family far away was looking at."
 CHI.99.a: "\"I don't know if I can make it back alive...\""
 CHI.101.t: "The Lost Son"
 CHI.101.d: "He opened his heavy eyelids; the peeling wallpaper clung listlessly to the concrete wall, revealing patches of flaking paint and spreading mold where a corner had been torn away. Ruiming pressed against his pillow and rolled over; the empty side of the bed held nothing but a solitary gray pillow. He squeezed his eyes shut, gasping for breath, then forced himself up, threw open the door, and rushed out of the room-he had survived another day.\n\nRuiming turned on the gas, but the stove refused to light. \"Right...\" He had tried to leave the gas on a few days earlier, only to be discovered by a neighbor; a well-meaning auntie had helped him \"locate\" the source of the smell and shut off the gas.\n\nHe rummaged through the cupboard and found some instant noodles bought years ago, preparing two bowls and placing them on the table. He sat on his side, gazing vacantly at the empty space opposite him, clinging to a faint, irrational hope that his son might be lying on the living room sofa, scrolling through his phone as usual. Ruiming carried the two bowls of noodles slowly toward the living room. Unsurprisingly, he was alone.\n\nHe sat down slowly; the steam from the noodles dissipating quickly. He wanted to wait in the living room for his son to return-perhaps the boy had simply gone to class early? He would see him after school, surely... The dim, amber sunlight shimmered in the noodle bowls. Ruiming snapped awake-how had he dozed off? If he didn't pick up his son, the boy would surely roll his eyes at him again! He ate every last bit of the noodles, now soggy and limp, and casually added a tally mark next to the rows of strokes covering his son's obituary-a reminder that he still owed his son a bowl of noodles. Clutching the obituary and the empty bowl, he limped up to the roof, embracing the last sliver of twilight as he stared into the void."
 CHI.101.a: "Only in death does duty end."
 CHI.102.t: "Clean House"
 CHI.102.d: "Deep within the National Security Bureau, in a dim room absent even from the building's blueprints, Agent Su and his team gathered around a crude iron camping table. Scattered across it were dozens of standard-issue folders containing mugshots, alongside thick stacks of documents piled high like a small mountain-the fruits of over a decade spent tracking pro-CCP figures. These subjects ranged from retired generals and young Taiwanese business people to certain spouses from the mainland. Since the 1980s, the CCP had attempted to infiltrate various sectors of Taiwanese society, waging cognitive warfare-both overt and covert-to sway public opinion.\n\nIn the past, constrained by close cross-strait civilian ties, the Bureau had feared that drastic measures might trigger uncontrollable social repercussions. But times had changed; Taiwan had successfully repelled the People's Liberation Army, and the moment had come to turn their sights inward. Agent Su lit a cigarette. Across the country, SWAT teams were acting on the intelligence his unit provided to apprehend collaborators; tear gas and rubber bullets would instantly neutralize any resistance, while shields and rifles would deal with the die-hards who refused to surrender... Agent Su exhaled a slow plume of smoke. He had never imagined he would live long enough to personally purge those traitors. His gaze rested on the dark gray concrete wall. Unlike the soldiers fighting bravely on the front lines, the enemies he faced were far more insidious and adept at concealment-yet, so long as he could protect the Republic of China..."
 CHI.102.a: "He's willing to give up his life protecting it."
 CHI.103.t: "Lower the Banners, Silence the Drums."
 CHI.103.d: "As the smoke of battle clears, society seemed to return to normal. Were it not for the surrounding wreckage, one might mistake it all for a dream.\n\nThe red dragon has been driven back to its lair, yet the land itself is no longer what it once was. Scars of combat linger at the harbor, damaged fortifications remain visible on the city's outskirts, and transportation hubs show signs of strain from prolonged, over-capacity operation. From the front lines to the home front, from factories to households, the entire society bears deep wounds from the long period of fighting. People are returning to their daily lives, only to discover that \"normalcy\" itself has changed. Some were left traumatized, some had lost everything, and some never returned. Yet, the end of the war also heralds a new beginning. The nation and its people must heal and rebuild. This will not be a process completed overnight. Amidst the smoldering embers of war, we will determine the nation's future - Whether to return to the past, or to step into a new reality vastly different from before."
 CHI.103.a: "Mr. President... what do we do now?"
 CHI_unlock_reconstruction_tt: "Will unlock the §YPost-War Reconstruction Focus Tree§!."
 CHI.104.t: "Four Years in a Flash"
 CHI.104.d: "Four years can be a time of brilliance or a time of banality; it is a span long enough for carefree university students to travel the globe, yet also long enough for society to spin its wheels, achieving nothing. For Taiwan, this cycle has seen its people through one hardship after another-hardships met with remarkable resilience. Whether facing natural disasters or man-made crises, Taiwan has always endured.\n\nSince the lifting of martial law, the island's social climate has undergone profound changes. Over decades of development, people have grown accustomed to a society that shifts in four-year cycles. The familiar spectacle of election fever arrives right on schedule, bringing candidates, debates over unification versus independence, and fierce online clashes that never fail to surprise the public. Yet, once the frenzy subsides, another quiet four-year stretch follows. Perhaps there is a certain fortune in a lifetime of such tranquility...\n\nYet, the invasion by the People's Liberation Army had brutally transformed Taiwan into a cruel meat grinder, with blood and tears watering the rice paddies of the Chianan Plain. The people still struggle to heal the wounds of war. But the future waits for no one. The curtain is quietly rising on the next presidential election-yet this time, there wasn't the usual frenzy of the media and of loudspeakers; there is now only the bewilderment of the Taiwanese people and their most earnest yearning for the future."
 CHI.104.a: "The die is cast."
 CHI.105.t: "Hand in Hand"
 CHI.105.d: "Holding a plain white bag from the adults, Aiqi led her \"best friend\" by the hand over to that familiar little corner. She sat down and tore open the package; inside were items of various sizes. She couldn't read the writing on them, but they were likely food-at least, that's what the adults had told her. Aiqi broke a piece off a biscuit and handed it to her \"friend.\" \"Here, this is for you.\" Jiaqi-her teddy bear-hadn't been very talkative lately and usually didn't eat anything, so Aiqi broke off a few extra pieces this time. A chubby Jiaqi would be much cuter, after all. She gazed into the distance toward home-not the new home in the tent where they were staying now, but the old one. A few times, she had wanted to go back to the old house to find her dad and grandma. However, the men in green clothing nearby wouldn't let her, that it was too dangerous and warning her about something called \"...unexploded ordnance?\" She didn't know what that meant; she would ask her teacher about it next time she went to school.\n\nAiqi broke off another piece of biscuit, chewing quietly. Despite trying to satisfy her empty belly, nothing could satisfy the longing for her parents. Every time she asked the green men about them, they simply shrugged and said that she should return to the playground. Aiqi grabbed Jiaqi and hugged her stuffed friend tightly. Although this little corner of stone walls felt a bit lonely, it also felt safe.\n\n\"Oh! So this is where you ran off to?\" Aiqi looked up to see a blonde woman in a blue vest standing before her. \"Are you still hungry?\" Aiqi was about to shake her head when her stomach betrayed her with a loud growl. The woman smiled with a smile as lovely as her teacher's. She then seemingly reached behind and took a small bun out of thin air, placing it right into Aiqi's palm."
 CHI.105.a: "“Next time, you mustn't go wandering off alone, okay~?”"
 CHI.106.t: "Rebuilding the East"
 CHI.106.d: "The glaring sunlight illuminated the entire train carriage. Chen Zihao reflexively raised his hand to block the sun, but no matter how he tried, he just couldn't lift it. Looking around, the small carriage was packed like a can of sardines, with everyone squeezed tightly together-a density of people probably only matched by the Taipei Metro during rush hour.\n\nIn the aftermath of the war, much of Taiwan was waiting to be rebuilt. People like Zihao were assigned by the government to repair infrastructure across the island-high-voltage power lines, underground water pipes, the main longitudinal railway... rushing north and south, trying to re-establish connections between the different regions. The Chu-Kuang Express train slowly braked to a halt; the platform lights flickered on and off. Zihao followed the flow of people onto the platform. The South-Link Line had only recently been repaired and put back into service, making it the sole transportation route currently connecting the east and west.\n\n*Beep!* With a sharp blast of his whistle, the foreman called everyone to assemble outside the station. Zihao and his group were the first engineering team tasked with rebuilding Hualien and Taitung. They would be deployed first to the most dangerous and critical areas, laying a solid foundation for the subsequent support efforts.\n\nChen Zihao took a deep breath, wiped the beads of sweat from his forehead, and along with the others, picked up his shovel to start clearing the chunks of broken concrete on the ground..."
 CHI.106.a: "A journey of a thousand miles begins with a single step."
 CHI.107.t: "Where do we go from here?"
 CHI.107.d: "Inside a recently reopened stir-fry restaurant in Taichung, workers who had spent the day sweating to rebuild their homeland gathered around a folding table to indulge in the night. With a *pssh*, a beer can tab was popped, and refreshing bubbles fizzed from the opening. *Gulp, gulp*-the golden wheat beverage slid down their throats, sending a cooling thrill through their bodies. \"Hah! I feel alive again!\" one of the workers exclaimed with a joy akin to a newborn's birth; had he not been trying to maintain his machismo, he might have even shed a tear. The nation's reconstruction was advancing steadily, and everyone's thoughts were focused on restoring their homeland to its original appearance-or making it even better!\n\nThe workers drank to their hearts\" content, imagining the brand-new look their home would take on.\n\nSuddenly, a news broadcast on the television caught their attention.\n\n\"As Taiwan's reconstruction gradually reaches completion, under pressure from opposition parties, President [CHI.Getleader] has agreed to resume the presidential elections. Currently, various political parties are conducting internal primaries to field their candidates. With public opinion now completely reshuffled, which party will ultimately take power? What kind of future will Taiwan face? Stay tuned for our follow-up reports.\"\n\nAfter the broadcast ended, the workers erupted into chatter. The Taiwan Strait War had united the entire island, and external factors would no longer influence Taiwan's electoral process. However, people could no longer use the traditional dichotomy of \"who can best protect Taiwan\" to cast their votes. The distribution of voter support had been completely scrambled. Watching the news on TV, the workers fell into a state of bewilderment..."
 CHI.107.a: "Right... who should we choose next?"
 CHI.108.t: "Kaohsiung Port Damage Assessment and Reconstruction Report"
 CHI.108.d: "President, the damage inventory for transportation nodes in the central and southern regions has been preliminarily completed. The Kaohsiung Port area and its surrounding commercial districts were severely devastated by several rounds of PLA missile strikes and artillery fire. The safety and resettlement issues for civilians have been preliminarily resolved. A large amount of PLA military equipment was also left on the coast, most of which was destroyed beyond repair during their retreat. However, numerous weapons were still abandoned in the beachhead positions near the port area, including: one Type 728 hovercraft, three Type 726 hovercrafts, ten ZLT-05 amphibious armored assault vehicles, two hundred sets of various artillery, several light and heavy machine guns and rifles, and thousands of rounds of ammunition. Most of these have been received by the garrison forces at Zuoying Naval Base and transported to concealed warehouses pending further arrangements.\n\nThe following is a summary of the Kaohsiung Port damage assessment report:\n\n1. The damage to the Intercontinental Phase II Logistics Warehousing Area and the bulk cargo wharves is extremely severe. During the war, the ROC Armed Forces and the PLA engaged in close combat here several times. Intense missile strikes and fire support from hovercrafts rained nearly a hundred rockets onto this area; the ground facilities have essentially no possibility of being repaired, and it is recommended to completely demolish them.\n\n2. The Seventh and Sixth Container Centers within the Second Port, as well as the surrounding port areas and industrial facilities, all suffered varying degrees of damage from missile bombardments. However, after investigating the losses at the Talin Power Plant, we discovered obvious signs of deliberate sabotage in the internal cooling systems and gas turbines. We are currently actively cooperating with the National Security Bureau to investigate the situation; the plant manager has already submitted the personnel duty roster and surveillance footage of the various areas to us. Please refer to page 31 for related issues and details.\n\n3. Currently, there are less than twenty operational wharves available. Liquid cargo wharves 27 and 28 were directly hit by aerial bombs and missiles, and a large amount of debris is still being cleared. During the cleanup process, an engineering team was accidentally injured by an unexploded ordnance, resulting in a tragedy of four dead and twenty-one injured, making the cleanup work in this area extremely difficult. Wharves Xinbin 1 and 2 can maintain basic operations thanks to emergency repairs by combat engineers, but currently can only berth a portion of smaller warships. The remaining large vessels, including those of the Seventh Fleet, can only temporarily berth at wharves S1~S5. Please refer to page 12 for the specific list.\n\nThe above is our simplified preliminary report and summary following the damage to Kaohsiung Port. Kaohsiung Port currently requires an urgent injection of funds and manpower to restore normal operations. The specific reconstruction plan and required resources are attached in the final section of this report. We hope the President will reply as soon as possible..."
 CHI.108.a: "“Damn... this is bad...”"
 CHI.109.t: "Taoyuan Airport Reconstruction Affairs"
 CHI.109.d: "Ah-Wei wiped the sweat from his brow; he was an ordinary construction worker. During the war, Taoyuan Airport was completely destroyed by PLA paratroopers and helicopters attempting to capture it, followed by missile strikes. After the war ended, rebuilding Taiwan's largest international airport was made a top priority. Army engineering units quickly leveled the runway as fast as possible, establishing a temporary control tower to restore basic operations.\n\nAfterward, countless construction workers and volunteers like Ah-Wei arrived at the ruins. They cleared the bombed-out debris, pulled out the remains of soldiers from both sides buried under the rubble, and recovered anything of value. Once the cleanup was complete, they began excavating the foundation. The government decided to take advantage of the surrounding ruins to expand and optimize this most important airport in Taiwan during its reconstruction, making its internal flow and layout more scientific and comfortable. Truckload after truckload of concrete was poured into the foundation pit. Bit by bit, they rebuilt what was once Taiwan's largest, most bustling, and heavily trafficked airport-making it even better than before.\n\n\"Food is ready!!!\" a volunteer's voice rang out in the distance. At current reconstruction sites, there are many volunteers assisting the workers; directing traffic, providing first aid, and handling logistics all depend on their contributions. Ah-Wei walked over, and a volunteer auntie handed him a bento box. Braised pork-not bad today. Ah-Wei sat in a chair, ate his bento with oolong tea, and then threw himself back into the reconstruction, throwing himself into the revival of Taiwan."
 CHI.109.a: "United, Taiwan Rises Again."
 CHI.110.t: "Charting the Course"
 CHI.110.d: "As the work of rebuilding our homeland comes to a close, the people have recalled the fundamental right they ought to exercise: the right to vote. The war has entirely refreshed the Taiwanese perspective on politics, and every single vote cast will indeed profoundly impact the future of the nation.\n\nIn the Taiwanese political arena, the Kuomintang and the Democratic Progressive Party fundamentally stand as equals. The Kuomintang advocates maintaining ties across the strait so that, at some point in the future, they can launch a counterattack on the mainland and once again fly the Blue Sky, White Sun, and a Wholly Red Earth over China. The Democratic Progressive Party advocates for the regime to settle on this small island in the Western Pacific, maintaining a nation that belongs to the Taiwanese.\n\nMany futures that we previously dared not imagine are now springing up like mushrooms after rain, now that the PDTO has gained the upper hand. When the next January arrives, the people will discover the greatest common denominator of societal consciousness and designate the direction for the future. The Kuomintang? The Democratic Progressive Party? Or perhaps a third option?"
 CHI.110.a: "Let’s hope everything goes smoothly."
 CHI.110.b: "The DPP’s subsequent content is still under development. Stay tuned!"
 CHI.111.t: "The Future of the Republic"
 CHI.111.d: "Taiwan... no, the Republic of China's performance during the Taiwan Strait War has demonstrated to the entire world our unwavering resolve to defend our free will. In international diplomacy, nations that had previously severed ties with us under pressure from the Chinese Communist Party are beginning to extend a hand of friendship to the Republic of China. As the CCP's international influence wanes, we can finally proudly acknowledge our true national name, formally participate in various international organizations, and embrace the beautiful Blue Sky, White Sun, and a Wholly Red Earth at international sporting events.\n\nNow, we must elect the next presidential candidate who can truly represent the Republic of China. The Democratic Progressive Party, with its Taiwan-centric core, is outside the scope of consideration here. The Kuomintang must now decide which candidate to put forward to unite all pro-Republic factions. Where will this leader take the nation? Will they take up the mantle of Generalissimo Chiang's unfulfilled ambitions, or will they forge an entirely new future?"
 CHI.111.a: "If you want to vote, vote for President Han!"
 CHI.121.t: "The Will of the People!"
 CHI.121.d: "As certain candidates put on elitist faces for televised speeches, President Han Kuo-yu has already clocked out and headed to his usual wet market. Passing aunties greet him warmly as \"Boss Han,\" and vendors always slip him an extra bunch of green onions with his groceries. Shopping done, he stops by his favorite food stall to pick up three bowls of braised pork rice to enjoy at home with his family.\n\nThis close connection with the people is Han Kuo-yu's distinct political philosophy. He shows the Taiwanese public that politics is neither a comedy routine broadcast on television and the internet, nor cold spreadsheets and economic data. It is about living a grounded life alongside everyday citizens. He wants the public to know that when hardship strikes, Boss Han will never desert them. He will step forward in the most difficult moments!\n\nSharing in the joys and enduring the hardships together is the idealism Han Kuo-yu stands for!"
 CHI.121.a: "Four more years for President Han!"
 CHI.130.t: "Elections as Planned"
 CHI.130.d: "It is once again our quadrennial election day, but this time, it truly feels different from the past. The familiar sights of candidates sweeping the streets for votes and holding massive rallies are gone. Instead, people are gathered around their radios listening to this year's election instructions. Veterans leaning on canes sit with their comrades in veterans\" homes, staring intently at the lobby radio. Fathers finishing work pull their daughters, just home from school, to turn on the television, while university students in classrooms are entirely fixated on live streams on their phones.\n\nAll day tomorrow, the people will set aside their work. In elementary school classrooms, in gymnasiums, and in temporarily erected tents, they will receive their ballots, stamp them, and drop them into the ballot boxes. Everyone knows in their hearts that the vote in their hands will truly determine the future of our society."
 CHI.130.a: "The future of the Republic..."
 CHI.141.t: "Running Was Chance, Winning Is Destiny!"
 CHI.141.d: "After his defeat in the 2020 presidential election, Han Kuo-yu never imagined he would once again be nominated by the Kuomintang as their presidential candidate. The people have not forgotten how he left his post as Mayor of Kaohsiung halfway through his term to run for president. However, they also have not forgotten that during the Republic of China's most critical moment of life and death, he did not choose to flee. Instead, he stayed on this land to stand and fall with the people. His diehard supporters remain steadfast in their backing, and centrist voters, exhausted by political mudslinging, are willing to give him a second chance.\n\nWith tears in his eyes, Han Kuo-yu delivers a resounding speech, declaring his resolve to march into the future shoulder to shoulder with the people. He will never run away again. This time, he will absolutely make Taiwan prosperous!"
 CHI.141.a: "Where the Moon Goes, the Bald Guy Follows. Where the Bald Guy Goes, We Follow!"
 P2HKY_unlock_tt: "Will unlock §BHan Kuo-yu§!'s political focus tree, as well as the §BKuomintang§!'s economic and military focuses."
 CHI.BF.11.t: "Going Home"
 CHI.BF.11.d: "The sea breeze blew gently past the guardhouse, ringing the bell on the door, as waves crashed ashore in rhythm with the wind. Huang Xingding leaned against the peeling iron railing, his right hand habitually rising to his lips to mimic a smoking motion. Kinmen's coastline offered more variety than Penghu's, and the bustling Xiamen skyline at night always filled him with a deep yearning. During his childhood, his grandfather and father would often recount their days fishing in Xiamen and describe the green hills and clear waters near their ancestral home. When the Kuomintang retreated to Taiwan, they conscripted his grandfather to replenish their troops, and his father later followed suit by enlisting in the army.\n\n\"It's fine even if we can't go back; at least I can still look...\" While others groaned at drawing a Kinmen deployment, his father had been ecstatic. Sadly, he did not live long enough to see the opening of the Mini Three Links. Huang Xingding shifted his stance to lean his back against the railing. He looked toward his home, a small rented house on the island where the ashes of his grandfather and father rested. Although his father always told him it did not matter if they never returned, Huang Xingding felt he owed them far too much. He simply did not know if he would ever have the chance to bring his ancestors back to set foot in that familiar yet alien homeland.\n\nAs the sun set, his relief arrived for the shift change. Huang Xingding slung his rifle and walked the path back to camp. Kinmen Island lay devastated in the aftermath of the Taiwan Strait War, with bullet holes clearly visible on the cliff faces and missile craters dotting the distance. Bypassing these ruins, he stepped onto the tourist trail and walked up to the massive stone monument inscribed with the words \"Wu-Wang-Zai-Ju.\" He had no great fondness for Chiang Kai-shek. Over the decades, however, the former leader had gradually transformed into a symbol that merged with their homesickness, carrying the regrets and unfulfilled wishes of the old veterans far into the distance.\n\nHe pulled the photograph from his helmet liner. Its yellowed surface could not obscure his father's confident face. Back then, the older man firmly believed that the Republic of China would one day retake the mainland and return to their hometown, fully intending to show off in the village when that day came! But given Taiwan's exhausted military strength today, did he truly have a chance to carry his father's dying wish back home? Even if they did return, could they really liberate their mainland compatriots with the triumphant spirit his father had imagined?"
 CHI.BF.11.a: "Nevermind, let's just focus on the task at hand..."
