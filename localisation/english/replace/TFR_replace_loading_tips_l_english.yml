l_english:
 LOADING_TIP_0: "I think Taiwan stands to lose very little; the little left being its freedom.\n —— Huang Chih-hsien"

 LOADING_TIP_1: "Taiwan is currently nothing more than a runaway province. Don't give those \"Taiwanese\" people any thought- just give them a thrashing and they'll know their place.\n —— Shen Yi"

 LOADING_TIP_2: "Why are you protecting him— a warmonger, a disgrace?\n —— Chang An-lo"

 LOADING_TIP_3: "The Chinese Communist Party's desire is that Taiwan's politics, society, and public sentiment are to become volatile and chaotic. To achieve this advantageous situation, there must be an opposition force, and the ready-made opposition force are the people from the Formosa Magazine.\n —— Wang Ching-hsu (1993)"

 LOADING_TIP_4: "Chinese history has not abandoned Taiwan, and Taiwan cannot abandon the Mainland.\n —— Lee Teng-hui"

 LOADING_TIP_5: "I am the strongest cheat code of the Republic of China!\n —— Terry Gou"

 LOADING_TIP_6: "The DPP isn't synonymous with Taiwan, nor is the KMT synonymous with the Republic of China.\n —— Tsai Ing-wen (2015)"

 LOADING_TIP_7: "Honestly, the CCP's authoritarian regime is not worthy of including the democratic name \"Republic of China.\" In fact, this \"renaming mistake\" might've left an opportunity for our generation of mainland Chinese to bring the true 'Republic of China' back to the whole of China.\n —— Wang Bingzhang (2000)"

 LOADING_TIP_8: "I'll say it in the crudest Taiwanese: You were all \"fucked\" into existence by Chinese people! You don't deserve to be called \"Chinese.\" Even though you are born of Chinese people, you are bastards! We don't want you! Chinese people don't want you!\n —— Chang An-Io (2014)"

 LOADING_TIP_9: "The Republic of China, Taiwan,  Republic of China, Taiwan are all our names, they are all the names of our country, and they all ring just as loud.\n —— Lai Ching-te"

 LOADING_TIP_10: "I believe the DPP needs a primary conducted in good spirits, and I also hope that President Tsai asks her \"cyber army\" to stop attacking me. These attacks do not help with our future unity.\n —— Lai Ching-te"

 LOADING_TIP_11: "It's not that winning by majority vote makes it okay! That's not how it works!\n —— Lai Ching-te"

 LOADING_TIP_12: "It's almost as if the husband in every family is in poor health.\n —— Lai Ching-te"

 LOADING_TIP_13: "We must join hands together to deal with this ruler, the KMT, and this cruel and unjust regime!\n —— Cheng Li-wun (1988)"

 LOADING_TIP_14: "I like a little ice cream after a meal, and I also like cilantro, but cilantro with ice cream? I'm not sure if this is a way of eating that has any social consensus...\n —— Tsai Ing-wen"

 LOADING_TIP_15: "We are already an independent country, and we call ourselves the Republic of China.\n —— Tsai Ing-wen"

 LOADING_TIP_16: "If Taiwan is in need, we will be the ones that rise to the occasion, and we will turn up the heat when we need to.\n —— Tsai Ing-wen"

 LOADING_TIP_17: "You don't need to tell me this, go tell your boss... you have to be self-reliant.\n —— Tsai Ing-wen"

 LOADING_TIP_18: "You can cry, but don't get discouraged; you can be sad, but don't give up.\n —— Tsai Ing-wen"

 LOADING_TIP_19: "Humility, humility, and more humility.\n —— Tsai Ing-wen"

 LOADING_TIP_20: "Taiwan is a sovereign and independent country named the Republic of China, and is not subordinate to the People's Republic of China.\n —— Lai Ching-te"

 LOADING_TIP_21: "I am a pragmatic worker for Taiwan's independence.\n —— Lai Ching-te"

