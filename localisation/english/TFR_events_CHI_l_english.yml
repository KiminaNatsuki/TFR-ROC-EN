 ROC.1.t:0 "Red, Blue, White"
 ROC.1.d:0 "The Republic of China has now entered its 109th year. From a foreign perspective, this nation appears relatively young. This impression has increasingly become the mainstream narrative in modern times as the Chinese Communist Party quietly usurped the title of the successor to \"China.\" Consequently, the Republic of China, the orthodox heir of the Chinese nation, now faces the greatest identity crisis in its history.\n\nChampioning local consciousness, Tsai Ing-wen and the Democratic Progressive Party (DPP) behind her emphasize that the \"Taiwanese\" identity precedes the \"Chinese\" one: before being citizens of the Republic of China, the people are first and foremost Taiwanese. This ideology gradually gained traction during the mid-to-late martial law period and has evolved into a prominent political force following modern democratization.\n\nStanding in opposition is the Kuomintang (KMT), which has fielded Han Kuo-yu as its candidate. This historic party was founded by Sun Yat-sen, the Father of the Republic of China. The Nationalist Government, subsequently led by Chiang Kai-shek, defeated regional warlords and the fascist Japanese invasion to unify China. Tragically, upon the conclusion of the War of Resistance, the Chinese Communist Party seized the opportunity to rise. Strategic catastrophes at Liaoxi, Xubang, and Pingjin ultimately forced the Nationalist Government to retreat to Taiwan. In Taiwan, the KMT's policies gradually shifted from the early ambition of \"Reclaiming the Mainland\" to \"Taking Root in Taiwan,\" with its base primarily identifying as \"Citizens of the Republic of China.\" Even though they do not strictly reject the Taiwanese identity label, and despite facing immense internal and external pressures post-democratization, the KMT still maintains a firm grip on local votes through its deeply rooted grassroots party networks and farmers' associations.\n\nBlue and Green, Mainlanders and Natives, Chinese and Taiwanese. The people of this land have endured far too much suffering and have grown profoundly weary of the political theater of elections. This time, will things be any different?"
 ROC.1.a:0 "Long live the Republic of China!"
 CHI.10.t:0 "Oil Crisis Impacts Taiwan"
 CHI.10.d:0 "Driven by soaring oil prices and economic instability triggered by the Saudi civil war, international energy and financial markets have fallen into chaos. The rapidly deteriorating situation eventaully spilled over, dealing a heavy blow to Taiwan's economy. The Taiwan Stock Exchange index has plunged to a historic low, and leading economists are warn that if the situation continues to deteriorate, there will be little hope of stabilizing in the close future.\n\nThe crash of the New York Stock Exchange, compounded by massive overseas economic downturns, has further set off a chain reaction. Taiwan's export market is now strained, suppressing the island nation's financial and manufacturing sectors. Furthermore, the economic contraction has forced hundreds of companies to initiate layoffs and scale back operations, placing the job market under heavy pressure.\n\nThe engine of commerce that sustained Taiwan's rapid growth over the past half-century is visibly slowing down. With capital confidence shaken and industrial expansion blocked, the broader economy is gradually showing signs of stagnation."
 CHI.10.a:0 "We must prepare quickly!"
 CHI.1.t:0 "The 2020 General Election"
 CHI.1.d:0 "Public attention is once again focused on the nation's future direction as political factions gear up to secure support. This is more than just an election; it is a public test of current policies and national strategy.\n\nThe voters' choice will directly shape the pace of domestic reform, the direction of foreign policy and wider Taiwanese society as a whole. The government must address both domestic public sentiment and international attention, balancing short-term political pressure against long-term national interests."
 CHI.1.a:0 "The DPP remains in power."
 CHI.1.b:0 "The KMT takes power."
 CHI.2.t:0 "Patient Zero"
 CHI.2.d:0 "The plane landed smoothly at Taoyuan Airport. Over the intercom, a flight attendant calmly asked everyone to remain seated and explained the arrival quarantine procedures. Yang Shuhui did not hear a word of it.\n\nHer severe headaches had begun several weeks earlier during a business trip to Wuhan. At first, she assumed she was having trouble adjusting to the new environment and had caught a mild cold. But even after taking all the cold medicine she had brought with her, her symptoms had not improved at all. She leaned against the seat in front of her, trying to ease the pain, then pulled the last tissue from the backpack at her feet and covered her mouth. After coughing, she stuffed it into the sick bag, which was already full of tissues she had used during the flight.\n\nAfter leaving the plane, she reported her condition to the ground crew. Workers in protective suits escorted her to a temporary isolation area. There, a nurse carefully placed the newly collected sample into a testing machine and waited for the result.\n\nA rapid series of beeps suddenly broke the silence. Although Shuhui's vision had become a blur, she would never forget that moment—the frozen expressions on every staff member's face."
 CHI.2.a:0 "Oh no..."
 CHI.4.t:0 "Orphan of Asia"
 CHI.4.d:0 "Following its defeat in the Chinese Civil War, the government of the Republic of China relocated to Taiwan in 1949. At first, it continued to claim the right to represent \"China.\" Yet after losing most of the territory it had once governed, the legitimacy of that claim began to weaken.\n\nIn 1971, the People’s Republic of China, established by the Chinese Communist Party, replaced the Republic of China as the internationally recognized representative of China. From then on, the Republic of China was pushed away from the center of the international stage and forced to survive on its margins, operating under the names Taiwan or Chinese Taipei.\n\nAt the same time, the country underwent profound changes at home. Its path from martial law to democracy was marked by a long period of authoritarian rule. Earlier generations paid in blood and sacrifice for the freedom and prosperity enjoyed today, though this transformation also came with the gradual erosion of the state's constitutional identity and international standing. Few today still sincerely regard the Republic of China as \"China.\" Yet it was under these very conditions that the country learned to navigate between great powers and preserve its existence as best it could.\n\nThis fragile balance, however, now faces new challenges. Chinese Communist military aircraft cross the median line of the Taiwan Strait day after day, moving ever closer to Taiwan itself. A sudden pandemic has disrupted global supply chains. The United States is approaching another election amid an unprecedented level of domestic instability.\n\nPerhaps, as our adversary has said, a transformation unseen in a century is now beginning to unfold.\n\nWe now stand at a turning point in our destiny."
 CHI.4.a:0 "I look homeward; the road runs long and far."
 CHI.5.t:0 "Following the Bald Man"
 CHI.5.d:0 "AOn the television screen, the vote tallies flickered rapidly; Tsai Ing-wen and Han Kuo-yu repeatedly overtook one another, keeping the race neck-and-neck. Tsai Ing-wen and Han Kuo-yu traded the lead again and again, and every reversal sent a fresh roar through one campaign headquarters while plunging the other into silence.\n\nAmid this head-on clash, only James Soong’s campaign seemed almost forgotten, holding steady in a distant and harmless third place.\n\nAfter hours of counting, fewer than ten thousand ballots remained. Against nearly every expectation, the name at the top of each network’s results board was Han Kuo-yu of the Kuomintang, leading by almost thirty thousand votes.\n\nPresident Tsai Ing-wen was the first to speak. A grim silence settled over the Democratic Progressive Party headquarters as supporters, many of them in tears, watched her concede the election.\n\nThe Han Wave had arrived. Born in Kaohsiung, it had now swept north all the way to the Presidential Office in Taipei.\n\nAt the Kuomintang's headquarters, the celebration had reached fever pitch. Once his opponent conceded, Han Kuo-yu stepped out before the crowd.\n\n\"As president-elect of the Republic of China, tonight I feel no joy. I know that national security and economic prosperity are not an either-or choice. The people of Taiwan deserve both.\n\n\"Our country is facing one of the most difficult moments in its history. I, Han Kuo-yu, will carry out my duties faithfully and live up to the trust you have placed in me. For the Republic of China, I will give everything I have.\n\nI will stand on the front lines to defend our country. I will stand on the front lines to ensure the nation's security, and I will fight on the front lines to bring wealth to the people and prosperity to Taiwan.\n\nThank you to the millions of citizens of the Republic of China for giving me this opportunity to serve the country I love! I swear that if I fail to perform well during these four years, you may throw me out immediately!\""
 CHI.5.a:0 "The Blue Sky emerges, the White Sun rises."
 CHI.6.t:0 "A Bottle of Water and a Bowl of Braised Pork Rice"
 CHI.6.d:0 "As usual, Mr. Rong woke up early. After a quick wash-up, he began prepping ingredients; stewing a pot of minced pork sauce or simmering bone broth all day was second nature to him. He had taken over the shop from his father over thirty years ago. Having grown up in Taiwan, he hadn't found any interest in anything beyond his island home. Things such as the Yangtze or Yellow Rivers—or whatever else his grandfather and father used to go on about; those things were visible only from worlds away, so what did they have to do with him?\n\nOne brief midday break, while lost in thought, Rong stared at the large TV on the wall. The presidential election had just concluded. On the screen, a polished politician beamed, styling himself as the \"President of the Common People.\" He spoke eloquently about his policies and vowed to make Taiwan rich.\n\nBrother Rong clicked his tongue in disdain. Just as he reached for the remote to change the channel, he heard a familiar voice from the front of the shop...\n\n\"Sir, one bowl of braised pork rice, please.\" A middle-aged man had walked in—his bald head shining over a Kuomintang campaign vest draped over a seemingly decade-old shirt, a half-finished bottle of mineral water clutched in his hand. Mr. Rong was startled; it was Han Kuo-Yu, the president elect! Despite Rong's pondering on why Han would appear alone at his shop, he still went to take the president-elect's order and prepare the meal. After serving the food, Han asked Mr. Rong to stay and have a chat.\n\n\"Business is really tough these days,\" complained Mr. Rong to Han as he was sitting down.\n\nHan looked up. \"Yeah. Back when I was in the army, a bowl of plain noodles cost barely over ten dollars. Now, you wouldn't dare step into the market without five hundred in your pocket!\"\n\n\"Every president talks about changing Taiwan. The TV shows all these charts claiming Taiwan is doing great and the economic growth rate is high—but why does life feel harder and harder for me?\" Han Kuo-yu didn't speak; he simply scooped up a mouthful of braised pork rice and ate it quietly. In this space, there was no rank, no authority, and no distinction of seniority—just two lonely middle-aged men sharing stories of their lives."
 CHI.6.a:0 "Like a president of his people."
 ROC.7.t:0 "Diaoyutai Islands Oil Exploration Request"
 ROC.7.d:0 "The Taiwanese government has just submitted a diplomatic note to Japan, proposing the joint development of oil reserves in the waters surrounding the Diaoyutai Islands and requesting access to these resources.\n\nTaipei's motivation is clear: Facing a growing regional energy deficit, Taiwan urgently needs a stable energy supply to sustain its technology sector and civilian commerce. For Japan, this proposal goes beyond economic cooperation to test its geopolitical boundaries and territorial sovereignty.\n\nAccepting the request would substantially improve Japan-Taiwan relations while inevitably escalating territorial disputes with China. A refusal risks alienating the two nations."
 ROC.7.a:0 "For the sake of regional stability, we must refuse."
 ROC.7.b:0 "Agree to joint development for mutual strategic benefit."
 ROC.8.t:0 "Refusal from Tokyo"
 ROC.8.d:0 "The Japanese Ministry of Foreign Affairs has replied to our request for oil development rights in the Senkaku Islands. Predictably, given the highly complex situation in East Asia and the CCP's demands regarding \"territorial sovereignty,\" Japan cannot support any form of Taiwanese development plans in those waters.\n\nThe Ministry of Foreign Affairs expressed regret over this decision and advised us to seek alternative energy solutions."
 ROC.8.a:0 "What a pity."
 ROC.9.t:0 "Approval from Tokyo"
 ROC.9.d:0 "As expected, the Japanese government has agreed to allow Taiwanese oil exploration in the waters surrounding the Senkaku Islands. Taiwan will secure extraction rights for a portion of the region's crude oil alongside technical support from Japan.\n\nThis move provoked fierce condemnation from CCP media. Even so, it has significantly improved Japan-Taiwan relations and secured Taiwan's energy supply."
 ROC.9.a:0 "Great!"
 ROC.10.t:0 "South China Sea Joint Oil Exploration Request"
 ROC.10.d:0 "The Taiwanese government has just submitted a diplomatic note to mainland China, proposing the joint development of oil reserves in the South China Sea and requesting access to these resources.\n\nThe Taiwanese government's motivation is clear: Facing a growing regional energy deficit, Taiwan urgently needs a stable energy supply to sustain its high-tech sector and civilian operations. For mainland China, this proposal goes beyond economic cooperation to test its geopolitical boundaries and territorial sovereignty.\n\nAccepting the request would substantially improve cross-strait relations while inevitably escalating territorial disputes with neighboring countries. A refusal risks alienating the two sides further."
 ROC.10.a:0 "Taiwanese? Barely know them."
 ROC.10.b:0 "Born of the same root..."
 ROC.11.t:0 "Refusal from Beijing"
 ROC.11.d:0 "Beijing has replied to our request for joint oil development in the South China Sea. Predictably, given the highly complex situation in East Asia and the CCP's demands regarding \"territorial sovereignty,\" the mainland Chinese government cannot support any form of Taiwanese development plans in those waters.\n\nThe Ministry of Foreign Affairs expressed regret over this decision and advised us to seek alternative energy solutions."
 ROC.11.a:0 "Chinese? Doesn't know them at all!"
 ROC.12.t:0 "Approval from Beijing"
 ROC.12.d:0 "As expected, the mainland Chinese government agreed to our request for joint oil development in the South China Sea. The Taiwanese government will secure extraction rights for a portion of the region's crude oil alongside technical support from mainland China.\n\nThis move provoked fierce condemnation from media in Vietnam, the Philippines, and other neighboring countries. Even so, it has significantly improved cross-strait relations and secured Taiwan's energy supply."
 ROC.12.a:0 "Why the bitter rivalry?"
 ROC.13.t:0 "A Single Night"
 ROC.13.d:0 "As summer approached, a bright, clear moon often hung in the night sky. Its pale light stretched across the darkness and settled over the earth. Beneath it, the quiet longing of those below seemed to reveal itself completely, blending into a weightless mist that rested over the mountains.\n\nOld Xia, after enjoying the view, swallowed a few painkillers. The ache in his lower-leg joints had kept him tossing and turning for decades, and after a few days in the mountains, the old pain had been acting up more than usual. He sighed, straightened himself up, and pushed open the faded brown wooden door. Moonlight met him on the other side.\n\nEverything looked clean and still. Nothing had changed, except for the faint wash of the moon's radiance over it all.\n\nOld Xia glanced up at the thin crescent moon, then slowly made his way deeper into the bamboo grove. He followed the stone path as moonlight slipped in and out the leaves. The night air, caught between spring and summer, was neither muggy nor dry. Every now and then, a cool breeze moved through the grove, setting the bamboo leaves rustling and tugging at the folds of his blue-green clothes and the thin, brittle strands of his hair.\n\n\n\nDong—dong—dong—\n\nThe distant toll of a bell rolled through the bamboo and hung in the wind. It was the kind of night that could make a man think about things larger than himself. The great thinkers of the past, faced with this wind, this moon, this path, and this grove, might have found themselves thinking of their own lives, of other people, of the fate of the nation, of duty, and of the world—of everything that had come before and everything unfolding before their eyes.\n\nOld Xia felt his chest tighten. He was no great thinker, but the better part of his life was not so different from the sad stories people told in teahouses and street-corner shops to pass the time.\n\nEvery tragedy had a main character stubborn enough to survive. Bamboo was like that, wasn't it? It spent most of its early life hidden and unnoticed, then suddenly shot toward the sky. Joint by joint, leaf by rustling leaf, it grew firm, took shape, spread, and broke through the soil. A bamboo grove was a whole life laid out before him.\n\nAt the deepest point in the grove, Old Xia sat on a stone bench and let the wind wash over him. The stillness made him think of his mother. Of all the regrets a person could carry, she was perhaps the one wound he had never been able to close.\n\nHis mother. His mother.\n\nHer arms had been so warm. He could lie there while an entire day slipped quietly by—through the strands of her hair, through the gentle way she patted her beloved child on the back, through the half-formed sounds of a child learning to speak. And in the hearts of the few people closest to her—her husband, her own mother, her friends, her beloved child—she had left marks that time could never erase.\n\nOld Xia remembered the faint wrinkles on her face when he left.\n\nHe smiled, then trembled as a sob caught in his throat. He had grown old, but the memory was still painfully sharp. It felt like a train suddenly slowing after running at full speed, though the force of it hit only when he looked back. It left him helpless, like a child who had done something wrong and was too afraid to go home and face his mother.\n\nOld Xia stood. His body felt strangely light, and the wind had picked up. He remembered what he had asked of his son: when the time came, he wanted to be buried on the mainland.\n\nHe knew he would never make it back himself. But perhaps regret and wanting too much were part of what made people human. He had been selfish—selfish enough to leave his son with the burden of carrying out his final wish.\n\nOld Xia's breathing slowly grew calm. His eyelids became heavy, and he lay down among the shadows of the bamboo. Moonlight poured through the leaves and danced across the ground. The sky was clear.\n\nSomewhere in the haze, he heard his mother calling him.\n\nThe child who had been too afraid to come home was finally going back—back to his mother's side."
 ROC.13.a:0 "The unpredictability of life."
 ROC.19.t:0 "A Prodigal Son's Turnaround"
 ROC.19.d:0 "In the latest round of senior personnel changes announced by the Republic of China Armed Forces, Kung Nai-te has been appointed deputy commander of the Army's Sixth Corps and promoted to lieutenant general. His promotion makes him the first person in the nation's history to rise from the ranks of the volunteer enlisted force to three-star command.\n\nDescribing himself as a \"wayward youth,\" Kung had a rowdy student life. Sharing a dorm room with his older brother, he often spent his nights at clubs and got into street fights. His life changed course only after he received his military draft notice.\n\nAlthough Kung initially sought to remain in uniform as a noncommissioned officer, his application for such was unsuccessful. In 1992, he decided to enroll in a reserve officer training progra, which eventually led to him entering the volunteer force and recieving his commision as a second lieutenant.\n\nThroughout his military career, Kung distinguished himself through his ambition, determination, and relentless drive to improve. On one occasion, he spent an entire night practicing how to field-strip a machine gun. He later earned widespread praise while commanding the ROC Army's 586th Armored Brigade, where he became known for leading from the front and looking after the welfare of his troops.\n\nHis remarkable rise has inspired confidence among the rank and file, proving that even an ordinary enlisted soldier can one day rise to the highest levels of command."
 ROC.19.a:0 "Our nation needs more talent like this."
 ROC.20.t:0 "Davos Youth Leadership Camp"
 ROC.20.d:0 "Chen Tzu-hsuan took the presentation remote and stepped forward to deliver the final segment of her team's presentation. Facing a room filled with policymakers and leading academics from Europe and North America, she could not help but feel a little nervous. But her team had spent days preparing for this moment, and she was confident that they could show the world what Taiwan's younger generation had to offer.\n\nWhen the presentation concluded, the hall erupted in applause. Tzu-hsuan lowered the remote and returned to her place beside her teammates. Together, they waited with bated breath for the panel's final assessment.\n\n\"First, I would like to thank our young delegates from Taiwan for joining us here at the World Economic Forum. It is a privilege to see so many talented young people gathered here today,\" said an elderly man with a timeworn face as he took the microphone. \"Allow me to introduce myself. My name is Klaus Schwab. Your report's 'Vision for a New World' resonates deeply with me, particularly its focus on sustainability. Taiwan has already made considerable progress on environmental policy, but as I understand it, the country still has some ground to cover compared with Europe, North America, and even China. This is especially true in areas such as housing and food consumption, where traditional attitudes remain deeply entrenched. How do you propose addressing these challenges?\"\n\n\"Going forward, we hope to expand public housing,\" Tzu-hsuan replied, taking the microphone. \"We also intend to harness emerging metaverse technologies to reshape people's dietary habits. In doing so, we can help Taiwan build a brighter future and take its place in a new global order.\"\n\nThe hall once again erupted in thunderous applause. All across the audience, hands shot into the air as attendees eagerly vied for the chance to ask the delegates..."
 ROC.20.a:0 "\"I understand. Thank you for your reply.\""
 ROC.21.t:0 "Trump Announces Military Aid to Taiwan"
 ROC.21.d:0 "With tensions mounting across the Taiwan Strait, U.S. President Donald Trump announced at a press conference that his administration would provide Taiwan with an \"unprecedented package of defensive military assistance.\" The package would include air-defense missiles, radar systems, unmanned aircraft, and a limited number of anti-ship weapons. \"Taiwan is fighting for freedom,\" Trump declared. \"The United States will not stand idly by.\"\n\nThe announcement immediately drew international attention. While the initiative enjoyed broad bipartisan support in Congress, the Chinese Foreign Ministry \"strongly condemned\" the decision and warned Washington against \"playing with fire.\" The Pentagon stated that it would review the available delivery mechanisms, while emphasizing that all military assistance to Taiwan would be defensive in nature and provided within the framework of existing U.S. law.\n\nSoon afterward, American cargo vessels began arriving at the Port of Kaohsiung. The ROC Army's 58th Artillery Command, the Air Force's Tactical Reconnaissance Group, 4th Tactical Fighter Wing, and 5th Tactical Composite Wing, as well as the Navy's 256th Submarine Squadron, took delivery of a wide range of advanced weapons systems. These included M142 HIMARS multiple-launch rocket systems, SLAM-ER standoff air-to-surface missiles, MQ-9B SeaGuardian unmanned aircraft, Mk 48 Mod 6 Advanced Technology heavyweight torpedoes, and Harpoon Coastal Defense Systems. The new equipment greatly enhanced Taiwan's combat capabilities, giving its armed forces renewed confidence in their ability to defend the island's coastline.\n\nBeijing reacted furiously. China's Taiwan Affairs Office and Foreign Ministry held daily press conferences to denounce the deliveries, while the People's Liberation Army stepped up naval incursions across the median line and conducted repeated military flights around Taiwan in an effort to ratchet up the pressure. In response, the ROC Armed Forces repeatedly scrambled aircraft and dispatched naval vessels to monitor and intercept the approaching Chinese forces.\n\nTaiwan's foreign and defense ministries expressed their gratitude to the United States for delivering the weapons with exceptional speed. Both ministries also voiced hope that additional arms packages could be arranged the following year."
 ROC.21.a:0 "The Arsenal of Democracy truly lives up to its name."
 ROC.22.t:0 "Pelosi Visits Taiwan"
 ROC.22.d:0 "U.S. House Speaker Nancy Pelosi arrived in Taipei aboard a government aircraft before addressing lawmakers at the Legislative Yuan. In her remarks, she reaffirmed Washington's support for Taiwan's democracy, declaring that \"Taiwan is not alone\" and calling for closer ties between Taiwan and the United States.\n\nChina's Eastern Theater Command responded by launching what it described as \"joint combat exercises around Taiwan.\" Chinese naval and air forces conducted large-scale live-fire drills in waters surrounding the island, rehearsing operations including a joint blockade, strikes against defended targets, and area denial. Several ballistic missiles passed over Taiwan itself, prompting the island's armed forces to heighten their air-defense readiness.\n\nThe escalation alarmed the international community. Although governments differed in their responses, the exercises were widely seen as another serious deterioration in relations between Beijing and Washington."
 ROC.22.a:0 "A toast to Taiwan-US friendship!"
 ROC.17.t:0 "We Held Kinmen"
 ROC.17.d:0 "\n\n\n                                                          £GFX_MND_event_texticon3   \n\n\n\n\nAfter several days of high-intensity standoff, the Kinmen Defense Command successfully thwarted the enemy forces' landing and control attempts. The enemy first posed a dense threat to the Liaoluo Bay and Guningtou line with rocket artillery and drone swarms, followed by dispatching small-scale amphibious assault detachments to try and establish a beachhead. Our garrison forces relied on established positions and anti-landing fire networks to block them; the Coast Guard and Navy vessels cooperated to blockade near-shore waters, while Air Force fighter jets provided cover within controllable airspace.\n\nAt the peak of the standoff, positions around Guningtou faced the risk of being breached multiple times, but the defenders rapidly sealed the gaps using mobile reserves and anti-armor firepower. By last night, the enemy's remnant assault forces were forced to withdraw from near-shore waters, and their subsequent forces failed to provide effective reinforcement. Kinmen's main facilities and administrative systems remain operational, and supply lines on the island have not been cut.\n\nHowever, the communist forces continue to maintain a high state of combat readiness along the Fujian coast, with no significant decrease in artillery and drone activity. The current result is a localized and phased victory; the theater command has ordered continuous reinforcement of defensive networks and increased reserve mobilization to deter any future attacks. The overall posture of the Kinmen defense area is stable, but the situation remains uncertain."
 ROC.17.a:0 "Everything is fine, for now."
 ROC.18.t:0 "Bombardments Reported in Kinmen"
 ROC.18.d:0 "In the early hours of the day, a massive artillery duel erupted between the coast of Xiamen and the Kinmen defense zone. The People's Liberation Army had initiated the engagement by subjecting Kinmen's defenses to heavy artillery fire, followed by successive waves of long-range rocket and drone strikes. Kinmen forces returned fire, resulting in an intense exchange that lasted several hours; explosions and air-raid sirens were also reported in parts of the Xiamen coastal area.\n\nAs satellite data from multiple nations and news reports tracked the escalating situation, the PLA advanced with amphibious landings and helicopter-borne airborne operations under the cover of suppressive fire. Kinmen's defending troops attempted to organize a resistance against the invasion, but faultered against the overwhelming amount of PLA forces. By that evening, key high grounds and administrative centers had fallen, and organized military resistance on the island had effectively ceased.\n\nThe battle resulted in casualties and infrastructure damage on both sides, with naval and airport facilities sustaining severe damages. The PLA subsequently announced that it had secured full control over the Kinmen area and initiated follow-up operations to clear the zone and establish control."
 ROC.18.a:0 "The flames envelop the Taiwan Strait..."
 taiwan.33.t:0 "Second Wave of Missile Strikes!"
 taiwan.33.d:0 "The war of life and death has returned to the Republic once more.\n\nOnly a few days after the beginning of the Fourth Strait Crisis, missiles from the Mainland have, for the first time, struck our key infrastructure and cities. While the Ministry of National Defense scrambles to mobilize reserve personnel and prepare for defense, a second wave of missile strikes has descended upon us-this time devastating our administrative and communication capabilities.\n\nYet, the few surviving radar stations have picked up something far more terrifying: countless amphibious assault ships and their escorts are now rapidly approaching our shorelines, signaling an imminent invasion. This can mean only one thing- the Fourth Strait Crisis has turned into an invasion of Taiwan.\n\nDespite the absence of the United States, we are not alone. Intervention forces from the PDTO are now assisting in our defense across all theatres, standing shoulder to shoulder with us on the shorelines against the communists.\n\nWe must now fight and remain defiant against the Red Dragon. Should we fail, the last bastion of Chinese democracy will be forever extinguished."
 taiwan.33.a:0 "Fight! Fight! Fight!"
 ROC.34.t:0 "Military Aid from Japan and Austrailia"
 ROC.34.d:0 "In the wake of the Invasion of Taiwan, Tokyo passed an emergency cabinet resolution authorizing the Self-Defense Forces to airlift air defense system components, anti-ship missile spares, tactical communication platforms, and unmanned reconnaissance equipment to Taiwan. Japan's Maritime Self-Defense Force vessels also began conducting escort and intelligence support missions in the surrounding waters to secure transport routes. Meanwhile, Canberra announced an additional support package, delivering batches of man-portable air-defense systems, anti-armor systems, field radars, ammunition, and engineering equipment to airfields in both northern and southern Taiwan. Australian military advisors and technical personnel accompanied the shipments to assist with equipment integration, operational training, and the establishing of a joint coordination center with Taiwan’s Ministry of National Defense."
 ROC.34.a:0 "Thank you!"
 ROC.35.t:0 "日澳送來大量軍事援助"
 ROC.35.d:0 "東京方面通過內閣緊急決議，自衛隊調派大量C-2與C-130運輸機，自沖繩與九州基地起飛，連續數日空運防空系統組件、反艦飛彈備件、戰術通信平台與無人偵察設備。而日本海上自衛隊艦艇在周邊海域執行護航與情報支援任務，確保運輸航線安全。與此同時堪培拉隨後公布追加支援方案。澳大利亞國防軍啟動最大規模後勤投送行動，C-17戰略運輸機經達爾文與關島轉場，將成批便攜式防空武器、反裝甲系統、野戰雷達、彈藥與工程器材運抵台灣南北機場。澳軍顧問與技術人員隨行，協助完成設備整合與操作訓練，並與台灣國防部建立聯合協調中心，加速物資分發至各作戰區。"
 ROC.35.a:0 "ほんとにありがとうございます"
 ROC.36.t:0 "National Day of the Republic of China"
 ROC.36.d:0 "October 10 is the National Day of the Republic of China, commemorating the 1911 Xinhai Uprising and the subsequent founding of the Republic. Established in the early republican era, this official holiday has endured through changing times. It symbolizes the establishment of the republican system and the legacy of constitutionalism, serving as a moment for the public to reflect on history together.\n\nFlag-raising ceremonies and celebrations take place across Taiwan on this day. At the rally in front of the Presidential Office Building, the president delivers an address reviewing the nation's progress and outlining future directions. Depending on the year's schedule, the government may hold military parades or large-scale performances. Aerial formations fly overhead, and fireworks illuminate city landmarks at night. If the holiday falls on a long weekend, society at large organizes various public events, from concerts to cultural exhibitions, adding to the festive atmosphere.\n\nOverseas communities and diplomatic missions also host receptions and ceremonies to mark the occasion alongside allied representatives. Although public opinion is diverse and historical perspectives differ, the National Day puts the continuity of the state and its institutions on full display. As a commemoration of the republic's founding and development, the holiday retains a highly symbolic role in contemporary society."
 ROC.36.a:0 "Long live the Republic of China!"
 ROC.37.t:0 "February 28th Incident Memorial Day"
 ROC.37.d:0 "In 1947, amidst the postwar transition and social unrest, a protest sparked by a dispute over contraband cigarettes rapidly consumed the island. The ensuing military crackdown and pacification campaigns saw countless civilians and local elites arrested, while others simply disappeared or were killed. The trauma of that period permanently altered Taiwan's political trajectory and generational memory.\n\nThe Febuary 28th Incident is not merely history; it remains an ongoing debate over accountability and human rights. Following the end of martial law and subsequent democratization, the government began declassifying archives, establishing compensation mechanisms, and erecting memorials were across the country. Public sentiment on this day is particularly sensitive. Some emphasize the need for transitional justice, while others worry that politicizing these memories will only deepen societal divides. Amid these intertwined perspectives, the day serves as a public moment to reflect on the relationship between the state and its citizens."
 ROC.37.a:0 "A moment of silence for the victims."
 ROC.40.t:0 "Let bygones be bygones"
 ROC.40.d:0 "Amidst the raging conflict, DPP leader Tsai Ing-wen—who would normally be sheltered in a bunker—planned a public appearance in Taipei, accompanied by figures including her political rival Han Kuo-yu and leaders from other parties. The atmosphere in the meeting room was solemn; representatives from the three parties, who had long clashed in the Legislative Yuan, were now huddled together, quietly discussing the same briefing document. \n\nHan Kuo-yu attended the meeting as a key figure of the KMT. He stated that while partisan competition could continue, a unified stance regarding the war effort was essential; he also volunteered to assist with the allocation of supplies in the south and the integration of civilian mobilization networks. Tsai Ing-wen responded that stabilizing public confidence was the top priority and pledged full administrative support for any cross-party cooperation. The two subsequently appeared at a joint press conference to convey a unified message and emphasize their resolve to resist the aggression. \n\nDays later, Han Kuo-yu personally coordinated donations of generators and medical equipment from local businesses, while the DPP headquarters utilized its network of party officials and elected representatives to manage distribution and registration. The media captured a moment of brief conversation between the two while they were visiting troops on the front lines; gone was the fierce rhetoric of past political battles, replaced by shared encouragement for the morale of the rank-and-file soldiers. For many supporters, that moment symbolized not only a reconciliation in Taiwanese politics but also a profound commitment to the island's well-being. \n\nEven as the shadow of war loomed, the Legislative Yuan took the rare step of passing a cross-party resolution supporting a special budget and legislation for reserve force reform. Photos of the two party leaders shaking hands in the legislative chamber were widely circulated. In these tense times, two parties with deep-seated differences chose to stand side-by-side against an overwhelming threat."
 ROC.40.a:0 "At this moment, we are all here to defend our home and country."
 ROC.41.t:0 "Chaos in the Phillipines"
 ROC.41.d:0 "Over the past few weeks, internal security in the Philippines has rapidly deteriorated. The National Democratic Front has launched successive offensives across northern Luzon, occupying transit nodes and striking power and communication infrastructure to weaken central government control. Concurrently, the Moro Islamic Liberation Front has expanded armed operations in Mindanao, seizing several towns and port areas before declaring a state of war.\n\nPhilippine government forces have imposed martial law around Manila and key central regions, mobilizing main army units for localized sweep operations. However, strained by dispersed troops and damaged supply lines, frontline advances have stalled, forcing some garrisons into defensive retreats. Complicating the situation, the navy has declared neutrality. By restricting itself to maritime patrols and humanitarian evacuations, it refuses to intervene in land-based clashes, severely limiting coastal supply runs and troop transport capabilities.\n\nArmed conflicts are now erupting across the archipelago nation. With the Phillipines' trasnport network having mostly collapsed, local governments have become paralyzed. If control over key regions is not restored in the short term, the scale of the conflict will inevitably expand."
 ROC.41.a:0 "Ugh, couldn't this get any more chaotic?"
 ROC.42.t:0 "Civil War in the Philippines"
 ROC.42.d:0 "The situation in the Philippines has escalated from localized clashes into a full-scale civil war. The National Democratic Front has established a continuous zone of control in the mountainous regions of northern Luzon, declaring the formation of the National Democratic Front of the Philippines while systematically sabotaging major highways and energy facilities. Government forces are holding fast in Metro Manila and several military bases, mobilizing reserves in an attempt to restore transit lines and administrative order.\n\nIn Mindanao, the Moro Islamic Liberation Front has fully taken over local government organs across multiple provinces. They have established an independent command structure and engaged in fierce firefights with government troops. Severe damage to multiple airports and seaports during these battles has pushed the supply system to the brink of collapse. The Philippine Navy has announced a stance of armed neutrality, executing blockades and evacuations along major sea lanes without providing direct fire support to any faction. This has fractured the battlefield into a complex landscape of land-based division and maritime standoffs.\n\nAll factions now claim to be the sole legitimate government of the Philippines, fighting to claim the islands as their own."
 ROC.42.a:0 "Absolute madness."
 ROC.43.t:0 "The National Democratic Front Unites the Philippines"
 ROC.43.d:0 "After a prolonged armed conflict, the National Democratic Front has secured control over major cities and transport hubs across Luzon, Visayas, and Mindanao. Remaining armed factions have either collapsed or accepted integration. The NDF promptly proclaimed the establishment of the \"Democratic Republic of the Philippines\" in Manila, forming a provisional central committee to take over the national administrative and military apparatus.\n\nThe previously neutral naval command issued a joint statement recognizing the new regime as the sole legitimate government of the Philippines. Integrating all fleets and maritime forces into the Republic's command structure, they emphasized the protection of national unity and sea lane security.\n\nThe newly formed Democratic Republic of the Philippines then issued a diplomatic bulletin announcing its entry into the East Asian Defense Initiative, establishing security cooperation and intelligence-sharing mechanisms with regional member states. This decision marks a major shift in national strategy, signaling that future military development and foreign policy will center around a regional collective defense framework."
 ROC.43.a:0 "A Philippine Spring?"
 ROC.44.t:0 "Government Forces Reunite the Phillipines"
 ROC.44.d:0 "After a prolonged armed conflict, Philippine government forces have gradually retaken the mountainous regions of northern Luzon and the major cities of Mindanao. Remaining armed factions have either collapsed or accepted integration. Manila has resumed central administrative operations, with the Presidential Palace and Congress declaring the full restoration of the Republic's constitutional order. The country now enters a phase of post-war reconstruction.\n\nThe previously neutral naval command issued a joint statement recognizing the new administration as the sole legitimate government of the Philippines. Integrating all fleets and maritime forces into the Republic's command structure, they emphasized the protection of national unity and sea lane security.\n\nThe newly established Republic of the Philippines then issued a diplomatic bulletin announcing its entry into the Pacific Defense Treaty Organization, establishing security cooperation and intelligence-sharing mechanisms with regional member states. This decision marks a major shift in national strategy, signaling that future military development and foreign policy will center around a regional collective defense framework."
 ROC.44.a:0 "Same as usual."
 ROC.45.t:0 "The Moro Islamic Liberation Front Unites the Philippines"
 ROC.45.d:0 "After a prolonged armed conflict, the Moro Islamic Liberation Front has achieved military control over Mindanao, Visayas, and key cities in Luzon, with remaining armed factions either collapsing or accepting integration. Its leadership committee declared the establishment of the \"Islamic State of the Philippines\" in Manila, abolishing the old Republic's constitutional framework to build a state apparatus centered on religious law and restructuring the national military and political systems.\n\nThe previously neutral naval command, however, declared the current government illegitimate.\n\nThe newly formed Islamic State of the Philippines subsequently issued a diplomatic bulletin announcing the implementation of Sharia law. Reports indicate that weapons and personnel from the East Asia Defense Initiative Agreement and the Pacific Defense Treaty Organization are being secretly shipped to the Philippine naval government, which had previously refused to state a position."
 ROC.45.a:0 "The End of the Philippines..?"
 ROC.46.t:0 "Naval Junta Unifies the Philippines"
 ROC.46.d:0 "After successfully eliminating Islamic extremist militants, the Philippine Navy Command retook Manila and all major islands across the country. They announced the formal restoration of the Republic of the Philippines, with a naval junta temporarily managing transitional affairs.\n\nThe junta then issued a diplomatic statement declaring its formal entry into the Pacific Defense Treaty Organization (PDTO), reaffirming security cooperation with Japan and regional allies to defend maritime corridors."
 ROC.46.a:0 "Order Returns to the Pacific"
 ROC.47.t:0 "Naval Junta Unifies the Philippines"
 ROC.47.d:0 "After successfully eliminating Islamic extremist militants, the Philippine Navy Command retook Manila and all major islands across the country. They announced the formal restoration of the Republic of the Philippines, with a naval junta temporarily managing transitional affairs.\n\nThe junta then issued a diplomatic statement declaring its formal entry into the East Asia Defense Initiative (EADI) to establish security cooperation with regional defense partners."
 ROC.47.a:0 "A New Strategic Direction"
 ROC.50.t:0 "Taipei Combat Report"
 ROC.50.d:0 "\n\n\n                                              £GFX_MND_event_texticon3   \n\n\n\n\nTo: Ministry of National Defense and General Staff Headquarters\n\nEarly this morning, under the suppression of massive artillery fire and drones, the PLA launched a full-scale offensive against the urban area of Taipei. The enemy's main force broke through the outer defense lines from the Tamsui River estuary and Xinzhuang, and executed forced river crossings around Guandu and Shezi. Urban communication and power facilities were successively struck, while Songshan Airport and surrounding positions fell under continuous fire coverage. The JSDF, coordinating with our armored and mechanized infantry, organized counterattacks along the Shilin-Neihu line; meanwhile, Korean volunteer forces held firm in the Zhongshan and Wanhua districts, covering the evacuation of civilians.\n\nDespite fierce resistance from all units and the planned destruction of multiple bridges and transportation hubs, the enemy's significant advantage in troop numbers and firepower gradually severed connections between urban districts. Our command system was severely disrupted by concentrated strikes, and supply lines were also cut. By evening, the municipal core and positions around the Presidential Office had successively fallen. Remnant forces are transferring to Yangmingshan and the Nangang hills, preparing to continue resistance relying on the mountainous terrain.\n\nBased on the above, the urban area of Taipei has now fallen. All participating units are reorganizing to await further combat orders."
 ROC.50.a:0 "Withdraw to the mountains, continue the resistance."
 CHI_taibei_invade2_tt:0 "§RTaipei has been lost§!"
 ROC.51.t:0 "Taichung Combat Report"
 ROC.51.d:0 "\n\n\n                                              £GFX_MND_event_texticon3   \n\n\n\n\nTo: Ministry of National Defense and General Staff Headquarters\n\nSince last night, the PLA has concentrated long-range firepower and air assault forces to continuously suppress the Taichung area, launching penetrating advances from the coast and Dajia River directions. Enemy forces rapidly seized the outer positions of Ching Chuan Kang Airport, and subsequently pushed southward along the city's elevated expressways with armored and mechanized infantry, aiming to split our defense system. JSDF detachments, together with our garrison forces, held the core facilities of the harbor and industrial zones, while the Australian Defence Force constructed anti-armor positions along the Dadu Mountain line to cover the main force's redeployment.\n\nDuring the engagement, urban communications were frequently interrupted, and some bridges and interchanges were demolished as planned to delay the enemy's advance. However, the enemy's significant firepower advantage allowed multiple columns to advance simultaneously, gradually compressing our defensive depth. Ching Chuan Kang Airport and harbor facilities successively fell, and the municipal core plunged into chaos under continuous bombardment. By evening, the enemy completed the encirclement of the urban area; our chain of command suffered severe damage, and supply lines were severed.\n\nBased on the above, the urban area of Taichung has now fallen. All participating units are transferring toward Dasyueshan and the western foothills of the Central Mountain Range, relying on the mountainous terrain to reorganize combat strength while maintaining coordination with allied forces, awaiting further combat instructions."
 ROC.51.a:0 "If we preserve our forces but lose territory, both will be preserved."
 CHI_taizhong_invade2_tt:0 "§RTaichung has fallen§!"
 ROC.52.t:0 "Kaohsiung Combat Report"
 ROC.52.d:0 "\n\n\n                                              £GFX_MND_event_texticon3   \n\n\n\n\nTo: Ministry of National Defense and General Staff Headquarters\n\nThis morning, under the coordination of long-range firepower and naval and air forces, the PLA launched a general offensive on the Kaohsiung region. Enemy ships executed suppressive fire from offshore, while drones and missiles continuously struck harbor oil depots, communication nodes, and positions around Zuoying. Joint forces of our military and the Australian Defence Force constructed defenses relying on harbor storage facilities, urban arterial roads, and the high ground of Shoushan, attempting to attrite enemy forces with defense in depth and covering the transfer of critical equipment.\n\nAfter several hours of engagement, enemy armored and mechanized infantry penetrated from the directions of Nanzih and Fongshan, gradually cutting off connections within the urban area. Multiple facilities in the harbor caught fire under bombardment; cross-harbor bridges were demolished according to plan, but this still struggled to halt the enemy's continuous pressure. ADF detachments executed anti-armor blocking actions along the Daliao line, while our garrison forces engaged in street-to-street fighting in the municipal core. The battle was intense, and casualties continued to mount.\n\nBy evening, the enemy completed their control of Kaohsiung Port and the city's main administrative facilities; our supply lines were completely severed, and the command system was severely damaged.\n\nBased on the above, the urban area of Kaohsiung has now fallen. All units are transferring toward Cishan and the southern section of the Central Mountain Range, relying on the mountainous terrain to reorganize combat strength while maintaining coordination with allied forces, awaiting further combat instructions."
 ROC.52.a:0 "Worst comes to worst, we'll just fight a guerrilla war."
 CHI_gaoxiong_invade2_tt:0 "§RKaohsiung is lost§!"
 ROC.53.t:0 "Hualien Combat Report"
 ROC.53.d:0 "\n\n\n                                              £GFX_MND_event_texticon3   \n\n\n\n\nTo: Ministry of National Defense and General Staff Headquarters\n\nEarly this morning, the PLA launched multi-pronged assaults along the Suhua Highway and the coastline, continuously suppressing Hualien Port and airport facilities with long-range firepower. Leveraging air superiority and drone reconnaissance, the enemy conducted precision strikes against our command nodes and supply lines, causing battlefield communications to be interrupted multiple times. Our garrison forces, in coordination with ADF and JSDF detachments, constructed defensive positions around the harbor, the airport, and the Meilun Mountain line, covering the evacuation of urban residents and attempting to delay the enemy's advance.\n\nAs enemy armored units broke through the northern defense line, Hualien Port's main berths and the airport runway successively fell. Multiple bridges and tunnels along the Suhua route were damaged in the fighting, completely paralyzing the transportation system. Japanese and Australian allied forces executed a covering retreat toward Taroko, while our forces engaged in urban street fighting to buy time. However, under continuous fire suppression and numerical inferiority, our defense lines were gradually compressed.\n\nBased on the above, by evening, the urban area of Hualien and its key facilities have been controlled by the enemy. Remnant forces are transferring deep into the Central Mountain Range, relying on the mountainous terrain to reorganize combat strength while maintaining coordination with allied forces, awaiting further combat instructions."
 ROC.53.a:0 "If we hold on, there will be a way."
 CHI_hualian_invade2_tt:0 "§RHualien has been lost§!"
 CHI_hualian_invade3_tt:0 "§RThe Executive Yuan estimates that the future reconstruction of the area will be extremely difficult.§!"
 CHI_hualian_invade4_tt:0 "§RThe Politburo anticipates that the region's future reconstruction will be extremely difficult.§!"
 ROC.55.t:0 "Philippine Presidential Election"
 ROC.55.d:0 ""
 ROC.55.a:0 "Ferdinand Marcos Jr."
 ROC.55.b:0 "Leni Robredo"
 ROC.55.c:0 "Manny Pacquiao"
 ROC_CHI.2.t:0 "Crossfire"
 ROC_CHI.2.d:0 "For the past few days, Chinese missiles and warplanes had been bombarding the area. Power in downtown Taichung had long since cut off, and the local hospital was barely clinging on with its last few generators. Chen Jianhong sat by his father’s bedside, clutching a yellowing family photograph. It had been taken during the Mid-Autumn Festival five years ago: his father beaming on the right, himself fresh out of school in the center, and his mother smiling happily on the left. Now, only a bloodless, pale face lay before him. His father’s lung cancer had already been worsening, and with the breakout of war, chemotherapy drugs had run out. The only treatment left for Chen's father was half a bottle of morphine. Last night, the elderly man in the bed next to his father's had breathed his last. It could only be a matter of time before his father met the same fate.\n\n \"Dad, I'm going to go find some food. Just hang in there,\" Chen weakly whispered. After struggling to stand up, he made his way downstairs. After a missile had destroyed the factory he worked at, Chen had become unemployed. His family's savings were also long gone, and his mother had died two days ago after being trampled by a panicked crowd during a PLA missile strike. \n\nChen made his way down the blood-stained, glass-laden corridor. The wounded and their families packed the hallways; some wailed while clutching severed limbs, while others sat dazed in corners. The windows in the stairwell were shattered, and the wind rushing in carried the acrid smell of burning and the muffled thuds of distant explosions. Chen continued to decend the staircase, his mind focused on a single thought: getting his father a hot meal so he wouldn't starve to death. \n\nAs he stepped out the hospital, the ice-cold night was suddenly spit by a blinding streak of fire in the sky. A spit second later, a deafening blase tore through Chen's eardrums, making the world shake violently. Lifting his face off the pavement, Chen looked behind. The east wing of the hospital had been hit. The very same part that his father was in. Chen stared with hollow eyes at the firey aftermath. \"Dad...\"\n\nIn the distance, the rapid crunch of reservist and emergency responder's boots approached Chen. Bearing flashlights and rosters, they had rushed over to search for survivors. \"You! ID card!\" The squad leader gripped Chen, still staring at the burning hospital. Chen Jianhong did not struggle; he simply took one last look at the burning hospital. His hollow eyes were now gone, his pupils now filled with flames of pure hatred."
 ROC_CHI.2.a:0 "Now with a cold gaze, he turned his head toward the opposite shore."
 ROC_CHI.3.t:0 "Unspoken Regrets"
 ROC_CHI.3.d:0 "Minxuan wiped the sweat off her brow. As the sun set on another day, its slanted rays reminded her of when high school students would usually return home; couples wandered by in twos, groups of friends would go out for a meal. Zhu Minxuan could still vividly recall her boyfriend's hand; whenever the final bell rang, she would snatch up her schoolbag and dash toward the gate, desperate to find him the moment she stepped out.\n\n Minxuan had always longed to escape with him from the buisiness of life. Setting down a sandbag, she wiped the dirt off her hands. The once crisp-white student uniform from her time in high school had been replaced by a camo-green combat uniform. She had returned to her alma mater in a way she never could've imagined: after failing the college entrance exam, her family had sent her to military academy. Meanwhile, her boyfriend had gone north for his studies, and as the distance grew between them, they had gradually lost touch. She wondered how he was doing now. \n\nHaving stacked sandbags at every school entrance and exit, Minxuan's company commander ordered the clearing of the desks and chairs from the remaining classrooms—moving some to the makeshift company command post and dragging the rest onto the street to serve as makeshift barricades. As dusk neared, the final classroom was finally cleared. Minxuan let out a long sigh of relief, but out of the corner of her eye, she caught a glimpse of something white amidst the pile of furniture. She picked it up and discovered that it was a letter addressed to her in three large, scrawled characters: To Minxuan. \n\nMinxuan knew she shouldn't be reading a letter while preparing for combat, yet she couldn't resist opening the envelope. Inside was a familiar handwriting—a dashing, distinctive script she had often grumbled about back when she used to copy his homework. Halfway through reading, Minxuan realized that most of the letters were already soaked; a torrent of emotions—mingled with tears and sweat—poured out in that moment, revealing feelings that had gone unexpressed all those years ago... \n\nAs she was reading, The blast of a landing missile slammed her violently against the wall. She slumped helplessly to the ground as the letter slipped from her grasp; her consciousness beginning to fade. The love she had once been too shy to confess might now never find its fulfillment."
 ROC_CHI.3.a:0 "A grain of dust from an era is a mountain on an individual's head."
 ROC_CHI.4.t:0 "Communist Crackdown"
 ROC_CHI.4.d:0 "Night settled heavily over the city; streetlights flickered to life one by one, yet failed to pierce the shadows lurking deep within the alleyways. The news had broken in the early evening: the Taiwan People's Communist Party had been officially outlawed, with multiple of its members having been taken in for questioning. No names were released, yet rumors spread rapidly on who might've been arrested. \n\nWu Rongyuan sat in his office; outside the window, the flow of traffic was blurred by the rain into streaks of light. He had left the overhead lights off, allowing only the glow of his desk lamp to illuminate the documents before him. His fingertips rested on the paper, motionless, making no move to turn the page. \n\n \"They moved too fast,\" he murmured.\n\nThe operation was launched in the name of national security—executed with rigorous procedure and tight pacing, leaving virtually no room for error. While they seemingly targeted a singular organization at first, the scope clearly extended far beyond that in his view. Those who had long dwelt on the fringes had suddenly found themsleves thrust into the spotlight. \n\nHis mobile phone lit up briefly with a message, then went dark again. He didn't check it; instead, he withdrew his hand and leaned back in his chair. The sound of a police siren drifted in from outside—sharp and distinct for a moment, then fading into the distance. Silence returned to the office, save for the low hum of the air conditioner.\n\nHe straightened up and began organizing the documents on his desk, calmly and methodically sorting the materials into separate piles.\n\nAs if confirming a fact that had aleady come to pass, Wu muttered, \"Everything is changing."
 ROC_CHI.4.a:0 "It has all grown more tense."
 ROC_CHI.5.t:0 "The Legislative Yuan"
 ROC_CHI.5.d:0 "The atmosphere inside the legislature was already far from calm. Opposition lawmakers had occupied the podium; placards and documents lay scattered about, while the muffled sounds of protest blared repeatedly from loudspeakers outside. Such standoffs were nothing new, yet on this day, the boundaries began to give way.\n\nWhat began as sproadic shouts from crowds outside swelled into a unified roar. Scuffles broke out simultaneously at several entrances between security and protesters, eventually getting overwhelmed by the surging tides of people. Doors were forced open as the voice of the angry mob echoed through the entire hall.\n\nWithin the chamber, all manner of order had disappeared. The conflict-previously fought with words, debates, and parlimentary procedure- had devolved into a face-to-face scuffle. As the lawmakers brawled between desks and chairs, documents were torn from hands, placards were trampled, and all regular conversation had gone out the window. At the speaker's podium, security was attempting to pull apart the fight. \n\nMedia cameras captured the spectacle from the sidelines. The footage showed a state of absolute disorder- only a tangle of figures and constant shouting could be made out. The raw power of the crowd was in play, and as the clamor continued, no one could say for certain how it would all end."
 ROC_CHI.5.a:0 "It's all a mess."
 ROC_CHI.6.t:0 "Liquidation"
 ROC_CHI.6.d:0 "As night fell, the city did not grow quiet. Crowds began to gather on streets across the city; the rising sound of voices layering upon itself like an echo surging up from the ground. Amidst the uncleared ruins of war, a new wave of activity rapidly took hold. \n\nMemorial sites were the first targets. Bronze statues were tilted and toppled under the combined force of ropes and human strength. The sound of metal striking the ground carried far into the night. Glass was shattered and stonework crumbled; the once-quiet spaces were swiftly transformed, leaving behind scattered debris and slogans. \n\nThe crowds continued to spread outward. Flags, slogans, and lights mingled; some shouted aloud, while others followed in silence. Emotions rippled through the people—shifting from repression to direct expression, from passive observation to active engagement. \n\nElsewhere, political institutions and related outposts underwent simultaneous changes. Notices were plastered on doorways, official seals covered old signage, and entrances were seized. Some individuals attempted to leave but were intercepted at street corners. Confrontations quickly escalated, turning into a chaotic mixes of shoving and shouting. \n\nFurther afield, even cemetery did not remain undisturbed. Headstones were shifted and overturned; offerings left for the dead were all left scattered. The crowd there was in constant flux, with some pausing in their tracks while others pressed on. \n\nIntermittent siren wails failed to drown out the overwhelming clamor. The entire city seemed drawn by a single force, a cacophony of voices colliding in the darkness. \n\nWith no end in sight, the chaos continued to grow.."
 ROC_CHI.6.a:0 "The day descends into darkness."
 ROC_CHI.8.t:0 "An International Coalition"
 ROC_CHI.8.d:0 "At Taoyuan International Airport, the runway lights in the pre-dawn darkness guided planes as flights landed one after another. The first to arrive was an international team of retired generals, intelligence officers, and policy advisors from Japan, Australia, and Europe. Clad in low-profile protective gear, they bore no national flags yet carried a clear mandate. After a brief exchange with the officials meeting them, the team leader, Matthew Lee, was immediately escorted away, heading straight for the command center. \n\nMeanwhile, at the Port of Kaohsiung in the south, another group was arriving. A foreign-flagged cargo ship slowly docked. When the hatch opened, it disgorged not freight, but a mixed combat team—retired volunteer soldiers from Eastern European battlefields, private security personnel from Southeast Asia, and a handful of European volunteers bound by strong political convictions. \n\nOn the other side of the airport, the flow of people was more scattered. Volunteers arriving on their own initiative entered the country one by one; some were veterans of conflicts in the Middle East or Eastern Europe, while others arrived carring nother but their combat gear. Their backpacks were stuffed with night-vision equipment and medical supplies, while their faces reflected a multitude of personal reasons for being there. A makeshift registration center operated rapidly—issuing credentials, organizing units, and directing the flow of people—maintaining a semblance of order amidst the chaos. \n\nVarious political groups also appeared to welcome the arrivals; a clash of slogans and stances briefly sparked a commotion, though security personnel quickly quelled the disturbance. \n\nThe Presidential Office issued a statement with a measured tone, simply expressing gratitude to \"those who have chosen to stand with Taiwan.\" Simultaneously, emergency regulations were activated: volunteers were integrated into Taiwan's military, while hired personnel were assigned to specific task forces under contract. \n\nReactions on the streets were mixed. Some hailed the arrivals as a symbol of international support, while others questioned whether the situation was spiraling out of control. Yet, at the front lines, emotions were far simpler—as soldiers speaking different languages ​​dug foxholes side by side, a sense of shared purpose offered a brief respite from the crushing isolation of war."
 ROC_CHI.8.a:0 "International assistance has arrived as well?"
 ROC_CHI.9.t:0 "Dark Night"
 ROC_CHI.9.d:0 "Missiles ripped through the night sky over Taichung, leaving the harbor in flames. Smoke billowed inland from the waterfront, thick with the choking stench of burning fuel. Chen Haoran dragged himself out from behind a toppled shipping container. His ears were still ringing. Overhead, aircraft circled in the distance, the rumble of their engines rolling across the city.\n\nZhang Kailun stood nearby with a scorched rifle in her hands. Shrapnel had opened a gash in her arm, and blood ran down the stock. \"The marines are being overrun... They've already landed helicopters inside the harbor.\" Her voice was barely more than a rasp.\n\nLi Xinyi stumbled toward them, clutching a radio that hissed with static. \"Command isn't answering. The civil defense units have scattered.\" She looked up, frightened but unwilling to give in.\n\nA shrill whistling sound suddenly cut through the air. One after another, white parachutes opened against the glow of the fires, their silhouettes drifting out of the darkness. Xu Zihao watched from behind a shattered wall. \"They're dropping right into the city,\" he said quietly.\n\nAt the corner, beside an overturned taxi, Yang Zhixuan pulled her wounded mother into the shadows. She struggled to keep her breathing quiet as she gripped an iron pipe with both hands, her knuckles white.\n\nAcross the street, Wang Chengen and a handful of reservists crouched behind the remains of a bridge support. They were down to their last few magazines. \"If we give up any more ground, Taichung falls,\" he muttered, panic beginning to creep into his voice.\n\nThe first paratroopers hit the ground, and the shooting began almost at once. Muzzle flashes lit the street. Somewhere beyond the smoke, explosions shook the buildings and sent concrete crashing onto the pavement.\n\n\"Don't let them get organized!\" Chen Haoran shouted as he rose and opened fire. He tracked a soldier who was still descending beneath his parachute and squeezed the trigger. The rounds found their mark. The figure twisted in the air, then fell into the burning harbor below..."
 ROC_CHI.9.a:0 "... and into the flames."
 ROC_CHI.10.t:0 "Second Thoughts"
 ROC_CHI.10.d:0 "On the outskirts of Kaohsiung Harbor, half of a warehouse complex had been reduced to rubble, its steel frame exposed against the night sky. Fires burneing in the distance, their orange glow flickered across the ruins. The remaining members of a PLA squadron had taken cover behind a broken wall. Squad leader Liu Chengye rested his rifle beside him, tapping his fingers against the magazine as if counting the rounds he had left. Private Zhao Zi'ang sat with his back against a slab of concrete, staring blankly at the blood on his boots which weren't his. Nearby, radio operator He Jiahao kept turning the dials on his set, but all he could get through the headset was broken static. Liu made a motion towards him. \"Still nothing from company?\" He Jiahao shook his head. \"I caught part of a transmission. They said to keep advancing. Then it cut out.\" Zhao finally spoke, his voice dry. \"Squad leader, what did we even do today?\" He paused. \"That street this afternoon—we pushed across it, then fell back. Half of us didn't come back.\" Liu said nothing at first. He stared toward the container yard still burning in the distance. After a few seconds, he answered, \"Our mission is to eliminate resistance in the harbor and open a route through.\" His voice was flat, as though he were reciting the orders word for word.\n\nZhao let out a short, humorless laugh. \"All I remember is who went down beside me.\" He looked at his hands. \"They told us this was reunification. That it had to be done. But the people here are fighting harder then a cornered animal.\" He Jiahao took off his headset and lowered his voice. \"They made it all sound so simple. But this has been all but simple.\" He looked from one man to the other. \"We don't even know if there are any friendly units left ahead of us.\" Several shots cracked in the distance, and all three men instinctively ducked lower. Silence settled over them again. Liu finally sat down against the wall. When he spoke again, his voice was quieter. \"The orders haven't changed. We still have to move forward.\" Zhao said nothing. He buried his face in his arms. He switched off the radio to conserve what little battery it had left. Only the distant fires broke the darkness. After a long while, Liu spoke under his breath, as if asking the others—or perhaps himself.\n\n\"If there's nothing left up ahead, how much farther are we supposed to go?\""
 ROC_CHI.10.a:0 "\"We still have to move forward.\""
 ROC_CHI.12.t:0 "Hualien"
 ROC_CHI.12.d:0 "What remained of Hualien's defenders were scattered among the cliffs and ruins between Qixingtan and Xiulin. Lin Zhiwei, commander of a surviving company, sat beside a car. He thought back to when used to be stationed at Chiashan Air Base. Now the whole place was up in flames. He replayed the moment when the landing crafts hit the beach at dawn, with helicopters coming in low over the water. A Type 075 amphibious assault ship opened fire from offshore, pouring shells into the city. The air defenses brought down a few aircraft, but there were always more behind them. Paratroopers landed directly on the airport runway, and our M109s were destroyed by rockets before they could even bring their guns around.\n\n\"Hold Qixingtan!\" Those were the brigade commander's last words before the radio went dead. Five hours into the battle, the beach was covered with charred wreckage and bodies. Lin had taken shelter in the underground garage of a bombed-out hotel alongside a mixed Japanese-Australian detachment. Lieutenant Sho Takahashi sat wounded against the wall, nearly out of ammunition. Australian Sergeant Major Michael Ryan turned his last grenade over in his hand. With a bitter smile, he asked, \"How much longer do you all reckon we can hold?\" Lin didn't answer. He just stared at the message on his phone from before dawn: \"Mom and Dad are in the basement. Take care of yourself.\"\n\nThe shouts of chinese soldiers started echoing throughout the parking lot. Takahashi took his pistol, ready to fire. With a single muzzle flash, he went down immediately. Michael pulled the pin on his grenade and ran into the line of fire. A moment later, the shockwave of the explosion grazed the top of my hair. There was now barely a dozen remaining. Some were crying. Others simply stared into space. A helicopter made a low strafing run, bringing down the entrance and trapping the battered squad beneath dust and broken concrete. The radio had gone silent. They could hear were the occasional screams from outside. \n\nWhen Lin ran out of ammunition, he dropped his rifle and sat against the wall with my combat knife in his hand. Footsteps drew closer outside. A loudspeaker barked at us to surrender. I closed my eyes and thought of my family, the night markets in Taipei, and the bright skies that once stretched over Hualien. Now there was nothing left but fire and ash."
 ROC_CHI.12.a:0 "In a daze, memories of family surface."
 ROC_CHI.13.t:0 "Airborne Operation"
 ROC_CHI.13.d:0 "Smoke hung low over the mountains of Hualien. Fires still smoldered among the trees, and the air reeked of scorched earth and blood. A Taiwanese squad had stopped to rest beneath a towering cliff, their boots scraping softly against the loose rock. Communications had been unreliable since the war began, so they were following a fallback plan to the next rally point in the hope of finding the rest of their unit.\n\nAt the head of the patrol, Lin Zhiwei suddenly crouched and raised a hand. Ahead stood a half-destroyed concrete building, one wall blown open and the interior completely still. \"There's something in there,\" Chen Yiting whispered from behind him, his palms slick with sweat. Before Lin could give an order, automatic fire erupted from inside. Rounds tore across the ground and ricocheted off the rocks. The squad scattered for cover and returned fire, every shot echoing through the valley. After several exchanges, the gunfire from the building abruptly stopped.\n\n\"Keep it covered. Take it slow,\" Lin said, signaling the others forward. They moved along the wall toward the opening. A PLA soldier suddenly stumbled out of the shadows, his uniform covered in mud. Every rifle snapped toward him. Only then did Lin notice the torn parachute tangled in the trees overhead. \"Don't shoot! Friendly! I'm friendly!\" the soldier shouted between breaths. \"Fuck this weather! I barely got out of the plane before a gust blew me all the way over here...\" \n\nThe Taiwanese soldiers exchanged bewildered looks. Their rifles remained trained on him, but no one fired. Chen raised a finger to his lips, then motioned for the others to lower their weapons. He walked over to the paratrooper and, before the man realized what was happening, caught him in a hold and slammed him to the ground. The others rushed in to pin him down while Lin snatched up his Type 95 rifle and tossed it aside. Chen tore the patch from the soldier's sleeve and held it up for the others to see. He belonged to the 161st PLAAF Air Assault Brigade. What a soldier from a PLA air assault brigade doing this far out in eastern Taiwan was a question nobody in the squad could answer. Before they could decide what to do with him, several grenades came sailing through the air. They struck the rocks with a sharp metallic clatter, then exploded around the squad in a storm of dust and debris. The blast threw Lin off his feet. Shrapnel struck him in the chest, and everything went black.\n\nBy the time he opened his eyes, the sun was already up. \"Hey! Is anyone still alive?\"\n\nHe struggled to sit up, but a bolt of pain shot through his chest and forced him to the ground. Every breath felt like it was tearing his lungs apart. Lin managed to call out once more as his blurred vision settled on the mangled bodies scattered across the ground."
 ROC_CHI.13.a:0 "\"W-Where did everyone go...?\""
 ROC_CHI.14.t:0 "Knowing Which Way the Wind Blows"
 ROC_CHI.14.d:0 "It was late, and the wind kept whipping against the canvas walls of the makeshift command tent. Inside, a dim lamp cast shifting shadows across the officers gathered around the table.\n\nBattalion commander Xu Guolin spread out the map and rested a finger on one of the supply routes that had been circled and redrawn again and again. He fell silent for a moment before finally speaking.\n\n\"If this drags on, we won't last more than a few days.\"\n\nHis deputy, Zhao Chengyuan, stood at the edge of the table clutching a canteen, his knuckles white. \"We're almost out of ammunition, and rear command isn't answering. It's only a matter of time before we're overrun.\"\n\nThe tent grew even quieter. Some of the officers lowered their heads. Others stared at the map. No one wanted to say what came next.\n\nFrom the corner, Han Qishan finally spoke, keeping his voice low. \"There may be another way.\"\n\nHe straightened up. \"The other side has already put out feelers. If we cooperate, there won't be any reprisals. We might even keep our posts.\"\n\nXu looked up sharply. \"Where did you hear that?\"\n\nHan met his gaze. \"This didn't start recently.\"\n\nA gust rattled the canvas, making the lamplight flicker. No one said a word.\n\nZhao set his canteen on the table. \"If the outcome has already been decided, choosing a different path may not be such a mistake.\"\n\nSomeone finally asked the question hanging over the room. \"You mean... going over to them?\"\n\nNo one answered.\n\nXu tapped his fingers slowly against the table. He looked down at the map, then around at the men gathered before him, weighing what each face left unsaid. At last, he spoke.\n\n\"Once we do this, there's no going back.\"\n\nHan remained silent in the shadows.\n\nUnder the dim lamp, their shadows stretched across the canvas walls of the tent, motionless."
 ROC_CHI.14.a:0 "No one wanted to say it first."
 ROC_CHI.15.t:0 "A New Wave of Air Raids"
 ROC_CHI.15.d:0 "Taipei’s night had previously been quiet, save for the occasional sound of passing traffic. Streetlights illuminated empty intersections, and the wind blowing between the high-rises carried a hint of dampness. At a makeshift checkpoint, soldiers stood guard in shifts, exhaustion etched clearly on their faces. \n\nThe sound arrived first—low, rhythmic, and distant—like an echo pressing down from the sky above the city.\n\n\"Did you hear that?\" Li Zhihong looked up, his expression instantly tightening. Dark shapes streaked across the sky. Massive transport planes skimmed the cloud layer, their underbelly lights blinking. Moments later, masses parachutes unfurled against the night sky, drifting slowly down between the skyscrapers. \n\nAn alarm immediately blared. The entire neighborhood snapped to life. Lights flickered on in windows, and soldiers rushed from their cover to take up positions in haste. Gunfire erupted the moment the first wave of paratroopers touched down. Bullets ricocheted off surfaces, sending sparks and glass flying.\n\nFirefights broke out simultaneously at several intersections. Vehicles and shop signs were riddled with holes. In a matter of moments, the familiar streets of Taipei had been subject to the horrors of war. Eventually, the outnumbered Taiwanese forces were forced to retreat amongst the disarray and rising smoke of the once-peaceful city."
 ROC_CHI.15.a:0 "Once again, Taipei has been plunged into the flames of war."
 ROC_CHI.16.t:0 "Against the Current"
 ROC_CHI.16.d:0 "The streets of Taipei had lost all semblance of order. Amongst the background of intermittent sirens, explosions, and smoke, Taiwanese soldiers took cover from PLA gunfire.\n\nLin Zhiyuan swapped in his last magazine. \"We're running low on ammo!\"\n\nBeside him, Chen Yiting peeked around the street corner, then immediately pulled back. \"They're flanking us—if we don't hold, our line will break!\"\n\nJust as the firefight made a turn for the worst, the roar of vehicles cut through the air. Doors flew open, and a and a squad of men rapidly disembarked into formation.\n\nCarrying no other gear but a protective vest, a bald man led with an unwavering resolve. He strode directly into the line of fire without pausing. He swept his gaze over the defensive positions and spoke bluntly: \"Hold the line! Spread your fire to the flanks!\" Glancing over, Lin Zhiyuan was stunned. The man was Han Kuo-Yu! Despite Lin's bewilderment, the ensuing gunfight immediately snapped him back into reality. The chaotic gunfire eventually adopted a steady pace, and key positions were brought back under control.\n\nThe enemy fire continued to close in. Instead of retreating to the rear, Han Kuo-yu crouched down, took a rifle, and fired a steady stream of shots toward the intersection. The gunfire was crisp and controlled, momentarily pinning down the advancing enemy. Chen Yiting couldn't help but glance at him. \"You—\"\n\n\"There's no 'you' or 'me' right now,\" said the resolute Han Kuo-yu. \"Hold your ground.\" \n\nThe sight of Han facing the very jaws of the red dragon breathed life into the already-demorlized men. Gripping their rifles, the soldiers fought ferociously. As Han fired on the enemy, the men fired more. As Han stood against the invaders, the men would stand with him as well. \n\nEventually, the enemy began to fall back. Although visibility was poor amidst the smoke, Han Kuo-Yu stood clearly. \"Remember, I am your general now.\""
 ROC_CHI.16.a:0 "\"Hold the line.\""
 ROC_CHI.17.t:0 "Power of Hatred"
 ROC_CHI.17.d:0 "\"Fall in!\" The command was low, yet it cut through the smoking ruins with unquestionable authority. Years ago, Shen Boyang’s voice had echoed in university lecture halls. Today, that quiet academic precision belonged to the cold, calculating commander of a Kuma Platoon.\n\nBefore him, over a hundred battle-hardened warriors moved among the debris, locking into formation with ruthless, mechanical speed. Before him, over a hundred battle-hardened warriors locked into formation with mechanical speed, led by his vanguard squad leaders: Chen Haoran, Wu Ziyu, Lin Shaohui, Guo Tianxiang, and Zhang Yuanzhe. In their man's eyes burned a shared, enduring hatred—their homes were reduced to ash, and their families had been brutally killed by the communist invasion. \n\n\"Tonight, we strike first,\" Shen Boyang said, his gaze sweeping the ranks like a blade. \"A PLA vanguard in the village ahead. Objective? Leave no survivors.\"\n\nA collective roar tore from the soldiers—\"Kill them all!\" The Kuma Platoon struck with ruthlessness: Chen Haoran’s squad opened fire, Lin Shaohui’s team hurled grenades, and Wu Ziyu’s squad slipped behind enemy lines to execute targets with silent efficiency while the machine guns of Guo Tianxiang and Zhang Yuanzhe pinned the helpless PLA soldiers to the dirt. Under the cover of darkness, the village had become a bloodbath.\n\nAs the smoke settled, a few surviving PLA soldiers raised their hands in surrender. Through his crosshairs, Zhang Yuanzhe didn't see men; he only saw those who had ripped away his loved ones. The cracks of his sniper rifle were cold, fired without a moment's hesitation. When the air hung heavy with the stench of sulfur and blood, Chen Haoran stepped up, his face covered in blood and dirt. \"Platoon leader, when do we strike next?\" \"Soon,\" Shen murmured, his hands clutching his rifle as he gazed into the pitch-black horizon. \"We must exact our revenge, one way or another.\" Driven by an obsessive thirst for vengeance, the former professor was always the first to charge, his Black Bear warriors tearing through enemy lines like a blade. They were Taiwan’s most fanatical guardians—the \"Black Phantoms\" that would come to haunt the soldiers of the PLA."
 ROC_CHI.17.a:0 "They had no mercy for the wicked."
 ROC_CHI.18.t:0 "Lost"
 ROC_CHI.18.d:0 "Months have passed; the flames of war in Taiwan haven't vanished entirely, but the conflict has shifted far away. Occasional explosions echo across the valley, sounding like delayed thunder. Zhao Zi'ang is sheltered himself in a makeshift mountain cabin, it's roof a patchwork of sheet metal and wood planks. Zhao shivered. Drafts of cold mountain air still seeped through the wall's gaps. A bowl of instant noodles sat on the table, long since gone cold. He didn't touch it he simply stared at the congealed layer of oil on the surface. In his mind, he replayed memories. Memories of when his squadmates of 9th Squad, 3rd Platoon were still alive. People who were once there- people whose voices he heard, his eyes saw, his voice joked with- they were all gone. He felt like a stranger, out of place in a world that he didn't belong to. \n\nBy day, he foraged for water and food. When he returned, he usually nailed the door shut behind him and went to seal the holes in the cabin's walls. Occasionally, he spots distant figures, but no one stopped to speak with him. The nights are even quieter. He often had sleepless nights; the slightest sound jolts him awake.\n\nWith bloodshot eyes, Zhao looked down at his hands. The wounds had scabbed over, but they left dark scars. Images of that day kept surfacing—the fires at the docks of Kaoishung, the gunfire, and his friend Liu Chengye’s final words. \n\nA flash of red light suddenly streaked across the far side of the mountain. Seconds later, a muffled boom came, echoing in rolling waves through the valley. The cabin trembled slightly, and dust drifted down to the table. Zhao Zi'ang didn't look up. He simply rests his hands slowly on the table and stares at the bowl of cold noodles, his voice dropping to a barely audible whisper."
 ROC_CHI.18.a:0 "I'm the only one left now."
 ROC_CHI.19.t:0 "餘火"
 ROC_CHI.19.d:0 "中部山脈的夜更冷了。風從林間壓下來，帶著濕氣與土味，遠處偶爾傳來延遲的悶響，在山谷裡慢慢散開\n\n那時天色還沒完全黑，他沿著一條狹窄的山徑往下走，腳步很輕。轉過一處倒木時，他看見一個身影蹲在路邊，正在翻著什麼。\n\n他停住了。女孩也察覺到動靜，猛地擡頭，整個人僵住。兩人隔著幾步距離對視，誰都沒有先動。\n\n過了幾秒，趙子昂慢慢把手從槍上移開，示意自己沒有要靠近。\n\n「你一個人？」他開口，聲音壓得很低。女孩點了點頭，沒有說話。\n\n他看了一眼四周，又問：「跟家人走散了嗎？」這句話讓她的表情變了一下。\n\n她沒有立刻回答，只是低頭看著地面，手指抓著衣角。過了一會，才很小聲地說：「他們……被殺了。」\n\n「誰？」他問。\n\n女孩擡頭看他，眼神很直，沒有太多情緒，只是單純地說出來：「解放軍。」風從山谷裡吹上來，帶著一點冷意。趙子昂的手指微微收緊，又慢慢放開。他沒有再問。\n\n過了一會，他才開口：「這裡不安全。」他轉身往山上走了幾步，又停下來，回頭看她。\n\n她還站在原地，像在等什麼。「跟我走。」他說。女孩點了點頭，小跑幾步跟上。\n\n天色徹底暗下來時，他們回到了那間木屋。門關上，風聲被隔在外面。趙子昂把剩下的泡麵分了一半給她。兩人坐在屋裡，沒有再提剛才的話。\n\n他最後只是低聲說了一句。"
 ROC_CHI.19.a:0 "今晚先撐過去"
 ROC_CHI.20.t:0 "中國軍隊的最後一搏"
 ROC_CHI.20.d:0 "午後的天空沒有預兆地暗了下來。從北到南，整條台灣西部走廊幾乎在同一時間進入異常靜默。沿海雷達站回傳的訊號迅速飆升，密集的彈道軌跡如同交錯的網，覆蓋整個西部平原與城市帶。\n\n來自對岸多個方向的東風系列彈道導彈與巡航導彈幾乎同時升空，目標不再侷限於單一城市，而是對整個西部核心區域展開飽和式全面打擊。從台北盆地向南延伸至桃園、新竹、台中、嘉義、台南與高雄，關鍵軍事基地、交通樞紐與工業設施在短時間內接連遭到密集轟擊。\n\n第一波打擊直指防空與指揮節點。雷達站與通訊中樞在數分鐘內接連失效，多處防空陣地尚未完成反應便被壓制。緊接而來的第二波導彈落向機場、港口與高速交通網絡，跑道被炸裂，橋樑斷裂，西部幹道迅速陷入癱瘓。\n\n爆炸聲沿著海岸線與城市帶連續傳遞，震動幾乎沒有間斷。高樓玻璃成片崩落，火光與濃煙在不同城市同時升起，彼此交織成一條橫貫全島西側的燃燒帶。醫療系統與應急機制尚未完全展開，便被後續的沖擊進一步撕裂。\n\n當轟炸進入尾聲，西部的基礎運作能力已遭到重創。指揮鏈斷裂、通訊紊亂，使各地部隊難以形成有效協同。就在煙塵尚未散去之際，新的威脅已從海平面浮現。\n\n台灣海峽上，大規模艦隊編組在煙霧掩護下迅速逼近。兩棲攻擊艦與登陸艦群沿著西部多個海岸段同時展開行動，從淡水河口、台中港外海、嘉南沿岸到高雄近海，多點同步推進。氣墊登陸艇與兩棲裝甲車成批湧出艙門，在炮火與空中掩護下直撲岸線。\n\n幾乎同一時間，低空飛行的直升機編隊與運輸機掠過受損的防空網，將空降兵投送至內陸關鍵節點，試圖切斷殘存的交通聯繫與後備動員。沿海防線在連續打擊與多方向壓力下迅速出現缺口，局部陣地甚至尚未完成重整便被迫迎戰登陸部隊。"
 ROC_CHI.20.a:0 "死守到底!"
 ROC_CHI.21.t:0 "福建滲透敢死隊"
 ROC_CHI.21.d:0 "台南的夜色濃得像墨，街角僅存的幾盞路燈在斷壁殘垣間忽明忽暗。林建宏靠在彈痕累累的牆邊，雙手捧著那張早已褶皺的全家福。照片里笑得最燦爛的妹妹，再也回不來了。自從解放軍對台北實施無差別轟炸，他的心就像被徹底掏空，只剩下一個漆黑的深淵。\n\n\"建宏，你真的決定了嗎？\"許雅婷聲音沙啞，她緊緊攥著一條染血的發帶，那是她弟弟留下的最後遺物。\n\n\"決定了。\"林建宏擡起頭，眼神冷硬得像刀鋒，\"他們炸平了台北，也殺了我的家人。我要讓他們血債血償。\"\n\n不遠處的廢棄倉庫里燈火昏黃，鄭博文、蔡士凱、黃冠霖、謝雨璇等人正緊張地整理武器彈藥。他們原本都是再普通不過的台灣人：有人是夜市賣珍奶的攤販，有人是在電子廠做組裝的工人，還有人曾經公開主張兩岸和平交流。可在台北遭到無差別轟炸、親人接連死於導彈與空降部隊的屠殺之後，他們心中只剩下最純粹、最冰冷的恨意。\n\n\"我以前真的相信和平。\"蔡士凱苦笑著，把一箱手榴彈推到角落，\"我還帶老婆去廈門玩過，覺得大家是一家人……結果呢？一枚東風導彈把我老婆和整個夜市炸成了碎片。台北被炸成那樣，死了一堆人，我還能相信什麼？\"\n\n\"我們今天站在這里，理由很簡單。大海的那一邊，已經不是親人，而是徹頭徹尾的敵人。我們不管過去支持過什麼、相信過什麼，現在只剩一個目標——讓他們付出十倍、百倍的代價。\"\n\n話音落下，倉庫里陷入短暫的死寂。隨後，所有人同時點頭。\n\n鄭博文舉起手中的武器，聲音低沈而堅定，像在宣誓\n\n\"我們現在正式報名加入『福建滲透敢死隊』。通過測驗的人，今晚就會被送往秘密訓練營，學習如何潛入福建沿海，進行破壞與暗殺行動。不管以前是什麼身份，從今天起，我們只有一個名字——那就是台灣的復仇者\"\n\n林建宏握緊拳頭，腦海中再次浮現妹妹最後的笑容。他緩緩吐出一口氣，望向倉庫外那片漆黑的海面。"
 ROC_CHI.21.a:0 "海的那邊是敵人"
 ROC_CHI.22.t:0 "時代力量宣布加入抗戰"
 ROC_CHI.22.d:0 "黃國昌站在一間簡樸的會議室里，目光銳利，語氣堅定而直接：「面對中國的軍事威脅，我們沒有退路。保衛台灣、守護民主自由，這是每一個台灣人、尤其是年輕世代不可逃避的責任。」\n\n他的話語透過媒體迅速傳開，沒有多餘的修飾，卻充滿改革的決心。時代力量一向以打破藍綠惡鬥、推動真正進步改革為己任，在這場前所未有的危機中，毫不猶豫地選擇站在守護台灣的最前線。支持政府的抗中立場，不是妥協，而是基於捍衛台灣主權與民主價值的原則性決斷。\n\n過去那些藍綠之間的權力鬥爭與意識形態對立，在中國的軍事壓力下顯得蒼白無力。台灣社會此刻需要的，是超越黨派的團結與行動。黃國昌的聲音依舊帶著一貫的批判力：「我們不能再被黑箱與妥協拖累，民主不是用來退讓的，而是要勇敢捍衛的。年輕人尤其要站出來，因為未來是屬於我們的。」"
 ROC_CHI.22.a:0 "捍衛台灣!"
 ROC_CHI.23.t:0 "民眾黨宣布加入抗戰"
 ROC_CHI.23.d:0 "柯文哲站在一間簡樸的會議室里，表情平靜，語氣像平常看診時那樣務實：「眼下台灣面對的危機，大家心里都有數。保衛台灣、守住我們的生活方式，這不是藍綠的問題，而是每一個台灣民眾的共同責任。」\n\n他的話透過媒體傳開，沒有華麗的修飾，卻讓人感覺踏實。民眾黨一向主張以台灣為名、以民眾為本，這次在戰爭陰影下，選擇用理性務實的態度站出來，支持守護台灣的立場。不是為了意識形態，而是為了台灣的整體利益和人民的平安。\n\n過去藍綠的口水戰、族群對立，在更大的危機面前顯得不再那麼重要。台灣這個島嶼，此刻需要的是團結，而不是繼續分裂。柯文哲的語氣一如既往地直接：「我們對民意要心存敬畏，政治就是要解決問題，不是製造仇恨。該合作的時候合作，該對抗的時候就要對抗，但最終目標是讓台灣民眾過上安穩的日子。」"
 ROC_CHI.23.a:0 "拒絕妥協！"
 ROC_CHI.25.t:0 "泛藍陣營宣布加入抗戰"
 ROC_CHI.25.d:0 "吳成典、宋楚瑜與林炳坤共同站在一間簡樸的會議室里，三人神情嚴肅而堅定。吳成典率先開口，語氣沈穩：「面對中國大陸的軍事壓力，我們必須以中華民國的整體利益為優先。保衛台灣、維護兩岸和平，這是每一個中華民國國民的共同責任。我們反對台獨冒進，但也絕不接受武力威脅。」\n\n宋楚瑜接著說道，聲音帶著一貫的親民與務實：「台灣民眾最希望的是安穩的生活。過去我們主張兩岸多交流、少對抗，就是為了避免走到今天這一步。現在危機當前，我們願意放下黨派分歧，支持一切有利於台灣安全與中華民國尊嚴的立場。親民黨一向以民眾為本，現在更要以台灣的長治久安為念。」\n\n林炳坤則補充，語氣樸實直接：「無黨團結聯盟來自地方基層，我們看到民眾最怕的就是戰爭。無論藍綠，現在都該團結一致，守護中華民國的憲政體制與人民福祉。我們支持穩定政局，反對任何破壞兩岸和平的做法。」\n\n三人的聯合發言迅速傳遍媒體，沒有華麗的口號，卻透露出泛藍一貫的理性務實。過去藍營內部的路線差異，在外部危機壓力下逐漸淡化。新黨的堅定立場、親民黨的親民路線、無盟的地方力量，此刻匯聚成一股守護中華民國的共同意志。"
 ROC_CHI.25.a:0 "抵抗共匪，只待反攻大陸"
 ROC_CHI.27.t:0 "支援大陸民運"
 ROC_CHI.27.d:0 "夜幕壓低在高雄港上方，海面反射著斷裂的燈光。數小時前傳出的各地集會畫面，仍在通訊設備的螢幕上反覆播放。那些來自北京、廣州與哈爾濱的片段，被一遍遍放大、暫停、重播，像是在確認某種尚未穩固的現實。\n\n陳柏宇站在車旁，目光停留在畫面中人群舉起的標語上。他沒有說話，只是把手機收進口袋，轉身看向貨櫃後方整齊堆放的箱子。那些原本被當作備案的物資，此刻忽然有了更明確的去向。\n\n林昱廷將最後一批設備搬上推車，動作比以往更快。吳佩珊蹲在地上核對清單，手指在紙面快速滑動，確認每一項標記與編號。\n\n「他們已經開始了，我們不能再等。」黃子軒靠在貨櫃邊緣，視線投向遠方海面，聲音壓得很低，卻清楚。\n\n張雅婷將封條貼上最後一個箱子，輕輕按壓固定，「能送進去多少，就算多少。」\n\n另一側，劉承翰正與船員快速確認新的中轉安排。原本分散的路線被重新調整，節點被壓縮，節奏變得更緊密。交談聲不高，但每一句都直接指向同一個方向。\n\n短暫的停頓之後，陳柏宇重新打開車門，將引擎啟動。低沈的聲響在夜里緩緩擴散，他看了一眼身後的人群，沒有多說什麼。\n\n遠處的海面沒有回應，只有風聲與機械運轉聲交錯。那些尚未抵達的訊號，正在被提前準備。"
 ROC_CHI.27.a:0 "給對岸添把火"
 ROC_CHI.28.t:0 "夜不能寐"
 ROC_CHI.28.d:0 "淩晨兩點的房屋內依舊亮著燈。\n\n的走廊空無一人，只有值勤人員的腳步聲在遠處斷斷續續地回響。辦公室內，他獨自坐在桌前，面前的文件已經翻過無數次，卻始終停留在同一頁。\n\n他沒有開燈，只讓桌上的一盞台燈亮著，光線壓得很低，像刻意避開什麼。\n\n窗外的沈在夜色里，霓虹燈依舊閃爍，卻顯得異常遙遠。\n\n他閉上眼，試圖讓思緒平靜下來，但各種聲音卻反而更清晰——媒體的質疑、在野黨的攻擊、街頭越來越直白的憤怒，還有那些在內部會議中沒有說出口的擔憂。\n\n他手指輕輕敲著桌面，一下，又一下，節奏卻越來越亂。\n\n他很清楚，真正讓局勢變得危險的，從來不是對岸的動作，解放軍的攻勢越來越疲憊，明眼人都看得出來中國無論如何都無法打下台灣，可問題來自內部。\n\n民進黨的支持率在下降，盟友在觀望，潛在的對手則在迅速積累聲量。那些原本依附在執政體系下的力量，開始尋找新的出口。\n\n他睜開眼，目光落在桌上的一份最新民調上。數字沒有大幅崩塌，卻呈現出一種更令人不安的趨勢。\n\n這種下滑，比任何一次暴跌都更危險。他忽然站起身，走到窗邊，手掌貼在冰冷的玻璃上。\n\n遠處傳來一陣低沈的轟鳴聲，像是軍機，也像只是夜里的錯覺。\n\n\"時間不多了……\"\n\n他的聲音咬牙切齒。\n\n窗外的燈光微微晃動，仿佛整座城市都在某種看不見的壓力下緩慢傾斜。"
 ROC_CHI.28.a:0 "真的是靠北"
 ROC_CHI.29.t:0 "海天重誓"
 ROC_CHI.29.d:0 "夜色愈發濃稠，像一張浸透海水的漁網，勒得人喘不過氣。會議室的門被從里面反鎖，窗簾終於拉嚴，只剩桌上一盞昏黃的台燈，投下三道長長的陰影。門外走廊空蕩蕩的，只有風卷著浪聲，隱約像遠處的炮響。\n\n韓國瑜坐回椅中，拳頭仍舊半握。陳寶餘上將終於點燃了那根雪茄，青煙在燈下盤旋，苦澀味混著潮濕的鐵銹味，彌漫整個房間。\n\n門輕叩三下——這是約定的暗號。進來的是王忠信，國民黨中常委、情報老手，頭發花白，眼神卻像老狼一樣警覺。他手里提著一個不起眼的公文包，里面塞滿了從台北緊急帶過來的加密檔案。\n\n\"韓主席，陳總長。\"王忠信壓低聲音，掃了一眼窗外搖曳的燈塔光，\"外面風聲緊。綠營那邊已經嗅到味了，左聯的家夥更在到處放話，說我們想借大陸亂局翻盤。\"\n\n韓國瑜冷笑一聲，目光如刀：\"讓他們說去。國民黨這些年活得像個被閹過的太監，穿西裝打領帶，卻連句硬話都不敢放。這次台海收場，正是天賜的斷層。我們不搶，別人就會搶——綠的搶，赤的搶，那些自稱革命者的也會搶。\"\n\n陳寶餘吐出一口煙，軍靴在地板上輕輕一頓：\"忠信兄，大陸那邊的情報更新了沒有？\"\n\n王忠信打開公文包，攤開幾張衛星照片和手寫情報摘要。中國大陸的暴動畫面模糊卻觸目驚心，煙火與人群像蟻群般湧動。\n\n\"南京已經不是小打小鬧，\"他聲音低沈，\"供應鏈斷裂，地方武裝開始冒頭。北京那邊忙著維穩，內部裂痕比我們預想的還深。國光計劃的舊檔案我帶了一部分——1960年代的登陸方案、敵後特戰要點，雖然紙面上的東西，但框架還在。只要我們注入新血，就能從草稿變作戰圖。\"\n\n韓國瑜傾身向前，聲音帶著壓抑的狂熱，卻又刻意放緩，像在對黨內同志宣誓：\"重啟國光，不是單純的軍事冒險。我們要三分武力、七分民心。反攻大陸，先反攻台灣的民心。告訴他們：混亂結束了，秩序回來了。民主不是綠營的專利，福利不是赤匪的空話。我們國民黨，才是那個能跨過山海、帶回江山的人。\""
 ROC_CHI.29.a:0 "舊意覆燃"
 ROC_CHI.31.t:0 "機密情報"
 ROC_CHI.31.d:0 "情報系統近期呈現出異常密集的活動軌跡。隨著對岸戰事陷入僵持，其內部壓力正以可觀速度累積，而這種壓力已開始轉化為對外軍事行動的準備跡象。通過持續交叉比對衛星影像、通信截獲與後勤流動數據，我們確認對方導彈部隊進入高度戒備狀態，多個沿海發射陣地與機動單位頻繁轉移，明顯處於戰備展開階段。\n\n不僅如此，其海軍與兩棲部隊的集結亦已出現系統性特征。港口裝卸頻率異常上升，大型登陸艦與護航編組的調度呈現出前所未有的規律性，而內陸運輸節點的壓力也同步增大，顯示其後勤體系正為大規模行動進行最後整備。這類高頻運作狀態並非例行演訓所能解釋，更接近實戰前的壓縮式準備周期。\n\n當前局勢的關鍵，在於對方可能試圖以短時間內的密集火力與快速突入打破僵局，將外部戰線轉化為內部壓力的釋放出口。一旦行動展開，其初期打擊將極具強度與突然性，意在癱瘓我方指揮、通信與關鍵防御節點。\n\n在此背景下，任何遲疑都將放大風險。我們必須以最壞情境為基準，重新校準防御部署與應急體系，強化分散指揮與冗餘通信能力，確保在首輪打擊下仍能維持作戰連續性。同時，情報系統需進一步前推，持續鎖定對方發射窗口與兵力集結節奏，爭取預警時間與決策空間。\n\n這不是單一方向的威脅，而是一場系統性壓力測試。唯有提前進入戰時狀態，才能在真正的沖擊到來之前，占據主動。"
 ROC_CHI.31.a:0 "按最壞情況部署"
 ROC_CHI.32.t:0 "緊急動員"
 ROC_CHI.32.d:0 "西線的火光尚未熄滅，戰線卻已被撕開數道缺口。沿海登陸與內陸穿插同時推進，使原本尚能維持的防禦體系迅速變得支離破碎。就在這種幾近崩塌的邊緣，零星而急促的集結開始出現。 \n\n一支由各地臨時編組的志願民兵，從被轟毀的鄉道與田野間趕來。帶隊的是周嶺，她臉上沾著未乾的煙灰，背包裡除了急救物資，只剩下零散彈藥。趙聞川緊跟其後，步伐略顯急促，卻始終沒有回頭。他們沒有統一的裝備，也沒有完整的編制，更多時候只能依靠口頭指示與彼此默契維持隊形。 \n\n「前面就是斷線的位置。」週嶺壓低聲音，指向遠處被炮火削平的堤岸。那裡原本是防線的一段，現在只剩下斷裂的混凝土與翻覆的鐵絲網。幾名守軍殘部正在撤離，神情麻木而疲憊。 \n\n沒有交接，也沒有多餘的說明，志工們直接接替了陣地。趙聞川將僅有的彈匣分送出去，又把水壺遞給一名還在發抖的新兵。沈知夏蹲在破損的掩體後，用簡陋電台重新建立聯絡，一段斷續的回音在耳機裡反覆跳動。當她報出座標時，聲音有一瞬間的遲滯，卻很快恢復穩定。 \n\n顧承野則在陣地間來回穿梭，把零散的人員重新組織成幾個火力點。他的動作不算熟練，卻帶著一種近乎固執的專注，像是在強行把混亂壓回秩序之中。 \n\n遠處傳來履帶碾壓的低沈聲響。還未完全冷卻的地面再次震動，煙霧中隱約浮現推進的裝甲輪廓。林語棠伏在壕溝邊緣，呼吸貼著泥土，她沒有等待命令，只是微微調整姿勢，將槍口對準側翼最薄弱的部分。 \n\n第一聲槍響之後，陣地迅速被拉回戰鬥節奏。簡易機槍斷斷續續壓制前方推進路線，手雷在殘牆間爆開，掀起碎石與泥土。補員並未改變火力對比，卻讓原本即將崩潰的防線重新有了「形」。 \n\n砲火再度覆蓋下來，壕溝泥水四濺。有人被震得耳鳴失聲，也有人在黑暗中死死抓住身邊同伴的衣袖。週嶺靠在土壁上，短暫閉上眼睛，又很快睜開，重新舉起手臂示意分散。 \n\n當第二輪衝擊逼近，陣地已經不再完整，卻仍然存在。那些倉促拼湊起來的人影，在煙塵與火光之間穩住了位置，像一條被不斷撕裂卻始終未斷的線。"
 ROC_CHI.32.a:0 "補上去，哪怕只多撐一分鐘"
 ROC_CHI.34.t:0 "Reliable Allies"
 ROC_CHI.34.d:0 "中國解放軍已經搶占了金門，對台灣的攻擊已經勢在必得，無可避免了，我們做好了一切準備，在這最危急的時候，我們的盟友，提供了最强而有力的支持，日本自衛隊已經來到了台灣，與國軍一同進入防禦陣地，澳大利亞的軍隊雖然還未到來，但是民用物質和軍火在源源不斷的來到台灣，在這危機的關頭，盟友的幫助，仿佛為台灣注入了一支强心針，堅定了台灣的信念。"
 ROC_CHI.34.a:0 "Long live Pacific friendship!"
 ROC_CHI.39.t:0 "山海之間的盟友"
 ROC_CHI.39.d:0 "今夜的台灣東海岸，海風裹著潮濕的鹹味，從花蓮的港口一路吹到臨時陣地。月光很亮，照得海面發白，如果不是遠處偶爾閃過的炮火，這一切幾乎像是和平年代的夜晚。\n\n我和佐藤誠政務官一起吃著野戰口糧。說是吃飯，其實只是靠在一輛裝甲車旁將壓縮幹糧掰碎塞進嘴里。他已經四十多歲了，臉上帶著長期熬夜留下的疲憊。他說帶這樣一支聯合部隊，比打仗本身更難。自衛隊志願隊、我們國軍，還有臨時編入的地方守備隊，指揮體系像一團亂麻。\n\n遠處的掩體旁，有人點起小小的篝火。士兵們低聲哼著歌，混雜的旋律，帶著不同的情緒，有人唱著《梅花》，也有人用生澀的日語跟著哼唱君之代的調子。語言混亂，卻奇妙地沒有沖突。\n\n佐藤盯著那邊看了很久，忽然問我：\"你們真的相信能守住嗎？\"他的語氣不帶挑釁，更像是在確認什麼。我沒有立刻回答，只是看著火光旁的人影——一個台南來的年輕兵正教一名日本士兵用閩南語說\"兄弟\"，兩個人笑得前仰後合。\n\n我知道他在擔心什麼。不同的國家，不同的人，甚至是曾被侵略國。如今卻被在同一條戰線上。對他來說，這種並肩本身就充滿矛盾。\n\n明天我們要往北推進，支援台北外圍防線。我得休息了。只是合上記錄本時，海風里還夾著斷斷續續的歌聲："
 ROC_CHI.39.a:0 "とまるもゆくも、かぎりとて（無論留下或離開，一切終有結束之時)"
 ROC_CHI.40.t:0 "敵襲"
 ROC_CHI.40.d:0 "陰天，不確定是在基隆外緣，還是更靠近海岸的某段陣地。\n\n手還是抖。\n\n陳志遠，那個台南新兵的血已經幹在袖口，顏色發暗，怎麼搓都下不去。他才十九歲，很多事情還沒來得及經歷，就停在了今天早上。\n\n最初見到他是在後送點。他替傷兵處理傷口，動作細得不像在戰場上。我當時偏過頭，對旁邊的人說，這樣的人，大概撐不了幾天。\n\n清晨的海面先是安靜得異常，隨後整片天空像被撕開一樣。來自解放軍的火力壓了下來——遠處艦炮的悶響一下一下砸進地面，火箭彈拖著尾焰掠過頭頂，爆炸把陣地前沿掀成一片翻滾的泥土和碎石。無線電里一片雜音，根本聽不清指令。\n\n就在這樣的混亂里，是他先發現側翼的空隙。\n\n他看過來，沒有解釋，也沒有遲疑。\n\n\"我去。\"聲音不高，卻很穩，\"他們會先注意我。\"\n\n我還沒開口，他已經翻出掩體。\n\n他沿著被炸塌的掩體邊緣移動，借著煙塵和彈坑一點點向前。火力果然被吸引過去，我們才有機會重新組織陣形。但下一瞬間，一發爆炸在他附近掀起，他整個人被氣浪拋開，重重摔在地上。\n\n等我趕到，他已經說不出話。血不斷從喉嚨里湧出來，他卻執意把一件東西塞進我手里。\n\n現在陣地安靜下來，風聲蓋過了一切。\n\n我把他的遺物收整好：青天白日、一本寫滿急救記錄的手冊，還有那張前些日子的合影。照片上的他笑得很松弛，像完全不屬於這里。背面那行字寫得很認真——等結束以後，要一起開一家診所。"
 ROC_CHI.40.a:0 "那句話，我還是沒來得及說出口"
 ROC_CHI.41.t:0 "海峽盡頭的火光"
 ROC_CHI.41.d:0 "海風從台灣海峽方向壓過來，帶著鹽味，也帶著燃燒後的焦糊氣息。傍晚的天色本該溫和，卻被火光撕開——港區在燃，堆疊的貨櫃一排排塌陷，油料庫爆炸後升起的黑煙直沖雲層，把整片天空染成暗紅。\n\n遠處的碼頭上，一面青天白日旗仍掛在殘破的旗桿上。旗面被沖擊波撕裂，邊緣卷曲發黑，卻還在風里頑強地展開。橋面和岸邊的混凝土滿是彈坑，碎片散得到處都是，像被反覆碾碎過。\n\n幾名登陸的中國人民解放軍士兵已經推進到港區邊緣，他們順著斷裂的護欄往高處爬，動作急促而謹慎。下方的部隊在廢墟間展開，有人用手勢催促，有人架起機槍警戒，更多的人只是擡頭盯著那面旗。\n\n在港區外側的高地上，國軍軍官林振國伏在破碎的掩體後，看著這一切。腳下的泥土還在微微震動，像是剛剛那輪炮擊留下的餘波。身後傳來腳步聲，日方聯絡官佐藤誠沿著被炸開的斜坡爬上來，呼吸略顯急促。\n\n兩人沒有立刻說話。\n\n港區那邊，有人已經開始切斷旗索。動作很慢，風很大，旗幟被拉扯得不斷翻卷。金屬摩擦聲斷斷續續傳過來，在爆炸後的寂靜里顯得格外清晰。\n\n\"你在看那個？\"佐藤最終開口。\n\n林振國點了點頭，沒有移開視線。\n\n\"現在不開火？\"佐藤壓低聲音。\n\n林振國沒有回答。\n\n瞄準鏡里，那兩個人已經固定好身體，開始切割旗索。風很大，動作被不斷打斷，鋼索在刀具下發出斷續的摩擦聲。\n\n\"再等。\"他只說了兩個字。\n\n時間被拉得很長。\n\n就在旗索出現明顯松動的一瞬間，林振國的手指壓下去。\n\n第一聲槍響幾乎和風聲重疊。\n\n高處的其中一人猛地一頓，整個人向後仰去，失去支點後直接從結構邊緣墜落。第二個人還沒反應過來，第二發子彈已經打在他肩側，他試圖抓住什麼，卻只抓到空氣。\n\n幾乎同時，掩體後的火力全部展開。機槍、步槍沿著預先標定的角度壓向港區，高處和下方瞬間被交叉火力覆蓋。剛剛還在觀望的士兵被迫散開，原本準備完成的動作被徹底打斷。\n\n那面旗沒有被割斷。\n\n它在風里劇烈抖動，半斷未斷，像被拉扯著懸在那里。林振國重新拉動槍機，目光仍停在瞄準鏡里："
 ROC_CHI.41.a:0 "「別讓他們只記住廢墟。」"
 ROC_CHI.38.t:0 "Mitsui Warehouse"
 ROC_CHI.38.d:0 "今日仍舊是烏雲密布的一天，照理來說，這時候的台灣應當是豔陽高照才對。汪銳金少校坐在自己的行軍床上看向窗外，手伸向床頭櫃那本軍綠色封皮的筆記本，順著書中紅線找到昨天寫的那一頁，入伍以前的他根本沒有寫日記的習慣，畢竟生活中能玩的東西多了去了，哪有那個美國時間寫日記呢?直到進入之後閒得發慌的他才開始學著寫日記。\n\n想到，這個偶然的習慣已經伴隨著自己走過十多年的軍旅生涯，在營中有甚麼樂的、好玩的他都有記下來，但大部分時候書頁裡承擔的都是委屈與痛苦，在今天也是如此。汪銳金拿出壓在枕頭下的那支鉛筆，距離解放軍進攻台灣已過數周，他帶領127旅第16步兵營奉命在前沿海灘附近的城區與工業區阻擊敵軍，最後收到的指示是上個禮拜旅部派發過來的堅守命令，他和他剩下的100多名弟兄集中在八輕工業區最邊緣的廢舊倉庫之中，數條聯外道路不是被灘頭部隊攻占、就是處在無人機的火力打擊範圍內，根本沒辦法輸送任何補給與傷員。\n\n汪銳金深吸一口氣、闔上筆記本，像是下定了某種決心，邊下樓邊思索該怎麼給剩餘的弟兄們鼓舞士氣，軍糧飲水見底、無線電的電池也是勉勉強強用到現在⋯⋯。三三兩兩躺在樓梯上的傷兵勉強擡起右手敬禮，在軍隊裡大夥有福同享有難同當，現在正是考驗信念的時刻，可嚴峻的戰損和缺乏補給讓汪銳金實在沒有臉面對他的部下。他微微點頭回禮，走到一樓倉庫，那些沒有站崗的士兵全都在這裡休息，彈藥箱和個人物品雜亂無章地散落在倉庫各處，只有一小塊區域用簾子簡單遮擋----那裏是參謀室。倖存的連長和排長都在這裡集合，少校站在桌前和軍官們商討戰略，其實走到這一部他們也沒有多少選擇:要嘛抵抗到底、要嘛放下武器投降。一開始的討論還算溫和，大家都盡可能地保持克制，不想讓基層士兵發現自己的長官內鬨導致士氣更為低落，但到後來兩方還是都沒能忍住破口大罵，髒話和排泄物迴盪在整座倉庫間，直到有位班長走進參謀室請示自己的佈防位置，他們才慢慢冷靜下來。\n\n「先生們......」少校在送走班長後才終於開口，「你們聽說過八百壯士的故事嗎?松滬會戰期間，謝晉元中校率領著餘下四百多名官兵堅守四行倉庫，與日軍激戰數日，國軍將士們在此多次抵擋日寇的瘋狂進攻，有位烈士甚至抱著手榴彈從倉庫一躍而下，與準備炸開大門的日軍同歸而盡。」\n\n所有人都沈默不語。「想想看，如果我們今天投降了，歷史會怎麼評價我們?後人會如何看待我們?!」汪銳金少校的斥責迴盪在倉庫裡，「我不知道你們是徵召來的還是志願服役，但在此時此刻，我們的土地正在被敵人無情地蹂躪著，難道你們願意在台灣最艱難的時刻選擇成為戰俘袖手旁觀，放棄抵抗嗎?!」\n\n汪銳金掀開參謀室角落的彈藥箱，裡面還存放著一些雷管和C4，「管他還剩多少人，就算只剩我一人!也得叫那些該死的共匪有去無回!讓他們知道，中華民國從來就沒有滅亡!你們要投降的隨你們去吧，我不會攔著，但要是你們願意為台灣獻出一切......」少校掃視著參謀室內的所有人，他們全都直勾勾地盯著他，全員的寂靜震耳欲聾\n\n一簇黑色的煙圈冉冉升起蒙在月亮上。那天晚上，混雜著解放軍撕心裂肺吼叫的，是視死如歸的黃埔將士們的坦然。"
 ROC_CHI.38.a:0 "Family letters fly to heaven; soldiers plunge into hell with the enemy."
 ROC.77.t:0 "Blackhawk Helicopter Crash in the Wulai Mountains"
 ROC.77.d:0 "2020 年 1 月 2 日上午，中華民國空軍一架 UH-60M「黑鷹」直升機自新北市新店區直潭營區起飛，執行例行春節慰勉行程，原定前往宜蘭東澳嶺雷達站進行視導與勉勵官兵。機上共 13 人，包含時任參謀總長沈一鳴上將及多名高階將領與隨行人員\n\n直升機於飛行途中進入新北市烏來山區上空時，因天候不佳、能見度低，飛機在雷達上訊號消失。國防部隨即啟動緊急搜救機制，出動空中與地面搜救部隊展開搜尋。經數小時搜索，搜救人員於烏來桶後溪上遊山區發現失事殘骸。\n\n5名生還者則在搜救人員協助下送醫治療。後續調查指出，事故與當時山區天候惡劣、雲霧濃厚、飛行環境能見度不佳，以及飛行決策判斷等因素相關，並非機械故障所致。國軍隨後全面檢討高階軍官搭乘同一航空器的風險管理與飛安程序，強化相關規範。"
 ROC.77.a:0 "We give our condolences."
 ROC_77_tt:0 "§Y事故共造成 8 人罹難、5 人生還。罹難者包含：§!\n\n參謀總長 §Y沈一鳴§! 上將\n政戰局副局長 §Y於親文§! 少將\n情次室助次 §Y洪鴻鈞§! 少將\n作計室處長 §Y劉鎮富§! 少將\n參謀總長室參謀官 §Y黃聖航§! 中校\n空軍作計室參謀官 §Y韓正宏§! 中校\n空勤組員 §Y許鴻彬§! 上士\n空勤組員 §Y張志光§! 士官長§!"
 ROC.78.t:0 "China Suspends Taiwanese Pineapple Imports"
 ROC.78.d:0 "2021 年 3 月，中國海關總署宣布自 3 月 1 日起暫停台灣鳳梨輸入，理由為多次檢出介殼蟲等有害生物。由於中國長期為台灣鳳梨最大外銷市場，此舉立即對鳳梨產業與農民生計造成衝擊，也迅速升高為政治與經貿議題。\n\n台灣政府隨即啟動因應措施，包含加強檢疫與品質管理、協助外銷市場轉移、啟動內銷促銷與加工收購機制。同時，民間企業、電商平台、餐飲業者與地方政府紛紛響應採購與行銷，社群媒體掀起「挺鳳梨」熱潮，大量民眾以實際購買行動支持農民，鳳梨入菜、鳳梨加工品與創意行銷在短時間內蔚為風潮。\n\n政府表示台灣鳳梨外銷市場將逐步分散至日本、香港、新加坡與中東等地，對單一市場依賴的問題也再次成為社會與政策討論焦點。"
 ROC.78.a:0 "This won't help them!"
 ROC.79.t:0 "Taroko Express Derailment Accident"
 ROC.79.d:0 "2021年4月2日上午9時28分，位於台灣花蓮縣秀林鄉的台灣鐵路北迴線清水隧道北口，一列載有498人的TEMU1000型列車在行逕隧道前，因撞擊滑落邊坡侵入路線的工程車造成出軌，列車因慣性持續往前滑行撞進隧道內，車廂嚴重損毀，造成49人罹難和309人輕重傷\n\n儘管中華民國相關部門在事故發生後第一時間就發起救援及搶修工作，但是由於狹長的隧道與滑坡災害使得救援工作異常困難，造成49人罹難和309人輕重傷害的嚴重後果\n\n"
 ROC.79.a:0 "Conduct an investigation to prevent any similar tragedies."
 ROC.80.t:0 "7.2 Magnitude Earthquake hits Hualien"
 ROC.80.d:0 "2024 年 4 月 3 日淩晨，台灣花蓮縣發生 芮氏規模 7.2 的強烈地震，震央位於花蓮近海，震源深度約 20 公里。此次地震是近年東台灣地區最嚴重的天然災害之一，對花蓮及鄰近縣市造成重大破壞。\n\n地震發生後，建築物倒塌、道路裂縫、橋樑受損，並引發多起土石流與山崩，導致交通中斷、供電中斷與水電設施損壞。初步統計，共造成 數十人死亡、數百人受傷，多處民宅與公共設施嚴重損毀，居民緊急疏散。"
 ROC.80.a:0 "Our condolences goes to the victims' families."
 ROC.81.t:0 "Typhoon Danas Makes Landfall in Chiayi"
 ROC.81.d:0 "2025 年 7 月 6 日，颱風 「丹娜絲」由南海北上，於下午登陸嘉義縣布袋鎮，造成台灣中南部地區出現 豪雨、強風與山洪暴發。颱風來勢強勁，最大風速達每秒 45 公尺，降雨量在部分山區累積超過 500 毫米，帶來大規模水患風險。颱風登陸後，中南部多地發生嚴重淹水，沿海地區出現風災與海水倒灌。嘉義、台南與雲林地區交通癱瘓，高速公路與省道多處中斷。初步統計，颱風造成至少 2 人死亡、數十人受傷，部分農作物及民房遭受損毀，民眾緊急撤離至避難所。\n\n在花蓮、台東等東部山區，由於連日豪雨與地形陡峭，部分河川如馬太鞍溪、秀林溪等 發生山崩與土石流，形成多處堰塞湖。部分堰塞湖水位快速上升，水壩潰堤風險極高。地方政府與水利單位立即展開疏散與搶險，強制疏散附近居民，防止次生災害造成重大傷亡。\n\n堰塞湖事件導致道路中斷，部分山區村落與農田被淹沒或受損，民生供水與電力一度中斷。中央與地方政府協調空勤、消防與工務單位，派遣挖掘機與搶險設備進行堰塞湖排水作業，並設置臨時安全通道。"
 ROC.81.a:0 "Dispatch search and rescue!"
 ROC.82.t:0 "The Qingming Festival"
 ROC.82.d:0 "四月的雨絲絲點點，郁郁蔥蔥地籠成一片蒙蒙的煙。\n\n老夏頭少年時見慣了這雨，那時候，他仔細地去看那些弄影的青柳枝間隙時，還能見到細密的銀針穿過去，縫在蒼郁的地上，不像如今模糊。老夏頭踩在著松軟的春泥里，細密的雨絲穿過那些弄影的青柳枝，也穿過他的身子，把他縫在地上，弄得他身上癢絲絲的。他沒帶傘，這樣的雨沒必要帶傘，一如他年少時在那片白雲鄉中自由的時光。\n\n今天清明節，他正去拜會幾個經久不見的老友。幾個小丘此起彼伏，幾條小路彎彎繞繞，放在曾經，輕鞭快馬，回眼望去，淺淺的草痕沒不過他的足跡，只留下一串響在四面里歡暢的笑聲。現在他正一步一步，踏踏實實地踩在這樣松軟的泥土上，相較曾經，他的腳步更沈穩了，也更能感受到這土地是何等的堅實——竟足以托起一副幹枯的軀體，一個垂老下墜的心。"
 ROC.82.a:0 "Things remain while people vanish; tears flow before words can form."
 ROC.83.t:0 "緣丘而上"
 ROC.83.d:0 "朦朧的視野里出現幾個漆綠的點，漸而是團，最後是柱。那些是柳樹，它們立在老夏頭遠遠的視野里，柳絲輕撫，春風得意。柳下是更多的，凹凸不平的小土包，像許多倒著的大鬥，前面樹著幾方纏著苔痕的碑。\n\n老夏頭的腳步快了些，丘面並不陂陀，老夏頭很順利地下去了，點散在野的柳樹也好像聚攏了一些。他提了酒，還有鹵牛肉，他小時候作佃，只見東家吃過。東家的嘴巴一張一合，一盤鹵牛肉就幹凈了大半，隨之而來的是酒的臭味和一陣陣歡聲笑語。他還記得那時東家心情好，給他賞了幾片肉，最後他才知道，那不是鹵牛肉，但往後的日子里他一直把那幾片肉當鹵牛肉。\n\n他立在那些靜靜地立在雨中，腳底下舒張的生命力蔓延到到他的頭頂去。這滋味很令人懷念。這是年少的滋味。有溫熱從他臉上劃過。他想家了。"
 ROC.83.a:0 "半晌"
 ROC.84.t:0 "欲語淚先流"
 ROC.84.d:0 "老夏頭顫巍巍地從口袋里掏出幾個白凈的小瓷盞，一一放在自己眼前，貼著那些小土包，好像立了一堵透明的墻，墻外只留他孤身一人，墻里是眾人的沈默；又像一條路，從記憶深處延伸到這些小土包里，橫在老夏頭身子前面。他斟酒的動作很慢，卻很穩。他想起來還在軍隊的日子，那些抽中敢死簽的大頭兵，有些很豪氣，有些哆哆嗦嗦，結果一碗酒幹盡，都叫嚷著要和敵人拼個命，好像死這件事，在酒面前不值一提。\n\n他徑自喝了一盞，辛、辣，而後是沖鼻子，他忍著咽下去，眼淚都憋了出來。他一向不喝酒，也不明白這東西是為何有如此大的魔力，但他仿著記憶里那些穿著軍裝的灰色的人影，一盞接著一盞，直到眼前天花亂墜，頭腦發脹發昏才停下來。\n\n他端起那些斟滿的酒盞，又搖搖晃晃地起身，一盞接著一盞地澆在那些小土包邊上。雨絲跌在盞中，蕩起淡淡的漣漪。做完這一切，他跪下去，重重磕了幾個頭，聲音顫抖，幾個不成音節的字從他嘴里蹦出來："
 ROC.84.a:0 "「弟兄們……小弟無能……還沒替你們回大陸……替你們回家……」"
 ROC.85.t:0 "Joy of Reunion"
 ROC.85.d:0 "「……來了？」\n\n「……來了。」\n\n病房里蒼白的墻面覆住無力遠望的視線，外面的聲音也被這墻塗上了馬賽克，模糊不清——靜極了。\n\n老夏頭抽出那把病床旁的凳子坐下去，動作很輕，只牽動幾縷和風惹得衣角騷動。老夏頭聽到心跳和沈重的呼吸聲，但不知是自己還是床上人的。他展眼和床上人對視，卻發現他的眼睛幾乎瞇成一條縫。印象里，他的眼睛不是這樣的。\n\n「…你眼睛怎麼了？」\n\n「我看不清你的樣子了，人老了。」\n\n床上人的聲音沈重，喉頭似乎被什麼堵住了，咬字時的發音連帶著牙齒的顫動聲。老夏頭握住了床上人搭在白被上的手。他的手很涼，還粗糙，大小不一的繭子錯落在寬厚的手上。手掌很厚實，老夏頭得用兩只手才能緊緊握住。\n\n老夏頭喉頭哽咽，眼眶里忽得溫熱起來，但他控制住了，只讓淚水在心里劃出傷痕。\n\n「你說這人，怎麼說有事，他就有事了？我前幾天走台北時你精神頭還足，怎麼這一回宜蘭，就成這模樣了…」\n\n"
 ROC.85.a:0 "For ten years, living and dead have been parted without a trace..."
 ROC.86.t:0 "……不思量"
 ROC.86.d:0 "他的聲音顫抖起來。老張的另一只手搭過去，按在老夏頭手上。他搖了搖頭，似乎並不認可老夏頭的悲傷。\n\n「人老了就是這樣，身子弱，骨頭脆，就算萬千當心也會有這麼一遭，不過有些人來得晚，有些人來得早罷了，這是小事。」\n\n「我活了這麼大，仗，大大小小打了幾百場，人，不三不四殺了幾十個，死，我不怕，人總有一死…」\n\n老張眼睛瞥到別處，不去看老夏頭。\n\n「只是，我沒死到家里，沒死到大陸，沒再見我娘一面，沒給她和我老爹盡孝，這真是我最大的遺憾…」\n\n老張聲音漸漸弱下去，隱隱抽泣。他慢慢轉過頭看向老夏頭，眼皮跳動，眼睛晃動。他正打量著老夏頭。\n\n「…就這幾天的事情了…老夏，我恐怕回不去了…」\n\n老張的聲音有些顫抖，他的手緊緊按在老夏頭的手上，額上擠出深深的溝壑，呼吸聲愈來愈沈重。\n\n「但我不想埋在這里，我不想埋在台灣，老夏，這里不是我家，等我死後，我想求你把我的骨灰帶回家里去，埋在那里，不要立碑，我沒臉見後輩們……」"
 ROC.86.a:0 "「更沒臉見我爹娘在天之靈…」"
 ROC.87.t:0 "自難忘"
 ROC.87.d:0 "老張雙眼眼角扯起來，嘴角下垂，嗚嗚地哭出來，好像一陣迅疾的風瘋狂地吹打沙漠里一棵幹枯到樹。\n\n「老夏…我求你…兄弟就這一個願望…」\n\n老夏頭咬住嘴唇，舌頭觸到幾絲腥味。他重重點頭，握緊了老張的手，喉頭緊縮，話到嘴邊卻說不出來，只能沈默地看著老張。\n\n「這就好…這就好…」\n\n老張慢慢抽開自己的手，臉上溢出幸福的笑，嘴里嘟囔著什麼，聲音越來越小，老夏聽不清楚，只能緊緊握住他的手。過去一陣，病房里漸漸安靜下來，和他剛進來時沒有兩樣。\n\n他聽見心跳聲。他知道，這心跳聲只能是自己的了。"
 ROC.87.a:0 "老張咽氣了"
 ROC.88.t:0 "The Turbid Blue Sky"
 ROC.88.d:0 "黃先任眼神複雜的看著螢幕上傳來的倖存國軍將士們登上撤離載具的畫面。他知道，這一天終於是到來了，看來他不得不離開金門，這片他守護了不知歲月的國土，中華民國長達七十餘年的統治即將結束，對於金門國民的撤離已經先一步完成，還有部門國民不願離開故土，拒絕撤離，願與金門共存亡。\n\n\"報告，金門留守國民，他們自發……\"\n\n\"自發什麼？\"黃先任轉過頭來看著負責撤離的將官前來報告。\n\n\"他們自發舉行了升旗儀式，並手舉國旗送別國軍同志們。\"\n\n\"讓他們送吧，金門經歷了共軍登陸，八二三砲戰，一直作為反共第一線，金門的歷史是曲折但光榮的，也許，這一次……\"\n\n黃先任終是沒有說出口，也許這次撤離，是永別金門，中華民國也許自此與大陸完全劃分開來，血緣親情為紐帶的兩岸關係，已經隨共軍的炮火硝煙中化為無限的仇恨。\n\n\"他們，他們把國旗倒掛過來了！\"\n\n\"什麼？！\""
 ROC.88.a:0 "The White Sun sets..."
 ROC.89.t:0 "Political Ban"
 ROC.89.d:0 "戰火甫起，島嶼迅速進入全面動員狀態。隨著飛彈威脅與登陸風險同時升高，政府高層開始關注另一條看不見的戰線——內部的政治穩定與安全風險。\n\n情報單位在戰前即已警告，極端意識形態組織可能在戰時環境中被激化，甚至成為滲透、煽動與破壞的潛在節點。無論是鼓吹極端民族主義與威權統治的法西斯主義團體，還是與對岸政權存在意識形態連結的共產主義組織，都被視為可能影響戰時團結與國家安全的不穩定因素。\n\n即日起，暫時查禁所有具有法西斯主義與共產主義性質之政黨與政治組織活動。"
 ROC.89.a:0 "...Purge the traitors."
 CHI.11.t:0 "First-Ever Negative Population Growth in Taiwan"
 CHI.11.d:0 "隨著內政部戶政司敲下最後一聲定音錘，2020年的統計數據揭示了一個殘酷的現實：台灣正式步入了人口負成長時代。在過去的一年裡，島內的新生兒數量僅有16.5萬人，創下歷史新低，而死亡人數卻高達17.3萬人。這個被媒體稱為「生不如死」的自然增加死亡交叉，加上新冠肺炎疫情導致邊境管制、跨國人口流動受阻的社會減少，共同造成了台灣總人口的首次衰退。少子化與高齡化的雙重夾擊，正化為烏雲籠罩在寶島上空。這不僅僅是數據的更叠，更是一場動搖國本的長遠危機——未來，我們的工廠將缺乏勞工，我們的軍隊將缺乏士兵。政府必須立刻採取行動，否則國力的衰退將不可逆轉。"
 CHI.11.a:0 "This is a national security crisis we must face..."
 CHI.3.t:0 "The Titanic Sinks in Panic"
 CHI.3.d:0 "The power that long maintained order in the Pacific has plunged into its own civil war and division. Port blockades, military deployments, and political chaos in the United States have suddenly left once-stable maritime routes and trade networks completely unmoored. This conflict across the ocean has directly shaken the international environment we rely on to survive. Financial markets are in turmoil, and with exports and supply chains severed, an unprecedented vacuum has opened in regional security. The Pacific is no longer a symbol of peace and prosperity. It has become a source of turbulence and uncertainty.\n\nThe old order has been reduced to ashes, leaving us as an isolated island in the storm."
 CHI.3.a:0 "舊有的秩序，已然焚毀"
 CHI.7.t:0 "Late night at the Presidential Office"
 CHI.7.d:0 "As report after report landed on the President's desk, the world before Tsai Ing-wen seemed to be collapsing.\n\n\"This is impossible,\" she thought. \"Has the U.S. really just fallen apart like this?\" Yet the reality was as stark as the flames rising across the American mainland: Taiwan had lost U.S. protection and would henceforth have to forge its own path. Compared to the looming threat of the PLA across the strait, the economic crisis triggered by the U.S. collapse seemed almost trivial. Reports of multiple unusual maneuvers by the PLA signaled that the flames of war were reigniting across the Taiwan Strait—a region that had remained largely peaceful for four decades—as PLA missiles and fighter jets streaked through the skies overhead. After a brief moment of fright, Tsai Ing-wen stood up and adjusted her glasses; she understood that Taiwan needed her leadership now more than ever."
 CHI.7.a:0 "Taiwan must stand firm on its own feet."
 CHI.8.t:0 "President Han's Televised Address"
 CHI.8.d:0 "As the worldwide economy had plunged into chaos and America descended into civil war, everyone in Taiwan was gripped by a paralyzing fear. The Second American Civil War, as it is now being called, had struck a deep blow into Taiwan's economic and national security. Following an emergency high-level meeting on these affairs, the Presidential Office decided that President Han Kuo-yu would personally address the nation in a televised broadcast. As the \"President of the Common People\" appeared on camera, wearing a grave expression. Despite this, he calmly reassured the nation:\n\n\"Fellow citizens, this is no ordinary economic contraction; it is a fundamental shift in the global order. The foreign currency reserves we hold, the markets we rely on, and the world we once knew — all are quickly becoming a thing of the past.\n\nPlease be assured that emergency measures are already active to keep our financial systems stable and our daily supplies flowing. We will get through this challenge together, and Taiwan will emerge stronger and more resilient than before.\""
 CHI.8.a:0 "\"We will get through this.\""
 CHI.9.t:0 "Victims and Perpetrators"
 CHI.9.d:0 "Today marks the annual ceremony for the annulment of criminal convictions. The Transitional Justice Commission hosts these pardon ceremonies and press conferences—events that serve to remind the nation of its past, yet simultaneously reopens old wounds for the victims.\n\nUpon entering the venue, Lan Guoben took his seat with the help of a volunteer, his wrinkled hands resting folded in his lap. His father had been persecuted and imprisoned by the Kuomintang government simply for voicing a few complaints; he was subjected to days of continuous torture without release. His mother had contacted every relative and friend capable of lending money to bribe the police, yet they could never scrape together enough. Ultimately, Lan Guoben was left with no choice but to agree to become a government informant, tasked with monitoring classmates who \"spoke out of turn.\"\n\nHis father used to accompany friends into one underground reading room after another, aiding the government in the successive arrests of classmates who had once been full of youthful vitality. The tables were piled high with hefty volumes bound in bright red covers—Capital, The Communist Manifesto, The State and Revolution... It was said that these books were stained with the blood of the working class in their struggle; to him, however, they were forged from the hot blood and lives of his own schoolmates.\n\nAs President Tsai Ing-wen recited the names of those being pardoned, Lan Guoben was haunted by the realization—learned only after martial law was lifted—that his father had been beaten to death the very night he had gone to plead for his life. Everything he had done had merely served to abet the tyranny. In his dreams, Guoben often heard a chorus of young yet distant voices demanding to know why he had informed on them—why he had sent them to their deaths.\n\nYet Lan Guoben could say nothing; choked with emotion, he sat silently on the cold iron chair, the chill biting into his soul. Only when the crowd had dispersed did he—trembling and leaning on the volunteer for support—rise and slowly walk out of the venue."
 CHI.9.a:0 "This is not a pardon for his father's crimes, but yet another trial against him."
 CHI.101.t:0 "The Lost Son"
 CHI.101.d:0 "He opened his heavy eyelids; the peeling wallpaper clung listlessly to the concrete wall, revealing patches of flaking paint and spreading mold where a corner had been torn away. Ruiming pressed against his pillow and rolled over; the empty side of the bed held nothing but a solitary gray pillow. He squeezed his eyes shut, gasping for breath, then forced himself up, threw open the door, and rushed out of the room—he had survived another day.\n\nRuiming turned on the gas, but the stove refused to light. \"Right...\" He had tried to leave the gas on a few days earlier, only to be discovered by a neighbor; a well-meaning auntie had helped him \"locate\" the source of the smell and shut off the gas.\n\nHe rummaged through the cupboard and found some instant noodles bought years ago, preparing two bowls and placing them on the table. He sat on his side, gazing vacantly at the empty space opposite him, clinging to a faint, irrational hope that his son might be lying on the living room sofa, scrolling through his phone as usual. Ruiming carried the two bowls of noodles slowly toward the living room. Unsurprisingly, he was alone.\n\nHe sat down slowly; the steam from the noodles dissipating quickly. He wanted to wait in the living room for his son to return—perhaps the boy had simply gone to class early? He would see him after school, surely... The dim, amber sunlight shimmered in the noodle bowls. Ruiming snapped awake—how had he dozed off? If he didn't pick up his son, the boy would surely roll his eyes at him again! He ate every last bit of the noodles, now soggy and limp, and casually added a tally mark next to the rows of strokes covering his son's obituary—a reminder that he still owed his son a bowl of noodles. Clutching the obituary and the empty bowl, he limped up to the roof, embracing the last sliver of twilight as he stared into the void."
 CHI.101.a:0 "Only in death does duty end."
 CHI.102.t:0 "Cleaning House"
 CHI.102.d:0 "Deep within the National Security Bureau, in a dim room absent even from the building's blueprints, Agent Su and his team gathered around a crude iron camping table. Scattered across it were dozens of standard-issue folders containing mugshots, alongside thick stacks of documents piled high like a small mountain—the fruits of over a decade spent tracking pro-CCP figures. These subjects ranged from retired generals and young Taiwanese business people to certain spouses from the mainland. Since the 1980s, the CCP had attempted to infiltrate various sectors of Taiwanese society, waging cognitive warfare—both overt and covert—to sway public opinion.\n\nIn the past, constrained by close cross-strait civilian ties, the Bureau had feared that drastic measures might trigger uncontrollable social repercussions. But times had changed; Taiwan had successfully repelled the People's Liberation Army, and the moment had come to turn their sights inward. Agent Su lit a cigarette. Across the country, SWAT teams were acting on the intelligence his unit provided to apprehend collaborators; tear gas and rubber bullets would instantly neutralize any resistance, while shields and rifles would deal with the die-hards who refused to surrender... Agent Su exhaled a slow plume of smoke. He had never imagined he would live long enough to personally purge those traitors. His gaze rested on the dark gray concrete wall. Unlike the soldiers fighting bravely on the front lines, the enemies he faced were far more insidious and adept at concealment—yet, so long as he could protect the Republic of China..."
 CHI.102.a:0 "He’s willing to give up his entire life protecting it."
 CHI.103.t:0 "Lowering the Banners"
 CHI.103.d:0 "As the smoke of battle clears, society seemed to return to normal. Were it not for the surrounding wreckage, one might mistake it all for a dream.\n\nThe red dragon has been driven back to its lair, yet the land itself is no longer what it once was. Scars of combat linger at the harbor, damaged fortifications remain visible on the city's outskirts, and transportation hubs show signs of strain from prolonged, over-capacity operation. From the front lines to the home front, from factories to households, the entire society bears deep wounds from the long period of fighting. People are returning to their daily lives, only to discover that \"normalcy\" itself has changed. Some were left traumatized, some had lost everything, and some never returned. Yet, the end of the war also heralds a new beginning. The nation and its people must heal and rebuild. This will not be a process completed overnight. Amidst the smoldering embers of war, we will determine the nation's future — Whether to return to the past, or to step into a new reality vastly different from before."
 CHI.103.a:0 "President... what should we do next?"
 CHI_unlock_reconstruction_tt:0 "Will unlock Post-War Reconstruction Focus Tree."
 CHI.104.t:0 "Four Years in a Flash"
 CHI.104.d:0 "Four years can be a time of brilliance or a time of banality; it is a span long enough for carefree university students to travel the globe, yet also long enough for society to spin its wheels, achieving nothing. For Taiwan, this cycle has seen its people through one hardship after another—hardships met with remarkable resilience. Whether facing natural disasters or man-made crises, Taiwan has always endured.\n\nSince the lifting of martial law, the island’s social climate has undergone profound changes. Over decades of development, people have grown accustomed to a society that shifts in four-year cycles. The familiar spectacle of election fever arrives right on schedule, bringing candidates, debates over unification versus independence, and fierce online clashes that never fail to surprise the public. Yet, once the frenzy subsides, another quiet four-year stretch follows. Perhaps there is a certain fortune in a lifetime of such tranquility...\n\nYet, the invasion by the People's Liberation Army had brutally transformed Taiwan into a cruel meat grinder, with blood and tears watering the rice paddies of the Chianan Plain. The people still struggle to heal the wounds of war. But the future waits for no one. The curtain is quietly rising on the next presidential election—yet this time, there wasn't the usual frenzy of the media and of loudspeakers; there is now only the bewilderment of the Taiwanese people and their most earnest yearning for the future."
 CHI.104.a:0 "The die is cast."
 CHI.105.t:0 "Hand in Hand"
 CHI.105.d:0 "Holding a plain white bag from the adults, Aiqi led her \"best friend\" by the hand over to that familiar little corner. She sat down and tore open the package; inside were items of various sizes. She couldn't read the writing on them, but they were likely food—at least, that’s what the adults had told her. Aiqi broke a piece off a biscuit and handed it to her \"friend.\" \"Here, this is for you.\" Jiaqi—her teddy bear—hadn't been very talkative lately and usually didn't eat anything, so Aiqi broke off a few extra pieces this time. A chubby Jiaqi would be much cuter, after all. She gazed into the distance toward home—not the new home in the tent where they were staying now, but the old one. A few times, she had wanted to go back to the old house to find her dad and grandma. However, the men in green clothing nearby wouldn't let her, that it was too dangerous and warning her about something called \"...unexploded ordnance?\" She didn't know what that meant; she would ask her teacher about it next time she went to school.\n\nAiqi broke off another piece of biscuit, chewing quietly. Despite trying to satisfy her empty belly, nothing could satisfy the longing for her parents. Every time she asked the green men about them, they simply shrugged and said that she should return to the playground. Aiqi grabbed Jiaqi and hugged her stuffed friend tightly. Although this little corner of stone walls felt a bit lonely, it also felt safe.\n\n\"Oh! So this is where you ran off to?\" Aiqi looked up to see a blonde woman in a blue vest standing before her. \"Are you still hungry?\" Aiqi was about to shake her head when her stomach betrayed her with a loud growl. The woman smiled with a smile as lovely as her teacher's. She then seemingly reached behind and took a small bun out of thin air, placing it right into Aiqi's palm."
 CHI.105.a:0 "“Next time, you mustn't go wandering off alone, okay?”"
 CHI.106.t:0 "Eastern Reconstruction"
 CHI.106.d:0 "刺眼的陽光照亮整座車廂，陳子豪反射性地舉起手遮當陽光，可無論怎麼動他的手就是舉不起來，他環顧四週，小小的車廂活像個沙丁魚罐頭，大家緊緊貼在一起，這種人員密度大概也只有北捷的尖峰時段能與之相比。\n\n戰爭過後台灣百廢待興，像子豪這種人被政府指派到各地修繕基礎設施，高壓電線、地下水管、縱貫鐵路.......到處南北奔波，試圖重新建立起南北部的連結。莒光號緩緩煞停，月台的燈光時斷時續，子豪順著人流走上月台，南迴鐵路最近才搶修成功投入使用，成為目前聯通東西部的唯一一條交通線。\n\n「逼!」的一聲，工頭吹響口哨召集所有人到車站外集合，子豪他們是第一批重建花東的工程隊，他們將優先投入那些最危險也是最重要的的區域，為後續的支援打下堅實基礎。\n\n陳子豪深吸一口氣，擦掉額頭上的汗珠，跟著其他人一起，拾起鐵鍬鏟起地上的水泥碎塊......."
 CHI.106.a:0 "A journey of a thousand miles begins with a single step."
 CHI.107.t:0 "Where do we go from here?"
 CHI.107.d:0 "在台中某家重新開業的熱炒店裡，白天時揮灑汗水重建家園的工人們圍著一張折疊桌享受著他們夜間的放縱。呲的一聲，易拉罐啤酒拉環被壓下，清爽的氣泡從罐口冒出。咕嚕咕嚕，金黃色的小麥飲品滑入喉頭，冰涼的快感沁入全身。「哈！感覺又活過來啦！」其中一名工人發表出了彷彿嬰兒誕生般的喜悅，若不是為了維持自己的男子氣概，他甚至可能會落下熱淚。國家的重建正穩扎穩打的推動著，人們所有的思緒都用在讓家園恢復成本來的面貌——甚至更好！\n\n工人們盡情縱飲，暢想著家園全新的面貌。\n\n突然，電視播報的一則新聞吸引了他們的注意力。\n\n「隨著台灣的重建逐漸完成，在野黨的壓力之下，[CHI.Getleader]總統同意恢復總統大選。目前，各個政黨正進行黨內選舉推出候選人，在民意重新洗牌的現在，究竟會由哪個政黨執政？台灣又會迎向什麼樣的未來呢？敬請期待後續報導。」\n\n新聞播畢，工人們七嘴八舌起來。台海戰爭團結了全台上下，外部因素再也不會影響台灣的選舉進程，但人們再也不能用傳統的二分法「誰怎麼保護台灣」來投票了，選民支持佔比被全部打亂，工人們看著電視上的新聞陷入迷惘......"
 CHI.107.a:0 "Yeah, how are we supposed to choose now..."
 CHI.110.t:0 "Charting the Course"
 CHI.110.d:0 "As the work of rebuilding our homeland comes to a close, the people have recalled the fundamental right they ought to exercise: the right to vote. The war has entirely refreshed the Taiwanese perspective on politics, and every single vote cast will indeed profoundly impact the future of the nation.\n\nIn the Taiwanese political arena, the Kuomintang and the Democratic Progressive Party fundamentally stand as equals. The Kuomintang advocates maintaining ties across the strait so that, at some point in the future, they can launch a counterattack on the mainland and once again fly the Blue Sky, White Sun, and a Wholly Red Earth over China. The Democratic Progressive Party advocates for the regime to settle on this small island in the Western Pacific, maintaining a nation that belongs to the Taiwanese.\n\nMany futures that we previously dared not imagine are now springing up like mushrooms after rain, now that the PDTO has gained the upper hand. When the next January arrives, the people will discover the greatest common denominator of societal consciousness and designate the direction for the future. The Kuomintang? The Democratic Progressive Party? Or perhaps a third option?"
 CHI.110.a:0 "Hope all goes well."
 CHI.111.t:0 "The Future of the Republic"
 CHI.111.d:0 "Taiwan... no, the Republic of China's performance during the Taiwan Strait War has demonstrated to the entire world our unwavering resolve to defend our free will. In international diplomacy, nations that had previously severed ties with us under pressure from the Chinese Communist Party are beginning to extend a hand of friendship to the Republic of China. As the CCP's international influence wanes, we can finally proudly acknowledge our true national name, formally participate in various international organizations, and embrace the beautiful Blue Sky, White Sun, and a Wholly Red Earth at international sporting events.\n\nNow, we must elect the next presidential candidate who can truly represent the Republic of China. The Democratic Progressive Party, with its Taiwan-centric core, is outside the scope of consideration here. The Kuomintang must now decide which candidate to put forward to unite all pro-Republic factions. Where will this leader take the nation? Will they take up the mantle of Generalissimo Chiang's unfulfilled ambitions, or will they forge an entirely new future?"
 CHI.111.a:0 "If you want to vote, vote for President Han!"
 CHI.121.t:0 "The Will of the People!"
 CHI.121.d:0 "As certain candidates put on elitist faces for televised speeches, President Han Kuo-yu has already clocked out and headed to his usual wet market. Passing aunties greet him warmly as \"Boss Han,\" and vendors always slip him an extra bunch of green onions with his groceries. Shopping done, he stops by his favorite food stall to pick up three bowls of braised pork rice to enjoy at home with his family.\n\nThis close connection with the people is Han Kuo-yu's distinct political philosophy. He shows the Taiwanese public that politics is neither a comedy routine broadcast on television and the internet, nor cold spreadsheets and economic data. It is about living a grounded life alongside everyday citizens. He wants the public to know that when hardship strikes, Boss Han will never desert them. He will step forward in the most difficult moments!\n\nSharing in the joys and enduring the hardships together is the idealism Han Kuo-yu stands for!"
 CHI.121.a:0 "Four more years for President Han!"
 CHI.130.t:0 "Elections as Scheduled"
 CHI.130.d:0 "It is once again our quadrennial election day, but this time, it truly feels different from the past. The familiar sights of candidates sweeping the streets for votes and holding massive rallies are gone. Instead, people are gathered around their radios listening to this year's election instructions. Veterans leaning on canes sit with their comrades in veterans' homes, staring intently at the lobby radio. Fathers finishing work pull their daughters, just home from school, to turn on the television, while university students in classrooms are entirely fixated on live streams on their phones.\n\nAll day tomorrow, the people will set aside their work. In elementary school classrooms, in gymnasiums, and in temporarily erected tents, they will receive their ballots, stamp them, and drop them into the ballot boxes. Everyone knows in their hearts that the vote in their hands will truly determine the future of our society."
 CHI.130.a:0 "The future of the Republic..."
 CHI.141.t:0 "Arrival by Chance, Victory by Destiny!"
 CHI.141.d:0 "After his defeat in the 2020 presidential election, Han Kuo-yu never imagined he would once again be nominated by the Kuomintang as their presidential candidate. The people have not forgotten how he left his post as Mayor of Kaohsiung halfway through his term to run for president. However, they also have not forgotten that during the Republic of China's most critical moment of life and death, he did not choose to flee. Instead, he stayed on this land to stand and fall with the people. His diehard supporters remain steadfast in their backing, and centrist voters, exhausted by political mudslinging, are willing to give him a second chance.\n\nWith tears in his eyes, Han Kuo-yu delivers a resounding speech, declaring his resolve to march into the future shoulder to shoulder with the people. He will never run away again. This time, he will absolutely make Taiwan prosperous!"
 CHI.141.a:0 "The bald guy follows the moon, and we follow the bald guy!"
 P2HKY_unlock_tt:0 "Unlocks the §BHan Kuo-yu§! political focus branch and the §BKuomintang§! economic and military focus branches."
 CHI.142.t:0 "Victory in Saudi Arabia!"
 CHI.142.d:0 ""
 CHI.142.a:0 "Perhaps we can profit from this."
 CHI.BF.11.t:0 "回家"
 CHI.BF.11.d:0 "The sea breeze blew gently past the guardhouse, ringing the bell on the door, as waves crashed ashore in rhythm with the wind. Huang Xingding leaned against the peeling iron railing, his right hand habitually rising to his lips to mimic a smoking motion. Kinmen's coastline offered more variety than Penghu's, and the bustling Xiamen skyline at night always filled him with a deep yearning. During his childhood, his grandfather and father would often recount their days fishing in Xiamen and describe the green hills and clear waters near their ancestral home. When the Kuomintang retreated to Taiwan, they conscripted his grandfather to replenish their troops, and his father later followed suit by enlisting in the army.\n\n\"It's fine even if we can't go back; at least I can still look...\" While others groaned at drawing a Kinmen deployment, his father had been ecstatic. Sadly, he did not live long enough to see the opening of the Mini Three Links. Huang Xingding shifted his stance to lean his back against the railing. He looked toward his home, a small rented house on the island where the ashes of his grandfather and father rested. Although his father always told him it did not matter if they never returned, Huang Xingding felt he owed them far too much. He simply did not know if he would ever have the chance to bring his ancestors back to set foot in that familiar yet alien homeland.\n\nAs the sun set, his relief arrived for the shift change. Huang Xingding slung his rifle and walked the path back to camp. Kinmen Island lay devastated in the aftermath of the Taiwan Strait War, with bullet holes clearly visible on the cliff faces and missile craters dotting the distance. Bypassing these ruins, he stepped onto the tourist trail and walked up to the massive stone monument inscribed with the words \"Wu-Wang-Zai-Ju.\" He had no great fondness for Chiang Kai-shek. Over the decades, however, the former leader had gradually transformed into a symbol that merged with their homesickness, carrying the regrets and unfulfilled wishes of the old veterans far into the distance.\n\nHe pulled the photograph from his helmet liner. Its yellowed surface could not obscure his father's confident face. Back then, the older man firmly believed that the Republic of China would one day retake the mainland and return to their hometown, fully intending to show off in the village when that day came! But given Taiwan's exhausted military strength today, did he truly have a chance to carry his father's dying wish back home? Even if they did return, could they really liberate their mainland compatriots with the triumphant spirit his father had imagined?"
 CHI.BF.11.a:0 "Nevermind, let's just focus on the task at hand..."
