 CHI_GATHERING_STORM_DESC: "The lone island of democracy is facing its greatest test, as Taiwan's persistence in freedom and autonomy reaches a critical point. While the younger generation is more awakened and brave than ever, the island faces mounting internal challenges: slowing economic growth, severe energy vulnerability, and bitter political infighting tearing at the social fabric.\n\nExternally, pervasive cognitive warfare and daily patrols by PLA warships and aircraft exert constant pressure, deepening historical scars over national identity. Taiwan must now confront these trials head-on, as the survival and dignity of 23 million people depend on the outcome."

 CHI_KMT_path_tt: "§BKuomintang (Chinese Nationalist Party)§!\n\n\n\n\n£GFX_KMT_banner\n\n\n\n\n\n-------------------------------------\n\n\n\n\n\n\n\n  £GFX_CHI_han_kuo_yu\n\n\n\n\n\n\n\n\n-------------------------------------\n§YThe Three Principles of the People\nThe foundational principle that we follow.\nUsing this, we establish the Republic;\nUsing this, we advance towards Great Unity.\nOh, you, righteous men,\nFor the people, be their vanguards.\nDay or night, without resting,\nFollow the Principles.\nSwear to be diligent; swear to be courageous.\nObliged to be trustworthy; obliged to be loyal.\nWith one heart and one virtue,\nWe carry through until the very end.§!"

 CHI_DPP_path_tt: "§GDemocratic Progressive Party§!\n-------------------------------------\n\n\n\n\n£GFX_DPP_banner\n\n\n\n\n\n-------------------------------------\n\n\n\n\n\n\n\n  £GFX_CHI_tsai_ing_wen\n\n\n\n\n\n\n\n\n-------------------------------------\n\n§YProtecting our hometown, no matter who you are, we are all vanguards.\nStepping forward with brave and steady paces, destiny is in our hands.\nFighting for the future, your hopes are kept in our hearts.\nFor the smiles of the children, we become the power of happiness. Walking our own path, even if there is wind and rain.\nKeep your heart steady, don't fear difficulties blocking the way.\nCharging forward for ideals.§!"

 CHI_country_summary2: "§YCountry Summary§!:\nMajestic mountains and rivers, abundant resources. The dragon of the East, born on the land of China at the beginning of the 20th century, after experiencing the invasion of the §RJapanese Empire§W in World War II and the revolution of the §dChinese Communist Party§W, can now only curl up in a corner of the southeast. Its resting place is only Taiwan—as well as a few small islands along the coast of Fujian and in the South China Sea.\n\nToday, the \"§3Republic of China§W\" is more like a corpse that has long been dead, mostly only able to call itself \"Taiwan\" or \"Chinese Taipei\" in its exchanges with countries around the world. During the successive administrations of the Democratic Progressive Party, continuous modifications of the curriculum guidelines and ongoing political propaganda have made \"Taiwan\" the national identity of many of its citizens. It seems that as long as things develop naturally, the Republic of China will lie down in its coffin on its own.\n\nHowever, today in the 2020s, the global political landscape is changing rapidly, and the \"maintaining the status quo\" plan agreed upon by most people in the past is already riddled with holes. The citizens of the Republic of China are once again faced with a choice—should they abandon their compatriots in \"§RFujian Province§W\" and establish a country called \"§GTaiwan§W\", or should they stick to the \"§3Republic of China§W\" and wait for the situation to change?"

 CHI_country_summary: "§YCountry Summary§!:\n\n§3[CHI.GetFlag] The Republic of China§!, born in the flames of the Xinhai Revolution. Once ruling the vast §3Mainland China§!, it endured war, §drevolution§!, and upheaval throughout the turbulent 20th century. The bloody civil war eventually rewrote history. The Nationalist Government retreated to §GTaiwan§!, and the fate of [PRC.GetFlag]§RChi§!§3na§![CHI.GetFlag] turned to a new chapter.\n\nPost-war §GTaiwan§! rose from a humble island to one of Asia's most dynamic regions during the Cold War, driven by its hardworking people, rapid economic growth, and booming industry.\n\nThe political system transformed from §gauthoritarian rule§! to a §Ydemocratic system§!, as diverse voices shaped today's Taiwanese society. Freedom and prosperity gave this small island a unique place on the world stage.\n\nYet the shadow of the §3Republic§! lingers. The §R[PRC.GetFlag] Red Dragon§! glares like a tiger, while political divisions tear at society. Can the §3Republic of China§! defeat the §Rwicked dragon§!? Can the §Gdream of Taiwan independence§! be realized?\n\n§Y\"Guard freedom, and let this island continue to move forward.\"§!"

 CHI_country_paths: "§YCountry Paths§!:\n§3 - Kuomintang (Chinese Nationalist Party)§!\n§G - Democratic Progressive Party§!"

 CHI_country_other: "§YGameplay Tips:§!\n§YLife is short, treat it just like a game.\nSometimes you worry, sometimes you relax.\nYou ask me what secret tricks I have up my sleeve?\nActually, there are no shortcuts, as long as you're happy!§!"

 CHI_oil_crash_name: "Oil Crisis"

 CHI_oil_crash_desc: "As oil prices soar and the economic system collapses triggered by the Saudi Arabian civil war, international energy and financial markets have successively fallen into disorder. The shock quickly spilled over, dealing a heavy blow to Taiwan."

 CHI_Legislative_Yuan_decisions: "Legislative Yuan"

 CHI_Legislative_Yuan_decisions_desc: "\n\n\n\n\n£GFX_CHI_congress\n\n\n\n\n\n\n\n§YThe Legislative Yuan of the Republic of China§! is the highest legislative body of the Republic of China, generally regarded as the parliament of the Republic of China. It is responsible for enacting laws, reviewing the central government budget, approving treaties, and holding the Executive Yuan politically accountable. [CHI_lfy_dangtuan]"

