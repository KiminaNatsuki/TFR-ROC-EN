##
 CHI_compete_for_central_plains_desc: "With the conclusion of the Greater Asian War, China... or rather, \"Communist China\", was jointly dismembered by the Pacific Treaty Organization. If not for the existence of the Republic of China, the very concept of China might have temporarily disappeared from this world. Warlords have sprung up everywhere on the mainland, remnants of the PLA are eager to make a move, and leftover officials from the Beijing government are stubbornly resisting with a small number of troops. Taiwan's strength as a single province is only enough to support the recovery and revival of Hainan and Guangdong. The best approach is to establish autonomous governments locally, implement political tutelage, and let the locals rebuild their own homes. Now that we have secured our ticket to compete for the great cause of unification, let us prepare and launch the Second Northern Expedition."

 CHI_regional_political_tutelage_desc: "According to the Founding Father's strategy for national construction, for the Republic of China to implement a truly democratic and free system, it must go through three stages: Military Rule, Political Tutelage, and Constitutional Democracy. Nearly a century after the mainland fell to the red plague, our Blue Sky, White Sun, and a Wholly Red Earth flag once again flies over the mainland. In order to rekindle the democratic consciousness and free will of our compatriots on the mainland, and to shatter the CCP's spiritual shackles upon them, President Han Kuo-yu has decided to dispatch Kuomintang members of all levels from Taiwan to establish \"Political Tutelage Committees\" in the areas we have reclaimed. The goal is to help our mainland compatriots recognize and understand modern democracy, thereby reviving their political passion for loving democracy, freedom, and the country."

 core_decisions_tt: "Unlocks §BCore Creation§! decisions for mainland states"

 core_1_decisions_tt: "Reduces §BCore Creation§! decisions cost by 10 Political Power and increases time by 50 days"

 core_2_decisions_tt: "Increases §BCore Creation§! decisions cost by 10 Political Power and reduces time by 45 days"

 CHI_trust_localities_desc: "Although we are gradually carrying out a democratic revolution on the mainland—one that is nearly a century late—according to the governing strategies we once dreamed of, times have changed, and the current situation on the mainland is not something we can fully grasp. If we were to look at things through a fog and forcibly transform the political landscape of the mainland according to our will, it might actually bring disaster. Therefore, we will conduct assessments on the personnel of the former CCP local government departments, and select those who support freedom, uphold democracy, and love the Republic of China to remain in the new local governments we support. By doing so, we can more rapidly complete the formation of our new local governments and maintain their efficient operation."

 CHI_central_supervision_policy_desc: "To practically ensure that the newly formed local governments on the mainland do not repeat the dictatorial tyranny of the former CCP government, and to truly practice the consistent democratic spirit of our Republic of China in administration, President Han and his staff have decided to dispatch \"Democratization Supervision Groups\" to the new governments across the mainland. The aim is to ensure that the new local governments on the mainland can start from the basic premise of \"defending democracy and freedom\" and achieve their governance goals in a manner consistent with universal values. This will help rebuild a stable democratic order for our compatriots on the mainland, better supporting our subsequent righteous actions in the region."

 CHI_republic_achieved_desc: "\"San Min Chu-i, Our aim shall be: To found a free land, World peace, be our stand...\"\n\nWhy is the Zhonghua Mingguo (Republic of China) called a Mingguo? Some say it is merely a translation of the English word \"republic\" and not native to China, while others call it the mythical ravings of a fool. But following such logic, are billions of Chinese people destined only to be preyed upon by dictatorial tyranny? The Founding Father said no; thus, they rose together for the Republic, overthrowing four thousand years of imperial tyranny, marking the beginning of Chinese democracy. When the red disaster struck from the north, our democratic dream lost its luster, but it did not die. Today, the millions of Chinese people can finally lift their heads. Neither imperial palaces nor the red disaster can stop the pace of Chinese democracy.\n\nArise, Chinese people, for your democracy! Arise, China, for your freedom!"

 CHI_rapid_political_tutelage_desc: "Using the past methods that guided the democratic transition of the Taiwanese people would cost an enormous amount of time, manpower, and resources. The massive financial expenditure would drag the country down before political tutelage could even be completed. We must use every means possible to make the locals understand their rights and obligations in a democratic society, and ultimately return the right to free elections to them."

 CHI_establish_regional_seats_desc: "The next step is to quickly establish county and city councilors along with other public servants. We should hold elections in a popular format whenever possible. If there are vacancies, they should be filled either by central dispatch or by re-employing former local officials with no criminal record."

 CHI_finally_free_desc: "Military Rule, Political Tutelage, and Constitutional Democracy—the three stages of democratization proposed by Mr. Sun Yat-sen—were frequently interrupted by wars on this land. The Northern Expedition, the Eight-Year War of Resistance, and the Chinese Civil War; continuous conflicts halted democracy at the Political Tutelage stage. Now, we have returned. Sun Yat-sen's dying words, \"The revolution is not yet successful; comrades still must strive,\" have been thoroughly realized in the hands of our generation. The free White Sun shines above the mainland! Long live the Republic of China!"

 CHI_mongolian_negotiations_desc: "Mongolia—a country bordering China to the south and Russia to the north. The birth of this nation did not arise from a context of national self-determination or separatism, but rather, it was established by the former Soviet regime forcibly ceding land to create a buffer state between China and Russia. The CCP, which tacitly accepted this relationship, is now gone, and our country has never recognized this treaty. We should immediately dispatch diplomats to Mongolia to discuss the issue of its continued existence."

 CHI_tuva_problem_desc: "The Tuva Republic—formerly known in Chinese as Tannu Uriankhai. Centuries ago, the Russian Empire and the Qing Empire engaged in a game of governance over this strategic location. After the success of the Xinhai Revolution, Tannu Uriankhai followed Outer Mongolia in declaring independence from China and joined the Russian Empire. It subsequently went through the Soviet era to become the Tuva Republic within the present-day Russian Federation. Our actions to recover Outer Mongolia have already caused tension with Russia, and the Tuva issue could potentially spark another major war."

 CHI_begonia_leaf_desc: "Having resolved relations with Mongolia, more than ninety percent of our country's claimed maximum territory has been secured. There are still many fragmented lands under the control of other nations, some of which are partners who once stood on the same front with us against the CCP. The government will dispatch diplomats to discuss this, hoping that it won't lead to outcomes that none of us would be happy to see..."

