 CHI_Economy_Industry_desc: "At the enormous cost of our economic power, we've successfully defended our homeland. The CCP's invasion has destroyed our infrastructure and coastal industry, leaving us the job of restarting our economy."

 CHI_Rebulid_7th_CT_desc: "In accordance with the \"Future Development and Construction Plan for Taiwan International Commercial Ports (2017-2021), 2nd Revised Plan\" from the Executive Yuan, the \"Kaohsiung Port Terminal 7 Project\" was drafted and subsequently approved by the Executive Yuan on April 24, 2019.\n\nHowever, the arrival of war and the horrifying bombardment by the CCP severely devastated the entire port area. This nearly reset the progress of Terminal 7 to zero, a project originally scheduled for completion in mid-2024.\n\nThe central government has approved a proposal to provide additional resources to the project, ensuring that Terminal 7 can be completed on schedule.\n\nTerminal 7 is planned to include 5 deep-water berths and 149 hectares of backland space, capable of accommodating the world's largest 24,000 TEU container ships in the future. The first phase, consisting of 2.5 berths and backland reclamation, was executed under the \"Kaohsiung Port Intercontinental Container Center\" project and completed in May 2019, with repairs concluding just days ago. This project will continue with the construction of the remaining phase two operational infrastructure: 2.5 berths, 51 hectares of land reclamation, container yards and related facilities, an operations management building, and 32 auxiliary structures. Ultimately, this will create a massive automated container base with a storage and transit capacity of over 4.5 million TEUs per year."

 CHI_Way_Of_Can_To_Asia_desc: "Today, the entire world is mired in the flames of war or post-war rubble, and food supplies are severely strained. As our nation seeks a rapid restoration of our industrial system after the war, we should heavily invest in the production of military rations and canned goods. This will drive the development of modern agriculture and light industry, generate foreign exchange, and increase our food reserves, preparing us for the future development of heavy industry and any other crises that may arise."

 CHI_Expand_FPG_desc: "Formosa Plastics Group is a Taiwanese multinational conglomerate that began in the petrochemical industry. Currently, its business footprint has diversified across oil refining, plastics, fibers, electronic materials, green energy, biomedicine, and steel.\n\nIf we want Taiwan's industrial system to rapidly rise once again, government intervention to expand the business operations of Formosa Plastics is the faster choice. We can utilize its fully integrated corporate structure to achieve rapid development."

 CHI_From_Material_To_Product_desc: "For many years, Taiwan's industry has heavily relied on cheap imported raw materials, which are processed domestically before being sent to Europe and the Americas for further processing or sale. The advantage of this approach was the ability to absorb massive amounts of foreign exchange by leveraging the price advantage of cheap labor. The drawback is that even minor geopolitical fluctuations can easily inflict massive shocks upon our domestic industry.\n\nWith the precedents of the previous two oil crises and the CCP's blockade of our island, securing our supply chain has become our primary mission. Everything from oil and minerals down to plastics and microchips will be kept firmly in our grasp. Only a secure business environment can preserve our hard-won reform achievements; the Republic of China will absolutely not allow any nation to shake the foundations of our state, not even our allies."

 CHI_Civil_Military_Supply_Chain_desc: "Currently, our nation's demand for basic military supplies has exceeded the absolute production capacity of our arsenals. Rather than spending vast amounts of time and money building entirely new military factories, it would be better to invest in the private sector and outsource the production of basic military necessities to civilian enterprises. At the same time, we can absorb their advanced technology to improve our production processes."

 CHI_Local_Heavy_Ind_desc: "In the 1970s, the government heavily invested in the development of heavy industry. The smoke billowing from massive steel mills, shipyards, and oil refineries marked the glorious era of the Republic of China's march toward industrialization.\n\nHowever, the energy-intensive heavy and chemical industries soon hit the wall of the oil crisis and could not be sustained. Consequently, while scaling back investments in these sectors, government officials strongly encouraged domestic and foreign manufacturers to invest in high-tech industries such as integrated circuits and computers. This replaced heavy industry with technology-intensive industries characterized by low energy consumption, low pollution, and high added value.\n\nWith the Taiwan Strait War and regional tensions generating massive demand for civilian and military steel, military-grade fuels, tanks, and warships, heavy industry is slowly beginning to revive amidst the flames of war.\n\nTo grant our nation greater autonomy in steel and military industry to handle foreseeable crises, the central government has decided to increase its support for heavy industry."

 CHI_Software_Tech_Park_desc: "Located in Kaohsiung's Asia New Bay Area, the Kaohsiung Software Park was once the shining pearl of our nation's digital content and software R&D. Unlike the heavy technology parks of Hsinchu and Southern Taiwan, which are filled with massive wafer fabrication plants, this park is characterized by its modern tech office buildings. It once gathered top enterprises like Foxconn and Brogent Technologies, building a prosperous software ecosystem.\n\nHowever, the spread of war and the park's perilous geographical location, coupled with the fact that a massive number of R&D personnel were either drafted by the military or forced to flee, turned this park into a ghost town in an instant. Now, to restore the technological glory of southern Taiwan, the central government has officially approved a reconstruction plan for the park. By integrating various industrial development resources in the south, we will reignite the engine of our nation's tech industry and lead the Kaohsiung Software Park into a powerful resurgence."

 CHI_ROC_First_desc: "Our nation strongly welcomes economic investments and trade invitations from around the world, but this must all be predicated on the fundamental principle that our domestic industries remain unthreatened. Handing massive sectors of our industry over to foreign corporations is extremely dangerous. We must first revive our domestic enterprises before discussing anything else."

 CHI_Pacific_Trade_Zone_desc: "Whether pursuing free trade or adjusting tariffs, the absence of a highly reliable governing body could easily lead to a loss of control, inflicting secondary damage on our fragile economy. Under the current circumstances, it is best to first stabilize trade relations with PDTO members and the various island nations across the Pacific."

 CHI_Pacific_Trade_Zone_opinion_modifier: "Stabilize Pacific Trade Zone"

 CHI_Investment_From_EU_JP_desc: "This country needs substantial external economic stimulus to spark industrial recovery. European nations thousands of miles away, along with a Japan largely untouched by the massive flames of war, are highly willing to allocate funds for investment. The government should formulate preferential plans to attract this investment, such as market deregulation and tax exemptions."

 CHI_Investment_From_EU_JP_opinion_modifier: "Attract EU and Japanese Investment"

 CHI_Free_Trade_desc: "The government has decided to continue its previous trade policies. A free market can attract a greater injection of foreign capital. Rather than a slow economic recovery, this nation's economy requires a much stronger dose of medicine."

 CHI_TARIFF_desc: "Allowing a completely free economy at this critical juncture could deal a severe blow to certain sectors, potentially rendering them unable to ever recover. It is necessary for the government to use its heavy hand to adjust import and export tariff ratios to protect domestic agriculture and manufacturing."

 CHI_Fiscal_Policy_Adjustment_desc: "Industries across the island of Taiwan are waiting to be rebuilt, and the government must rethink its foreign trade policies. Low tariffs help reduce prices but could deal a severe blow to our already teetering domestic industries, while high tariffs would drive up prices and spark widespread public resentment."

 CHI_Defence_Economic_Policy_desc: "Although the Republic of China has always continued to research and develop domestically produced equipment, the military has consistently viewed American-made weaponry as its primary combat armament. Ever since the United States descended into civil war, the National Armed Forces have faced persistent issues with replenishing equipment. Later, upon joining the PDTO and leading up to the Taiwan Strait War, our soldiers frequently found themselves in crisis because weapons could not arrive in time. The Ministry of National Defense has learned a painful lesson from these experiences and is determined to develop a complete, top-to-bottom military-industrial complex where every single component of our most advanced equipment can be produced entirely within the nation."

 CHI_Complete_Military_Idustry_desc: "The budget funds allocated to the defense industry have smoothly passed. Beyond the manufacturing of light equipment, we must expand our production lines and master the ability to mass-produce armored vehicles, engines, and warships. We must achieve a powerful capability of endurance, enabling us to fight independently for months even if our allies cannot provide timely support."

 CHI_NOMORE_Oil_Crisis_desc: "The Fourth Oil Crisis dealt a massive blow to our nation's economy. Fortunately, the government promptly established contact with other oil-producing nations and began transitioning our thermal-centric power generation system, allowing us to successfully weather this economic catastrophe. Over-reliance on external fossil fuels has proven to be unreliable, and the new government intends to continue pushing forward the energy policies left behind by its predecessor."

 CHI_Maintain_Nuclear_Policy_desc: "Since the Cold War, nuclear technology has consistently been feared by the world, with the Chernobyl disaster and the Fukushima nuclear accident each amplifying this inner terror. Our people must understand that nuclear energy is the cleanest and most efficient power source available. At the same time, with advancements in construction techniques and the perfection of technology, modern nuclear power plants possess the ability to withstand high-intensity natural disasters and direct fire attacks. If we are to rapidly revive our nation, we must absolutely consider the reactivation of nuclear power."

 CHI_Break_Solar_Monopoly_desc: "Unexpectedly, the People's Republic of China possesses the world's strongest solar panel technology and production capacity; eighty percent of the world's solar panels are produced by them. Given that we fought a war against them just months ago, it is highly unlikely they would be willing to \"share\" this green technology with us. We must find another way; we absolutely cannot let the regime across the strait hold us by the throat!"

 CHI_Self_Sufficiency_desc: "The global order has been shattered, and the beautiful vision of a global village has collapsed. While cooperating with foreign countries to develop solar technology might help us avoid the dilemma of working in isolation, collaborating with foreign nations in this new world has become a risky endeavor. It is best and safest for us to master the entire production system ourselves."

 CHI_From_Downstream_To_Upstream_desc: "In the past, PRC constantly shouting slogans like \"independent development\" and \"don't let foreign countries hold us by the throat\" always drew ridicule from the Taiwanese people. The Taiwanese never imagined that their own country would one day have to independently develop a certain technology. Now, we possess a complete production system. No matter how the global situation fluctuates, it will not excessively impact our solar industry."

 CHI_outward_expansion_desc: "Although some scholars have called for Taiwan to establish a solar energy system entirely of our own, rebuilding from scratch takes time. We are currently in a race against time with the CCP; if they were to suddenly launch a sneak attack, all our hard-fought achievements could be ruined in a single blow. Looking purely at short-term gains, cooperating with foreign solar companies is the much safer bet."

 CHI_outward_expansion_opinion_modifier: "Outward Expansion"

 CHI_support_foreign_research_desc: "Our nation possesses an abundance of high-tech talent. We can dispatch them to assist with the technological research and development of foreign companies, accelerating the iteration speed of solar technology. At the same time, this will allow us to further cultivate our personnel, who will then help drive the progress of our own solar energy system."

 CHI_international_division_of_labor_desc: "In the past, the Republic of China was a member of the US-led global division of labor. Now, with the United States engulfed in civil war, our government is actively acting as a bridge between the EU and the PDTO to construct a new Eurasian division of labor in response to the solar energy issue. While this currently only applies to the photovoltaic industry, perhaps it will become the first spring of a new global system."

 CHI_i_am_become_death_desc: "During the Chiang era, our clandestine \"Hsinchu\" and \"Taoyuan\" nuclear weapons programs were forcibly terminated by the United States following a traitor's leak.\n\nToday, the superpower that once interfered is consumed by civil war. By reactivating our civilian nuclear power, we have quietly reclaimed the necessary nuclear technologies. This time, no one can stop the Republic of China from arming itself with the ultimate deterrent."

