 CHI_ROC_navy: "Republic of China Navy"

 CHI_ROC_navy_dynamic: "Republic of China Navy"

 CHI_ROC_navy_dynamic_desc: "\n\n\n\n£GFX_CHI_ROCN_texticon\n\n\n\n\n\n§yWhen Sea Power prospers, the Nation prospers; when Sea Power weakens, the Nation weakens. Sea Power concerns the rise and fall of the Nation!§!\n\nThe Republic of China Navy is the maritime armed force of the ROC Armed Forces. It is a naval fleet with a century of history. Since its establishment in 1928, it has borne the mission of defending the maritime borders of the Republic of China. The ROC Navy once resisted the powerful Japanese Combined Fleet to the last moment, escorted the government and millions of military and civilian personnel safely across the sea to Taiwan, and blockaded the Taiwan Strait for thirty years. Naval officers and men have always exerted the anchor chain spirit of \"weathering the storm together,\" making great contributions to the Republic of China. Riding the wind and breaking the waves, they patrolled the turbulent Taiwan Strait day and night, securing the nation's maritime lifeline.\n\n§yLimited by national strength, our country found it very difficult to develop a navy in the past, causing our naval forces to remain mediocre since their inception. Although successive ROC governments since the Xinhai Revolution hoped to develop the navy to prevent a repeat of the Qing Dynasty's situation, our country faced immense landward pressure. Therefore, no extra resources were ever invested in the navy, except for receiving dozens of surrendered Japanese ships after Japan's capitulation, and more than 20 landing ships and several frigates gifted by the US. Later, it was even defeated by the numerically inferior CCP Navy. It can be said that the ROC Navy was never a powerful naval force. However, our country's current coastal defense needs are immense, making naval reform imperative!§!\n"

 CHI_ROC_navy_dynamic_2: "Republic of China Navy"

 CHI_ROC_navy_dynamic_2_desc: "\n\n\n\n£GFX_CHI_ROCN_texticon\n\n\n\n\n\n§yWhen Sea Power prospers, the Nation prospers; when Sea Power weakens, the Nation weakens. Sea Power concerns the rise and fall of the Nation!§!\n\nThe Republic of China Navy is the maritime armed force of the ROC Armed Forces. It is a naval fleet with a century of history. Since its establishment in 1928, it has borne the mission of defending the maritime borders of the Republic of China. The ROC Navy once resisted the powerful Japanese Combined Fleet to the last moment, escorted the government and millions of military and civilian personnel safely across the sea to Taiwan, and blockaded the Taiwan Strait for thirty years. Naval officers and men have always exerted the anchor chain spirit of \"weathering the storm together,\" making great contributions to the Republic of China. Riding the wind and breaking the waves, they patrolled the turbulent Taiwan Strait day and night, securing the nation's maritime lifeline.\n\n§yDuring the Taiwan War, the Navy valiantly resisted the powerful PLAN fleet. Facing the PLAN, which possessed aircraft carriers and large guided-missile destroyers, the naval officers and men, though weak, fought back bravely and fearlessly, preventing the PLAN from blockading the entire island and securing the nation's maritime lifeline. This also deterred the PLAN from brazenly bombing our defensive positions, buying time for the arrival of the joint Japan-Australia fleet. The Navy also valiantly joined the battle after the joint fleet's arrival, recapturing the outer islands. These performances by the Navy in the Taiwan Strait War proved that the ROC Navy exerted the anchor chain spirit of \"weathering the storm together,\" bravely and fearlessly fulfilling the mission of defending the maritime borders of the Republic of China, and becoming a coastal defense force trusted by its citizens.§!\n"

