 CHI_Sanyang_motor_organization: "Sanyang Motor Co., Ltd."

 CHI_Sanyang_motor_organization_desc: "[UNTRANSLATED] 三陽工業股份有限公司是中華民國的機車製造機構，專注於輕型車輛的設計、研發與製造。"


# =============================================
 # 裕隆汽車製造股份有限公司 (Yulon Motor Co., Ltd.)
 # =============================================
 CHI_yulon_motor_organization: "Yulon Motor Co., Ltd."

 CHI_yulon_motor_organization_desc: "[UNTRANSLATED] 裕隆汽車製造股份有限公司是中華民國的汽車製造機構，專注於各類車輛的設計、研發與製造。"

 # =============================================
 # 金賓汽車股份有限公司 (Champion Auto Co., Ltd.)
 # =============================================
 CHI_champion_auto_organization: "Champion Auto Co., Ltd."

 CHI_champion_auto_organization_desc: "[UNTRANSLATED] 金賓汽車股份有限公司是中華民國的汽車製造機構，專注於各類車輛的設計、研發與製造。"

 # =============================================
 # 國防部軍備局生產製造中心第202廠(the 202th Arsenal)
 # =============================================
 CHI_armaments_bureau_202_organization: "Armaments Bureau 202nd Arsenal"

 CHI_armaments_bureau_202_organization_desc: "[UNTRANSLATED] 國防部軍備局生產製造中心第202廠是中華民國的武器製造機構，專注於坦克和其他陸地武器的研發與製造。"

# =============================================
 # 國防部軍備局生產製造中心第205廠 (the 205th Arsenal)
 # =============================================
 CHI_armaments_bureau_205_organization: "Armaments Bureau 205th Arsenal"

 CHI_armaments_bureau_205_organization_desc: "[UNTRANSLATED] 國防部軍備局生產製造中心第205廠是中華民國的武器製造機構，專注於各類武器的研發與製造。"
