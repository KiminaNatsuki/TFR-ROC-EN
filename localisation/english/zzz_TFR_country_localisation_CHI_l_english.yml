 CHI_GATHERING_STORM_DESC:0 "The beacon of democracy standing alone at sea is flickering violently. Taiwan's persistence in freedom and autonomy has now reached its most dangerous critical point.\n\nThe younger generation has never been so awake and brave; but on the other side of the coin, there are many factors such as slowing economic growth, extreme energy vulnerability, vicious fighting between the ruling and opposition parties tearing society apart, pervasive gray-zone cognitive warfare, the PLA's warplanes and warships circling the island daily to exert pressure, the historical scars of unification vs. independence, and the generational cognitive divide.\n\nOn the course to tomorrow, the sea is still stormy and full of hidden reefs.\n\nTaiwan must face millions of trials, upon which the survival and dignity of 23 million people depend."
 CHI_KMT_path_tt:0 "§BKuomintang (Chinese Nationalist Party)§!\n\n\n\n\n\n\n\n£GFX_KMT_banner\n\n\n\n\n\n\n\n\n\n-------------------------------------\n£GFX_CHI_han_kuo_yu\n\n\n\n\n\n\n\n\n\n\n\n\n\n-------------------------------------\n§YSan Min Chu-i, Our aim shall be:\nTo found a free land, World peace, be our stand.\nLead on, comrades, Vanguards ye are.\nHold fast your aim, By sun and star.\nBe earnest and brave, Your country to save,\nOne heart, one soul, One mind, one goal.§!"
 CHI_DPP_path_tt:0 "§GDemocratic Progressive Party§!\n-------------------------------------\n\n\n\n\n\n\n\n£GFX_DPP_banner\n\n\n\n\n\n\n\n\n\n-------------------------------------\n£GFX_CHI_tsai_ing_wen\n\n\n\n\n\n\n\n\n\n\n\n\n\n-------------------------------------\n\n§YProtecting our hometown, no matter who you are, we are all vanguards.\nStepping forward with brave and steady paces, destiny is in our hands.\nFighting for the future, your hopes are kept in our hearts.\nFor the smiles of the children, we become the power of happiness. Walking our own path, even if there is wind and rain.\nKeep your heart steady, don't fear difficulties blocking the way.\nCharging forward for ideals.§!"
 CHI_country_summary2:0 "§YNational Overview§!:\nMajestic mountains and rivers, abundant resources. The dragon of the East, born on the land of China at the beginning of the 20th century, after experiencing the invasion of the §RJapanese Empire§W in World War II and the revolution of the §dChinese Communist Party§W, can now only curl up in a corner of the southeast. Its resting place is only Taiwan—as well as a few small islands along the coast of Fujian and in the South China Sea.\n\nToday, the \"§3Republic of China§W\" is more like a corpse that has long been dead, mostly only able to call itself \"Taiwan\" or \"Chinese Taipei\" in its exchanges with countries around the world. During the successive administrations of the Democratic Progressive Party, continuous modifications of the curriculum guidelines and ongoing political propaganda have made \"Taiwan\" the national identity of many of its citizens. It seems that as long as things develop naturally, the Republic of China will lie down in its coffin on its own.\n\nHowever, today in the 2020s, the global political landscape is changing rapidly, and the \"maintaining the status quo\" plan agreed upon by most people in the past is already riddled with holes. The citizens of the Republic of China are once again faced with a choice—should they abandon their compatriots in \"§RFujian Province§W\" and establish a country called \"§GTaiwan§W\", or should they stick to the \"§3Republic of China§W\" and wait for the situation to change?"
 CHI_country_summary:0 "§YNational Overview§!:\n§3[CHI.GetFlag] The Republic of China§!, born in the flames of the Xinhai Revolution. This newborn republic once ruled the vast §3Mainland China§!, and during the turbulent 20th century, it went through the heavy tests of war, §drevolution§!, and tremendous changes of the times. However, the bloody civil war that swept across the mountains and rivers eventually rewrote the course of history. The Nationalist Government moved to §GTaiwan§!, and the fate of [PRC.GetFlag]§RChi§!§3na§![CHI.GetFlag] turned to a brand-new chapter.\n\nPost-war §GTaiwan§! started as an island that was not wealthy, and gradually gained a foothold during the Cold War. Relying on its hardworking people and continuous reforms, its economy grew rapidly, and its industry and technology boomed, making this land one of the most dynamic regions in Asia.\n\nThe political system also continuously transformed amid the changes of the times. From §gauthoritarian rule§! to a §Ydemocratic system§!, society gradually opened up, and diverse voices interwove into today's Taiwanese society. Freedom, prosperity, and an ever-improving system have allowed this small island to hold a unique position on the world stage.\n\nHowever, the shadow of the §3Republic§! has never faded away. The §R[PRC.GetFlag] Red Dragon§! on the other side of the west has always been glaring like a tiger, and the colorful political voices on the island are increasingly tearing society apart. The road ahead is still full of variables. Can the §3Republic of China§! overcome the national disaster and defeat the §Rwicked dragon§!? And can the §Gdream of Taiwan independence§! be realized in the new decade?\n\n§Y\"Guard freedom, and let this island continue to move forward.\"§!"
 CHI_country_paths:0 "\n\n\n§YNational Paths§!:\n§3 - Kuomintang (Chinese Nationalist Party)§!\n§G - Democratic Progressive Party§!"
 CHI_country_other:0 "§YGameplay Tips:§!\n§YLife is short, just like playing around.\nSometimes you worry, sometimes you're relaxed.\nAsking me what magic weapons I have in my belly,\nActually there are no tricks, as long as you're happy.§!"
 CHI_oil_crash_name:0 "Oil Crisis"
 CHI_oil_crash_desc:0 "As oil prices soar and the economic system collapses triggered by the Saudi Arabian civil war, international energy and financial markets have successively fallen into disorder. The shock quickly spilled over, dealing a heavy blow to Taiwan."
 CHI_Legislative_Yuan_decisions:0 "Legislative Yuan"
 CHI_Legislative_Yuan_decisions_desc:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\n£GFX_CHI_congress\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n§YThe Legislative Yuan of the Republic of China§! is the highest legislative body of the Republic of China, generally regarded as the parliament of the Republic of China. It is responsible for enacting laws, reviewing the central government budget, approving treaties, and holding the Executive Yuan politically accountable. [CHI_lfy_dangtuan]"
 CHI_start_lfy_desc:0 "\n\n§3Pan-Blue Coalition§!:\n\n§3Kuomintang§! £GFX_CHI_KMT_logo Support: §Y[?CHI_influence_KMT|1%]§!\n\n§sNon-Partisan Solidarity Union§! £GFX_CHI_NSU_logo Support: §Y[?CHI_influence_NPSU|1%]§!\n\n§OPeople First Party§! £GFX_CHI_PFP_logo Support: §Y[?CHI_influence_PFP|1%]§!\n\n§!New Party§! £GFX_CHI_NP_logo Support: §Y[?CHI_influence_NP|1%]§!\n\n§tLabor Party§! £GFX_CHI_LP_logo Support: §Y[?CHI_influence_LP|1%]§!\n\n§GPan-Green Coalition§!:\n\n§GDemocratic Progressive Party§! £GFX_CHI_DPP_logo Support: §Y[?CHI_influence_DPP|1%]§!\n\n§yNew Power Party§! £GFX_CHI_NPP_logo Support: §Y[?CHI_influence_NPP|1%]§!\n\n§.Taiwan Solidarity Union§! £GFX_CHI_TSP_logo Support: §Y[?CHI_influence_TSP|1%]§!\n\n§pSocial Democratic Party§! £GFX_CHI_SDP_logo Support: §Y[?CHI_influence_SDP|1%]§!\n\nThird Parties:\n\n§CTaiwan People's Party§! £GFX_CHI_TPP_logo Support: §Y[?CHI_influence_TPP|1%]§!"
