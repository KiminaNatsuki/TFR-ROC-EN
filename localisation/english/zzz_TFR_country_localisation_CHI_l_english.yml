 CHI_tsai_ing_wen_char_desc:0 "Among the figures who embody Taiwan's inclusiveness, none is more symbolic than Tsai Ing-wen. She is the first president in the history of the Republic of China to be of indigenous descent, unmarried, and female. Relying on her resilient will and profound knowledge, she broke through layers of stereotypes to become an outstanding figure in both politics and law.\n\nTsai Ing-wen entered the government system in 1986. After Chen Shui-bian was elected as the first non-KMT president in 2000, she officially stepped into the political arena, holding key positions in the Mainland Affairs Council. She was elected as a legislator in 2005 and promoted to Vice Premier in 2006. In 2008, following the DPP's electoral defeat, she took over as party chairwoman and led the party into the 2010 local elections. Although she suffered consecutive defeats in the New Taipei City mayoral race and the 2012 presidential election, leading to her resignation as party leader, the DPP gradually regained public support amidst controversies surrounding the Ma Ying-jeou administration's Cross-Strait Economic Cooperation Framework Agreement (ECFA) and the rise of the Sunflower Student Movement. Riding this wave, she returned to a leadership role and achieved a landslide victory over the KMT in the 2016 presidential election, winning by a margin of over 25 percent.\n\nDuring her administration, she promoted Taiwanese identity, expanded human rights, deepened relations with the United States and Japan, and maintained \"strategic ambiguity\" in her policy towards China. After hitting a low point in 2018, her public approval rating gradually rebounded. Now, she is fully prepared to embark on her campaign for re-election once again."
 CHI_tsai_ing_wen_char:0 "Tsai Ing-wen"
 CHI_han_kuo_yu_char:0 "Han Kuo-yu"
 CHI_han_kuo_yu_char_desc:0 "Han Kuo-yu, also known as Daniel Han, is often described as an \"unconventional\" and even \"populist\" political figure. He is the descendant of a veteran of the War of Resistance against Japan. Due to poor academic performance, his parents sent him to the Republic of China Military Academy. There, he rose to the rank of captain and, inspired by a Rubik's Cube, became determined to study hard to gain admission to a university.\n\nIn 1990, Han Kuo-yu was elected as a Taipei County Councilor and drew significant attention in 1992 following a physical altercation with a colleague. That same year, he was successfully elected as a legislator, but after losing the KMT's internal primary in 2001, he retired from politics to further his studies at Peking University. In 2017, Han returned to the political arena; although he lost the election for party chairmanship, he became the KMT's mayoral candidate for Kaohsiung. In 2018, he ended the DPP's long-term rule in Kaohsiung, but faced intense criticism for participating in the 2020 presidential election, with citizens accusing him of abandoning Kaohsiung.\n\nDespite outside doubts about his governing abilities, he was elected president in a landslide victory, vowing to combat the \"Taiwan independence movement\" and revitalize the economy. However, many remain deeply concerned about his radical and impractical policies."
 CHI_lin_de_wang_char_desc:0 "Lin De-wang is a political figure in the Republic of China and the founder and chairman of the Taiwan People's Communist Party, known for his distinct political stance and highly controversial public actions. Born in Tainan, he joined the Kuomintang (KMT) in his early years, participating in local and internal party affairs, before gradually shifting toward a more radical and marginalized political trajectory.\n\nAround 2016, following setbacks in elections and internal party development, Lin separated from the established political system and began organizing a new political party. In 2017, he officially established the Taiwan People's Communist Party, advocating for the use of \"socialist\" concepts to drive economic distribution reform while emphasizing cross-strait exchange and cooperation. This political positioning is relatively rare in Taiwan's current political environment, quickly making him a focal point of public opinion.\n\nIn terms of practical action, Lin has repeatedly reinforced his claims through highly symbolic political expressions, such as organizing public rallies and displaying political symbols. While his supporters view these actions as putting his ideals into practice, opponents see them as testing the boundaries of the law and social consensus, leading to multiple law enforcement controversies and public debates."
 CHI_wu_rong_yuan_char_desc:0 "Wu Rong-yuan is a left-wing political figure in the Republic of China and Chairman of the Labor Party, who has long been active in the labor movement and issues related to cross-strait unification. Born in Tainan, he grew up in the politically oppressive environment of the post-war Republic of China, which had a profound impact on the formation of his ideology.\n\nIn the 1970s, while studying at National Cheng Kung University, Wu encountered Marxist ideology and secretly organized a left-wing group with his classmates to print related theoretical literature. After the incident was exposed, he was arrested under the martial law system and initially sentenced to death. His sentence was later commuted to life imprisonment, and it was further reduced by a special amnesty in 1975.\n\nFollowing his release from prison in 1986, Wu threw himself into the labor movement, gradually becoming a key figure in the Republic of China's left-wing camp. He participated in the founding of the Labor Party and served as its chairman, advocating for social reform based on socialist ideals while emphasizing labor rights and class issues. Throughout this process, he also actively participated in various social movement organizations, including labor human rights groups and organizations related to political victims."
 CHI_chen_yi_qi_char_desc:0 "Chen I-chi is a political figure in the Republic of China and one of the founding members of the Taiwan Statebuilding Party (TSP), having served as its first chairman. He has carved out a place in ROC politics with his distinct ideological stance and strong activist style.\n\nBorn in 1972, he was active in academic and public discourse circles in his early years. He served as the secretary-general of the Taiwan South Society and regularly published articles across various political platforms, largely focusing on issues such as national identity, historical narratives, and the political system.\n\nIn his political development, Chen gradually transitioned from the realms of academia and ideology to organized political action, participating in the creation of the \"Radical Wings\" and pushing for its transformation into the \"Taiwan Statebuilding Party.\" The party is positioned as a nativist political party with left-wing inclinations, advocating for the development of Taiwanese subjectivity through institutional reform and social mobilization.\n\nHis political style emphasizes ideological mobilization and grassroots organization building, often challenging the existing political structure with radical discourse. Amidst elections and partisan competition, Chen has repeatedly participated in strategic planning, including being nominated as a candidate for legislator-at-large, in an attempt to expand his political influence."
 CHI_chen_chen_hsiang_char_desc:0 "Chen Chen-hsiang is a political figure and former General of the Republic of China Army, who has long been active in both military circles and the upper echelons of the Kuomintang (KMT). His career spans across multiple fields, including military command, strategic education, and political party operations.\n\nBorn in Anhui, he relocated to Taiwan with his family in 1949 and grew up in the military dependents' village system in Zuoying, Kaohsiung, before entering the Republic of China Military Academy for formal military training. During his service, he transferred from the engineer corps to the infantry system, steadily rising through the ranks. He held key positions within the armed forces, including Army Corps Commander, Coast Guard Commander, and Commander-in-Chief of the Army, following a classic professional military career path.\n\nDuring his tenure as Commander-in-Chief of the Army in 1999, which coincided with the \"921 Earthquake\" in Taiwan, Chen was appointed as the forward commander responsible for coordinating the military's disaster relief operations. This command experience became a crucial milestone in his military career. He subsequently served as the President of the National Defense University and entered the Presidential Office as a strategic advisor, gradually transitioning from a purely military role to the policy and strategic level.\n\nAfter retiring from the military, Chen entered politics and served as a legislator-at-large, making him one of the few cases where a General transitioned directly into a role as a public representative. He later held positions such as Vice Chairman within the party, participating in party decision-making and policy discussions, with his influence primarily concentrated on national defense, security, and cross-strait relations."
 CHI_lai_ching_te_char_desc:0 "Lai Ching-te is a political figure in the Republic of China and a member of the Democratic Progressive Party (DPP). His political career began in the medical profession, gradually progressing into roles as a public representative, a local administrator, and eventually joining the core of the central government, representing a classic example of a politician transitioning from a technical profession.\n\nBorn into a coal miner's family in Wanli, New Taipei City in 1959, Lai lost his father at a young age and was raised entirely by his mother. This background has had a lasting impact on his political image, frequently leading him to emphasize grassroots experience and social mobility in public discourse. His academic background encompasses public health studies at National Taiwan University, National Cheng Kung University, and Harvard University in the United States. He possesses comprehensive medical training and previously served as an attending physician at NCKU Hospital and Sinlau Hospital.\n\nIn the mid-1990s, while still working as a physician, Lai began participating in political activities. He subsequently left the medical field for politics, officially entering the political arena when he was elected to the National Assembly in 1996. He went on to serve multiple terms as a legislator and held the position of convener for key committees within the Legislative Yuan, gradually cementing his political standing within the DPP.\n\nIn 2010, Lai was elected Mayor of Tainan City and successfully won re-election, during which time his steady approach to local governance elevated his political reputation. He later entered the central government, serving first as Premier and then as Vice President, becoming more deeply involved in national-level decision-making. In 2024, he officially took office as the President of the Republic of China, becoming a key figure in extending the DPP's continuous administration."
 CHI_chen_qi_mai_char_desc:0 "Chen Chi-mai is a political figure in the Republic of China and a member of the Democratic Progressive Party (DPP). His political career spans across the legislative, administrative, and local governance levels, making him a quintessential core cadre within the long-term ruling system.\n\nBorn in 1964, Chen possesses a background in medicine and public health. He graduated from the Department of Medicine at Chung Shan Medical University and the Institute of Public Health at National Taiwan University. In his early years, he worked as a physician and held academic positions before transitioning into political development.\n\nAfter entering politics in the mid-1990s, he was elected as a legislator for consecutive terms and held key positions such as caucus whip within the DPP, gradually building up his policy and organizational capabilities. He subsequently entered the administrative system, serving in various roles including Minister without Portfolio and Spokesperson for the Executive Yuan, as well as Deputy Secretary-General to the President, and briefly served as the Acting Mayor of Kaohsiung.\n\nHis political career suffered setbacks due to family-related incidents and political controversies, leading him to briefly fade from the core stage before rebuilding his political capital. In 2020, he was elected in the Kaohsiung mayoral by-election and has continued to serve consecutively, becoming an important representative figure in contemporary local governance."
 CHI_zheng_wen_can_char_desc:0 "Cheng Wen-tsan is a political figure in the Republic of China and a member of the Democratic Progressive Party (DPP). He has served as the Mayor of Taoyuan City, Vice Premier of the Executive Yuan, and Chairman of the Straits Exchange Foundation, holding significant influence in both local governance and cross-strait affairs.\n\nBorn in 1967, Cheng grew up in the Taoyuan region. He became involved in student movements in his early years, actively participating in student activism and discussions on social issues, which shaped his nativist stance during his political awakening. He subsequently entered politics and served in various roles, including Taoyuan County Councilor, Director-General of the Government Information Office, and Spokesperson for the Executive Yuan, gradually accumulating political experience and organizational resources.\n\nHe was elected Mayor of Taoyuan City in 2014 and successfully won re-election. During his tenure, he promoted urban construction, industrial development, and transportation planning, which helped him build a strong base of support in local politics. His governance style emphasizes pragmatic execution and policy integration, balancing local factions with the utilization of central resources, making him one of the most prominent representatives of local factions within the DPP."
 CHI_hou_yu_ih_char_desc:0 "Hou Yu-ih is a political figure in the Republic of China and a member of the Kuomintang (KMT). His career trajectory saw him rise from a grassroots police officer to the upper echelons of the police system, before transitioning into local politics. He is a quintessential representative of someone transitioning from the public security system into the administrative power structure.\n\nBorn in 1957 in Puzi, Chiayi County, Hou grew up in a grassroots family environment. In his early years, he attended the Central Police College (later the Central Police University) and served in the criminal investigation system for a long time. He held numerous key positions within the police force, including Commissioner of the Criminal Investigation Bureau, Director-General of the National Police Agency, and President of the Central Police University. During this time, he participated in the investigation of several major criminal cases and established a \"tough on crime\" image through his anti-gang and public security operations.\n\nAfter 2010, Hou transitioned into the local administrative system, serving as Deputy Mayor of New Taipei City and gradually becoming involved in urban governance. He represented the KMT in the 2018 New Taipei City mayoral election and won, successfully securing re-election in 2022, making him one of the most influential special municipality mayors in Taiwan's contemporary local politics.\n\nIn terms of political style, Hou continues the pragmatic, execution-oriented approach forged by his police background, emphasizing public security, administrative efficiency, and grassroots governance. His personnel choices tend to favor professional bureaucrats over traditional political faction operators. This characteristic has allowed him to demonstrate relatively stable execution in local governance, although he also exhibits a more conservative profile in political mobilization and ideological expression."
 CHI_ko_wen_je_char_desc:0 "Ko Wen-je is a political figure in the Republic of China and the founding chairman of the Taiwan People's Party (TPP). He is one of the most prominent politicians to emerge from the medical field. His political path evolved from a specialized profession into public affairs, gradually developing into a political role with nationwide influence.\n\nBorn in Hsinchu in 1959, Ko was a surgeon in his early years, working at the National Taiwan University Hospital and serving as a professor at the NTU College of Medicine. Specializing in critical care medicine and organ transplantation techniques, he was one of the key figures in introducing Extracorporeal Membrane Oxygenation (ECMO) technology to Taiwan.\n\nIn 2014, Ko ran for Mayor of Taipei City as an independent candidate and was elected, subsequently securing re-election in 2018. He became one of the few politicians to attain the position of special municipality mayor without a traditional political party background. His governance style emphasizes data-driven management and efficiency, though his blunt remarks have frequently sparked controversy.\n\nIn 2019, Ko founded the Taiwan People's Party, proposing a political path to \"break away from the blue-green divide\" in an attempt to establish a third force outside the two major existing political parties. The party secured seats in the 2020 legislative elections, officially entering the central political structure.\n\nOn the national political stage, Ko represented the TPP as its presidential candidate in 2024, focusing on pragmatic governance and a centrist platform. However, he ultimately failed to win, finishing in third place. His political discourse emphasizes rational decision-making, technocratic governance, and institutional efficiency, while his personal style and policy stances have simultaneously provoked notable divisions within society."
 CHI_zhao_shao_kang_char_desc:0 "Jaw Shaw-kong is a political figure, media entrepreneur, and political commentator in the Republic of China, and currently a member of the Kuomintang (KMT). His political career spans the roles of public representative, administrative official, and media mogul, making him one of the few public figures possessing influence in both politics and mass media.\n\nBorn in Keelung in 1950, Jaw graduated from National Taiwan University and pursued further studies in the United States. He rose rapidly after entering politics in his early years, serving in various positions including Taipei City Councilor, Legislator, and Minister of the Environmental Protection Administration of the Executive Yuan. In the early 1990s, he was elected as a legislator with a record-high number of votes and was dubbed the \"political golden boy\" by the media, becoming one of the most important representatives of the reformist faction within the KMT at the time.\n\nIn 1989, he helped form an intra-party faction called the \"New Kuomintang Alliance\" to push for party reform. In 1993, he left the KMT to co-found the New Party, taking on a key leadership role in an attempt to establish a third force within the two-party competitive landscape of the era. Following an unsuccessful bid for Taipei Mayor as the New Party candidate in 1994, his political trajectory reached a turning point, and he gradually faded from electoral politics in the mid-to-late 1990s.\n\nAfter leaving front-line politics, Jaw pivoted to the media sector, running long-standing radio and television political commentary programs, including hosting the \"Situation Room\". He has continuously maintained his influence in Taiwan's public opinion arena. He also served as the Chairman of the Broadcasting Corporation of China (BCC), granting him dual advantages in resources and narrative power across both media and politics.\n\nIn the early 2020s, Jaw returned to the KMT system, participating in internal party affairs and electoral strategy. In 2024, he participated in the general election as a vice-presidential candidate, returning once again to the national political stage. On cross-strait issues, his stance emphasizes reducing confrontation and restoring communication, while simultaneously maintaining that the conditions to promote unification negotiations do not currently exist."
 CHI_hung_chi_chang_char_desc:0 "Hong Chi-chang is a political figure and psychiatrist in the Republic of China, and one of the founding elders of the Democratic Progressive Party (DPP). He has long held a high level of seniority and networking influence within the party. His political trajectory spans across the Tangwai (outside-the-party) movement, the legislative system, and cross-strait affairs.\n\nBorn in Changhua in 1951, Hong worked in psychiatry in his early years, serving as a psychiatrist at MacKay Memorial Hospital and National Taiwan University Hospital. He is one of the few early political representatives in Taiwan to transition directly from the medical profession into politics. In the 1980s, he participated in the Tangwai movement and became a member of the 18-person working group that founded the DPP, playing an important role in Taiwan's democratization process.\n\nAfter entering the formal political system, he was elected for multiple consecutive terms as a legislator and served as a member of the National Assembly, gradually accumulating political resources and factional influence. Within the party, he was a long-time core member of the \"New Tide faction.\" Alongside Chiou I-jen, Wu Nai-ren, and Lin Chuo-shui, he is considered one of the faction's key leaders and a crucial member of the DPP's early power structure.\n\nHis political influence is reflected not only in his public office experience but also in his extensive network of contacts and his ability to integrate resources. Hong is known as a \"kingmaker\" within the party, having mentored and elevated several younger politicians into the political arena, including Lai Ching-te. His role is more akin to that of a political organizer and a behind-the-scenes coordinator."
 CHI_cai_yanming_char_desc:0 "Tsai Eng-meng is an entrepreneur in the Republic of China, the founder and chairman of the Want Want Group, and one of the core controllers of the Want Want China Times Media Group. His business empire spans both the food manufacturing and media industries, making him one of the few business figures with influence across the Taiwan Strait as well as in the media sector.\n\nBorn into a merchant family in Taipei in 1957, Tsai became involved in the management of his family's business at an early age. In the 1980s, he founded the Want Want brand, rapidly capturing the market with rice cracker products and securing a place in Taiwan's food industry. Later, he shifted his business focus to the mainland Chinese market, becoming one of the earlier Taiwanese businessmen to invest heavily in the mainland, which propelled the rapid expansion of his enterprise.\n\nIn terms of corporate development, Tsai adopted a cross-regional strategic layout, growing the Want Want Group into a comprehensive enterprise covering food manufacturing, distribution, and international markets. The company also operates in capital markets such as Singapore and Hong Kong, gradually establishing a multinational corporate system.\n\nAround 2008, using personal and family funds, he acquired the China Times Group and related television media, integrating them into the Want Want China Times Media Group and officially entering the media industry. This move transformed him from a pure business operator into a capitalist power simultaneously controlling public opinion resources, which also sparked societal discussions regarding media consolidation and its influence on speech."
 CHI_Chen_xinxing_char_desc:0 "Chen Hsin-hsing is a scholar and social movement participant in the Republic of China, currently serving as a professor at the Graduate Institute for Social Transformation Studies at Shih Hsin University. He has long been active in the fields of left-wing theory, labor issues, and science and technology studies (STS), embodying the dual roles of academic researcher and public intellectual.\n\nIn the 1980s, around the time of the lifting of martial law in Taiwan, he participated in the student movement and became one of the key figures of the student activist generation of that era. This experience had a crucial impact on his ideological path, leading him to gradually transition from a social movement participant to a left-wing scholar who emphasizes both theory and practice.\n\nIn addition to his academic work, he is deeply involved in social action, particularly focusing on labor rights issues. For example, he participated in the Taiwan RCA occupational hazard lawsuit, attempting to combine theoretical research with real-world social problems to strengthen the connection between academia and practice.\n\nChen explicitly identifies with the Marxist tradition and has referred to himself as a \"Maoist\" in some of his discourse. He emphasizes the need to re-evaluate historical experiences, including the Cultural Revolution, and advocates for a systemic critique of capitalism and global power structures. This stance is highly controversial within Taiwanese academic and public discourse."
 CHI_Xu_yongming_char_desc:0 "Hsu Yung-ming is a political figure and political scientist in the Republic of China, having served as the chairman of the New Power Party (NPP) and as a legislator-at-large. His political path combines an academic background with the development of emerging political parties, making him an important representative figure of third-force politics in Taiwan.\n\nBorn in Taichung in 1966, he received comprehensive academic training, graduating from the Department of Political Science at National Taiwan University and earning a Ph.D. in Political Science from the University of Michigan in the United States. He taught for a long time at the Department of Political Science at Soochow University, with his research fields covering electoral behavior, party politics, and empirical political theory.\n\nPrior to entering politics, Hsu was already active in public discourse, frequently participating in media commentary as a scholar and widely regarded as an influential \"pundit-scholar.\" Around 2015, he participated in the formation of the New Power Party, pushing for its transition from a social movement into a political party. He was elected as a legislator in 2016, entering the parliamentary system.\n\nDuring his tenure in the Legislative Yuan, he primarily focused on issues regarding the economy, finance, and institutional reform, and served as the caucus convener, playing an organizational and coordinating role within the emerging political party. He subsequently took over as the chairman of the NPP, becoming one of its key leaders during its developmental phase."
 CHI_Qiu_xianzhi_char_desc:0 "Chiu Hsien-chih is a political figure and human rights lawyer in the Republic of China, and one of the key members of the New Power Party (NPP). He has served as party chairman and a legislator. His political path combines social movements, legal practice, and third-force party development, making him a quintessential representative of someone transitioning from public movements into institutional politics.\n\nBorn into a farming family in Chiayi in 1976, Chiu's upbringing emphasized social responsibility and public participation. He originally aimed for a career in medicine but later switched to law, pursuing further studies at Heidelberg University in Germany, where he received comprehensive legal training. His educational and formative experiences gradually shaped his path of intervening in social issues through legal expertise.\n\nAfter returning to Taiwan, he devoted himself to public interest legal work for a long time, participating in several highly representative social cases. These included fighting wrongful convictions, labor protests, and defending public incidents, such as the Cheng Hsing-tse case, the laid-off workers' case, and the Sunflower Student Movement. He intervened as a pro bono lawyer, emphasizing the function of the law as an instrument for social justice."
 CHI_Gao_yuting_char_desc:0 "Kao Yu-ting is a political figure in the Republic of China and a member of the New Power Party (NPP), having served as party chairperson and secretary-general. Her political trajectory shifted from an engineering profession into public affairs, making her one of the representatives in the emerging political generation who participates in politics with a technical background.\n\nBorn in Taiwan in 1985, she possesses a background in engineering. She graduated from the Graduate Institute of Electronic Engineering at National Taiwan University of Science and Technology. In her early years, she worked at the Industrial Technology Research Institute (ITRI), where she participated in technological projects such as independent satellite development and served as a project manager. Her early career was concentrated in the high-tech industry and the national scientific research system.\n\nAround 2014, Kao began participating in the social movement organization \"Taiwan March,\" gradually becoming exposed to public issues and political action. She later joined the New Power Party, starting from grassroots staff and policy work. She participated in Chiu Hsien-chih's legislative campaign team and subsequently served as a decision-making committee member and deputy secretary-general, gradually entering the core operations of the party."
 CHI_Chen_Jiaohua_char_desc:0 "Chen Jiau-hua is a political figure and environmental activist in the Republic of China, having served as the chairperson of the New Power Party (NPP) and a legislator-at-large. Her political trajectory transitioned from long-term social movements to institutional politics, making her one of the key representative figures of Taiwan's environmental protection movement entering the parliament.\n\nBorn in Taiwan in 1959, she possesses an academic background related to pharmacy and the environment. She served as an associate professor at Chia Nan University of Pharmacy and Science and engaged in research in the fields of food and the environment. Prior to entering politics, Chen Jiau-hua had long been active in civil environmental organizations, having served as the president of the Taiwan Environmental Protection Union (TEPU), making her one of the important participants in Taiwan's early environmental movement.\n\nHer public action focuses on environmental issues, with long-term attention to disputes over landfills, petrochemical pollution, electromagnetic radiation hazards, and water resource protection, participating in multiple local protest movements. In incidents such as opposing the Tainan Dongshan landfill, she encountered violent attacks. These experiences strengthened her image of activism and earned her the title of \"Iron Lady of the Environment\" within environmental circles."
