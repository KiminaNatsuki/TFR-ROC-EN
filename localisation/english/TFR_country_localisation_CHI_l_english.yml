 Taiwanese_Progressivism: "Taiwanese Progressivism"

 Taiwanese_Progressivism_desc: "\n\n\n\n£GFX_CHI_ideology_neoliberalism\n\n\n\n\n\n§YTaiwanese Progressivism§! is the ideology adhered to by the Democratic Progressive Party (DPP), other Pan-Green parties, and some independents. The DPP is the leader of the Green camp, and its origins trace back to the \"Tangwai movement\" (outside-the-party movement) that began in the mid-1970s. Due to its history of resisting the Kuomintang's political tutelage and White Terror, the DPP regards liberal democracy, political justice, and egalitarianism as its core ideologies. These values were later inherited by the broader Taiwanese progressive movement. Over the years, due to the growing hostility of the CCP, the DPP has also absorbed anti-communist thoughts and advocates for Taiwan to maintain a distance from mainland China.\n\nToday, Taiwanese progressivism advocates various goals, including social freedom and equality, environmental sustainability, LGBTQ+ rights, and Taiwan independence, remaining one of the most prominent movements in Taiwanese politics."

 Taiwanese_Progressivism2: "Taiwanese Progressivism"

 Taiwanese_Progressivism2_desc: "\n\n\n\n£GFX_CHI_ideology_neoliberalism\n\n\n\n\n\n§YTaiwanese Progressivism§! is the ideology adhered to by the Democratic Progressive Party (DPP), other Pan-Green parties, and some independents. The DPP is the leader of the Green camp, and its origins trace back to the \"Tangwai movement\" (outside-the-party movement) that began in the mid-1970s. Due to its history of resisting the Kuomintang's political tutelage and White Terror, the DPP regards liberal democracy, political justice, and egalitarianism as its core ideologies. These values were later inherited by the broader Taiwanese progressive movement. Over the years, due to the growing hostility of the CCP, the DPP has also absorbed anti-communist thoughts and advocates for Taiwan to maintain a distance from mainland China.\n\nToday, Taiwanese progressivism advocates various goals, including social freedom and equality, environmental sustainability, LGBTQ+ rights, and Taiwan independence, remaining one of the most prominent movements in Taiwanese politics."

 Taiwanese_constitutionalism: "Taiwanese Constitutionalism"

 Taiwanese_constitutionalism_desc: "\n\n\n\n£GFX_CHI_ideology_constitutionalism\n\n\n\n\n\n§YTaiwanese Constitutionalism§!, upheld by the Kuomintang (KMT), People First Party (PFP), and some independents, is a localized form of constitutionalism that supports the continuation of the Republic of China, liberal conservative social policies, and moderate relations with mainland China. Originally based on the Three Principles of the People and social conservatism, Taiwanese constitutionalism has adopted more liberal approaches over the years to remain competitive after the lifting of martial law in Taiwan.\n\nToday, the main features of Taiwanese constitutionalism include protectionist economic policies, Chinese nationalism, centrist social policies, and the gradually waning anti-communism inherited from the Chiang dynasty, remaining one of the largest factions in Taiwanese politics."

 loc_taiwanese_liberal_populism: "Liberal Populism"

 taiwanese_liberal_populism: "Liberal Populism"

 taiwanese_liberal_populism_desc: "Taiwanese liberal populism is a variant of liberal conservatism, centered around winning votes by satisfying popular demands, actively providing public services, and improving the livelihood of vulnerable groups.\n\nDue to its excessive focus on winning elections, this ideology is often criticized as \"lacking principles\" and having blurred boundaries. Rather than calling it an ideology, it might be more accurate to call it an electoral strategy."

 taiwanese_liberal_populism2: "Liberal Populism"

 taiwanese_liberal_populism2_desc: "Taiwanese Liberal Populism is a variant of liberal conservatism. Its core focuses on winning votes by satisfying popular demands, actively providing public services, and improving the livelihoods of vulnerable groups.\n\nDue to its excessive focus on winning elections, this ideology is often criticized as \"lacking principles\" and having blurry boundaries. Rather than calling it an ideology, it is fundamentally more accurate to call it an electoral strategy."

 loc_taiwanese_reformed_tridemism: "Reformed Tridemism"

 reformed_tridemism: "Reformed Tridemism"

 reformed_tridemism_desc: "The Three Principles of the People—Nationalism, Democracy, and Livelihood—consist of three equally important parts: nationalism, democratic institutions, and social welfare.\n\nEntering the 21st century, traditional Tridemism has revealed its limitations in governing modern society, prompting many to seek a reformed version of it.\n\nCompared to the original version, reformed Tridemism reduces the emphasis on nationalism and instead highlights the expansion of welfare, treating it as the core pillar of modernization theory. At the same time, democratic institutions, as a basic need of the people, are incorporated into a broader definition of welfare, making welfarism the sole focus of reformed Tridemism."

