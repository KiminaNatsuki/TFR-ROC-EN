 CHI_hold_general_election_as_scheduled_desc:0 "It is once again our quadrennial election day, but this time, it truly feels different from the past. The familiar sights of candidates sweeping the streets for votes and holding massive rallies are gone. Instead, people are gathered around their radios listening to this year's election instructions. Veterans leaning on canes sit with their comrades in veterans' homes, staring intently at the lobby radio. Fathers finishing work pull their daughters, just home from school, to turn on the television, while university students in classrooms are entirely fixated on live streams on their phones.\n\nAll day tomorrow, the people will set aside their work. In elementary school classrooms, in gymnasiums, and in temporarily erected tents, they will receive their ballots, stamp them, and drop them into the ballot boxes. Everyone knows in their hearts that the vote in their hands will truly determine the future of our society."
