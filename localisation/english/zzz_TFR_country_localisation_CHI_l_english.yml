 CHI_stage_1:0 "§GTaiwan§!, the unshakable sovereign territory of the §3Republic of China§!, is the last bastion of democracy and freedom for the §3Chinese people§!, and the beacon of democracy on the frontline against authoritarian and dictatorial expansion.\n\nTime flies, and since the §.CCP regime§! unilaterally tore up the ambiguous space of the §3\"1992 Consensus\"§! and constantly suppressed §GTaiwan's§! international participation, cross-strait relations have deteriorated sharply once again. The §.Beijing§! authorities have never abandoned their plan to annex §GTaiwan§! by force, continuously escalating military intimidation, gray-zone harassment, and cognitive warfare.\n\n§.\"Peaceful Unification\"§! is nothing but the United Front language packaged by §.Beijing§! for the outside world; for the §Gpeo§5ple §3of §RTaiwan§!§!§!§!, it is merely a euphemism for §.\"being invaded\"§!. §GTaiwan§! has never and will never accept §.\"One Country, Two Systems\"§! or any form of surrender plan.\n\nFacing the encroaching military threat, the §Gpeo§5ple §3of §RTaiwan§!§!§!§! have both the right and the obligation to choose to defend their survival and dignity.\n\n§YCCP Infiltration Status:§! [CHI_Infiltration_situation]\nUnder the long-term cross-strait confrontation, §.Beijing§! has never relied solely on warships and missiles to influence §GTaiwan§!. As exchanges gradually increased, the §.CCP's United Front system and intelligence network§! quietly extended their tentacles into the island's society.\n§YThe lower the value, the better.§!\n\n§YIsland Combat Readiness: [CHI_combatreadiness]§!\nThe situation in the Taiwan Strait has always been shrouded in the shadow of §.potential conflict and dictators§!. Facing continuous military pressure from the §.Chinese government§!, §GTaiwan§! must maintain a high state of defense readiness.\n§YThe higher the value, the more capable we will be to resist and even counterattack when the §Rfratricidal§! scenario promoted by the §.dictator§! breaks out in the future.§!\n\n§YInternational Support Status: [CHI_combatreadiness2]§!\nThe Taiwan Strait issue always affects the regional security landscape, so we need political and military support from the international community.\n§YThe higher the value, the easier it is to obtain diplomatic backing, military aid, and sanction assistance during the §YTaiwan Strait War§!.§!\n\n§YSocial Solidarity Status: [CHI_combatreadiness3]§!\nLong-term confrontation easily causes social division and information warfare impact. Doing something to ensure the island's public opinion environment and degree of social consensus is necessary.\n§YThe higher the value, the easier it is for the government to maintain social stability and policy execution during a §Rcrisis period§!.§!\n\n§YCounter-Intelligence Status: [CHI_combatreadiness4]§!\nFacing long-term information warfare and intelligence activities requires gradually strengthening §.anti-espionage§! and security capabilities.\n§YThe higher the value, the easier it is to detect the activities of §.hostile forces§! on the island.§!"
 CHI_stage_2:0 "After a long and bloody §RTaiwan Strait War§!, although the smoke has cleared, the scars left by the war are still scattered across §GTaiwan's§! land. Many cities were reduced to rubble amidst repeated air raids and missile strikes. Power, communications, and transportation networks were paralyzed, and the island's economy stagnated during the war.\n\nBut as the smoke gradually clears, the world finally sees an undeniable fact: the §3Republic of China §G(Taiwan)§!§! not only exists, but it has defended its land and system in the harshest test. The §.Beijing authorities§!, who once threatened to \"swiftly resolve the problem,\" failed to achieve their goal and fell into turmoil, while the §Gpeo§5ple §3of §RTaiwan§!§!§!§! proved with actions that this land cannot be easily annexed by anyone.\n\nNow, the §Gpeo§5ple §3of §RTaiwan§!§!§!§! face a difficult and long period of reconstruction. Countless families lost loved ones in the war, and many communities were forced to relocate or redesign. The government has to confront a series of complex issues such as post-war resettlement, industrial recovery, and social stability, while also finding a new balance between security and freedom.\n\nDuring this difficult §YPost-War Reconstruction§! period, §GTaiwan§! will recover from its trauma and determine its future direction.\n\n§YIndustrial Recovery Status: [CHI_combatreadiness5]§!\nThe flames of war caused severe damage to factories, ports, and supply chains. We must increase the recovery level of our industrial system and trade networks.\n§YThe higher the value, the faster Taiwan's economy recovers, gaining more industrial and trade bonuses in subsequent development.§!\n\n§YSocial Stability Status: [CHI_combatreadiness6]§!\nAfter a war, societal sentiment often fluctuates between tension and exhaustion.\n§YThe higher the value, the easier it is for the government to maintain political stability and public order; if stability decreases, strikes, protests, and political conflicts may increase, affecting the operation of the state.§!\n\n§YNational Defense Reorganization Status: [CHI_combatreadiness7]§!\nThe end of the war does not mean security threats have disappeared. The military needs to be reorganized, resupplied with equipment, and summarize its combat experience.\n§YThe higher the value, the more the military's combat and defensive capabilities increase, but long-term armament investment will also consume national resources.§!"
