 ##
 CHI_dont_forget_homeland_desc: "On the peak of Mount Taiwu in Kinmen, there are four characters:\n\n\"毋忘在莒\" (Never Forget in Ju)\n\nThis is a story from two thousand years ago, originating from the ancient state of Qi in modern-day Shandong.\n\nDuring the Warring States period, the King of Yan appointed Yue Yi as the supreme commander and raised an army to attack Qi. The Qi army retreated repeatedly, King Min of Qi was killed, and only the cities of Ju and Jimo were left holding out in desperate resistance.\n\nThey held on bitterly for five years.\n\nUntil Tian Dan broke the Yan army with his fire bull formation and recovered seventy cities in succession, ultimately achieving the grand task of restoring the nation.\n\nFollowing his defeat in the civil war and retreat to Taiwan, the late President Chiang Kai-shek used this historical allusion as a mirror, inspiring the military and civilians of our country to undertake the grand task of retaking the mainland. It has now been over seventy years since he inscribed these four characters.\n\nNow, the mainland authorities have suffered a crushing defeat in the Taiwan Strait and face political turmoil. This is the absolute best time to restart the grand task of retaking the mainland.\n\nNever forget the spirit of Tian Dan.\n\nThe Chinese nation must constantly strive to become stronger!"

 CHI_spirit_reaches_to_rainbow_desc: "In the past five millennia of Chinese history, we have faced countless formidable foreign enemies. The Xiongnu, Mongols, and Jurchens have all tried conquering fertile and prosperous land. However, the people of China never simply surrendered. On the contrary, we have always held out in a spirit of resistance. Brave legends such as General Wen Tianxiang of the Song Dynasty embodied this bold spirit through his fierce resistance against the Mongols and his patriotic writings, leaving a legacy of unyielding heroism for future generations.\n\n\nThrough our inspiring past, we may look to the future. We shall strive on without surrender, with thought and courage, and with a spirit that pierces the clouds. Our air force will be the embodiment of this spirit. To carry out this great legacy and achieve ultimate victory, we must eradicate the deep-rooted corruption within our air force!"

 CHI_need_of_equipment_desc: "Since World War II, air superiority has been synonymous with dominance over the battlefield. Although the Nationalist government has pursued various R&D projects since relocating to Taiwan, the military still heavily relies on advanced U.S. fighter aircraft. However, due to attrition from the Taiwan Strait War and the outbreak of the American Civil War, our inventory of fighter jets has been reduced to a mere handful, stripping the military of its ability to rapidly replenish aircraft. We must employ every means necessary to break free from our reliance on foreign nations and build a truly self-reliant Air Force!"

 CHI_funds_college_desc: "If advanced weaponry alone could defeat the CCP, the Nationalist forces would not have collapsed so disastrously during the civil war that began in 1946, ultimately retreating to Formosa. Superior weapons require a superior research and development team behind them to provide support. Every wing panel and screw is the product of precise mathematical calculations and engineering design. Those institutions of higher learning with outstanding achievements in the field of aviation will receive increased research funding. This will be used to purchase more precise experimental equipment and cultivate the aviation engineering talent of the future."

 CHI_Air_force_special_allowance_desc: "On paper, the strength of the Republic of China Air Force appears quite formidable. Sustaining the expenses of such a massive fleet with merely a fraction of the necessary funds is undeniably highly efficient. However, one only needs to take a stroll through an air base to understand the price behind those numbers. Anti-G suits have been used for over a decade without replacement, respirators are heavily patched up just to barely function, and the budget for runway maintenance is pitifully small. In times of peace, these hidden ailments were harmless enough, but after the baptism of war, these problems have become impossible to ignore. Without the money to replace basic equipment, our combat effectiveness can never be genuinely improved. Therefore, allocating special allowances for our Air Force is absolutely imperative. Massively updating old equipment will greatly boost the morale of our pilots and ground crews. Enhancing combat effectiveness is secondary; making our grassroots personnel feel valued by the government is what truly matters most!"

 CHI_relauch_ADF_project_desc: "Cannons loaded, gunners in position. Everything is ready. The R&D teams and engineers look with high spirits toward a stealth fighter project abandoned years ago: the ADF \"Chih-Hang\" fighter, named in memory of the heroic anti-Japanese ace Major General Gao Zhihang. Lack of funding and technical difficulties are no longer insurmountable mountains. Although many design details have yet to be finalized, everyone believes that successfully developing a fifth-generation fighter is absolutely imperative!\n\nThink back to when China's J-20 first took to the blue skies; our aviation personnel could only gaze upward in despair, watching the Mighty Dragon's perfect silhouette declare sovereignty over the heavens. However, years later, we have finally discovered the ultimate secret to forging a dragon-slaying sword. Carrying the unfulfilled will of Major General Zhihang, we will once again drive out the invaders occupying our homeland!\n\nAfter nearly thirty years of service, the Indigenous Defense Fighter has finally found its successor."

 CHI_american_fighters_reverse_enginnering_desc: "For a long time, the mainstay of the Republic of China Air Force has been supported by American-made equipment. From the F-86 to the F-5 and the F-16, generation after generation of equipment has accompanied us through countless hardships. However, this has also caused Taiwan's national defense capabilities to be severely constrained by the United States' political attitude toward Taiwan. The Ching-kuo fighter jet was a helpless act born out of political compromises from all sides.\n\nYet, this prolonged defense dilemma did not spur the rapid development of Taiwan's military aviation industry. The bitter lessons of the last great war tell us through bloody facts that there is no more time to wait. We will directly attempt to reverse-engineer the intact fighter jets currently on hand. By researching and collecting data, we will hone the capabilities of our engineering teams. Engines, airframe materials, radar technology, or even a single screw; every detail will become a precious asset for our future development."

 CHI_sino_japanese_fighter_cooperation_program_desc: "Even though we now possess a complete military-industrial supply chain and R&D team, the risks of independently developing our next-generation main battle fighter are simply too immense. After all, the technical difficulty between an advanced trainer jet and a stealth fighter is on a completely different level. Taking too large of a leap could easily result in our massive investments of R&D funds and time going down the drain. Fortunately, our northern neighbor is willing to lend a helping hand. Japan possesses a comprehensive supply chain and experienced technical workers, and our operational requirements are quite similar. A bilateral collaboration will not only reduce project risks but also further bridge Sino-Japanese relations."

 CHI_need_of_talent_desc: "During the Taiwan Strait War, we lost a massive number of outstanding pilots. This was a heavy blow to an Air Force already suffering from severe manpower shortages. If we wish to restore our manpower as quickly as possible, the armed forces must elevate Air Force-related benefits to increase the willingness of active-duty personnel to re-enlist and volunteers to sign up. Furthermore, we must expand our flight simulator facilities to drastically accelerate the pace of training, while simultaneously recruiting combat veterans to serve as instructors."

 CHI_strengthen_anti_corruption_measures_desc: "The Army Logistics Command, responsible for supplying the entire military, and the Defense Procurement Division, which directly controls the contracting of military supplies under the Ministry of National Defense, nominally hold the lives of hundreds of thousands of frontline troops in their hands. They do not handle the multi-billion dollar procurements of foreign fighter jets; instead, they manage the most basic yet most lethal equipment: body armor, ballistic plates, and communication gear.\n\nIn the 2010s, the government took bold actions to promote \"National Defense Autonomy,\" and this procurement system spearheaded countless bids for domestic military supplies prior to the war. However, the shields meant to protect our brothers-in-arms became ATMs for unscrupulous manufacturers, compromised by rigged specifications and collusive interests. These individuals used substandard coatings and even passed off civilian-grade steel plates as military-grade, frantically leeching off the very foundations of our national defense.\n\nIt wasn't until the outbreak of the Taiwan Strait War that the frontlines shockingly discovered that standard-issue ballistic plates could not stop the enemy's active-service rifle rounds at all. This senseless loss of life, caused entirely by corruption, nearly caused a complete collapse in military morale. To ensure the blood of our martyrs did not flow in vain, the central government has officially approved the \"Comprehensive Inspection Plan for Basic-Issue Equipment.\" We will rip open all domestic production lines and inspection accounts, thoroughly cleanse the logistics system, and use an iron fist to guide the Republic of China Armed Forces toward rebirth."

 CHI_forming_air_force_political_warfare_command_desc: "In 1920, to cultivate a revolutionary army capable of ending the warlord era, Sun Yat-sen modeled the \"Political Department of the Military Affairs Commission\" after the Soviet political commissar system. After undergoing numerous reorganizations, it eventually became the General Political Warfare Department under the Ministry of National Defense. Its responsibilities included strictly managing military ideology, conducting external psychological warfare, and appropriately monitoring and intervening in the psychological well-being of soldiers. History has repeatedly proven that a military's true core lies in excellent psychological resilience and absolute loyalty to the government. During the Liangguang Incident, it was precisely Chiang Kai-shek's appeal to national righteousness that persuaded Huang Chih-kang, Huang Chu-ku, and others of the Guangdong Air Force to defect to the central government. These martyrs later sacrificed themselves heroically during the War of Resistance, fighting for China down to the last aircraft and the last man.\n\nTherefore, establishing a dedicated Political Warfare Command for the Air Force is absolutely necessary. We will let our personnel know that the nation they protect is also their most solid backing!"

 CHI_carry_forward_the_inspiration_of_our_airman_desc: "During wartime, our nation's Air Force produced ace pilots such as Kao Chih-hang, Wang Kuang-fu, and Chen Huai-sheng. After the government relocated to Taiwan, we continued to cultivate outstanding talents like Wu Ke-chen, Liao Chen-kuo, Wang Tung-yi, and Kao Ting-cheng. Beyond just these names, there are countless unsung heroes of the blue sky who have defended this free airspace. They, in turn, will continue to train even more exceptional successors in an endless, unbroken lineage. It is true now, and it shall remain true forevermore!"

 CHI_modern_whampoa_desc: "The Republic of China Army, from the Kuomintang Party Army, to the National Revolutionary Army, to the modern-day ROC Army, is a force with a long and storied history. Although certain past policies still hinder us, things are now beginning to take a turn for the better. After all, we successfully repelled the PLA's coastal offensive. Could anyone argue that the PLA's equipment was worse than ours? We have already proven ourselves. Now is the time to deepen our reforms even further!"

 CHI_modern_whampoa_tooltip: "Selecting this military reform branch will grant you §Gpowerful army bonuses§!, but you will be §Runable to edit division templates§!, and you can only train new troops via §Ydecisions§!."

 CHI_new_whampoa_spirits_desc: "For many years, the old-guard generals of the Whampoa clique were one of the major obstacles to military reform. Many outdated tactical systems were not overhauled until the eve of the Taiwan Strait War. They worried that if the tactics that played such a massive role during the Northern Expedition were completely replaced, the military would forget its roots. However, while tactics may change, the spirit lives on forever. The Taiwan Strait War proved that even as our tactics and equipment fully align with NATO standards, our armed forces remain a patriotic organization that loves its people and fears no hardship. The spirit has not vanished; it resides within our hearts."

 CHI_unity_of_knowledge_and_desc: "The Ministry of National Defense has summarized the lessons learned during the Taiwan Strait War into several comprehensive reports. These documents systematically outline the new tactical improvements and training programs for our troops. Such excellent reports cannot be allowed to gather dust in an archive room. High command has already ordered them to be copied and distributed to every unit for immediate training implementation."

 CHI_shining_spear_and_iron_horses_desc: "Before the next-generation main battle tank is developed, we must immediately address the fact that our current tanks possess weak armor and are unable to penetrate enemy armor. To urgently resolve this issue, the Ministry of National Defense plans to upgrade the CM-12 with a larger caliber gun and equip it with explosive reactive armor."

 CHI_painful_lesson_of_drones_desc: "During the Taiwan Strait War, the PLA used drones to inflict severe strikes on our armored units, accounting for over half of all our destroyed armored vehicles. We must strengthen our anti-drone measures and learn from these bitter lessons."

 CHI_Camaraderie_Diligence_Sincerity_desc: "Established upon the founding of the Whampoa Military Academy, this is the shared motto formulated by Chairman Chiang Kai-shek and passed down to this day.\n\nIn the most difficult of times, a spirit of unity and cooperation can always unleash unexpected power. During the eight-year War of Resistance, the National Revolutionary Army held the line alone for four grueling years. During the 823 Artillery Bombardment, we withstood the relentless artillery fire of the Communist forces. And in the Taiwan Strait War, we resisted the PLA's ferocious first wave of attacks before PDTO allies arrived to support us.\n\nNow, we will continue to practice this spirit and let the world know exactly where the indomitable will of our armed forces comes from!"

 CHI_centralized_military_command_desc: "Historical experience has shown that the most important advantage in large-formation warfare lies in the close, coordinated attacks of various units and the extremely precise execution of every deployment. The primary duty of our frontline personnel is to fulfill the combat plans handed down by their superiors."

 CHI_reform_combined_logistics_command_desc: "The investigation into grassroots military procurement corruption has torn open the ugliest side of the military's current system. Ever since the Combined Logistics Command was abolished in 2012 and logistical operations were dismembered and forcibly stuffed into individual service branches, the drawbacks of lacking independent oversight have been fully exposed. With the three branches acting independently, procurement standards in disarray, and auditing layered with outsourcing, unscrupulous manufacturers and corrupt bureaucrats were given the perfect opportunity to exploit the system.\n\nThe lessons of war have proven that modern warfare is a war of logistics, and chaotic logistics is a fast track to defeat. In order to reconsolidate the scattered logistical power of the various branches, the central government has issued the highest directive: officially restore the establishment of the \"Combined Logistics Command.\" Bypassing the factional interests of the individual branches, we will reunify all supply, fuel, ammunition, and transportation operations.\n\nThe restructured Combined Logistics Command will establish independent auditing and inspection standards directly under the central government. This is not merely a change on an organizational chart; it is to ensure that in the future, every ballistic plate and every bullet is delivered into the hands of our soldiers under unified and strict modernized oversight. Fragmented logistics have already exacted a heavy toll in the Taiwan Strait. Now, under the name of Combined Logistics, it is time to rebuild and reform, providing our armed forces with an ironclad supply line."

 CHI_military_railway_underground_desc: "For a long time, Taiwan's railway system has suffered from a severe lack of funding. Years of peace caused the already scarce resources to lean heavily toward civilian routes. The military found it difficult not only to maintain its large number of dedicated freight trains but also struggled merely to upgrade or safeguard its most basic military lines. Fortunately, however, the lessons brought by the last war dealt a heavy blow to those government officials who still harbored illusions. Taiwan's long, narrow terrain and north-south mountain ranges guarantee that if the western transportation nodes are severed, the armies in the north and south will instantly be trapped in isolated combat.\n\nThe military is currently petitioning the Legislative Yuan, hoping to utilize portions of the recently completed subterranean railways in Kaohsiung City to extend a military express line stretching as far north as Chiayi and as far south as Fangliao in Pingtung. At the same time, the existing underground railway network in the north will also be extended southward. This will guarantee that even during wartime, there will still be a safe and unobstructed route available for the north-south transport of combat readiness supplies and the evacuation of personnel."

 CHI_dominate_three_oceans_desc: "The Taiwan Strait has traditionally been known as the \"Black Water Ditch.\" When immigrants relocated to Taiwan during the Qing dynasty, the saying \"seven die, two stay, one turns back\" announced to everyone that Taiwan is no weak scholar to be bullied at will. No matter how high a mountain is, there is always a day it might collapse. Passively defending relying solely on this natural barrier is nothing more than surrendering strategic initiative. We should emulate the British experience and expand the scale of our Navy. However, this fleet expansion is not to serve the maintenance of global hegemony; on the contrary, we can only protect ourselves by wielding weapons stronger than the invaders'. Missiles, warships, and the Marine Corps will interlock tightly, forming a dense anti-access/area denial network across the Pacific, ready to deliver a fatal blow to the enemy fleet at the opportune moment!"

 CHI_making_great_achievements_on_beachhead_desc: "No matter the era, amphibious landing operations remain the most difficult form of combat. The attackers must endure fierce defensive artillery fire to deliver light units onto the beach, with nowhere to retreat, much like the PLA forces entirely annihilated by the Nationalist army during the Battle of Kuningtou. However, successfully establishing a stable beachhead yields a massive advantage, such as how the success of Operation Overlord led to the dispersal of the main German forces.\n\nEver since the government abandoned the counterattack on the mainland, the military and even the upper echelons of the PDTO have approached strategy purely from a defensive perspective. At the time, no one imagined that one day we would need to reverse our stance and launch our own amphibious assaults. By absorbing and analyzing the lessons the PLA learned during their landings in the Taiwan Strait, high command discovered that the PLA's overconfidence in their armored firepower caused them to neglect the infiltration and sabotage capabilities of special forces. This makes it highly worthwhile for us to form our own special forces units dedicated to beachhead assaults."

 CHI_renovate_Tsoying_naval_base_desc: "Zuoying Naval Base in Kaohsiung is currently our nation's only dedicated military port, serving as the most critical vessel anchorage and logistics maintenance hub for the Republic of China Navy. Since the Japanese military's southward advance to seize Southeast Asia became inevitable in 1937, the Japanese Navy expanded the Qing-era Wandan Port to serve as an important springboard. During the retreat of the Chinese Civil War in 1949, the Zuoying Naval Base was temporarily relocated here before later moving north. During the Taiwan Strait War, we truly witnessed the power of the PLA Navy; merely maintaining our existing fleet was enough to completely overwhelm the Kaohsiung military port. The future Republic of China Navy will absolutely not be satisfied with maintaining a weak fleet consisting of only a few destroyers and diesel-electric submarines. If we are to truly possess the total coastal blockade capabilities against the CCP that we had in the 1960s, Zuoying Naval Base must be equipped to dock, repair, and even construct large warships."

 CHI_NCSIST_Project_desc: "For a long time, the experimental projects of the National Chung-Shan Institute of Science and Technology (NCSIST) have constantly been labeled as \"scams\" or \"unreliable.\" Only a handful of weapons, such as the Hsiung Feng III missile, have received widespread public praise. However, this was the absolute limit of what the chronically underfunded NCSIST could achieve. Even a clever housewife cannot cook without rice. Many once-great ideals ultimately had to bow their heads to reality. Even if they stumbled along and managed to produce a finished product, it could be undone at any moment by a single budget cut from the legislators. We are thrilled that the academicians of NCSIST will never have to face this dilemma again! For the future of the Republic of China, we will give them whatever they need. Let those secret proposals buried deep within the filing cabinets see the light of day once more!"

 CHI_solidarity_desc: "The military has always emphasized teamwork and eternal loyalty. This is especially true for the Navy. Operating a large warship requires coordinating a team of nearly a hundred people to achieve the most precise cooperation. Only when everyone is striving toward the exact same goal can a ship, and indeed an entire fleet, unleash its full potential."

 CHI_relaunch_project_zhenhai_desc: "Since the founding of the Republic of China, the Navy has always been in a rather awkward position. Whether during the Northern Expedition, the War of Resistance, or the Civil War, there was never a stage for the Navy to shine. The chronic shortage of military funding made it impossible to train officers and purchase new ships for a long time. Even the post-war flagship, ROCS Dan Yang, was the former Japanese destroyer Yukikaze. From then on, although the Navy was capable of building some small vessels, the acquisition of large surface warships and submarines remained severely constrained by the United States and the international arms market. \"Project Zhenhai\" is the solution born from this harsh environment.\n\nThose large warships—destroyers, cruisers, and massive submarines—that were once just beyond our reach are now right before our eyes. The ROC Navy will never again have to bow its head to invaders!"

