 CHI_the_mainland_conflict_category_desc: "Although we only control the island of Taiwan, our official name is the Republic of China. This has caused many problems within our country."

 CHI_efficient_government_category: "Streamline the Government"

 CHI_efficient_government_category_desc: "Efficiency. What is efficiency? Simply put, efficiency is being fast, accurate, and ruthless. To judge any ruler from ancient times to the present, one must first see if their decrees sweep across the nation the moment they are issued. A precise, highly efficient bureaucratic system is often the prelude to a nation's grand symphony of revival. As the victors of a great war, recognizing the absolute importance of efficiency, we will rebuild a highly efficient government system in Taiwan under the leadership of President Han Kuo-yu."


