 CHI_prc_embargo_idea:0 "Mainland Trade Embargo"
 CHI_prc_embargo_idea_desc:0 "Facts have proven that President Tsai's strategy of ambiguity did not work. The Beijing authorities were still enraged, and our government had to respond, eventually leading to the termination of all cross-strait exchanges once again, returning to the era of Chiang Kai-shek.\n\nAlthough the government actively took remedial measures and strove to develop alternative markets, it was still too slow to meet the urgent needs, and the vast majority of people on the island felt the bitter consequences of the sanctions."
