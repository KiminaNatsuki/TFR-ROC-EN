 CHI_army_decisions:0 "Republic of China Armed Forces"
 CHI_army_decisions_desc:0 "\n\n\n\n\n\n\n\n£GFX_CHI_army_banner\n\n\n\n\n\n\n\n\nThe Republic of China Army, from the Eastern Expedition and Northern Expedition of the National Revolutionary Army, to the arduous War of Resistance, and until the Chinese Civil War, the national armed forces have always been an army full of suffering. Today, it has become an army with neglected martial prowess. We must make changes, otherwise, the Republic of China will step into a situation beyond redemption."
