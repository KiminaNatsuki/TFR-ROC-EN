 CHI.H2.11.t:0 "Election Night"
 CHI.H2.11.d:0 "今晚的高雄市格外熱鬧，街道上擠滿了慶賀韓國瑜當選的遊街隊伍，從一心路到十全路，紅白藍聚成的河流拱衛著總統，韓導站在發財車上向四周的熱情民眾一一謝票，感謝他們還願意再給他一次機會、感謝大家還願意信任他。\n\n謝票遊行持續到兩三點才結束，韓導拖著沉重的身軀爬回發財車的後座，連續三天從北到南的遊街拜票讓他疲憊不已，年近七旬的身體確實不如從前啦!外頭昏黃的路燈一閃一閃照過他的面龐，內心的苦惱只能向遠方的月亮傾訴，他心裡明白經過戰爭的洗禮，台灣和台灣人已經徹底改變了。\n\n往事如煙消散，現在的韓總仍是掌舵的船長，但他真的能帶領中華民國駛向所有人心中的夢想之地嗎?西方的赤色巨龍只是暫時消退，他們仍然有實力東山再起；遙遠東方的美國消息十分混亂，短時間內也沒有機會重返亞太。舞台已經清空、亂棋必須重下，舊秩序的瓦解意味著的新生，可中華民國準備好了嗎?不知下場表演會在甚麼時候拉開帷幕，他能為中華民國做些甚麼?能給台灣留下甚麼?\n\n車子在左營的一棟灰色大樓前停下，再給司機先生塞了幾張國父後便頭也不回地走向會客大廳，坐在辦公桌前的保全盯著老舊的電視呼呼大睡，裡頭播放正是韓總剛才遊街的新聞報導。外頭的喧囂絲毫沒有影響到這位保全的生活，韓國瑜沉默了。\n\n是啊，改變不是投完票以後就就完成了，造勢活動撲面而來的熱情被現實狠狠的搧了一巴掌，想要從根本上改善台灣的人困境，需要很長很長的時間......一團團思緒湧向大腦，韓總深深地打了個哈欠，得想辦法為中華民國做些甚麼才行，不過未來的時間很長，可以慢慢思考……"
 CHI.H2.11.a:0 "\"Han Bing, I'm home! Any late-night snacks tonight?\""
 CHI.H2.41.t:0 "Sword of Themis"
 CHI.H2.41.d:0 "Li Huiming sat on the plastic bench in the holding room. The seat was peeling from years of neglect, making it rather uncomfortable, but it was still a vast improvement over the hard concrete floor of his cell. He shifted his weight, faked a few sickly coughs, and muttered nonsense under his breath. The guard outside the door just watched him, too afraid to intervene. This was the advantage of holding a psychiatric evaluation report: nobody dared to cross you. If the slightest accident happened, the eager media outside would immediately tear into these high-and-mighty civil servants.\n\nWhen the time came for the trial, a bailiff led him to the defendant's stand. The judge and prosecutor were already in their places, alongside the public defender. He had seen this exact scene many times. Today would just involve some empty arguments before the gavel fell, leaving him plenty of time to reminisce about his \"great achievements.\"\n\n\"Defendant Li Huiming, age forty-three. You were charged with threatening the lives of others with a deadly weapon in a public space. The nature of your crime is vile, and you have shown no remorse. We find you guilty of murder and obstructing official duties. You are hereby sentenced to death and deprived of your civil rights for life.\" The moment the sentence was pronounced, the escorting bailiff grabbed Li Huiming by the collar and hauled him to his feet.\n\n\"I'm innocent! J-judge, I really didn't mean to...\" he wailed in panic. The sudden death sentence caught him completely off guard. He cast a desperate look at his public defender, but the lawyer simply pulled out a massive stack of psychiatric reports belonging to other defendants, along with Li Huiming's own, and hurled them right in his face..."
 CHI.H2.41.a:0 "That night, all the fuses in the Tucheng Detention Center blew out."
 CHI.H2.61.t:0 "Gathering of Old Friends"
 CHI.H2.61.d:0 "The fading sunlight silhouettes the Kaohsiung City skyline. Rivers of red and white flow in opposite directions; the people living on this land all have their own goals and paths to follow. Intermittent traffic lights guide the movement of these cars in an orderly fashion, signaling when to advance and when to stop.\n\nHan Kuo-yu raised his teacup and took a sip. This was his favorite Sanxia Longjing. Steam rose from the hot tea and dissipated into the air, framing the two prominent figures arguing red in the face before him.\n\n\"Mr. Soong, I personally deeply respect your and the KMT's desire for party unity, but your demands seem a bit excessive...\" Chen Chi-mai gripped his cup tightly, spilling tea over his hand, gripping it so hard he seemed ready to crush it. \"Even the most moderate factions within the DPP could never agree to this. How am I supposed to explain this to the other party members—\"\n\n\"Mr. Chen Chi-mai,\" Han Kuo-yu's lips curled into a faint smile. \"The DPP is still a part of Taiwan, a part of 'us.' It's just that the political infighting over the past few years was too severe. It aches my heart to see it; it really breaks my heart!\"\n\n\"President Han, we are all children of Taiwan thinking about Taiwan's future. We shouldn't be at each other's throats like this. If we both take a step back, it will be easier for me to answer to the voters and everyone else.\" Chen Chi-mai pursed his lips and slowly glanced toward President Han. He carefully put down his teacup and refilled it from the teapot, trying to hide his inner nervousness. Would the President agree to his request?\n\n\"Hmm...\" Han Kuo-yu nodded thoughtfully. \"Classmate Chen makes a fair point. How about this: Mr. Soong, why don't you coordinate things and help secure more of the central budget for our Kaohsiung City? And Classmate Chen, you can help us communicate with the pan-Green factions like the Statebuilding Party. Ask them to go a little easy on us during interpellations at the Kaohsiung City Council?\"\n\nMr. Soong nodded in reluctant agreement. Chen Chi-mai could tell he was quite dissatisfied with this arrangement, but Soong had no choice. If he refused, his political faction would likely face complete marginalization in the future. Urged on by Han Kuo-yu's enthusiastic prompting, the two sides shook hands and made peace. Secret Service agents escorted the men out of the teahouse. Just as Chen Chi-mai was about to drive away, an agent ran up with two gift bags in hand.\n\n\"These are birthday gifts from him for your daughter. He also asked me to pass on a message: /'Don/'t forget to take care of your family outside of work.'\" Chen Chi-mai accepted the gifts, placed the bags on the passenger seat, and turned the key."
 CHI.H2.61.a:0 "He started the engine and plunged alone into the dazzling white river."
 CHI.H2.81.t:0 "One of Us"
 CHI.H2.81.d:0 "在新北市的便利店裏， 張緻遠拿著一筐的速食食品，用日語對便利店的收銀員說到:”麻煩結賬，並給我一包最便宜的煙”.他是一位在日本工作的中國大陸公民，他的公司在臺海戰爭后，開始在台灣開拓業務，他因爲是唯一一個會説中文的被公司派到了台灣，他在抖音和微博，看見那些博主和自媒體都說，戰爭之後台灣人都恨不得把大陸人扒皮抽筋，過去了就會被人霸凌攻擊，還有許多視頻爲證，他對此極爲恐懼，可惜還是無法違逆公司的安排，只能把自己僞裝成一個日本人，他打算接下來就靠這些速食在酒店裏度過，他離開便利店，在街邊看見一些還沒有清理的，看見市政府門前大屏幕上播報的本市死者名單，看見有明顯修繕痕跡寺廟裡大片的戰爭死難者牌位，這都讓他兩股戰戰，在腦中不斷幻想自己是大陸人如果被發現了將會遭受什麼樣的迫害，他抱緊了裝有身份證和護照的公文包，生怕這些東西被人看見，又連忙把自己的華為手機放進公文包的最深處，生怕被人看見。\n\n他終於回到了酒店大堂，正準備回到房間，除了工作再也不出來，就當他放下想著東西，鬆了一口氣時，電梯間跑出來一個少年，他一頭撞上了張緻遠，突然之下，他沒能反應過來，被撞到在地，在他起身的一瞬間，他看見了讓他全身發寒的事情，他的包在撞擊中被打開了，身份證護照華為手機散落了一地，他覺得自己要完蛋了。\n\n就在這時，一隻手伸到了他的面前，是那個撞到他的少年，他下意識的抓住了少年的手，少年將張緻遠扶起來后，不斷道歉並轉身準備替他將東西撿起來，張緻遠連忙想阻止但少年已經拿起了他的護照，就在他覺得少年看見後肯定要態度發生180°大轉變時，少年只是默默的的替他把散落一地的東西收好，將公文包和速食交還給他，少年開口到：「真是對不起，希望你在台灣玩的開心，大家都是自家人」然後便離開了\n\n張緻遠呆呆的站在大廳，直到酒店工作人員來詢問他是否需要幫助，他才如夢初醒般的回過神來，回到房間他看著天花板，口中喃喃到："
 CHI.H2.81.a:0 "\"Everyone here is one of us...\""
 CHI.H2.82.t:0 "自家人"
 CHI.H2.82.d:0 "在臺北的街道上李木生彷徨的走著。他手裏拿著用馬來西亞文，英文，中文三種語言寫的紙條，他根本不知道這上面寫的是什麽地方，他隻身一人來到這裏，尋找自己最後一個親人，在台灣的表叔。他不會漢語，英語也很差，他不敢與人搭話，只能默默的用谷歌地圖的導航，但他在這附近繞了快十分鐘了仍然沒找到這個地方到底在哪，導航也沒有用。無奈之下，他只能鼓起勇氣，開始尋找看起來能幫助他的人，他看上了一位似乎慈祥而且很空閑的阿嫲，他靠上前去，他用生硬的語氣說出了自己會的唯一一句漢語：「你好」，在阿嫲回答之後，不斷指著那張紙，用英語説到：「I go here」，老人家看他緊張的樣子，臉上笑道：原來是海外同胞，接過紙一看，連連招手：「跟我來吧」，李木生連忙跟上，一路上老人家一直在用他聽不懂的語言在說著什麽，但是李木生感覺到了一股溫暖友善的氛圍，是他在馬來西亞人身上沒有感受過的感覺，老人家帶他來到一個小巷中，敲開了104室的窗戶，裏面探出來一個年輕女孩的腦袋，老人家笑著對女孩説道：「阿良，這應該是海外來的同胞，我看他拿著的紙條是寫的這裏502室的李先生，我看他不會說國語，麻煩你這個大學生帶她上去吧」女孩從房間裏出來，用英語與李木生溝通了一會，阿嫲看事情已經走上正軌了，便打算離開，李木生連忙對老人家道謝。女孩帶他來到了502室，敲了幾下房門，房門打開，裏面是一位和李木生有七分相似的中年人，女孩與中年人交流了幾句，中年人轉向李木生，用馬來西亞語說到：「先進來吧」"
 CHI.H2.82.a:0 "團結海外華人"
 CHI.H2.101.t:0 "In the Name of the Government"
 CHI.H2.101.d:0 "夕陽的餘暉指引著疲憊的上班族回家的路，此起彼落的叫賣聲越過馬路飛進一條不起眼的巷弄內，一輛銀灰色廂型車默默的靠在路肩，坐在後座的侯組長食指貼著嘴唇想來一口煙，但想到自己等等要執行的任務，左手便默默把煙盒放回口袋。 「開始行動！」無線電傳出的命令簡潔有力，侯組長使了個眼神，眾人下車後有條不紊地走向嫌疑人的家門口，其中一人提前把的搜查令拿在手上，另一人直接拿出萬能鑰匙準備撬鎖，這不太符合規矩，不過……非常時期非常手段。 「別動！ 特別偵查組！」組長帶著手下魚貫而入，「陳委員，我們奉命調查您的住宅，還請配合本組業務以免造成不必要的困擾。」陳茵微立委端著飯碗滿臉錯愕的看著眼前的黑衣人們，在她說話之前那些人便迅速散開搜查她的住宅。 「侯闇曲，你這是什麼意思？！你們隨意搜查立委的房子是什麼意思！我告訴你，我跟你們的高署長可是老朋友！」立委看著桌上的搜查令對著特偵組大聲怒吼，但侯組長只是拉來一張椅子，隔著熱湯蒸騰的水氣，緩緩坐在陳立委對面。 「小蕭！有找到什麼嗎？」 「有的組長！」小蕭小跑步來到組長身邊，拿出手機遞給侯闇曲，後者接過手機一看嘴角差點沒失守，對桌立委的臉色沉了下來。 「那、那個冰箱不是我的…！是誰把那些錢放進這個冰箱的我完全不———」話音剛落，兩名特偵組幹員把陳茵微委員架離房間，一把塞進廂型車後座，口袋裡的ESTA影印件在街外的煙火氣中緩緩飄落，被路過的機車烙印在滾燙柏油路上。"
 CHI.H2.101.a:0 "Director Hou took out his lighter and lit a cigarette."
 CHI.H2.121.t:0 "A Second Bowl of Braised Port Rice"
 CHI.H2.121.d:0 "國民黨某次黨內會議，時任黨主席的韓國瑜上臺，對黨內發表演講，說道：「我不要求滿漢全席，但一定要有一碗滷肉飯。」這是我在選舉高雄市長時無奈的呐喊，當時臺南被黨内視為低回報地區，認為在當地民進黨不可戰勝，認爲這些綠營堡壘堅不可摧，不願意投入競選資源。但我在2018年的勝利打破了這個看法，只要有良好的舉措，願意去和民眾交流，願意放下身段解決民眾的難題，民衆必定能看見選舉人的努力。現在我在提出了未來不在以地區劃分選舉資源的提案，希望在將來：只要有成績，就有資源，不再將資源全部聚焦在北部，要往南部發展，要支持南部黨員的選舉，不要害怕其他黨派看似堅不可摧的堡壘，不要因為害怕失敗所以畏畏縮縮，我自己就證明了這些堡壘并非堅不可摧，南部的黨員有許多有想法、有熱情、有幹勁、有希望的人，卻困於無資源可用，不僅要落敗與其他黨，還因為做不出成績，潛力無法釋放，以至於明珠蒙塵。這對於黨和國家都不是一件好事。所以未來絕對不可以地域劃分競選資源，而是要以成績劃分，讓能者上庸者下，不要在死抱著安全保守的想法，最起碼所有競選者，都起碼要有一碗滷肉飯，一瓶礦泉」\n\n台下爆發出熱烈的掌聲，特別是年輕黨員發出的聲音更大"
 CHI.H2.121.a:0 "Food for everyone!"
 CHI.H2.141.t:0 "The Elephant in the Room"
 CHI.H2.141.d:0 "Taipei City. The blade of history has left deep scars across this old capital. Construction floodlights illuminate the skyline, while bustling downtown districts offer crowds a place to unwind after work. Ketagalan Boulevard sits quiet tonight, though street vendors in the corners still pulse with life. Watching the scene unfold, Han Kuo-yu feels the weight of the nation on his shoulders. True prosperity for the Taiwanese people will not happen overnight. He steps into his motorcade; there is work to do.\n\nDeep inside an underground conference room missing from any blueprint, the President and his aides gather around a heavy iron table. The projector's glare washes over their grim faces. They thought they understood the rot festering beneath the surface, only to find the reality far more complex.\n\n\"So what are we supposed to do?\" an aide asks. \"Everyone knows about the government corruption and the rock-bottom birth rates. The partisan infighting just makes the situation impossible. What is the point of identifying the problems if we can't act?\"\n\n\"Professor Gao is right,\" Han nods. \"These issues are dragged out every election to attack the incumbents. And then what? The winner plays dumb, uses friendly media to blur the public's memory, and waits for the opposition to recycle the exact same attacks four years later.\"\n\nVoters rarely care which politicians can actually fix things. Even when they do, the opposition simply weaponizes their voices against the administration. Social issues have become a gladiatorial arena. Citizens sit in the stands, waving flags and cheering for their side until the opponent falls.\n\nThe entire system has idled for years. Men fight bitterly over power and profit at the negotiating table, completely ignoring the elephant in the room. Politicians are unwilling and unable to shatter this illusion. But if the President truly wants to overhaul Taiwan, he will have to be the boy who points out the emperor has no clothes.\n\n\"Ministers,\" Han says coldly. \"The only things I want to see on my desk are solutions, or your resignations. I will not accept excuses or delays. Dismissed.\"\n\nHan waits for the last aide to leave before packing his briefcase and exiting the building. Even with the sickness settled deep in its bones, Taipei still shines bright tonight."
 CHI.H2.141.a:0 "Drastic problems, drastic measures."
 CHI.H2.151.t:0 "黑金風暴"
 CHI.H2.151.d:0 "周貴發對著前排後照鏡整了下領帶，這算是他平生少數幾次需要穿西裝出門談生意的時刻，在他接到茶會通知時才慌忙在家裡到處翻找，最後不得已只能拿結婚時買的那套西裝來頂一下。建築工程行業近幾年都不好做，台灣地狹人稠，城市開發跟基礎建設基本完備，如果搶不下重劃區跟公共建設的標案就只能看看還有沒有甚麼殘羹剩飯能拿，要是再拿不到……那就只有破產這一條路能走了。\n\n為了拿到政府的訂單剩下的建築商可以說是卯足的全力，送花、送鳥、捐贈政治獻金等等，在需求緊縮跟缺乏競爭的背景下想要活下去就只能乖乖地上繳過路費。周董下車走上茶樓，大家都在包廂裡等他，與會者都是台灣前幾名厲害的營建商，戰爭過後百廢待興，人人都在爭搶桃園機場跟左營軍港翻修的大訂單，高速公路與電力基建也是塊肥肉。坐在角落的林大哥就是搞光電板的，打點好關係後趁著非核家園計畫拿下多筆「種電」方案跟綠能補助，廢棄農田全部改建成太陽能發電廠，政府帳上有漂亮的數字、林總靠著綠能轉型發大財、專員荷包賺滿滿，大家都有美好的未來。\n\n茶會上大家都在討論如何分贓下一款大型工程，周貴發不發一語，他算是整場會中規模最小，也是賄賂最少的營建商。他原以為只要工程做得夠好就能打破這種惡性循環，可他又違背不了自己當年做工程的良心，每一分錢都必須花在建設上。正當眾人相談甚歡之際一群黑衣人闖入包廂，後者集體圍在他們身後。\n\n「我是侯組長，還請各位稍安勿躁，盡請配合我方的調查工作，若是有任何疑問或是不滿的地方，你們有權利打給你們的律師----不過我勸你們別做無用掙扎」侯闇曲朝部下使了個眼色，一一拿出手銬準備控制在場的嫌疑人。\n\n「好啊，沒問題。」林大哥十分配合的舉起雙手，滿臉從容地起身，絲毫不在意自己身後的那名特別偵查組幹員，其他幹員也依次將每個嫌疑人上銬帶走，他們有的像林哥一樣從容，但大部分都十分慌張地跟解釋自己是無辜的，周貴發以為自己也會被帶走，可侯組長在收網後頭就也不回地離開包廂，留下滿臉錯愕的周董。\n\n幾天之後到了競標日，當時在茶會上見到的幾位大老跟公司代表全都不見蹤影，手機上也播放著黑社會跟官商勾結被大力清剿的新聞，周董關掉手機，試著不去回想那天的可怕經歷……"
 CHI.H2.151.a:0 "常在河邊走，哪有不溼鞋"
 CHI.H2.181.t:0 "Meeting in the Middle"
 CHI.H2.181.d:0 "Taipei had yet to fully recover from the war, but glimpses of its past glory still lingered at major intersections. The rushing crowds and heavy traffic pointed to one thing: another great battle loomed ahead.\n\nDressed in a dark suit, Tsai Ing-wen led Lai Ching-te through the heavy atmosphere, following a guide deep into the Regent Taipei. She had no idea what Han Kuo-yu was planning. Still, for a man at the height of his power to invite her to discuss state affairs after such a war gave her and the DPP immense face.\n\nThe walk was short, and overthinking was no substitute for seeing things firsthand. Tsai took the seat opposite Han, with Lai settling in beside her. Han was in high spirits. Beside him sat Chiang Wan-an, a descendant of Chiang Kai-shek and a rising star in Taiwanese politics.\n\nA trap... or something else?\n\nAfter an exchange of greetings, silence fell over the table. Tsai’s brow twitched. She was about to speak when Han beat her to it:\n\n\"President Tsai, there is no need to worry. I did not invite you here to attack political opponents or divide the spoils. The situation remains dire in the wake of this crisis, and I sincerely ask for your counsel on state affairs.\"\n\nChiang Wan-an nodded in agreement. Lai Ching-te looked doubtful but stayed quiet, simply turning to glance at Tsai. Her expression softened slightly. After a brief pause, she replied:\n\n\"You are too modest, President Han. Without you, how could Taiwan have won? I just do not know your grand strategy for the post-war era. I only hope you keep the greater good in mind. The people look to you and the nation depends on you. Do not repeat the mistakes of the past...\"\n\nHan understood the implication: she feared he would become the next Chiang Kai-shek. He tapped the table, his expression calm, and spoke slowly:\n\n\"Rest assured, President Tsai. I draw lessons from history. If Taiwan is to enjoy clean politics and social harmony, we cannot shut out the eyes and ears of the people. That principle is the very foundation of my governance.\"\n\nHan spoke with sincere humility. He went on to outline his political vision, allowing Tsai to finally breathe a sigh of relief. A tired smile broke through her solemn expression.\n\nTsai glanced over at Lai and Chiang. She never expected these two prominent figures, both seen as the rising heirs of their respective parties, to hit it off so well. Han raised his glass for a toast. Finally dropping her guard, Tsai raised her own glass to join them."
 CHI.H2.181.a:0 "I look forward to our collaboration!"
 CHI.H2.221.t:0 "Bridgehead for the Counterattack"
 CHI.H2.221.d:0 "「隨著台海戰役的結束，我國趁著中華人民共和國撤離西沙與南沙群島時成功派遣部隊光復這些地區，部分相關領域專家對此表示擔憂，表明這可能會觸怒中國迎來殘酷的報復，現在本台即將訪問韓總統對此的看法。」\n\n「我覺得這沒什麼嘛，我們都打贏過一次了，如果能順利開發上面的資源，我們就可以用來讓國家發大財，發大財就能研發更好的裝備，我們幹嘛要怕中國報復？」韓國瑜抬起右臂，做出加油的動作鼓舞大眾。\n\n「大家要更有自信一點，只要你們依然信任著我，我就不會讓你們吃虧！」\n\n全場掌聲四起，並不是每個人都接受他的話語，但韓國瑜的語言裡確實帶著某種吸引人的魔力。\n\n「嗶——」\n\n遙控器的按鈕被按下，電視上的新聞播報被立刻切斷。\n\n「真是精彩的回應，總統先生。」\n\n年輕的幕僚盯著黑色的螢幕，慢慢轉頭看向韓國瑜。\n\n「對吧？我想肯定能鼓舞人心。」\n\n幕僚移開視線，猶豫的一會開口詢問。\n\n「總統先生，您確定要這麼做嗎？我們趁機佔領外島已經遭受北京政府的公開譴責了，要是再為海南省復省絕對會被視為嚴重挑釁，那樣......」\n\n還沒說完，韓國瑜打斷了這位年輕小子的話語。\n\n「為什麼不這麼做？我就是希望對岸明白，中華民國不會一直都待在這座島上，如果你發現自己能變強震懾霸凌者，你不會一直這麼躲在角落裡吧？我可不希望我的人民一直被欺負。」\n\n韓國瑜站起身來，走向辦公室的門口，他伸手轉動門上的喇叭鎖。\n\n「而且我也要向大陸居民傳達訊息『台灣人沒有忘記自己的同胞』，就這樣。」\n\n韓國瑜走出門口，趕往下個需要他的地方。\n\n確認韓國瑜走遠後，幕僚長嘆了一口氣。"
 CHI.H2.221.a:0 "Time to decide which letter we should use on the new National IDs..."
 CHI.H2.222.t:0 "First Step of the Reclamation"
 CHI.H2.222.d:0 "On Yongxing Island, two workers operate a heavy angle grinder to erase the characters from a stone monument that once read \"Sansha City People's Government.\" Nearby, a crane lowers the administrative plaque, preparing to hoist a new sign reading \"Hainan Provincial Government.\" Following the island's reclamation by ROC armed forces, a presidential decree authorized the reinstatement of Hainan Province, whose operations had been suspended since 2003. The former Sansha administrative complex is being converted to house this provincial authority, while the old Xisha District headquarters 1.5 kilometers away will be repurposed as the new Sansha City Government.\n\nMeanwhile, officials arriving from Taiwan are conducting a census across the Paracel, Macclesfield, and Spratly Islands, asking residents whether they wish to apply for Republic of China citizenship or return to the mainland. For the first time in over two decades, the Hainan Province emblem flies over the South China Sea, with Pratas Island and Taiping Island officially returned to provincial jurisdiction.\n\nLi Shun's grandfather was a veteran of the Hainan campaign. Growing up, Li heard countless stories about the Great Retreat and the island's coconut and sugarcane farms, along with the relatives left behind who eventually faded into silence. Upon hearing of the province's reinstatement, Li bought a ferry ticket and brought along some coconut candy, which his grandfather always said held the taste of home. Standing on the shores of Woody Island, he looked toward Hainan. Though the landmass remained out of sight beyond the horizon, he could feel the pull of the homeland that had haunted his grandfather's dreams. Tossing the candy into the waves, he shouted:"
 CHI.H2.222.a:0 "\"Grandpa, we're going home soon!\""
 CHI.H2.251.t:0 "The Cycle of History"
 CHI.H2.251.d:0 "Hu Yuan-hui leaned his clasped hands against the solid wood desk. His eyes darted between the desktop and his uninvited guest. He swallowed, trying to ease his parched throat. The visitor sat across from him wearing that signature smile. Hu had seen this face on television countless times, and it was identical to the approachable figure who once canvassed for votes in traditional markets. Not a single flaw.\n\n\"I believe my board of directors and I have made ourselves very clear, Mr. President. Media freedom must not be interfered with! Thirty years ago, our predecessors fought hard to free Taiwan's media from political and military control, a reality the Taiwanese people gladly embraced. You are openly making an enemy of the public!\" Hu yelled at his distinguished guest, trying to use the volume to mask his own anxiety. He knew perfectly well that he and PTS were rapidly running out of room to maneuver...\n\n\"Mr. Hu,\" Han Kuo-yu said in his trademark approachable tone. \"Aren't you the one making an enemy of the public? On the surface, you claim to be neutral. In reality, you take orders from the ruling party in hopes of securing a larger budget. That means PTS answers only to the government and never truly looks out for the people!\"\n\n\"That is still better than you personally interfering with PTS operations...\" Hu was on the verge of a total breakdown. Months of internal audits and news content investigations had left him utterly exhausted. Various reorganization plans piled up like a mountain on his desk, and his forceful pushback had only invited even harsher restrictions. He stood up, gritting his teeth, feeling as though he were balanced on the edge of a cliff. He reached out his hand. Was this really his only way out?\n\n\"A pleasure working with you. You finally have time to spend with your family, unlike me, constantly chased by government affairs.\" President Han smiled as he shook Hu's hand. \"My assistant will bring in the agreement shortly. Please sign it as soon as possible. Thank you for your trouble!\"\n\nHan Kuo-yu walked out of the office with a smile. Hu Yuan-hui slumped back into his leather chair, looking as though his soul had been drained. He stared at the various certificates lining the wall and suddenly felt countless eyes scrutinizing his every move."
 CHI.H2.251.a:0 "\"Mr. Hu, please sign.\""
 CHI.H2.261.t:0 "Interview"
 CHI.H2.261.d:0 "\"So, what are your thoughts on your time as president so far? Or perhaps you have certain expectations for the future?\" Zhu Kexin leaned forward slightly. She held a notebook stamped with the PTS logo in one hand and a ballpoint pen in the other, ready to record the president's reply. She glanced at the page crammed with various questions and margin notes. This list was the product of her department colleagues racking their brains all night. When first submitted, the draft contained a full forty questions. After passing through layers of approval, the Presidential Office agreed to answer exactly seven.\n\n\"Oh, right... I actually find being president quite enjoyable. Compared to my time as Kaohsiung mayor, serving the entire country definitely brings a greater sense of achievement than just serving one city! As for my vision for the future, we have already endured far too much hardship. My wish is simple: I just want everyone to be able to buy affordable vegetables at the local market!\" Han Kuo-yu's hearty laughter rubbed off on the people in the room. Zhu Kexin couldn't keep a straight face and accidentally let out a laugh. Yes, this man really was just that approachable and charming. Anyone who watched television regularly would undoubtedly agree.\n\n\"You really are a man of the people, Mr. President...\" Reporter Zhu regained her composure. She looked across the table at her interview subject. Her eyes inadvertently caught the camera behind him. The blinking red dot served as a constant reminder to the two people in front of the lens: this was a performance, not an interview. Zhu Kexin swallowed hard. Her professional conscience felt incredibly feeble under the camera's glare. She quickly put on a show of taking furious notes, nodding thoughtfully as she scribbled.\n\nReporter Zhu quietly closed her notebook. The floor director caught her eye, and the red light blinked off. It was time for a break. A few staff members, eager to witness \"President Han\" and his famous presence in person, practically sprinted onto the studio floor. Reporter Zhu was the only one who walked silently over to the emergency stairwell, dropping her notebook down the shaft."
 CHI.H2.261.a:0 "And she left the PTS building without looking back."
 CHI.H2.301.t:0 "No. More. Chaos!"
 CHI.H2.301.d:0 "It was another day of debate in the legislature. During a tense and heated future budget meeting across party lines, a veteran DPP legislator found himself losing ground. Seeing that the KMT's proposed budget was on the verge of passing, he acted almost on instinct: he took off his leather shoe and hurled it at the speaker's podium.\n\nThe shoe struck the podium with a loud smack. In an instant, the entire legislative chamber fell dead silent. Everyone stared at the veteran legislator. Catching on to what he had just done, he turned pale. His legs shook as he babbled his excuses: \"No, no, no, the shoe flew off on its own. I didn't mean to.\"\n\nThe speaker stared at him for a few seconds before speaking. \"Parliamentary police, restrain this legislator.\" Two officers immediately stepped forward, grabbed the old legislator by the arms, and forced him down into his seat.\n\nThe speaker then continued: \"Under the newly enacted Law on the Exercise of Legislative Yuan Powers, any legislator who disrupts order and shouts in the chamber through fighting, flag-raising, presenting gifts, or performance art shall be immediately expelled and suspended for one day. We will also bypass the agenda to hold an immediate floor vote on whether to suspend his legislative duties for two months.\"\n\nAmid the clatter of voting buttons, the result appeared.\n\n\"Passed unanimously. Parliamentary police, please escort Legislator Li out of the legislature.\"\n\nSmack. The gavel fell heavily. The veteran legislator kept his head bowed as the two officers flanked him and marched him out of the building.\n\nAfter he had left, the speaker addressed the room: \"I am sure you all remember what the legislature used to be like. It resembled a performance art gallery and a WWE arena more than a government assembly. But the new Law on the \"Exercise of Legislative Yuan Powers\" has now passed. I expect all of you to act with the self-awareness of a politician and a decent human being. The budget meeting will now resume. Please proceed with reason and self-restraint.\""
 CHI.H2.301.a:0 "I guess the public won't have the WWE Taipei branch to watch anymore."
 CHI.H2.391.t:0 "New Book, New Era"
 CHI.H2.391.d:0 "令人難受的溼熱空氣充斥著教室裡的每一個角落，同學們規規矩矩地坐在自己的位置上，有的抬頭聽講、有的低頭奮筆疾書，生怕錯過下一個期中考考點。大部分同學忍受著這種窒息的氛圍，少部分像蔡芬琪那樣的學生則選擇躲在最後排偷偷聊天，偶爾抬抬頭假裝自己有在認真聽課。\n\n「欸欸，芬琪。你有學姊的歷史考前筆記嗎?借我抄一下。」一位同學用手肘輕輕頂了下蔡芬琪的側腹，後者不耐煩的從書包裡拿出那份書皮皺巴巴的筆記本，在發黃的內頁上翻來覆去，翻到這次期中考的重點後偷偷傳給她。\n\n雖然課綱每十年就會改一次，教科書的內容也時不時就有很大的變化，但她們的學校都只用自編的教材，從國英數到物理化學、公民地理等等皆是如此，歷史科當然也不例外，雖然教育局一直在勸導使用公版教科書，但像她們這種的頂尖高中從來就沒理會過這種勸導，依然只用自編教材上課。所以就算不上課，蔡芬琪她們也能靠學姊的筆記輕鬆過關。\n\n「各位同學請注意一下。」老師突然停下手中的粉筆說到，「鑒於教育部目前發布的課綱要求與指示，期中考的長短篇閱讀、史料判別跟簡答題的比例將大幅增加，同時民國史和四九年後的近代史也是重要考點，所以大家複習的時候一定要多加注意。」\n\n蔡芬琪驚到的下巴都快掉到地板上了，她完全沒想到老師會這麼不按牌理出牌。下課後她才從家裏翻出一開學就被她丟到床底的歷史課本，一邊翻閱課本一邊熬夜在自編教材上做各種筆記。"
 CHI.H2.391.a:0 "\"Will all these generals' names be on the test...?\""
 CHI.H2.431.t:0 "Better Safe than Sorry"
 CHI.H2.431.d:0 "Agent Su held a cigarette between his fingers and took a slow drag. The wisps of exhaled smoke stood out sharply under the incandescent bulb. His gaze pierced the haze to observe the room, where a younger agent was interrogating the prisoner. The captive screamed for his lawyer, earning only a barrage of heavy blows in return.\n\nThe National Security Bureau task force under Su's direct command worked tightly with law enforcement. Fresh intelligence landed straight in their hands, and every suspect was hauled in to face personal interrogation by NSB operatives. As for the prime suspects identified as Communist sympathizers, the bureau had specialized services waiting for the bastards.\n\n\"Speak! Where are your accomplices? Give up their names, and I can make things a little easier for you.\" The young agent punctuated his demand with another punch to the prisoner's gut. Brown vomit stained the captive's orange uniform.\n\nAgent Su picked up a piece of toast from the table and took a bite. For the past few days, they had \"kindly\" fed the prisoner white bread and water, paired with three continuous days of severe torture. If this still yielded no results, they would have to consider a backup plan.\n\n\"I-I'll talk...!\" the prisoner gasped. \"Please stop hitting me. I'll say anything, I beg you...\"\n\n\"Let him go.\" Agent Su dropped his cigarette and crushed it out with his heel. He pulled a pen and paper from his pocket and set them on the table.\n\n\"I want a list of your financiers and your accomplices. Write down the locations of every safehouse, and put your written confession on the back. If you try to play smart with us...\"\n\nSu shot a glance at his subordinate. The younger agent reached into a folder on the table and pulled out three black-and-white photographs."
 CHI.H2.431.a:0 "Look at your wife and daughter; this is the price of treason."
 CHI.H2.411.t:0 "Life of a Student"
 CHI.H2.411.d:0 "雷丹是新北市的一所國際高中的學生。在一個稀鬆平常的新的週一，他剛剛從捷運站拿著早餐到了校門口，發現同學們全部圍在大門前拍照，他擠進去便看見，學校的名字下面多出了一行英文名，在進門之後也發現所有的標牌和路牌都變成了中英雙語，連飲水機上面的文字都被刻上了雙語.雷丹剛剛來到自己的座位放下書包，旁邊的章樹人便向他搭話道: 「學校裏面所有東西都變成雙語了的，上個月韓總統不是才公開講話說要推廣雙語教育嗎?學校的反應可真快啊. 」雷丹回答到: 「對啊，不知道還有沒有別的改變。」他斜眼一看，班上那個在B站和油管發影片，外號Vlog哥的同學正在四處拍攝新的雙語設備，就在這時，班主任提早來到了班級中：「來兩個壯丁，去拿一下新的課本。」雷丹和章樹人對視一眼，兩個人搶先起身跟著老師走了出去，十分鐘後，兩人一人推著一輛板車回到了教室，將課本放在講台上後，雷丹大喊道：「你們想知道新課本有什麼特別的地方嗎？」教室的大家都看著他。他才說到：「我們在回來的路上看了，所有科目的書都變成中英雙語的了。」教室裡面響起一陣討論聲音。\n\n在這時老師推門進來，兩人連忙從講台下去，出門去把板車還回去，老師開口倒：大家按學號上來領新課本。領到書的學生翻開新書一看，不管是國文，數學還是生物，物理，化學，美術的課本上除了文言文之類實在是難以翻譯的內容都變成了中英雙語，英文課本更是變成了純英文。老師拍了拍手：「好了，大家先把課本放下。我來介紹一位新老師。亞力克老師，請進來吧。」門口走進來了一位白人男性，他用有明顯澳大利亞口音的中文開口到：「大家好，我是來自澳大利亞的亞力克-蘇，將在接下來擔任大家的英文老師。」學生們紛紛鼓起掌來，歡迎新的外教老師。\n\n班主任老師拍了拍手對大家說到：「好了好了，新外教老師會在下午的英文課正式給你們上課，接下來我說點別的，你們也快放暑假了，現在新政策有教育部組建的英文夏令營想要參加的今天回去和家長商量商量，明天放學來辦公室報名。還有，你們也是高二學生了，明年就高三了，現在新政策去英文國家留學補助扶持，我接下來發一下去留學補助宣傳單，帶回去給你們家長看看。」\n\n中午，營養午餐到了教室裡，學生們一團一團的聚集在一起，一邊吃飯一遍討論著今天上午的新變化，章樹人拿著手機說到：「看教育局的計劃，未來幾年英文課要實現全英文教學呢，幸好我們上學上的早。」雷丹回到：「是啊，估計班上英文不好的那幾個人現在已經焦頭爛額了吧。」他趁機往教室另一頭看了一下，VLOG哥他正在用帶來的佳能攝像頭拍攝新的課本，估計又要發到B站獲取10w播放了"
 CHI.H2.411.a:0 "\"Integrating East and West.\""
 CHI.H2.161.t:0 "No More Legal Bribery"
 CHI.H2.161.d:0 "鳥岸污水處理廠是一家在臺南市本地深耕多年的本地企業，他們曾經多次被舉報排污未達到國家標準。但每次環境調查的結果都是純屬無稽之談，鳥岸處理之後的污水都是符合國家排放標準的。\n\n臺南的一間私人會所中，鳥岸污水處理廠的廠長和最大股東兩個人，正滿臉諂媚的笑容，向本地副市長敬酒，廠長説到：「上次的舉報實在是多謝您和環保局局長兩位的努力了，環保局和化學物質管理署來調查成功通過了，我們都是良心商人，正需要您剛正不阿的官員來保障我們的安全。」副市長舉起酒杯説到：那當然，本地正需要你們這樣的優秀企業，來讓市民過上更好的生活，希望明年選舉季之後我們也能合作愉快。」大股東連忙接到：「那當然，我們的一點心意，已經交給您的秘書了，全部是合法渠道，希望對您的競選有幫助，我們明年也要多多合作。」三人相視一笑，推杯換盞好不熱鬧。\n\n「啪」突然包廂的門被人一脚踢開「哎呀，挺熱鬧嘛，我能不能也能參加參加。」副市長站起身來大聲駡道：「靠你娘，你知道這是什麽地方，你知道我是誰嗎。你就這麽闖進來，會所的保安呢?快把這個瘋子趕走！」來人呵呵一笑，掏出來一張證件：「特別偵查組！我是特別偵查組的侯闇曲組長! 」\n\n侯組長環視包廂，露出了一個令三人不寒而慄的笑容「哎呀，沒想到您這麽有官威啊，我還以爲我現在在大陸呢!真是失敬了。不過您還是在臺南，所以，請和我去特偵組坐坐吧，關於您收取不正當政治獻金。幫助違法企業隱瞞違規行爲的事情，我們想聽聽您的辯解，這兩位是鳥岸處理廠的人吧，正好省的我再跑一趟了，來人，帶走他們三個. 」\n\n侯組長身後立馬冲出來六個膀大腰圓的特別偵查組成員，抓住三人，並把們三人往包廂外面帶走，三人此時已經連自己站穩都無法做到，完全靠特別偵查組成員的力量才能站住，面如死灰的被帶出會所。\n\n侯組長拿起桌上的酒，稍微端詳了一下: 「哎喲，還挺齊全，大陸的茅臺、法國的高級紅酒、日本的高級清酒、英國的高級威士忌，這桌光是酒就有我半年工資了。 」\n\n他放下酒，往包廂外走去，心想："
 CHI.H2.161.a:0 "\"We've caught six this week. Wonder if we can get another one tomorrow to make it one a day.\""
 CHI.H2.231.t:0 "Claiming Legitimacy"
 CHI.H2.231.d:0 "As the situation evolves, the long-ridiculed dream of retaking the mainland and restoring the Republic is finally appearing on the horizon. With the provincial administrations of Taiwan, Fujian, and Hainan already resuming operations, the ROC government has moved to repeal the streamlining of the Taiwan Provincial Government outlined in the Fourth Constitutional Amendment. Once the legislature approves the repeal, authorities will rebuild provincial administrations nationwide alongside the Tibet local government, though plans for Mongolia remain temporarily shelved.\n\nAt a joint press conference, the Ministries of the Interior and Foreign Affairs announced an end to the suspension of provincial governments. These reactivated administrations will overhaul the election and appointment mechanisms for all levels of local government. Officials will also restore citizen household registration systems and build operational frameworks for every mainland province, ensuring these bodies can scale up rapidly to meet future demands.\n\nDuring the same briefing, the Foreign Ministry revived the Chiang Kai-shek-era doctrine that the ROC is the sole legitimate regime of China. The spokesperson declared Dr. Sun Yat-sen's Republic of China as the only orthodox government, acknowledging the Peiping regime's administrative authority over the mainland without recognizing any of its legal sovereignty.\n\nBeijing's Taiwan Affairs Office and Foreign Ministry reacted with fury, repeatedly condemning the announcement as a violation of their legal rights. Having been previously repelled by our forces, the PLA emerged from its barracks to resume military probes against Taiwan. Chinese forces once again crossed the median line to violate our airspace and territorial waters, and even proposed sanctions at the UN General Assembly that ultimately went ignored.\n\nFollowing legislative approval, the government initiated the reconstruction of provincial administrations. A floor in the newly reactivated Taiwan Provincial Government building was allocated to house the core staff for these mainland provinces. Their immediate task is to care for elderly veterans from their respective regions and resettle mainland refugees fleeing to the Free Area. In parallel, staff will gather regional intelligence to draft early takeover contingencies.\n\nThe provincial governments marked their official reactivation with a low-key ceremony. President Han attended the event, telling the staff, \"This isn't really a formal ceremony; we're just keeping it casual among ourselves. Once you all return to your respective provinces, we will hold a grand celebration.\""
 CHI.H2.231.a:0 "We are the true Chinese."
 CHI.H2.371.t:0 "中華民國經濟部地質調查及礦業管理中心    函"
 CHI.H2.371.d:0 "                                                        地址：100005臺北市中正區中華路一段53號\n                                                                                                          承辦人：徐銘宏\n                                                                              電話：(02)23113001    分機001\n                                                                                                 傳真：(02)23112663\n                                                                   電子郵箱：bom001＠gsmma.gov.tw\n\n受文者：韓國瑜總統\n\n發文日期：中華民國1XX年X月X日\n發文字號：經地調字第114514號\n速別：最速件\n密等及解密條件或保密期限：極機密（本件於200年12月31日解密）\n附件：\n\n主旨：陳「全國地質資源調查計畫」第一階段成果，並就我國內可開採戰略\n            礦產及油氣資源以及其潛力提出評估，呈請總統鑒核。\n\n說明：\n\n    一、為因應全球供應鏈重組、地緣政治風險升高及國家安全需求，本部依\n            行政院核定之「全國地質資源調查計畫」，運用高解析度衛星遙測、\n            航空磁力探測、重力測量、三維地震探勘、人工智慧地質建模及深層\n            鑽探等技術，完成臺灣本島及周邊海域第一階段資源普查。\n\n    二、本次調查成果顯示，過去受限於探勘技術及經濟效益評估，部分具有\n            開發潛力之礦體未能完整確認。經重新建模分析後，已掌握數處具戰\n            略價值之礦產與能源蘊藏區。\n\n    三、桃園地區確認存在較既有資料更完整之鐵礦礦體，其規模足以列入國\n            家戰略礦產儲備名單；苗栗地區沈積構造亦發現新增油氣蘊藏潛力，\n            可作為未來能源自主政策之重要基礎。\n\n    四、南海相關海域之地震測勘成果顯示，多處海底盆地具有良好油氣聚集\n            條件，推估可採儲量高於歷年估算值。建議加速後續試鑽、海域調查\n            及相關基礎設施規劃，以維護我國能源安全及海洋權益。\n\n    五、本次成果已完成建檔，並同步納入國家戰略資源資料庫。建議由國家\n            安全會議統籌相關部會，建立平戰轉換機制，確保於緊急狀況下得迅\n            速展開資源開發與生產。\n\n呈請   總統   鑒核。\n\n經濟部   敬呈"
 CHI.H2.371.a:0 "\"Not bad, file it away.\""
 CHI.H2.331.t:0 "More Work, More Pay for the Able"
 CHI.H2.331.d:0 "現行以固定薪級為主的薪資制度，時常被攻擊為「威權時代遺留」，我們承認年資決定待遇，18%優惠存款制度等軍公教待遇，僵化又過時，但仍然是依法任用時約定的一部分.在「不是軍公教太高，而是民間太低」和「世代公平」的思潮下，前任蔡總統時期，就進行過降低退休所得替代率。18%優惠存款逐步歸零等改革.但韓總統認為軍公教待遇是依法任用時約定的一部分，這樣隨意更改不僅破壞既有承諾、損害退休權益也使得民主化時的各階層之間的信任蕩然無存。\n\n但因為民間與軍公教待遇失衡是真實存在的問題，而且前任民進黨政府替現任政府做了得罪人的事情，現任政府正好只要在改革後的基礎上進行修改.經過研究，韓總統決定實行自己在參選總統期間提出的人事制度改革提案之一「軍公教浮動式報酬」，在現有的固定本薪保證軍公教群體生活的基礎上，加入將部分收入改為浮動。根據：工作績效，民眾滿意度，工作難度，工作成果等來決定獎金的多寡，而非和以前一樣完全依靠熬資歷來決定薪資，做得好的軍公教可以領得比以前更多。而不是看著老人坐在辦公室里卻拿走更多的錢。\n\n軍隊部門也會考量戰鬥部隊與非戰鬥部隊差異，外島、高山、艦艇等勤務加給，危險勤務，專業證照，訓練成績，留營率與專業能力等方面，來讓真正的戰士得到實惠，而非讓坐在大樓裡面的將軍拿著高薪。\n\n這些舉措讓待遇更能反映工作風險與專業程度，而不是主要依靠年資來決定。這有助吸引人才留在軍公教體系也能提升行政效率。"
 CHI.H2.331.a:0 "Labor brings reward."
 CHI.H2.321.t:0 "Bullseye"
 CHI.H2.321.d:0 "During his 2019 presidential campaign, Han Kuo-yu and his national policy advisory team proposed the \"Three Arrows of Labor.\" Feasibility concerns over funding and implementation, followed by the Communist invasion, prevented early action. Now, with the war won, decreased defense spending and rising economic growth have generated the fiscal surplus needed to finally make these promises a reality.\n\nThe First Arrow: Amending the Employment Insurance Act to cover unpaid leave. The system now compensates affected workers with 60 percent of their insured salary. For citizens like Wei Jie, a factory worker reduced to a two-days-on, five-days-off schedule after PLA missiles leveled his workplace, this is a lifeline. Receiving his first insurance payment, the 39-year-old sat on his roof with a convenience store beer late into the night.\n\nThe Second Arrow: Matching pension contributions for low-wage youth. Previously, 93 percent of workers opted out of voluntary contributions. President Han introduced a direct \"Matching Reward\" program with a simple slogan: \"You save, we match.\" A-Liang, a recent university graduate scraping by on 34,000 NTD a month, could barely save anything after basic living expenses. Prompted by the new policy, he bit the bullet and opted for a 2 percent contribution. Knowing his 680-dollar deduction instantly becomes 1,360 dollars in his account gave him an unexpected sense of security.\n\nThe Third Arrow: A 100-billion NTD injection into the Labor Insurance Fund. The fund had long operated at a deficit, leaving citizens terrified their pensions would dry up. Han originally promised to inject 100 billion over two years. The war forced a delay, but the postwar recovery has finally provided the capital to fulfill this pledge. The government will allocate 33.3 billion NTD annually over three years, securing the financial future of retirees and sparking widespread celebration across the country."
 CHI.H2.321.a:0 "Taiwan's people strike it rich."
