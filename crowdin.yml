"project_id_env": "CROWDIN_PROJECT_ID"
"api_token_env": "CROWDIN_PERSONAL_TOKEN"
"base_path": "."
"base_url": "https://api.crowdin.com"
"preserve_hierarchy": true

"files": [
  {
    "source": "/localisation/simp_chinese/**/*.yml",
    "translation": "/localisation/%two_letters_code%/**/%original_file_name%",
    "type": "paradox",
    "update_option": "update_as_unapproved",
    "translation_replace": {
      "_l_simp_chinese.yml": "_l_english.yml"
    }
  }
]
