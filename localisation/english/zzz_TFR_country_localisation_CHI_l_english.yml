 CHI_chart_the_course_desc:0 "As the work of rebuilding our homeland comes to a close, the people have recalled the fundamental right they ought to exercise: the right to vote. The war has entirely refreshed the Taiwanese perspective on politics, and every single vote cast will indeed profoundly impact the future of the nation.\n\nIn the Taiwanese political arena, the Kuomintang and the Democratic Progressive Party fundamentally stand as equals. The Kuomintang advocates maintaining ties across the strait so that, at some point in the future, they can launch a counterattack on the mainland and once again fly the Blue Sky, White Sun, and a Wholly Red Earth over China. The Democratic Progressive Party advocates for the regime to settle on this small island in the Western Pacific, maintaining a nation that belongs to the Taiwanese.\n\nMany futures that we previously dared not imagine are now springing up like mushrooms after rain, now that the PDTO has gained the upper hand. When the next January arrives, the people will discover the greatest common denominator of societal consciousness and designate the direction for the future. The Kuomintang? The Democratic Progressive Party? Or perhaps a third option?"
 CHI_future_of_the_roc_desc:0 "Taiwan... no, the Republic of China's performance during the Taiwan Strait War has demonstrated to the entire world our unwavering resolve to defend our free will. In international diplomacy, nations that had previously severed ties with us under pressure from the Chinese Communist Party are beginning to extend a hand of friendship to the Republic of China. As the CCP's international influence wanes, we can finally proudly acknowledge our true national name, formally participate in various international organizations, and embrace the beautiful Blue Sky, White Sun, and a Wholly Red Earth at international sporting events.\n\nNow, we must elect the next presidential candidate who can truly represent the Republic of China. The Democratic Progressive Party, with its Taiwan-centric core, is outside the scope of consideration here. The Kuomintang must now decide which candidate to put forward to unite all pro-Republic factions. Where will this leader take the nation? Will they take up the mantle of Generalissimo Chiang's unfulfilled ambitions, or will they forge an entirely new future?"
 CHI_will_of_the_people_han_desc:0 "While certain candidates put on elitist faces and deliver speeches in front of television cameras, President Han Kuo-yu has long since clocked out and reported to his usual local market for groceries. The neighborhood ladies passing by all greet him enthusiastically, and vendors always slip him an extra bunch of green onions after bagging his vegetables. After finishing his shopping, he swings by his favorite food stall to bring home three bowls of braised pork rice to enjoy with his family.\n\nZero-distance contact with the public is the unique political philosophy Han Kuo-yu insists upon. He has shown the Taiwanese people that politics is not just a comedy routine on television or the internet, nor is it cold and unfeeling spreadsheets and economic data. Rather, it is living down-to-earth, side by side with everyone. At the same time, he has let the public know that when the Taiwanese people are in danger, President Han will absolutely never desert his post! He steps forward during the most difficult of times!\n\nSharing in both joys and sorrows, going through thick and thin together: this is the idealism that Han Kuo-yu stands for!"
 CHI_not_by_chance_inevitable_desc:0 "After his defeat in the 2020 presidential election, Han Kuo-yu never imagined he would once again be nominated by the Kuomintang as their presidential candidate. The people have not forgotten how he left his post as Mayor of Kaohsiung halfway through his term to run for president. However, they also have not forgotten that during the Republic of China's most critical moment of life and death, he did not choose to flee. Instead, he stayed on this land to stand and fall with the people. His diehard supporters remain steadfast in their backing, and centrist voters, exhausted by political mudslinging, are willing to give him a second chance.\n\nWith tears in his eyes, Han Kuo-yu delivers a resounding speech, declaring his resolve to march into the future shoulder to shoulder with the people. He will never run away again. This time, he will absolutely make Taiwan prosperous!"
 CHI_steady_progress_chao_desc:0 ""
 CHI_set_off_together_once_more_desc:0 ""
 CHI_new_power_of_the_era_chiang_desc:0 ""
 CHI_never_forget_original_intention_desc:0 "Ever since patriots founded the Revive China Society in Hawaii, the call for democracy in China has steadily grown. Through the eras of Sun Yat-sen, Chiang Kai-shek, and those who followed, the Kuomintang has weathered countless storms. Yet, we have never forgotten our ultimate ambition: to see the Blue Sky and White Sun shine over all of China, and to see the Three Principles of the People flourish across the Chinese mainland. We will not allow the Communists, who falsely claim to be our successors, to distort these ideals, nor will we allow fascists to slaughter the people of Asia. We must carry out the spirit of Sun Yat-sen and ensure the great revival of the Republic of China!"
 CHI_kmt_election_eve_desc:0 ""
 CHI_choice_of_the_taiwanese_desc:0 "Taiwan is not China's Taiwan! Nor is it Japan's Taiwan! It will certainly never be the Netherlands' or Spain's Taiwan! Taiwan is the Taiwanese people's Taiwan! The Pan-Green independence parties, led by the Democratic Progressive Party, will realize this vision. They will lead us toward true independence, breaking out of the framework of the so-called 'Chinese Nation.' We will step toward true autonomy and live for our own future, rather than living or dying for China's so-called 'Great Rejuvenation.'\n\nWe will choose the Pan-Green independence coalition, led by the Democratic Progressive Party, to strive for Taiwan's independence, rather than the unrealistic ideal of a counterattack on the mainland. And if we encounter extreme circumstances, perhaps we will resort to whatever means necessary."
