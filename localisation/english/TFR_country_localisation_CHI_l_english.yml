 CHI_election_2020: "2020 Taiwanese Presidential Elections"

 CHI_election_2020_desc: "Having endured more than a century of turmoil and uncertainty, the Republic of China now stands at yet another four-year presidential election. As the flow of time recedes history into the past, the people of this island continue to reshape the very meaning of the “Republic of China\" according to their own beliefs and aspirations.\n\nYears of voting have reflected the ever-changing voice of the people. Whether it is the conservative-leaning Kuomintang, or the pro-sovereignty Democratic Progressive Party, each represents a different vision held by the people of Taiwan for building the nation they believe in.\n\nWhile most see the election as nothing more than another small political spectacle, others remain hopeful, believing that this year's presidential election may be the most significant turning point in Taiwan's modern history..."

 Taiwan_will_win: "New Decade of Taiwan's Victory"

 Taiwan_will_win_desc: "The election results came as little surprise. President Tsai Ing-wen secured re-election by a commanding margin of more than three million votes over her opponent! The outcome reflected broad public approval of her administration's performance and approachable leadership style. Coupled with the political impact of the recent Hong Kong anti-extradition bill protests, the Democratic Progressive Party and its political platform have gained the support of a majority of Taiwanese. For many, the election signaled a growing consensus around Taiwan's distinct identity and its future direction."

 four_persistences: "Four Commitments"

 four_persistences_desc: "\"Commitment to a free and democratic constitutional system; commitment to the principle that the Republic of China and the People's Republic of China are not subordinate to one another; commitment to resisting any infringement upon or annexation of our sovereignty; and commitment to ensuring that the future of the Republic of China (Taiwan) shall be decided in accordance with the will of all the Taiwanese people.\"\n\nThese are President Tsai Ing-wen's Four Commitments, which serve as the cornerstone of her administration's cross-strait and foreign policy strategy. In the Democratic Progressive Party's view, previous Kuomintang governments repeatedly diminished the Republic of China's international standing and national sovereignty through their approach to diplomacy while allowing increasing pressure from the People's Republic of China. The Four Commitments embody the DPP's determination, and that of its supporters, to safeguard the nation's sovereignty, democratic institutions, and fundamental freedoms." 

 Support_Black_Bear_Academy: "Support Kuma Academy"

 Support_Black_Bear_Academy_desc: "Ever since World War One, total war has become the status quo of all modern conflict. The front line is no longer limited to where armies make contact; logistics, arms production, and propaganda strategies have also become part of the battle.\n\nTo strengthen Taiwan's position against the second largest industrial power in the 21st century, Legislator Shen Po-Yang proposed the establishment of Kuma Academy. The organization aims to provide civilians with emergency battlefield medical training and the skills needed to identify and counter disinformation, helping Taiwanese society become more resilient and better prepared to endure a future conflict."

 forward_planning: "Forward Planning"

 forward_planning_desc: "In 2017, Tsai Ing-Wen initiated a series of plans called the Forward-Looking Infrastructure Development Program (FIDP) that were tailored to modernize Taiwan. It aimed to address long-standing issues plaguing Taiwan, such as low birth rate, environmental pollution, food safety, and uneven urban-rural development. Now that President Tsai Ing-wen is about to enter her second term, there is no need to worry about the Kuomintang interfering with the long-term planning of the FIDP. The second phase of the program can be launched, leaving behind a heritage and prosperous future for the posterity of the Republic of China."

 Continue_transform_justice: "Continue Transitional Justice"

 Continue_transform_justice_desc: "When governments transition from authoritarianism to democracy seek to rectify the wrongs committed under the previous regime, their actions are known as transitional justice.\n\nDespite being free from Chiang Kai-Shek's rule for thirty years, the Kuomintang has consistently hindered victim compensation and rehabilitation efforts. However, with Tsai's recent presidential victory, we are now able to give our predecessors a proper resolution."

 We_are_already_independent_country: "Reaffirm Taiwan's Independence"

 We_are_already_independent_country_desc: "Regardless of how the People's Republic of China attempts to justify its position, one fact remains unchanged: the PRC has never exercised sovereign rule over the island of Taiwan. From this perspective, it possesses no historical basis for claiming legitimate sovereignty over the territory. Accordingly, any hostile action directed against the Republic of China government should be regarded as an act of aggression between two separate political entities, rather than as an internal conflict between rival factions of a single state."

 Responding_the_epidemic: "Combat the Pandemic"

 Responding_the_epidemic_desc: "An outbreak of a previously unknown disease originating in Wuhan, Hubei Province, is rapidly spreading across the globe, posing a serious threat to public health, social stability, and economic activity.\n\nOur nation has now confirmed its first domestic case. If decisive action is not taken immediately, the situation could quickly spiral out of control. The government must mobilize national resources, strengthen the public health system, and maintain social order to minimize the pandemic's impact on the country's overall stability and resilience."

 Coping_with_the_oil_crisis: "Respond to the Oil Crisis"

 Coping_with_the_oil_crisis_desc: "The civil war in Saudi Arabia has destabilized the global oil supply, causing international oil prices to surge rapidly and jeopardize Taiwan's import-reliant energy sector. Failure to resolve this predicament quickly would result in an energy crisis that would disrupt daily life, buckle the economy, and impair national defenses. To prevent the situation from going awry, contingency measures must be implemented immediately to stabilize the fuel supply and buy ourselves time in the face of growing global instability."

 Defense_Strategy_White_Paper: "2020 National Defense Report"

 Defense_Strategy_White_Paper_desc: "The outbreak of the pandemic and the consecutive shocks of the oil crisis have revealed vulnerabilities within Taiwan's national defense and energy systems. Meanwhile, political schizophrenia in the United States has further escalated regional instability and shaken public confidence in Taiwan's national security. To ensure the survival of our nation, we must comprehensively scrutinize and strengthen our national defense strategy to play for time, hedge vulnerabilities, and prepare for potentially more severe crises in the future."

 Taiwan_safe_people_rich: "A Safe and Prosperous Taiwan"

 Taiwan_safe_people_rich_desc: "Han Kuo-yu, presenting himself as an ordinary citizen, rode the wave of popularity across Taiwan and successfully won against Tsai Ing-Wen's re-election bid. The victory of the Kuomintang and Han shows that the Taiwanese people, being exhausted of the DPP's anti-China rhetoric, have placed their trust in Han's pragmatic slogans of peace and safety for Taiwan. Only through Han's administration can the office of president be truly fulfilled!"

 Taiwan_makes_fortune: "Goods Out, People In"

 Taiwan_makes_fortune_desc: "Taiwan can no longer afford to remain trapped by ideological divisions and political infighting. When the economy expands beyond our borders, the people will find new opportunities and a brighter future. By developing international trade, attracting investment, drawing in skilled talent, and engaging visitors from abroad, we can reignite economic growth and allow the market to create new opportunities for Taiwan.\n\nWith the right direction, capital will flow in, people will come, and Taiwan will once again achieve lasting prosperity."

 Expand_intelligence_system: "Expand Intelligence Services" 

 Expand_intelligence_system_desc: "The National Security Bureau must be expanded to integrate fragmented intelligence resources and strengthen both domestic counterintelligence capabilities and foreign intelligence collection.\nIn an era of growing instability and uncertain threats, preemptive risk identification will help the nation respond appropriately before a crisis takes shape."

 Whistleblower_Protection_Act: "Strengthen Civil Rights"

 Whistleblower_Protection_Act_desc: "Civil rights are one of the core principles of Sun Yat-sen's Three Principles of the People, forming a cornerstone of the Republic of China's legitimacy and constitutional order.\n\nEven in times of crisis, the government must ensure that fundamental freedoms are not sidelined. By safeguarding civil liberties under pressure, we can preserve public trust in our institutions and prevent the Republic from straying from the principles upon which it was founded."

 No_distinction_between_big_and_small: "Reshape Cross-Strait Relations"

 No_distinction_between_big_and_small_desc: "The \"1992 Consensus\" has long served as the standard opening point in political dialogue across the Taiwan Strait. Yet the Kuomintang's interpretation of \"One China, with respective interpretations\" has increasingly been ignored, dismissed, or even ridiculed as a slogan meaningful only to the party itself. The Kuomintang must now redefine its cross-strait policy. We should advocate expanding trade, transportation, and communications on the basis of mutual respect and the equal standing of two political entities. By setting aside confrontation, reducing tensions, and pursuing peaceful engagement, we can restore stability across the Taiwan Strait and rebuild a constructive relationship."

 Based_in_Taiwan: "Rooted in Taiwan"

 Based_in_Taiwan_desc: "\"Rooted in Taiwan, Embracing the Mainland, Looking to the World, Conquering the Universe.\" This slogan, proclaimed by President Han Kuo-yu during his campaign rallies, has often been mocked by pro-independence supporters and many politically indifferent citizens alike. Yet for the Kuomintang, it represents far more than a catchy campaign phrase. It embodies the party's vision for the future of the Republic of China and its belief that it carries forward the legacy of Sun Yat-sen. Although the Republic of China may currently find itself in a position of relative weakness, great national aspirations have often begun with bold declarations, much like how the Monroe Doctrine expressed a vision for generations yet to come.\n\nBut before we can dream of conquering the universe, however, we must first begin with the island beneath our feet."

 our_next_step: "Our Next Steps"

 our_next_step_desc: "The 15th presidential election of the Republic of China has come to an end. Whether the Blue Sky and White Sun has once again ascended to power, or democracy has successfully defended its seat, the citizens of the Republic have clearly made their choice at this once-every-four-years crossroads. However, the world today is defined by chaos and volatility. The pandemic raging across China threatens to advance toward Taiwan. National energy lifelines remain dependent on maritime supply routes, while the blade of the People's Liberation Army already points toward our throat. Under these circumstances, our military has been lulled for too long by the comfort of peace and prosperity. Now, as undercurrents surge across the Taiwan Strait, hidden beneath the neon lights of the island's prosperity are crises that no ruler of Taiwan can afford to ignore. We must prepare before the storm arrives and make plans for the events that may soon come."


 NHCC_Expand: "Bolster the CDC"

 NHCC_Expand_desc: "A novel infectious disease originating in a mainland Chinese transportation hub has now spread like wildfire. Taiwan has confirmed its first case of this disease on January 21st, and we must respond cautiously to avert a viral-induced crisis. To prevent an outbreak on the island, professional bureaucrats should have their authority appropriately expanded to perform their duties professionally and fully protect the people of Taiwan."

 Isolate_patient: "Quarantine the Infected"

 Isolate_patient_desc: "Although we attempted to stop the spread at every opportunity, the pandemic has still managed to spread throughout the entire island. China, across the strait, has adopted the method of isolating and monitoring infected individuals to contain the virus. Although this measure will seriously offend and infringe upon the freedom and human rights of others, the rapid spread we're facing gives us no other choice..."

 Issuance_of_triple_coupons: "Tripled Stimulus Vouchers"

 Issuance_of_triple_coupons_desc: "The impact of the pandemic has become a detriment to people's livelihoods and the economy. By issuing stimulus vouchers, consumerism may be stimulated, market confidence could be stabilized, and the rate of economic decline may be slowed."

 Suspension_of_work_and_classes: "Suspend Schools and Workplaces"

 Suspension_of_work_and_classes_desc: "In order to safeguard public health and minimize mass infections, all work and educational activities will be suspended nationwide along with the implementation of school and work closures."

 Buy_vaccines: "Procure Vaccines"

 Buy_vaccines_desc: "According to reliable sources, several countries have taken the lead in developing vaccines. We should purchase some to help us get out of the epidemic as soon as possible."

 Get_out_of_the_epidemic: "Exit the Epidemic"

 Get_out_of_the_epidemic_desc: "We have defeated the virus, and it is time to prepare to return to normal life."

 Develop_own_vaccine: "Develop Domestic Vaccines"

 Develop_own_vaccine_desc: "Due to the uncertain situation around international trade, vaccines have become a strategic resource that all countries vie for. Furthermore, the breakdown of trust in diplomacy and commerce has made it necessary to concentrate our scientific capital in domestic vaccine research. This will give us time in the initiative against the virus."

 island_of_democracy: "Isolate the Island"

 island_of_democracy_desc: "In these extreme circumstances, the nation's borders serve as our first line of defense against the virus.\n\nAlthough self-isolation through the closure of entry points as a whole risks economic stagnation, diplomatic tension, and increased public discontent, allowing the pandemic to spiral out of control can bring about more grave consequences."

 Taiwan_locked_down: "National Lockdown"

 Taiwan_locked_down_desc: "To prevent disaster across the island, the government must take strict measures to preserve Taiwan.\nA full lockdown must be implemented across the island in order to forcibly sever the virus's means of transmission.\nAlthough this may bring society to a near-standstill, hesitation would also inevitably lead to the collapse of Taiwan."


 CHI_taiwanese_independence_dynamic: "Identity Crisis"

 CHI_taiwanese_independence_dynamic_desc: "\n\n\n\n£GFX_CHI_taiwanese_independence_movement_banner\n\n\n\n\n\n\"We have experienced the panic of withdrawing from the United Nations and endured the pressure of severed diplomatic ties time and time again. But the determination of the Taiwanese people to step onto the world stage has never changed.\"\n— Tsai Ing-wen, 2019 National Day Address\n\nSince the Nationalist Government retreated to Taiwan, the Republic of China's actual territory has been confined to the Taiwan, Penghu, Kinmen, and Matsu regions. Initially, due to the presence of mainlanders and the fact that China's legal international status was still represented by the ROC, the self-identity of the Taiwanese people leaned towards China. However, under the Nationalist Government's White Terror policies in Taiwan, the brutally suppressed Taiwanese people gradually developed independence ideologies, continually launching Taiwan independence movements against the ROC Taipei government. Although the KMT lifted the ban on political parties in the later years of President Chiang Ching-kuo, his successor Lee Teng-hui promoted democratization while simultaneously providing another interpretation of the Republic of China, intending to transform it into another China with territory limited to Taiwan, Penghu, Kinmen, and Matsu. The ROC later welcomed the leadership of the native Democratic Progressive Party under Chen Shui-bian and Tsai Ing-wen. The Taiwan independence movement promoted by the DPP angered mainland China across the strait, while also dissatisfying the KMT and the ROC Armed Forces. The Taiwanization policies carried out during the Tsai Ing-wen administration did not construct a brand-new identity; instead, they worsened the already chaotic national identity of the Taiwanese people.\n\nIs the \"Republic of China\" Taiwan, or is it China? The Taiwanese people will make their choice after this long night..."

