 #描述
 CHI_Han_Post_war_desc: "Although the journey has been filled with hardship, at this very moment, all citizens of the nation can cheer together. We have overcome the agony that has plagued us since our defeat in the Civil War, and the Kuomintang has led us to achieve what everyone thought was impossible. The times of unfavorable conditions, disadvantageous terrain, and divided elections are over, as are the days when every domestic and foreign analytic institution predicted our defeat in the Taiwan Strait War. Now, cheer for our victory and for our future!"

 CHI_new_ten_propositions_desc: "The \"Ten Propositions of Colorless Awakening\" was a concept introduced by Tsai Eng-meng, Chairman of the Want Want China Times Media Group, prior to the local elections.\nBased on rationality and pragmatism, these ten propositions offered solutions to the vicious infighting between the Pan-Blue and Pan-Green coalitions, economic hardships, judicial stagnation, and the cross-strait deadlock. Serving as an action program for \"True Rationality and True Love for Taiwan,\" it hoped to guide the government beyond ideological constraints, leading the people out of their predicament toward a better life.\nAt the time, Han Kuo-yu, who was running for Mayor of Kaohsiung, was the first to step forward to support and sign the document. He affirmed its positive impact on modern society and stated that it aligned with his own principles.\nHowever, following the bloody cross-strait war, these propositions must be modified to fulfill their original intent..."

 CHI_lone_tower_of_dragon_desc: "Although the fact remains that both sides of the strait share the same language and ethnicity, the Taiwan Strait War has turned Taiwan into the last bastion of Chinese culture. The People's Republic of China, a political entity holding governing authority over parts of our territory, has completely discarded the spirit and history of Chinese civilization.\nWe must actively protect excellent traditional Chinese culture through the normalization of school curriculums and the subsidization of cultural industries, safeguarding this spark of civilization."

 CHI_sledgehammer_brings_justice_desc: "Deterrence theory is a criminological concept regarding the elimination of criminal motives and the prevention of crime in criminal policy. It suggests that by severely punishing those who have already committed crimes to \"kill the chicken to scare the monkey,\" we can deter others from offending. \"Using heavy punishments in times of chaos,\" the War on Drugs, the three-strikes law, Jessica's Law, and Scared Straight programs are all products of deterrence theory.\n\nThe Kuomintang caucus in the Legislative Yuan has decided to introduce more bills based on this concept, aiming to prevent crime by strengthening law enforcement and increasing the severity of penalties."

 CHI_tranquil_lake_in_the_storm_desc: "Corruption scandals have continuously plagued all levels of the Republic of China government. We must immediately eradicate government corruption by establishing whistleblower mechanisms and amending legal regulations, especially during these turbulent times."

 CHI_one_day_tea_party_desc: "During the Taiwan Strait War, all political parties and factions within the Republic of China demonstrated unprecedented unity.\nPresident Han hopes to sustain this atmosphere and put an end to the ugly state of vicious partisan infighting that often plagues political competition.\nTo this end, President Han plans to hold a semi-public monthly meeting among all party leaders, known as the \"One-Day Tea Party.\""

 CHI_broken_homeland_united_chinese_desc: "Our homeland has been devastated, and the entire nation is mobilizing all its strength for reconstruction. The flames of war have successfully united every community on the island. At the same time, the determination of the Taiwanese people to bravely defend their democracy and home has inspired all Taiwanese and Chinese diaspora overseas. The government has continuously received donations from overseas Chinese, and some have even expressed a desire to naturalize. It seems there is no longer even a need to deliver a speech on unity."

 CHI_cyber_security_managment_act_amendement_desc: "The core objective of amending the \"Cybersecurity Management Act\" is to comprehensively upgrade the nation's digital defense capabilities in response to emerging geopolitical and technological threats. This proposed amendment first establishes the Ministry of Digital Affairs as the central competent authority to integrate cross-ministerial cybersecurity resources. In terms of protection scope, the amendment expands regulatory targets to include critical infrastructure, specific state-owned enterprises, and government-endowed foundations. It explicitly requires specific agencies to appoint dedicated Chief Information Security Officers to elevate the decision-making level. Simultaneously, the new law strengthens the reporting and investigation mechanisms for cybersecurity incidents, granting the competent authority the power to conduct on-site audits and special investigations for major events, while strictly restricting public agencies from procuring or using specific hazardous products that endanger national cybersecurity. Most notably, the amendment drastically increases administrative fines for failing to report or improve according to regulations. By raising the cost of non-compliance, it thoroughly compels public and private sectors to implement cybersecurity protections and responses, building a more resilient national-level joint cybersecurity defense system.\n\nThe Kuomintang caucus has reached a consensus with all parties in the Legislative Yuan to jointly push for the passage of this bill."

 CHI_finish_them_desc: "To modern humanitarians, the law should serve an educational purpose; applying severe punishments to everything could drive criminals to take even more radical actions. These words are not without reason, but past cases show that the effectiveness of rehabilitating inmates is limited. We constantly hear of released convicts returning to society only to commit crimes again. Is this because our rehabilitation policies are flawed? No, it is simply evident that some people cannot change their wicked mindsets. People refrain from committing crimes not merely because they know it is illegal, but because their basic moral compass tells them that harming others is wrong. We must amend our laws to \"isolate\" these criminals from this world as much as possible."

 CHI_reestablish_special_investigation_division_desc: "The Special Investigation Division (SID) of the Supreme Prosecutors Office was once a special unit within the Republic of China's Supreme Prosecutors Office. Structurally modeled after the Central Investigation Department of South Korea's Supreme Prosecutors' Office, its functions aimed to emulate the United States' special counsel system. The SID was established on April 2, 2007, during the tenure of President Chen Shui-bian, specifically to investigate corruption or major economic fraud cases involving high-level central government officials, including the President, Vice President, the Presidents of the five Yuans, and legislators.\nHowever, due to controversies surrounding bribery cases and systemic issues, calls for its abolition arose. After discussions between the ruling and opposition parties and an evaluation by the Ministry of Justice, the Legislative Yuan repealed its legal basis in 2016, and it was officially disbanded on New Year's Day, 2017.\n\nThe Kuomintang legislative caucus has recently discussed a proposal to amend the Court Organization Act to bring back the SID. Following open negotiations, a consensus has been reached. Both ruling and opposition parties will unanimously support a draft that is far more comprehensive than the hastily legislated versions of the past, responding to society's expectations for a clean government."

 CHI_hunt_down_spies_desc: "Although we have won the war and successfully repelled the red threat aimed at our thirty years of democratic development, the hearts and minds of the island remain unsettled. Behind all of this, a faint red shadow still lingers. Therefore, we will expand the scope of political screening to root out those red communist bandits who are deliberately sabotaging our post-war reconstruction efforts."

 CHI_the_flag_is_fluttering_desc: "How was the Song Dynasty able to avoid the civil unrest of military commanders usurping power that plagued the Five Dynasties and Ten Kingdoms? The answer lies in overcorrection. As the saying goes, \"Heavy punishments must be used in times of chaos.\" Amidst an era of global turmoil, we must strike with heavy fists to maintain social stability. Only in this way can we internally consolidate our democratic strength and defend the democratic flag of civilization. Today, our actions are once again allowing the democratic Blue Sky, White Sun, and a Wholly Red Earth flag to flutter high amidst the cheers of our citizens!"

 CHI_Post_war_review_status_quo_desc: "The war is over! We have successfully defended the last legacy of Chinese democratic politics. Although this legacy has seen immense democratic development: from the authoritarianism of the two Chiangs to the eras of Lee, Chen, Ma, and Tsai, successive generations of indolent, negligent, lazy, and corrupt governance have become deeply entrenched ailments. The war completely exposed these cracks that had been carefully glossed over during peacetime. For the sake of the Republic of China's tomorrow, we must eradicate these accumulated malpractices and revitalize our democratic politics."

 CHI_Pork_Rice_desc: "The central government of Taiwan has long favored the north over the south, regardless of which political party is in power.\n\nWhen President Han served as the chairman of the Kaohsiung City Party Headquarters, he once traveled north to register as a candidate for Taipei Mayor. His reason was to demand that the Kuomintang party headquarters pay attention to the south, stating, \"At least give us a bowl of braised pork rice.\"\nThis originally referred to the disparity in election campaign resources between the Pan-Blue and Pan-Green camps, but isn't the same true for local government resources?\nNow, he aims to change this unfair situation and ensure balanced development between the north and the south."

 CHI_Special_budget_desc: "The great affairs of a state lie in sacrifice and war. Seventy-nine years ago, Chiang Kai-shek went into exile in Taiwan; legitimacy was lost, and military discipline was lax. Following a bitter defeat, the Kuomintang under Chiang Kai-shek implemented a series of reforms and competed against the other side of the strait. After the wave of democratization, we also experienced a \"Golden Age.\" Yet today, over thirty years later, our social development has stagnated, and military issues have been laid bare by the war. To change the status quo, President Han Kuo-yu and his staff have formulated an investment plan aimed at promoting Taiwan's social, military, and economic development, striving to eliminate old ailments and open a new chapter for Taiwan."

 CHI_Eleplant_in_room_desc: "Since the Nationalist government retreated to Taiwan, our political system has undergone numerous modifications based on pragmatic factors, gradually becoming more complete. However, those same pragmatic factors have also led to a myriad of systemic flaws. Before the Taiwan Strait War, the Kuomintang and the Democratic Progressive Party were entirely focused on political infighting, intentionally or unintentionally ignoring the many defects within the nation. In the past, there was no shortage of political figures who strived for reform, but they all suffered bitter defeats due to various factors. In an era of massive national reconstruction, it is finally time to properly \"reconstruct\" this country's political system."

 CHI_corruption_desc: "Since the first transition of ruling parties, the Republic of China government has long suffered from severe issues such as black gold politics and collusion with local factions. In the past, former President Lee Teng-hui was forced to employ some unsavory methods to ensure Taiwan's smooth transition to a democratic government. His twelve-year tenure was not enough for him to complete the grand endeavor of both achieving democratic transition and eradicating corruption. Now that we have inherited the nation's future from his hands, it is time to finish what he started."

 CHI_Political_donations_act_desc: "Due to its outdated clauses, our nation's Political Donations Act suffers from a lack of reporting transparency, difficulties in auditing financial flows, and regulatory loopholes created by emerging digital technologies. These political cockroaches exploit loopholes for personal gain. This is no longer ordinary corruption; it can no longer be tolerated. We must strike back with a heavy fist!"

 CHI_expand_control_yuan_power_desc: "Since Dr. Sun Yat-sen established the five-power separation political system, the Control Yuan was supposed to exercise the powers of impeachment, censure, and audit, while possessing investigative authority to supervise all government departments. However, this disaster-ridden nation has consistently failed to allow it to function as intended. Once the situation stabilized, government officials simply acquiesced to this weakened state. It is time to put it back on the right track."

 CHI_negotiate_with_DPP_desc: "The Democratic Progressive Party, abbreviated as the DPP, is the Kuomintang's primary political rival within the Republic of China government. In the past, the two parties engaged in fierce disputes over Republic of China identity and Taiwan's continued existence, and they held massive disagreements on how to deal with our neighbor across the strait. Today, none of that matters. The immediate threat to national security has been temporarily lifted, creating a much larger space for flexible dialogue between the two parties. The nation needs to respond to the rapidly changing global situation with greater efficiency, and we must quickly identify administrative directions that both sides either want to execute or can mutually compromise on."

 CHI_political_concession_desc: "In interpersonal interactions, stubbornly clinging to one's own opinions without knowing how to take a step back will only lead to deadlocks. The same is true in politics. If we want the DPP to assist in passing legislation, it is necessary to make concessions to them within permissible limits. Power plant construction, the electronics industry, and social justice are all areas with ample room for compromise. At the same time, we hope they will offer greater understanding regarding our cultural, educational, and diplomatic policies (primarily concerning the mainland region)."

 CHI_enemys_enemy_desc: "Through multiple rounds of political negotiations, the Kuomintang and the Democratic Progressive Party have achieved a certain degree of cooperation. Faced with unknown malice from China, the infighting between our two parties appears incredibly trivial and ridiculous. There is no need to make such a stark distinction between the ruling party and the opposition. Beyond our internal political stances, the DPP's many opinions must also be carefully considered. Only through joint cooperation can we promote national prosperity."

 CHI_Restore_provincial_government_functons_desc: "Since the downsizing of the provincial government, it has become an expendable institution in our country. However, we now have as many as three provinces under our administration, and the readiness levels of these regions must vary. The restoration of the provincial government is necessary for both national defense and administration. Therefore, we should now begin planning and preparing various measures to adapt to the nation's current situation."

 CHI_reestablish_hainan_province_desc: "Ever since we were driven off the mainland by the communists, our non-mainland zones of control have been gradually devoured by them. First were islands like the Dachen Islands and Yijiangshan Islands, followed by the various islands in the South China Sea. In the end, we were left with only the Kinmen-Matsu region, Taiping Island, and the Pratas Islands. However, with our victory in the Taiwan Strait War, we have successfully recaptured the South China Sea islands previously under their control, namely the Paracel Islands and the Spratly Islands. As our controlled territory gradually expands, the provinces we once \"de-tasked\" and \"streamlined\" must now be restored. To better manage our territories, our \"Hainan Province\" will once again bathe under the Blue Sky and White Sun. Simultaneously, this will serve as the beginning and the ultimate proof to both domestic and international audiences of our unyielding resolve to launch a counteroffensive to retake the mainland!"

 CHI_Establish_local_officials_desc: "With the recovery of our inherent territories, the government is reactivating previously suspended provincial governments one by one. We must now replan the election and appointment of local officials at all levels: province, county, township, village, and neighborhood. To prepare for the many possibilities following future military campaigns, it would be best to also finalize the planning for administrative vacancies in the current \"occupied territories.\" This will ensure that when we eventually reclaim those areas, we do not cause excessive disruptions to the daily lives of our compatriots."

 CHI_restore_government_information_office_desc: "Since ancient times, speech and writing have been the sharpest weapons for scholars and rulers alike. They can make situations appear favorable to the writer and prevent chain reactions across different regions. During its time in power, the DPP privatized, streamlined, or even abolished many official agencies. The Government Information Office was one of them. Since its dissolution, Taiwan's media landscape has descended into chaos, with its credibility sometimes falling below that of independent private creators. Therefore, the Executive Yuan is currently drafting budgets and assigning personnel. Reestablishing the GIO should prove beneficial in untangling the mess within our journalism sector and safeguarding democracy."

 CHI_reform_PTS_desc: "The operational model of the Public Television Service (PTS) is a product of compromise, with board members determined by political party support levels and other methods. However, this has led to severe internal friction. Furthermore, massive budget overruns have drastically increased the difficulty of producing new programs. At this juncture, it is time to extricate PTS from its internal political squabbles and axe some of its less \"suitable\" projects."

 CHI_state_media_transformation_desc: "Since the 1970s, how long has it been since we had a directly affiliated partisan media outlet? Fifteen years? Twenty years? The liberalization of private media allowed Taiwan to take a massive leap in the democratization process. The public is no longer restricted to the reports of the \"Old Three\" networks: CTV, CTS, and TTV. Capitalized commercial competition means that media outlets constantly scrutinize politicians' every move to gain ratings, simultaneously reducing serious politics to something as absurd and ridiculous as a variety show.\n\nIgnorant sheep must be properly guided for society to function normally. President Han is currently preparing his own image documentary. The people have the right to \"correctly\" know who their leader truly is. They will adore him, revere him, look up to him as a role model, and believe that he is the single greatest leader in Taiwan's history, bar none!"

 CHI_low_fertility_rate_desc: "According to statistics, the Republic of China's birth rate has ranked in the bottom five globally for many years. For developed nations, a declining birth rate is an inevitable process, but after the devastation of the Taiwan Strait War, our country lost hundreds of thousands of lives and still saw no signs of a post-war baby boom. Over time, this could deal a devastating blow to the nation. We must implement more pro-natalist incentives, expanding childbirth subsidies, establishing centralized childcare support, and ensuring basic housing to elevate our citizens' willingness to have children."

 CHI_Taipei_childcare_desc: "Taipei City possesses the most generous childcare subsidy policies in all of Taiwan, offering 40,000 NTD for the first child, an additional 5,000 NTD for each subsequent child, along with various transportation subsidies. If we wish to increase the people's willingness to have children, the most immediate reform we can achieve is to ensure the Taipei Model is not merely the highest standard, but rather broadly promoted to become the unified baseline for the entire nation."

 CHI_babysitter_selection_desc: "Past governments failed to place sufficient emphasis on the screening procedures for infant caregivers, leading to recent tragedies such as the Kai-Kai case, the Little Peach case, and incidents of nannies feeding lethal drugs to infants. If the people cannot be guaranteed that their children will be properly cared for while they work hard to make a living, their anxieties will lower their willingness to have children. The government must strengthen moral background checks for caregivers and elevate punitive measures to ensure that the future pillars of our nation are never harmed again."

 CHI_End_of_Chaos_desc: "This protracted reform has finally reached a temporary milestone. Although there is still a long road ahead before complete reform is achieved, the remaining time in our term is running out. While we cannot guarantee whether the next president will be able to lead the nation toward a better future, we have already severed the dead knot that has bound this country for years. The reform will now advance steadily on its own momentum."

 CHI_blue_sky_white_sun_never_falls_desc: "I was born and raised here, this is my home land.\n\nI love and protect this land, no one shall insult her.\n\nI listen not to the crafty lies,\nneither do I allow the bandits to swindle.\nWe are unafraid of the wind and waves.\n\nQuickly line up the warhorses, for the holy war is about to begin.\nWe will fight at all cost.\n\nI was born and raised here, this is my home land.\nI love and protect this land, no one shall insult her!"

 CHI_efficient_government_desc: "Efficiency. What is efficiency? Simply put, efficiency is being fast, accurate, and ruthless. To judge any ruler from ancient times to the present, one must first see if their decrees sweep across the nation the moment they are issued. A precise, highly efficient bureaucratic system is often the prelude to a nation's grand symphony of revival. As the victors of a great war, recognizing the absolute importance of efficiency, we will rebuild a highly efficient government system in Taiwan under the leadership of President Han Kuo-yu."

 CHI_Three_Labor_arrows_desc: "The core of the Principle of Minsheng (People's Livelihood), part of the Three Principles of the People established by Sun Yat-sen, the founding father of the Republic of China and the Kuomintang, is to eliminate poverty and care for the rights and welfare of laborers to avoid the extreme wealth disparity brought by capitalism. Following the end of the war, President Han Kuo-yu has revived his original campaign promises, inheriting the spirit of Sun Yat-sen's Principle of Minsheng. He is putting the political mandate of the \"Three Arrows of Labor\" into practice, aiming to fulfill protections for laborers, improve their compensation, and promote social fairness and justice in Taiwan."

 CHI_public_service_variable_pay_desc: "Times have changed. In an era where modernized management systems are sweeping the globe, achieving effective political reform and resolving bureaucratic sluggishness absolutely requires material incentives for institutional personnel. Under the leadership of President Han Kuo-yu, we will continuously overhaul the payroll mechanisms for military, civil, and teaching personnel. Building upon basic salaries, we will introduce modern management concepts such as performance-based pay into the administrative system. This move will not only incentivize public servants to work diligently but also allow the government to promptly weed out the lazy and negligent, thereby reducing government burdens. It is killing two birds with one stone."

 CHI_abolish_one_fixed_one_flexed_desc: "The \"One Fixed, One Flexible Rest Day\" system, touted by the DPP as a so-called \"labor welfare policy\" to \"protect labor rights,\" is practically a pipe dream, completely disconnected from Taiwan's reality. Such a policy has resulted in a \"triple-lose situation\" characterized by skyrocketing corporate costs, declining worker wages, and rapidly soaring prices. Currently, President Han Kuo-yu and his staff have drafted a bill aimed at abolishing this system, thoroughly ending the political toxins of the former DPP administration, and unleashing new vitality for Taiwan's social development."

 CHI_Establish_Taiwan_mining_Corporation_desc: "Taiwan has a rich history of mining and extraction, but due to industrial restructuring and considerations of safety and cost, mining operations have largely ceased today, leaving only non-metallic mineral extraction sites active. During the Taiwan Strait War, the Chinese Communist naval blockade plunged our nation into a severe resource shortage. The government is now considering whether to reactivate these mines. Although domestic yields still cannot meet our baseline demands, they will be able to sustain minimal industrial operations during critical moments."

 CHI_strategic_reserves_desc: "During the Taiwan Strait War, several military factories reported that insufficient resource reserves prevented them from manufacturing more artillery shells and maintenance parts. If the Chinese Communist power projection had not faltered after a single year, and without the immense support from our PDTO allies, the armed forces would have likely faced a situation where they were completely powerless. We must prepare for the worst. Taking advantage of the internal turmoil within the CCP, we will use this period of restructuring to stockpile all necessary raw materials through both purchasing and domestic extraction. Nobody knows if our next conflict with the communists will turn into another eight-year war of attrition."

 CHI_mineral_exporation_desc: "Due to the decline of Taiwan's mining industry, the government's exploration of mineral resources has been limited to academic research and the rare earth elements required for developing our electronics industry. Recent surveys failed to thoroughly explore the island due to technological limitations of the time. Now, we can utilize the latest technology to comprehensively prospect Taiwan's mineral vein reserves, ensuring immediate extraction readiness in the event of future emergencies."

 CHI_emergency_resources_extraction_mechanism_desc: "The government has currently mapped out the general locations of mineral veins on the island of Taiwan. However, due to environmental protection and other various concerns, large-scale extraction remains in the planning phase. For now, mine site selections have been handed over to partnered private enterprises for minimal extraction operations. In times of necessity, an executive order can be immediately issued to restore these mines to their full production capacity."

 CHI_New_generation_education_desc: "Education is a monumental state affair. Without education, there are no citizens, let alone a nation. Previously, the DPP administration pushed an extreme \"De-Sinicization\" educational policy, spearheaded by the revisions of the 99 and 108 Curriculum Guidelines, which poisoned Taiwanese education for eight long years. As the victors of the great war, we must reaffirm one core truth: we are the orthodox successors of Chinese culture. To this end, President Han Kuo-yu and his staff have drafted a bill aimed at abolishing the radically \"De-Sinicized\" 108 Curriculum Guidelines and establishing new standards. We will reclaim the essence of Chinese culture and raise Taiwanese citizens who carry on the true spirit of Chinese civilization."

 CHI_community_drug_prevention_experiment_desc: "Past administrations have strictly cracked down on drug crimes, yet drug-related offenses continue to emerge. Investigations reveal that drug cartels often operate in a decentralized manner, scattered throughout civilian residential communities. Relying solely on existing police forces makes it extremely difficult to apprehend them all in one fell swoop. We can cooperate deeply with the civilian populace to strike at the source or prevent drug crimes from occurring altogether, through reporting suspected transaction areas, promoting drug awareness, and assisting high-risk families."

 CHI_dilingual_education_desc: "Our English curriculum is dreadfully outdated. For most students, their English proficiency stops at basic dictation, which will lead to a severe talent shortage when our nation engages deeply with Europe and America in the future. It is now imperative to overhaul the entire foreign language education system. Rather than fostering the ability to write pedantic essays, it is far more important to strengthen our students' ability to communicate verbally with foreigners."

