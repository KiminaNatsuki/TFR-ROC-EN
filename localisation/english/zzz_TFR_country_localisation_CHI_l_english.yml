 CHI_low_international_recognition_idea:0 "Low International Recognition"
 CHI_low_international_recognition_idea_desc:0 "On the international stage, the two sides of the strait are like fire and water, unable to coexist. We are always the discarded side, and thus, unlike other countries, participating in international organizations is a luxury for our country.\n\nHowever, life will naturally find a way. Whether through regional names or non-governmental organizations, our country can still participate in multilateral diplomacy in indirect ways, although extremely limited."
 CHI_chinese_blockade:0 "Mainland Blockade"
 CHI_chinese_blockade_desc:0 ""
 CHI_silent_dawn:0 "Operation Silent Dawn"
