 Taiwanese_Progressivism:0 "Taiwanese Progressivism"
 Taiwanese_Progressivism_desc:0 "\n\n\n\n\n\n\n£GFX_CHI_ideology_neoliberalism\n\n\n\n\n\n\n\n\n\n§YTaiwanese Progressivism§! is the ideology adhered to by the Democratic Progressive Party (DPP), other Pan-Green parties, and some independents. The DPP is the leader of the Green camp, and its origins trace back to the \"Tangwai movement\" (outside-the-party movement) that began in the mid-1970s. Due to its history of resisting the Kuomintang's political tutelage and White Terror, the DPP regards liberal democracy, political justice, and egalitarianism as its core ideologies. These values were later inherited by the broader Taiwanese progressive movement. Over the years, due to the growing hostility of the CCP, the DPP has also absorbed anti-communist thoughts and advocates for Taiwan to maintain a distance from mainland China.\n\nToday, Taiwanese progressivism advocates various goals, including social freedom and equality, environmental sustainability, LGBTQ+ rights, and Taiwan independence, remaining one of the most prominent movements in Taiwanese politics."
 Taiwanese_Progressivism2:0 "Taiwanese Progressivism"
 Taiwanese_Progressivism2_desc:0 "\n\n\n\n\n\n\n£GFX_CHI_ideology_neoliberalism\n\n\n\n\n\n\n\n\n\n§YTaiwanese Progressivism§! is the ideology adhered to by the Democratic Progressive Party (DPP), other Pan-Green parties, and some independents. The DPP is the leader of the Green camp, and its origins trace back to the \"Tangwai movement\" (outside-the-party movement) that began in the mid-1970s. Due to its history of resisting the Kuomintang's political tutelage and White Terror, the DPP regards liberal democracy, political justice, and egalitarianism as its core ideologies. These values were later inherited by the broader Taiwanese progressive movement. Over the years, due to the growing hostility of the CCP, the DPP has also absorbed anti-communist thoughts and advocates for Taiwan to maintain a distance from mainland China.\n\nToday, Taiwanese progressivism advocates various goals, including social freedom and equality, environmental sustainability, LGBTQ+ rights, and Taiwan independence, remaining one of the most prominent movements in Taiwanese politics."
 Taiwanese_constitutionalism:0 "Taiwanese Constitutionalism"
 Taiwanese_constitutionalism_desc:0 "\n\n\n\n\n\n\n£GFX_CHI_ideology_constitutionalism\n\n\n\n\n\n\n\n\n\n§YTaiwanese Constitutionalism§!, upheld by the Kuomintang (KMT), People First Party (PFP), and some independents, is a localized form of constitutionalism that supports the continuation of the Republic of China, liberal conservative social policies, and moderate relations with mainland China. Originally based on the Three Principles of the People and social conservatism, Taiwanese constitutionalism has adopted more liberal approaches over the years to remain competitive after the lifting of martial law in Taiwan.\n\nToday, the main features of Taiwanese constitutionalism include protectionist economic policies, Chinese nationalism, centrist social policies, and the gradually waning anti-communism inherited from the Chiang dynasty, remaining one of the largest factions in Taiwanese politics."
 loc_taiwanese_liberal_populism:0 "Liberal Populism"
 taiwanese_liberal_populism:0 "Liberal Populism"
 taiwanese_liberal_populism_desc:0 "Taiwanese liberal populism is a variant of liberal conservatism, centered around winning votes by satisfying popular demands, actively providing public services, and improving the livelihood of vulnerable groups.\n\nDue to its excessive focus on winning elections, this ideology is often criticized as \"lacking principles\" and having blurred boundaries. Rather than calling it an ideology, it might be more accurate to call it an electoral strategy."
 loc_taiwanese_reformed_tridemism:0 "Reformed Tridemism"
 reformed_tridemism:0 "Reformed Tridemism"
 reformed_tridemism_desc:0 "The Three Principles of the People—Nationalism, Democracy, and Livelihood—consist of three equally important parts: nationalism, democratic institutions, and social welfare.\n\nEntering the 21st century, traditional Tridemism has revealed its limitations in governing modern society, prompting many to seek a reformed version of it.\n\nCompared to the original version, reformed Tridemism reduces the emphasis on nationalism and instead highlights the expansion of welfare, treating it as the core pillar of modernization theory. At the same time, democratic institutions, as a basic need of the people, are incorporated into a broader definition of welfare, making welfarism the sole focus of reformed Tridemism."
 CHI_Jiang_Wanan_char:0 "Chiang Wan-an"
 Chiang_Kaishek_thought:0 "Chiang Kai-shek Thought"
 Chiang_Kaishek_thought_desc:0 "\n\n\n\n\n\n\n£GFX_CHI_ideology_chiang\n\n\n\n\n\n\n\n\n\n§YChiang Kai-shek Thought§! is a political ideology centered on anti-communist nationalism, national survival, and totalitarianism. It was summarized by his descendant, President of the Republic of China Chiang Wan-an, after witnessing the atrocities of the Chinese army during the Third Chinese Civil War. Its theoretical roots stem from the Three Principles of the People, and it was shaped into a zero-tolerance anti-communist line through the practical experience of fighting communism over a long period during the war. Its adherents view communism as a fundamental threat that subverts the state, dismantles ethics, and destroys social order. Therefore, they advocate using a strong state, a disciplined political party, and military mobilization to thoroughly eradicate left-wing infiltration.\n\nPolitically, it emphasizes the priority of the leader's authority and the party-state system, believing that extraordinary times require extraordinary measures to maintain unity and stability. Thought, education, and journalism are seen as part of a silent war, necessary to prevent class struggle and atheistic ideologies from eroding the foundations of society. Economically, it strongly emphasizes high state intervention, using a wartime system to ensure that resources are concentrated and serve the anti-communist war and national defense construction.\n\nSocially, it combines Confucian ethics, nationalism, and moral belief, attempting to use traditional order to counter the revolutionary mobilization of communism. Its goal is to ensure that the Republic of China, or the Chiang family, is not subverted or replaced in the struggle for survival."
