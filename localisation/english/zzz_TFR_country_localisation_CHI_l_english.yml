 CHI_taiwan_war_category_desc:0 "§RPrimary Objectives§!:\n\n§YTaipei§!: [GLOBAL.get_Taipei_status_PDTO]\n§YTaichung§!: [GLOBAL.get_Taichung_status_PDTO]\n§YKaohsiung§!: [GLOBAL.get_Kaohsiung_status_PDTO]\n§YHualien§!: [GLOBAL.get_Hualien_status_PDTO]\n\n§RSecondary Objectives§!:\n\n§YKinmen§!: [GLOBAL.get_Kinmen_status_PDTO]\n§YPenghu§!: [GLOBAL.get_Penghu_status_PDTO]\n§YOkinawa§!: [GLOBAL.get_Okinawa_status_PDTO]\n§YSenkaku Islands§!: [GLOBAL.get_SenkakuIslands_status_PDTO]\n§YHong Kong§!: [GLOBAL.get_Hongkong_status_PDTO]\n§YShenzhen§!: [GLOBAL.get_ShenZhen_status_PDTO]\n§YXisha Islands§!: [GLOBAL.get_XishaIslands_status_PDTO]\n§YCentral Spratly Islands§!: [GLOBAL.get_CCPSpratlyIslands_status_PDTO]"
