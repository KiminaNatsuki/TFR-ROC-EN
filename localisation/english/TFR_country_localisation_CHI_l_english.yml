 CHI_TaiHai_dynamic: "Taiwan Strait War"

 CHI_TaiHai_dynamic_desc: "Since the War of Yiwei (1895), Taiwan has once again suffered a massive invasion. The flames of war from the past had long become mere words in history textbooks, but now, artillery fire falls upon the cities once more, and air raid sirens have become a part of people's daily lives.\n\nAfter the outbreak of the war, the PLA launched a massive missile strike against the island of Taiwan, severely bombing ports, airports, transportation hubs, and industrial facilities. This was immediately followed by a large-scale amphibious landing and airborne assaults. From the northern metropolises to the southern ports, from coastal towns to mountain shelters, the entire society was forced to transition into a wartime state in a very short period.\n\nThis is a war that generations of Taiwanese have never truly experienced. Countless families have been torn apart, missiles have left terrifying scars on the cities, factories have halted, transportation has been cut off, and countless ordinary people have been pushed into the abyss of war. Medical personnel are working in overloaded hospitals, workers are trying to restore damaged production lines, volunteers are navigating between shelters and disaster areas, and the National Armed Forces are defending every inch of land amidst the sound of gunfire and artillery.\n\nOne hundred and thirty years ago, Taiwan lost its freedom in the face of overwhelming military power, and history seems poised to repeat itself. But this time, we are no longer a poorly equipped and isolated democratic country. We have long possessed stable institutions, a powerful military, and reliable allies.\n\nIn the past, the Taiwanese people took up arms to resist the invaders even when they knew it was impossible to win. Now, everyone should understand:\n\n§RTaiwan will never bow to the invaders!§!"

 CHI_thenationisinperil: "An Island in Peril"

 CHI_thenationisinperil_desc: "The shadow of tension that has long hung over the Taiwan strait has stirred into a storm of conflict. Military actions from across the strait are no longer just threats and drills. Missiles, fighter jets, and fleets are now actively threatening our homeland. As reserve mobilizations and combat deployments are initiated simultaneously, our regular way of life has turned into a scramble for our livelihoods. This is no longer a matter of diplomacy and politics; it is a test of survival and willpower. In this time of national crisis, there is no room for division or hesitation.\n\nOnly unity and determination will strengthen us to hold the ground beneath our feet."

 CHI_Anticommunist_determination: "Anti-Communist Determination"

 CHI_Anticommunist_determination_desc: "For a long time, the two sides of the strait have maintained a fragile balance between opposition and exchange. However, with the outbreak of the communist invasion, this balance has been shattered. Where there was once warmongering for a \"reunion,\" there is now blood on our shores.\n\nLet it be unmistakable — we will defend our home, we will never waver, and we shall show our determination to the world."

 CHI_Recall_conscripts: "Call of the Conscripts"

 CHI_Recall_conscripts_desc: "As the situation deteriorates rapidly, our standing forces lack the manpower to meet full combat readiness requirements. We will recall conscripts who have completed their service and returned to civilian life. Having already received complete basic military training, these reservists are the fastest way to replenish our combat power.\n\nThe government will activate an emergency recall mechanism to notify eligible reservists to return to their units for retraining and reorganization, allowing them to rapidly deploy to various defense assignments."

 CHI_National_Spiritual_Mobilization: "A New Spiritual Mobilization Movement"

 CHI_National_Spiritual_Mobilization_desc: "As the flames of war approach our homeland, military preparation alone is far from enough. What will truly carry the nation through this crisis is the will and action of its citizens. The government will utilize public advocacy, organization, and social mobilization to build a national consensus on defending the homeland, enabling civilian forces to play a key role in logistical support, civil defense, and information transmission. At this moment, every citizen is a part of the national line of defense."

 CHI_Temporary_formation_number: "Establish the All-Out Defense Mobilization Agency"

 CHI_Temporary_formation_number_desc: "The concept of \"All-Out Defense\" was recorded thousands of years ago in the Guanzi:\n\"When the ruler and the people are one, the state defends the state, and the people defend the people.\" National defense is not the responsibility of a few, but rather the collective responsibility of the entire populace.\n\nWith recent technological advancements and the introduction of new forms of warfare, the responsibility of safeguarding the nation has outgrown the armed forces alone. The people must also shoulder this burden through the doctrine of \"All-Out Defense.\" To implement this policy, the Presidential Office has instructed the Ministry of National Defense to establish the All-Out Defense Mobilization Agency. With the primary purpose of demonstrating the government's determination to promote all-out national defense, the agency focuses on three major goals: unifying reserve and mobilization systems, integrating standing and reserve forces, and ensuring cross-ministerial cooperation. Only by putting \"All-Out Defense\" into practice can we build a formidable defense for our island. We won't start a war, but we will end it and show everyone our unwavering will to fight for our nation."

 CHI_Strengthen_coastal_defense: "Reinforce the Coastline"

 CHI_Strengthen_coastal_defense_desc: "With threats emerging from the sea, our long coastline is both a natural barrier and a potential vulnerability. Should the communists attempt an amphibious landing, we must immediately form a tight defensive on our shores. To strengthen coastal defense networks, we must integrate our army, civilian militias, navy, and air forces in order to counter any beachhead assaults. As long as our coastline is within our hands, we will retain the initiative in Taiwan's defense."

 CHI_Not_step_back: "Persist For Our Freedom"

 CHI_Not_step_back_desc: "Looking back, the National Revolutionary Army suffered consecutive defeats in the Chinese Civil War before finally retreating to Taiwan, preserving the last free territory of the Republic of China.\n\nToday, the shadow of history once again hangs over the strait. Military pressure from across the strait is no longer mere intimidation; it is actively closing in on our homeland. If we yield again, there will be nowhere left to fall back to.\n\nWe will retreat no further."

 CHI_Fight_to_the_death: "Fight Till the Last"

 CHI_Fight_to_the_death_desc: "In the Chinese civil war, thousands of our finest troops were buried in the North China Plain following the Three Major Campaigns. Chiang Kai-shek was forced to retreat to Taiwan with the remnants of his shattered army, hoping to one day launch a successful counteroffensive and reclaim the mainland.\n\nBattered by the times, the Republic of China gradually accepted reality, turning its focus to cultivating a land it had once viewed as a remote frontier. As the bonds between the Republic of China, the Kuomintang, and the Taiwanese people deepened, the nation rediscovered its mission on this tiny island.\n\nNow faced with the same adversary from all those years ago, we have nowhere left to retreat. But the Republic of China is no longer the beaten, unstable hound it once was. Even when we face our own Goliath of the Chinese Communists, we will not hesitate to hurl stone after stone like David...\n\n\n§R...until the very end.§!"

 CHI_Requesting_material_assistance_from_allies: "Request Allied Material Aid"

 CHI_Requesting_material_assistance_from_allies_desc: "The moment the dictatorial Chinese Communist Party declared war upon us, the PRC's nature as an aggressor was laid bare before the international community. But the Republic of China is different. We are a nation of freedom and democracy, and ours is a righteous war to defend our homeland. As the world recognizes the true face of the communist regime, the Chinese government begins to face unprecedented sanctions. Meanwhile, our friends in Japan and Europe are willing to extend a helping hand. They know exactly what it would mean for a free world, a world now without America, if China were allowed to breach the First Island Chain. Therefore, we may call upon their aid.\n\nA just cause finds many allies; an unjust cause finds few."

 CHI_Remove_old_equipment: "Uncover Old Stockpiles"

 CHI_Remove_old_equipment_desc: "Even if not judged by international standards, Taiwan's military equipment can hardly be considered good. Volunteer personnel constantly complain about their active-duty weapons: time-consuming maintenance, mismatched equipment logs, and even helmet liners going unwashed for years are the norm. Let alone the weapons and ammunition piled up in warehouses.\n\nBut our forces have no choice now. Current stockpiles can only guarantee a sufficient supply of T91 rifles and Kestrel rockets for our volunteer troops. The remaining second-line units have to step onto the front lines armed with heavy T65 rifles and Type 66 rockets. While these armaments may struggle to penetrate communist armored units head-on, we must expend every measure to counter the storming our beachheads."

 CHI_Strategic_Traffic_Control_Center: "Strategic Traffic Control Center"

 CHI_Strategic_Traffic_Control_Center_desc: "The rekindled flames of war now rise over the Taiwan Strait, making the prospect of a normal life impossible in the short term. Our people must bid farewell to seventy years of peace and accept the reality of an unknown life in wartime. For the sake of military deployments and public safety, we will establish traffic control centers to restrict civilian transit. Though an infringement on personal liberty, such temporary wartime measures are necessary when faced with the prospect of communist rule should they emerge victorious.\n\nBetween a temporary loss of freedom and a permanent one, we all know which to choose."

 CHI_Coordinating_Allied_Bombing_Operations: "Coordinate Allied Bombing Campaigns"

 CHI_Coordinating_Allied_Bombing_Operations_desc: "Our calls for aid have been answered. The allies of the Republic of China stand with us, fighting together for the free world against the red devils of the Chinese Communist Party. The joint air forces of Australia and Japan have already deployed bombers targeting communist naval and ground units, and the Republic of China Air Force will assist them in striking down the arrogance of the enemy forces. Though it will be extremely difficult for our air force to contest air superiority against the People's Liberation Army, our allies have promised to aid our aerial operations. With the support of their powerful air wings, our air force will have the capability to fight the communist air force toe-to-toe.\n\n§BShouldering the fate of the nation, forever defending the endless skies.§!"

 CHI_Defend_Taiwan: "Fortify the Island"

 CHI_Defend_Taiwan_desc: "What we are defending is a small but mountainous island. Despite this, it carries the lives, memories, and the voices for twenty-three million people.\n\nFacing military threats from across the strait, this is no longer just a dispute over regimes or historical entanglements; it is a fundamental challenge to our very way of life. Although Taiwan may have limited resources and little land to offer, we understand all the more clearly the cost of losing.\n\nThe government will fully integrate national defense, civil defense, and social resilience, turning every city, every mountain range, and every community on this island into a line of defense for freedom.\n\n§RWe are not fighting for politicians; we are fighting to hold onto the land we call home.§!"

 CHI_Taiwan_the_Bravest: "Taiwan the Bravest"

 CHI_Taiwan_the_Bravest_desc: "Even as the threat approaches, the people of Taiwan have never been more courageous. From cities to rural towns, from the youth to the elderly, people across society are spontaneously volunteering for support and preparation efforts, displaying an astounding level of unity.\n\nThis strength comes not from empty slogans, but from a deep love for our homeland, a cherishing of freedom, and a profound trust in one another. Even under the pressures of war, the people are proving through action that Taiwanese can rely on each other and share this burden together.\n\nLet them witness the unity and fighting spirit of the Taiwanese people."

 CHI_Mobilize_police_force_to_maintain_order: "Mobilize The Police Force"

 CHI_Mobilize_police_force_to_maintain_order_desc: "In peacetime, the heavy responsibility of internal security falls to the Taiwanese police. From patrol officers to rapid response units, layers of specialized departments form the cornerstone of Taiwan's public safety. Legislators have often jokingly referred to the police as the \"Second Army,\" but this is a misconception. Even in wartime, maintaining social order still relies on police support. Beyond simply arresting criminals, the police can also prevent communist forces from striking at our social order and military morale."

 CHI_Wartime_normal_system: "Wartime Normalcy"

 CHI_Wartime_normal_system_desc: "As Taipei City Councilor Miao Poya once explained, \"Not everywhere is the frontline.\" Even if Kinmen and Matsu were invaded by the People's Liberation Army, people on Taiwan could still go about their daily lives. Historically, during the Eight-Year War of Resistance or the Chinese Civil War, teachers and students in the rear still attended school normally. If this was true for wars fifty years ago, it goes without saying for modern warfare.\n\nEven if the invasion comes to Taiwan, residents on the main island will not be heavily impacted. Work, school, and public services will continue to operate normally. We will reassure the public and not declare any state of emergency or martial law at this time. In a conflict such as this, only cooler heads will prevail."

 CHI_Martial_law_declared: "Declare Martial Law"

 CHI_Martial_law_declared_desc: "For many Taiwanese, the words \"martial law\" carry heavy historical memories and deep-seated unease. The shadow of that era makes society exceptionally sensitive to any form of power centralization.\n\nHowever, with the flames of war approaching, maintaining social order has become a top priority. Although the government must make a difficult trade-off between security and freedom, these temporary control measures will ensure that we are able to properly defend ourselves.\n\nWe are not trying to re-visit our past. No, this is an extraordinary decision made in an extraordinary time to protect this island. Once the crisis has passed, everything shall return to normal."

 CHI_Arresting_traitors: "Hunt Down Collaborators"

 CHI_Arresting_traitors_desc: "While we focus on the external threat of communist invasion, we must also remember the enemy within our borders. Intelligence reports indicate that there are rebel groups actively working with the communists to undermine public morale and gather intelligence.\n\nAlthough this \"Fifth Column\" may not wear the enemy's uniform, this enemy can cause more destruction than a frontal assault. To counter this threat, the government must launch a comprehensive crackdown on the subversives. By integrating our intelligence, policing, and security systems, we can quickly find and shut down suspected collaboration networks.\n\nDespite the dangers of these methods, we must make a choice for our survival. Even the strongest defense will be rendered meaningless if we collapse from within."

 CHI_Inciting_democracyactivists_withinChina: "Launch Cognitive Warfare Operation"

 CHI_Inciting_democracyactivists_withinChina_desc: "Under the shadow of war in the Taiwan Strait, the battlefield is not just confined to the strait and the airspace. What truly shakes the foundations of the CCP regime are often the voices that have long been suppressed but have never disappeared.\n\nSince the world-shocking movement of 1989, pro-democracy activists within China have walked a long and arduous path. From the shouts in the square to the struggles of exile abroad; from the faint appeals on the internet to the repeated suppression and silencing—their existence has always reminded the world: under a high-pressure regime, there are still those who pursue rights and dignity.\n\nOver the decades, surveillance has become increasingly strict, the space for free speech has repeatedly shrunk, and the crevices of civil society have been squeezed time and again. Many have paid the price of their freedom, careers, and even families, just to protect a spark of their ideals. This long-accumulated dissatisfaction and exhaustion has not dissipated; it has only been forced into hiding.\n\nIn the context of full-scale confrontation, we will use public opinion and symbolic support to amplify these suppressed voices, allowing them to gain more attention and understanding in the international community.\n\nThis is not direct intervention, but rather a way for the outside world to see the chapter that has not yet been concluded by history—forcing the opponent to consider issues of internal stability and legitimacy while deploying forces externally.\n\nWhen a regime must simultaneously face external warfare and internal questioning, its resources and attention will inevitably be divided.\nThose who have never abandoned their convictions since 1989 may not be able to change the situation immediately, but their very existence is a continuous restraint.\nBeyond the artillery fire, historical memories and unfulfilled demands are still waiting to be heard once again."

 CHI_Frogmen_infiltrate_Fujian: "Infiltrate Fujian"

 CHI_Frogmen_infiltrate_Fujian_desc: "When the strait transforms into a battlefield, the waters beneath become a silent front line.\n\nPinpointing key targets, planting sabotage devices, disrupting radar and communications, and interfering with supply logistics—these are all missions that fall on the 101st Amphibious Reconnaissance Battalion, otherwise known as the Frogmen. Their goal is to sow uncertainty and panic in the enemy's rear before an offensive even begins.\n\nFujian's coast serves as a staging ground for the adversary's amphibious invasion. Disrupting their tempo and undermining their preparations—even if only by a few days—could be enough to tip the scales of the entire war.\n\nBeneath the waves of the strait, the outcome is being quietly rewritten."

 CHI_Protect_the_homeland: "Defend Our Home"

 CHI_Protect_the_homeland_desc: "Since democratizing in 1996, the democratic system has facilitated countless peaceful transitions of power on Taiwan. Yet, the shadow cast from across the strait has only grown darker. With external pressure mounting, this war is no longer just a military conflict; it is an all-or-nothing test of Taiwan's decades of development.\n\nFrom democratic transition, to core player of the global supply chain, and finally to survival amongst international isolation, every step Taiwan has taken has been arduous and deliberate. The oppression of the martial law era, the blood and tears of the democratization movement, the growing pains of economic transformation, and the struggle for diplomatic space have all become the shared memory of our society today.\n\nThis island exists not because it is powerful, but because it is free.\n\nWe possess the right to vote, the right to free speech, the right to a diverse society, and the right to choose our way of life.\n\n\"Defending our homeland\" is not merely a military slogan; it is the manifestation of the public's will.\n\nFactories, ports, hospitals, and loyal communities all work in unison stabilize the rear. Every part of our society has become apart of the defense.\n\nAs artillery fire approaches, the Taiwanese people will answer with their history and their will:\n\nThough we are small and destitute, we will fight to choose our own path."

 CHI_Onelifeonthesameisland: "§3One §GIsland, §WOne §RDetermination§!§!§!§!"

 CHI_Onelifeonthesameisland_desc: "We have done it. The Republic of China has survived through the crucible of this war. When military experts around the world believed we could not hold out for even three months, the stubborn resistance of our soldiers proved otherwise. Now, the Chinese Communist Party's blitzkrieg plan to rapidly annihilate Taiwan has utterly failed. As the People's Liberation Army's offensive gradually stalls and international sanctions strangle the chinese economy, the prospect of a communist victory grows ever more bleak. When public resentment boils over across the mainland, that will be our moment to celebrate victory!\n\nMay our §3Blue Sky§!, §WWhite Sun§!, and a §RWholly Red Earth§! fly forever in the clear skies!"

