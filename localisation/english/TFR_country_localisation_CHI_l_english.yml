#{重建國策描述
 CHI_Emergency_reconstruction_begins_desc: "The victory in the Taiwan Strait War has allowed us to show the world the Republic of China's determination to defend its homeland, but the arduous challenge of post-war reconstruction now lies before us all. The flashes of missiles and the roar of artillery have only just faded from the ruins of Xinyi District. Many citizens are still living in difficult conditions as they wait for their homes to come back to life.\n\nWe cannot remain in the shadow of this disaster. The Office of the President is in close consultation with construction companies, led by Asia Cement, to jointly plan a concrete blueprint for rebuilding Taiwan. Important infrastructure tied to people's livelihoods, such as power grids, water purification plants, and hospitals, will be prioritized for reconstruction. We will also coordinate various units of the armed forces to join the repair and reconstruction efforts. We will do our utmost to restore clean water and stable power supplies for the public, allowing everyone to return to a normal life as quickly as possible."

 CHI_Guarantee_basic_food_and_clothing_desc: "Before the war began, Taiwan's food self-sufficiency rate hovered around a mere 30%. The ensuing conflict has driven that figure even lower, and the Chinese navy's blockade has left civilian food reserves critically depleted.\n\nSimultaneously, artillery bombardments have reduced coastal homes to structurally unsafe ruins, leaving many citizens displaced.\n\nWe must mobilize all domestic disaster relief efforts. We will open every available emergency food stockpile and requisition community centers and other large facilities to house refugees. We absolutely cannot allow a single citizen to go hungry or freeze. If necessary, the government will dip heavily into our foreign exchange reserves to purchase supplies!"

 CHI_Post_war_personnel_issues_desc: "The Taiwan Strait War may be over, but the real challenge is just beginning. A full-scale war lasting months or even a year has forced the society of the Republic of China to pay an incalculable price. Huge numbers of active-duty troops, reservists, temporarily mobilized personnel, and local defense forces now simultaneously face the problems of demobilization and societal reintegration. Many are returning home bearing the trauma and exhaustion left by the war.\n\nThe armed forces' current personnel and reserve systems struggle to handle such a massive post-war force. Unit structures across the country are in disarray and equipment is scarce, leading to inconsistent training standards. Some mobilized units even remain in a semi-wartime state. Meanwhile, public opinion has begun to question whether the country still needs to maintain such an enormous reserve force.\n\nThe Kuomintang and the Democratic Progressive Party are fiercely divided over the future direction of national defense. One side advocates retaining and reforming the reserve system to prepare for potential future conflicts. The other side believes the country can no longer afford a massive mobilization system, arguing that resources should be directed toward building a tech-oriented and professionalized military.\n\nRegardless of which path is chosen, one fact can no longer be denied: the military system of the Republic of China will be thoroughly transformed by this war."

 CHI_Emergency_repair_infrastructure_desc: "During our defense against the communist invasion, portions of our infrastructure were targeted by missile and artillery strikes, and roads and bridges were intentionally or forcefully destroyed.\n\nWater facilities, power grids, transportation systems, schools, and hospitals all suffered varying degrees of damage, though fortunately, they can still maintain the basic functioning of society.\n\nWe must consolidate all intact or partially damaged infrastructure across the country, reinforcing them or conducting emergency repairs to buy time for complete reconstruction in the future."

 CHI_Request_international_assistance_desc: "For years, humanitarian organizations large and small have operated across the most war-torn and chaotic regions on Earth: the Middle East, Africa, and Yugoslavia. This system functioned under the protection of UN forces, allowing the Taiwanese people to contribute their small part to help refugees displaced by conflict.\n\nTaiwan never imagined that one day we would be the ones in need of help. Transport ships flying the Red Cross from their masts are sailing into the still-damaged Port of Kaohsiung, and the Orbis Flying Eye Hospital has touched down on a reserve runway in Pingtung. Goodwill and support from around the globe are pouring into Taiwan. They do not ask about skin color, race, or gender; they only know that their fellow human beings are in need, traveling thousands of miles to aid refugees they have never met.\n\nAsking for help is no cause for shame. To any organization or individual willing to offer assistance, our doors will always remain wide open!"

 CHI_Priority_to_residential_electricity_desc: "An aging power grid, the bombardment of war, and an incomplete transition in our power generation system have severely crippled post-war Taiwanese society. Daily life seems to have reverted to the Qing Dynasty, back before the island was fully electrified.\n\nIn the pitch-black nights, people sparingly use candles and flashlights for illumination. Young children find themselves captivated by a beautiful night sky free of light pollution, and strolling in the moonlight may seem romantic for couples, but this is merely finding joy amidst hardship. Just imagine the horror of summer without air conditioning, or winter without heating.\n\nThe government is urgently coordinating with Taipower to mobilize every available maintenance technician to repair the grid. We are contacting manufacturers to requisition generators of all sizes and instructing factories to maintain only the absolute minimum level of production. Aside from critical facilities, every megawatt saved will be dedicated to restoring our people's normal way of life!"

 CHI_Temporarily_reserve_military_personnel_desc: "After enduring a year of bloody warfare across the Taiwan Strait, the ruling Kuomintang government has come to the profound realization that the nation can no longer rely on an outdated and inefficient reserve system. Facing an increasingly severe international situation and the potential for future full-scale wars, the Legislative Yuan has passed the third reading of amendments to the *Ministry of National Defense Organization Act* and the *All-Out Defense Mobilization Agency Organization Act*, officially initiating a comprehensive reform of the reserve system.\n\nThe new system reorganizes reserve units, previously mobilized only in wartime, into a normalized local defense force modeled after the US National Guard. These forces will fall under the jurisdiction of county and city reserve commands. All enlisted personnel must return to base one weekend a month for combat readiness training, participate in educational call-ups and major annual exercises, and immediately respond to mobilization in the event of natural disasters, major crises, or the outbreak of war.\n\nThis initiative aims to establish an all-out defense force capable of \"disaster relief in peacetime, combat in wartime\" to counter inevitable future threats. According to assessments by multiple senior strategic experts, the next large-scale conflict could erupt within five to ten years, and the Republic of China must begin preparations now."

 CHI_Demobilized_reservists_desc: "After enduring a year-long bloody conflict, the armed forces and senior government officials have gradually realized that while the large-scale reserve mobilization system provided a massive source of manpower, it also exposed critical flaws such as inadequate training, chaotic command structures, equipment disparities, and wasted resources. Countless mobilized reservists have been left physically and mentally exhausted by prolonged combat and frequent call-ups. Furthermore, the economic strain of post-war reconstruction makes it difficult for the country to sustain such an enormous mobilization apparatus.\n\nFollowing a joint assessment by the Ministry of National Defense and the Executive Yuan, the government has officially announced the downsizing and gradual demobilization of the wartime expanded reserve units. Limited resources will be concentrated on building up the all-volunteer standing forces and investing in next-generation military domains, including unmanned vehicles, cyber warfare, electronic warfare, and precision strike capabilities. The ruling authorities emphasize that the Republic of China will no longer pursue \"human wave mobilization,\" but will instead forge a \"small but refined, small but strong\" modernized armed force.\n\nThe new national defense strategy will center on high-tech defense, regional rapid reaction forces, and civil disaster prevention systems. It aims to counter future threats through highly professionalized and digitized combat capabilities, rather than relying on traditional large-scale reserve mobilization. This marks a paradigm shift in the Republic of China's national defense doctrine, moving officially from an era of total mobilization into a new age of technological warfare."

 CHI_Repair_Taoyuan_Airport_desc: "Taoyuan Airport is our nation's international aviation hub, traditionally handling between 47.8 and 48.6 million passengers and 2.5 million metric tons of cargo annually. However, portions of its runways have been destroyed. While such \"minor scratches\" do not hinder military operations during wartime, they constitute unacceptable and severe damage for civilian aviation. We must gradually restore the capacity of Taoyuan Airport and reclaim our aerial logistics capabilities."

 CHI_Reopening_Kaohsiung_Port_desc: "The Port of Kaohsiung is our nation's largest trade port and a crucial core hub for Asian trade, boasting a maximum annual throughput of nearly one hundred million metric tons. It was also one of the most fiercely contested sites during the communist landing operations. Now, we must restore its pre-war functionality, reconnect it with the world, and reestablish its status as the core hub of East Asian trade. This will mark the starting line for our national reconstruction and economic revival."

 CHI_Ending_wartime_economic_desc: "Through the joint efforts of the Taiwanese people and assistance from around the world, daily life is gradually returning to normal. Although things are not quite back to how they were before the war broke out, the heavy hand of government control is no longer needed. The free market will allow the torn wounds of our economy to heal over time. Soon, people will once again be able to freely purchase whatever goods they need from store shelves. Everything from light manufacturing to high-tech industries will resume operations, and everyone can finally return to their old way of life.\n\nOnly this time, a tea egg might cost eighteen NT dollars."

 CHI_MilitaryCivilian_cooperation_reconstruction_desc: "During peacetime, the armed forces could always be seen working tirelessly at the sites of natural disasters. They shed their sweat to help victims rebuild their homes, clearing debris and erecting emergency shelters.\n\nThe machinery skills mastered by certain branches, such as the combat engineers, are incredibly useful even in the civilian sector, and there are tens of thousands of these soldiers on active duty alone. If we temporarily reassign these skilled soldiers to serve as instructors across various units, we could rapidly organize a massive engineering force.\n\nNow that the red regime across the strait has been repelled and will not be taking further action for several years, we have the capacity to mobilize nearly all our soldiers to help the residents of war-torn areas rebuild their homes."

 CHI_Mobilizing_civil_society_groups_desc: "In the past, we frequently mobilized the armed forces to participate in disaster relief for floods and earthquakes. However, the red threat across the strait remains a massive peril to us; leaving it unchecked could lead to irreversible consequences.\n\nFortunately, public enthusiasm for participating in charitable activities has surged in recent years. The decades of unwavering dedication by the Taiwanese people have finally crystallized into a dense social safety net. Through this net, every vulnerable group in our society will receive immediate assistance. By relying on Tzu Chi's massive medical system, the Taiwan Fund for Children and Families' professional support for disadvantaged children, and the Eden Social Welfare Foundation's dedicated care for the disabled, we will ensure these people escape the trauma of war and reintegrate into daily life."

 CHI_Connecting_lifelines_desc: "Repairing the airports, reopening the ports, and connecting them all with brand-new asphalt roads. From north to south, and east to west, we are laying a solid foundation for our national reconstruction!\n\nWe have cleared the vital arteries of our transportation network. The lifeblood of logistics is pumping once more, and the oxygen of goods is flowing throughout the recovering body of Taiwan. Our beloved island will rise again!"

 CHI_Surviving_disaster_desc: "Looking back over the past four hundred years, Formosa has bobbed up and down upon the winds and waves of history. This tiny island never truly had the chance to grasp its own destiny. The Dutch, the Han Chinese, the Japanese, and the Han Chinese once again. No matter who was at the helm, most people could only sway with the ship, praying they would not become the next victim swept away by the tide. But this time, as the red storm dissipates, the Taiwanese people find that they have survived. They are doing their utmost to repair this little boat named the \"Beautiful Island,\" setting sail toward an unknown tomorrow..."

