 Pacific_War: "The Titanic Sinks in Panic"

 Pacific_War_desc: "The power that long maintained order in the Pacific has plunged into its own civil war and division. Port blockades, military deployments, and political chaos in the United States have suddenly left once-stable maritime routes and trade networks completely unmoored. This conflict across the ocean has directly shaken the international environment we rely on to survive. Financial markets are in turmoil, and with exports and supply chains severed, an unprecedented vacuum has opened in regional security. The Pacific is no longer a symbol of peace and prosperity. It has become a source of turbulence and uncertainty.\n\nThe old order has been reduced to ashes, leaving us as an isolated island in the storm."

 emergency_financial_controls: "Financial Contingencies"

 emergency_financial_controls_desc: "Following the outbreak of civil war in the United States, global financial markets instantly fell into chaos. Cross-border clearing has ground to a halt, and dollar liquidity has rapidly dried up. To prevent capital flight and bank runs, we must immediately implement temporary financial controls and freeze large-scale capital flows to ensure our domestic financial order does not collapse."

 TJ_hold_emergency_talks: "Reassurance from Japan"

 TJ_hold_emergency_talks_desc: "As the American order collapses, an unprecedented vacuum has opened in East Asia's security and economic structure. Japan and our nation both face the pressure of vanishing export markets and deteriorating regional security. Amidst this turbulence, both sides must establish an unprecedented high-level consultation mechanism."

 Export_market_shifts: "Shift our Exports"

 Export_market_shifts_desc: "The United States has long been our nation's most important export market. With its economic system paralyzed, massive volumes of orders have vanished instantly. If we cannot rapidly open up new avenues for trade, our industrial supply chains will grind to a complete halt."

 Revaluation_foreign_exchange_reserves: "Reevaluate Foreign Reserves"

 Revaluation_foreign_exchange_reserves_desc: "For years, our nation's massive foreign exchange reserves have been held primarily in US dollar assets. But with the collapse of the US government, the actual value of these assets is rapidly evaporating. We must reevaluate our national reserve structure and find a new anchor of value."

 Aus_Resource_Swap_Agreement: "Australian Exchange Agreement"

 Aus_Resource_Swap_Agreement_desc: "The collapse of the global trade system has severely destabilized the supply of energy, minerals, and food. For a nation like ours, which relies heavily on imported resources, securing long-term, reliable sources has become an urgent priority. Australia possesses abundant minerals, energy, and agricultural output, but it needs our high-end manufacturing and semiconductor technologies to maintain its industrial operations. With international markets in chaos, the conditions are right for our two nations to establish a direct exchange mechanism. Under this agreement, we will trade chips and industrial technology for a stable supply of strategic resources, establishing a new cooperative relationship that does not rely on the legacy trade system.\n\nIn a turbulent world, a reliable partner is more valuable than currency."

 Japan_Science_Technology_Industry_Cooperation: "Japanese Scientific & Tech Cooperation"

 Japan_Science_Technology_Industry_Cooperation_desc: "With global supply chains severed, no single nation can maintain a complete high-tech industrial system on its own. Through institutionalized technological and industrial cooperation, Taiwan and Japan will work together to maintain the last functioning advanced industrial chain in East Asia."

 Semiconductor_mobilization: "Mobilize the Semiconductor Industry"

 Semiconductor_mobilization_desc: "Our advanced manufacturing processes, originally dedicated to global consumer electronics and commercial markets, must now become strategic assets. Wafer fabs, packaging plants, and material supply chains will enter a state of total mobilization, prioritizing high-performance computing and artificial intelligence training. Every wafer produced today will become part of our future national strength."

 National_Artificial_Intelligence_Strategy: "National Artificial Intelligence Strategy"

 National_Artificial_Intelligence_Strategy_desc: "Artificial intelligence must no longer be merely a corporate tool; it must become a core component of our national strategy. We will integrate models and personnel from various corporations and research institutions to establish a unified national AI system for military, economic, and intelligence applications. Our algorithms will become the weapons of the new world."

 Attracting_US_AI_companies: "Attract American AI Companies"

 Attracting_US_AI_companies_desc: "As the US mainland falls into prolonged turmoil, numerous artificial intelligence companies and research institutions are being forced to seek new footholds. For organizations that rely heavily on stable power, network infrastructure, and an advanced chip supply, continuous operation has become the primary goal. Our complete semiconductor supply chain, mature digital environment, and relatively stable social order make us one of the few locations capable of absorbing these high-end technological resources. We will establish a new industrial park for these companies near Hsinchu and integrate them into our supply chain."

 chip_complex: "The Semiconductor Complex"

 chip_complex_desc: "With the full integration of our semiconductor industry, artificial intelligence research, and national strategy, we are no longer mere technology manufacturers. A \"chip complex\" comprising wafer fabs, data centers, research institutions, and military units is taking shape. The rest of the world may still be fighting over oil and steel, but the chips and computing power we control will ultimately determine the future of warfare and the economic order. Long live the Republic of China! Long live Taiwan!"

 Recruiting_US_refugee_talent: "Recruit American Refugees"

 Recruiting_US_refugee_talent_desc: "As the American West Coast falls to the flames of war, massive numbers of technical personnel are fleeing the country. We will take in Silicon Valley engineers, researchers, and their families, putting their knowledge and expertise to work for us."

 Intervene_American_Civil_War: "§YIntervene in the American Civil War§!"

 Intervene_American_Civil_War_flag: "§YIntervene in the Second American Civil War§!"

 Intervene_American_Civil_War_desc: ""

 Out_the_storm: "Weathering the Storm"

 Out_the_storm_desc: "The chain reaction triggered by the civil war in the United States temporarily threw the global financial system, trade networks, and regional security order into chaos. Our nation was not spared. Foreign exchange values fluctuated violently, export markets evaporated overnight, and both civilians and industries came under immense pressure.\n\nHowever, through emergency economic measures, industrial mobilization, and mutual assistance pacts established with neighboring countries, we have successfully stabilized the situation. Social order has been maintained, our industrial system continues to operate, and new trade and cooperative relationships are taking shape. The storm has not completely passed, but we are no longer passive victims.\n\nA new era belonging to us is unfolding."

 TJ_Technology_Cooperation: "Japan-Taiwan Scientific Cooperation"

