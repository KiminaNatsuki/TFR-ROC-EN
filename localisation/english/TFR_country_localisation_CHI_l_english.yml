 CHI_KMT_protests: "Republic Movement"

 CHI_KMT_protests_desc: "\"Party alternation makes Taiwan better.\"\n\n\n\n— Kuomintang (Chinese Nationalist Party)\n\n\n\nSince the Democratic Progressive Party won the presidential election once again, the KMT-led Pan-Blue coalition's protest movements in the name of anti-hegemony have become increasingly frequent, destabilizing Taiwan's political landscape and creating obstacles for the DPP's administration.\n\n\n\nAlthough the KMT has tended towards marginalization since President Ma Ying-jeou left office, Taiwan's two-party dominant political situation has not changed. The KMT still controls a majority in the Legislative Yuan and local mayoral positions. If the DPP wants political stability in Taiwan, the Pan-Blue camp is the first major problem they must solve. If the DPP attempts to use the state apparatus to further weaken KMT forces, the Pan-Blue camp will gain more excuses to oppose the DPP's \"authoritarian hegemony\"; if the DPP allows KMT forces to grow unchecked, DPP policies will face severe difficulties in Pan-Blue localities.\n\n\n\nWinning an election is not the end, but the beginning..."

