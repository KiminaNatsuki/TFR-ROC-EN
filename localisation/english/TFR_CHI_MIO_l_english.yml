l_english:
 # =============================================
 # 臺灣國際造船股份有限公司 (CSBC Corporation, Taiwan)
 # =============================================
 CHI_CSBC_organization: "CSBC Corporation, Taiwan"

 CHI_CSBC_organization_desc: "The Taiwan International Shipbuilding Corporation is the largest state-owned shipyard in the Republic of China. Its diversified production lines are responsible for the Indigenous Defense Submarine program as well as the construction of capital ships and frigates."


 CHI_CSBC_mio_initial_trait: "Shipyard Material Standardization"

 CHI_CSBC_mio_initial_trait_desc: "Standardizing materials used across all shipyards will offer improved naval vessel structural integrity and reliability while maximizing our production capacity."


 CHI_CSBC_mio_trait_submarine_hunters: "Submarine Hunters"

 CHI_CSBC_mio_trait_submarine_hunters_desc: "Using enhanced sonar integration, underwater detection modules, and deep water attack systems, we can produce a squadron of highly effective multirole frigates for anti-submarine warfare."


 CHI_CSBC_mio_trait_efficient_patrolling_scheme: "Optimized Patrol Routes"

 CHI_CSBC_mio_trait_efficient_patrolling_scheme_desc: "By optimizing the effectiveness of our naval patrols and our coordination, our naval elements will cover patrol zones more effectively."


 CHI_CSBC_mio_trait_advanced_sub_scanners: "Advanced Submarine Detection"

 CHI_CSBC_mio_trait_advanced_sub_scanners_desc: "[UNTRANSLATED] 整合高靈敏度聲納探測系統，強化水面艦艇對潛艦的探測與追蹤能力。"


 CHI_CSBC_mio_trait_high_altitute_catapult: "[UNTRANSLATED] 高海拔彈射器"

 CHI_CSBC_mio_trait_high_altitute_catapult_desc: "Improves the catapult system for seaplanes, providing better aerial visibility and early warning detection capabilities."


 CHI_CSBC_mio_trait_light_armor_piercing_guns: "Armor-piercing Guns"

 CHI_CSBC_mio_trait_light_armor_piercing_guns_desc: "Develops high-muzzle-velocity armor-piercing ammunition for enhanced penetration against the armor of enemy warships."


 CHI_CSBC_mio_trait_brass_case_reloader: "Brass Casing Autoloader Integration"

 CHI_CSBC_mio_trait_brass_case_reloader_desc: "Utilizing high-strength brass casings along with an improved loading mechanism will increase the rate of fire and reliability of light artillery."


 CHI_CSBC_mio_trait_anti_air_defense: "Multi-Layered Air Defenses"

 CHI_CSBC_mio_trait_anti_air_defense_desc: "Through the introduction of various weapon and detection systems, the effectiveness of aerial target interception and air defense will be improved."


 CHI_CSBC_mio_trait_heavy_guns: "[UNTRANSLATED] 重炮"

 CHI_CSBC_mio_trait_heavy_guns_desc: "[UNTRANSLATED] 精進重型火炮的結構設計與火控整合，提升主力艦火力輸出與破壞效能。"


 CHI_CSBC_mio_advanced_periscope: "[UNTRANSLATED] 先進潛望鏡"

 CHI_CSBC_mio_advanced_periscope_desc: "[UNTRANSLATED] 採用更隱蔽的光學與電子偵蒐潛望鏡，降低潛艦在水下探測時的暴露風險。"


 CHI_CSBC_mio_trait_piercing_rounds: "[UNTRANSLATED] 穿甲彈"

 CHI_CSBC_mio_trait_piercing_rounds_desc: "[UNTRANSLATED] 裝備最新型重型穿甲彈，專門針對敵方主力艦的厚重裝甲進行打擊。"


 CHI_CSBC_mio_trait_base_defense: "[UNTRANSLATED] 基礎防禦"

 CHI_CSBC_mio_trait_base_defense_desc: "[UNTRANSLATED] 強化艦體裝甲與基礎防空火力，全面提升艦艇在戰區的生存與防禦能力。"

 
 CHI_CSBC_mio_trait_deck_guns: "[UNTRANSLATED] 甲板炮"

 CHI_CSBC_mio_trait_deck_guns_desc: "[UNTRANSLATED] 在甲板上增設輔助防空火力，進一步提升對低空威脅的攔截效率。"


 CHI_CSBC_mio_trait_state_sponsored_dev: "[UNTRANSLATED] 國家資助發展"

 CHI_CSBC_mio_trait_state_sponsored_dev_desc: "[UNTRANSLATED] 藉由政府專項撥款，擴建船廠基礎設施，穩定軍事艦艇生產線並提升資金積累。"


 CHI_CSBC_mio_trait_state_research_grants: "[UNTRANSLATED] 國家資助科研"

 CHI_CSBC_mio_trait_state_research_grants_desc: "[UNTRANSLATED] 引入政府科研補助，加速艦艇設計的研發週期，縮短新型艦艇從概念至量產的時程。"


 CHI_CSBC_mio_trait_24h_shifts_csbc: "[UNTRANSLATED] 24小時輪班制"

 CHI_CSBC_mio_trait_24h_shifts_csbc_desc: "[UNTRANSLATED] 推行全天候輪班生產制度，大幅提升艦艇建造速率，但相應增加工時管理成本。"


 CHI_CSBC_mio_trait_state_subsidizing_csbc: "[UNTRANSLATED] 國家補貼"

 CHI_CSBC_mio_trait_state_subsidizing_csbc_desc: "[UNTRANSLATED] 透過長期補貼協議降低組織升級門檻，鞏固與政府的戰略合作關係，但設計團隊調配成本略有提升。"


 # =============================================
 # 中信造船集團 (Jong Shyn Shipbuilding Group)
 # =============================================
 CHI_Jong_Shyn_organization: "Jong Shyn Shipbuilding Group"

 CHI_Jong_Shyn_organization_desc: "[UNTRANSLATED] 中信造船集團，專注於航空母艦、巡洋艦及驅逐艦等大型任務艦的建造，擅長高速遠洋作戰艦艇的開發，為中華民國打造遠洋戰力投射能力。"


 CHI_Jong_Shyn_mio_initial_trait: "[UNTRANSLATED] 艦隊任務艦設計理念"

 CHI_Jong_Shyn_mio_initial_trait_desc: "[UNTRANSLATED] 以任務艦隊的整合作戰為核心設計理念，強化艦體強度並加速研發進程。"


 CHI_Jong_Shyn_mio_trait_long_range_cruising: "[UNTRANSLATED] 長程巡航"

 CHI_Jong_Shyn_mio_trait_long_range_cruising_desc: "[UNTRANSLATED] 優化燃料配置與艦體水動力設計，大幅延伸艦艇的遠洋作戰航程。"


 CHI_Jong_Shyn_mio_trait_high_speed_cruising: "[UNTRANSLATED] 高速巡航"

 CHI_Jong_Shyn_mio_trait_high_speed_cruising_desc: "[UNTRANSLATED] 採用高功率推進系統與整流化船型，顯著提升艦艇的最大航速，適合快速部署任務。"


 CHI_Jong_Shyn_mio_trait_splinter_protection: "[UNTRANSLATED] 碎片防護"

 CHI_Jong_Shyn_mio_trait_splinter_protection_desc: "[UNTRANSLATED] 強化艦艇上層結構與關鍵艙室的防碎片裝甲，降低爆炸破片對人員與設備的殺傷效果。"


 CHI_Jong_Shyn_mio_trait_transom_stern: "[UNTRANSLATED] 流體力學改進"

 CHI_Jong_Shyn_mio_trait_transom_stern_desc: "[UNTRANSLATED] 採用方形艉結構改善航行效率，降低航行阻力並節省燃料消耗。"


 CHI_Jong_Shyn_mio_trait_underway_replenishment_equipment: "[UNTRANSLATED] 海上補給設備"

 CHI_Jong_Shyn_mio_trait_underway_replenishment_equipment_desc: "[UNTRANSLATED] 整合快速海上補給系統，使艦艇可在不靠港的情況下延伸任務時程。"


 CHI_Jong_Shyn_mio_trait_secondary_fire_director_control: "[UNTRANSLATED] 副武器引導控制"

 CHI_Jong_Shyn_mio_trait_secondary_fire_director_control_desc: "[UNTRANSLATED] 整合射控計算機，提升防空武器與輕型火砲的射擊精度。"


 CHI_Jong_Shyn_mio_trait_primary_fire_director_control: "[UNTRANSLATED] 主武器引導控制"

 CHI_Jong_Shyn_mio_trait_primary_fire_director_control_desc: "[UNTRANSLATED] 針對主砲配置精密射控解算系統，大幅提升重型火砲對海攻擊精度。"


 CHI_Jong_Shyn_mio_trait_flight_deck_edge_aa_mounts: "[UNTRANSLATED] 飛行甲板邊緣防空支架"

 CHI_Jong_Shyn_mio_trait_flight_deck_edge_aa_mounts_desc: "[UNTRANSLATED] 在航母飛行甲板邊緣加裝近防火砲，強化航母自身的低空及末段防空能力。"


 CHI_Jong_Shyn_mio_trait_rapid_fire_guns: "[UNTRANSLATED] 速射炮"

 CHI_Jong_Shyn_mio_trait_rapid_fire_guns_desc: "[UNTRANSLATED] 配備高射速自動砲系統，對低空飛行目標及小型水面目標具有顯著壓制效果。"


 CHI_Jong_Shyn_mio_trait_high_velocity_guns: "[UNTRANSLATED] 高速艦炮"

 CHI_Jong_Shyn_mio_trait_high_velocity_guns_desc: "[UNTRANSLATED] 為主砲開發高初速穿甲彈藥，顯著提升對重型艦艇裝甲的貫穿能力。"


 CHI_Jong_Shyn_mio_trait_advanced_fitting_works: "[UNTRANSLATED] 先進裝配作業"

 CHI_Jong_Shyn_mio_trait_advanced_fitting_works_desc: "[UNTRANSLATED] 精進艦艇建造的組裝流程與品質管制，提升產線生產速率。"


 CHI_Jong_Shyn_mio_trait_gyro_stabilized_mounts: "[UNTRANSLATED] 陀螺儀穩定支架"

 CHI_Jong_Shyn_mio_trait_gyro_stabilized_mounts_desc: "[UNTRANSLATED] 採用陀螺儀補償系統，使炮座在艦艇搖晃時仍能維持穩定瞄準，大幅提升命中率。"


 CHI_Jong_Shyn_mio_trait_carrier_flight_operations_center: "[UNTRANSLATED] 先進型消防泵"

 CHI_Jong_Shyn_mio_trait_carrier_flight_operations_center_desc: "[UNTRANSLATED] 整合高壓消防系統與即時損管回饋網路，提升艦艇在作戰損傷後的生存能力。"


 # =============================================
 # 龍德造船工業股份有限公司 (Lungteh Shipbuilding)
 # =============================================
 CHI_Lungteh_organization: "Lungteh Shipbuilding Co., Ltd."

 CHI_Lungteh_organization_desc: "[UNTRANSLATED] 龍德造船工業股份有限公司，專注於護衛艦、巡邏艦及高速飛彈快艇的建造，以沱江艦為代表的匿蹤艦設計著稱，為臺灣近海防禦提供靈活的海上打擊力量。"


 CHI_Lungteh_mio_initial_trait: "[UNTRANSLATED] 沿海快速作戰艦設計理念"

 CHI_Lungteh_mio_initial_trait_desc: "[UNTRANSLATED] 以高機動性、低造價的近海作戰為核心設計哲學，艦艇天生具備優秀的航速與較低的建造成本。"


 CHI_Lungteh_mio_trait_submarine_hunters: "[UNTRANSLATED] 反潛角色優化"

 CHI_Lungteh_mio_trait_submarine_hunters_desc: "[UNTRANSLATED] 整合拖曳陣列聲納與深水炸彈系統，大幅提升護衛艦的水下目標探測與攻擊能力。"


 CHI_Lungteh_mio_trait_high_speed_mine_hunting: "[UNTRANSLATED] 高速掃雷設備"

 CHI_Lungteh_mio_trait_high_speed_mine_hunting_desc: "[UNTRANSLATED] 優化艦內管路布局與推進系統冷卻設計，提升艦艇進行掃雷任務時的最大航速。"


 CHI_Lungteh_mio_trait_advanced_hydrodynamic_design: "[UNTRANSLATED] 先進流體力學設計"

 CHI_Lungteh_mio_trait_advanced_hydrodynamic_design_desc: "[UNTRANSLATED] 運用風洞與水槽測試資料精進船型，在提升速度的同時降低燃料消耗與建造成本。"


 CHI_Lungteh_mio_trait_fleet_escort: "[UNTRANSLATED] 艦隊護航角色"

 CHI_Lungteh_mio_trait_fleet_escort_desc: "[UNTRANSLATED] 強化艦艇作為海域巡邏主力的多功能定位，提升協同巡邏效率與輕型火力輸出。"


 CHI_Lungteh_mio_trait_anti_air_ship: "[UNTRANSLATED] 防空艦船"

 CHI_Lungteh_mio_trait_anti_air_ship_desc: "[UNTRANSLATED] 賦予艦艇強化防空使命，配置多層次近防火力應對各類空中威脅。"


 CHI_Lungteh_mio_trait_armed_escort: "[UNTRANSLATED] 武裝護航"

 CHI_Lungteh_mio_trait_armed_escort_desc: "[UNTRANSLATED] 強化艦艇火力配置，使其兼具火砲打擊與武裝護航能力，適合高烈度近海作戰。"


 CHI_Lungteh_mio_trait_optimized_aa_arcs: "[UNTRANSLATED] 優化防空砲射擊弧線"

 CHI_Lungteh_mio_trait_optimized_aa_arcs_desc: "[UNTRANSLATED] 改進防空砲的配置與射擊弧線，提升防空攔截效率。"


 CHI_Lungteh_mio_trait_gyro_stabilized_mounts: "[UNTRANSLATED] 陀螺儀穩定支架"

 CHI_Lungteh_mio_trait_gyro_stabilized_mounts_desc: "[UNTRANSLATED] 採用陀螺儀補償系統，使炮座在艦艇搖晃時仍能維持穩定瞄準，大幅提升命中率。"


 CHI_Lungteh_mio_trait_improved_aa_mounts: "[UNTRANSLATED] 改進防空炮裝配"

 CHI_Lungteh_mio_trait_improved_aa_mounts_desc: "[UNTRANSLATED] 改進防空炮座的結構安裝與固定工藝，在降低製造成本的同時提升防空火力輸出效率。"


 CHI_Lungteh_mio_trait_mass_production: "[UNTRANSLATED] 大規模生產"

 CHI_Lungteh_mio_trait_mass_production_desc: "[UNTRANSLATED] 推行標準化設計規範與模組化建造工法，大幅提升護衛艦批量生產的效率並降低單艦造價。"


 CHI_Lungteh_mio_trait_improved_light_gun_mounts: "[UNTRANSLATED] 改進輕型火砲裝配"

 CHI_Lungteh_mio_trait_improved_light_gun_mounts_desc: "[UNTRANSLATED] 精進炮座安裝工序與品管機制，在降低建造成本的同時全面提升防空與對海火力。"


# =============================================
 # 國家中山科學研究院 (National Chung-Shan Institute of Science & Technology)
 # =============================================
 CHI_NCSIST_organization: "National Chung-Shan Institute of Science and Technology"

 CHI_NCSIST_organization_desc: "[UNTRANSLATED] 國家中山科學研究院（National Chung-Shan Institute of Science & Technology, NCSIST）是中華民國的國防科技研發機構，專注於導彈、雷達、無人機及其他先進武器系統的研發與製造。"


 CHI_NCSIST_mio_initial_trait: "[UNTRANSLATED] 國防科技研發"

 CHI_NCSIST_mio_initial_trait_desc: "[UNTRANSLATED] 專注於先進武器系統的研發，提升中華民國的國防自主能力與戰略威懾力。"


# =============================================
