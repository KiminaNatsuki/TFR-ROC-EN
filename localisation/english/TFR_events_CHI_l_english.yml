 CHI.H3.11.a:0 "Han Kuo-yu"
 CHI.H3.12.t:0 "防空洞"
 CHI.H3.12.d:0 "洞穴內悶熱的空氣讓王剛殷汗如雨下，他拿著手寫版靠在牆壁邊塗塗改改，牆上微弱的燈光是整個洞穴裡唯二的照明----還有一個是卡車的車頭燈，他調整了下位置，盡量別讓自己的陰影遮住清單的同時避免讓額頭上的汗珠滴到上面。工兵還在嘗試洞內的通風設施，但民國70年老東西的脾氣可沒那麼好惹，壞了修、修了壞，但物資轉運的部分也沒法拖延，所有人只能在這套桑拿房裡做做舉重訓練了。\n\n「這些就是全部了。」其中一位後勤官走向他說到，用手指了指從斜坡上緩緩開下來的重型卡車，柴油混合著幾十人的汗臭讓空氣都凝滯了，剛殷抹了下鼻子，試著適應這種令人窒息的氛圍。\n\n「好極了。」剛殷翻到清單的最後一頁，把最後幾個純白的空格全都打勾。子彈、槍械、軍糧……不知道上頭往這個個頭這麼小的防空洞裡塞這麼多東西幹啥?且不說這些東西能不能給多少部隊用多久，裡面的東西不知道是不是放了幾十年的陳年乾糧。\n\n像他們這樣的防空洞還有好幾十個呢!有的是戰後重新選址新修建的、有的是翻新舊有的地下和山體掩體，體積小的就塞些簡單的輕武器跟食糧補給，也許還有幾桶柴油擺在角落，拿來給坦克補給不太夠看，但給發電機倒是綽綽有餘。\n\n「接下來應該就沒了吧?看你們的卡車都空了……」王剛殷好奇的問道。\n\n「我建議你不要多問，這是機密。」眼前後勤官冷冷地回答道，在王剛殷敬禮前便轉身走開，乘上一輛卡車後迅速離去，留下滿頭大汗的王剛殷跟一臉好奇的其他士兵，前者看著那些剛搬下車的板條箱，箱子旁印著裡面應該要有的內容物:T65步槍十把。"
 CHI.H3.12.a:0 "最好別好奇裡面裝了甚麼..."
 CHI.H4.1.t:0 "大亞洲戰爭凱旋!"
 CHI.H4.1.d:0 "大亞洲戰爭的烈焰席捲東亞各國，平民與他們的一切被迫成為野心家奔向遠方的燃料，在看似無盡的戰火中成為傷亡表格上的又一串數字，無論當初是為了甚麼理想燃盡亞太，一切都結束了。穩中向前的大船最終不敵海狼們的撕咬、智能體團結人類的希望徹底破滅、太平上的強風驟雨澆熄復仇烈焰，上一次的中國折戟台灣，像中共的領導者證明台灣與東亞各國的堅強韌性，解放軍尚能體面地離開台灣，處理海內一團亂麻的局勢；而這一次的失敗則是徹底擊碎中華人民共和國的野心，無論他們想做甚麼，都不是太約的敵人!\n\n不過對台灣而言，今日的勝利還包含另外一層意義。在長久的民主化與本土化運動下，「光復」成了一個略顯陳舊又帶著戒嚴時代沉重包袱的詞彙，巨大的工業與軍事差距也讓當年遷台的老榮民們不得不融入這塊他們從未了解、從未踏足過的土地。可當中共投降的消息傳遍全台灣後，全島為之沸騰，不僅僅是懸在頭上的達摩克里斯之劍碎了一地，更是讓全中華民國第一次嘗到光復的滋味。\n\n自此之後，台灣人再也不需要矽盾、不需要籌碼、不需要看人臉色，我們的實力與地位不證自明，我們終於真正得到了決定我們命運的權利。先讓人們去狂歡吧!重建的事之後再考慮，至於下一步該怎麼走……"
 CHI.H4.1.a:0 "我們贏了！"
 CHI.H4.2.t:0 "第二次軍閥大戰"
 CHI.H4.2.d:0 "過去國民革命軍西討陸榮庭、東征陳炯明、北伐孫傳芳與張宗昌，最後在張學良宣告東北易幟時宣告軍閥大戰正式結束。沒人想到時隔多年之後，國民黨政府的軍隊會再次從廣州這塊起始之地進行一場統一戰爭。在共產中國徹底倒台之後，大陸境內各方地頭蛇趁機宣布獨立，沒被剿滅的解放軍將領收攏起當地殘餘部隊擁兵自重，甚至還有殘留在北京的中共黨員趁太約撤軍時聲稱新中國還沒覆滅，這一切都是中華民國沒有能力快速光復整個大陸造就的結果，我們會一步步取回失去的一切，將獨裁專政的陰影掃進歷史的垃圾堆！"
 CHI.H4.2.a:0 "革命尚未成功，同志仍須努力"
 CHI.H4.3.t:0 "幹部培訓"
 CHI.H4.3.d:0 "劉春橋區長盯著面前快速閃過的簡報發呆，理性告訴他最好在筆記本上記下一些重點，可右手無論怎麼樣也抽不出那隻咬在嘴中的原子筆。他舉起水杯喝水緩解心中的焦慮，教室裡出奇地沉默，台上的講師滔滔不絕地講解中華民國憲法的基礎原理跟立法基礎，身邊的同僚們沒有一個偷懶放縱。\n\n他飲盡杯中的最後一口水，有模有樣地抄下其中一頁簡報的重點。十幾年前考公的時候都沒這麼認真嚴肅過，這和寫申論題跟編編官式文章的感覺完全不一樣，也許是他們這批幹部需要特別關照?以半關押半自由來到台灣----應該說「中華民國自由地區」----接受新式的官僚培訓，培訓期間的食衣住行皆由中華民國政府負擔，但只能在規定的區域內自由活動，若是想到其他縣市還需要外出通報全部行程，如果沒在時間內返回可得面臨牢獄之災還有終身吃…褫奪公權的懲罰。\n\n投影布幕上的時鐘滴答作響，下禮拜就是期中考周，他們這群年近半百、小孩都上大學的事務官們還得跟他們的兒女一樣遵守大學式時程安排，差別在於沒有社團、沒有夜生活，只有卷學分跟學期成績的選項。幸好他們偶爾也有機會下到基層，學習他們的具體的工作流程。春橋還記得之前跟一位平時不怎麼喜歡的同事在區公所實習，後者接待民眾不是愛理不理就是踢皮球，最後上頭接到民眾投訴過幾天就被調走了，據說是開除公職並送回大陸。也不知道是受困在這個彈丸之地培訓十周好，還是直接送回家鄉種地好?\n\n下課鐘適時地迴盪在整間教室內，春橋收起筆記本，跟著三四十名同學魚貫而出，午飯過後還有行政法的課得修。穿過鬱鬱蔥蔥的樹林大道，今天的天氣萬里無雲，不知道遠在廣東的老母親怎麼樣了，現在大陸的局勢一團亂麻，希望早些時日寄的信和一些乾糧能順利送到她手上吧……"
 CHI.H4.3.a:0 "「先去食堂吃個飯好了。」"
 CHI.H4.4.t:0 "漫漫長路"
 CHI.H4.4.d:0 "「蓋章的時候為甚麼不能用我自己的印章啊?這樣誰知道是我投的票!」一位年過六旬的老爺爺舉起右手發問，台下的一眾相同歲數的爺爺奶奶們也跟著七嘴八舌地討論。台上劉川羽擺出手勢讓大家稍安勿躁，連續開了三天的民主投票座談會讓他和他的同事疲憊不已，雖然他能理解這些大陸移民對西方直接民主制的選舉流程感到困惑，但要是給這幾十位長輩講解投票都如此困難，等到時候重新在大陸開放全民普選不知道會是一番怎樣的混亂場景。\n\n「投票的時候投票亭裡會有選舉委員會事先放好的印章…」川羽把簡報往回調了幾頁，「拿起印章，在各自候選人的蓋章欄上蓋好印章，如果沒有按照圖示在欄位裡蓋章或使用非委員會提供之印章蓋印、簽字等等，選票直接作廢。同樣的要是在投票亭內公開亮票也是違反規定的，選票一樣作廢」剛一說完台下聽眾更躁動不安，有越來越多人舉起手想發表意見。川羽輕輕嘆了口氣，看來座談會還得再開幾天……\n\n而在另外一邊，多位教育部官員也正為了選舉的事在煩惱，只不過他們面對的是小學生、中學生跟大學生，這些有志青年也將是未來中華民國的重要骨幹，讓他們理解並實際參與中華民國的政治運作才是長久之計。但就現階段而言想要依靠教材「訓政」恐怕得等到十幾年之後才能初見成效，最好的方式就是直接安排老師或專員進入學校，將舊有的班級職位體系替換成台灣的，並替換掉所有政治課改為公民課，抽空讓讓所有學生選出班長、副班長、衛生股長等職位，雖然這麼做並不一定能直接把學生們變成一個民主社會中的合格公民。"
 CHI.H4.4.a:0 "一步步慢慢來吧..."
 CHI.H4.5.t:0 "旅途之終末"
 CHI.H4.5.d:0 "隨著荒漠，高原與草原的硝煙散盡，中華民國已經控制了先前中共所控制的所有地區，回復了我國對憲法中規定的主權地區的控制權與治理權。\n\n現今中國各地，已經開始進行重建工作與民主訓練，各地政府機構在逐漸回復功能，警察與軍隊也把秩序維持的很好，我們終於可以向世界宣佈，中華民國已經光復祖國，重獲新生。\n\n韓總統已經宣佈，政府部門將回到法定首都-南京，在搬遷當天，將舉辦盛大的慶典與閱兵儀式，他將親自帶領各部門官員前往紫金山拜祭中山陵，告慰國父，告慰蔡鍔將軍，告慰無數為中華民國，為中國的民主與自由，為反抗暴政而死的人們，並在當日同步舉行蔣先總統中正先生的遺訓，將其將父子二人的棺槨從慈湖移葬至紫金山。\n\n自1912年國父孫文在南京就任中華民國臨時大總統以來，中華民國經歷，袁世凱亂政，北洋軍閥混戰，寧漢分裂，日本侵略，中共奪取大陸，民主化這一系列的路程，終於回到了南京。\n\n在中華大地無數的混亂和獨裁之後，中國人終於可以驕傲的抬起頭，宣佈自己是一個享有民主，民生，民權的自由的人。"
 CHI.H4.5.a:0 "漫漫長路歸鄉"
 CHI.H4.6.t:0 "民主意識速成班"
 CHI.H4.6.d:0 "在中華民國回到大陸之後，最大的問題就是如何讓13億7000萬人民加入民主的社會，如果不讓大陸人民學會民主就直接讓他們進行選舉，只會出現麵包與馬戲的戲碼.他們無法理解選票代表什麼，不知道這是他們的武器，讓富人和政客用一些小恩小惠就讓他們乖乖的交出手裡的選票，這只會讓我們的選舉和古羅馬一樣變成一個賄選遍地，腐敗無比的選舉，所以必須先對大陸人民進行民主訓練。\n\n但臺灣的民主訓練是持續幾十年，即使是在戒嚴時期，也維持著基層民主，人民對於民主的認識一直在或快或慢的推進，而大陸不僅人數極多，而且因為共產黨的獨裁統治，僅僅只有一部分超一線城市，如上海，深圳，廣州的人民對民主有著基礎的認識.這讓我們無法用和臺灣一樣的方法來培養人民的民主意識，這需要花費大量的時間、人力、資源，龐大的財務支出在完成訓政之前會先拖垮國家。更何況我們也沒有這麼多的時間。\n\n幸好，即使是中共也不敢公開宣佈民主是壞東西，也要以「民主集中制」來粉飾太平。這讓我們的工作不至於從零開始。也幸好中國有著三個地區的人民有著實際的民主經驗，我們將以臺灣，香港，澳門，三地的人民作為引導，動用一切手段，甚至包括一些強制手段，將民主經驗強行快速塞進大陸人民的腦子裡面，不求他們有多好的民主意識，只要有基礎的民主素質就好，起碼不能為了幾百塊把自己的選票賣出去。"
 CHI.H4.6.a:0 "總之先把知識塞進去"
 CHI.H4.7.t:0 "深夜快車"
 CHI.H4.7.d:0 "漆黑的夜，路邊只有幾盞忽明忽暗路燈陪伴旅人回家。韓國瑜坐在加長型的黑色禮車內，昏昏欲睡的他習慣性地解下領帶，他和他的總統車隊剛從北京馬不停蹄地沿著高速公路南下，上海、南京、廣州、福建……中華民國好不容易重歸一統，他這位來自台灣的總統現在正被數十億雙眼睛審視著，期待他能給中國人民帶來期待已久的光復。\n\n「總統先生，您要不歇一會兒吧?我給您帶了些安眠藥過來…..」坐在眼前的保鑣流暢地從口袋掏出藥盒，銀色的包裝上只剩下兩粒。韓國瑜接過藥盒，最近幾天都在各大城市連軸轉，接連在各地視察重建進度，以韓總的體力在台灣保持親民形象還能勉強撐得過去，但要是每天都得跟上千人握手、拍照、舉辦座談會，就算精神上應付的了，這副已過古稀之年的軀體也支撐不住。\n\n韓總統將安眠藥扔向身旁的坐椅上，他太累了，當年的他怎麼想也想不到居然會走到今天這種程度，從統領一個彈丸之地變成整個秋海棠，人們愛戴他、擁護他，認可他是中華民國無可取代的總統，是他們對韓導的信任支撐他一步步走到現在。\n\n望著窗外不停變換的路燈……韓國瑜心裡清楚，人們對「韓導」的熱情終究會消散，再下一次、下下一次、下下下一次，會有越來越多人模仿他的風格參與競選，他們更年輕、更有吸引力，韓總統贏不了他們的。韓總統也曾經想過扶持繼承人，但這就是韓導想留給中華民國的遺產嗎?\n\n人們在不停的激情中循環往復，如果外界沒了更加強大的敵人，中國人會不會再一次將槍口對向自己的同胞?"
 CHI.H4.7.a:0 "願中國終成自由！"
 CHI.H4.91.t:0 "蒙古問題"
 CHI.H4.91.d:0 "一望無際的草原飛馳而過，各色馬兒在人跡罕至的原野上無憂地生活著，它們有的奔跑、有的嬉戲，不過大部分都選擇躺下休息。偶爾有一兩個牧羊人趕著一團團雲朵前進，好似乘著觔斗雲。\n\n陳秋盛闔上牛皮筆記本，今天紀錄的所見所聞足夠多了，他敲了下僵硬不已的後背，那是年輕時奮鬥後留下的後遺症，當年背著老闆的東西滿世界亂跑，現在自己當了老闆，但也沒感覺輕鬆多少。原本的安排是從桃園機場起飛，經停北京首都機場後再直飛成吉思汗機場，但總統和幕僚們討論過後認為現在的中國情勢還不安定，尤其國界的安全問題尚未得到妥善解決，於是臨時決定在北京落地後轉乘外交專列抵達前往蒙古首都，可由於蒙古方面自同意外交談判後就一直沒有回應我方的任何問題，也不同意我方列車的入境申請，只能讓陳秋盛帶頭的外交團隊在呼和浩特下車，改乘車隊前往烏蘭巴托。\n\n十二個小時過去，陳秋盛不是在審閱談判條款就是在寫筆記，後者很好的緩解了他的焦慮跟失眠的老毛病，但醜媳婦總是要見公婆，他緊緊攥這手中這份長達一百多頁的歸順條款，從主權到領土，交通、郵政、教育、經濟等方面，沒有特別行政區或民族自治區，而是全面合併入中華民國的中央體系，這種在現代來看無異於賣國的條款他們真的會接受嗎？\n\n「老闆，我們快到了。」助理拍了拍他的肩膀，指著遠處寫著蒙古文的路牌說到。\n\n「蒙古方面聯繫我們了嗎？」陳秋盛將條款副本收入公文包，看著前方的車輛，整支車隊共有六輛搭載保鑣的SUV隨行，陳老闆搭的這輛據說是承平年代大陸官員最喜歡的紅旗牌轎車，後座空間確實寬敞，不過就算能舒服的伸伸腿也沒辦法緩解他的焦慮。他是帶著使命前來，他們背負著中華民國的未來之夢，可對蒙古來說是一個幾乎必輸的賭局，如果他們真的打算魚死網破，僅靠這些隨行人員是擋不住正規軍的襲擊的……\n\n車隊停在十字路口處，站哨的值班長官上前和司機打招呼，指了指兩旁的猛虎裝甲車，口譯人員跟外交官們解釋士兵們是奉蒙古政府之命在此等候我們，是「護送」使團進入烏蘭巴托的護衛。"
 CHI.H4.91.a:0 "希望能夠和平解決!"
 CHI.H4.92.t:0 "五族共和，缺一不可！"
 CHI.H4.92.d:0 "車隊跟著領頭的軍車駛入烏蘭巴托，老實說陳秋盛原以為蒙古首都應該只有幾座高層建築，剩下的不是平房就是蒙古包，繁華的程度可能也只能跟十年前的台北與新北比吧。他們現在正在高速公路上狂奔，十幾輛SUV和軍車浩浩蕩蕩進入市中心，沿街都有交警負責管制閘道與十字路口。車子開在相當平穩，即便儀表時速已經飆上一百多公里了也沒有明顯晃動，陳老闆心裡確實佩服中共的基建水準。決定中蒙兩國命運的人，在中共建設的高速公路狂飆…….\n\n沒過多久，他們就抵達了今晚的下榻之處：烏蘭巴托飯店。隨行的軍車停在大門外，等外交車隊全部駛入飯店內的車道後才離去。車隊停下，前後車的保鑣先行下車，確認安全後才打開車門讓使團們下車，陳秋盛微微吞了口口水，紅毯、禮賓人員、還有來自中蒙俄三國的媒體擠在四周，被紅龍隔開在紅毯兩側，他們出人意料的相當克制，周圍只有無盡的閃光燈與快門聲。陳秋盛向兩側的媒體點頭致意，快步走入國賓館大堂，蒙古外長在裡面等他。\n\n「我最親愛的朋友！」外長張雙臂抱住陳秋盛，後者背著突如其來的熱情驚了一下，不過很快就回抱回去，在禮賓人員的引導下雙方都帶著各自的使團官員進入會議室。陳秋盛跟蒙古外長一同落座，前者拿出印著繁體中文與公章的協議副本、後者則是吩咐助理拿出印著蒙古文的協議版本，雙方在這裡進行最後最後的細節磋商——不過前期該協商的問題都已經取得共識，今晚的會議只是確認部分細節與檢查錯漏字。\n\n隔天早上，陳秋盛乘著專車前往蘇赫巴托廣場，兩旁的道路上擠滿了熱情的民眾，他們高高舉起手中的中華民國和蒙古的旗幟、牌子上用中文跟蒙古文寫著「中蒙友誼共長久」，就連總統府前的蘇赫巴托廣場也都被人潮佔滿，整個首都的警力幾乎都被派駐到這裡維持秩序，交警努力幫陳秋盛的車隊開路，讓他們盡快抵達總統府。\n\n今日早上11點12分，陳秋盛和蒙古總統在眾目睽睽下在外交文件簽字，在實質上蒙古已經成為中華民國的一部分，但由於目前大陸局勢尚不穩定，因此就由中方代表陳秋盛簽字，等[CHI.GetLeader]的政務告一段落後再由雙方領導人舉辦正式儀式，完成法理的交接。"
 CHI.H4.92.a:0 "秋海棠重歸一統。"
 CHI.H4.93.t:0 "成吉思汗的子孫永不屈服！"
 CHI.H4.93.d:0 "車隊跟著面前的軍車駛向烏蘭巴托，頭車開下高速公路進入城區，十多輛SUV在首都車滿為患的街道上徐徐前進。車子停在路口等待紅燈，車流快速穿越、行人幾乎都低著頭穿過路口，偶爾有幾個抬起頭看向車隊，前車搖下車窗嚴令喝斥後才匆匆離去。\n\n車隊繼續往目的地前進，可他們卻離總統府和國賓館越來越遠，陳秋盛內心微微升起一股不安，胃酸在肚裡來回翻攪，他讓助理幫他拿出他的水壺。喝了幾口，陳秋盛的餘光瞥見外頭的情況，街上的人潮越來越多，他們朝著車隊大聲叫罵、試圖突破周圍軍警的封鎖、警察拿著防暴盾牌努力控制這些憤怒的群眾。車隊越往前走，情況就越發嚴重，推擠和謾罵聲穿透玻璃進到車裡，沒有人能聽清它們在說什麼，陳秋盛瞟了眼隨行的翻譯，他沒有說話。\n\n過了十多分鐘，他們才穿透層層障礙抵達目的地，今晚的談判地點選在軍營，外頭的憤怒群眾已經把營區大門堵得水泄不通，哨兵配合警方一起控制人群，但雙手還是緊緊握著步槍。車停下，陳秋盛趕忙跳下車，他的直覺告訴他在這裡越久越危險，士兵帶著他走向營區深處，使團也匆匆忙忙的跟在老大後頭。一頂軍綠色帳篷、兩張鐵桌、十張折疊椅，配上幾位蒙古代表，這就是今晚商討國家大事的地方？\n\n「您好，我是中華民國的使團代表陳秋盛。」他握住蒙古代表的手，熟練地掛著合適的微笑。外頭的聲音越來越大，陳秋盛拉出一張折疊椅坐下，打算儘早開始就條款內容進行細部磋商，不過雙方只談了十幾分鐘，幾名全副武裝的保鑣大口喘著粗氣闖進會議室。\n\n「怎麼了？發生什麼事了？」陳秋盛從座位上站起來問到，但他心裡已經有了答案……\n\n「老闆，外面的情況已經完全失控了！我們必須立刻——」話音未落，一塊磚頭砸破帳篷掉在桌上，隨後群眾的怒吼聲掩蓋一切。顧不上外交禮儀，陳秋盛一把抓起公文包跑出會議室，身後的保鑣們護送使團衝向車隊，想要在情況徹底失控之前離開烏蘭巴托。\n\n但一切都為時已晚，他們剛關上車門就遭到暴民的圍攻，木棒鐵管憤怒的砸向車窗，暴民們把陳秋盛的車包圍起來，司機嘗試踩下油門衝出重圍，但屢屢都被暴民攔下。眼看著車窗已經碎成蜘蛛網狀，陳秋盛瞥向附近的蒙古士兵期望他們幫忙解圍，但他們好像不為所動，只是任凭暴民攻擊使團的車…..。"
 CHI.H4.93.a:0 "看來成吉思汗是不會就這樣臣服的。"
 CHI.H4.94.t:0 "我們該不該同意合併？"
 CHI.H4.94.d:0 "阿阿阿寶寶你是一個叛徒、特務、大軍閥、反黨分子、野心家、走資派、投降派、修正主義、大惡霸、黑線人物、不革命、黑秀才、黑手、黑幫兇、經驗主義、民主派、中庸之道、變色龍。"
 CHI.H4.94.a:0 "喵?(同意合併)"
 CHI.H4.94.b:0 "哈!!(不同意合併)"
 CHI.201.t:0 "中華民國光復大陸"
 CHI.201.d:0 "（臨時文本）隨著最後的割據勢力被消滅，中華民國政府成功收復了中國大陸全境，定都南京。"
 CHI.201.a:0 "（中華民國答覆）三民主義統一中國！"
 CHI.201.b:0 "（其他國家答覆）歷史翻開了新的一頁。"
 CHI.202.t:0 "（臨時文本）高原停戰與藏南收復"
 CHI.202.d:0 "（臨時文本）隨著國軍部隊全面推進並掌控西藏全境及藏南地區，印方部隊已無力維持高原戰線。在國際斡旋與現實軍事形勢下，印方正式承認中華民國對西藏與藏南地區的主權，兩國正式簽署停戰協定。"
 CHI.202.a:0 "（臨時文本）西藏與藏南重歸祖國懷抱！"
 CHI.203.t:0 "（臨時文本）向日本提出領土移交交涉"
 CHI.203.d:0 "（臨時文本）隨著大陸內部割據政權的平定，中華民國宣稱之固有疆土僅剩太約盟軍在大亞洲戰爭時期所託管或佔領之東北地區與沿海租借港口。我國已正式向東京派出外交特使，要求日本政府基於同盟情誼與戰後秩序，將東北傀儡政權管轄區及相關租借港口全面移交予中華民國政府。"
 CHI.203.a:0 "（臨時文本）派出外交特使前往東京。"
 CHI.204.t:0 "（臨時文本）中華民國要求歸還東北與租借港口"
 CHI.204.d:0 "（臨時文本）中華民國政府已成功平定大陸內陸戰事，其外交特使已抵達東京，正式要求我方移交在大亞洲戰爭後建立的東北地方政權與沿海租借港口。面對重新統一的中華民國，我們必須做出抉擇。"
 CHI.204.a:0 "（臨時文本）尊重盟友與新民國，全面移交領土與港口。"
 CHI.204.b:0 "（臨時文本）拒絕他們的無理要求。"
 CHI.205.t:0 "（臨時文本）日本歸還全部在華領地與港口"
 CHI.205.d:0 "（臨時文本）東京方面傳來捷報！日本政府正式同意和平移交東北地區所有託管管轄權與沿海租借港口，並解散其在東北建立的附庸政權。秋海棠葉的固有版圖終於在和平與尊嚴中迎來圓滿！"
 CHI.205.a:0 "（臨時文本）中華民國萬歲！"
 CHI.206.t:0 "（臨時文本）交涉破裂：日本拒絕歸還在華領地"
 CHI.206.d:0 "（臨時文本）東京方面悍然拒絕了我國關於歸還東北及沿海租借港口的正當要求。看來和平交涉已無可能，中華民國將不得不訴諸最後的軍事手段！"
 CHI.206.a:0 "（臨時文本）啊？"
