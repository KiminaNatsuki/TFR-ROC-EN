l_english:
 ROC.1.t: "Red, Blue, White"
 ROC.1.d: "The Republic of China has entered its 109th year. To much of the world, it has been caught between a limbo between memory and uncertainty. Its name has been increasingly displaced by a People's Republic that has claimed the mantle of \"China\" for itself. What was once the government of a vast continental nation now endures upon Taiwan, guarding the institutions, symbols and unfinished history of a republic born from revolution. After more than a century of war, exile, dictatorship, and democratization, the question facing the Republic is no longer simply how it will survive, but what it is meant to be.\n\nUnder Tsai Ing-wen, the Democratic Progressive Party has placed an increasingly distinct Taiwanese identity at the heart of national politics. What began as local resistance beneath martial law grew alongside democratization into a movement capable of reshaping the very soul of the Republic. Across the aisle stands the Kuomintang. Founded in the revolutionary age of Sun Yat-sen and hardened through decades of war, the KMT once marched north against the warlords, fought Japan across the mainland, and governed China from Nanjing. The defeat in 1949 drove the KMT across the Taiwan Strait, where dreams of \"Retaking the Mainland\" gradually gave way to the quieter promise of \"Taking Root in Taiwan.\" Yet, the old party has not disappeared. Its local networks remain deep, its organizations entrenched and millions still see the Republic of China not as a relic of the past, but as the nation they inherited.\n\nBlue and Green. Mainlander and Native. Chinese and Taiwanese. For decades, these words have divided families, filled streets, and decided elections. Beneath the campaign banners and television slogans lies a question that neither party can escape: when the ballots are counted, what kind of country will awaken beneath the Blue Sky and White Sun?"
 ROC.1.a: "Long live the Republic of China!"
 CHI.10.t: "The Oil Crisis Reaches Taiwan"
 CHI.10.d: "The fires of Arabia have reached far beyond the desert. As civil war tears through Saudi Arabia and oil prices surge across the world, financial markets have begun to buckle beneath the strain. What first appeared to be another distant crisis has now crossed the seas and struck at the foundations of our economy.\n\n With the collapse of Wall Street, the Taiwan Stock Exchange itself has plunged to levels once thought impossible. The worldwide economy, once bustling with activity, has fallen into absolute chaos. Export orders are disappearing, investment is retreating, and factories that once ran without pause are beginning to fall silent. Across the island, the economy has started to contract. Businesses have cut production and workers are being laid off by the hundreds.\n\nFor half a century, commerce carried Taiwan from poverty to prosperity. Now it has is began to seize. If the crisis continues, our economic miracle may soon become nothing more then a distant memory."
 CHI.10.a: "Someone, do something!"
 CHI.1.t: "The 2020 General Election"
 CHI.1.d: "Public attention is once again focused on the nation's future direction as political factions gear up to secure support. This is more than just an election; it is a public test of current policies and national strategy.\n\nThe voters' choice will directly shape the pace of domestic reform, the direction of foreign policy, and wider Taiwanese society as a whole. The government must address both domestic public sentiment and international attention, balancing short-term political pressure against long-term national interests."
 CHI.1.a: "The DPP holds the line."
 CHI.1.b: "The KMT returns triumphant."
 CHI.2.t: "Patient Zero"
 CHI.2.d: "The plane landed smoothly at Taoyuan Airport. Over the intercom, a flight attendant calmly asked everyone to remain seated and explained the arrival quarantine procedures. Yang Shuhui did not hear a word of it.\n\nHer severe headaches had begun several weeks earlier during a business trip to Wuhan. At first, she assumed she was having trouble adjusting to the new environment and had caught a mild cold. But even after taking all the cold medicine she had brought with her, her symptoms had not improved at all. She leaned against the seat in front of her, trying to ease the pain, then pulled the last tissue from the backpack at her feet and covered her mouth. After coughing, she stuffed it into the sick bag, which was already full of tissues she had used during the flight. After leaving the plane, she reported her condition to the ground crew. Workers in protective suits escorted her to a temporary isolation area. There, a nurse carefully placed the newly collected sample into a testing machine and waited for the result.\n\nA rapid series of beeps suddenly broke the silence. Although Shuhui's vision had become a blur, she would never forget that moment-the frozen expressions on every staff member's face."
 CHI.2.a: "Oh God..."
 CHI.4.t: "Orphan of Asia"
 CHI.4.d: "Following its defeat in the Chinese Civil War, the government of the Republic of China relocated to Taiwan in 1949. At first, it continued to claim the right to represent \"China.\" Yet after losing most of the territory it had once governed, the legitimacy of that claim began to weaken. In 1971, the People's Republic of China replaced the Republic of China as the internationally recognized representative of China. From then on, the Republic of China was pushed away from the center of the international stage and forced to survive on its margins, operating under the names Taiwan or Chinese Taipei.\n\nAt the same time, the country underwent profound changes at home. Its path from martial law to democracy was marked by a long period of authoritarian rule. Earlier generations paid in blood and sacrifice for the freedom and prosperity enjoyed today, though this transformation also came with the gradual erosion of the state's constitutional identity and international standing. Few today still sincerely regard the Republic of China as \"China.\" Yet it was under these very conditions that the country learned to navigate between great powers and secure its existence. This fragile balance, however, now faces new challenges. Amidst an uncertain world, we are soon to witness \"great changes unseen in a century.\"\n\nWe now stand at a turning point in our destiny."
 CHI.4.a: "I look homeward; the road runs long and far."
 CHI.5.t: "Where the Moon Goes, the Bald Guy Follows. Where the Bald Guy Goes, We Follow!"
 CHI.5.d: "As polling stations across the nation finished counting their ballots, the public sat fixed before their TV screens. The vote totals beside each candidate's name continued to flicker and climb as the contest entered its final stage. Each change in the rankings unleashed thunderous cheers inside the rival campaign headquarters. Amid this collision of Blue and Green, only James Soong's orange camp seemed utterly removed from the struggle, calmly holding onto a distant third place.\n\nAfter hours of struggle, fewer than ten thousand ballots remained uncounted. Then came the result no one had expected. At the top of every major news broadcast stood the name of Kuomingtang candidate Han Kuo-yu, holding a lead of nearly thirty thousand votes. Soon afterward, incumbent president Tsai Ing-wen stepped before the cameras. A suffocating silence hung over the DPP headquarters as countless wept. The \"Han Wave\" had arrived. Born in Kaohsiung, he had surged northward all the way into the Presidential Office in Taipei.\n\nBy then, the atmosphere inside Kuomingtang headquarters had reached fever pitch. With his opponent conceding defeat, Han Kuo-yu finally stepped onto the stage that was now his.\n\n\"As President-elect of the Republic of China, I feel not the slightest trace of joy. I understand very clearly that national security and the economy are not questions with simple answers. The Republic has now reached its most dangerous moment in history, and I, Han Kuo-yu, will fulfill my duties and never betray the trust placed in me by the people. For the Republic, I am prepared to be shattered to pieces if that's what it takees!\"\n\n\"I will stand at the very front for the security of this nation and I will stand at the very front in the struggle to being investments back to Taiwan.\n\nI thank the millions of voters of the Republic who have given me the opportunity to serve the country I love. And if I fail, please, don't even let me finish my term. Throw me out yourselves!\""
 CHI.5.a: "The Blue Sky Dawns, the White Sun Rises."
 CHI.6.t: "A Bottle of Water and a Bowl of Braised Pork Rice"
 CHI.6.d: "As always, Mr. Rong rose before dawn. After washing up, he set about preparing the day’s ingredients with the ease of a man whose hands had repeated the same motions for half a lifetime. More than thirty years had passed since he inherited the shop from his father. Born and raised in Taiwan, Rong had never felt much attachment to anything beyond the island he called home. \nThe Yangtze, the Yellow River, all those distant names his father and grandfather used to speak of with such longing belonged to another world, places separated from him by a sea and an entire lifetime. What did any of it have to do with him? During a brief lull around noon, Rong found himself staring absentmindedly at the television as election results poured in. \nOn the screen, a polished politician smiled broadly before a roaring crowd, proudly styling himself the “President of the Common People.”\n\nBrother Rong clicked his tongue and reached for the remote, but before he could change the channel, a familiar voice drifted in from the front of the shop. “Sir, one bowl of braised pork rice, please.” Rong looked up. A middle-aged man had stepped through the doorway, his bald head gleaming beneath the fluorescent lights, a Kuomintang campaign vest thrown over a shirt that looked as though it had survived the better part of a decade, and a half-finished bottle of mineral water clutched in one hand. Rong froze. It was Han Kuo-yu, the President-elect of the Republic of China. For a moment he could only stare, wondering what on earth had brought the soon-to-be president into his little shop. Habit eventually overcame disbelief, and Rong prepared the order as he would for any other customer. Yet after the bowl was placed before him, Han did not immediately leave. Instead, he gestured toward the empty seat across from him and asked Rong to stay awhile and talk.\n\n“Business has been getting harder every year,” Rong complained as he sat down. Han glanced up from his bowl. “It has. Back when I was serving in the army, a bowl of plain noodles barely cost more than ten dollars. These days, you wouldn’t dare walk into the market without five hundred in your pocket.” Rong took a sip of water and shook his head. “Every president says they’re going to change Taiwan. The television keeps showing us charts saying the economy is growing, that everything is getting better. But if everything is getting better, why does living here feel harder every year?” \n\nHan Kuo-yu gave no answer. He simply lowered his eyes, lifted another spoonful of braised pork rice, and ate in silence. For that brief hour, there was no president and no shopkeeper, no office, no rank, no difference in station. There were only two middle-aged men beneath the pale lights of a roadside restaurant, speaking of prices, work, lost years, and an island that had somehow become harder to understand even as both of them had grown old upon it. Outside, Taiwan carried on toward whatever future awaited it."
 CHI.6.a: "Truly a president of the people!"
 ROC.7.t: "Diaoyutai Islands Oil Development Request"
 ROC.7.d: "The Taiwanese government has just submitted a diplomatic request to Japan, proposing the joint development of oil reserves in the waters surrounding the Diaoyutai Islands and requesting access rights to the resources in the area.\n\nTaipei's motivation is clear. As the regional energy shortfall continues, Taiwan urgently needs a stable energy supply to sustain both its high-tech industries and the functioning of society. For Japan, however, this is a more than a matter of economic cooperation It is also a test of geopolitical red lines and Tokyo's position on territorial sovereignty.\n\nAccepting the request would substantially strengthen Japan-Taiwan relations while inevitably escalating territorial disputes with China. Rejecting it, on the other hand, risks driving the two sides further apart."
 ROC.7.a: "For the sake of regional stability, we must refuse."
 ROC.7.b: "Approve Joint Development in the Interest of Strategic Reciprocity."
 ROC.8.t: "Refusal from Tokyo"
 ROC.8.d: "The Japanese Ministry of Foreign Affairs has replied to our request for oil development rights around the Senkaku Islands. Unsurprisingly, given the complex situation in East Asia and the CCP's persistent claims of \"territorial sovereignty,\" Tokyo has concluded that it cannot support any form of Taiwanese development project in the surrounding waters.\n\nThe Ministry of Foreign Affairs has expressed regret over the decision and advised us to pursue alternative sources of energy."
 ROC.8.a: "What a pity."
 ROC.9.t: "Approval from Tokyo"
 ROC.9.d: "As expected, the Japanese government has announced its approval for Taiwanese oil exploration in the waters surrounding the Senkaku Islands. Under the agreement, Taiwan will will receive partial extraction rights to the crude oil reserves in the area, alongside technical assistance and expertise provided by Japan.\n\nAlthough the move has drawn fierce condemnation from CCP media, its benefits are clear. Taiwan-Japan relations has been significantly strengthened, while provided Taiwan with a far more secure foundation for its future energy supply."
 ROC.9.a: "The Dawn of a New Energy Era!"
 ROC.10.t: "South China Sea Joint Oil Exploration Request"
 ROC.10.d: "The Taiwanese government has just submitted a diplomatic request to mainland China, proposing the joint development of oil reserves in the waters surrouding the South China Sea and requesting access rights to the resources in question.\n\nTaipei's motives are clear. As the regional energy shortfall continues, Taiwan urgently needs a stable energy supply to sustain both its high-tech industries and the functioning of society. For the mainland, however, this proposal goes beyond economic cooperation. It is also a test of geopolitical red lines and the principles of territorial sovereignty.\n\nAccepting the request would substantially improve cross-strait relations, but would almost certainly intensify territorial disputes with neighboring countries. Rejecting it, on the other hand, risks driving the two sides of the Strait even further apart."
 ROC.10.a: "\"Taiwanese?\" Never heard of them."
 ROC.10.b: "Born of the same root..."
 ROC.11.t: "Refusal from Beijing"
 ROC.11.d: "Beijing has responded to our request for the joint development of oil resources in the South China Sea. Unsurprisingly, given the increasingly complex situation in East Asia and the CCP's insistence of questions of \"territorial sovereignty,\" the mainland government have concluded that they cannot support any form of Taiwanese development project in the area.\n\nThe Ministry of Foreign Affairs has expressed regret over the decision and advised us to seek alternative energy solutions."
 ROC.11.a: "\"Chinese?\" Never heard of them either."
 ROC.12.t: "Approval from Beijing"
 ROC.12.d: "To our surprise, the mainland Chinese government has agreed to our request for joint oil development in the South China Sea. The Taiwanese government will secure extraction rights for a portion of the region's crude oil alongside technical support from mainland China.\n\nAlthough the move has provoked fierce condemnation from media in Vietnam, the Philippines, and other neighboring countries, it has significantly eased cross-Strait relations. More importantly, access to these offshore reserves has greatly strengthened the security of Taiwan's energy supply."
 ROC.12.a: "Why must kindred turn upon kindred?"
 ROC.13.t: "One Night"
 ROC.13.d: "At the threshold of summer, a clear moon always seems to hang above the world like something laid gently upon a pillow. Its pale light passes through the boundless dark, through depths without end, and settles softly across the earth. Beneath that crystalline glow, the lingering thoughts of those below seem laid bare until nothing remains hidden, dissolving instead into a faint and weightless mist. A distant mist, resting upon the mountains.\n\nOld Xia swallowed several painkillers. The ache in the joints of his lower legs had kept him tossing and turning for decades, and these past few days in the mountains had awakened the old affliction more often than usual. He sighed, gathered himself, and pushed open the weathered brown wooden door, only to find the moonlight waiting for him on the other side.\n\nEverything around him was clear and still. The world looked much as it always had, only veiled beneath the faint shadow of the moon.\n\nOld Xia raised his head and studied the slender hook of the moon. Then, slowly, he stepped forward and wandered deeper into the bamboo grove, following the moonlight as it drifted along the stone path and slipped between the leaves. The nights between spring and summer were neither stifling nor restless. Now and then, a cool breeze passed through, setting the bamboo leaves whispering above him and stirring the folds of his faded clothes and the few withered strands of hair upon his head.\n\nDong... Dong... Dong...\n\nThe distant tolling of a bell drifted through the bamboo and lingered upon the wind. There was something almost sacred in such a scene. Faced with a wind like this, a moon like this, a path like this, a grove like this, the sages of old could scarcely help but think of themselves, of mankind, of all beneath Heaven, of righteousness, duty, and the world itself. From the remotest reaches of antiquity to whatever lay immediately before their eyes, there seemed nothing that could not be gathered into such a moment.\n\nOld Xia felt something tighten within his chest. He was no sage, yet when he looked back upon the greater part of his life, it seemed little different from those old stories passed from mouth to mouth among ordinary people over tea, told and retold simply to fill an idle afternoon.\n\nEvery tragic story, after all, seemed to possess a protagonist stubborn enough to endure. Was bamboo not the same? For most of its life it remained unseen and unremarkable, and then, all at once, it surged toward the heavens, hardening joint by joint, leaf by rustling leaf, taking form, multiplying, breaking through the earth again and again. A bamboo forest was a lifetime unto itself.\n\nOld Xia sat upon the stone bench at the deepest point of the grove and quietly let the wind pass over him. The stillness made him think of his mother. Of all the regrets a man gathered over a lifetime, perhaps she was the one wound he had never managed to carve from his heart. Mother, mother. Her embrace had been so warm. He could lie there, and an entire day would quietly disappear between strands of her hair, between the gentle rhythm of her hand patting the back of her beloved child, between the broken syllables of a boy only beginning to speak. And all the while, without anyone noticing, those passing hours carved marks that would never fade into the hearts of a handful of people: her husband, her own mother, her friends, her beloved child. Old Xia remembered the faint lines already beginning to gather upon her face when he left.\n\nHe smiled, choking back a sob as his body trembled. He was an old man now, yet the memory remained impossibly clear, as though a train that had spent a lifetime gathering speed had suddenly begun to slow, and only when he turned to look behind him did the force of all those vanished years strike at once, leaving him utterly helpless. Once again, he was only that little boy who had done something wrong and lingered outside because he was too frightened to go home and face his mother.\n\nOld Xia rose. His body suddenly felt strangely light, while the wind had grown stronger. He remembered what he had once told his son: no matter what happened, he was to be buried on the mainland. He had long known that he himself would never return, but perhaps what made a person most human was precisely this capacity for regret, and the greed to ask for just a little more than life was willing to give. He had been selfish, terribly selfish, asking his son to complete after his death the journey he himself had never been able to make.\n\nOld Xia's breathing gradually softened, and his eyelids grew heavy. He lowered himself among the shadows of the bamboo. Moonlight poured down around him, dancing between the leaves, and the sky was beautiful that night. Somewhere between waking and sleep, he thought he heard his mother's voice calling him home.\n\nThe child who had once been too afraid to return was finally going home, back to his mother's side."
 ROC.13.a: "Nothing lasts forever."
 ROC.19.t: "The Redemption of a Prodigal Son."
 ROC.19.d: "In the latest round of senior personnel changes announced by the Republic of China Armed Forces, Kung Nai-te has been appointed deputy commander of the Army’s Sixth Corps and promoted to lieutenant general. With this promotion, Kung becomes the first man in the history of the Republic of China Armed Forces to rise from the ranks of the volunteer enlisted force to three-star command, a journey that began not in an academy or behind a polished desk, but among the ordinary soldiers of the Army.\n\nKung has often described his younger self as a “wayward youth.” His student years were marked more by restless nights than disciplined study. Sharing a dormitory room with his elder brother, he frequently spent his evenings in clubs and was no stranger to street fights. His life changed course only when his military draft notice arrived. What began as compulsory service soon became something more. Kung initially sought to remain in uniform as a noncommissioned officer, but his application was rejected. Undeterred, he entered a reserve officer training program in 1992, opening the path that would eventually lead him into the professional officer corps and to a commission as a second lieutenant.\n\nThroughout the decades that followed, Kung distinguished himself through sheer ambition, discipline, and an almost stubborn refusal to remain ordinary. On one occasion, he spent an entire night repeatedly field-stripping a machine gun until every movement had become instinct. Years later, as commander of the ROC Army’s 586th Armored Brigade, he earned a reputation for leading from the front and for taking the welfare of his soldiers as seriously as their combat readiness. His ascent from the enlisted ranks to lieutenant general has since become more than a personal achievement. To the men and women serving beneath him, it stands as proof that rank need not be destiny, that a common soldier may still climb through perseverance and merit until, one day, he stands among the highest commanders of the Republic."
 ROC.19.a: "Our nation needs more talent like this."
 ROC.20.t: "Davos Youth Leadership Camp"
 ROC.20.d: "Chen Tzu-hsuan took the presentation remote and stepped forward to deliver the final segment of her team’s presentation. Before her sat a hall filled with policymakers, economists, and leading academics from across Europe and North America, and despite herself, she felt a flicker of nervousness. Yet her team had spent days preparing for this moment. They had rehearsed every slide, refined every argument, and weighed every word. This was their opportunity to show the world what Taiwan’s younger generation could offer. When the final slide faded from the screen, the hall erupted in applause. Tzu-hsuan lowered the remote and returned to her place beside her teammates. Together, they stood beneath the stage lights and waited with bated breath for the panel’s final assessment.\n\n“First, I would like to thank our young delegates from Taiwan for joining us here at the World Economic Forum. It is a privilege to see so many talented young people gathered here today,” said an elderly man as he took the microphone. “Allow me to introduce myself. My name is Klaus Schwab. Your report, ‘Vision for a New World,’ resonates deeply with me, particularly in its emphasis on sustainability. Taiwan has already made considerable progress in environmental policy, but as I understand it, there remains some distance to travel compared with Europe, North America, and even China. This is particularly evident in areas such as housing and food consumption, where older customs and deeply rooted social attitudes continue to shape everyday life. If Taiwan is to complete this transition, how do you propose overcoming these obstacles?”\n\n“Going forward, we hope to greatly expand public housing,” Tzu-hsuan replied as she accepted the microphone. “At the same time, we intend to make use of emerging metaverse technologies to gradually reshape patterns of consumption, including the way people think about food and diet. If these tools are used properly, we believe Taiwan can move beyond the limitations of the old model, build a more sustainable society, and secure its place within the emerging global order.” For a moment, the hall was silent. Then applause rolled across the chamber like thunder. Hands rose throughout the audience as policymakers and academics eagerly competed for the chance to question the young delegates. Beneath the brilliant lights of the forum, surrounded by talk of sustainability, technology, and progress, the architecture of a new world was already beginning to take shape."
 ROC.20.a: "\"I understand. Thank you for your reply.\""
 ROC.21.t: "Trump Announces Military Aid to Taiwan"
 ROC.21.d: "With tensions across the Taiwan Strait continuing to mount, U.S. President Donald Trump announced at a press conference that his administration would provide Taiwan with an “unprecedented package of defensive military assistance.” The package would include air-defense missiles, radar systems, unmanned aircraft, and a limited quantity of anti-ship weaponry. “Taiwan is fighting for freedom,” Trump declared. “The United States will not stand idly by.”\n\nThe announcement immediately drew international attention. While bipartisan voices in Congress rallied behind the decision, the Chinese Foreign Ministry issued a “strong condemnation” and warned Washington not to “play with fire.” The Pentagon, meanwhile, stated that it would review the necessary delivery mechanisms, while stressing that all military assistance provided to Taiwan would remain defensive in nature and fall within the framework of existing U.S. law. The words were measured, the legal language carefully chosen, but across the Pacific, preparations were already underway.\n\nSoon afterward, American cargo vessels began docking at Kaohsiung. Units including the Army’s 58th Artillery Command, the Air Force Tactical Reconnaissance Group, the 4th Tactical Fighter Wing at Chiayi, the 5th Tactical Composite Wing at Hualien, and the Navy’s 256th Squadron began taking delivery of a formidable array of new weapons. HIMARS multiple launch rocket systems, SLAM-ER extended-range air-to-surface missiles, MQ-9B SeaGuardian unmanned aircraft, Mk 48 Mod 6 Advanced Technology heavyweight torpedoes, and Harpoon Coastal Defense Systems were unloaded from American ships and dispersed across the island. Within days, Taiwan’s ability to strike at approaching fleets, reinforce its coastline, and deny an enemy control of the surrounding seas had been transformed. More than weapons had arrived at Kaohsiung. With them came something Taiwan had been desperately searching for: confidence that the island could still be defended.\n\nBeijing erupted in fury. The Taiwan Affairs Office and Foreign Ministry held successive press conferences denouncing the deliveries and issuing increasingly severe protests, while the People’s Liberation Army began applying pressure of its own. PLAN vessels repeatedly crossed the median line of the Taiwan Strait, and PLA aircraft conducted further sorties around Taiwan, probing the Republic’s defenses and testing its resolve. The ROC Armed Forces answered each incursion in turn, scrambling aircraft, dispatching warships, and conducting repeated denial operations to prevent the pressure campaign from becoming something worse. Day after day, ships and aircraft approached one another across an ever-narrowing margin for error. The Strait had not yet become a battlefield, but increasingly, it was beginning to resemble one.\n\nTaiwan’s Ministries of Foreign Affairs and National Defense expressed their gratitude to the United States for delivering the newly purchased equipment with exceptional speed. The rapid arrival of the weapons had strengthened both the island’s defenses and the confidence of those tasked with holding the line. Yet even as the first shipments were distributed among Taiwan’s armed forces, officials in Taipei were already looking ahead. If Washington remained willing, they hoped that another package could follow in the coming year. For an island living beneath the shadow of invasion, there could never be too many arrows in the quiver."
 ROC.21.a: "The Arsenal of Democracy truly lives up to its name."
 ROC.22.t: "Pelosi Visits Taiwan"
 ROC.22.d: "After arriving in Taipei aboard a U.S. government aircraft, House Speaker Nancy Pelosi addressed lawmakers at the Legislative Yuan. In her remarks, she reaffirmed Washington’s support for Taiwan’s democratic system, declaring that “Taiwan is not alone” and calling for an even closer relationship between Taipei and Washington. To her hosts, the visit was a powerful gesture of solidarity. To Beijing, it was something far more dangerous.\n\nThe People’s Liberation Army Eastern Theater Command responded almost immediately, announcing the beginning of “joint combat exercises around Taiwan.” Naval and air forces converged upon the waters surrounding the island as large-scale live-fire drills began, rehearsing joint blockade operations, breakthrough strikes against defended targets, and wide-area denial. Multiple ballistic missiles crossed over Taiwan itself, forcing the ROC Armed Forces to raise their air-defense readiness and closely monitor the movements of Chinese aircraft and warships. What Beijing called an exercise carried all the familiar outlines of something more ominous: the rehearsal of an encirclement.\n\nThe escalation sent a shock through the international community. Governments differed in the language of their responses, some condemning the exercises outright while others called for restraint, but few failed to recognize what had changed. The visit had lasted only a short while; the consequences would linger far longer. Across the Taiwan Strait, another line had been crossed, and relations between Beijing and Washington descended one step further into hostility."
 ROC.22.a: "A toast to Taiwan-US friendship!"
 taiwan.33.t: "Second Wave of Missile Strikes"
 taiwan.33.d: "The war of life and death has once again descended upon the soil of the Republic of China.\n\nOnly days after the outbreak of the Fourth Taiwan Strait Crisis, missiles from the Mainland struck our key infrastructure and cities for the first time. The Ministry of National Defense is mobilizing the reserves and organizing the defense with all possible speed, yet a second wave of missile attacks has already fallen upon us, this time crippling much of our administrative and communications capacity.\n\nBut the surviving radar stations have detected something even more horrifying. Countless amphibious assault ships and their escorts are rapidly closing in on our coasts, and the battle for the beaches is now at hand. At this moment, there can no longer be any doubt. The Fourth Taiwan Strait Crisis is over. The Taiwan Strait War has begun.\n\nThough the armed forces of the United States are absent, we do not stand alone. Intervention forces from the PDTO have entered the struggle in full and are now assisting in the defense of our homeland across every theater. Together with our own armed forces, they stand fast along the shoreline, prepared to defend our territorial sovereignty to the death.\n\nNow we must rise, resist, and never yield before the Red Giant. Should we fail, the flame of Chinese democracy will be extinguished forever."
 taiwan.33.a: "Stand and Fight!"
 ROC.34.t: "Military Aid from Tokyo and Canberra"
 ROC.34.d: "In the wake of the invasion of Taiwan, Tokyo passed an emergency cabinet resolution authorizing the Self-Defense Forces to begin an immediate military airlift to the island. C-2 and C-130 transport aircraft lifted off from bases across Okinawa and Kyushu for days without pause, carrying air-defense system components, spare parts for anti-ship missiles, tactical communications platforms, and unmanned reconnaissance equipment across the East China Sea. At the same time, vessels of the Japan Maritime Self-Defense Force moved into the surrounding waters, conducting escort and intelligence-support missions to keep the transport corridors open. What had begun as political solidarity was rapidly becoming something far more tangible: ships, aircraft, weapons, and men moving westward beneath the shadow of war.\n\nCanberra followed soon afterward with an additional package of its own. The Australian Defence Force launched a major logistical deployment, with C-17 strategic transports staging through Darwin and Guam before descending upon airfields across northern and southern Taiwan. Their cargo holds carried batches of man-portable air-defense systems, anti-armor weapons, field radars, ammunition, and engineering equipment, all desperately needed by units already preparing to meet the enemy at the coast. Australian military advisers and technical personnel accompanied the shipments, helping integrate unfamiliar equipment, train Taiwanese personnel in its use, and establish a joint coordination center with the Ministry of National Defense.\n\nFrom that center, weapons and supplies were hurried onward to every active theater. Crates were opened on runways, missiles were distributed directly to frontline formations, and technicians worked through the night beneath the roar of transport aircraft coming and going overhead. Japan and Australia had chosen not merely to watch Taiwan fight. They had begun feeding the island the tools with which it might survive."
 ROC.34.a: "Arigatou!"
 ROC.35.t: "Japan and Australia Sends Major Military Aid"
 ROC.35.d: "In the wake of the invasion of Taiwan, Tokyo approved a series of emergency military aid measures through an extraordinary cabinet resolution. Large numbers of C-2 and C-130 transport aircraft were dispatched from bases in Okinawa and Kyushu, conducting continuous airlift operations over several days to deliver air-defense system components, spare parts for anti-ship missile systems, tactical communications platforms, and unmanned reconnaissance aircraft. At the same time, vessels of the Japan Maritime Self-Defense Force began carrying out escort and intelligence-support missions in the surrounding waters, securing the transport routes upon which the island’s survival increasingly depended.\n\nCanberra soon followed with an expanded support package of its own. The Australian Defence Force launched one of its largest logistical deployments, pushing its airlift capacity to the limit as C-17 strategic transports staged through Darwin and Guam before delivering batches of MANPADS, anti-armor weapons, field radar systems, ammunition, and engineering equipment to airfields across northern and southern Taiwan. Australian military advisers and technical personnel accompanied the shipments, assisting with equipment integration and operational training. A joint coordination center was also established with Taiwan’s Ministry of National Defense, allowing newly arrived supplies to be distributed rapidly to each theater of operations. Across the island, foreign aircraft descended one after another, their cargo holds carrying not merely weapons and machines, but precious time for a nation fighting to remain alive."
 ROC.35.a: "Arigatou gozaimasu."
 ROC.36.t: "National Day of the Republic of China"
 ROC.36.d: "October 10 marks the National Day of the Republic of China, commemorating the outbreak of the Wuchang Uprising in 1911 and the founding of the Republic that followed. Established as a national observance in the early years of the Republic, the holiday has endured through revolution, war, retreat, democratization, and the passing of generations. It commemorates not only the birth of a republican state, but also the inheritance of constitutional government and the ideals upon which the Republic was founded, offering the nation a moment to look back upon the long road that brought it to the present.\n\nAcross Taiwan, flag-raising ceremonies and public celebrations are held throughout the day. A major National Day ceremony takes place before the Presidential Office Building, where the president addresses the nation, reviewing the Republic’s progress and setting out its course for the years ahead. Depending on the year’s arrangements, the government may also organize military parades or large-scale public performances, with aerial formations crossing the skies above Taipei and fireworks and light displays illuminating city landmarks after nightfall. When the holiday coincides with a long weekend, concerts, sporting events, cultural exhibitions, and other public festivities fill the calendar, carrying the celebrations far beyond the capital.\n\nOverseas Chinese communities and the Republic’s diplomatic missions likewise hold receptions and commemorative ceremonies, joined by representatives of allied and friendly nations. Public opinion may differ, and the meaning of the Republic’s history may be interpreted in many ways, but on National Day the continuity of the state and the endurance of its institutions are placed unmistakably on display. More than a century after the first shots were fired at Wuchang, the flag still rises, the institutions still function, and the Republic still endures. For all that has changed, October 10 remains the day upon which the nation remembers that it survived."
 ROC.36.a: "Long live the Republic of China!"
 ROC.37.t: "February 28th Incident Memorial Day"
 ROC.37.d: "In 1947, amid the turmoil of postwar political transition and social disorder, a confrontation sparked by the enforcement of cigarette controls ignited protests that rapidly spread across the island. The suppression and subsequent pacification campaigns that followed saw countless civilians, intellectuals, and local elites arrested, disappeared, or killed. The wounds left by those months did not fade with the passing of the crisis. They became part of Taiwan’s political inheritance, shaping the course of its society and leaving an indelible mark upon the memories of generations to come.\n\nThe February 28 Incident is therefore more than a chapter of history. It remains an enduring debate over responsibility, human rights, and the relationship between the state and those it governs. Following the lifting of martial law and the advance of democratization, government archives were gradually opened, memorials and museums were established across the island, official investigations were undertaken, and compensation mechanisms were created for victims and their families. Public sentiment surrounding the anniversary remains particularly sensitive. Some stress the necessity of historical and transitional justice, while others fear that the politicization of memory may only deepen old divisions. Between grief, accountability, and competing interpretations of the past, February 28 has become a day upon which Taiwan is compelled to confront not only what happened, but what responsibilities a state owes to its own people."
 ROC.37.a: "A moment of silence for the victims."
 ROC.40.t: "Let Bygones Be Bygones"
 ROC.40.d: "Amid the flames of war consuming Taiwan, Tsai Ing-wen, who under ordinary circumstances would have remained sheltered deep within a bunker, appeared openly in Taipei. At her side stood not only leaders from other political parties, but even her longtime political rival, Han Kuo-yu. The atmosphere inside the meeting room was grave. Representatives of three parties that had spent years tearing into one another across the floor of the Legislative Yuan now gathered around the same briefing document, speaking in hushed voices over the same maps, the same casualty figures, and the same approaching enemy.\n\nHan attended as one of the Kuomintang’s most prominent political figures. He made his position clear: party competition could continue when the war was over, but on the question of national survival, there could be only one front. He volunteered to assist in coordinating the movement of supplies throughout southern Taiwan and integrating civilian mobilization networks into the broader war effort. Tsai replied that restoring public confidence was now the government’s foremost priority, and pledged the full support of the administrative apparatus for any genuine cross-party cooperation. Soon afterward, the two appeared together before the cameras. There were no campaign slogans, no accusations, no rehearsed attacks. Only a single message remained: whatever divided them before, Taiwan would resist together.\n\nIn the days that followed, those words were given substance. Han personally coordinated donations of generators and medical equipment from local businesses, while the DPP central organization used its network of party officials and elected representatives to register, distribute, and deliver the supplies where they were most urgently needed. The media later captured the two speaking briefly while visiting troops near the front. Gone were the bitter exchanges of election season and the venom of legislative combat. In their place were quiet words of encouragement offered to exhausted soldiers holding the line. For many watching at home, the image represented something greater than political reconciliation. It was a reminder that beneath the banners of Blue and Green, both sides still possessed something they were unwilling to surrender.\n\nThe shadow of war had not lifted, yet the Legislative Yuan took the rare step of passing a cross-party resolution supporting emergency appropriations and legislation for reserve force reform. Photographs of the two leaders shaking hands inside the chamber spread rapidly across the island. For years, their parties had fought over identity, policy, history, and the future of the Republic. But in an hour when all those arguments risked being rendered meaningless by defeat, they chose to stand upon the same line. For once, there was no Blue Taiwan and no Green Taiwan. There was only Taiwan, and there was still a country left to defend."
 ROC.40.a: "At This Moment, We All Fight to Defend Our Homeland."
 ROC.41.t: "Chaos in the Phillipines"
 ROC.41.d: "Over the past several weeks, the internal security situation in the Philippines has deteriorated at an alarming pace. The National Democratic Front has launched successive offensives across northern Luzon, overrunning towns and key transportation nodes while striking power grids and communications infrastructure in an effort to erode the central government’s control. At the same time, the Moro Islamic Liberation Front has dramatically expanded its armed operations across Mindanao, seizing several towns and areas surrounding major ports before declaring itself to be in a state of war.\n\nThe Philippine government has responded by imposing martial law around Manila and other strategically vital regions in the center of the country, committing the bulk of the Army to a series of localized clearing operations. Yet the government’s forces are increasingly stretched thin. With units scattered across multiple fronts and supply lines repeatedly severed, advances have stalled and several isolated garrisons have been forced to contract their defensive lines. The situation has been made still more precarious by the Navy’s declaration of neutrality. Restricting itself to maritime patrols and humanitarian evacuations, it has refused to intervene in the fighting on land, sharply limiting the government’s ability to move troops and supplies along the coast.\n\nArmed clashes are now erupting across the archipelago. Large sections of the national transportation network have ceased to function, while local governments in contested regions are slipping into paralysis. Roads are cut, ports are contested, communications fail without warning, and the authority of Manila grows weaker with every passing day. Unless the government can restore control over the country’s key regions soon, what began as a series of scattered uprisings may consume the Philippines in a war from which the old order will not easily emerge."
 ROC.41.a: "Surely It Can’t Get Any Worse..."
 ROC.42.t: "Civil War in the Philippines"
 ROC.42.d: "The crisis in the Philippines has now passed beyond the threshold of localized unrest and erupted into full-scale civil war. Across the mountains of northern Luzon, the National Democratic Front has consolidated a continuous zone of control, proclaiming the establishment of the National Democratic Front of the Philippines while systematically severing highways, sabotaging energy infrastructure, and cutting the arteries that once bound the archipelago together. Government forces, meanwhile, remain entrenched throughout Metro Manila and a number of heavily fortified military bases, calling up reservists and committing what strength remains in an increasingly desperate effort to reopen transportation corridors and restore some semblance of administrative order.\n\nOn Mindanao, the Moro Islamic Liberation Front has assumed direct control over local government institutions across several provinces and established an independent command structure of its own. Fierce fighting with government troops has engulfed towns, airfields, and port districts, leaving critical transport infrastructure in ruins and pushing regional supply networks toward collapse. The Philippine Navy has responded by declaring a posture of armed neutrality, confining its operations to blockades, maritime patrols, and evacuation missions along the principal sea lanes while refusing to provide direct fire support to any faction. The result is a country divided not only by front lines on land, but by an uneasy maritime standoff at sea, with entire regions increasingly isolated from one another.\n\nThere is no longer any agreement over who governs the Philippines, only rival declarations of legitimacy backed by rifles and artillery. Every faction now proclaims itself the sole lawful authority of the nation and brands all others as rebels, traitors, or usurpers to be crushed. The flag remains the same, the name of the country remains the same, but beneath them several governments now claim the right to rule the same islands. The struggle is no longer merely over territory. It is over which Philippines will be left standing when the guns finally fall silent."
 ROC.42.a: "Absolute madness."
 ROC.43.t: "The Philippines Reunified Under the National Democratic Front"
 ROC.43.d: "After a long and bitter armed struggle, the National Democratic Front has secured control over the major cities and transportation hubs of Luzon, the Visayas, and Mindanao. The remaining armed factions have either collapsed outright or accepted incorporation into the victorious order. In Manila, the NDF swiftly proclaimed the establishment of the “Democratic Republic of the Philippines,” forming a provisional central committee to assume control over the nation’s administrative institutions, armed forces, and surviving machinery of state. The civil war is over. In its place stands a new republic, born from the wreckage of the old.\n\nThe naval command, which had maintained its neutrality throughout the conflict, soon issued a joint declaration recognizing the new regime as the sole legitimate government of the Philippines. All fleets and maritime forces were ordered integrated into the Republic’s unified command structure, with the admirals emphasizing the restoration of national unity and the protection of the sea lanes upon which the archipelago depends. With the Navy’s submission, the last great institution of the former order has passed beneath the authority of Manila once more.\n\nThe newly established Democratic Republic of the Philippines subsequently issued a diplomatic communiqué announcing its accession to the East Asian Defense Initiative. Security cooperation, intelligence-sharing arrangements, and regional coordination mechanisms are now being established with the organization’s member states. The decision marks a decisive break with the strategic posture of the former government. From this point onward, the Republic’s military development and foreign policy will be shaped around a framework of regional collective defense. The war has ended, but the Philippines has not returned to the world it knew before. It has emerged from the flames under a new banner, with new allies, and with a new place in the order of East Asia."
 ROC.43.a: "A Philippine Spring?"
 ROC.44.t: "Government Forces Reunify the Philippines"
 ROC.44.d: "After a long and bitter armed conflict, Philippine government forces have gradually retaken the mountainous regions of northern Luzon and the major cities of Mindanao. The remaining armed factions have either collapsed or accepted integration into the restored national order. In Manila, the machinery of central government has begun to function once more, as the Presidential Palace and Congress formally declared the full restoration of the constitutional order of the Republic of the Philippines. The civil war has ended. Now begins the slower and more difficult task of rebuilding a nation scarred by years of bloodshed.\n\nThe naval command, which had maintained its neutrality throughout the conflict, soon issued a joint declaration recognizing the restored government in Manila as the sole legitimate authority of the Philippines. All fleets and maritime forces were ordered reintegrated into the Republic’s unified command structure, with the Navy emphasizing the preservation of national unity and the security of the sea lanes upon which the archipelago depends. With the fleet returning to the national fold, one of the last great fractures left by the civil war has finally begun to close.\n\nThe restored Republic of the Philippines subsequently issued a diplomatic communiqué announcing its accession to the Pacific Defense Treaty Organization. Security cooperation, intelligence-sharing mechanisms, and military coordination arrangements are now being established with the organization’s regional member states. The decision marks a decisive shift in the country’s strategic direction. From this point onward, Philippine military development and foreign policy will increasingly revolve around a framework of collective regional defense. The Republic has survived its trial by fire, but it will not return to the world that existed before the war. From the ruins of civil conflict, Manila now looks outward once more, seeking security not in isolation, but among the nations of the Pacific."
 ROC.44.a: "Business as usual then?"
 ROC.45.t: "The Philippines Reunified Under the Moro Islamic Liberation Front"
 ROC.45.d: "After a long and brutal armed conflict, the Moro Islamic Liberation Front has secured military control over Mindanao, the Visayas, and the key cities of Luzon. The remaining armed factions have either collapsed or accepted incorporation into the victorious order. In Manila, the Front’s leadership council proclaimed the establishment of the “Islamic State of the Philippines,” abolishing the constitutional framework of the former Republic and replacing it with a new state system centered upon religious law. The national political and military apparatus has since been reorganized beneath the authority of the new regime.\n\nThe naval command, however, has refused to recognize the government in Manila. Having maintained its neutrality throughout the civil war, the Navy issued a declaration denouncing the new regime as illegitimate and rejecting its claim to sovereignty over the entire archipelago. The guns on land may have fallen silent, but the war for the Philippines is not yet truly over.\n\nThe newly established Islamic State of the Philippines subsequently announced the adoption of an increasingly hardline religious political program, signaling a decisive break with the institutions and principles of the former Republic. Meanwhile, reports have begun to emerge of weapons, advisers, and military personnel from both the East Asian Defense Initiative and the Pacific Defense Treaty Organization being covertly transferred to the Philippine naval government, which had until now remained conspicuously silent. Manila may have conquered the islands, but beyond the horizon, another Philippines is already being armed."
 ROC.45.a: "The End of the Philippines..?"
 ROC.46.t: "The Philippines Reunified Under a Naval Junta"
 ROC.46.d: "After successfully crushing the remaining Islamist extremist forces, the Philippine Navy Command retook Manila and reasserted control over the country’s major islands. In the capital, the naval leadership formally proclaimed the restoration of the Republic of the Philippines, declaring that the constitutional state would be rebuilt from the wreckage of civil war. Until that process could be completed, however, a naval junta would assume temporary authority over the machinery of government and oversee the transition back to national order.\n\nSoon afterward, the junta issued a diplomatic communiqué announcing the Philippines’ formal accession to the Pacific Defense Treaty Organization. The new authorities reaffirmed their commitment to security cooperation with Japan and the Republic’s regional partners, placing particular emphasis on the defense of vital maritime corridors and the restoration of stability across the surrounding seas. The Republic has returned, but for now, it returns beneath the watch of the fleet."
 ROC.46.a: "Order Returns to the Pacific"
 ROC.47.t: "The Philippines Reunified Under a Naval Junta"
 ROC.47.d: "After successfully crushing the remaining Islamist extremist forces, the Philippine Navy Command retook Manila and reasserted control over the country’s major islands. In the capital, the naval leadership formally proclaimed the restoration of the Republic of the Philippines, declaring that the state would be rebuilt from the wreckage of civil war. Until that transition could be completed, however, a naval junta would assume temporary authority over the machinery of government and oversee the restoration of national order.\n\nSoon afterward, the junta issued a diplomatic communiqué announcing the Philippines’ formal accession to the East Asia Defense Initiative. The new authorities affirmed their commitment to security cooperation with the region’s defense partners, placing the restored Republic firmly within an emerging framework of collective security in East Asia. The guns of the civil war have fallen silent, but the Philippines will not stand alone in the order that follows."
 ROC.47.a: "A New Strategic Direction"
