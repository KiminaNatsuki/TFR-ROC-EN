 CHI_island_in_one_fate:0 "One Island, One Destiny"
 CHI_island_in_one_fate_desc:0 "We have done it. The Republic of China has survived the hardest moments of this war. When military experts around the world believed we could not hold out for three months, the stubborn resistance of our soldiers on the frontlines proved the bravery and fearlessness of the Republic of China. Now, the Chinese Communist Party's blitzkrieg plan to rapidly annihilate Taiwan has utterly failed. As the People's Liberation Army's offensive gradually stalls, the sanctions suffered by the Chinese government will only mount. When public resentment boils over across the mainland, that will be our moment to celebrate victory!\nMay our Blue Sky, White Sun, and a Wholly Red Earth fly forever in the clear skies!\nMay our Blue Sky, White Sun, and a Wholly Red Earth shine brilliantly forever!"
 CHI_solidify_civil_defence:0 "Solidify Civil Defense"
 CHI_solidify_civil_defence_desc:0 "As a densely populated island, our civilians are continuously exposed to various types of artillery fire. The military defense system is overwhelmed, and the emergency services, which have fallen into complete chaos, are unable to attend to all trapped civilians. Fortunately, we can still rely on the civil defense system built over sixty years. This defense system, created to guard against a mainland invasion, was once considered an unfounded worry. By operating it in coordination with our scattered air defense facilities, we can alleviate the pressure on our collapsing emergency systems while erecting a safety barrier to shield civilians from the flames of war."
 CHI_guerilla_strategy:0 "Guerrilla Strategy"
 CHI_guerilla_strategy_desc:0 "We are incapable of confronting the PLA head-on. Whether in terms of troop equipment, combat experience, readiness levels, or strategy and tactics, we are at a comprehensive disadvantage. In light of this, the General Staff has decided to take a different path: launch guerrilla warfare. Relying on the complex terrain of the island's intricate urban jungles, winding coastlines, steep mountains, and dense forests, we will preserve our living forces and avoid having our armed forces annihilated on the first day of the war. This unconventional warfare, combined with unfavorable terrain and complex environments, will surely make the invaders pay a heavy price for every step forward."
 CHI_disrupt_transportation:0 "Disrupt Transportation"
 CHI_disrupt_transportation_desc:0 "The PLA has successfully landed and is using our docks and ports to receive equipment and supplies, which are then transported to frontline units to replenish battle losses. This is absolutely intolerable. Fortunately, before retreating, our engineering units planted explosives in all core port facilities and key transportation routes, and our missile units are poised to launch precision strikes on the ports at any moment. Even if the enemy intends to repair them, it will take weeks to restore operations. During this time, the PLA trapped in their camps will face cut-off supplies and lose the ability to sustain an offensive, while we can take the opportunity to launch a counterattack and potentially annihilate their scattered small units."
 CHI_hold_the_defence_line:0 "Hold the Defense Line"
 CHI_hold_the_defence_line_desc:0 "Under the enemy's preemptive missile and naval artillery bombardment, our defense system, command structure, and communication network have been completely paralyzed. If we are to turn the tide of the war, we must withstand the fiercest and most brutal bloody offensive in the early stages of the conflict. This delaying period is crucial for restoring logistics and supply capabilities and rebuilding the command system that is on the verge of collapse. To this end, we will focus resources on repairing communication and transportation hubs while ordering all units into a full defensive posture, rather than taking risks to seek opportunities to strike the PLA."
 CHI_appeal_to_the_free_world:0 "Appeal to the Free World"
 CHI_appeal_to_the_free_world_desc:0 "As the United States sinks into the terrifying quagmire of internal strife, the old international order is crumbling before our eyes. But this does not mean that democratic forces will perish alongside this fallen superpower; there are still many bastions and beacons around the world holding high the torch of democracy. Many of these countries, to prevent further decline of their international status, are actively supporting their ideological allies. Major non-NATO allies, remnants of NATO, South Korea, Canada, and other forces are all willing to speak up for us on the international stage, or even take concrete action against China's oppressive power."
 CHI_military_civilian_duty:0 "Military-Civilian Unity"
 CHI_military_civilian_duty_desc:0 "Our island is small and crowded, with almost no strategic depth to speak of; the rear is the frontline. China's brazen launch of this dangerous invasion has fully exposed their disregard for the safety of our civilians. As casualty reports pour in, the defeatist rhetoric touting that \"unification\" would be swiftly resolved without bloodshed has finally been utterly shattered. Having cleared away these distracting voices, we can now fully promote military-civil fusion, allowing the public to jointly sustain the operation of this wartime society."
 CHI_grant_emergency_powers:0 "Grant Emergency Powers"
 CHI_grant_emergency_powers_desc:0 "In this state of war, lengthy bureaucratic procedures will only hinder the executive branch's ability to respond to the crisis. Facing the PLA at our gates, the President will declare a state of emergency, impose martial law, and grant the military greater authority to control the situation. Law enforcement agencies will be temporarily integrated into the military command system. This move will not only suppress enemy collaboration, sabotage, and riots, but also achieve efficient and fair distribution of resources through armed control."
 CHI_engineering_maintenance_brigade:0 "Engineering Maintenance Brigade"
 CHI_engineering_maintenance_brigade_desc:0 "As the bombers and artillery from the PLA pound our ground, our economic activities are either disrupted or completely halted. The most impacted sectors are construction and infrastructure. Fearing targeted strikes that can cause immense damage, construction firms and state-owned companies that provide necessary services have temporarily paused all building and maintenance work, leaving tens of thousands of workers and engineers unemployed, and thus unable to support their families. To use their expertise to our advantage, we can offer job opportunities that will be seen as lucrative even during peacetime, and establish the Engineering Maintenance Brigade. The unit will be able to support us in military engineering projects, allowing us to quickly establish multi-layered fortifications, as well as traverse harsh environments more quickly than that of the Communist forces."
 CHI_withdraw_foreign_exchange:0 "Withdraw Foreign Exchange"
 CHI_withdraw_foreign_exchange_desc:0 "In peacetime, our massive foreign exchange reserves ensured economic stability and currency stability; now, in wartime, this hidden wealth can also be transformed into strategic resources for national defense and economic stabilization. By mobilizing a portion of our foreign exchange reserves, we can not only curb panic in the financial markets and purchase sold-off assets and currency to maintain the basic operation of the wartime economy, but also procure critical armaments to replenish battle losses, ensuring our military maintains the combat capability to counterattack the invaders."
 CHI_unite_the_island:0 "Unite the Island"
 CHI_unite_the_island_desc:0 "The barbaric invasion by the PLA has spread across Taiwan, from Taipei to Kaohsiung, from cities to the countryside, from concrete jungles to tranquil farmlands. Whether in deep-green or deep-blue counties and cities, no one can remain unscathed in the flames of destruction, and no one dares to falsely claim that this war \"has nothing to do with them.\" We must rise up and resist the invaders: when the other side places the lives of millions in peril, will the so-called \"unification\" truly bring us well-being? Only with the entire island united against a common enemy do we stand a chance of winning. Once defeated, we will forever lose our freedom, our democracy, and our blood ties with our democratic allies."
 CHI_wolf_pack_tactics:0 "Wolfpack Tactics"
 CHI_wolf_pack_tactics_desc:0 "As an island nation, our vast fishing industry originally supported tens of thousands of fishermen and countless fishing vessels. Although the war has forced all ships to halt sailing indefinitely, the General Staff has formulated a special plan to break through the PLA's naval blockade. It involves requisitioning small civilian vessels to secretly transport scarce materials to trading partners. Relying on their small and agile characteristics, these ships can both evade radar detection and quickly escape pursuit. Although the transport capacity is insufficient to restart the economy, the critical supplies obtained will be able to sustain the most basic livelihood services, igniting the flame of hope for the people on the island."
 CHI_phantom_legions:0 "Phantom Legions"
 CHI_phantom_legions_desc:0 "Facing the PLA's massive and well-equipped air power, our air force is at a clear disadvantage, resulting in our troops and key facilities suffering day and night air raids. Although we are unable to completely destroy the enemy's bombing capabilities, we can try to lure their firepower. Commanders have proposed an ingenious plan: setting up dummy targets made of cheap materials like balloons and wooden boards across the island to confuse the PLA Air Force, causing them to expend ammunition attacking fake facilities. Although it seems unconventional, the engineering units have confirmed the plan's feasibility and it is ready to be implemented upon approval."
 CHI_taiwan_still_brave:0 "Taiwan is Still Brave!"
 CHI_taiwan_still_brave_desc:0 "We have survived the most brutal and dangerous phase of this conflict, successfully crushing the PLA's scheme for a quick victory. This not only surprised international observers who predicted our rapid collapse but also strengthened the entire population's belief that victory is not out of reach. Now, with the military and civilians united, we vow to defend to the death the right of self-determination stripped away by a great power. As the torch of freedom continues to burn fiercely on the shores of the Taiwan Strait, every Taiwanese can proudly declare: this land remains heroic and unyielding, and we will never give up."
 CHI_taiwan_war_begun_tooltip:0 "The war for the survival of the Republic has begun."
