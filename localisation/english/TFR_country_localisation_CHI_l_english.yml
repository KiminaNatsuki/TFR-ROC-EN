 CHI_reintroduce_nuclear_desc: ""

 CHI_DPP_protest: "Bluebird Movement"

 CHI_DPP_protest_desc: "\"I am not Chinese, I am Taiwanese.\"\n\nAlthough the Kuomintang has won the Republic of China presidential election, the defeated Democratic Progressive Party seems unwilling to let it go. The DPP-led Pan-Green coalition, through its pro-green media, has repeatedly published defamatory content attacking the KMT's governing policies, claiming a \"Blue Dictatorship\" and a \"Second Mobilization for the Suppression of Communist Rebellion.\"\n\nThe KMT's policies face severe difficulties in areas controlled by the DPP, and tensions between the two parties continue to escalate. Despite winning the presidency, the KMT finds that the DPP still controls the mainstream ideological trend in Taiwan. Faced with such a massive independence movement, the KMT's re-Sinicization policies appear to be falling short.\n\nFor historical reasons, the KMT cannot utilize the state apparatus to aggressively crack down on the DPP and its Pan-Green camp, lest they provide the DPP with more evidence of \"KMT authoritarian hegemony.\" However, if left unchecked, this significant trouble will severely hinder the KMT's administration.\n\nSometimes, the outcome of victory feels far trickier to handle than the outcome of defeat..."

