 CHI_test_of_will:0 "Test of Will"
 CHI_test_of_will_desc:0 "\n\n\n\n\n\n\n\n£GFX_CHI_test_of_will_banner\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nSeventy years have passed in a flash, and the fratricidal civil war had come to an end. Our people enjoyed decades of peace and prosperity, but this could not last forever. The vast world is constantly changing, a storm is brewing, and we must face the surging tide head-on.\n\nThe forgotten embers of the civil war are rekindling, and we must fight for our own survival.\n\n§3The Blue Sky and White Sun Shall Never Set§!"
