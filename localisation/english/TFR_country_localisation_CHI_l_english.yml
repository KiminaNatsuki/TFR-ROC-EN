 taiwan.1.t: "The Defiant Island"

 taiwan.1.d: "The skylines of the cities are illuminated brighter than usual by dazzling fireworks. Performers drive concerts to their climaxes, further hyping the crowds. People gathered around the tallest buildings watch in awe as the Moon itself seems overpowered by the rockets' flames, while those in the comfort of their own shelters rejoice as the countdown finally reaches zero-marking the end of the decade.\n\nThe year is 2020. Our leading position in semiconductor manufacturing remains unchallenged. The stock market soars higher than ever, with the TAIEX maintaining over 10,000 points for nearly the entire year. Despite the turbulence caused by the China–U.S. trade war, our robust economy has shown remarkable resilience, with the economic growth rate holding steady at around 3% throughout 2019.\n\nThe new year also signals the conclusion of the presidential election campaigns. President Tsai Ing-wen is seeking a second term, while the main opposition leader, the controversial Han Kuo-yu, continues to gain popularity. James Soong will make his fifth bid for the presidency, though he has also announced that this may be his final attempt.\n\nDiplomatically, our nation continues to lose formal allies due to factors such as Mainland China's expanding global influence, including its Belt and Road Initiative. At the same time, our strategy has shifted toward fostering warm, albeit unofficial, relationships with major powers. The riots in Hong Kong further alienate the pro-unification camp within our borders, and many cite them as evidence of the inevitable failure of the \"One Country, Two Systems\" framework.\n\nAll in all, the brave people of the Taiwan archipelago - including Kinmen and Matsu - are prepared to weather the coming storm and carry forward into the next decade. Although the Ministry of Health and Welfare has reported a new suspected case of atypical pneumonia from Mainland China, surely, that won't be much of an issue."

 taiwan.1.a: "May the journey ahead be smooth for you, Taiwan."

 
 taiwan.2.t: "Secret of the Baltic"

 taiwan.2.d: "Vilnius, Lithuania. The door of the Taiwan Representative Office opened, and Representative Office Secretary Huang Xingjia walked out. He pulled out his phone and called his Lithuanian wife: \"I won't be home for dinner tonight, my superiors assigned an emergency task, please pick up the kids. I love you.\" He put away his phone, put on his hat, and walked towards central Vilnius. At a private hotel, he gave the receptionist a room number and a waiter led him to a private booth deep inside. He pushed the door open, and stiff Chinese greeted him: \"Hello, Mr. Huang.\" The man who spoke was none other than Secretary Nakano of the Japanese Embassy in Lithuania, whom he had met before. They sat down, and Huang Xingjia took a sip from his teacup, saying, \"Secretary Nakano, thank you for the invitation. I wonder what matter requires us to meet secretly here in the distant Baltics to discuss?\"\n\nSecretary Nakano replied: \"I'm sure you know by now that America has fallen into civil war. With American power withdrawn from East Asia, China has become restless. They have increased combat readiness and are eyeing Taiwan, and indeed all of East Asia. I believe the Taiwanese government is also troubled by this. The Ministry of Foreign Affairs ordered us to contact you, hoping to establish communication with the Taipei government without China knowing.\" He pulled out a multi-layered, sealed envelope and handed it to Huang Xingjia. \"Please deliver this to the Taipei government through the most secure channels.\"\n\nFour days later, at the Presidential Office in the Republic of China, the President personally opened the envelope. Inside was a letter detailing Japan's concerns over the situation in East Asia, hoping for strengthened cooperation between the two sides, and mentioning Australia's intent to cooperate as well.\n\nSubsequently, Huang Xingjia held multiple contacts with Japanese and Australian diplomats in Lithuania. The three parties exchanged their intentions and demands regarding the formation of a military alliance—the PDTO. Japan presented its utmost sincerity: if war breaks out, Japan is willing to abrogate the Sino-Japanese Joint Communique, re-establish ambassadorial-level diplomatic relations with the Republic of China, and even recognize the ROC as the sole legitimate government of China.\n\nThus, the framework of the PDTO was built amidst the Baltic sea breeze."

 taiwan.2.a: "A Pacific friendship forged in the Baltic Sea."

 CHI_TY_01_opinion_modifier: "Secrets of the Baltic"


 taiwan.3.t: "Crisis Alliance"

 taiwan.3.d: "The Baltic sea breeze has brought news of an alliance. After multiple contacts between the three parties in Lithuania, this alliance, bonded together by authoritarianism and threats, has finally been firmly forged. To avoid provoking mainland China and to guard against potential Beijing spies, the three nations dispatched their highest-ranking foreign ministry secretaries under the guise of private tourism to Hakone, Japan. There, they would make the final confirmations. In a mountain hot spring inn, Japanese Public Security tightly and secretly secured the premises. The three parties would finalize the alliance agreement here. The agreement read: \"To ensure the security of East Asia, the three parties will form a secret military alliance. Should any party be attacked by an enemy, the other two parties will join in a defensive war.\" It also stated that if the Republic of China is attacked, Japan and Australia will re-establish ambassadorial-level diplomatic relations with it. The three parties received the agreements, kept them safe, and after enjoying the Hakone hot springs, brought them back to their respective countries."

 taiwan.3.a: "The bulwark of East Asia is thus established."

 CHI_TY_021_opinion_modifier: "Alliance in Crisis"

 CHI_TY_022_opinion_modifier: "Alliance in Crisis"


 taiwan.4.t: "2020 Taiwanese Presidential Election"

 taiwan.4.d: "The most important event between Western New Year and Chinese New Year, the 2020 Taiwanese elections, will determine both the legislature and the presidency. The final phase of campaigning resumed after a week of pause due to the tragic Black Hawk helicopter crash on January 2nd, and candidates held their final and largest political rallies in several major cities.\n\nRepresenting the pro-Green camp is the incumbent President Tsai Ing-wen, the first female president of Taiwan and the first to be of indigenous descent. A law professor with a political career spanning back to 2000, her experience and professionalism are often cited by supporters as reasons she is the more qualified choice. Despite a turbulent first term, her approval ratings have been on the rise since July 2019, and many observers are predicting a Green victory.\n\nOn the pro-Blue side is Han Kuo-yu, the current mayor of Kaohsiung, who has faced backlash from city residents for allegedly \"abandoning\" them. Holding a master's degree in law, Han only returned to politics in 2017, making his experience pale in comparison to that of the DPP's candidate. Nonetheless, his supporters argue that the DPP's underperformance has left voters eager for change, with many believing that his unorthodox political style could usher in a new golden era for Taiwan.\n\nJames Soong is also in the race, although most of the public attention he receives comes in the form of jokes rather than serious political engagement.\n\nThe day after an exhausting night of final rallies, citizens across the country head to the nearest polling stations to decide the future of their nation. As night falls and votes are counted, the final result is declared:"

 taiwan.4.a: "Tsai Ing-wen and the Pan-Green take it all!"

 taiwan.4.b: "Han Kuo-yu and the Pan-Blue ascend to power!"

 
 taiwan.5.t: "Tsai Ing-wen Secures Second Term"

 taiwan.5.d: "After a long night of vote counting, and with millions staying glued to their televisions to watch the results unfold, the news channels, along with official sources, have finally declared the winner-that President Tsai Ing-wen secures a second term!\n\nThis was expected by many internal and external observers, as not only does Tsai Ing-wen have more experience and benefit from the preference for re-electing an incumbent president, but her opponent's scandals and multiple public relations disasters also persuaded centrist voters and even Pan-Blue supporters to back Tsai instead.\n\nAdditionally, the DPP also won a majority in the Legislative Yuan, securing around 45% of the votes and 60 seats-enough for control of the legislature. This ensures a smooth term for Tsai Ing-wen and, by extension, the entire DPP.\n\nThis provoked an outcry among a portion of Pan-Blue supporters, who demanded a recount along with a handful of Kuomintang party leaders. However, with Han Kuo-yu openly declaring his acceptance of defeat, these movements quickly died down, and the Republic completed yet another peaceful election."

 taiwan.5.a: "The Green Flag rises into the Sky!"

 
 taiwan.6.t: "Han Kuo-yu Secure the Presidency in an Upset"

 taiwan.6.d: "After a long night of vote counting, and with millions staying glued to their televisions to watch the results unfold, the news channels, along with official sources, have finally declared the winner-that Mayor Han Kuo-yu secures the victory!\n\nMany international and domestic observers were taken by surprise by this outcome, as Tsai Ing-wen had more experience and benefited from the preference for re-electing an incumbent president. However, it seems that Han Kuo-yu's politics have successfully won people's hearts over. Additionally, many centrist voters, disappointed with the DPP, have chosen to back the Pan-Blue in this election to express their dissatisfaction.\n\nOn the other hand, the Kuomintang also took back the legislative branch. With 44% of the popular vote and 62 seats, the KMT was able to re-establish themselves as the majority, reducing the DPP to a minority opposition, ensuring a smooth term for Han Kuo-yu.\n\nA portion of the Pan-Green faction disapproved of the result, claiming that the election was manipulated, and demanded a recount along with a handful of DPP party leaders. However, as Tsai Ing-wen and her team openly sent out a message to the public to accept defeat and congratulate the new president, the protests quickly died down, and the Republic completed yet another peaceful election.\n\nFor Han Kuo-yu personally, since it is forbidden to serve as both mayor and president simultaneously, he is forced to resign as the mayor of Kaohsiung. A by-election will be held within three months to decide the next local government, and the movements that advocated for Han Kuo-yu's recall have subsequently dissolved."

 taiwan.6.a: "The White Sun shines upon the Republic!"

 
