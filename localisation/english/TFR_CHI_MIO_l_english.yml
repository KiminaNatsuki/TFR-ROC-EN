 CHI_AIDC_organization: "Aerospace Industrial Development Corporation (AIDC)"

 CHI_AIDC_organization_desc: "[UNTRANSLATED] 漢翔航空工業股份有限公司是中華民國的航空工業機構，專注於飛機設計、研發與製造。"


# =============================================
