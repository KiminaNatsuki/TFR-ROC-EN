 CHI_american_protection_idea: "American Protection"

 CHI_american_protection_idea_desc: "Depending solely on the ROC Armed Forces, it is obviously impossible to resist the CCP alone. The maintenance of peace relies entirely on US policy, which means the status quo cannot be changed.\n\nThe Seventh Fleet acts as a stabilizing force, maintaining the fragile stability of the Taiwan Strait. However, this strong shield also implies another thing: once the support is lost, the enemy will attack."

 CHI_taiwanese_independence_movement_idea: "Taiwan Independence Movement"

 CHI_taiwanese_independence_movement_idea_desc: "\n\n\n\n£GFX_CHI_taiwanese_independence_movement_banner\n\n\n\n\n\nThe Republic of China can also be referred to as Taiwan. In recent years, it has been referred to as the Republic of China (Taiwan). The above description shows the ideological chaos in this region. Indeed, we are not even recognized as a country internationally, which is exactly the origin of the Taiwan independence movement.\n\nSince withdrawing from the United Nations, the international status of the Republic of China has plummeted. This also allowed local consciousness to sprout, and later it fully took the stage during the democratic movement and gained political power.\n\nNevertheless, those who agree with maintaining the status quo still occupy the vast majority of society, and the road to formal name rectification is still far away."

 CHI_taiwanese_independence_movement_2_idea: "Taiwan Independence Movement"

 CHI_taiwanese_independence_movement_2_idea_desc: "\n\n\n\n£GFX_CHI_taiwanese_independence_movement_banner\n\n\n\n\n\nThe Republic of China can also be referred to as Taiwan. In recent years, it has been referred to as the Republic of China (Taiwan). The above description shows the ideological chaos in this region. Indeed, we are not even recognized as a country internationally, which is exactly the origin of the Taiwan independence movement.\n\nSince withdrawing from the United Nations, the international status of the Republic of China has plummeted. This also allowed local consciousness to sprout, and later it fully took the stage during the democratic movement and gained political power.\n\nNevertheless, those who agree with maintaining the status quo still occupy the vast majority of society, and the road to formal name rectification is still far away."

 CHI_lower_mainland_influence_idea: "Extremely Low Mainland Influence"

 CHI_lower_mainland_influence_idea_desc: "\n\n\n\n£GFX_CHI_terrible_mainland_influence_banner\n\n\n\n\n\nIn the last century, we once stood tall over the land of China, until the outbreak of the civil war. Failures from various factors forced us to relocate to Taiwan, thus losing control over the mainland.\n\nAs time passes, the Republic of China has generally become a historical term in the minds of the mainland people today. Those who are slightly aware of it hold an extremely negative view, and our supporters are considered laughable ideas on the internet."

