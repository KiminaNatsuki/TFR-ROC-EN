 CHI_project_ROCA_reform_1: "Preparatory Military Reorganization"

 CHI_project_ROCA_reform_1_desc: "We must embark on a preparatory military reorganization plan, reducing the size of the army and streamlining personnel. The dispatch of any volunteer forces is strictly prohibited to concentrate resources on subsequent reforms."

 CHI_project_ROCA_reform_1_idea: "Preparatory Military Reorganization"

 CHI_project_ROCA_reform_1_idea_desc: "We are streamlining personnel and preparing to reorganize the army. The dispatch of volunteer forces abroad has been entirely prohibited."


 CHI_project_ROCA_reform_2: "Reorganization Conference"

 CHI_project_ROCA_reform_2_desc: "The Reorganization Conference has officially begun. All currently deployed divisions will be deleted to unify and standardize combat organizations and eliminate redundant military units."

 CHI_project_ROCA_reform_2_effect_tt: "The Reorganization Conference has officially begun. §RAll currently deployed divisions will be deleted.§!"


 CHI_project_ROCA_reform_3: "Restore Corps-Level Designations"

 CHI_project_ROCA_reform_3_desc: "As military reorganization proceeds smoothly, we will restore corps-level designations, enhance the command capabilities of all generals, and issue new command post organizations."

 CHI_project_ROCA_reform_3_idea: "Restore Corps-Level Designations"

 CHI_project_ROCA_reform_3_idea_desc: "Our corps-level combat organizations have been restored, comprehensively enhancing the command capabilities of our generals."


 CHI_project_ROCA_reform_4: "Establish Military Command System"

 CHI_project_ROCA_reform_4_desc: "The modern military command system of the ROC Armed Forces has been officially established! Our divisional organization, combat width adaptability, reinforcement rate, and initiative have all been significantly improved, and the dispatch of volunteer forces is reopened."

 CHI_project_ROCA_reform_4_effect_tt: "Strengthen the Spirit of the §YROC Armed Forces§!:\nArmy Organization: §G+10.0%§!\nCombat Width: §G-15.0%§!\nReinforcement Rate: §G+50.0%§!\nInitiative: §G+50.0%§!"


 CHI_project_Ning_Hai: "Project Ning Hai"

 CHI_project_Ning_Hai_desc: "Project Ning Hai is a long-term strategy aimed at comprehensively upgrading the combat capabilities of the ROC Navy, covering fleet coordination, speed, detection, and the offensive and defensive effectiveness of screening ships."

 CHI_ninghai_plan_idea_1: "Project Ning Hai (Phase 1)"

 CHI_ninghai_plan_idea_1_desc: "Through initial naval combat innovations, our fleet coordination, speed, and screening efficiency have slightly improved."

 CHI_ninghai_plan_idea_2: "Project Ning Hai (Phase 2)"

 CHI_ninghai_plan_idea_2_desc: "As Project Ning Hai deepens, our Navy is gradually becoming a modern maritime force with high coordination and reconnaissance capabilities."

 CHI_ninghai_plan_idea_3: "Project Ning Hai (Final Phase)"

 CHI_ninghai_plan_idea_3_desc: "Project Ning Hai is fully implemented. The ROC Navy has reached unprecedented heights in speed, detection, coordination, and screening offense and defense."


 CHI_project_Ling_Hsiao: "Project Ling Hsiao"

 CHI_project_Ling_Hsiao_desc: "Project Ling Hsiao focuses on establishing air superiority and providing close air support, ensuring our eagles dominate the skies and provide the most devastating strike power for ground troops."

 CHI_lingxiao_plan_idea: "Project Ling Hsiao"

 CHI_lingxiao_plan_idea_desc: "After implementing Project Ling Hsiao, our Air Force's capabilities in establishing air superiority, interception, and close air support have seen leaps in enhancement."


 CHI_project_hump_training: "The Hump Bombing Training"

 CHI_project_hump_training_desc: "Our Air Force pilots will recall the legendary flights over the Hump and undergo even more rigorous bombing and strafing training. This will slightly improve our efficiency in fighting for air superiority during critical moments."

 CHI_project_hump_training_idea: "The Hump Bombing Training"

 CHI_project_hump_training_idea_desc: "We have inherited the pride and combat skills of the Hump airlift; the Air Force now operates with higher efficiency when fighting for air superiority."

 
