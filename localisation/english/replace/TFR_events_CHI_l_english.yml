l_english:
 ROC.1.t: "Red, Blue, White"

 ROC.1.d: "The Republic of China has now entered its 109th year. From an outsider's perspective, this nation appears relatively young. This impression has increasingly become the mainstream narrative in modern times as the Chinese Communist Party quietly usurped the title of the successor to \"China.\" Consequently, the Republic of China, the orthodox heir of the Chinese nation, now faces the greatest identity crisis in its history.\n\nChampioning local consciousness, Tsai Ing-wen and the Democratic Progressive Party (DPP) emphasize that the \"Taiwanese\" identity precedes the \"Chinese\" one. This ideology gradually gained traction during the mid-to-late martial law period and has evolved into a prominent political force following modern democratization. Standing in opposition is the Kuomintang (KMT), which has fielded Han Kuo-yu as its candidate. This historic party was founded by Sun Yat-sen, the Father of the Republic of China. The Nationalist Government, subsequently led by Chiang Kai-shek, defeated regional warlords and the Japanese in an effort unify China. However, the defeat in 1949 led to the retreat to Taiwan, leading to the gradual shift from \"Reclaiming the Mainland\" to \"Taking Root in Taiwan,\" with its base primarily identifying as \"Citizens of the Republic of China.\" Though it still faces extreme internal and external pressures, the KMT still maintains a firm grip on local votes through its deeply rooted grassroots party networks and farmers\" associations.\n\nBlue and Green, Mainlanders and Natives, Chinese and Taiwanese. The people of this land have endured far too much suffering and have grown profoundly weary of the political theater of elections. This time, will things be any different?"

 ROC.1.a: "Long live the Republic of China!"


 CHI.10.t: "Oil Crisis Impacts Taiwan"

 CHI.10.d: "Driven by soaring oil prices and economic instability triggered by the Saudi civil war, international markets have fallen into chaos. The rapidly deteriorating situation eventaully spilled over, dealing a heavy blow to Taiwan's economy. The Taiwan Stock Exchange index has plunged to a historic low, and leading economists are warn that if the situation continues to deteriorate, there will be little hope of stabilizing in the close future.\n\nThe crash of the New York Stock Exchange, compounded by massive overseas economic downturns, has further set off a chain reaction. With Taiwan's export market now strained, the island nation's financial and manufacturing sectors were in jeopardy. Furthermore, the economic contraction has forced hundreds of companies to initiate layoffs and scale back operations, placing the job market under heavy pressure.\n\nThe engine of commerce that sustained Taiwan's rapid growth over the past half-century is visibly slowing down. With capital confidence shaken and industrial expansion blocked, the broader economy is beginning to stagnate."

 CHI.10.a: "We must prepare quickly!"


 CHI.1.t: "The 2020 General Election"

 CHI.1.d: "Public attention is once again focused on the nation's future direction as political factions gear up to secure support. This is more than just an election; it is a public test of current policies and national strategy.\n\nThe voters\" choice will directly shape the pace of domestic reform, the direction of foreign policy and wider Taiwanese society as a whole. The government must address both domestic public sentiment and international attention, balancing short-term political pressure against long-term national interests."

 CHI.1.a: "The DPP remains in power."

 CHI.1.b: "The KMT takes power."


 CHI.2.t: "Patient Zero" 

 CHI.2.d: "The plane landed smoothly at Taoyuan Airport. Over the intercom, a flight attendant calmly asked everyone to remain seated and explained the arrival quarantine procedures. Yang Shuhui did not hear a word of it.\n\nHer severe headaches had begun several weeks earlier during a business trip to Wuhan. At first, she assumed she was having trouble adjusting to the new environment and had caught a mild cold. But even after taking all the cold medicine she had brought with her, her symptoms had not improved at all. She leaned against the seat in front of her, trying to ease the pain, then pulled the last tissue from the backpack at her feet and covered her mouth. After coughing, she stuffed it into the sick bag, which was already full of tissues she had used during the flight. After leaving the plane, she reported her condition to the ground crew. Workers in protective suits escorted her to a temporary isolation area. There, a nurse carefully placed the newly collected sample into a testing machine and waited for the result.\n\nA rapid series of beeps suddenly broke the silence. Although Shuhui's vision had become a blur, she would never forget that moment-the frozen expressions on every staff member's face."

 CHI.2.a: "Oh no..."


 CHI.4.t: "Orphan of Asia"

 CHI.4.d: "Following its defeat in the Chinese Civil War, the government of the Republic of China relocated to Taiwan in 1949. At first, it continued to claim the right to represent \"China.\" Yet after losing most of the territory it had once governed, the legitimacy of that claim began to weaken. In 1971, the People's Republic of China replaced the Republic of China as the internationally recognized representative of China. From then on, the Republic of China was pushed away from the center of the international stage and forced to survive on its margins, operating under the names Taiwan or Chinese Taipei.\n\nAt the same time, the country underwent profound changes at home. Its path from martial law to democracy was marked by a long period of authoritarian rule. Earlier generations paid in blood and sacrifice for the freedom and prosperity enjoyed today, though this transformation also came with the gradual erosion of the state's constitutional identity and international standing. Few today still sincerely regard the Republic of China as \"China.\" Yet it was under these very conditions that the country learned to navigate between great powers and preserve its existence as best it could. This fragile balance, however, now faces new challenges. Amidst an increasingly hostile Communist China, a sudden global pandemic, and a growing political instability in the United States, we are soon to witness \"great changes unseen in a century.\"\n\nWe now stand at a turning point in our destiny."

 CHI.4.a: "I look homeward; the road runs long and far."


 CHI.5.t: "Following the Bald Man"

 CHI.5.d: "On the television screen, the vote tallies flickered rapidly; Tsai Ing-wen and Han Kuo-yu repeatedly overtook one another, keeping the race neck-and-neck. Tsai Ing-wen and Han Kuo-yu traded the lead again and again, and every reversal sent a fresh roar through one campaign headquarters while plunging the other into silence. Amid this head-on clash, only James Soong's campaign seemed almost forgotten, holding steady in a distant and harmless third place.\n\nAfter hours of counting, fewer than ten thousand ballots remained. Against nearly every expectation, the name at the top of each network's results board was Han Kuo-yu of the Kuomintang, leading by almost thirty thousand votes. President Tsai Ing-wen was the first to speak. A grim silence settled over the Democratic Progressive Party headquarters as supporters, many of them in tears, watched her concede the election. The Han Wave had arrived! Born in Kaohsiung, it had now swept north all the way to the Presidential Office in Taipei. At the Kuomintang's headquarters, the celebration had reached fever pitch. Once his opponent conceded, Han Kuo-yu stepped out before the crowd.\n\n\"As president-elect of the Republic of China, tonight I feel no joy. I know that national security and economic prosperity are not an either-or choice. The people of Taiwan deserve both. Our country is facing one of the most difficult moments in its history. I, Han Kuo-yu, will carry out my duties faithfully and live up to the trust you have placed in me. For the Republic of China, I will give everything I have! I will stand on the front lines to defend our country. I will stand on the front lines to ensure the nation's security, and I will fight on the front lines to bring wealth to the people and prosperity to Taiwan! Thank you to the millions of citizens of the Republic of China for giving me this opportunity to serve the country I love! I swear that if I fail to perform well during these four years, you may oust me immediately!\""

 CHI.5.a: "The Blue Sky emerges, the White Sun rises."


 CHI.6.t: "A Bottle of Water and a Bowl of Braised Pork Rice"

 CHI.6.d: "As usual, Mr. Rong woke up early. After a quick wash-up, he began prepping ingredients as if it were second nature to him. He had taken over the shop from his father over thirty years ago. Having grown up in Taiwan, he hadn't found any interest in anything beyond his island home. Things such as the Yangtze or Yellow Rivers-or whatever else his grandfather and father used to go on about; those things were visible only from worlds away, so what did they have to do with him? One brief midday break, while lost in thought, Rong stared at the broadcast of the election's results. On the screen, a polished politician beamed, styling himself as the \"President of the Common People.\"\n\nBrother Rong clicked his tongue in disdain. Just as he reached for the remote to change the channel, he heard a familiar voice from the front of the shop. \"Sir, one bowl of braised pork rice, please.\" A middle-aged man had walked in-his bald head shining over a Kuomintang campaign vest draped over a seemingly decade-old shirt, a half-finished bottle of mineral water clutched in his hand. Mr. Rong was startled; it was Han Kuo-Yu, the president elect! Despite Rong's pondering on Han's appearance, he still went to serve him his meal. After serving the food, Han asked Mr. Rong to stay and have a chat.\n\n\"Business is really tough these days,\" complained Mr. Rong to Han as he was sitting down. Han looked up. \"Yeah. Back when I was in the army, a bowl of plain noodles cost barely over ten dollars. Now, you wouldn't dare step into the market without five hundred in your pocket!\"\nMr. Rong took a swig of water. \"Every president talks about changing Taiwan. The TV shows all these charts claiming Taiwan is doing great and the economic growth rate is high-but why does life feel harder and harder for me?\" Han Kuo-yu didn't speak; he simply scooped up a mouthful of braised pork rice and ate it quietly. In this space, there was no rank, no authority, and no distinction of seniority-just two lonely middle-aged men sharing stories of their lives."

 CHI.6.a: "Like a president of his people."

 
 ROC.7.t: "Diaoyutai Islands Oil Exploration Request"

 ROC.7.d: "The Taiwanese government has just submitted a diplomatic request to Japan, proposing the joint development of oil reserves in the waters surrounding the Diaoyutai Islands and requesting access to these resources.\n\nTaipei's motivation is clear: Facing a growing regional energy deficit, Taiwan urgently needs a stable energy supply to sustain its technology sector and civilian commerce. For Japan, this proposal goes beyond economic cooperation to test its geopolitical boundaries and territorial sovereignty.\n\nAccepting the request would substantially improve Japan-Taiwan relations while inevitably escalating territorial disputes with China. A refusal risks alienating the two nations."

 ROC.7.a: "For the sake of regional stability, we must refuse."

 ROC.7.b: "Agree to joint development for mutual strategic benefit."

 
 ROC.8.t: "Refusal from Tokyo"

 ROC.8.d: "The Japanese Ministry of Foreign Affairs has replied to our request for oil development rights in the Senkaku Islands. Predictably, given the highly complex situation in East Asia and the CCP's demands regarding \"territorial sovereignty,\" Japan cannot support any form of Taiwanese development plans in those waters.\n\nThe Ministry of Foreign Affairs expressed regret over this decision and advised us to seek alternative energy solutions."

 ROC.8.a: "What a pity."

 
 ROC.9.t: "Approval from Tokyo"

 ROC.9.d: "As expected, the Japanese government has agreed to allow Taiwanese oil exploration in the waters surrounding the Senkaku Islands. Taiwan will secure extraction rights for a portion of the region's crude oil alongside technical support from Japan.\n\nThis move provoked fierce condemnation from CCP media. Even so, it has significantly improved Japan-Taiwan relations and secured Taiwan's energy supply."

 ROC.9.a: "Great!"

 
 ROC.10.t: "South China Sea Joint Oil Exploration Request"

 ROC.10.d: "The Taiwanese government has just submitted a diplomatic request to mainland China, proposing the joint development of oil reserves in the South China Sea and requesting access to these resources.\n\nThe Taiwanese government's motivation is clear: Facing a growing regional energy deficit, Taiwan urgently needs a stable energy supply to sustain its high-tech sector and civilian operations. For mainland China, this proposal goes beyond economic cooperation to test its geopolitical boundaries and territorial sovereignty.\n\nAccepting the request would substantially improve cross-strait relations while inevitably escalating territorial disputes with neighboring countries. A refusal risks alienating the two sides further."

 ROC.10.a: "\"Taiwanese?\" Barely know them."

 ROC.10.b: "Born of the same root..."

 
 ROC.11.t: "Refusal from Beijing"

 ROC.11.d: "Beijing has replied to our request for joint oil development in the South China Sea. Predictably, given the highly complex situation in East Asia and the CCP's demands regarding \"territorial sovereignty,\" the mainland Chinese government cannot support any form of Taiwanese development plans in those waters.\n\nThe Ministry of Foreign Affairs expressed regret over this decision and advised us to seek alternative energy solutions."

 ROC.11.a: "\"Chinese people?\" Don't know them at all!"

 
 ROC.12.t: "Approval from Beijing"

 ROC.12.d: "To our suprise, the mainland Chinese government agreed to our request for joint oil development in the South China Sea. The Taiwanese government will secure extraction rights for a portion of the region's crude oil alongside technical support from mainland China.\n\nThis move provoked fierce condemnation from media in Vietnam, the Philippines, and other neighboring countries. Even so, it has significantly improved cross-strait relations and secured Taiwan's energy supply."

 ROC.12.a: "Why the bitter rivalry?"


 ROC.13.t: "A Single Night"

 ROC.13.d: "As summer approached, a bright, clear moon often hung in the night sky. Its pale light stretched across the darkness and settled over the earth. Beneath it, the quiet longing of those below seemed to reveal itself completely, blending into a weightless mist that rested over the mountains.\n\nOld Xia, after enjoying the view, swallowed a few painkillers. The ache in his lower-leg joints had kept him tossing and turning for decades, and after a few days in the mountains, the old pain had been acting up more than usual. He sighed, straightened himself up, and pushed open the faded brown wooden door. Moonlight met him on the other side. Everything looked clean and still. Nothing had changed, except for the faint wash of the moon's radiance over it all. Old Xia glanced up at the thin crescent moon, then slowly made his way deeper into the bamboo grove. He followed the stone path as moonlight slipped in and out the leaves. Every now and then, a cool breeze moved through the grove, setting the bamboo leaves rustling and tugging at the folds of his blue-green clothes and the thin, brittle strands of his hair.\n\nDong-dong-dong-\n\nThe distant toll of a bell rolled through the bamboo and hung in the wind. It was the kind of night that could make a man think about things larger than himself. The great thinkers of the past, faced with this night, might have found themselves thinking of their own lives, of other people, of the fate of the nation, of duty, and of the world-of everything that had come before and everything unfolding before their eyes. Old Xia felt his chest tighten. He was no great thinker, but the better part of his life was not so different from the sad stories people told in teahouses and street-corner shops to pass the time.\n\n---\n\nEvery tragedy had a main character stubborn enough to survive. Bamboo was like that, wasn't it? It spent most of its early life hidden and unnoticed, then suddenly shot toward the sky. Joint by joint, leaf by rustling leaf, it grew firm, took shape, spread, and broke through the soil. A bamboo grove was a whole life laid out before him. At the deepest point in the grove, Old Xia sat on a stone bench and let the wind wash over him. The stillness made him think of his mother. Of all the regrets a person could carry, her death was perhaps the one wound he had never been able to close. Her arms had been so warm. He could lie there while an entire day slipped quietly by, in the comfort of her memory. Old Xia remembered the faint wrinkles on her face when he left.\n\nHe smiled, then trembled as a sob caught in his throat. He had grown old, but the memory was still painfully sharp. It felt like a train suddenly slowing after running at full speed, though the force of it hit only when he looked back. It left him helpless, like a child who had done something wrong and was too afraid to go home and face his mother. Old Xia stood. His body felt strangely light, and the wind had picked up. He remembered what he had asked of his son: when the time came, he wanted to be buried on the mainland. He knew he would never make it back himself. But perhaps regret and wanting too much were part of what made people human. He had been selfish-selfish enough to leave his son with the burden of carrying out his final wish.\n\nOld Xia's breathing slowly grew calm. His eyelids became heavy, and he lay down among the shadows of the bamboo. Moonlight poured through the leaves and danced across the ground. The sky was clear. Somewhere in the haze, he heard his mother calling him. The child who had been too afraid to come home was finally going back-back to his mother's side."

 ROC.13.a: "The unpredictability of life."


 ROC.19.t: "A Prodigal Son's Turnaround"

 ROC.19.d: "In the latest round of senior personnel changes announced by the Republic of China Armed Forces, Kung Nai-te has been appointed deputy commander of the Army's Sixth Corps and promoted to lieutenant general. His promotion makes him the first person in the nation's history to rise from the ranks of the volunteer enlisted force to three-star command.\n\nDescribing himself as a \"wayward youth,\" Kung had a rowdy student life. Sharing a dorm room with his older brother, he often spent his nights at clubs and got into street fights. His life changed course only after he received his military draft notice. Although Kung initially sought to remain in uniform as a noncommissioned officer, his application for such was unsuccessful. In 1992, he decided to enroll in a reserve officer training progra, which eventually led to him entering the volunteer force and recieving his commision as a second lieutenant.\n\nThroughout his military career, Kung distinguished himself through his ambition, determination, and relentless drive to improve. On one occasion, he spent an entire night practicing how to field-strip a machine gun. He later earned widespread praise while commanding the ROC Army's 586th Armored Brigade, where he became known for leading from the front and looking after the welfare of his troops. His remarkable rise has inspired confidence among the rank and file, proving that even an ordinary enlisted soldier can one day rise to the highest levels of command."

 ROC.19.a: "Our nation needs more talent like this."


 ROC.20.t: "Davos Youth Leadership Camp"

 ROC.20.d: "Chen Tzu-hsuan took the presentation remote and stepped forward to deliver the final segment of her team's presentation. Facing a room filled with policymakers and leading academics from Europe and North America, she could not help but feel a little nervous. But her team had spent days preparing for this moment, and she was confident that they could show the world what Taiwan's younger generation had to offer. When the presentation concluded, the hall erupted in applause. Tzu-hsuan lowered the remote and returned to her place beside her teammates. Together, they waited with bated breath for the panel's final assessment.\n\n\"First, I would like to thank our young delegates from Taiwan for joining us here at the World Economic Forum. It is a privilege to see so many talented young people gathered here today,\" said an elderly man as he took the microphone. \"Allow me to introduce myself. My name is Klaus Schwab. Your report's \"Vision for a New World\" resonates deeply with me, particularly its focus on sustainability. Taiwan has already made considerable progress on environmental policy, but as I understand it, the country still has some ground to cover compared with Europe, North America, and even China. This is especially true in areas such as housing and food consumption, where traditional attitudes remain deeply entrenched. How do you propose addressing these challenges?\"\n\n\"Going forward, we hope to expand public housing,\" Tzu-hsuan replied, taking the microphone. \"We also intend to harness emerging metaverse technologies to reshape people's dietary habits. In doing so, we can help Taiwan build a brighter future and take its place in a new global order.\" The hall once again erupted in thunderous applause. All across the audience, hands shot into the air as attendees eagerly vied for the chance to ask the delegates..."

 ROC.20.a: "\"I understand. Thank you for your reply.\""


 ROC.21.t: "Trump Announces Military Aid to Taiwan"

 ROC.21.d: "With tensions mounting across the Taiwan Strait, U.S. President Donald Trump announced at a press conference that his administration would provide Taiwan with an \"unprecedented package of defensive military assistance.\" The package would include air-defense missiles, radar systems, unmanned aircraft, and a limited number of anti-ship weapons. \"Taiwan is fighting for freedom,\" Trump declared. \"The United States will not stand idly by.\"\n\nWith the announcement immediately drawing international attention, the Chinese Foreign Ministry \"strongly condemned\" the decision and warned Washington against \"playing with fire.\" The Pentagon stated that it would review the available delivery mechanisms, while emphasizing that all military assistance to Taiwan would be defensive in nature and provided within the framework of existing U.S. law. Soon afterward, American cargo vessels began arriving at Kaohsiung. Beijing reacted furiously, holding daily press conferences to denounce the deliveries, while the People's Liberation Army made naval and airspace incursions into Taiwan in order to racket the situation. The ROC Armed Forces repeatedly scrambled aircraft and dispatched naval vessels to monitor and intercept the approaching Chinese forces.\n\nTaiwan's foreign and defense ministries expressed their gratitude to the United States for delivering the weapons with exceptional speed. Both ministries also voiced hope that additional arms packages could be arranged the following year."

 ROC.21.a: "The Arsenal of Democracy truly lives up to its name."


 ROC.22.t: "Pelosi Visits Taiwan"

 ROC.22.d: "After recently arriving in Taipei, U.S. House Speaker Nancy Pelosi addressed lawmakers at the Legislative Yuan. In her remarks, she reaffirmed Washington's support for Taiwan's democracy, declaring that \"Taiwan is not alone\" and calling for closer ties between Taiwan and the United States.\n\nChina's Eastern Theater Command responded by launching what it described as \"joint combat exercises around Taiwan.\" Chinese naval and air forces conducted large-scale live-fire drills in waters surrounding the island, rehearsing operations including a joint blockade, strikes against defended targets, and area denial. Several ballistic missiles passed over Taiwan itself, prompting the island's armed forces to heighten their air-defense readiness.\n\nThe escalation alarmed the international community. Although governments differed in their responses, the exercises were widely seen as another serious deterioration in relations between Beijing and Washington."

 ROC.22.a: "A toast to Taiwan-US friendship!"


 taiwan.33.t: "Second Wave of Missile Strikes!"

 taiwan.33.d: "The war of life and death has returned to the Republic once more.\n\nOnly a few days after the beginning of the Fourth Strait Crisis, missiles from the Mainland have, for the first time, struck our key infrastructure and cities. While the Ministry of National Defense scrambles to mobilize reserve personnel and prepare for defense, a second wave of missile strikes has descended upon us-this time devastating our administrative and communication capabilities.\n\nYet, the few surviving radar stations have picked up something far more terrifying: countless amphibious assault ships and their escorts are now rapidly approaching our shorelines, signaling an imminent invasion. This can mean only one thing- the Fourth Strait Crisis has turned into an invasion of Taiwan.\n\nDespite the absence of the United States, we are not alone. Intervention forces from the PDTO are now assisting in our defense across all theatres, standing shoulder to shoulder with us on the shorelines against the communists.\n\nWe must now fight and remain defiant against the Red Dragon. Should we fail, the last bastion of Chinese democracy will be forever extinguished."

 taiwan.33.a: "Fight! Fight! Fight!"


 ROC.34.t: "Military Aid from Japan and Austrailia"

 ROC.34.d: "In the wake of the Invasion of Taiwan, Tokyo passed an emergency cabinet resolution authorizing the Self-Defense Forces to airlift air defense system components, anti-ship missile spares, tactical communication platforms, and unmanned reconnaissance equipment to Taiwan. Japan's Maritime Self-Defense Force vessels also began conducting escort and intelligence support missions in the surrounding waters to secure transport routes. Meanwhile, Canberra announced an additional support package, delivering batches of man-portable air-defense systems, anti-armor systems, field radars, ammunition, and engineering equipment to airfields in both northern and southern Taiwan. Australian military advisors and technical personnel accompanied the shipments to assist with equipment integration, operational training, and the establishing of a joint coordination center with Taiwan's Ministry of National Defense."

 ROC.34.a: "Thank you!"


 ROC.35.t: "Military Aids Surge from Japan and Australia"

 ROC.35.d: "In the wake of the Invasion of Taiwan, Tokyo has passed approved a series of emergency aids through the cabinet. Squadrons of C-2 and C-130 transports from Okinawa and Kyushu have airlifted anti-air system components, spare parts for anti-ship missile systems, tactical communication platforms and reconnassiance UAVs. Furthermore, Canberra followed up with support efforts as the ADF mobilizes to its maximum logistical capacity. C-17 transports, passing Darwin and Guam AFB, have delivered MANPADS, anti-tank weapons, field radar systems, ammunition and engineering equipment in batches. Following the materials are Australian military and technical advisors, who will assist us in integration and training. Additionally, a joint coordination center is established with the Ministry of National Defense in order to accelerate material distribution into each theaters."

 ROC.35.a: "Arigatou gozaimasu."


 ROC.36.t: "National Day of the Republic of China"

 ROC.36.d: "October 10 is the National Day of the Republic of China, commemorating the 1911 Xinhai Uprising and the subsequent founding of the Republic. Established in the early republican era, this official holiday has endured through changing times. It symbolizes the establishment of the republican system and the legacy of constitutionalism, serving as a moment for the public to reflect on history together.\n\nFlag-raising ceremonies and celebrations take place across Taiwan on this day. At the rally in front of the Presidential Office Building, the president delivers an address reviewing the nation's progress and outlining future directions. Depending on the year's schedule, the government may hold military parades or large-scale performances. Aerial formations fly overhead, and fireworks illuminate city landmarks at night. If the holiday falls on a long weekend, society at large organizes various public events, from concerts to cultural exhibitions, adding to the festive atmosphere.\n\nOverseas communities and diplomatic missions also host receptions and ceremonies to mark the occasion alongside allied representatives. Although public opinion is diverse and historical perspectives differ, the National Day puts the continuity of the state and its institutions on full display. As a commemoration of the republic's founding and development, the holiday retains a highly symbolic role in contemporary society."

 ROC.36.a: "Long live the Republic of China!"


 ROC.37.t: "February 28th Incident Memorial Day"

 ROC.37.d: "In 1947, amidst the postwar transition and social unrest, a protest sparked by a dispute over contraband cigarettes rapidly consumed the island. The ensuing military crackdown and pacification campaigns saw countless civilians and local elites arrested, while others simply disappeared or were killed. The trauma of that period permanently altered Taiwan's political trajectory and generational memory.\n\nThe Febuary 28th Incident is not merely history; it remains an ongoing debate over accountability and human rights. Following the end of martial law and subsequent democratization, the government began declassifying archives, establishing compensation mechanisms, and erecting memorials were across the country. Public sentiment on this day is particularly sensitive. Some emphasize the need for transitional justice, while others worry that politicizing these memories will only deepen societal divides. Amid these intertwined perspectives, the day serves as a public moment to reflect on the relationship between the state and its citizens."

 ROC.37.a: "A moment of silence for the victims."


 ROC.40.t: "Let bygones be bygones"

 ROC.40.d: "Amidst the raging conflict, DPP leader Tsai Ing-wen-who would normally be sheltered in a bunker-planned a public appearance in Taipei, accompanied by figures including political rival Han Kuo-yu and leaders from other parties. The atmosphere in the meeting room was solemn; representatives from the three parties, who had long clashed in the Legislative Yuan, were now huddled together, quietly discussing the same briefing document. \n\nHan Kuo-yu attended the meeting as a key figure of the KMT. He stated that while political competition could continue, a unified stance regarding the war effort was essential. He volunteered to assist with the allocation of supplies in the south and the integration of civilian mobilization networks. Tsai Ing-wen responded that stabilizing public confidence was the top priority and pledged full administrative support for any cross-party cooperation. The two subsequently appeared at a joint press conference to convey a unified message and emphasize their resolve to resist the aggression. \n\nDays later, Han Kuo-yu personally coordinated donations of generators and medical equipment from local businesses, while the DPP headquarters utilized its network of party officials and elected representatives to manage distribution and registration. The media captured a moment of brief conversation between the two while they were visiting troops on the front lines; gone was the fierce rhetoric of past political battles, replaced by shared encouragement for the morale of the rank-and-file soldiers. For many supporters, that moment symbolized not only a reconciliation, but also a profound commitment to the island's well-being. Even as the shadow of war loomed, the Legislative Yuan took the rare step of passing a cross-party resolution supporting a special budget and legislation for reserve force reform. Photos of the two party leaders shaking hands in the legislative chamber were widely circulated. In these tense times, two parties with deep-seated differences chose to stand side-by-side against an overwhelming threat."

 ROC.40.a: "At this moment, we are all here to defend our home and country."


 ROC.41.t: "Chaos in the Phillipines"

 ROC.41.d: "Over the past few weeks, internal security in the Philippines has rapidly deteriorated. The National Democratic Front has launched successive offensives across northern Luzon, occupying transit nodes and striking power and communication infrastructure to weaken central government control. Concurrently, the Moro Islamic Liberation Front has expanded armed operations in Mindanao, seizing several towns and port areas before declaring a state of war.\n\nPhilippine government forces have imposed martial law around Manila and key central regions, mobilizing main army units for localized sweep operations. However, strained by dispersed troops and damaged supply lines, frontline advances have stalled, forcing some garrisons into defensive retreats. Complicating the situation, the navy has declared neutrality. By restricting itself to maritime patrols and humanitarian evacuations, it refuses to intervene in land-based clashes, severely limiting coastal supply runs and troop transport capabilities.\n\nArmed conflicts are now erupting across the archipelago nation. With the Phillipines\" trasnport network having mostly collapsed, local governments have become paralyzed. If control over key regions is not restored in the short term, the scale of the conflict will inevitably expand."

 ROC.41.a: "Ugh, couldn't this get any more chaotic?"


 ROC.42.t: "Civil War in the Philippines"

 ROC.42.d: "The situation in the Philippines has escalated from localized clashes into a full-scale civil war. The National Democratic Front has established a continuous zone of control in the mountainous regions of northern Luzon, declaring the formation of the National Democratic Front of the Philippines while systematically sabotaging major highways and energy facilities. Government forces are holding fast in Metro Manila and several military bases, mobilizing reserves in an attempt to restore transit lines and administrative order.\n\nIn Mindanao, the Moro Islamic Liberation Front has fully taken over local government organs across multiple provinces. They have established an independent command structure and engaged in fierce firefights with government troops. Severe damage to multiple airports and seaports during these battles has pushed the supply system to the brink of collapse. The Philippine Navy has announced a stance of armed neutrality, executing blockades and evacuations along major sea lanes without providing direct fire support to any faction. This has fractured the battlefield into a complex landscape of land-based division and maritime standoffs.\n\nAll factions now claim to be the sole legitimate government of the Philippines, fighting to claim the islands as their own."

 ROC.42.a: "Absolute madness."


 ROC.43.t: "The National Democratic Front Unites the Philippines"

 ROC.43.d: "After a prolonged armed conflict, the National Democratic Front has secured control over major cities and transport hubs across Luzon, Visayas, and Mindanao. Remaining armed factions have either collapsed or accepted integration. The NDF promptly proclaimed the establishment of the \"Democratic Republic of the Philippines\" in Manila, forming a provisional central committee to take over the national administrative and military apparatus.\n\nThe previously neutral naval command issued a joint statement recognizing the new regime as the sole legitimate government of the Philippines. Integrating all fleets and maritime forces into the Republic's command structure, they emphasized the protection of national unity and sea lane security.\n\nThe newly formed Democratic Republic of the Philippines then issued a diplomatic bulletin announcing its entry into the East Asian Defense Initiative, establishing security cooperation and intelligence-sharing mechanisms with regional member states. This decision marks a major shift in national strategy, signaling that future military development and foreign policy will center around a regional collective defense framework."

 ROC.43.a: "A Philippine Spring?"


 ROC.44.t: "Government Forces Reunite the Phillipines"

 ROC.44.d: "After a prolonged armed conflict, Philippine government forces have gradually retaken the mountainous regions of northern Luzon and the major cities of Mindanao. Remaining armed factions have either collapsed or accepted integration. Manila has resumed central administrative operations, with the Presidential Palace and Congress declaring the full restoration of the Republic's constitutional order. The country now enters a phase of post-war reconstruction.\n\nThe previously neutral naval command issued a joint statement recognizing the new administration as the sole legitimate government of the Philippines. Integrating all fleets and maritime forces into the Republic's command structure, they emphasized the protection of national unity and sea lane security.\n\nThe newly established Republic of the Philippines then issued a diplomatic bulletin announcing its entry into the Pacific Defense Treaty Organization, establishing security cooperation and intelligence-sharing mechanisms with regional member states. This decision marks a major shift in national strategy, signaling that future military development and foreign policy will center around a regional collective defense framework."

 ROC.44.a: "Same as usual."


 ROC.45.t: "The Moro Islamic Liberation Front Unites the Philippines"

 ROC.45.d: "After a prolonged armed conflict, the Moro Islamic Liberation Front has achieved military control over Mindanao, Visayas, and key cities in Luzon, with remaining armed factions either collapsing or accepting integration. Its leadership committee declared the establishment of the \"Islamic State of the Philippines\" in Manila, abolishing the old Republic's constitutional framework to build a state apparatus centered on religious law and restructuring the national military and political systems.\n\nThe previously neutral naval command, however, declared the current government illegitimate.\n\nThe newly formed Islamic State of the Philippines subsequently issued a diplomatic bulletin announcing the implementation of Sharia law. Reports indicate that weapons and personnel from the East Asia Defense Initiative and the Pacific Defense Treaty Organization are being secretly shipped to the Philippine naval government, which had previously refused to state a position."

 ROC.45.a: "The End of the Philippines..?"


 ROC.46.t: "Naval Junta Unifies the Philippines"

 ROC.46.d: "After successfully eliminating Islamic extremist militants, the Philippine Navy Command retook Manila and all major islands across the country. They announced the formal restoration of the Republic of the Philippines, with a naval junta temporarily managing transitional affairs.\n\nThe junta then issued a diplomatic statement declaring its formal entry into the Pacific Defense Treaty Organization, reaffirming security cooperation with Japan and regional allies to defend maritime corridors."

 ROC.46.a: "Order Returns to the Pacific"


 ROC.47.t: "Naval Junta Unifies the Philippines"

 ROC.47.d: "After successfully eliminating Islamic extremist militants, the Philippine Navy Command retook Manila and all major islands across the country. They announced the formal restoration of the Republic of the Philippines, with a naval junta temporarily managing transitional affairs.\n\nThe junta then issued a diplomatic statement declaring its formal entry into the East Asia Defense Initiative (EADI) to establish security cooperation with regional defense partners."

 ROC.47.a: "A New Strategic Direction"


 ROC.55.t: "Philippine Presidential Election"

 ROC.55.d: ""

 ROC.55.a: "Ferdinand Marcos Jr."

 ROC.55.b: "Leni Robredo"

 ROC.55.c: "Manny Pacquiao"


 ROC.77.t: "Blackhawk Helicopter Crash in the Wulai Mountains"

 ROC.77.d: "On the morning of January 2, 2020, a Republic of China Air Force UH-60M \"Blackhawk\" helicopter took off from Zhitan Base in Xindian District, New Taipei. It was scheduled to visit the Dong'ao Ridge Radar Station in Yilan to inspect operations and encourage the troops in a routine Lunar New Year celebratory mission. Among the 13 high-ranking officers and personnel on board was the then-Chief of the General Staff, General Shen Yi-ming. \n\nWhile flying over the mountainous area of ​​Wulai District, New Taipei City, the helicopter disappeared from radar screens due to poor weather and low visibility. The Ministry of National Defense immediately began an inland search and rescue operation for the missing helicopter. After several hours of searching, rescue personnel located the wreckage near the upper reaches of the Tonghou Stream in Wulai.\n\nThe five survivors were transported to the hospital for treatment with the assistance of rescue personnel. Subsequent investigations indicated that the accident's cause was attributed to poor weather, visibility, and decision making rather than mechanical failure. The military subsequently conducted a comprehensive review and overhaul for its rules for airbone safety regarding high-ranking personnel travelling in similar aircraft."

 ROC.77.a: "We give our condolences."

 ROC_77_tt: "§YThe accident resulted in a total of eight fatalities and five survivors. The deceased include:§!\n\nChief of the General Staff, General §YShen Yi-ming§!\nDeputy Director of the Political Warfare Bureau, Major General §YYu Chin-wen§!\nAssistant Deputy Chief of the Intelligence Bureau, Major General §YHung Hung-chun§!\nDivision Director, Office of the Deputy Chief of the General Staff for Operations and Planning, Major §YGeneral Liu Chen-fu§!\nStaff Officer, Office of the Chief of the General Staff, Lieutenant Colonel §YHuang Sheng-hang§!\nStaff Officer, Air Force Operations and Planning Division, Lieutenant Colonel §YHan Cheng-hung§!\nFlight Crew Member, Staff Sergeant §YHsu Hung-pin§!\nFlight Crew Member, Master Sergeant §YChang Chih-kuang§!\n\n"


 ROC.78.t: "China Suspends Taiwanese Pineapple Imports"

 ROC.78.d: "On February 26th, 2021, the General Administration of Customs of The People's Republic of China announced the suspension of pineapple imports from Taiwan, effective March 1. The GACC cited the repeated detection of harmful pests such as mealybugs as reasoning for the ban. As China had long been the largest export market for Taiwanese pineapples, this manuever instantly threatened Taiwan's pineapple industry and the livelihoods of many Taiwanese farmers.\n\nThe Taiwan government promptly responded by strengthening quality control, assisting in the diversification of export markets, launching domestic sales promotions, and implementing processing-procurement mechanisms. Meanwhile, private enterprises, e-commerce platforms, restaurants, buisnesses, and local governments rallied to support procurement and marketing efforts. A \"Support Pineapples\" movement swept across Taiwanese social media, with large numbers of citizens backing farmers through actual purchases; pineapple-based dishes, processed pineapple products, and creative marketing campaigns quickly became a viral trend.\n\nThe government stated that export markets for Taiwanese pineapples would be gradually diversified to include Japan, Hong Kong, Singapore, and the Middle East, while the issue of over-reliance on a single market once again become a focal point of policy discussions.\n"

 ROC.78.a: "This won't help them!"


 ROC.79.t: "Taroko Express Derailment Accident"

 ROC.79.d: "At 9:28 AM on April 2, 2021, at the northern entrance of the Qingshui Tunnel on the North-Link Line of the Taiwan Railways in Xiulin Township, Hualien County, Taiwan, a TEMU1000 train carrying 498 people derailed before entering the tunnel after hitting a construction vehicle that had slid down the slope onto the tracks. Due to inertia, the train continued to slide forward and crashed into the tunnel, causing severe damage to the carriages, resulting in 49 deaths and 309 injuries.\n\nAlthough the relevant departments of the Republic of China initiated rescue and repair work immediately after the accident, the narrow and long tunnel and the landslide disaster made the rescue work extremely difficult, resulting in the serious consequences of 49 deaths and 309 injuries.\n\n"

 ROC.79.a: "Conduct an investigation to prevent any similar tragedies."


 ROC.80.t: "7.2 Magnitude Earthquake hits Hualien"

 ROC.80.d: "In the early morning of April 3, 2024, a strong earthquake with a Richter magnitude of 7.2 struck Hualien County, Taiwan. The epicenter was located off the coast of Hualien at a depth of about 20 kilometers. This earthquake is one of the most severe natural disasters in eastern Taiwan in recent years, causing major damage to Hualien and neighboring counties and cities.\n\nFollowing the earthquake, buildings collapsed, roads cracked, and bridges were damaged, triggering multiple mudslides and landslides that disrupted transportation, power supplies, and water and electricity facilities. Initial statistics indicate dozens of deaths and hundreds of injuries, with many homes and public facilities severely damaged, prompting emergency evacuations of residents."

 ROC.80.a: "Our condolences goes to the victims\" families."


 ROC.81.t: "Typhoon Danas Makes Landfall in Chiayi"

 ROC.81.d: "On July 6, 2025, Typhoon \"Danas\" moved north from the South China Sea and made landfall in Budai Township, Chiayi County in the afternoon, causing torrential rain, strong winds, and flash floods in central and southern Taiwan. The typhoon was powerful, with maximum wind speeds reaching 45 meters per second, and accumulated rainfall exceeding 500 millimeters in some mountainous areas, bringing a high risk of large-scale flooding. After landfall, severe flooding occurred in multiple central and southern regions, with coastal areas experiencing wind damage and seawater intrusion. Traffic in Chiayi, Tainan, and Yunlin was paralyzed, with highways and provincial roads cut off in many places. Initial statistics show the typhoon caused at least 2 deaths and dozens of injuries. Some crops and houses were damaged, and residents were urgently evacuated to shelters.\n\nIn the eastern mountainous areas such as Hualien and Taitung, continuous torrential rain and steep terrain triggered landslides and mudslides in rivers like Mataian Creek and Xiulin Creek, forming several barrier lakes. The water level in some barrier lakes rose rapidly, creating a high risk of dam failure. Local governments and water conservancy units immediately launched evacuation and rescue operations, forcibly evacuating nearby residents to prevent secondary disasters from causing major casualties.\n\nThe barrier lake incidents blocked roads, flooding or damaging some mountain villages and farmland, and temporarily disrupted civilian water and power supplies. The central and local governments coordinated airborne, firefighting, and public works units to dispatch excavators and rescue equipment for barrier lake drainage operations, and set up temporary safe passages."

 ROC.81.a: "Dispatch search and rescue!"


 ROC.82.t: "The Qingming Festival"

 ROC.82.d: "The April rain falls in sparse drops, casting a hazy mist over the lush green landscape.\n\nIn his youth, Old Xia was accustomed to this rain. Back then, when he carefully looked through the gaps in the swaying green willow branches, he could still see fine silver needles passing through, stitching into the verdant ground, unlike the blur he sees today. Old Xia steps into the soft spring mud; the fine rain passes through the swaying green willow branches and also through his body, stitching him to the ground, making him feel a faint tickle. He didn't bring an umbrella; there's no need for one in such rain, just like the free times of his youth in that homeland of white clouds.\n\nToday is the Qingming Festival, and he is on his way to visit several old friends he hasn't seen in a long time. Small hills rise and fall, and narrow paths twist and turn. If it were in the past, he would be riding a fast horse with a light whip. Looking back, the shallow grass wouldn't cover his footprints, leaving only a string of joyous laughter echoing all around. Now, he is walking step by step, firmly treading on this soft soil. Compared to the past, his steps are steadier, and he can better feel how solid this earth is-solid enough to support a withered body and an aging, sinking heart."

 ROC.82.a: "Things remain while people vanish; tears flow before words can form."


 ROC.83.t: "Climbing up the Hill"

 ROC.83.d: "In the hazy vision, several dark green dots appear, gradually becoming clusters, and finally pillars. Those are willow trees, standing far off in Old Xia's field of view, their slender branches gently swaying, reveling in the spring breeze. Beneath the willows are more uneven little mounds of earth, looking like many inverted large funnels, with several moss-covered stone tablets erected in front.\n\nOld Xia quickens his pace. The slope of the hill is not steep, and he makes his way down smoothly. The willow trees scattered across the field also seem to have gathered closer. He brings wine, as well as braised beef. When he was a tenant farmer in his childhood, he only ever saw the landlord eat it. The landlord's mouth would open and close, and a plate of braised beef would be mostly gone, followed by the smell of alcohol and bursts of laughter. He still remembers the landlord being in a good mood one day and rewarding him with a few slices of meat. It was only later that he found out it wasn't braised beef, but for the rest of his days, he always thought of those few slices as braised beef.\n\nHe stands quietly in the rain among them, and the vitality stretching from beneath his feet spreads all the way to the top of his head. This feeling makes him very nostalgic. It is the taste of youth. Something warm streaks across his face. He misses home."

 ROC.83.a: "After a long while."


 ROC.84.t: "Tears Flow Before Words Are Spoken"

 ROC.84.d: "Trembling, Old Xia pulls out a few clean, small porcelain cups from his pocket. He places them in front of him, close to the small mounds of earth, as if erecting a transparent wall. Outside the wall, he is left all alone; inside the wall is the silence of the crowd. It is also like a road extending from the depths of memory to these little mounds, lying across in front of Old Xia. His movements as he pours the wine are very slow, yet very steady. He thinks back to his days in the army, those common soldiers who drew the death-squad lots. Some were very heroic, others trembled, but in the end, after downing a bowl of wine, they all shouted about fighting the enemy to the death, as if dying was not worth mentioning in the face of wine.\n\nHe downs a cup himself-pungent, spicy, and then rushing to his nose. He forces it down, tears welling up in his eyes. He has never been a drinker, nor does he understand why this stuff possesses such great magic. But imitating the grey, uniformed figures in his memory, he drinks cup after cup, until the world spins before his eyes and his head feels swollen and dizzy, only then does he stop.\n\nHe picks up the filled wine cups and staggeringly stands up, pouring them one after another beside those small mounds. The rain falls into the cups, creating faint ripples. After finishing all this, he kneels down and kowtows heavily a few times. With a trembling voice, a few broken syllables tumble from his mouth:"

 ROC.84.a: "\"Brothers... your little brother is useless... I couldn't bring you back to the mainland... couldn't bring you home...\""


 ROC.85.t: "Joy of Reunion"

 ROC.85.d: "\"...You're here?\"\n\n\"...I'm here.\"\n\nIn the hospital room, the pale walls constrain a gaze that lacks the strength to look far. The sounds from outside are also mosaiced by the walls, becoming blurry and unclear-it is extremely quiet.\n\nOld Xia pulls out the stool beside the hospital bed and sits down. His movements are very light, only stirring a few gentle breezes that make the corners of his clothes flutter. Old Xia hears a heartbeat and heavy breathing, but he doesn't know if they are his own or the person's on the bed. He opens his eyes to look at the person on the bed, only to find that the other's eyes are almost narrowed to a slit. In his memory, those eyes weren't like this.\n\n\"...What happened to your eyes?\"\n\n\"I can't see your face clearly anymore, I've grown old.\"\n\nThe voice of the person on the bed is heavy, his throat seemingly blocked by something, his pronunciation accompanied by the trembling sound of teeth when enunciating words. Old Xia grasps the hand resting on the white blanket. The hand is very cold and rough, with calluses of varying sizes scattered across its broad palm. The palm is very thick, and Old Xia has to use both hands to hold it tightly.\n\nOld Xia's throat chokes up, and his eyes suddenly turn warm, but he controls it, only letting the tears carve scars within his heart.\n\n\"Tell me about this guy, how is it that when you say something's wrong, something actually goes wrong? You were still in good spirits when I left Taipei a few days ago. How did you end up like this just by returning to Yilan this time...\"\n\n"

 ROC.85.a: "For ten years, living and dead have been parted without a trace..."


 ROC.86.t: "...Without Thinking"

 ROC.86.d: "His voice began to tremble. Old Zhang reached out his other hand and rested it on top of Xia's, shaking his head gently as if rejecting his friend's grief.\n\n\"That's just what getting old is. The body weakens, the bones grow brittle. No matter how careful you are, it comes for everyone, some sooner, some later. It's no big deal.\"\n\n\"I've lived a long life. I've fought in hundreds of battles, big and small. I've killed dozens of scoundrels. Death? I'm not afraid of it. Everyone dies eventually…\"\n\nOld Zhang averted his gaze, looking away from Xia.\n\n\"It's just… I didn't die at home. I didn't die on the mainland. I never got to see my mother one last time, never got to fulfill my duty as a son to her and my father. That is my single greatest regret…\"\n\nOld Zhang's voice faded into quiet sobs. He slowly turned his head back to Xia, his eyelids fluttering and his eyes trembling as he took in his friend's face.\n\n\"…It's a matter of days now… Old Xia, I'm afraid I won't be going back…\"\n\nOld Zhang's voice quivered. He pressed his hand firmly against Xia's, deep furrows creasing his brow as his breathing grew heavier.\n\n\"But I don't want to be buried here. I don't want to be buried in Taiwan. Old Xia, this isn't my home. When I'm gone, I beg you to take my ashes back home. Bury me there, don't raise a gravestone. I have no face to meet the generations after me……\""

 ROC.86.a: "\"Even less face to meet the spirits of my parents in heaven...\""


 ROC.87.t: "Hard to Forget"

 ROC.87.d: "The corners of Old Zhang's eyes pulled upward. He began to sob, his wails like a violent gale battering a withered tree in the desert.\n\n\"Old Xia... I'm begging you... this is the only wish I have, brother...\" Old Xia bit his lip, tasting the faint, metallic tang of blood. He nodded heavily and tightly gripped Old Zhang's hand. His throat was tight and stiff, yet his gaze towards Old Zhang spoke a thousand words.\n\n\"That's good... that's good...\" Old Zhang slowly withdrew his hand, a blissful smile spreading across his face. He mumbled something-his voice growing fainter and fainter until Old Xia could no longer make out the words. Eventually, the room became still. \n\nHe heard the sound of a heartbeat. He knew it could only be his own.\n"

 ROC.87.a: "Old Zhang had breathed his last."


 CHI.TW.5.t: "Political Ban"

 CHI.TW.5.d: "As the fires of war erupted, the island quickly entered a state of full mobilization. With the simultaneous rise in missile threats and landing risks, high-level government officials began to focus on another invisible front: internal political stability and security risks.\n\nEven before the war, intelligence agencies had warned that extremist ideological organizations could be radicalized in a wartime environment, potentially becoming nodes for infiltration, incitement, and sabotage. Whether it was fascist groups advocating for extreme nationalism and authoritarian rule, or communist organizations with ideological ties to the regime across the strait, both were viewed as unstable factors that could affect wartime solidarity and national security.\n\nEffective immediately, the activities of all political parties and organizations with fascist or communist characteristics are temporarily banned."

 CHI.TW.5.a: "...Purge the Traitors"

 
 CHI.11.t: "First-Ever Negative Population Growth in Taiwan"

 CHI.11.d: "The Department of Household Registration has recently finalized their 2020's report, revealing that Taiwan has officially entered into negative population growth. Over the past year, the island recorded only 165,000 births-an all-time low-while the number of deaths reached 173,000. This \"death-cross\" in population change combined with a net migration loss caused by COVID-19 travel restrictions has resulted in Taiwan's first-ever period of decline in population. Along with a plummeting birth rate and an aging society, a long-term crisis that threatens the very foundations of our nation now looms over our island. The government must take immediate action, else the decline in our nation's strength will become irreversible."

 CHI.11.a: "This is a national crisis we must face..."


 CHI.3.t: "The Tragedy Across the Pacific"

 CHI.3.d: "The power that long maintained order in the Pacific has plunged into its own civil war and division. Port blockades, military deployments, and political chaos in the United States have suddenly left once-stable maritime routes and trade networks completely unmoored. This conflict across the ocean has directly shaken the international environment we rely on to survive. Financial markets are in turmoil, and with exports and supply chains severed, an unprecedented vacuum has opened in regional security. The Pacific is no longer a symbol of peace and prosperity. It has become a source of turbulence and uncertainty.\n\nThe old order has been reduced to ashes, leaving us as an isolated island in the storm."

 CHI.3.a: "The Old Order, Burnt to Ashes."


 CHI.7.t: "Late night at the Presidential Office"

 CHI.7.d: "As report after report landed on the President's desk, the world before Tsai Ing-wen seemed to be collapsing.\n\n\"This is impossible,\" she thought. \"Has the U.S. really just fallen apart like this?\" Yet the reality was as stark as the flames rising across the American mainland: Taiwan had lost U.S. protection and would henceforth have to forge its own path. Compared to the looming threat of the PLA across the strait, the economic crisis triggered by the U.S. collapse seemed almost trivial. Reports of multiple unusual maneuvers by the PLA signaled that the flames of war were reigniting across the Taiwan Strait-a region that had remained largely peaceful for four decades-as PLA missiles and fighter jets streaked through the skies overhead. After a brief moment of fright, Tsai Ing-wen stood up and adjusted her glasses; she understood that Taiwan needed her leadership now more than ever."

 CHI.7.a: "Taiwan must stand firm on its own feet."


 CHI.8.t: "President Han's Televised Address"

 CHI.8.d: "As the worldwide economy had plunged into chaos and America descended into civil war, everyone in Taiwan was gripped by a paralyzing fear. The Second American Civil War, as it is now being called, had struck a deep blow into Taiwan's economic and national security. Following an emergency high-level meeting on these affairs, the Presidential Office decided that President Han Kuo-yu would personally address the nation in a televised broadcast. As the \"President of the Common People\" appeared on camera, wearing a grave expression. Despite this, he calmly reassured the nation:\n\n\"Fellow citizens, this is no ordinary economic contraction; it is a fundamental shift in the global order. The foreign currency reserves we hold, the markets we rely on, and the world we once knew - all are quickly becoming a thing of the past.\n\nPlease be assured that emergency measures are already active to keep our financial systems stable and our daily supplies flowing. We will get through this challenge together, and Taiwan will emerge stronger and more resilient than before.\""

 CHI.8.a: "\"We will get through this.\""


 CHI.9.t: "Victims and Perpetrators"

 CHI.9.d: "Today marks the annual ceremony for the annulment of criminal convictions. The Transitional Justice Commission hosts these pardon ceremonies and press conferences-events that serve to remind the nation of its past, yet simultaneously reopens old wounds for the victims.\n\nUpon entering the venue, Lan Guoben took his seat with the help of a volunteer, his wrinkled hands resting folded in his lap. His father had been persecuted and imprisoned by the Kuomintang government simply for voicing a few complaints; he was subjected to days of continuous torture without release. His mother had contacted every relative and friend capable of lending money to bribe the police, yet they could never scrape together enough. Ultimately, Lan Guoben was left with no choice but to agree to become a government informant, tasked with monitoring classmates who \"spoke out of turn.\"\n\nHis father used to accompany friends into one underground reading room after another, aiding the government in the successive arrests of classmates who had once been full of youthful vitality. The tables were piled high with hefty volumes bound in bright red covers-Capital, The Communist Manifesto, The State and Revolution... It was said that these books were stained with the blood of the working class in their struggle; to him, however, they were forged from the hot blood and lives of his own schoolmates.\n\nAs President Tsai Ing-wen recited the names of those being pardoned, Lan Guoben was haunted by the realization-learned only after martial law was lifted-that his father had been beaten to death the very night he had gone to plead for his life. Everything he had done had merely served to abet the tyranny. In his dreams, Guoben often heard a chorus of young yet distant voices demanding to know why he had informed on them-why he had sent them to their deaths.\n\nYet Lan Guoben could say nothing; choked with emotion, he sat silently on the cold iron chair, the chill biting into his soul. Only when the crowd had dispersed did he-trembling and leaning on the volunteer for support-rise and slowly walk out of the venue."

 CHI.9.a: "This is not a pardon for his father's crimes, but yet another trial against him."

 
 CHI.99.t: "Operation Desert"

 CHI.99.d: "On the Arabian Peninsula under the scorching sun, there is nothing but yellow dust filling the sky and shimmering heat rising from the ground. An airfield built here stands out conspicuously, with no towering mountains nearby to restrict an attacker's route, nor any densely packed urban areas to construct solid defensive lines.\n\nHowever, for the National Revolutionary Army arriving belatedly to assist their allies, they truly have few choices other than to trust the local defenders.\n\nFollowing the battalion commander's orders, Wang Qiushi unbuckled his shoulder harness and instructed his platoon leaders to have everyone do the same. The smell of mold and sweat from the seatbelts had accompanied him on a flight lasting five or six days. The aging C-130 was not just \"outdated\"; there hadn't even been a chance to clean or replace the various supplies and equipment inside the fuselage. Looking on the bright side, the journey was finally over... Wang Qiushi, clutching his T91 rifle, stepped down from the rear ramp, immediately hit by waves of scalding heat. Why had someone so close to retirement age been reassigned to this desert? Does heaven just love messing with people?\n\nAfter disembarking, falling in, and taking a headcount, a logistics officer from the Arab Republic approached to speak with Captain Wang. Looking confused, Wang Qiushi hurriedly called for the company translator to help. Five minutes later, several sand-colored M35 trucks pulled up beside them. The officer had them board the trucks, which then drove toward the temporary barracks on the outskirts of the airfield, allowing the exhausted soldiers to rest and acclimatize to the Arabian Peninsula's weather before planning any further operations.\n\nThat night, Wang Qiushi joined a group of ROC and Republic officers for a briefing in the command tent. The various heavy weapons, ammunition, and personnel provided by Taiwan as aid had all arrived successively, with Wang Qiushi's group being the last batch. However, due to the tight schedule of the original deployment, there was no time to equip all units with desert gear in Taiwan; the three-color camouflage on the vehicles and the green digital camo uniforms worn by Wang Qiushi and his men would all need to be replaced.\n\nFortunately, the US military had left behind plenty of logistical supplies during Operation Desert Shield years ago, meaning the clothing could be immediately drawn from American stockpiles. As for the army's heavy equipment like tanks, armored vehicles, and trucks, they would have to be painted in desert camouflage at the base before they could be deployed.\n\nAfter the meeting was dismissed, Wang Qiushi stepped out of the command tent and looked up at the night sky. Orange-red fireballs and anti-aircraft fire of various colors danced against the deep blue curtain. He wondered what kind of night sky his family far away was looking at."

 CHI.99.a: "\"I don't know if I can make it back alive...\""


 CHI.101.t: "The Lost Son"

 CHI.101.d: "He opened his heavy eyelids; the peeling wallpaper clung listlessly to the concrete wall, revealing patches of flaking paint and spreading mold where a corner had been torn away. Ruiming pressed against his pillow and rolled over; the empty side of the bed held nothing but a solitary gray pillow. He squeezed his eyes shut, gasping for breath, then forced himself up, threw open the door, and rushed out of the room-he had survived another day.\n\nRuiming turned on the gas, but the stove refused to light. \"Right...\" He had tried to leave the gas on a few days earlier, only to be discovered by a neighbor; a well-meaning auntie had helped him \"locate\" the source of the smell and shut off the gas.\n\nHe rummaged through the cupboard and found some instant noodles bought years ago, preparing two bowls and placing them on the table. He sat on his side, gazing vacantly at the empty space opposite him, clinging to a faint, irrational hope that his son might be lying on the living room sofa, scrolling through his phone as usual. Ruiming carried the two bowls of noodles slowly toward the living room. Unsurprisingly, he was alone.\n\nHe sat down slowly; the steam from the noodles dissipating quickly. He wanted to wait in the living room for his son to return-perhaps the boy had simply gone to class early? He would see him after school, surely... The dim, amber sunlight shimmered in the noodle bowls. Ruiming snapped awake-how had he dozed off? If he didn't pick up his son, the boy would surely roll his eyes at him again! He ate every last bit of the noodles, now soggy and limp, and casually added a tally mark next to the rows of strokes covering his son's obituary-a reminder that he still owed his son a bowl of noodles. Clutching the obituary and the empty bowl, he limped up to the roof, embracing the last sliver of twilight as he stared into the void."

 CHI.101.a: "Only in death does duty end."


 CHI.102.t: "Cleaning House"

 CHI.102.d: "Deep within the National Security Bureau, in a dim room absent even from the building's blueprints, Agent Su and his team gathered around a crude iron camping table. Scattered across it were dozens of standard-issue folders containing mugshots, alongside thick stacks of documents piled high like a small mountain-the fruits of over a decade spent tracking pro-CCP figures. These subjects ranged from retired generals and young Taiwanese business people to certain spouses from the mainland. Since the 1980s, the CCP had attempted to infiltrate various sectors of Taiwanese society, waging cognitive warfare-both overt and covert-to sway public opinion.\n\nIn the past, constrained by close cross-strait civilian ties, the Bureau had feared that drastic measures might trigger uncontrollable social repercussions. But times had changed; Taiwan had successfully repelled the People's Liberation Army, and the moment had come to turn their sights inward. Agent Su lit a cigarette. Across the country, SWAT teams were acting on the intelligence his unit provided to apprehend collaborators; tear gas and rubber bullets would instantly neutralize any resistance, while shields and rifles would deal with the die-hards who refused to surrender... Agent Su exhaled a slow plume of smoke. He had never imagined he would live long enough to personally purge those traitors. His gaze rested on the dark gray concrete wall. Unlike the soldiers fighting bravely on the front lines, the enemies he faced were far more insidious and adept at concealment-yet, so long as he could protect the Republic of China..."

 CHI.102.a: "He's willing to give up his entire life protecting it."


 CHI.103.t: "Lowering the Banners"

 CHI.103.d: "As the smoke of battle clears, society seemed to return to normal. Were it not for the surrounding wreckage, one might mistake it all for a dream.\n\nThe red dragon has been driven back to its lair, yet the land itself is no longer what it once was. Scars of combat linger at the harbor, damaged fortifications remain visible on the city's outskirts, and transportation hubs show signs of strain from prolonged, over-capacity operation. From the front lines to the home front, from factories to households, the entire society bears deep wounds from the long period of fighting. People are returning to their daily lives, only to discover that \"normalcy\" itself has changed. Some were left traumatized, some had lost everything, and some never returned. Yet, the end of the war also heralds a new beginning. The nation and its people must heal and rebuild. This will not be a process completed overnight. Amidst the smoldering embers of war, we will determine the nation's future - Whether to return to the past, or to step into a new reality vastly different from before."

 CHI.103.a: "President... what should we do next?"

 CHI_unlock_reconstruction_tt: "Will unlock Post-War Reconstruction Focus Tree."


 CHI.104.t: "Four Years in a Flash"

 CHI.104.d: "Four years can be a time of brilliance or a time of banality; it is a span long enough for carefree university students to travel the globe, yet also long enough for society to spin its wheels, achieving nothing. For Taiwan, this cycle has seen its people through one hardship after another-hardships met with remarkable resilience. Whether facing natural disasters or man-made crises, Taiwan has always endured.\n\nSince the lifting of martial law, the island's social climate has undergone profound changes. Over decades of development, people have grown accustomed to a society that shifts in four-year cycles. The familiar spectacle of election fever arrives right on schedule, bringing candidates, debates over unification versus independence, and fierce online clashes that never fail to surprise the public. Yet, once the frenzy subsides, another quiet four-year stretch follows. Perhaps there is a certain fortune in a lifetime of such tranquility...\n\nYet, the invasion by the People's Liberation Army had brutally transformed Taiwan into a cruel meat grinder, with blood and tears watering the rice paddies of the Chianan Plain. The people still struggle to heal the wounds of war. But the future waits for no one. The curtain is quietly rising on the next presidential election-yet this time, there wasn't the usual frenzy of the media and of loudspeakers; there is now only the bewilderment of the Taiwanese people and their most earnest yearning for the future."

 CHI.104.a: "The die is cast."


 CHI.105.t: "Hand in Hand"

 CHI.105.d: "Holding a plain white bag from the adults, Aiqi led her \"best friend\" by the hand over to that familiar little corner. She sat down and tore open the package; inside were items of various sizes. She couldn't read the writing on them, but they were likely food-at least, that's what the adults had told her. Aiqi broke a piece off a biscuit and handed it to her \"friend.\" \"Here, this is for you.\" Jiaqi-her teddy bear-hadn't been very talkative lately and usually didn't eat anything, so Aiqi broke off a few extra pieces this time. A chubby Jiaqi would be much cuter, after all. She gazed into the distance toward home-not the new home in the tent where they were staying now, but the old one. A few times, she had wanted to go back to the old house to find her dad and grandma. However, the men in green clothing nearby wouldn't let her, that it was too dangerous and warning her about something called \"...unexploded ordnance?\" She didn't know what that meant; she would ask her teacher about it next time she went to school.\n\nAiqi broke off another piece of biscuit, chewing quietly. Despite trying to satisfy her empty belly, nothing could satisfy the longing for her parents. Every time she asked the green men about them, they simply shrugged and said that she should return to the playground. Aiqi grabbed Jiaqi and hugged her stuffed friend tightly. Although this little corner of stone walls felt a bit lonely, it also felt safe.\n\n\"Oh! So this is where you ran off to?\" Aiqi looked up to see a blonde woman in a blue vest standing before her. \"Are you still hungry?\" Aiqi was about to shake her head when her stomach betrayed her with a loud growl. The woman smiled with a smile as lovely as her teacher's. She then seemingly reached behind and took a small bun out of thin air, placing it right into Aiqi's palm."

 CHI.105.a: "“Next time, you mustn't go wandering off alone, okay?”"


 CHI.106.t: "Eastern Reconstruction"

 CHI.106.d: "The glaring sunlight illuminated the entire train carriage. Chen Zihao reflexively raised his hand to block the sun, but no matter how he tried, he just couldn't lift it. Looking around, the small carriage was packed like a can of sardines, with everyone squeezed tightly together-a density of people probably only matched by the Taipei Metro during rush hour.\n\nIn the aftermath of the war, much of Taiwan was waiting to be rebuilt. People like Zihao were assigned by the government to repair infrastructure across the island-high-voltage power lines, underground water pipes, the main longitudinal railway... rushing north and south, trying to re-establish connections between the different regions. The Chu-Kuang Express train slowly braked to a halt; the platform lights flickered on and off. Zihao followed the flow of people onto the platform. The South-Link Line had only recently been repaired and put back into service, making it the sole transportation route currently connecting the east and west.\n\n*Beep!* With a sharp blast of his whistle, the foreman called everyone to assemble outside the station. Zihao and his group were the first engineering team tasked with rebuilding Hualien and Taitung. They would be deployed first to the most dangerous and critical areas, laying a solid foundation for the subsequent support efforts.\n\nChen Zihao took a deep breath, wiped the beads of sweat from his forehead, and along with the others, picked up his shovel to start clearing the chunks of broken concrete on the ground..."

 CHI.106.a: "A journey of a thousand miles begins with a single step."


 CHI.107.t: "Where do we go from here?"

 CHI.107.d: "Inside a recently reopened stir-fry restaurant in Taichung, workers who had spent the day sweating to rebuild their homeland gathered around a folding table to indulge in the night. With a *pssh*, a beer can tab was popped, and refreshing bubbles fizzed from the opening. *Gulp, gulp*-the golden wheat beverage slid down their throats, sending a cooling thrill through their bodies. \"Hah! I feel alive again!\" one of the workers exclaimed with a joy akin to a newborn's birth; had he not been trying to maintain his machismo, he might have even shed a tear. The nation's reconstruction was advancing steadily, and everyone's thoughts were focused on restoring their homeland to its original appearance-or making it even better!\n\nThe workers drank to their hearts\" content, imagining the brand-new look their home would take on.\n\nSuddenly, a news broadcast on the television caught their attention.\n\n\"As Taiwan's reconstruction gradually reaches completion, under pressure from opposition parties, President [CHI.Getleader] has agreed to resume the presidential elections. Currently, various political parties are conducting internal primaries to field their candidates. With public opinion now completely reshuffled, which party will ultimately take power? What kind of future will Taiwan face? Stay tuned for our follow-up reports.\"\n\nAfter the broadcast ended, the workers erupted into chatter. The Taiwan Strait War had united the entire island, and external factors would no longer influence Taiwan's electoral process. However, people could no longer use the traditional dichotomy of \"who can best protect Taiwan\" to cast their votes. The distribution of voter support had been completely scrambled. Watching the news on TV, the workers fell into a state of bewilderment..."

 CHI.107.a: "Yeah, how are we supposed to choose now..."


 CHI.108.t: "Kaohsiung Port Damage Assessment and Reconstruction Report"

 CHI.108.d: "President, the damage inventory for transportation nodes in the central and southern regions has been preliminarily completed. The Kaohsiung Port area and its surrounding commercial districts were severely devastated by several rounds of PLA missile strikes and artillery fire. The safety and resettlement issues for civilians have been preliminarily resolved. A large amount of PLA military equipment was also left on the coast, most of which was destroyed beyond repair during their retreat. However, numerous weapons were still abandoned in the beachhead positions near the port area, including: one Type 728 hovercraft, three Type 726 hovercrafts, ten ZLT-05 amphibious armored assault vehicles, two hundred sets of various artillery, several light and heavy machine guns and rifles, and thousands of rounds of ammunition. Most of these have been received by the garrison forces at Zuoying Naval Base and transported to concealed warehouses pending further arrangements.\n\nThe following is a summary of the Kaohsiung Port damage assessment report:\n\n1. The damage to the Intercontinental Phase II Logistics Warehousing Area and the bulk cargo wharves is extremely severe. During the war, the ROC Armed Forces and the PLA engaged in close combat here several times. Intense missile strikes and fire support from hovercrafts rained nearly a hundred rockets onto this area; the ground facilities have essentially no possibility of being repaired, and it is recommended to completely demolish them.\n\n2. The Seventh and Sixth Container Centers within the Second Port, as well as the surrounding port areas and industrial facilities, all suffered varying degrees of damage from missile bombardments. However, after investigating the losses at the Talin Power Plant, we discovered obvious signs of deliberate sabotage in the internal cooling systems and gas turbines. We are currently actively cooperating with the National Security Bureau to investigate the situation; the plant manager has already submitted the personnel duty roster and surveillance footage of the various areas to us. Please refer to page 31 for related issues and details.\n\n3. Currently, there are less than twenty operational wharves available. Liquid cargo wharves 27 and 28 were directly hit by aerial bombs and missiles, and a large amount of debris is still being cleared. During the cleanup process, an engineering team was accidentally injured by an unexploded ordnance, resulting in a tragedy of four dead and twenty-one injured, making the cleanup work in this area extremely difficult. Wharves Xinbin 1 and 2 can maintain basic operations thanks to emergency repairs by combat engineers, but currently can only berth a portion of smaller warships. The remaining large vessels, including those of the Seventh Fleet, can only temporarily berth at wharves S1~S5. Please refer to page 12 for the specific list.\n\nThe above is our simplified preliminary report and summary following the damage to Kaohsiung Port. Kaohsiung Port currently requires an urgent injection of funds and manpower to restore normal operations. The specific reconstruction plan and required resources are attached in the final section of this report. We hope the President will reply as soon as possible..."

 CHI.108.a: "\"It is indeed severe...\""


 CHI.109.t: "Taoyuan Airport Reconstruction Affairs"

 CHI.109.d: "Ah-Wei wiped the sweat from his brow; he was an ordinary construction worker. During the war, Taoyuan Airport was completely destroyed by PLA paratroopers and helicopters attempting to capture it, followed by missile strikes. After the war ended, rebuilding Taiwan's largest international airport was made a top priority. Army engineering units quickly leveled the runway as fast as possible, establishing a temporary control tower to restore basic operations.\n\nAfterward, countless construction workers and volunteers like Ah-Wei arrived at the ruins. They cleared the bombed-out debris, pulled out the remains of soldiers from both sides buried under the rubble, and recovered anything of value. Once the cleanup was complete, they began excavating the foundation. The government decided to take advantage of the surrounding ruins to expand and optimize this most important airport in Taiwan during its reconstruction, making its internal flow and layout more scientific and comfortable. Truckload after truckload of concrete was poured into the foundation pit. Bit by bit, they rebuilt what was once Taiwan's largest, most bustling, and heavily trafficked airport-making it even better than before.\n\n\"Food is ready!!!\" a volunteer's voice rang out in the distance. At current reconstruction sites, there are many volunteers assisting the workers; directing traffic, providing first aid, and handling logistics all depend on their contributions. Ah-Wei walked over, and a volunteer auntie handed him a bento box. Braised pork-not bad today. Ah-Wei sat in a chair, ate his bento with oolong tea, and then threw himself back into the reconstruction, throwing himself into the revival of Taiwan."

 CHI.109.a: "United as one, to restore Taiwan."


 CHI.110.t: "Charting the Course"

 CHI.110.d: "As the work of rebuilding our homeland comes to a close, the people have recalled the fundamental right they ought to exercise: the right to vote. The war has entirely refreshed the Taiwanese perspective on politics, and every single vote cast will indeed profoundly impact the future of the nation.\n\nIn the Taiwanese political arena, the Kuomintang and the Democratic Progressive Party fundamentally stand as equals. The Kuomintang advocates maintaining ties across the strait so that, at some point in the future, they can launch a counterattack on the mainland and once again fly the Blue Sky, White Sun, and a Wholly Red Earth over China. The Democratic Progressive Party advocates for the regime to settle on this small island in the Western Pacific, maintaining a nation that belongs to the Taiwanese.\n\nMany futures that we previously dared not imagine are now springing up like mushrooms after rain, now that the PDTO has gained the upper hand. When the next January arrives, the people will discover the greatest common denominator of societal consciousness and designate the direction for the future. The Kuomintang? The Democratic Progressive Party? Or perhaps a third option?"

 CHI.110.a: "Hope all goes well."

 CHI.110.b: "The rest of the DPP's content has not yet been completed, stay tuned!"


 CHI.111.t: "The Future of the Republic"

 CHI.111.d: "Taiwan... no, the Republic of China's performance during the Taiwan Strait War has demonstrated to the entire world our unwavering resolve to defend our free will. In international diplomacy, nations that had previously severed ties with us under pressure from the Chinese Communist Party are beginning to extend a hand of friendship to the Republic of China. As the CCP's international influence wanes, we can finally proudly acknowledge our true national name, formally participate in various international organizations, and embrace the beautiful Blue Sky, White Sun, and a Wholly Red Earth at international sporting events.\n\nNow, we must elect the next presidential candidate who can truly represent the Republic of China. The Democratic Progressive Party, with its Taiwan-centric core, is outside the scope of consideration here. The Kuomintang must now decide which candidate to put forward to unite all pro-Republic factions. Where will this leader take the nation? Will they take up the mantle of Generalissimo Chiang's unfulfilled ambitions, or will they forge an entirely new future?"

 CHI.111.a: "If you want to vote, vote for President Han!"


 CHI.121.t: "The Will of the People!"

 CHI.121.d: "As certain candidates put on elitist faces for televised speeches, President Han Kuo-yu has already clocked out and headed to his usual wet market. Passing aunties greet him warmly as \"Boss Han,\" and vendors always slip him an extra bunch of green onions with his groceries. Shopping done, he stops by his favorite food stall to pick up three bowls of braised pork rice to enjoy at home with his family.\n\nThis close connection with the people is Han Kuo-yu's distinct political philosophy. He shows the Taiwanese public that politics is neither a comedy routine broadcast on television and the internet, nor cold spreadsheets and economic data. It is about living a grounded life alongside everyday citizens. He wants the public to know that when hardship strikes, Boss Han will never desert them. He will step forward in the most difficult moments!\n\nSharing in the joys and enduring the hardships together is the idealism Han Kuo-yu stands for!"

 CHI.121.a: "Four more years for President Han!"


 CHI.130.t: "Elections as Scheduled"

 CHI.130.d: "It is once again our quadrennial election day, but this time, it truly feels different from the past. The familiar sights of candidates sweeping the streets for votes and holding massive rallies are gone. Instead, people are gathered around their radios listening to this year's election instructions. Veterans leaning on canes sit with their comrades in veterans\" homes, staring intently at the lobby radio. Fathers finishing work pull their daughters, just home from school, to turn on the television, while university students in classrooms are entirely fixated on live streams on their phones.\n\nAll day tomorrow, the people will set aside their work. In elementary school classrooms, in gymnasiums, and in temporarily erected tents, they will receive their ballots, stamp them, and drop them into the ballot boxes. Everyone knows in their hearts that the vote in their hands will truly determine the future of our society."

 CHI.130.a: "The future of the Republic..."


 CHI.141.t: "Arrival by Chance, Victory by Destiny!"

 CHI.141.d: "After his defeat in the 2020 presidential election, Han Kuo-yu never imagined he would once again be nominated by the Kuomintang as their presidential candidate. The people have not forgotten how he left his post as Mayor of Kaohsiung halfway through his term to run for president. However, they also have not forgotten that during the Republic of China's most critical moment of life and death, he did not choose to flee. Instead, he stayed on this land to stand and fall with the people. His diehard supporters remain steadfast in their backing, and centrist voters, exhausted by political mudslinging, are willing to give him a second chance.\n\nWith tears in his eyes, Han Kuo-yu delivers a resounding speech, declaring his resolve to march into the future shoulder to shoulder with the people. He will never run away again. This time, he will absolutely make Taiwan prosperous!"

 CHI.141.a: "The bald guy follows the moon, and we follow the bald guy!"

 P2HKY_unlock_tt: "Unlocks the §BHan Kuo-yu§! political focus branch and the §BKuomintang§! economic and military focus branches."

 
 CHI.BF.11.t: "Going Home"

 CHI.BF.11.d: "The sea breeze blew gently past the guardhouse, ringing the bell on the door, as waves crashed ashore in rhythm with the wind. Huang Xingding leaned against the peeling iron railing, his right hand habitually rising to his lips to mimic a smoking motion. Kinmen's coastline offered more variety than Penghu's, and the bustling Xiamen skyline at night always filled him with a deep yearning. During his childhood, his grandfather and father would often recount their days fishing in Xiamen and describe the green hills and clear waters near their ancestral home. When the Kuomintang retreated to Taiwan, they conscripted his grandfather to replenish their troops, and his father later followed suit by enlisting in the army.\n\n\"It's fine even if we can't go back; at least I can still look...\" While others groaned at drawing a Kinmen deployment, his father had been ecstatic. Sadly, he did not live long enough to see the opening of the Mini Three Links. Huang Xingding shifted his stance to lean his back against the railing. He looked toward his home, a small rented house on the island where the ashes of his grandfather and father rested. Although his father always told him it did not matter if they never returned, Huang Xingding felt he owed them far too much. He simply did not know if he would ever have the chance to bring his ancestors back to set foot in that familiar yet alien homeland.\n\nAs the sun set, his relief arrived for the shift change. Huang Xingding slung his rifle and walked the path back to camp. Kinmen Island lay devastated in the aftermath of the Taiwan Strait War, with bullet holes clearly visible on the cliff faces and missile craters dotting the distance. Bypassing these ruins, he stepped onto the tourist trail and walked up to the massive stone monument inscribed with the words \"Wu-Wang-Zai-Ju.\" He had no great fondness for Chiang Kai-shek. Over the decades, however, the former leader had gradually transformed into a symbol that merged with their homesickness, carrying the regrets and unfulfilled wishes of the old veterans far into the distance.\n\nHe pulled the photograph from his helmet liner. Its yellowed surface could not obscure his father's confident face. Back then, the older man firmly believed that the Republic of China would one day retake the mainland and return to their hometown, fully intending to show off in the village when that day came! But given Taiwan's exhausted military strength today, did he truly have a chance to carry his father's dying wish back home? Even if they did return, could they really liberate their mainland compatriots with the triumphant spirit his father had imagined?"

 CHI.BF.11.a: "Nevermind, let's just focus on the task at hand..."


 CHI.BF.21.t: ""

 CHI.BF.21.d: ""

 CHI.BF.21.a: ""


 CHI.BF.100.t: "CM13 Project"

 CHI.BF.100.d: "The current state of global decay is unprecedented in history. The United States is experiencing a civil war, and we, the Republic of China, have just endured a war like no other. During this conflict, frontline soldiers repeatedly lashed out in frustration at our outdated tanks from the last century. Although the outcome of the war was relatively favorable, temporary luck cannot secure our nation permanently. Currently, the National Chung-Shan Institute of Science and Technology (NCSIST) is considering three proposals:\n\nOption One:\nDismantle and analyze the PLA Type 99 and Type 96 tanks captured during the war, modify their calibers and electronic control specifications, and turn them into our new generation of main battle tanks.\n\nOption Two:\nPurchase American-made main battle tanks from allies like Australia and use the same dismantling and analyzing approach. Given that our officers and soldiers are more familiar with the operation and design of American-made weapons, this method is undoubtedly the safest choice.\n\nOption Three:\nApply to Japan for tank production authorization and design blueprints, making minor improvements. The Type 10, developed by Japan for hilly, mountainous, and narrow road terrains, is a good choice for Taiwan's geography, which also features many mountains and few plains.\n\nWe must carefully consider the costs and combat capabilities of the above options so we can survive the next unprecedented war."

 CHI.BF.100.a: "Modify PLA armored vehicles."

 CHI.BF.100.b: "Analyze the M1A2 tank."

 CHI.BF.100.c: "Apply for allied tank technology."


 CHI.H2.11.t: "Election Night"

 CHI.H2.11.d: "Tonight, Kaohsiung City is extraordinarily lively, the streets packed with parades celebrating Han Kuo-yu's election victory. From Yixin Road to Shiquan Road, a river of red, white, and blue surrounds the President. Director Han stands on his campaign truck, waving to the enthusiastic crowds all around-thanking them for their votes, for giving him another chance, and for trusting him once more.\n\nThe thank-you parade continues until two or three in the morning before ending. Director Han drags his heavy body back to the rear seat of the truck. Three consecutive days of street sweeping from north to south have left him exhausted; his nearly seventy-year-old body truly isn't what it used to be! Outside, dim yellow streetlights flicker across his face. His inner distress can only be confided to the distant moon; he knows in his heart that after the baptism of war, Taiwan and its people have been fundamentally changed.\n\nThe past dissipates like smoke. Today, Boss Han remains the captain at the helm, but can he truly steer the Republic of China to the dreamland everyone envisions? The red dragon in the west has only temporarily receded; they still have the strength to make a comeback. News from America in the distant east is extremely chaotic, and there is no chance they will return to the Asia-Pacific in the short term. The stage has been cleared, and the messy chessboard must be reset. The collapse of the old order signifies a rebirth, but is the Republic of China ready? He doesn't know when the curtain will rise on the next performance. What can he do for the Republic of China? What can he leave for Taiwan?\n\nThe vehicle stops in front of a grey building in Zuoying. He hands the driver a few more Sun Yat-sen bills and walks into the reception hall without looking back. The security guard sitting at the desk is sound asleep in front of an old television, which is playing a news report of Boss Han's parade just moments ago. The clamor outside hasn't affected this guard's life in the slightest. Han Kuo-yu falls silent.\n\nYes, change isn't complete just by casting a vote. The enthusiasm from the rallies was slapped hard in the face by reality. Fundamentally improving Taiwan's predicament will take a very, very long time... A swirl of thoughts floods his mind. Boss Han yawns deeply; he has to figure out a way to do something for the Republic of China. But the future is long, and he can take his time to think... "

 CHI.H2.11.a: "\"Han Bing, I'm home! Any late-night snacks tonight?\""


 CHI.H2.41.t: "Sword of Themis"

 CHI.H2.41.d: "Li Huiming sat on the plastic bench in the holding room. The seat was peeling from years of neglect, making it rather uncomfortable, but it was still a vast improvement over the hard concrete floor of his cell. He shifted his weight, faked a few sickly coughs, and muttered nonsense under his breath. The guard outside the door just watched him, too afraid to intervene. This was the advantage of holding a psychiatric evaluation report: nobody dared to cross you. If the slightest accident happened, the eager media outside would immediately tear into these high-and-mighty civil servants.\n\nWhen the time came for the trial, a bailiff led him to the defendant's stand. The judge and prosecutor were already in their places, alongside the public defender. He had seen this exact scene many times. Today would just involve some empty arguments before the gavel fell, leaving him plenty of time to reminisce about his \"great achievements.\"\n\n\"Defendant Li Huiming, age forty-three. You were charged with threatening the lives of others with a deadly weapon in a public space. The nature of your crime is vile, and you have shown no remorse. We find you guilty of murder and obstructing official duties. You are hereby sentenced to death and deprived of your civil rights for life.\" The moment the sentence was pronounced, the escorting bailiff grabbed Li Huiming by the collar and hauled him to his feet.\n\n\"I'm innocent! J-judge, I really didn't mean to...\" he wailed in panic. The sudden death sentence caught him completely off guard. He cast a desperate look at his public defender, but the lawyer simply pulled out a massive stack of psychiatric reports belonging to other defendants, along with Li Huiming's own, and hurled them right in his face..."

 CHI.H2.41.a: "That night, all the fuses in the Tucheng Detention Center blew out."


 CHI.H2.61.t: "Gathering of Old Friends"

 CHI.H2.61.d: "The fading sunlight silhouettes the Kaohsiung City skyline. Rivers of red and white flow in opposite directions; the people living on this land all have their own goals and paths to follow. Intermittent traffic lights guide the movement of these cars in an orderly fashion, signaling when to advance and when to stop.\n\nHan Kuo-yu raised his teacup and took a sip. This was his favorite Sanxia Longjing. Steam rose from the hot tea and dissipated into the air, framing the two prominent figures arguing red in the face before him.\n\n\"Mr. Soong, I personally deeply respect your and the KMT's desire for party unity, but your demands seem a bit excessive...\" Chen Chi-mai gripped his cup tightly, spilling tea over his hand, gripping it so hard he seemed ready to crush it. \"Even the most moderate factions within the DPP could never agree to this. How am I supposed to explain this to the other party members-\"\n\n\"Mr. Chen Chi-mai,\" Han Kuo-yu's lips curled into a faint smile. \"The DPP is still a part of Taiwan, a part of \"us.\" It's just that the political infighting over the past few years was too severe. It aches my heart to see it; it really breaks my heart!\"\n\n\"President Han, we are all children of Taiwan thinking about Taiwan's future. We shouldn't be at each other's throats like this. If we both take a step back, it will be easier for me to answer to the voters and everyone else.\" Chen Chi-mai pursed his lips and slowly glanced toward President Han. He carefully put down his teacup and refilled it from the teapot, trying to hide his inner nervousness. Would the President agree to his request?\n\n\"Hmm...\" Han Kuo-yu nodded thoughtfully. \"Classmate Chen makes a fair point. How about this: Mr. Soong, why don't you coordinate things and help secure more of the central budget for our Kaohsiung City? And Classmate Chen, you can help us communicate with the pan-Green factions like the Statebuilding Party. Ask them to go a little easy on us during interpellations at the Kaohsiung City Council?\"\n\nMr. Soong nodded in reluctant agreement. Chen Chi-mai could tell he was quite dissatisfied with this arrangement, but Soong had no choice. If he refused, his political faction would likely face complete marginalization in the future. Urged on by Han Kuo-yu's enthusiastic prompting, the two sides shook hands and made peace. Secret Service agents escorted the men out of the teahouse. Just as Chen Chi-mai was about to drive away, an agent ran up with two gift bags in hand.\n\n\"These are birthday gifts from him for your daughter. He also asked me to pass on a message: 'Don't forget to take care of your family outside of work.'\" Chen Chi-mai accepted the gifts, placed the bags on the passenger seat, and turned the key."

 CHI.H2.61.a: "He started the engine and plunged alone into the dazzling white river."


 CHI.H2.81.t: "One of Us"

 CHI.H2.81.d: "Inside a convenience store in New Taipei City, Zhang Zhiyuan carried a basket full of instant food and spoke in Japanese to the cashier: \"Please check me out, and give me a pack of your cheapest cigarettes.\" He was a mainland Chinese citizen working in Japan. After the Taiwan Strait War, his company began expanding its business into Taiwan. As the only one in his branch who could speak Chinese, he was dispatched to the island. On TikTok and Weibo, he had seen bloggers and self-media claiming that after the war, the Taiwanese wanted nothing more than to skin mainlanders alive and pull their tendons out-that if he went there, he would be bullied and attacked, with many videos presented as proof. He was terrified of this prospect, but unable to defy his company's orders, he could only disguise himself as a Japanese person. He planned to survive on these instant meals in his hotel room. Leaving the convenience store, he saw some uncleared rubble on the streets, the list of the city's deceased broadcast on a large screen in front of the city hall, and vast numbers of memorial tablets for war casualties in a temple that bore obvious marks of recent repair. All of this made his legs tremble. He constantly fantasized about what kind of persecution he would suffer if he were discovered to be a mainlander. He clutched his briefcase, which contained his ID card and passport, terrified that someone would see them, and hurriedly shoved his Huawei phone into the deepest part of the bag, afraid it would be noticed.\n\nHe finally returned to the hotel lobby and was about to head back to his room, intending never to come out except for work. Just as he put his thoughts to rest and breathed a sigh of relief, a teenager ran out of the elevator and bumped right into him. Caught off guard, Zhang Zhiyuan failed to react and was knocked to the ground. The moment he got up, he saw something that sent a chill down his spine: his bag had burst open during the collision, scattering his ID card, passport, and Huawei phone all over the floor. He felt his life was over.\n\nJust then, a hand reached out to him. It was the teenager who had bumped into him. He subconsciously grabbed the boy's hand. After helping Zhang Zhiyuan up, the boy apologized profusely and turned to help pick up his belongings. Zhang Zhiyuan hurriedly tried to stop him, but the teenager had already picked up his passport. Just as he thought the boy's attitude was about to take a 180-degree turn upon seeing it, the teenager simply silently gathered the scattered items, returned the briefcase and the instant food to him, and said, \"I'm really sorry. I hope you have a great time in Taiwan. We're all one family.\" Then, the boy left.\n\nZhang Zhiyuan stood dumbfounded in the lobby until a hotel staff member came over to ask if he needed assistance. He snapped out of his daze as if waking from a dream. Returning to his room, he stared at the ceiling, muttering to himself:"

 CHI.H2.81.a: "\"Everyone here is one of us...\""


 CHI.H2.82.t: "Our Own People"

 CHI.H2.82.d: "Li Musheng wandered aimlessly through the streets of Taipei. He held a slip of paper written in three languages: Malay, English, and Chinese. He had no idea what place was written on it. He had come here alone to find his last living relative, a cousin-uncle in Taiwan. He couldn't speak Chinese, and his English was very poor. He didn't dare strike up a conversation with anyone and could only silently rely on Google Maps navigation. But after wandering around the area for nearly ten minutes, he still couldn't find the place, and the navigation was useless. Out of desperation, he gathered his courage to look for someone who seemed like they could help him. He spotted a grandmotherly woman who appeared kind and had time to spare. He approached her and used the only Chinese phrase he knew, speaking in a stiff tone: \"Ni hao.\" After the grandma replied, he kept pointing at the paper and said in English, \"I go here.\" Seeing his nervous demeanor, the elderly woman smiled. Realizing he was an overseas compatriot, she took the paper, glanced at it, and beckoned him repeatedly: \"Come with me.\" Li Musheng hurriedly followed. Along the way, the elderly woman kept talking in a language he couldn't understand, but Li Musheng felt a warm and friendly atmosphere-a feeling he had never experienced from people in Malaysia. The old woman led him into an alley and knocked on the window of Room 104. A young girl poked her head out. The elderly woman smiled and said to the girl, \"Ah-Liang, this looks like a compatriot from overseas. The slip of paper he's holding says Mr. Li in Room 502 here. I don't think he speaks Mandarin, so could you, a college student, take him upstairs?\" The girl came out of the room and communicated with Li Musheng in English for a while. Seeing that things were on track, the grandma prepared to leave, and Li Musheng hurriedly thanked her. The girl took him to Room 502 and knocked on the door a few times. The door opened, revealing a middle-aged man who looked quite a bit like Li Musheng. The girl exchanged a few words with the man. The middle-aged man then turned to Li Musheng and said in Malay, \"Come on in first.\""

 CHI.H2.82.a: "Unite overseas Chinese"


 CHI.H2.101.t: "In the Name of the Government"

 CHI.H2.101.d: "The fading glow of the setting sun guided exhausted office workers on their way home. The rising and falling cries of street vendors drifted across the road and into an inconspicuous alley, where a silver-grey van pulled up quietly by the curb. Sitting in the back seat, Section Chief Hou raised his index finger to his lips, wanting to take a drag of his cigarette. But remembering the mission he was about to execute, his left hand silently slipped the cigarette pack back into his pocket. \"Commence operation!\" The order over the radio was brief and powerful. Section Chief Hou gave a look, and the men disembarked methodically, marching toward the suspect's front door. One of them held a search warrant ready, while another pulled out a master key to pick the lock. It wasn't exactly standard procedure, but... desperate times called for desperate measures. \"Nobody move! Special Investigation Division!\" Chief Hou led his men as they filed inside. \"Legislator Chen, we are under orders to search your residence. Please cooperate with our duties to avoid unnecessary trouble.\" Legislator Chen Yinwei stood there holding her rice bowl, staring in utter shock at the men in black. Before she could speak, the men quickly dispersed to search her home. \"Hou Anqu, what is the meaning of this?! What right do you have to arbitrarily search a legislator's house?! Let me tell you, I am old friends with your Director-General!\" The legislator roared at the Special Investigation Division, glaring at the search warrant on the table. But Chief Hou simply pulled up a chair and, through the steam rising from the hot soup, slowly sat down opposite Legislator Chen. \"Little Xiao! Did you find anything?\" \"Yes, Chief!\" Little Xiao jogged over and handed a phone to Hou Anqu. Looking at the screen, Hou almost broke into a smile, while the legislator across the table turned pale. \"Th-that fridge isn't mine...! I have no idea who put that money in the fridge, I completely-' Before she could finish her sentence, two Special Investigation agents hauled Legislator Chen out of the room and shoved her into the back seat of the van. A photocopy of an ESTA form slipped from her pocket and fluttered slowly to the ground amidst the bustling street, soon to be stamped into the scorching asphalt by passing scooters."

 CHI.H2.101.a: "Director Hou took out his lighter and lit a cigarette."


 CHI.H2.121.t: "A Second Bowl of Braised Port Rice"

 CHI.H2.121.d: "During an internal Kuomintang meeting, then-party chairman Han Kuo-yu took the stage and delivered a speech to the party members, saying: \"I don't demand a full Manchu-Han Imperial Feast, but there must at least be a bowl of braised pork rice.\" This was my helpless outcry during my campaign for Kaohsiung Mayor. At the time, Tainan was seen by the party as a low-return area. They believed the DPP was invincible there, that these pan-Green fortresses were impregnable, and they were unwilling to invest campaign resources. But my victory in 2018 shattered that perception. As long as we have good policies, are willing to communicate with the public, and are willing to put aside our pride to solve the people's difficulties, the voters will surely see our efforts. Today, I am proposing that in the future, campaign resources should no longer be allocated based on regional divisions. I hope that going forward, wherever there are results, there will be resources. We must no longer focus all our resources on the north; we must develop southward and support the campaigns of party members in the south. Do not be afraid of other parties\" seemingly impregnable fortresses, and do not cower out of fear of failure. I have proven myself that these fortresses are not indestructible. There are many party members in the south with ideas, passion, drive, and hope, yet they are trapped without resources. Not only do they lose to other parties, but because they cannot produce results, their potential remains locked away, leaving bright pearls to gather dust. This is not a good thing for either the party or the nation. Therefore, in the future, we must absolutely not distribute campaign resources by region, but by performance. Let the capable rise and the mediocre step down. Do not cling to safe, conservative mindsets. At the very least, every candidate must have a bowl of braised pork rice and a bottle of mineral water.'\n\nEnthusiastic applause erupted from the audience, with the voices of the younger party members ringing the loudest."

 CHI.H2.121.a: "Food for everyone!"


 CHI.H2.141.t: "The Elephant in the Room"

 CHI.H2.141.d: "Taipei City. The blade of history has left deep scars across this old capital. Construction floodlights illuminate the skyline, while bustling downtown districts offer crowds a place to unwind after work. Ketagalan Boulevard sits quiet tonight, though street vendors in the corners still pulse with life. Watching the scene unfold, Han Kuo-yu feels the weight of the nation on his shoulders. True prosperity for the Taiwanese people will not happen overnight. He steps into his motorcade; there is work to do.\n\nDeep inside an underground conference room missing from any blueprint, the President and his aides gather around a heavy iron table. The projector's glare washes over their grim faces. They thought they understood the rot festering beneath the surface, only to find the reality far more complex.\n\n\"So what are we supposed to do?\" an aide asks. \"Everyone knows about the government corruption and the rock-bottom birth rates. The partisan infighting just makes the situation impossible. What is the point of identifying the problems if we can't act?\"\n\n\"Professor Gao is right,\" Han nods. \"These issues are dragged out every election to attack the incumbents. And then what? The winner plays dumb, uses friendly media to blur the public's memory, and waits for the opposition to recycle the exact same attacks four years later.\"\n\nVoters rarely care which politicians can actually fix things. Even when they do, the opposition simply weaponizes their voices against the administration. Social issues have become a gladiatorial arena. Citizens sit in the stands, waving flags and cheering for their side until the opponent falls.\n\nThe entire system has idled for years. Men fight bitterly over power and profit at the negotiating table, completely ignoring the elephant in the room. Politicians are unwilling and unable to shatter this illusion. But if the President truly wants to overhaul Taiwan, he will have to be the boy who points out the emperor has no clothes.\n\n\"Ministers,\" Han says coldly. \"The only things I want to see on my desk are solutions, or your resignations. I will not accept excuses or delays. Dismissed.\"\n\nHan waits for the last aide to leave before packing his briefcase and exiting the building. Even with the sickness settled deep in its bones, Taipei still shines bright tonight."

 CHI.H2.141.a: "Drastic problems, drastic measures."


 CHI.H2.151.t: "Black Gold Storm"

 CHI.H2.151.d: "Zhou Guifa adjusted his tie in the front rearview mirror. This was one of the few times in his life he needed to wear a suit out to discuss business. He had only frantically rummaged through his house after receiving the tea party invitation, ultimately having no choice but to make do with the suit he had bought for his wedding. The construction industry had been tough in recent years. Taiwan was densely populated with limited land, and urban development and infrastructure were basically complete. If you couldn't snatch up bids for rezoned areas and public construction, you could only see if there were any scraps left. And if you couldn't get those either... bankruptcy was the only path left.\n\nTo secure government contracts, the remaining construction firms were going all out-sending flowers, gifting exotic birds, making political donations, and more. Against a backdrop of shrinking demand and lack of competition, the only way to survive was to obediently pay the toll. Chairman Zhou got out of his car and walked up to the teahouse. Everyone was already waiting for him in the private room. The attendees were some of the top, most formidable contractors in Taiwan. Following the war, much needed to be rebuilt, and everyone was fighting for the massive contracts to renovate Taoyuan Airport and Zuoying Naval Base. The highways and power infrastructure were also lucrative prizes. \"Brother Lin,\" sitting in the corner, was in the solar panel business. After greasing the right palms, he took advantage of the \"Nuclear-Free Homeland\" initiative to secure multiple \"solar farming\" projects and green energy subsidies. Abandoned farmlands were all converted into solar power plants. The government got pretty numbers on their ledgers, CEO Lin made a fortune off the green transition, and the officials filled their pockets. Everyone had a bright future.\n\nAt the tea party, everyone was discussing how to divvy up the next major construction project. Zhou Guifa didn't say a word. He was the smallest contractor in the room and the one who bribed the least. He originally thought that as long as his engineering work was good enough, he could break this vicious cycle. But he couldn't go against his conscience from when he first started in the industry: every penny had to be spent on construction. Just as the group was chatting merrily, a group of men in black burst into the room and surrounded them from behind.\n\n\"I am Section Chief Hou. Please remain calm and cooperate with our investigation. If you have any questions or grievances, you have the right to call your lawyers-though I advise against putting up a futile struggle.\" Hou Anqu shot a look at his subordinates, who pulled out handcuffs to secure the suspects in the room.\n\n\"Sure, no problem.\" Brother Lin cooperated fully, raising his hands and standing up calmly, paying no mind to the Special Investigation Division agent behind him. The other agents successively handcuffed and led away each suspect. Some were as composed as Brother Lin, but most frantically tried to explain their innocence. Zhou Guifa thought he would be taken away too, but after reeling in the net, Chief Hou left the room without looking back, leaving Chairman Zhou completely bewildered.\n\nA few days later, on the bidding day, the big shots and company representatives he had seen at the tea party were nowhere to be found. His phone was playing news reports about a massive crackdown on organized crime and government-business collusion. Chairman Zhou turned off his phone, trying not to recall the terrifying experience of that day..."

 CHI.H2.151.a: "If you walk by the river often enough, your shoes are bound to get wet."


 CHI.H2.181.t: "Meeting in the Middle"

 CHI.H2.181.d: "Taipei had yet to fully recover from the war, but glimpses of its past glory still lingered at major intersections. The rushing crowds and heavy traffic pointed to one thing: another great battle loomed ahead.\n\nDressed in a dark suit, Tsai Ing-wen led Lai Ching-te through the heavy atmosphere, following a guide deep into the Regent Taipei. She had no idea what Han Kuo-yu was planning. Still, for a man at the height of his power to invite her to discuss state affairs after such a war gave her and the DPP immense face.\n\nThe walk was short, and overthinking was no substitute for seeing things firsthand. Tsai took the seat opposite Han, with Lai settling in beside her. Han was in high spirits. Beside him sat Chiang Wan-an, a descendant of Chiang Kai-shek and a rising star in Taiwanese politics.\n\nA trap... or something else?\n\nAfter an exchange of greetings, silence fell over the table. Tsai's brow twitched. She was about to speak when Han beat her to it:\n\n\"President Tsai, there is no need to worry. I did not invite you here to attack political opponents or divide the spoils. The situation remains dire in the wake of this crisis, and I sincerely ask for your counsel on state affairs.\"\n\nChiang Wan-an nodded in agreement. Lai Ching-te looked doubtful but stayed quiet, simply turning to glance at Tsai. Her expression softened slightly. After a brief pause, she replied:\n\n\"You are too modest, President Han. Without you, how could Taiwan have won? I just do not know your grand strategy for the post-war era. I only hope you keep the greater good in mind. The people look to you and the nation depends on you. Do not repeat the mistakes of the past...\"\n\nHan understood the implication: she feared he would become the next Chiang Kai-shek. He tapped the table, his expression calm, and spoke slowly:\n\n\"Rest assured, President Tsai. I draw lessons from history. If Taiwan is to enjoy clean politics and social harmony, we cannot shut out the eyes and ears of the people. That principle is the very foundation of my governance.\"\n\nHan spoke with sincere humility. He went on to outline his political vision, allowing Tsai to finally breathe a sigh of relief. A tired smile broke through her solemn expression.\n\nTsai glanced over at Lai and Chiang. She never expected these two prominent figures, both seen as the rising heirs of their respective parties, to hit it off so well. Han raised his glass for a toast. Finally dropping her guard, Tsai raised her own glass to join them."

 CHI.H2.181.a: "I look forward to our collaboration!"


 CHI.H2.221.t: "Bridgehead for the Counterattack"

 CHI.H2.221.d: "\"Following the end of the Taiwan Strait War, our nation successfully dispatched troops to reclaim the Paracel and Spratly Islands as the People's Republic of China withdrew from these areas. Some relevant experts have expressed concerns about this, stating that it might anger China and invite brutal retaliation. We will now interview President Han for his thoughts on this matter.'\n\n\"I don't think it's a big deal. We've already won once. If we can successfully develop the resources there, we can use them to make the nation rich. And if we get rich, we can develop better equipment. Why should we be afraid of China's retaliation?\" Han Kuo-yu raised his right arm, pumping his fist to encourage the public.\n\n\"Everyone needs to be a bit more confident. As long as you continue to trust me, I won't let you suffer any losses!'\n\nApplause erupted throughout the venue. Not everyone accepted his words, but Han Kuo-yu's rhetoric certainly carried a certain magnetic charm.\n\n*Beep-*\n\nThe remote button was pressed, instantly cutting off the news broadcast on the television.\n\n\"That was a brilliant response, Mr. President.'\n\nThe young aide stared at the black screen, slowly turning his head to look at Han Kuo-yu.\n\n\"Right? I think it will definitely inspire the people.'\n\nThe aide looked away, hesitating for a moment before asking.\n\n\"Mr. President, are you sure you want to do this? We've already faced public condemnation from the Beijing government for seizing the offshore islands. If we go further and reinstate Hainan Province, it will absolutely be seen as a severe provocation, and then...'\n\nBefore he could finish, Han Kuo-yu interrupted the young man.\n\n\"Why shouldn't we? I want the other side to understand that the Republic of China will not stay on this island forever. If you found yourself capable of growing strong enough to deter a bully, would you just keep hiding in the corner? I don't want my people to be bullied forever.'\n\nHan Kuo-yu stood up and walked toward the office door, reaching out to turn the doorknob.\n\n\"Besides, I also want to send a message to the mainland residents: \"The Taiwanese have not forgotten their compatriots.\" That is all.'\n\nHan Kuo-yu stepped out the door, hurrying to the next place that needed him.\n\nOnce certain Han Kuo-yu was far away, the aide let out a long sigh."

 CHI.H2.221.a: "Time to decide which letter we should use on the new National IDs..."


 CHI.H2.222.t: "First Step of the Reclamation"

 CHI.H2.222.d: "On Yongxing Island, two workers operate a heavy angle grinder to erase the characters from a stone monument that once read \"Sansha City People's Government.\" Nearby, a crane lowers the administrative plaque, preparing to hoist a new sign reading \"Hainan Provincial Government.\" Following the island's reclamation by ROC armed forces, a presidential decree authorized the reinstatement of Hainan Province, whose operations had been suspended since 2003. The former Sansha administrative complex is being converted to house this provincial authority, while the old Xisha District headquarters 1.5 kilometers away will be repurposed as the new Sansha City Government.\n\nMeanwhile, officials arriving from Taiwan are conducting a census across the Paracel, Macclesfield, and Spratly Islands, asking residents whether they wish to apply for Republic of China citizenship or return to the mainland. For the first time in over two decades, the Hainan Province emblem flies over the South China Sea, with Pratas Island and Taiping Island officially returned to provincial jurisdiction.\n\nLi Shun's grandfather was a veteran of the Hainan campaign. Growing up, Li heard countless stories about the Great Retreat and the island's coconut and sugarcane farms, along with the relatives left behind who eventually faded into silence. Upon hearing of the province's reinstatement, Li bought a ferry ticket and brought along some coconut candy, which his grandfather always said held the taste of home. Standing on the shores of Woody Island, he looked toward Hainan. Though the landmass remained out of sight beyond the horizon, he could feel the pull of the homeland that had haunted his grandfather's dreams. Tossing the candy into the waves, he shouted:"

 CHI.H2.222.a: "\"Grandpa, we're going home soon!\""


 CHI.H2.251.t: "The Cycle of History"

 CHI.H2.251.d: "Hu Yuan-hui leaned his clasped hands against the solid wood desk. His eyes darted between the desktop and his uninvited guest. He swallowed, trying to ease his parched throat. The visitor sat across from him wearing that signature smile. Hu had seen this face on television countless times, and it was identical to the approachable figure who once canvassed for votes in traditional markets. Not a single flaw.\n\n\"I believe my board of directors and I have made ourselves very clear, Mr. President. Media freedom must not be interfered with! Thirty years ago, our predecessors fought hard to free Taiwan's media from political and military control, a reality the Taiwanese people gladly embraced. You are openly making an enemy of the public!\" Hu yelled at his distinguished guest, trying to use the volume to mask his own anxiety. He knew perfectly well that he and PTS were rapidly running out of room to maneuver...\n\n\"Mr. Hu,\" Han Kuo-yu said in his trademark approachable tone. \"Aren't you the one making an enemy of the public? On the surface, you claim to be neutral. In reality, you take orders from the ruling party in hopes of securing a larger budget. That means PTS answers only to the government and never truly looks out for the people!\"\n\n\"That is still better than you personally interfering with PTS operations...\" Hu was on the verge of a total breakdown. Months of internal audits and news content investigations had left him utterly exhausted. Various reorganization plans piled up like a mountain on his desk, and his forceful pushback had only invited even harsher restrictions. He stood up, gritting his teeth, feeling as though he were balanced on the edge of a cliff. He reached out his hand. Was this really his only way out?\n\n\"A pleasure working with you. You finally have time to spend with your family, unlike me, constantly chased by government affairs.\" President Han smiled as he shook Hu's hand. \"My assistant will bring in the agreement shortly. Please sign it as soon as possible. Thank you for your trouble!\"\n\nHan Kuo-yu walked out of the office with a smile. Hu Yuan-hui slumped back into his leather chair, looking as though his soul had been drained. He stared at the various certificates lining the wall and suddenly felt countless eyes scrutinizing his every move."

 CHI.H2.251.a: "\"Mr. Hu, please sign.\""


 CHI.H2.261.t: "Interview"

 CHI.H2.261.d: "\"So, what are your thoughts on your time as president so far? Or perhaps you have certain expectations for the future?\" Zhu Kexin leaned forward slightly. She held a notebook stamped with the PTS logo in one hand and a ballpoint pen in the other, ready to record the president's reply. She glanced at the page crammed with various questions and margin notes. This list was the product of her department colleagues racking their brains all night. When first submitted, the draft contained a full forty questions. After passing through layers of approval, the Presidential Office agreed to answer exactly seven.\n\n\"Oh, right... I actually find being president quite enjoyable. Compared to my time as Kaohsiung mayor, serving the entire country definitely brings a greater sense of achievement than just serving one city! As for my vision for the future, we have already endured far too much hardship. My wish is simple: I just want everyone to be able to buy affordable vegetables at the local market!\" Han Kuo-yu's hearty laughter rubbed off on the people in the room. Zhu Kexin couldn't keep a straight face and accidentally let out a laugh. Yes, this man really was just that approachable and charming. Anyone who watched television regularly would undoubtedly agree.\n\n\"You really are a man of the people, Mr. President...\" Reporter Zhu regained her composure. She looked across the table at her interview subject. Her eyes inadvertently caught the camera behind him. The blinking red dot served as a constant reminder to the two people in front of the lens: this was a performance, not an interview. Zhu Kexin swallowed hard. Her professional conscience felt incredibly feeble under the camera's glare. She quickly put on a show of taking furious notes, nodding thoughtfully as she scribbled.\n\nReporter Zhu quietly closed her notebook. The floor director caught her eye, and the red light blinked off. It was time for a break. A few staff members, eager to witness \"President Han\" and his famous presence in person, practically sprinted onto the studio floor. Reporter Zhu was the only one who walked silently over to the emergency stairwell, dropping her notebook down the shaft."

 CHI.H2.261.a: "And she left the PTS building without looking back."


 CHI.H2.301.t: "No. More. Chaos!"

 CHI.H2.301.d: "It was another day of debate in the legislature. During a tense and heated future budget meeting across party lines, a veteran DPP legislator found himself losing ground. Seeing that the KMT's proposed budget was on the verge of passing, he acted almost on instinct: he took off his leather shoe and hurled it at the speaker's podium.\n\nThe shoe struck the podium with a loud smack. In an instant, the entire legislative chamber fell dead silent. Everyone stared at the veteran legislator. Catching on to what he had just done, he turned pale. His legs shook as he babbled his excuses: \"No, no, no, the shoe flew off on its own. I didn't mean to.\"\n\nThe speaker stared at him for a few seconds before speaking. \"Parliamentary police, restrain this legislator.\" Two officers immediately stepped forward, grabbed the old legislator by the arms, and forced him down into his seat.\n\nThe speaker then continued: \"Under the newly enacted Law on the Exercise of Legislative Yuan Powers, any legislator who disrupts order and shouts in the chamber through fighting, flag-raising, presenting gifts, or performance art shall be immediately expelled and suspended for one day. We will also bypass the agenda to hold an immediate floor vote on whether to suspend his legislative duties for two months.\"\n\nAmid the clatter of voting buttons, the result appeared.\n\n\"Passed unanimously. Parliamentary police, please escort Legislator Li out of the legislature.\"\n\nSmack. The gavel fell heavily. The veteran legislator kept his head bowed as the two officers flanked him and marched him out of the building.\n\nAfter he had left, the speaker addressed the room: \"I am sure you all remember what the legislature used to be like. It resembled a performance art gallery and a WWE arena more than a government assembly. But the new Law on the \"Exercise of Legislative Yuan Powers\" has now passed. I expect all of you to act with the self-awareness of a politician and a decent human being. The budget meeting will now resume. Please proceed with reason and self-restraint.\""

 CHI.H2.301.a: "I guess the public won't have the WWE Taipei branch to watch anymore."


 CHI.H2.391.t: "New Book, New Era"

 CHI.H2.391.d: "The uncomfortably hot and humid air filled every corner of the classroom. The students sat obediently at their desks; some looking up and listening to the lecture, others with their heads down scribbling furiously, terrified of missing the next midterm exam point. Most students endured this suffocating atmosphere, while a few, like Cai Fenqi, chose to hide in the back row and chat secretly, occasionally looking up to pretend they were paying attention.\n\n\"Hey, Fenqi. Do you have the senior's history exam prep notes? Let me copy them.\" A classmate nudged Cai Fenqi's side with her elbow. The latter impatiently pulled a crumpled notebook from her backpack, flipped back and forth through the yellowed pages until she found the key points for this midterm, and secretly passed it over.\n\nAlthough the curriculum guidelines were revised every ten years and the content of the textbooks changed significantly from time to time, their school only used self-compiled teaching materials. This applied to everything from Chinese, English, and Math to Physics, Chemistry, Civics, and Geography-and History was naturally no exception. Even though the Ministry of Education constantly advised schools to use the standard public textbooks, top high schools like theirs had never paid any mind to such recommendations, continuing to teach solely from their own materials. So even if Cai Fenqi and her friends didn't pay attention in class, they could easily pass by relying on the senior students\" notes.\n\n\"Attention, everyone,\" the teacher suddenly stopped writing with her chalk and said. \"Given the requirements and directives of the newly released Ministry of Education curriculum guidelines, the proportion of long and short reading comprehension, historical source analysis, and short-answer questions on the midterm will significantly increase. At the same time, the history of the Republic of China and modern history after 1949 are also major testing points, so everyone must pay close attention when reviewing.'\n\nCai Fenqi's jaw nearly dropped to the floor. She had completely not expected the teacher to throw such a curveball. It wasn't until after class that she dug out the history textbook she had thrown under her bed at the start of the semester. Flipping through the book, she stayed up all night making various notes in her self-compiled materials."

 CHI.H2.391.a: "\"Will all these generals\" names be on the test...?\""


 CHI.H2.431.t: "Better Safe than Sorry"

 CHI.H2.431.d: "Agent Su held a cigarette between his fingers and took a slow drag. The wisps of exhaled smoke stood out sharply under the incandescent bulb. His gaze pierced the haze to observe the room, where a younger agent was interrogating the prisoner. The captive screamed for his lawyer, earning only a barrage of heavy blows in return.\n\nThe National Security Bureau task force under Su's direct command worked tightly with law enforcement. Fresh intelligence landed straight in their hands, and every suspect was hauled in to face personal interrogation by NSB operatives. As for the prime suspects identified as Communist sympathizers, the bureau had specialized services waiting for the bastards.\n\n\"Speak! Where are your accomplices? Give up their names, and I can make things a little easier for you.\" The young agent punctuated his demand with another punch to the prisoner's gut. Brown vomit stained the captive's orange uniform.\n\nAgent Su picked up a piece of toast from the table and took a bite. For the past few days, they had \"kindly\" fed the prisoner white bread and water, paired with three continuous days of severe torture. If this still yielded no results, they would have to consider a backup plan.\n\n\"I-I'll talk...!\" the prisoner gasped. \"Please stop hitting me. I'll say anything, I beg you...\"\n\n\"Let him go.\" Agent Su dropped his cigarette and crushed it out with his heel. He pulled a pen and paper from his pocket and set them on the table.\n\n\"I want a list of your financiers and your accomplices. Write down the locations of every safehouse, and put your written confession on the back. If you try to play smart with us...\"\n\nSu shot a glance at his subordinate. The younger agent reached into a folder on the table and pulled out three black-and-white photographs."

 CHI.H2.431.a: "Look at your wife and daughter; this is the price of treason."


 CHI.H2.411.t: "Life of a Student"

 CHI.H2.411.d: "Lei Dan is a student at an international high school in New Taipei City. On what seemed like an ordinary Monday morning, he arrived at the school gate with his breakfast fresh from the MRT station, only to find a crowd of students gathered around taking pictures. Pushing his way in, he saw that a line of English text had been added below the school's name. Upon entering the campus, he discovered that all the signs and street markers had become bilingual in Chinese and English; even the text on the water dispensers had been engraved bilingually. Lei Dan had just set his backpack down at his desk when the classmate next to him, Zhang Shuren, struck up a conversation: \"Everything in the school has gone bilingual. Didn't President Han just give a public speech about promoting bilingual education last month? The school sure reacted fast.\" Lei Dan replied, \"Yeah, I wonder if there are any other changes.\" He glanced sideways; a classmate known as \"Vlog Bro', who regularly posted videos on Bilibili and YouTube, was running around filming the new bilingual facilities. Just then, the homeroom teacher arrived early and walked into the classroom: \"I need two strong guys to go fetch the new textbooks.\" Lei Dan and Zhang Shuren exchanged a look, both jumping up first to follow the teacher out. Ten minutes later, the two returned to the classroom, each pushing a handcart. After placing the textbooks on the podium, Lei Dan shouted, \"Do you guys want to know what's special about the new textbooks?\" Everyone in the classroom looked at him. He then declared, \"We checked them on the way back. The books for every single subject are now bilingual in Chinese and English.\" A buzz of discussion erupted across the room.\n\nAt that moment, the teacher pushed the door open and entered. The two boys hurriedly stepped down from the podium and went out to return the handcarts. The teacher announced, \"Everyone, come up by your student numbers to receive your new textbooks.\" Opening their new books, the students saw that whether it was Chinese, Math, Biology, Physics, Chemistry, or Art, everything-save for classical Chinese texts that were practically impossible to translate-was now bilingual. The English textbooks, meanwhile, had become entirely English. The teacher clapped his hands. \"Alright, everyone put your books down for a moment. I'd like to introduce a new teacher. Mr. Alec, please come in.\" A Caucasian man walked through the doorway. Speaking in Chinese with a noticeable Australian accent, he said, \"Hello everyone, I am Alec Su from Australia, and I will be your English teacher from now on.\" The students broke into applause, welcoming their new foreign teacher.\n\nThe homeroom teacher clapped his hands again and addressed the class: \"Alright, alright, your new foreign teacher will officially start teaching you during the English period this afternoon. Now, onto something else. Summer vacation is coming up soon. Under the new policy, the Ministry of Education has organized an English summer camp. Anyone who wants to participate should discuss it with their parents today and come to my office to sign up after school tomorrow. Also, you are all high school sophomores now; you'll be seniors next year. The new policy offers subsidies and support for studying abroad in English-speaking countries. I'm going to hand out some flyers about the study abroad subsidies-take them home and show them to your parents.'\n\nAt noon, the nutritious school lunches arrived in the classroom. The students clustered together in small groups, eating while discussing the morning's new changes. Holding his phone, Zhang Shuren said, \"Looking at the Board of Education's plans, English classes are supposed to transition to entirely English instruction over the next few years. Thank goodness we started school early.\" Lei Dan replied, \"Yeah, I bet the few people in our class with bad English are probably stressing out right now.\" He took the opportunity to glance across the room; Vlog Bro was using his Canon camera to film the new textbooks, probably getting ready to post another video on Bilibili to rack up 100k views."

 CHI.H2.411.a: "\"Integrating East and West.\""


 CHI.H2.161.t: "No More Legal Bribery"

 CHI.H2.161.d: "The Niao-An Wastewater Treatment Plant is a local enterprise that has operated in Tainan City for many years. They had been reported multiple times for discharging wastewater that failed to meet national standards. However, the results of every environmental investigation declared the claims to be sheer nonsense, affirming that Niao-An's treated wastewater fully complied with national discharge standards.\n\nInside a private club in Tainan, the plant manager and the largest shareholder of the Niao-An Wastewater Treatment Plant were wearing obsequious smiles as they toasted the local Deputy Mayor. The plant manager said, \"We are truly grateful for the efforts of you and the Director of the Environmental Protection Bureau during the last report. The investigations by the EPB and the Chemicals Administration were successfully passed. We are conscientious businessmen; we need upright officials like you to guarantee our safety.\" The Deputy Mayor raised his glass and replied, \"Of course, the local area needs outstanding enterprises like yours to provide citizens with a better life. I hope we can continue our pleasant cooperation after the election season next year.\" The major shareholder hurriedly chimed in, \"Naturally. A small token of our appreciation has already been handed to your secretary. It was all done through legal channels, and we hope it will aid your campaign. Let us continue to cooperate closely next year.\" The three men exchanged knowing smiles and continued their lively toasts.\n\n*Smack!* The door to the private room was suddenly kicked open. \"My, my, quite the lively gathering! Do you mind if I join in?\" The Deputy Mayor stood up and yelled angrily, \"Fuck your mother! Do you know where you are? Do you know who I am?! Barging in here like this-where is the club security? Throw this lunatic out immediately!\" The intruder chuckled and pulled out a badge. \"Special Investigation Division! I am Section Chief Hou Anqu of the Special Investigation Division!'\n\nChief Hou scanned the room, flashing a smile that sent a shiver down the spines of all three men. \"Oh my, I didn't expect you to throw your weight around like such a big official! I almost thought I was in the mainland for a second! My apologies for the disrespect. However, you are still in Tainan, so... please come take a seat at the Special Investigation Division with me. Regarding your acceptance of improper political donations and your assistance in helping illegal enterprises conceal their violations, we'd like to hear your defense. And these two must be from the Niao-An Treatment Plant, right? Perfect, saves me another trip. Boys, take all three of them away.'\n\nSix burly members of the Special Investigation Division immediately rushed out from behind Chief Hou, grabbing the three men and hauling them out of the private room. By this point, the three were so terrified they couldn't even stand on their own; they were entirely held up by the strength of the SID agents as they were dragged out of the club, their faces pale as ashes.\n\nChief Hou picked up a bottle of liquor from the table and inspected it briefly. \"Oho, quite the collection. Maotai from the mainland, premium red wine from France, high-grade sake from Japan, top-shelf whiskey from the UK. The alcohol on this table alone is worth half a year of my salary.'\n\nHe set the bottle down and walked out of the room, thinking to himself:"

 CHI.H2.161.a: "\"We've caught six this week. Wonder if we can get another one tomorrow to make it one a day.\""


 CHI.H2.231.t: "Claiming Legitimacy"

 CHI.H2.231.d: "As the situation evolves, the long-ridiculed dream of retaking the mainland and restoring the Republic is finally appearing on the horizon. With the provincial administrations of Taiwan, Fujian, and Hainan already resuming operations, the ROC government has moved to repeal the streamlining of the Taiwan Provincial Government outlined in the Fourth Constitutional Amendment. Once the legislature approves the repeal, authorities will rebuild provincial administrations nationwide alongside the Tibet local government, though plans for Mongolia remain temporarily shelved.\n\nAt a joint press conference, the Ministries of the Interior and Foreign Affairs announced an end to the suspension of provincial governments. These reactivated administrations will overhaul the election and appointment mechanisms for all levels of local government. Officials will also restore citizen household registration systems and build operational frameworks for every mainland province, ensuring these bodies can scale up rapidly to meet future demands.\n\nDuring the same briefing, the Foreign Ministry revived the Chiang Kai-shek-era doctrine that the ROC is the sole legitimate regime of China. The spokesperson declared Dr. Sun Yat-sen's Republic of China as the only orthodox government, acknowledging the Peiping regime's administrative authority over the mainland without recognizing any of its legal sovereignty.\n\nBeijing's Taiwan Affairs Office and Foreign Ministry reacted with fury, repeatedly condemning the announcement as a violation of their legal rights. Having been previously repelled by our forces, the PLA emerged from its barracks to resume military probes against Taiwan. Chinese forces once again crossed the median line to violate our airspace and territorial waters, and even proposed sanctions at the UN General Assembly that ultimately went ignored.\n\nFollowing legislative approval, the government initiated the reconstruction of provincial administrations. A floor in the newly reactivated Taiwan Provincial Government building was allocated to house the core staff for these mainland provinces. Their immediate task is to care for elderly veterans from their respective regions and resettle mainland refugees fleeing to the Free Area. In parallel, staff will gather regional intelligence to draft early takeover contingencies.\n\nThe provincial governments marked their official reactivation with a low-key ceremony. President Han attended the event, telling the staff, \"This isn't really a formal ceremony; we're just keeping it casual among ourselves. Once you all return to your respective provinces, we will hold a grand celebration.\""

 CHI.H2.231.a: "We are the true Chinese."


 CHI.H2.371.t: "Ministry of Economic Affairs Geological Survey and Mining Management Agency - Official Letter"

 CHI.H2.371.d: "Address: No. 53, Sec. 1, Zhonghua Rd., Zhongzheng Dist., Taipei City 100005\nContact Person: Xu Ming-hong\nPhone: (02)23113001 Ext. 001\nFax: (02)23112663\nEmail: bom001@gsmma.gov.tw\n\nRecipient: President Han Kuo-yu\n\nDate of Issue: [Date], [Year] of the Republic of China\nDocument No.: Jing Di Diao Zi No. 114514\nSpeed Category: Most Urgent\nClassification and Declassification Conditions or Confidentiality Period: Top Secret (To be declassified on December 31, 2111)\nAttachments:\n\nSubject: Submission of the phase one results for the \"National Geological Resource Survey Project\" and an assessment of the potential for exploitable strategic minerals and oil/gas resources within the country, submitted for the President's review.\n\nDescription:\n\n1. In response to the restructuring of global supply chains, rising geopolitical risks, and national security needs, this Ministry-in accordance with the \"National Geological Resource Survey Project\" approved by the Executive Yuan-has utilized technologies such as high-resolution satellite remote sensing, airborne magnetic surveys, gravity measurements, 3D seismic exploration, AI geological modeling, and deep drilling to complete the phase one resource census of Taiwan proper and its surrounding waters.\n\n2. The results of this survey reveal that in the past, due to limitations in exploration technology and economic feasibility assessments, several ore bodies with development potential were not fully confirmed. Following re-modeling and analysis, we have now identified multiple mineral and energy reserve areas of strategic value.\n\n3. The Taoyuan region has confirmed..."

 CHI.H2.371.a: "\"Not bad, file it away.\""


 CHI.H2.331.t: "More Work, More Pay for the Able"

 CHI.H2.331.d: "The current salary system, which is mainly based on fixed pay grades, is often attacked as a 'legacy of the authoritarian era.' We admit that a system where seniority determines pay, along with the 18% preferential interest rate for military, public, and teaching personnel, is rigid and outdated, but it is still part of the agreement made when they were legally employed. Under the ideologies of 'it's not that the public sector gets too much, but the private sector gets too little' and 'generational fairness,' the previous Tsai administration implemented reforms to reduce the income replacement rate for retirees and gradually phase out the 18% preferential interest rate.\n\nHowever, President Han believes that the compensation for military, public, and teaching personnel is part of their legal employment contract. Arbitrarily changing it not only breaks existing promises and damages retirement rights but also destroys the trust between different classes built during democratization.\n\nYet, because the imbalance between private and public sector compensation is a real problem, and the previous DPP government has already done the unpopular work for the current administration, the current government only needs to make modifications based on those reforms. After careful study, President Han has decided to implement one of the personnel system reform proposals he made during his presidential campaign: 'Floating Compensation for Military, Public, and Teaching Personnel.' While maintaining the fixed base salary to guarantee their basic livelihood, a portion of their income will become floating. Bonuses will be determined by job performance, public satisfaction, task difficulty, and work results, rather than relying entirely on seniority as before. Those who perform well can earn more than before, instead of just watching older colleagues take home more money while sitting in an office.\n\nThe military sector will also consider the differences between combat and non-combat units, offering bonuses for serving on outer islands, high mountains, and ships, as well as for hazardous duty, professional certifications, training scores, retention rates, and professional capabilities. This ensures that true warriors receive tangible benefits, rather than generals sitting in high-rise buildings collecting high salaries.\n\nThese measures allow compensation to better reflect job risks and professional levels, rather than relying mainly on seniority. This will help attract and retain talent in the public sector and improve administrative efficiency."

 CHI.H2.331.a: "Labor brings reward."


 CHI.H2.321.t: "Bullseye"

 CHI.H2.321.d: "During his 2019 presidential campaign, Han Kuo-yu and his national policy advisory team proposed the \"Three Arrows of Labor.\" Feasibility concerns over funding and implementation, followed by the Communist invasion, prevented early action. Now, with the war won, decreased defense spending and rising economic growth have generated the fiscal surplus needed to finally make these promises a reality.\n\nThe First Arrow: Amending the Employment Insurance Act to cover unpaid leave. The system now compensates affected workers with 60 percent of their insured salary. For citizens like Wei Jie, a factory worker reduced to a two-days-on, five-days-off schedule after PLA missiles leveled his workplace, this is a lifeline. Receiving his first insurance payment, the 39-year-old sat on his roof with a convenience store beer late into the night.\n\nThe Second Arrow: Matching pension contributions for low-wage youth. Previously, 93 percent of workers opted out of voluntary contributions. President Han introduced a direct \"Matching Reward\" program with a simple slogan: \"You save, we match.\" A-Liang, a recent university graduate scraping by on 34,000 NTD a month, could barely save anything after basic living expenses. Prompted by the new policy, he bit the bullet and opted for a 2 percent contribution. Knowing his 680-dollar deduction instantly becomes 1,360 dollars in his account gave him an unexpected sense of security.\n\nThe Third Arrow: A 100-billion NTD injection into the Labor Insurance Fund. The fund had long operated at a deficit, leaving citizens terrified their pensions would dry up. Han originally promised to inject 100 billion over two years. The war forced a delay, but the postwar recovery has finally provided the capital to fulfill this pledge. The government will allocate 33.3 billion NTD annually over three years, securing the financial future of retirees and sparking widespread celebration across the country."

 CHI.H2.321.a: "Taiwan's people strike it rich."


 CHI.H3.11.t: "2028"

 CHI.H3.11.d: "Elections Once Again"

 CHI.H3.11.a: "Han Kuo-yu"


 CHI.H3.111.t: "Air Raid Shelter"

 CHI.H3.111.d: "The muggy air inside the cave had Wang Gangyin sweating profusely. Holding a clipboard, he leaned against the wall, scribbling and making corrections. The dim lights on the wall provided the only illumination in the entire cave-aside from the headlights of a truck. He adjusted his position, trying to prevent his shadow from covering the manifest while making sure the beads of sweat on his forehead didn't drip onto the paper. The engineers were still trying to get the ventilation system running, but equipment from the 1980s didn't have the best temper; they would fix it, only for it to break again. However, the transfer of supplies couldn't be delayed, so everyone just had to do their weightlifting in this sauna.\n\n\"This is all of it,\" one of the logistics officers said, walking toward him and pointing at the heavy truck slowly driving down the ramp. The smell of diesel mixed with the sweat of dozens of men made the air feel stagnant. Gangyin wiped his nose, trying to acclimate to the suffocating atmosphere.\n\n\"Excellent.\" Gangyin flipped to the last page of the manifest and checked off the final few blank boxes. Bullets, firearms, military rations... He had no idea why his superiors were cramming so much stuff into such a small air raid shelter. Setting aside the question of how many troops these supplies could sustain and for how long, he wasn't even sure if the dry rations inside hadn't been sitting there for decades.\n\nThere were dozens of air raid shelters just like this one! Some had been newly built at relocated sites after the war, while others were refurbished underground and mountain bunkers. The smaller ones were simply stuffed with basic light weapons and food supplies. Perhaps a few barrels of diesel would be left in the corner-not nearly enough to refuel a tank, but more than enough to power a generator.\n\n\"That should be everything, right? Your trucks look empty...\" Wang Gangyin asked curiously.\n\n\"I advise you not to ask too many questions. This is classified,\" the logistics officer replied coldly. Before Wang Gangyin could even salute, the officer turned on his heel, boarded a truck, and quickly drove away. He left behind a sweating Wang Gangyin and the other curious soldiers. Gangyin looked at the crates that had just been unloaded. Stamped on the side was a label indicating what was supposed to be inside: Ten T65 assault rifles."

 CHI.H3.111.a: "Best not to wonder what's actually packed inside..."


 CHI.H4.1.t: "Victory in Great Asian War"

