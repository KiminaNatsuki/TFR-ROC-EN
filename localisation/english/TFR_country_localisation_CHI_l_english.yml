##
 CHI_duty_of_the_helmsman_desc: "If you were to randomly interview a passerby on the streets a decade ago, everyone would pay lip service to how great Taiwan was. Yet, if you asked more pointed questions, they would tell you that it was best to study in Europe or America, and most cost-effective to move factories to the mainland. The people born on this island had not a shred of hope for their nation's future. For decades, no captain had ever steered the Formosa through all its hardships. Everyone watched helplessly as the hull leaked, but no one attempted to repair the broken ship. They merely watched the cabins flood; those who could jump ship did so, while those who couldn't waited on the deck for their demise.\n\nThis situation finally reached a turning point. President Han Kuo-yu took on the heavy burden during the Republic of China's most difficult times, successfully leading the people on board through storm after storm. Inspired by Han's man-of-the-people image, everyone followed his instructions step by step to repair the battered ship.\n\nNow, this ship speeds across the ocean with a brand new look. The immediate problems have been fully resolved, yet an even greater storm quietly approaches. No matter how much wind and rain the Taiwanese people will face, they believe that under the command of President Han Kuo-yu, they will weather the crisis once more!"

 CHI_march_into_the_waves_desc: "As the standoff between Asia's two major military blocs becomes increasingly clear following the Taiwan Strait War, another Cold War has already begun. Countless ships, aircraft, artillery, and tanks are rolling off production lines, and thousands of war games are being conducted. The flames of war are about to rise once more.\n\nBut we are completely different from how we were during that war. We are no longer a stepping stone waiting to be slaughtered; we are the dragon... We are the Dragon of East Asia!"

 CHI_focus_on_polwar_core_desc: "In the past, due to a severe shortage of grassroots political warfare officers (counselors), newly commissioned second lieutenants graduating from the Political Warfare College or ROTC were often directly assigned as company counselors, lacking both troop-leading and tactical experience.\n\nNow, with the urgent need to drastically strengthen combat command capabilities, all counselors who currently lack relevant command experience will undergo several months of branch training. Furthermore, newly graduated officers will be required to serve as platoon leaders for one year to gain practical experience."

 CHI_external_political_warfare_bureau_desc: "We have already gained international recognition; no one can hinder our diplomatic efforts anymore. The government must mobilize all of its diplomatic power to engage with the world. From socialists on the left to monarchists on the right, as long as it is a sovereign nation, it is a target worth engaging."

 CHI_welcome_home_children_desc: "President Han Kuo-yu's Taipei speech has been a resounding success. Taiwanese who left their homeland during the Taiwan Strait War, earlier emigrants to other nations, and overseas Chinese yearning for freedom and democracy are arriving one after another, drawn by its fame. Let us welcome them as they set foot in this country once again."

 CHI_mainland_peoples_liaison_desc: "The Chinese mainland is not a monolith. Many pro-democracy activists who reject totalitarian rule have been operating in secret. For a long time, these mainland democracy advocates had no stable channels to contact our nation. Now, we will establish a dedicated department to liaise with them and gather military and civilian intelligence from across the strait."

 CHI_central_political_warfare_committee_desc: "In the past, political warfare against the mainland was primarily conducted by the military. However, times have changed. Political warfare is no longer confined to such a narrow scope; it extends into every aspect of daily life. We must establish a top-level political warfare institution to integrate all government departments to counter and strike back against the PRC's cognitive and political warfare."

 CHI_expand_the_defense_line_desc: "The most important core principle of NATO, collective defense, means that an attack on any member state is considered an attack on all members. This same principle applies to the PDTO, which was modeled after NATO. We cannot simply hide on our island and focus on self-defense; we must expand our defense lines. Defending our allies' borders is just as important as defending our own."

 CHI_pacific_military_exercise_desc: "Even the united and cooperative PDTO Joint Fleet is not entirely confident in defeating the newly reorganized PLA Navy once again. After joint consultations, it has been unanimously decided to conduct at least one joint exercise in the South China Sea to ensure that we can effectively blockade the PLA Navy right at their doorstep."

 CHI_the_giant_returns_desc: "According to intelligence gathered by satellites and PDTO spies embedded within the CCP, there are traces of suspicious PLA personnel deployments and equipment transfers recently. A large number of armored vehicles and tanks have been transported to military bases near the Yalu River. The high command of the Joint Command assesses that the CCP might trigger a Second Korean War through North Korea, potentially igniting a Pan-Asian war. We must race against time to mass all our equipment and soldiers before the outbreak of the war."

 
 CHI_underground_assenmly_point_desc: "During the last war, the PLA's first volley of missile salvos caused slight casualties to our forces. Following the advice of the generals from the three founding nations of the PDTO, the Joint Forces have deployed troops in a decentralized manner within underground structures, while armored vehicles and fighter jets are concealed within air defense bunkers."

 CHI_underground_assenmly_point_tooltip: "Upon completing the focus §YThus Spoke Thucydides§!, Factory Bombing Vulnerability -75% for one month."

 
 CHI_thus_spoke_thucydides_desc: "The Thucydides Trap: when two major powers rise in a region, the fear of one another may lead to strategic miscalculations, triggering a devastating war.\n\nFollowing the United States' descent into civil war, the communist China led by the CCP was unequivocally recognized by the world as the regional hegemon. However, the PDTO's victory in the Taiwan Strait and its rapid rise shattered the world's perception. This East Asian hegemon is not an insurmountable wall.\n\nToday, as China emerges from the shadows of war and the PDTO deepens its cooperation into an integrated military bloc, the diplomatic gambits between both sides in Southeast Asia have intensified tensions across Asia. The button for declaring war has finally been pressed, and the flames of war are once again reignited in East Asia..."

 CHI_eastern_terrain_mapping_desc: "During the Korean War, Chiang Kai-shek's government proposed launching a landing in Fujian to divert the PLA's forces, but the idea was rejected by the United States. When this plan was brought up again, it piqued the interest of the PDTO high command. After a vote, it was agreed that the Republic of China will take the lead, commanding a contingent of forces to launch landing raids along the coast of Fujian.\n\nNow, we must map the current coastal terrain on the other side of the strait to find suitable landing zones."

 CHI_coverage_priority_tactics_desc: "The coastal defense artillery across the strait is incredibly troublesome. If we want to ensure that our combat forces land safely, we must destroy the enemy's coastal guns. Unfortunately, the bulk of the PDTO's air force is currently engaged in combat with the EADI on the Korean Peninsula, leaving us without sufficient air power to conduct bombing missions. For now, our only option is to utilize naval artillery bombardments and drone swarm tactics to clear out the enemy."

 CHI_project_national_glory_desc: "From 1961 to 1972, the Chiang Kai-shek government planned a massive military operation mobilizing the elites of the army, navy, and air force for a counterattack on the mainland. The goal was to draw away the PLA's combat power by coordinating a landing in Fujian with the isolated Thai-Burmese forces in the Golden Triangle. Ultimately, the plan was abandoned due to the US refusing support and intelligence leaks.\n\nNow, we have the backing of the entire PTO, a coalition force mainly comprising Indian troops distracting the enemy in the south, and a Japan-ROK joint force along with North Korea battling China in the north. We can finally implement this abandoned plan."

 CHI_northern_joint_command_desc: "The northern Korean Peninsula is characterized by complex and mountainous terrain. Securing air superiority is absolutely essential for a smooth advance. The National Armed Forces must urgently liaise with Japanese and Korean generals to coordinate the PDTO coalition's command structure. This will enable rapid joint deployments and minimize collateral damage from aerial combat."

 CHI_the_hunter_desc: "The largest-scale aerial battle in East Asia is about to erupt over the Korean Peninsula, with both sides rapidly massing their fighter jets. A defeat here could inflict an irreversible blow to our air power and the entire war effort. In addition to relying on the exceptional skills of our pilots, we must also conduct joint operations with the air defense forces of the Army and Navy."

 CHI_operation_peak_leaper_desc: "Flying over Mount Jingang and crossing the Changbai Mountains, we will strike directly into the skies over Beijing.\n\nA thousand aircraft launching together, blotting out the sun; we will dominate the skies of the Northeast.\n\nLet the aircraft of the EADI fall like a meteor shower, and let the obituaries of the fallen fly into the enemy's homes like snowflakes.\n\nWe are the pilots of the PDTO, and we shall return in triumph."

 
 CHI_asia_pacific_armament_desc: "The EADI boasts massive numbers of troops; even with the combined forces of all PDTO members, we can barely match them. We must deploy delaying forces across multiple locations to exhaust the EADI's responses, and even launch simultaneous attacks along multiple routes to ensure that their military cannot smoothly reinforce its positions."

 army_breakthrough_against_minor_factor_tooltip_150: "Breakthrough against Minor Nations: $RIGHT|+=%1$ for 150 days"

 land_night_attack_tooltip_200: "Land Night Attack: $RIGHT|+=%1$ for 200 days"

 org_loss_at_low_org_factor_tooltip_70: "Organization Loss when below 25%: $RIGHT|+=%1$ for 70 days"

 planning_speed_tooltip_15: "Planning Speed: $RIGHT|+=%1$ for 15 days"

 
 CHI_rekindle_confidence_desc: "It's a success! The multi-pronged simultaneous offensive has begun to take effect. This is a massive morale boost for the National Armed Forces and the entire PDTO. The territory of the People's Republic of China is no longer whole. Spanning nearly 80 years of time, the National Armed Forces have once again set foot on this inherent territory that now feels so unfamiliar to them. They cannot stop here; the front lines must relentlessly push forward until the red five-star flag looming over the mainland is completely eradicated."

 CHI_changbai_foothills_desc: "The Changbai Mountains, the sacred mountains of the Korean people, now pose the greatest obstacle for the PDTO's entry into Northeast China. The portion of the Changbai Mountains ceded to North Korea after 1952 has virtually no infrastructure, making it extremely difficult for troops to pass. Even heading northwest into the CCP-controlled sections, there are only a few defensible mountain roads located within tourist development zones. Therefore, we must be fully prepared for mountain warfare."

 CHI_under_yinshan_desc: "\"If only the Winged General of Dragon City were here, the Tartar horses would never cross the Yin Mountains.\" The great Tang Dynasty poet Wang Changling once wrote these lines. Now, just like the historical national heroes Huo Qubing and Yue Fei, we must expel the Russian-backed bandits, the \"CCP\", who have usurped China. To achieve this, we must open a passage from the Northeast into Mongolia, effectively enveloping the CCP's heart and brain: Beijing. However, following their defeat in the Northeast, the CCP has built massive fortifications in the Yin Mountains, a mountain range that served as a crucial northern barrier for the Central Plains dynasties a millennium ago. Furthermore, they have executed scorched-earth tactics, hoping the endless steppes will force our retreat. The flat grasslands are exceptionally suited for offensives by the CCP's mechanized combined arms brigades. Combat on the steppes will be a severe test for our soldiers and logistics; we must make foolproof preparations for warfare on the grasslands."

 CHI_the_great_wall_war_desc: "The Great Wall, praised as one of the ten great historical wonders of humanity, has repeatedly shielded the people of the Central Plains. Even the fierce Mongolian cavalry had to revere it. The barrier between inside and outside the pass that spanned over two millennia has been deeply rooted in the hearts of every Chinese. In the past, various monarchs, out of national defense and economic development needs, took the initiative to isolate the affluent North and South China from beyond the Great Wall. Even if they successfully defeated the nomadic tribes in the north, they at most maintained a tributary relationship; those who truly controlled the lands beyond the pass were still those nomadic tribes.\n\nNow, the offensive and defensive positions have shifted. Our continuous victories in Mongolia and Manchuria have shattered the CCP's control over the territories beyond the pass. The fleeing PLA can only cling to this 2,000-year-old historical relic, trying to keep the invaders outside the Great Wall. Nearly a century ago, the PLA took advantage of post-war chaos to occupy Manchuria and used it as a base to launch the \"War of Liberation,\" marching south into North and Central China under the banner of national justice. Now, it is the PLA that is routed and fleeing back through the pass.\n\nBut we will not stop here. Beijing is right before our eyes! It's time to let them taste the humiliation we once endured!"

 CHI_waves_of_nujiang_desc: "In the Nujiang Lisu Autonomous Prefecture along the China-Myanmar border, the Nujiang River splits the land in two. The PLA has already established defenses along the border and the eastern banks of the river. Even during peacetime, the China-Myanmar border is defined by towering mountains and extensive barbed wire fences designed to block Myanmar gangs, scammers, and illegal immigrants from entering China. As the war threatens to spill into Yunnan, the CCP has built numerous semi-permanent defensive works based on the original border line, along with a secondary defense line east of the Nujiang River. Coupled with the atrocious transportation conditions along the border, the few passable areas are heavily guarded by the PLA. Therefore, we will undoubtedly face a brutal combined campaign of mountain, amphibious, and siege warfare here. We must be fully prepared for this."

 CHI_storms_of_south_asia_desc: "India has joined the PTO and become our friend. Using India's roads, we can reach the world's highest plateau—the Tibetan Plateau, and then descend from the plateau to attack the CCP's vast rear area in the Northwest. But before that, we need to help the Indians resolve the threats on their left and right flanks—India's traditional rival Pakistan, and Myanmar, which is controlled by dispatched CCP forces. If these two areas are not resolved, India will fall into a three-front war, making entering the Tibetan Plateau an impossible task."

 CHI_land_of_abundance_desc: "The Sichuan Basin, known as the \"Land of Abundance,\" served as the provisional capital of the Republic of China and the seat of the Nationalist government during the War of Resistance from 1937 to 1945. In 1948, the Nationalist government also attempted to hold this territory. Since ancient times, the Sichuan Basin has been a natural fortress, easy to defend and hard to attack. Numerous regimes, such as Shu Han, Cheng Han, and Daxi, relied on its formidable terrain to fend off powerful enemies. Following their defeat in Yunnan, the PLA has utilized this geography to establish formidable defensive works. The good news is that since the turn of the 21st century, the CCP has built numerous roads in Sichuan, making our choice of attack routes and logistics far superior to what we faced in Yunnan. The bad news, however, is that many of these roads traverse mountains through extensive tunnels. If these tunnels are blown up, our advance will be severely hindered. The assault on Sichuan will undoubtedly be an ultimate test for our mountain and engineering troops; we must make foolproof preparations."

 
 CHI_winds_and_rains_of_min_and_yue_desc: "Fujian, separated from Taiwan by a single strait, is our closest possible landing site. Since retreating to Taiwan in 1949, our country has still maintained control over Kinmen in the Fujian Province region. Both sides established \"Unify China\" signs to shout across the sea, and now it is time for us to put \"Three Principles of the People Unite China\" into practice. Our Marine Corps will land in Fujian under the cover of Kinmen artillery and the PTO joint fleet. We will then head south along the coast, entering Guangdong Province, and attacking the CCP's important southern cities—Guangzhou and the economic hub Shenzhen."

 invasion_preparation_tooltip_300: "Naval Invasion Preparation Time: $RIGHT|+=%1$ for 300 days"

 naval_invasion_penalty_tooltip_300: "Naval Invasion Penalty: $RIGHT|+=%1$ for 300 days"

 
 CHI_gather_at_yangtze_desc: "\"Beside the Zhuque Bridge, wild grasses and flowers grow; At the entrance of Wuyi Alley, the setting sun slants low. The swallows that once nested in the halls of Wang and Xie; Now fly into the homes of ordinary folk.\" Nanjing, the ancient capital of six dynasties, has been a renowned city since ancient times and serves as our nation's de jure capital. However, in the 38th year of the Republic (1949), the Nationalist government was forced to abandon this beautiful historical city. This disaster-ridden capital has been continuously scarred by the Manchus, warlords, the Japanese, and the Communists. With the coastal landings successfully completed, the road to the Jiangsu-Zhejiang region is wide open. We are now only one step away from our capital and China's economic powerhouse, Shanghai. However, this region is a highly urbanized and economically prosperous area crisscrossed by dense water networks. While transportation and logistics are convenient here, we will inevitably face immense demands for river-crossing and urban combat operations. We must make thorough preparations to ensure that our return to the capital is fought cleanly and beautifully."

 CHI_between_plateau_fronts_desc: "\"The bright moon rises from the Tian Shan, amidst the vast sea of clouds.\" This is exactly how Li Bai described the magnificent scene of the towering Tian Shan and the bright moon reflecting each other. When the Republic of China was still on the mainland, since the National Armed Forces entered Xinjiang in 1943, they guarded Xinjiang with honor and loyalty. When the \"Three Districts Rebellion\" broke out in 1944, even with the Soviet Union directly sending troops to cooperate with the rebels, they failed to separate Xinjiang from China. It was not until 1949, when the situation was hopeless and the entire Gansu province was occupied, that they were forced to surrender to the CCP. Subsequently, the CCP's Xinjiang Production and Construction Corps has controlled Xinjiang with bayonets and cameras. Now, we have controlled the Tibetan Plateau, and we can look down from the plateau, descending like tigers from the mountains to liberate Xinjiang."

