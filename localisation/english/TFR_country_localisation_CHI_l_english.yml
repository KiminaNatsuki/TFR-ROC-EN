 CHI_low_international_recognition_idea: "A \"Part\" of China"

 CHI_low_international_recognition_idea_desc: "\"The Government of the United States of America acknowledges the Chinese position that there is but one China and Taiwan is part of China.\"\n— Joint Communiqué on the Establishment of Diplomatic Relations\n\nAlthough the Republic of China possesses national sovereignty, territory, people, a government, and a Ministry of Foreign Affairs, we are internationally regarded as a region of the People's Republic of China. Our national sovereignty is unrecognized by most nations, and even our most \"reliable\" ally uses ambiguous language to describe it.\n\nSince its defeat and retreat to Taiwan in the 1950 Chinese Civil War, the ROC retained the legal representation of China and held a permanent seat on the UN Security Council. But this all ended in 1978 with the \"Sino-American severance of diplomatic relations.\" Our most \"reliable\" ally abandoned us for the other side of the strait, our greatest enemy... From then on, the Republic of China became a \"region.\"\n\nThe ROC's attempts to join international organizations or even conduct normal diplomacy are constantly obstructed by the PRC, making our diplomatic work incredibly difficult.\n\nThe Republic of China once represented all of China. After the diplomatic break with the US during the Cold War, the ROC's international status plummeted from the sole legitimate government of China—higher than East and West Germany or North and South Korea—to an unrecognized breakaway regime akin to Somaliland or Transnistria.\n\nAfter the Cold War ended and the multipolar era began, we thought the PRC would disintegrate like the Soviet Union. Hope for the ROC's return to the international community was rekindled in 1989, but turned to despair after the PRC successfully suppressed its internal situation. The PRC's growing strength and the policies of new political parties led us to decide not to fight for the representation of China anymore, but rather for the representation of Taiwan. However, the Beijing authorities view this as an illegal act leading to national secession, and have constantly issued military threats since.\n\nThe PRC's rise in the 21st century reversed the ROC's supposedly humble status. After the Soviet collapse, our \"reliable\" ally turned its attention to the Asia-Pacific region, and the ROC became favored for maintaining the First Island Chain defense plan, keeping a deliberately ambiguous diplomatic relationship with us.\n\nOur relationship with our ally and the mainland must be carefully weighed; bias toward either side could consign the Republic of China to history..."

