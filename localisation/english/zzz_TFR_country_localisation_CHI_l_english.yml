 slashN:0 "\n-----\n"
 CHI_Victory_of_the_wounded:0 "The Return of the Heroes"
 CHI_Victory_of_the_wounded_desc:0 "Cruel war has cost us many compatriots. Soldiers returning from the frontlines bear wounds both large and small, their faces etched with the exhaustion of the past year's fighting. Although a mountain of work still lies ahead, for now, let us welcome their triumphant return."
 CHI_Survivor_celebration:0 "Celebrate Our Survivors"
 CHI_Survivor_celebration_desc:0 "People are emerging from the shelters, embracing one another and cheering for the end of the war.\n\nWhile it is heartbreaking to see our homes reduced to ruins, the presence of family and friends washes away the sorrow. The elderly fall to their knees in gratitude to the heavens, parents weep as they hold their children, young students feel a pang of sorrow as they remember their studies and exams, and young children laugh now that they can run freely once more.\n\nAs long as we are alive, there is hope."
 CHI_Self_sutureing_trauma:0 "Bind Our Wounds..."
 CHI_Self_sutureing_trauma_desc:0 "We won... but we paid a price beyond anyone's imagination. Since the Nationalist retreat in 1949, three entire generations of Taiwanese had never witnessed the cruelty of war firsthand. As the veterans slowly faded away, the Taiwanese impression of war was reduced to stories of invincible heroes in television shows and video games.\n\nBut now, reality has carved an indelible scar into our hearts. Missiles and bombs have torn open every city, and blizzards of obituaries have shattered the hopes of countless parents. Yet the world marches on, and the living cannot remain forever immersed in the pain of the past. No matter what has happened, Taiwan will continue to move forward."
 CHI_Eliminate_communist_traitors:0 "Decimate Communist Traitors"
 CHI_Eliminate_communist_traitors_desc:0 "Our ability to repel the red dragon across the strait is entirely due to the heroic officers, soldiers, and citizens who bravely rushed to the frontlines to provide civil defense assistance.\n\nHowever, there are those who loudly proclaimed their dedication to defending Taiwan while secretly leaking military intelligence to the People's Liberation Army. These individuals are known as the 'Fifth Column.' Over the past thirty years, the Chinese Communist Party has used various channels to contact our retired generals and officers. Disregarding the Republic of China, many of these officers sold off seemingly harmless maps and data.\n\nIn the past, the government chose to turn a blind eye to this for the sake of harmonious cross-strait relations. Now that the Chinese Communist Party's attempt to invade Taiwan has been thwarted, it is time to purge these black sheep hiding among our people."
 CHI_Preserving_diverse_voices:0 "Preserve Free Speech"
 CHI_Preserving_diverse_voices_desc:0 "Nearly forty years have passed since President Chiang Ching-kuo declared the lifting of martial law in 1987. It was only through the tireless efforts of the Tangwai movement back then that Taiwan officially entered the democratic era. The people could finally speak freely and publicly advocate their political ideals. The Kuomintang and the Democratic Progressive Party; pro-independence and pro-unification factions; hawks and doves. Everyone acted according to their own ideals, together shaping the face of Taiwanese politics.\n\nToday, the stubborn will of the Republic of China has proven to the world that the Free Area still stands strong. It was precisely the cooperation of all sectors of society during wartime that allowed us to weather this storm. As it was yesterday, so it shall be tomorrow."
 CHI_Lifting_martial_law:0 "Lift Martial Law"
 CHI_Lifting_martial_law_desc:0 "The war is over... yet some liberals have expressed dissatisfaction with the government's continued post-war control over speech and human rights.\n\nIn the past, during the era of one-party rule by the Kuomintang, society endured a martial law period that lasted for thirty-eight years. The public fears the return of a suppression of freedom that could impact one or two generations. Before things spiral out of control, people have decided to organize protests to express their demands. According to the law, the government should dispatch police forces to arrest them all, but... we cannot repeat the mistakes of the past."
 CHI_Restart_Temporary_Provisions:0 "Reinstate the Temporary Provisions"
 CHI_Restart_Temporary_Provisions_desc:0 "The war is over... but there are still many despicable rebels within the country.\n\nEven though our nation has won the Taiwan Strait War, the traitors co-opted by the other side continue to spare no effort in trying to divide our unity. In the past, when the Kuomintang activated the Temporary Provisions against the Communist Rebellion, they successfully arrested many communist affiliates to prevent Taiwan from turning red. Perhaps we should draw on past experience to deal with this unstable society. Future history textbooks may harshly criticize this period, but as the saying goes: 'You can't catch a wolf if you're afraid to lose your shoe.'"
 CHI_Plum_blossoms_bloom_in_the_bitter_winter:0 "Plum Blossoms in the Bitter Winter"
 CHI_Plum_blossoms_bloom_in_the_bitter_winter_desc:0 "The southern chill is light, the mountains naturally green; the plum blossoms in the courtyard are the first to herald the news of spring.\n\nNow, the situation on the island has initially stabilized, and there are no further movements from across the strait. We can finally free up our hands to deal with more important matters."
