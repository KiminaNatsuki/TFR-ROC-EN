 CHI_neokumintang:0 "New Party"
 CHI_project_national_glory:0 "Project National Glory"
 CHI_destroyed_country:0 "Destroyed Country"
 CHI_destroyed_country_desc:0 "Although the war is over, our country can never return to how it was before. The sound of sirens still echoes in the ears of the public. Missile strikes, air raids, and artillery fire have not only destroyed our highway network but also severely damaged the railway system and subway operations. Post-war commuting times have tripled compared to before the war, and what's worse, our manufacturing industry has also suffered a devastating blow. The science and technology parks scattered across the island have been ravaged by targeted military strikes, and foreign capital has withdrawn from our investment market. If we want to restore our country's position as a global tech hub, our government must work hand-in-hand with our allies and make tremendous efforts."
