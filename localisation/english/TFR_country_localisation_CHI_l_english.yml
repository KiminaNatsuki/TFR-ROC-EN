 CHI_ROC_army: "Republic of China Armed Forces"

 CHI_ROC_army_dynamic: "Republic of China Armed Forces"

 CHI_ROC_army_dynamic_desc: "\n\n\n\n£GFX_CHI_ROCA_texticon\n\n\n\n\n\n§yFraternity and Sincerity, Defending Forever.§!\n\nThe Republic of China Armed Forces. Formerly the National Revolutionary Army, it is a military with a glorious history of overthrowing the Qing Dynasty and establishing the Republic. Historically, the Armed Forces struck the warlords in the north and resisted the Japanese invaders in the south. Since Sun Yat-sen established this army at Whampoa in 1924, it has always practiced the military motto of \"Fraternity and Sincerity,\" fighting for the unification and democracy of China.\n\n§yAfter the government relocated to Taiwan, as the plan to counterattack the mainland was abandoned, the Armed Forces gradually transformed into a defensive military. The Armed Forces, which had 700,000 troops at its peak, are now unable to even recruit enough new soldiers. It relies heavily on US arms sales, and many outdated training methods are still practiced in the military. Reform is imperative!§!\n"

 CHI_ROC_army_dynamic_2: "Republic of China Army"

 CHI_ROC_army_dynamic_2_desc: "\n\n\n\n£GFX_CHI_ROCA_texticon\n\n\n\n\n\n§yFraternity and Sincerity, Defending Forever.§!\n\nThe Republic of China Armed Forces. Formerly the National Revolutionary Army, it is a military with a glorious history of overthrowing the Qing Dynasty and establishing the Republic. Historically, the Armed Forces struck the warlords in the north and resisted the Japanese invaders in the south. Since Sun Yat-sen established this army at Whampoa in 1924, it has always practiced the military motto of \"Fraternity and Sincerity,\" fighting for the unification and democracy of China.\n\n§yFollowing the reforms, the Armed Forces immediately faced a massive test, which they passed with flying colors. By resisting the invasion of the PLA, the Armed Forces proved that the reforms were highly effective. They have proven themselves to be a powerful military capable of defending the homeland against any enemy, earning the deep recognition and welcome of the people.§!\n"

 CHI_ROC_army_dynamic_3: "Republic of China Army"

 CHI_ROC_army_dynamic_3_desc: "\n\n\n\n£GFX_CHI_ROCA_texticon\n\n\n\n\n\n§yFraternity and Sincerity, Defending Forever.§!\n\nThe Republic of China Armed Forces. Formerly the National Revolutionary Army, it is a military with a glorious history of overthrowing the Qing Dynasty and establishing the Republic. Historically, the Armed Forces struck the warlords in the north and resisted the Japanese invaders in the south. Since Sun Yat-sen established this army at Whampoa in 1924, it has always practiced the military motto of \"Fraternity and Sincerity,\" fighting for the unification and democracy of China.\n\n§yThe Armed Forces have survived the most difficult test, defeating our greatest rival, the PLA, in the Great Asian War. Washing away the shame of being defeated by the Communist army in 1949, they have proven that the Armed Forces are a world-class, capable, and resilient force. The Armed Forces will continue to fight for the unification and democracy of China in the future.§!\n"

 CHI_ROC_airforce: "Republic of China Air Force"

 CHI_ROC_airforce_dynamic: "Republic of China Air Force"

 CHI_ROC_airforce_dynamic_desc: "\n\n\n\n£GFX_CHI_ROCAF_texticon\n\n\n\n\n\n§yWithout Air Defense, There is No National Defense.§!\n\nUnlike the Western powers and the newly developing Japan in the early 20th century, where the army and navy originally had their own aviation units that gradually became independent branches due to wartime needs and trends, the development of the Republic of China's air power was full of compromises and reluctance. China, having missed the Industrial Revolution, had to sort out its internal factions before developing air power. Thus, for a long time, financial resources heavily favored the army, and it wasn't until the completion of the Northern Expedition that the Air Force gradually received support.\nHowever, the early development of the Air Force largely relied on foreign arms and technology, and pilot training was relatively rudimentary. Facing the pressing threat from Japan, history gave us little time. Fortunately, the United States provided immense assistance during the war and supplied numerous weapons and technologies after the retreat to Taiwan, injecting a shot in the arm for the precarious Republic of China.\nThroughout the latter half of the 20th century, the ROC Air Force consistently held a leading position compared to the CCP. Although the Black Cat Squadron, which frequently penetrated deep inland, was sometimes shot down by the PLA due to various accidents, the CCP struggled for a long time to produce assets that could rival our contemporary equipment. This has been the source of our military's long-standing confidence.\n\n§yHowever, with the technological gap brought by the severance of US diplomatic relations, coupled with the CCP's rapid development after the millennium, our country's finances can gradually no longer support an aviation force capable of taking the initiative. After 2000, under severe international political and financial pressure, the Air Force gradually transformed into a defensive force. Facing the increasingly powerful Red Dragon, one wonders if the falcons guarding the blue skies can seize the opportunity to strike the enemy's Achilles' heel?§!\n"

 CHI_ROC_airforce_dynamic_2: "Republic of China Air Force"

 CHI_ROC_airforce_dynamic_2_desc: "\n\n\n\n£GFX_CHI_ROCAF_texticon\n\n\n\n\n\n§yWithout Air Defense, There is No National Defense.§!\n\nUnlike the Western powers and the newly developing Japan in the early 20th century, where the army and navy originally had their own aviation units that gradually became independent branches due to wartime needs and trends, the development of the Republic of China's air power was full of compromises and reluctance. China, having missed the Industrial Revolution, had to sort out its internal factions before developing air power. Thus, for a long time, financial resources heavily favored the army, and it wasn't until the completion of the Northern Expedition that the Air Force gradually received support.\nHowever, the early development of the Air Force largely relied on foreign arms and technology, and pilot training was relatively rudimentary. Facing the pressing threat from Japan, history gave us little time. Fortunately, the United States provided immense assistance during the war and supplied numerous weapons and technologies after the retreat to Taiwan, injecting a shot in the arm for the precarious Republic of China.\nThroughout the latter half of the 20th century, the ROC Air Force consistently held a leading position compared to the CCP. Although the Black Cat Squadron, which frequently penetrated deep inland, was sometimes shot down by the PLA due to various accidents, the CCP struggled for a long time to produce assets that could rival our contemporary equipment. This has been the source of our military's long-standing confidence.\n\n§yHaving gone through a process of arduous struggle, the ROC Air Force is currently in a phase of complete reconstruction. The blood of countless martyrs during the Taiwan Strait conflict bought peace and survival, but at present, our elites are lost, and our equipment is in ruins. To survive the threat from across the strait, the ROC Air Force must reflect and improve itself, fearlessly sacrificing like the countless warriors and patriots in the War of Resistance, striving to protect the country!§!\n"

