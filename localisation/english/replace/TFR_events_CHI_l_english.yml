 CHI.BF.100.t: "Project CM-13"
 CHI.BF.100.d: "The current state of global decay is unprecedented in history. The United States is experiencing a civil war, and we, the Republic of China, have just endured a war like no other. During this conflict, frontline soldiers repeatedly lashed out in frustration at our outdated tanks from the last century. Although the outcome of the war was relatively favorable, temporary luck cannot secure our nation permanently. Currently, the National Chung-Shan Institute of Science and Technology (NCSIST) is considering three proposals:\n\nOption One:\nDismantle and analyze the PLA Type 99 and Type 96 tanks captured during the war, modify their calibers and electronic control specifications, and turn them into our new generation of main battle tanks.\n\nOption Two:\nPurchase American-made main battle tanks from allies like Australia and use the same dismantling and analyzing approach. Given that our officers and soldiers are more familiar with the operation and design of American-made weapons, this method is undoubtedly the safest choice.\n\nOption Three:\nApply to Japan for tank production authorization and design blueprints, making minor improvements. The Type 10, developed by Japan for hilly, mountainous, and narrow road terrains, is a good choice for Taiwan's geography, which also features many mountains and few plains.\n\nWe must carefully consider the costs and combat capabilities of the above options so we can survive the next unprecedented war."
 CHI.BF.100.a: "Repurpose PLA Armored Vehicles"
 CHI.BF.100.b: "Analyze the M1A2 Abrams."
 CHI.BF.100.c: "Request Allied Tank Technology"
 CHI.H2.11.t: "Election Night"
 CHI.H2.11.d: "Tonight, Kaohsiung City is extraordinarily lively, the streets packed with parades celebrating Han Kuo-yu's election victory. From Yixin Road to Shiquan Road, a river of red, white, and blue surrounds the President. Director Han stands on his campaign truck, waving to the enthusiastic crowds all around-thanking them for their votes, for giving him another chance, and for trusting him once more.\n\nThe thank-you parade continues until two or three in the morning before ending. Director Han drags his heavy body back to the rear seat of the truck. Three consecutive days of street sweeping from north to south have left him exhausted; his nearly seventy-year-old body truly isn't what it used to be! Outside, dim yellow streetlights flicker across his face. His inner distress can only be confided to the distant moon; he knows in his heart that after the baptism of war, Taiwan and its people have been fundamentally changed.\n\nThe past dissipates like smoke. Today, Boss Han remains the captain at the helm, but can he truly steer the Republic of China to the dreamland everyone envisions? The red dragon in the west has only temporarily receded; they still have the strength to make a comeback. News from America in the distant east is extremely chaotic, and there is no chance they will return to the Asia-Pacific in the short term. The stage has been cleared, and the messy chessboard must be reset. The collapse of the old order signifies a rebirth, but is the Republic of China ready? He doesn't know when the curtain will rise on the next performance. What can he do for the Republic of China? What can he leave for Taiwan?\n\nThe vehicle stops in front of a grey building in Zuoying. He hands the driver a few more Sun Yat-sen bills and walks into the reception hall without looking back. The security guard sitting at the desk is sound asleep in front of an old television, which is playing a news report of Boss Han's parade just moments ago. The clamor outside hasn't affected this guard's life in the slightest. Han Kuo-yu falls silent.\n\nYes, change isn't complete just by casting a vote. The enthusiasm from the rallies was slapped hard in the face by reality. Fundamentally improving Taiwan's predicament will take a very, very long time... A swirl of thoughts floods his mind. Boss Han yawns deeply; he has to figure out a way to do something for the Republic of China. But the future is long, and he can take his time to think... "
 CHI.H2.11.a: "\"Han Bing, I'm home! Any late-night snacks tonight?\""
 CHI.H2.41.t: "The Sword of Themis"
 CHI.H2.41.d: "Li Huiming sat on the plastic bench in the holding room. The seat was peeling from years of neglect, making it rather uncomfortable, but it was still a vast improvement over the hard concrete floor of his cell. He shifted his weight, faked a few sickly coughs, and muttered nonsense under his breath. The guard outside the door just watched him, too afraid to intervene. This was the advantage of holding a psychiatric evaluation report: nobody dared to cross you. If the slightest accident happened, the eager media outside would immediately tear into these high-and-mighty civil servants.\n\nWhen the time came for the trial, a bailiff led him to the defendant's stand. The judge and prosecutor were already in their places, alongside the public defender. He had seen this exact scene many times. Today would just involve some empty arguments before the gavel fell, leaving him plenty of time to reminisce about his \"great achievements.\"\n\n\"Defendant Li Huiming, age forty-three. You were charged with threatening the lives of others with a deadly weapon in a public space. The nature of your crime is vile, and you have shown no remorse. We find you guilty of murder and obstructing official duties. You are hereby sentenced to death and deprived of your civil rights for life.\" The moment the sentence was pronounced, the escorting bailiff grabbed Li Huiming by the collar and hauled him to his feet.\n\n\"I'm innocent! J-judge, I really didn't mean to...\" he wailed in panic. The sudden death sentence caught him completely off guard. He cast a desperate look at his public defender, but the lawyer simply pulled out a massive stack of psychiatric reports belonging to other defendants, along with Li Huiming's own, and hurled them right in his face..."
 CHI.H2.41.a: "That night, every fuse in the Tucheng Detention Center blew at once."
 CHI.H2.61.t: "Old Friends Reunited”"
 CHI.H2.61.d: "The fading sunlight silhouettes the Kaohsiung City skyline. Rivers of red and white flow in opposite directions; the people living on this land all have their own goals and paths to follow. Intermittent traffic lights guide the movement of these cars in an orderly fashion, signaling when to advance and when to stop.\n\nHan Kuo-yu raised his teacup and took a sip. This was his favorite Sanxia Longjing. Steam rose from the hot tea and dissipated into the air, framing the two prominent figures arguing red in the face before him.\n\n\"Mr. Soong, I personally deeply respect your and the KMT's desire for party unity, but your demands seem a bit excessive...\" Chen Chi-mai gripped his cup tightly, spilling tea over his hand, gripping it so hard he seemed ready to crush it. \"Even the most moderate factions within the DPP could never agree to this. How am I supposed to explain this to the other party members-\"\n\n\"Mr. Chen Chi-mai,\" Han Kuo-yu's lips curled into a faint smile. \"The DPP is still a part of Taiwan, a part of \"us.\" It's just that the political infighting over the past few years was too severe. It aches my heart to see it; it really breaks my heart!\"\n\n\"President Han, we are all children of Taiwan thinking about Taiwan's future. We shouldn't be at each other's throats like this. If we both take a step back, it will be easier for me to answer to the voters and everyone else.\" Chen Chi-mai pursed his lips and slowly glanced toward President Han. He carefully put down his teacup and refilled it from the teapot, trying to hide his inner nervousness. Would the President agree to his request?\n\n\"Hmm...\" Han Kuo-yu nodded thoughtfully. \"Classmate Chen makes a fair point. How about this: Mr. Soong, why don't you coordinate things and help secure more of the central budget for our Kaohsiung City? And Classmate Chen, you can help us communicate with the pan-Green factions like the Statebuilding Party. Ask them to go a little easy on us during interpellations at the Kaohsiung City Council?\"\n\nMr. Soong nodded in reluctant agreement. Chen Chi-mai could tell he was quite dissatisfied with this arrangement, but Soong had no choice. If he refused, his political faction would likely face complete marginalization in the future. Urged on by Han Kuo-yu's enthusiastic prompting, the two sides shook hands and made peace. Secret Service agents escorted the men out of the teahouse. Just as Chen Chi-mai was about to drive away, an agent ran up with two gift bags in hand.\n\n\"These are birthday gifts from him for your daughter. He also asked me to pass on a message: 'Don't forget to take care of your family outside of work.'\" Chen Chi-mai accepted the gifts, placed the bags on the passenger seat, and turned the key."
 CHI.H2.61.a: "He started the engine and vanished alone into a brilliant river of white."
 CHI.H2.81.t: "One of Us"
 CHI.H2.81.d: "Inside a convenience store in New Taipei City, Zhang Zhiyuan carried a basket full of instant food and spoke in Japanese to the cashier: \"Please check me out, and give me a pack of your cheapest cigarettes.\" He was a mainland Chinese citizen working in Japan. After the Taiwan Strait War, his company began expanding its business into Taiwan. As the only one in his branch who could speak Chinese, he was dispatched to the island. On TikTok and Weibo, he had seen bloggers and self-media claiming that after the war, the Taiwanese wanted nothing more than to skin mainlanders alive and pull their tendons out-that if he went there, he would be bullied and attacked, with many videos presented as proof. He was terrified of this prospect, but unable to defy his company's orders, he could only disguise himself as a Japanese person. He planned to survive on these instant meals in his hotel room. Leaving the convenience store, he saw some uncleared rubble on the streets, the list of the city's deceased broadcast on a large screen in front of the city hall, and vast numbers of memorial tablets for war casualties in a temple that bore obvious marks of recent repair. All of this made his legs tremble. He constantly fantasized about what kind of persecution he would suffer if he were discovered to be a mainlander. He clutched his briefcase, which contained his ID card and passport, terrified that someone would see them, and hurriedly shoved his Huawei phone into the deepest part of the bag, afraid it would be noticed.\n\nHe finally returned to the hotel lobby and was about to head back to his room, intending never to come out except for work. Just as he put his thoughts to rest and breathed a sigh of relief, a teenager ran out of the elevator and bumped right into him. Caught off guard, Zhang Zhiyuan failed to react and was knocked to the ground. The moment he got up, he saw something that sent a chill down his spine: his bag had burst open during the collision, scattering his ID card, passport, and Huawei phone all over the floor. He felt his life was over.\n\nJust then, a hand reached out to him. It was the teenager who had bumped into him. He subconsciously grabbed the boy's hand. After helping Zhang Zhiyuan up, the boy apologized profusely and turned to help pick up his belongings. Zhang Zhiyuan hurriedly tried to stop him, but the teenager had already picked up his passport. Just as he thought the boy's attitude was about to take a 180-degree turn upon seeing it, the teenager simply silently gathered the scattered items, returned the briefcase and the instant food to him, and said, \"I'm really sorry. I hope you have a great time in Taiwan. We're all one family.\" Then, the boy left.\n\nZhang Zhiyuan stood dumbfounded in the lobby until a hotel staff member came over to ask if he needed assistance. He snapped out of his daze as if waking from a dream. Returning to his room, he stared at the ceiling, muttering to himself:"
 CHI.H2.81.a: "\"Everyone here is one of us...\""
 CHI.H2.82.t: "Our Own People"
 CHI.H2.82.d: "Li Musheng wandered aimlessly through the streets of Taipei. He held a slip of paper written in three languages: Malay, English, and Chinese. He had no idea what place was written on it. He had come here alone to find his last living relative, a cousin-uncle in Taiwan. He couldn't speak Chinese, and his English was very poor. He didn't dare strike up a conversation with anyone and could only silently rely on Google Maps navigation. But after wandering around the area for nearly ten minutes, he still couldn't find the place, and the navigation was useless. Out of desperation, he gathered his courage to look for someone who seemed like they could help him. He spotted a grandmotherly woman who appeared kind and had time to spare. He approached her and used the only Chinese phrase he knew, speaking in a stiff tone: \"Ni hao.\" After the grandma replied, he kept pointing at the paper and said in English, \"I go here.\" Seeing his nervous demeanor, the elderly woman smiled. Realizing he was an overseas compatriot, she took the paper, glanced at it, and beckoned him repeatedly: \"Come with me.\" Li Musheng hurriedly followed. Along the way, the elderly woman kept talking in a language he couldn't understand, but Li Musheng felt a warm and friendly atmosphere-a feeling he had never experienced from people in Malaysia. The old woman led him into an alley and knocked on the window of Room 104. A young girl poked her head out. The elderly woman smiled and said to the girl, \"Ah-Liang, this looks like a compatriot from overseas. The slip of paper he's holding says Mr. Li in Room 502 here. I don't think he speaks Mandarin, so could you, a college student, take him upstairs?\" The girl came out of the room and communicated with Li Musheng in English for a while. Seeing that things were on track, the grandma prepared to leave, and Li Musheng hurriedly thanked her. The girl took him to Room 502 and knocked on the door a few times. The door opened, revealing a middle-aged man who looked quite a bit like Li Musheng. The girl exchanged a few words with the man. The middle-aged man then turned to Li Musheng and said in Malay, \"Come on in first.\""
 CHI.H2.82.a: "Unite the overseas Chinese"
 CHI.H2.101.t: "In the Name of the Government"
 CHI.H2.101.d: "The fading glow of the setting sun guided exhausted office workers on their way home. The rising and falling cries of street vendors drifted across the road and into an inconspicuous alley, where a silver-grey van pulled up quietly by the curb. Sitting in the back seat, Section Chief Hou raised his index finger to his lips, wanting to take a drag of his cigarette. But remembering the mission he was about to execute, his left hand silently slipped the cigarette pack back into his pocket. \"Commence operation!\" The order over the radio was brief and powerful. Section Chief Hou gave a look, and the men disembarked methodically, marching toward the suspect's front door. One of them held a search warrant ready, while another pulled out a master key to pick the lock. It wasn't exactly standard procedure, but... desperate times called for desperate measures. \"Nobody move! Special Investigation Division!\" Chief Hou led his men as they filed inside. \"Legislator Chen, we are under orders to search your residence. Please cooperate with our duties to avoid unnecessary trouble.\" Legislator Chen Yinwei stood there holding her rice bowl, staring in utter shock at the men in black. Before she could speak, the men quickly dispersed to search her home. \"Hou Anqu, what is the meaning of this?! What right do you have to arbitrarily search a legislator's house?! Let me tell you, I am old friends with your Director-General!\" The legislator roared at the Special Investigation Division, glaring at the search warrant on the table. But Chief Hou simply pulled up a chair and, through the steam rising from the hot soup, slowly sat down opposite Legislator Chen. \"Little Xiao! Did you find anything?\" \"Yes, Chief!\" Little Xiao jogged over and handed a phone to Hou Anqu. Looking at the screen, Hou almost broke into a smile, while the legislator across the table turned pale. \"Th-that fridge isn't mine...! I have no idea who put that money in the fridge, I completely-' Before she could finish her sentence, two Special Investigation agents hauled Legislator Chen out of the room and shoved her into the back seat of the van. A photocopy of an ESTA form slipped from her pocket and fluttered slowly to the ground amidst the bustling street, soon to be stamped into the scorching asphalt by passing scooters."
 CHI.H2.101.a: "Director Hou took out his lighter and lit a cigarette..."
 CHI.H2.121.t: "Another Bowl of Braised Pork Rice"
 CHI.H2.121.d: "During an internal Kuomintang meeting, then-party chairman Han Kuo-yu took the stage and delivered a speech to the party members, saying: \"I don't demand a full Manchu-Han Imperial Feast, but there must at least be a bowl of braised pork rice.\" This was my helpless outcry during my campaign for Kaohsiung Mayor. At the time, Tainan was seen by the party as a low-return area. They believed the DPP was invincible there, that these pan-Green fortresses were impregnable, and they were unwilling to invest campaign resources. But my victory in 2018 shattered that perception. As long as we have good policies, are willing to communicate with the public, and are willing to put aside our pride to solve the people's difficulties, the voters will surely see our efforts. Today, I am proposing that in the future, campaign resources should no longer be allocated based on regional divisions. I hope that going forward, wherever there are results, there will be resources. We must no longer focus all our resources on the north; we must develop southward and support the campaigns of party members in the south. Do not be afraid of other parties\" seemingly impregnable fortresses, and do not cower out of fear of failure. I have proven myself that these fortresses are not indestructible. There are many party members in the south with ideas, passion, drive, and hope, yet they are trapped without resources. Not only do they lose to other parties, but because they cannot produce results, their potential remains locked away, leaving bright pearls to gather dust. This is not a good thing for either the party or the nation. Therefore, in the future, we must absolutely not distribute campaign resources by region, but by performance. Let the capable rise and the mediocre step down. Do not cling to safe, conservative mindsets. At the very least, every candidate must have a bowl of braised pork rice and a bottle of mineral water.'\n\nEnthusiastic applause erupted from the audience, with the voices of the younger party members ringing the loudest."
 CHI.H2.121.a: "Food for everyone!"
 CHI.H2.141.t: "The Elephant in the Room"
 CHI.H2.141.d: "Taipei City. The blade of history has left deep scars across this old capital. Construction floodlights illuminate the skyline, while bustling downtown districts offer crowds a place to unwind after work. Ketagalan Boulevard sits quiet tonight, though street vendors in the corners still pulse with life. Watching the scene unfold, Han Kuo-yu feels the weight of the nation on his shoulders. True prosperity for the Taiwanese people will not happen overnight. He steps into his motorcade; there is work to do.\n\nDeep inside an underground conference room missing from any blueprint, the President and his aides gather around a heavy iron table. The projector's glare washes over their grim faces. They thought they understood the rot festering beneath the surface, only to find the reality far more complex.\n\n\"So what are we supposed to do?\" an aide asks. \"Everyone knows about the government corruption and the rock-bottom birth rates. The partisan infighting just makes the situation impossible. What is the point of identifying the problems if we can't act?\"\n\n\"Professor Gao is right,\" Han nods. \"These issues are dragged out every election to attack the incumbents. And then what? The winner plays dumb, uses friendly media to blur the public's memory, and waits for the opposition to recycle the exact same attacks four years later.\"\n\nVoters rarely care which politicians can actually fix things. Even when they do, the opposition simply weaponizes their voices against the administration. Social issues have become a gladiatorial arena. Citizens sit in the stands, waving flags and cheering for their side until the opponent falls.\n\nThe entire system has idled for years. Men fight bitterly over power and profit at the negotiating table, completely ignoring the elephant in the room. Politicians are unwilling and unable to shatter this illusion. But if the President truly wants to overhaul Taiwan, he will have to be the boy who points out the emperor has no clothes.\n\n\"Ministers,\" Han says coldly. \"The only things I want to see on my desk are solutions, or your resignations. I will not accept excuses or delays. Dismissed.\"\n\nHan waits for the last aide to leave before packing his briefcase and exiting the building. Even with the sickness settled deep in its bones, Taipei still shines bright tonight."
 CHI.H2.141.a: "Drastic problems, drastic measures."
 CHI.H2.151.t: "A Storm of Corruption"
 CHI.H2.151.d: "Zhou Guifa adjusted his tie in the front rearview mirror. This was one of the few times in his life he needed to wear a suit out to discuss business. He had only frantically rummaged through his house after receiving the tea party invitation, ultimately having no choice but to make do with the suit he had bought for his wedding. The construction industry had been tough in recent years. Taiwan was densely populated with limited land, and urban development and infrastructure were basically complete. If you couldn't snatch up bids for rezoned areas and public construction, you could only see if there were any scraps left. And if you couldn't get those either... bankruptcy was the only path left.\n\nTo secure government contracts, the remaining construction firms were going all out-sending flowers, gifting exotic birds, making political donations, and more. Against a backdrop of shrinking demand and lack of competition, the only way to survive was to obediently pay the toll. Chairman Zhou got out of his car and walked up to the teahouse. Everyone was already waiting for him in the private room. The attendees were some of the top, most formidable contractors in Taiwan. Following the war, much needed to be rebuilt, and everyone was fighting for the massive contracts to renovate Taoyuan Airport and Zuoying Naval Base. The highways and power infrastructure were also lucrative prizes. \"Brother Lin,\" sitting in the corner, was in the solar panel business. After greasing the right palms, he took advantage of the \"Nuclear-Free Homeland\" initiative to secure multiple \"solar farming\" projects and green energy subsidies. Abandoned farmlands were all converted into solar power plants. The government got pretty numbers on their ledgers, CEO Lin made a fortune off the green transition, and the officials filled their pockets. Everyone had a bright future.\n\nAt the tea party, everyone was discussing how to divvy up the next major construction project. Zhou Guifa didn't say a word. He was the smallest contractor in the room and the one who bribed the least. He originally thought that as long as his engineering work was good enough, he could break this vicious cycle. But he couldn't go against his conscience from when he first started in the industry: every penny had to be spent on construction. Just as the group was chatting merrily, a group of men in black burst into the room and surrounded them from behind.\n\n\"I am Section Chief Hou. Please remain calm and cooperate with our investigation. If you have any questions or grievances, you have the right to call your lawyers-though I advise against putting up a futile struggle.\" Hou Anqu shot a look at his subordinates, who pulled out handcuffs to secure the suspects in the room.\n\n\"Sure, no problem.\" Brother Lin cooperated fully, raising his hands and standing up calmly, paying no mind to the Special Investigation Division agent behind him. The other agents successively handcuffed and led away each suspect. Some were as composed as Brother Lin, but most frantically tried to explain their innocence. Zhou Guifa thought he would be taken away too, but after reeling in the net, Chief Hou left the room without looking back, leaving Chairman Zhou completely bewildered.\n\nA few days later, on the bidding day, the big shots and company representatives he had seen at the tea party were nowhere to be found. His phone was playing news reports about a massive crackdown on organized crime and government-business collusion. Chairman Zhou turned off his phone, trying not to recall the terrifying experience of that day..."
 CHI.H2.151.a: "Walk by the river long enough, and sooner or later your shoes will get wet."
 CHI.H2.181.t: "Taiwan’s Tower of Babel"
 CHI.H2.181.d: "Taipei had yet to fully recover from the war, but glimpses of its past glory still lingered at major intersections. The rushing crowds and heavy traffic pointed to one thing: another great battle loomed ahead.\n\nDressed in a dark suit, Tsai Ing-wen led Lai Ching-te through the heavy atmosphere, following a guide deep into the Regent Taipei. She had no idea what Han Kuo-yu was planning. Still, for a man at the height of his power to invite her to discuss state affairs after such a war gave her and the DPP immense face.\n\nThe walk was short, and overthinking was no substitute for seeing things firsthand. Tsai took the seat opposite Han, with Lai settling in beside her. Han was in high spirits. Beside him sat Chiang Wan-an, a descendant of Chiang Kai-shek and a rising star in Taiwanese politics.\n\nA trap... or something else?\n\nAfter an exchange of greetings, silence fell over the table. Tsai's brow twitched. She was about to speak when Han beat her to it:\n\n\"President Tsai, there is no need to worry. I did not invite you here to attack political opponents or divide the spoils. The situation remains dire in the wake of this crisis, and I sincerely ask for your counsel on state affairs.\"\n\nChiang Wan-an nodded in agreement. Lai Ching-te looked doubtful but stayed quiet, simply turning to glance at Tsai. Her expression softened slightly. After a brief pause, she replied:\n\n\"You are too modest, President Han. Without you, how could Taiwan have won? I just do not know your grand strategy for the post-war era. I only hope you keep the greater good in mind. The people look to you and the nation depends on you. Do not repeat the mistakes of the past...\"\n\nHan understood the implication: she feared he would become the next Chiang Kai-shek. He tapped the table, his expression calm, and spoke slowly:\n\n\"Rest assured, President Tsai. I draw lessons from history. If Taiwan is to enjoy clean politics and social harmony, we cannot shut out the eyes and ears of the people. That principle is the very foundation of my governance.\"\n\nHan spoke with sincere humility. He went on to outline his political vision, allowing Tsai to finally breathe a sigh of relief. A tired smile broke through her solemn expression.\n\nTsai glanced over at Lai and Chiang. She never expected these two prominent figures, both seen as the rising heirs of their respective parties, to hit it off so well. Han raised his glass for a toast. Finally dropping her guard, Tsai raised her own glass to join them."
 CHI.H2.181.a: "I look forward to our collaboration!"
 CHI.H2.221.t: "Bridgehead for the Counteroffensive"
 CHI.H2.221.d: "\"Following the end of the Taiwan Strait War, our nation successfully dispatched troops to reclaim the Paracel and Spratly Islands as the People's Republic of China withdrew from these areas. Some relevant experts have expressed concerns about this, stating that it might anger China and invite brutal retaliation. We will now interview President Han for his thoughts on this matter.'\n\n\"I don't think it's a big deal. We've already won once. If we can successfully develop the resources there, we can use them to make the nation rich. And if we get rich, we can develop better equipment. Why should we be afraid of China's retaliation?\" Han Kuo-yu raised his right arm, pumping his fist to encourage the public.\n\n\"Everyone needs to be a bit more confident. As long as you continue to trust me, I won't let you suffer any losses!'\n\nApplause erupted throughout the venue. Not everyone accepted his words, but Han Kuo-yu's rhetoric certainly carried a certain magnetic charm.\n\n*Beep-*\n\nThe remote button was pressed, instantly cutting off the news broadcast on the television.\n\n\"That was a brilliant response, Mr. President.'\n\nThe young aide stared at the black screen, slowly turning his head to look at Han Kuo-yu.\n\n\"Right? I think it will definitely inspire the people.'\n\nThe aide looked away, hesitating for a moment before asking.\n\n\"Mr. President, are you sure you want to do this? We've already faced public condemnation from the Beijing government for seizing the offshore islands. If we go further and reinstate Hainan Province, it will absolutely be seen as a severe provocation, and then...'\n\nBefore he could finish, Han Kuo-yu interrupted the young man.\n\n\"Why shouldn't we? I want the other side to understand that the Republic of China will not stay on this island forever. If you found yourself capable of growing strong enough to deter a bully, would you just keep hiding in the corner? I don't want my people to be bullied forever.'\n\nHan Kuo-yu stood up and walked toward the office door, reaching out to turn the doorknob.\n\n\"Besides, I also want to send a message to the mainland residents: \"The Taiwanese have not forgotten their compatriots.\" That is all.'\n\nHan Kuo-yu stepped out the door, hurrying to the next place that needed him.\n\nOnce certain Han Kuo-yu was far away, the aide let out a long sigh."
 CHI.H2.221.a: "Now comes the important part: choosing letters for new ID cards..."
 CHI.H2.222.t: "The First Step of the Reclamation"
 CHI.H2.222.d: "On Yongxing Island, two workers operate a heavy angle grinder to erase the characters from a stone monument that once read \"Sansha City People's Government.\" Nearby, a crane lowers the administrative plaque, preparing to hoist a new sign reading \"Hainan Provincial Government.\" Following the island's reclamation by ROC armed forces, a presidential decree authorized the reinstatement of Hainan Province, whose operations had been suspended since 2003. The former Sansha administrative complex is being converted to house this provincial authority, while the old Xisha District headquarters 1.5 kilometers away will be repurposed as the new Sansha City Government.\n\nMeanwhile, officials arriving from Taiwan are conducting a census across the Paracel, Macclesfield, and Spratly Islands, asking residents whether they wish to apply for Republic of China citizenship or return to the mainland. For the first time in over two decades, the Hainan Province emblem flies over the South China Sea, with Pratas Island and Taiping Island officially returned to provincial jurisdiction.\n\nLi Shun's grandfather was a veteran of the Hainan campaign. Growing up, Li heard countless stories about the Great Retreat and the island's coconut and sugarcane farms, along with the relatives left behind who eventually faded into silence. Upon hearing of the province's reinstatement, Li bought a ferry ticket and brought along some coconut candy, which his grandfather always said held the taste of home. Standing on the shores of Woody Island, he looked toward Hainan. Though the landmass remained out of sight beyond the horizon, he could feel the pull of the homeland that had haunted his grandfather's dreams. Tossing the candy into the waves, he shouted:"
 CHI.H2.222.a: "\"Grandpa, we're going home soon!\""
 CHI.H2.251.t: "The Cycle of History"
 CHI.H2.251.d: "Hu Yuan-hui leaned his clasped hands against the solid wood desk. His eyes darted between the desktop and his uninvited guest. He swallowed, trying to ease his parched throat. The visitor sat across from him wearing that signature smile. Hu had seen this face on television countless times, and it was identical to the approachable figure who once canvassed for votes in traditional markets. Not a single flaw.\n\n\"I believe my board of directors and I have made ourselves very clear, Mr. President. Media freedom must not be interfered with! Thirty years ago, our predecessors fought hard to free Taiwan's media from political and military control, a reality the Taiwanese people gladly embraced. You are openly making an enemy of the public!\" Hu yelled at his distinguished guest, trying to use the volume to mask his own anxiety. He knew perfectly well that he and PTS were rapidly running out of room to maneuver...\n\n\"Mr. Hu,\" Han Kuo-yu said in his trademark approachable tone. \"Aren't you the one making an enemy of the public? On the surface, you claim to be neutral. In reality, you take orders from the ruling party in hopes of securing a larger budget. That means PTS answers only to the government and never truly looks out for the people!\"\n\n\"That is still better than you personally interfering with PTS operations...\" Hu was on the verge of a total breakdown. Months of internal audits and news content investigations had left him utterly exhausted. Various reorganization plans piled up like a mountain on his desk, and his forceful pushback had only invited even harsher restrictions. He stood up, gritting his teeth, feeling as though he were balanced on the edge of a cliff. He reached out his hand. Was this really his only way out?\n\n\"A pleasure working with you. You finally have time to spend with your family, unlike me, constantly chased by government affairs.\" President Han smiled as he shook Hu's hand. \"My assistant will bring in the agreement shortly. Please sign it as soon as possible. Thank you for your trouble!\"\n\nHan Kuo-yu walked out of the office with a smile. Hu Yuan-hui slumped back into his leather chair, looking as though his soul had been drained. He stared at the various certificates lining the wall and suddenly felt countless eyes scrutinizing his every move."
 CHI.H2.251.a: "\"Mr. Hu, please sign here.\""
 CHI.H2.261.t: "An Interview"
 CHI.H2.261.d: "\"So, what are your thoughts on your time as president so far? Or perhaps you have certain expectations for the future?\" Zhu Kexin leaned forward slightly. She held a notebook stamped with the PTS logo in one hand and a ballpoint pen in the other, ready to record the president's reply. She glanced at the page crammed with various questions and margin notes. This list was the product of her department colleagues racking their brains all night. When first submitted, the draft contained a full forty questions. After passing through layers of approval, the Presidential Office agreed to answer exactly seven.\n\n\"Oh, right... I actually find being president quite enjoyable. Compared to my time as Kaohsiung mayor, serving the entire country definitely brings a greater sense of achievement than just serving one city! As for my vision for the future, we have already endured far too much hardship. My wish is simple: I just want everyone to be able to buy affordable vegetables at the local market!\" Han Kuo-yu's hearty laughter rubbed off on the people in the room. Zhu Kexin couldn't keep a straight face and accidentally let out a laugh. Yes, this man really was just that approachable and charming. Anyone who watched television regularly would undoubtedly agree.\n\n\"You really are a man of the people, Mr. President...\" Reporter Zhu regained her composure. She looked across the table at her interview subject. Her eyes inadvertently caught the camera behind him. The blinking red dot served as a constant reminder to the two people in front of the lens: this was a performance, not an interview. Zhu Kexin swallowed hard. Her professional conscience felt incredibly feeble under the camera's glare. She quickly put on a show of taking furious notes, nodding thoughtfully as she scribbled.\n\nReporter Zhu quietly closed her notebook. The floor director caught her eye, and the red light blinked off. It was time for a break. A few staff members, eager to witness \"President Han\" and his famous presence in person, practically sprinted onto the studio floor. Reporter Zhu was the only one who walked silently over to the emergency stairwell, dropping her notebook down the shaft."
 CHI.H2.261.a: "In the end, she left the PTS building without looking back."
 CHI.H2.301.t: "No! More! Chaos!"
 CHI.H2.301.d: "It was another day of debate in the legislature. During a tense and heated future budget meeting across party lines, a veteran DPP legislator found himself losing ground. Seeing that the KMT's proposed budget was on the verge of passing, he acted almost on instinct: he took off his leather shoe and hurled it at the speaker's podium.\n\nThe shoe struck the podium with a loud smack. In an instant, the entire legislative chamber fell dead silent. Everyone stared at the veteran legislator. Catching on to what he had just done, he turned pale. His legs shook as he babbled his excuses: \"No, no, no, the shoe flew off on its own. I didn't mean to.\"\n\nThe speaker stared at him for a few seconds before speaking. \"Parliamentary police, restrain this legislator.\" Two officers immediately stepped forward, grabbed the old legislator by the arms, and forced him down into his seat.\n\nThe speaker then continued: \"Under the newly enacted Law on the Exercise of Legislative Yuan Powers, any legislator who disrupts order and shouts in the chamber through fighting, flag-raising, presenting gifts, or performance art shall be immediately expelled and suspended for one day. We will also bypass the agenda to hold an immediate floor vote on whether to suspend his legislative duties for two months.\"\n\nAmid the clatter of voting buttons, the result appeared.\n\n\"Passed unanimously. Parliamentary police, please escort Legislator Li out of the legislature.\"\n\nSmack. The gavel fell heavily. The veteran legislator kept his head bowed as the two officers flanked him and marched him out of the building.\n\nAfter he had left, the speaker addressed the room: \"I am sure you all remember what the legislature used to be like. It resembled a performance art gallery and a WWE arena more than a government assembly. But the new Law on the \"Exercise of Legislative Yuan Powers\" has now passed. I expect all of you to act with the self-awareness of a politician and a decent human being. The budget meeting will now resume. Please proceed with reason and self-restraint.\""
 CHI.H2.301.a: "No more WWE Taipei for the public I guess..."
 CHI.H2.391.t: "New Textbooks for a New Era"
 CHI.H2.391.d: "The uncomfortably hot and humid air filled every corner of the classroom. The students sat obediently at their desks; some looking up and listening to the lecture, others with their heads down scribbling furiously, terrified of missing the next midterm exam point. Most students endured this suffocating atmosphere, while a few, like Cai Fenqi, chose to hide in the back row and chat secretly, occasionally looking up to pretend they were paying attention.\n\n\"Hey, Fenqi. Do you have the senior's history exam prep notes? Let me copy them.\" A classmate nudged Cai Fenqi's side with her elbow. The latter impatiently pulled a crumpled notebook from her backpack, flipped back and forth through the yellowed pages until she found the key points for this midterm, and secretly passed it over.\n\nAlthough the curriculum guidelines were revised every ten years and the content of the textbooks changed significantly from time to time, their school only used self-compiled teaching materials. This applied to everything from Chinese, English, and Math to Physics, Chemistry, Civics, and Geography-and History was naturally no exception. Even though the Ministry of Education constantly advised schools to use the standard public textbooks, top high schools like theirs had never paid any mind to such recommendations, continuing to teach solely from their own materials. So even if Cai Fenqi and her friends didn't pay attention in class, they could easily pass by relying on the senior students\" notes.\n\n\"Attention, everyone,\" the teacher suddenly stopped writing with her chalk and said. \"Given the requirements and directives of the newly released Ministry of Education curriculum guidelines, the proportion of long and short reading comprehension, historical source analysis, and short-answer questions on the midterm will significantly increase. At the same time, the history of the Republic of China and modern history after 1949 are also major testing points, so everyone must pay close attention when reviewing.'\n\nCai Fenqi's jaw nearly dropped to the floor. She had completely not expected the teacher to throw such a curveball. It wasn't until after class that she dug out the history textbook she had thrown under her bed at the start of the semester. Flipping through the book, she stayed up all night making various notes in her self-compiled materials."
 CHI.H2.391.a: "“Are we seriously going to be tested on all these generals’ names...?”"
 CHI.H2.431.t: "Better Safe than Sorry"
 CHI.H2.431.d: "Agent Su held a cigarette between his fingers and took a slow drag. The wisps of exhaled smoke stood out sharply under the incandescent bulb. His gaze pierced the haze to observe the room, where a younger agent was interrogating the prisoner. The captive screamed for his lawyer, earning only a barrage of heavy blows in return.\n\nThe National Security Bureau task force under Su's direct command worked tightly with law enforcement. Fresh intelligence landed straight in their hands, and every suspect was hauled in to face personal interrogation by NSB operatives. As for the prime suspects identified as Communist sympathizers, the bureau had specialized services waiting for the bastards.\n\n\"Speak! Where are your accomplices? Give up their names, and I can make things a little easier for you.\" The young agent punctuated his demand with another punch to the prisoner's gut. Brown vomit stained the captive's orange uniform.\n\nAgent Su picked up a piece of toast from the table and took a bite. For the past few days, they had \"kindly\" fed the prisoner white bread and water, paired with three continuous days of severe torture. If this still yielded no results, they would have to consider a backup plan.\n\n\"I-I'll talk...!\" the prisoner gasped. \"Please stop hitting me. I'll say anything, I beg you...\"\n\n\"Let him go.\" Agent Su dropped his cigarette and crushed it out with his heel. He pulled a pen and paper from his pocket and set them on the table.\n\n\"I want a list of your financiers and your accomplices. Write down the locations of every safehouse, and put your written confession on the back. If you try to play smart with us...\"\n\nSu shot a glance at his subordinate. The younger agent reached into a folder on the table and pulled out three black-and-white photographs."
 CHI.H2.431.a: "Look at your wife and daughter; this is the price of treason."
 CHI.H2.411.t: "A Day in the Life of a Student"
 CHI.H2.411.d: "Lei Dan is a student at an international high school in New Taipei City. On what seemed like an ordinary Monday morning, he arrived at the school gate with his breakfast fresh from the MRT station, only to find a crowd of students gathered around taking pictures. Pushing his way in, he saw that a line of English text had been added below the school's name. Upon entering the campus, he discovered that all the signs and street markers had become bilingual in Chinese and English; even the text on the water dispensers had been engraved bilingually. Lei Dan had just set his backpack down at his desk when the classmate next to him, Zhang Shuren, struck up a conversation: \"Everything in the school has gone bilingual. Didn't President Han just give a public speech about promoting bilingual education last month? The school sure reacted fast.\" Lei Dan replied, \"Yeah, I wonder if there are any other changes.\" He glanced sideways; a classmate known as \"Vlog Bro', who regularly posted videos on Bilibili and YouTube, was running around filming the new bilingual facilities. Just then, the homeroom teacher arrived early and walked into the classroom: \"I need two strong guys to go fetch the new textbooks.\" Lei Dan and Zhang Shuren exchanged a look, both jumping up first to follow the teacher out. Ten minutes later, the two returned to the classroom, each pushing a handcart. After placing the textbooks on the podium, Lei Dan shouted, \"Do you guys want to know what's special about the new textbooks?\" Everyone in the classroom looked at him. He then declared, \"We checked them on the way back. The books for every single subject are now bilingual in Chinese and English.\" A buzz of discussion erupted across the room.\n\nAt that moment, the teacher pushed the door open and entered. The two boys hurriedly stepped down from the podium and went out to return the handcarts. The teacher announced, \"Everyone, come up by your student numbers to receive your new textbooks.\" Opening their new books, the students saw that whether it was Chinese, Math, Biology, Physics, Chemistry, or Art, everything-save for classical Chinese texts that were practically impossible to translate-was now bilingual. The English textbooks, meanwhile, had become entirely English. The teacher clapped his hands. \"Alright, everyone put your books down for a moment. I'd like to introduce a new teacher. Mr. Alec, please come in.\" A Caucasian man walked through the doorway. Speaking in Chinese with a noticeable Australian accent, he said, \"Hello everyone, I am Alec Su from Australia, and I will be your English teacher from now on.\" The students broke into applause, welcoming their new foreign teacher.\n\nThe homeroom teacher clapped his hands again and addressed the class: \"Alright, alright, your new foreign teacher will officially start teaching you during the English period this afternoon. Now, onto something else. Summer vacation is coming up soon. Under the new policy, the Ministry of Education has organized an English summer camp. Anyone who wants to participate should discuss it with their parents today and come to my office to sign up after school tomorrow. Also, you are all high school sophomores now; you'll be seniors next year. The new policy offers subsidies and support for studying abroad in English-speaking countries. I'm going to hand out some flyers about the study abroad subsidies-take them home and show them to your parents.'\n\nAt noon, the nutritious school lunches arrived in the classroom. The students clustered together in small groups, eating while discussing the morning's new changes. Holding his phone, Zhang Shuren said, \"Looking at the Board of Education's plans, English classes are supposed to transition to entirely English instruction over the next few years. Thank goodness we started school early.\" Lei Dan replied, \"Yeah, I bet the few people in our class with bad English are probably stressing out right now.\" He took the opportunity to glance across the room; Vlog Bro was using his Canon camera to film the new textbooks, probably getting ready to post another video on Bilibili to rack up 100k views."
 CHI.H2.411.a: "\"Bridging the East and the West\""
 CHI.H2.161.t: "An End to Legalized Bribery"
 CHI.H2.161.d: "The Niao-An Wastewater Treatment Plant is a local enterprise that has operated in Tainan City for many years. They had been reported multiple times for discharging wastewater that failed to meet national standards. However, the results of every environmental investigation declared the claims to be sheer nonsense, affirming that Niao-An's treated wastewater fully complied with national discharge standards.\n\nInside a private club in Tainan, the plant manager and the largest shareholder of the Niao-An Wastewater Treatment Plant were wearing obsequious smiles as they toasted the local Deputy Mayor. The plant manager said, \"We are truly grateful for the efforts of you and the Director of the Environmental Protection Bureau during the last report. The investigations by the EPB and the Chemicals Administration were successfully passed. We are conscientious businessmen; we need upright officials like you to guarantee our safety.\" The Deputy Mayor raised his glass and replied, \"Of course, the local area needs outstanding enterprises like yours to provide citizens with a better life. I hope we can continue our pleasant cooperation after the election season next year.\" The major shareholder hurriedly chimed in, \"Naturally. A small token of our appreciation has already been handed to your secretary. It was all done through legal channels, and we hope it will aid your campaign. Let us continue to cooperate closely next year.\" The three men exchanged knowing smiles and continued their lively toasts.\n\n*Smack!* The door to the private room was suddenly kicked open. \"My, my, quite the lively gathering! Do you mind if I join in?\" The Deputy Mayor stood up and yelled angrily, \"Fuck your mother! Do you know where you are? Do you know who I am?! Barging in here like this-where is the club security? Throw this lunatic out immediately!\" The intruder chuckled and pulled out a badge. \"Special Investigation Division! I am Section Chief Hou Anqu of the Special Investigation Division!'\n\nChief Hou scanned the room, flashing a smile that sent a shiver down the spines of all three men. \"Oh my, I didn't expect you to throw your weight around like such a big official! I almost thought I was in the mainland for a second! My apologies for the disrespect. However, you are still in Tainan, so... please come take a seat at the Special Investigation Division with me. Regarding your acceptance of improper political donations and your assistance in helping illegal enterprises conceal their violations, we'd like to hear your defense. And these two must be from the Niao-An Treatment Plant, right? Perfect, saves me another trip. Boys, take all three of them away.'\n\nSix burly members of the Special Investigation Division immediately rushed out from behind Chief Hou, grabbing the three men and hauling them out of the private room. By this point, the three were so terrified they couldn't even stand on their own; they were entirely held up by the strength of the SID agents as they were dragged out of the club, their faces pale as ashes.\n\nChief Hou picked up a bottle of liquor from the table and inspected it briefly. \"Oho, quite the collection. Maotai from the mainland, premium red wine from France, high-grade sake from Japan, top-shelf whiskey from the UK. The alcohol on this table alone is worth half a year of my salary.'\n\nHe set the bottle down and walked out of the room, thinking to himself:"
 CHI.H2.161.a: "“Six down this week. Maybe tomorrow we can make it a perfect seven.”"
 CHI.H2.231.t: "Claim the Mantle of Legitimacy"
 CHI.H2.231.d: "As the situation evolves, the long-ridiculed dream of retaking the mainland and restoring the Republic is finally appearing on the horizon. With the provincial administrations of Taiwan, Fujian, and Hainan already resuming operations, the ROC government has moved to repeal the streamlining of the Taiwan Provincial Government outlined in the Fourth Constitutional Amendment. Once the legislature approves the repeal, authorities will rebuild provincial administrations nationwide alongside the Tibet local government, though plans for Mongolia remain temporarily shelved.\n\nAt a joint press conference, the Ministries of the Interior and Foreign Affairs announced an end to the suspension of provincial governments. These reactivated administrations will overhaul the election and appointment mechanisms for all levels of local government. Officials will also restore citizen household registration systems and build operational frameworks for every mainland province, ensuring these bodies can scale up rapidly to meet future demands.\n\nDuring the same briefing, the Foreign Ministry revived the Chiang Kai-shek-era doctrine that the ROC is the sole legitimate regime of China. The spokesperson declared Dr. Sun Yat-sen's Republic of China as the only orthodox government, acknowledging the Peiping regime's administrative authority over the mainland without recognizing any of its legal sovereignty.\n\nBeijing's Taiwan Affairs Office and Foreign Ministry reacted with fury, repeatedly condemning the announcement as a violation of their legal rights. Having been previously repelled by our forces, the PLA emerged from its barracks to resume military probes against Taiwan. Chinese forces once again crossed the median line to violate our airspace and territorial waters, and even proposed sanctions at the UN General Assembly that ultimately went ignored.\n\nFollowing legislative approval, the government initiated the reconstruction of provincial administrations. A floor in the newly reactivated Taiwan Provincial Government building was allocated to house the core staff for these mainland provinces. Their immediate task is to care for elderly veterans from their respective regions and resettle mainland refugees fleeing to the Free Area. In parallel, staff will gather regional intelligence to draft early takeover contingencies.\n\nThe provincial governments marked their official reactivation with a low-key ceremony. President Han attended the event, telling the staff, \"This isn't really a formal ceremony; we're just keeping it casual among ourselves. Once you all return to your respective provinces, we will hold a grand celebration.\""
 CHI.H2.231.a: "We are the true Chinese."
 CHI.H2.371.t: "OFFICIAL CORRESPONDENCE of the Geological Survey and Mining Management Agency"
 CHI.H2.371.d: "Address: No. 53, Sec. 1, Zhonghua Rd., Zhongzheng Dist., Taipei City 100005\nContact Person: Xu Ming-hong\nPhone: (02)23113001 Ext. 001\nFax: (02)23112663\nEmail: bom001@gsmma.gov.tw\n\nRecipient: President Han Kuo-yu\n\nDate of Issue: [Date], [Year] of the Republic of China\nDocument No.: Jing Di Diao Zi No. 114514\nSpeed Category: Most Urgent\nClassification and Declassification Conditions or Confidentiality Period: Top Secret (To be declassified on December 31, 2111)\nAttachments:\n\nSubject: Submission of the phase one results for the \"National Geological Resource Survey Project\" and an assessment of the potential for exploitable strategic minerals and oil/gas resources within the country, submitted for the President's review.\n\nDescription:\n\n1. In response to the restructuring of global supply chains, rising geopolitical risks, and national security needs, this Ministry-in accordance with the \"National Geological Resource Survey Project\" approved by the Executive Yuan-has utilized technologies such as high-resolution satellite remote sensing, airborne magnetic surveys, gravity measurements, 3D seismic exploration, AI geological modeling, and deep drilling to complete the phase one resource census of Taiwan proper and its surrounding waters.\n\n2. The results of this survey reveal that in the past, due to limitations in exploration technology and economic feasibility assessments, several ore bodies with development potential were not fully confirmed. Following re-modeling and analysis, we have now identified multiple mineral and energy reserve areas of strategic value.\n\n3. The Taoyuan region has confirmed..."
 CHI.H2.371.a: "\"Not bad, file it away.\""
 CHI.H2.331.t: "More Work, More Pay "
 CHI.H2.331.d: "The current salary system, which is mainly based on fixed pay grades, is often attacked as a 'legacy of the authoritarian era.' We admit that a system where seniority determines pay, along with the 18% preferential interest rate for military, public, and teaching personnel, is rigid and outdated, but it is still part of the agreement made when they were legally employed. Under the ideologies of 'it's not that the public sector gets too much, but the private sector gets too little' and 'generational fairness,' the previous Tsai administration implemented reforms to reduce the income replacement rate for retirees and gradually phase out the 18% preferential interest rate.\n\nHowever, President Han believes that the compensation for military, public, and teaching personnel is part of their legal employment contract. Arbitrarily changing it not only breaks existing promises and damages retirement rights but also destroys the trust between different classes built during democratization.\n\nYet, because the imbalance between private and public sector compensation is a real problem, and the previous DPP government has already done the unpopular work for the current administration, the current government only needs to make modifications based on those reforms. After careful study, President Han has decided to implement one of the personnel system reform proposals he made during his presidential campaign: 'Floating Compensation for Military, Public, and Teaching Personnel.' While maintaining the fixed base salary to guarantee their basic livelihood, a portion of their income will become floating. Bonuses will be determined by job performance, public satisfaction, task difficulty, and work results, rather than relying entirely on seniority as before. Those who perform well can earn more than before, instead of just watching older colleagues take home more money while sitting in an office.\n\nThe military sector will also consider the differences between combat and non-combat units, offering bonuses for serving on outer islands, high mountains, and ships, as well as for hazardous duty, professional certifications, training scores, retention rates, and professional capabilities. This ensures that true warriors receive tangible benefits, rather than generals sitting in high-rise buildings collecting high salaries.\n\nThese measures allow compensation to better reflect job risks and professional levels, rather than relying mainly on seniority. This will help attract and retain talent in the public sector and improve administrative efficiency."
 CHI.H2.331.a: "Labor brings reward."
 CHI.H2.321.t: "Bullseye"
 CHI.H2.321.d: "During his 2019 presidential campaign, Han Kuo-yu and his national policy advisory team proposed the \"Three Arrows of Labor.\" Feasibility concerns over funding and implementation, followed by the Communist invasion, prevented early action. Now, with the war won, decreased defense spending and rising economic growth have generated the fiscal surplus needed to finally make these promises a reality.\n\nThe First Arrow: Amending the Employment Insurance Act to cover unpaid leave. The system now compensates affected workers with 60 percent of their insured salary. For citizens like Wei Jie, a factory worker reduced to a two-days-on, five-days-off schedule after PLA missiles leveled his workplace, this is a lifeline. Receiving his first insurance payment, the 39-year-old sat on his roof with a convenience store beer late into the night.\n\nThe Second Arrow: Matching pension contributions for low-wage youth. Previously, 93 percent of workers opted out of voluntary contributions. President Han introduced a direct \"Matching Reward\" program with a simple slogan: \"You save, we match.\" A-Liang, a recent university graduate scraping by on 34,000 NTD a month, could barely save anything after basic living expenses. Prompted by the new policy, he bit the bullet and opted for a 2 percent contribution. Knowing his 680-dollar deduction instantly becomes 1,360 dollars in his account gave him an unexpected sense of security.\n\nThe Third Arrow: A 100-billion NTD injection into the Labor Insurance Fund. The fund had long operated at a deficit, leaving citizens terrified their pensions would dry up. Han originally promised to inject 100 billion over two years. The war forced a delay, but the postwar recovery has finally provided the capital to fulfill this pledge. The government will allocate 33.3 billion NTD annually over three years, securing the financial future of retirees and sparking widespread celebration across the country."
 CHI.H2.321.a: "Prosperity for Every Taiwanese!"
 CHI.H3.11.t: "Root Out the Hidden Threat"
 CHI.H3.11.d: "Inside the Legislative Yuan, one hundred legislators stared intently at the voting results displayed across the great screen. Amid a sea of emerald green, a handful of glaring roses stood out like thorns. Ninety members had voted in favor of the constitutional amendment. Ten had voted against it. Fen Cai-en was one of them. Biting down on her lower lip, she rose with the others and applauded. The deafening ovation slowly drained what little courage remained within her. Was this what she had become a legislator for, to stand here and sing praises of President Han's greatness? Cai-en tried to reassure herself. Even if the amendment had passed the legislature, there was still the referendum threshold. But after four years of relentless propaganda and uninterrupted rule, could that threshold truly withstand the tide of public opinion now surging toward it?\n\n“Legislator Fen, President Han would like to see you...” Cai-en nearly leapt from her seat. Turning around, she found that her aide had somehow slipped silently to her side without her noticing. Feigning composure, she glanced at her watch. It was almost time for Xiaoqi to come home. She could always invent another excuse and refuse the meeting, but what would that accomplish? The Legislative Yuan had already been reduced to little more than an appendage of the president and the executive branch. Whatever hope remained of setting things right from within the system was fading fast. Sooner or later, she and the handful of politicians still stubbornly resisting would all face their reckoning. Perhaps today would be her last opportunity to meet Han Kuo-yu as a sitting legislator. Perhaps, if she chose her words carefully enough, she might still persuade the president to turn back.\n\nCai-en allowed her aide to lead the way. Parked outside the Legislative Yuan was an unusually conspicuous black sedan. Several bodyguards stood around it, and one stepped forward to open the door for her. Han Kuo-yu was already seated in the back. Uneasily, Cai-en slid into the seat beside the president. The interior was unnaturally cold. Even dressed in a full suit, she could not suppress a shiver.\n\n“Legislator Fen, I understand that you hold certain... unique views. Nor do I expect you to understand the decisions I am making now.” Han Kuo-yu spoke slowly and gravely, his eyes fixed upon the streams of traffic racing past the window.\n\n“President Han, I still hope you will take a few more days to reconsider. Democracy has long since taken root in the heart of every Taiwanese citizen. No one who has tried to cross that line has ever emerged unscathed. Abolishing presidential term limits would be no different from dictatorship. The people will never simply stand by and accept such a regression...” Cai-en cautiously invoked public opinion. Populist leaders were so often raised up by the people and brought down by those very same people. Perhaps President Han had merely allowed temporary victory to cloud his judgment?\n\nBefore she realized it, the car had come to a stop. Legislator Fen glanced through the window, and the sight before her left her utterly speechless. Outside the entrance to the kindergarten stood an unfamiliar man in casual clothes, one arm protectively close to Xiaoqi. The instant he saw their car pull up, he took the little girl by the hand and led her toward it."
 CHI.H3.11.a: "“Need a Ride Home?\""
 CHI.H3.111.t: "Air-Raid Shelter"
 CHI.H3.111.d: "The muggy air inside the cave had Wang Gangyin sweating profusely. Holding a clipboard, he leaned against the wall, scribbling and making corrections. The dim lights on the wall provided the only illumination in the entire cave-aside from the headlights of a truck. He adjusted his position, trying to prevent his shadow from covering the manifest while making sure the beads of sweat on his forehead didn't drip onto the paper. The engineers were still trying to get the ventilation system running, but equipment from the 1980s didn't have the best temper; they would fix it, only for it to break again. However, the transfer of supplies couldn't be delayed, so everyone just had to do their weightlifting in this sauna.\n\n\"This is all of it,\" one of the logistics officers said, walking toward him and pointing at the heavy truck slowly driving down the ramp. The smell of diesel mixed with the sweat of dozens of men made the air feel stagnant. Gangyin wiped his nose, trying to acclimate to the suffocating atmosphere.\n\n\"Excellent.\" Gangyin flipped to the last page of the manifest and checked off the final few blank boxes. Bullets, firearms, military rations... He had no idea why his superiors were cramming so much stuff into such a small air raid shelter. Setting aside the question of how many troops these supplies could sustain and for how long, he wasn't even sure if the dry rations inside hadn't been sitting there for decades.\n\nThere were dozens of air raid shelters just like this one! Some had been newly built at relocated sites after the war, while others were refurbished underground and mountain bunkers. The smaller ones were simply stuffed with basic light weapons and food supplies. Perhaps a few barrels of diesel would be left in the corner-not nearly enough to refuel a tank, but more than enough to power a generator.\n\n\"That should be everything, right? Your trucks look empty...\" Wang Gangyin asked curiously.\n\n\"I advise you not to ask too many questions. This is classified,\" the logistics officer replied coldly. Before Wang Gangyin could even salute, the officer turned on his heel, boarded a truck, and quickly drove away. He left behind a sweating Wang Gangyin and the other curious soldiers. Gangyin looked at the crates that had just been unloaded. Stamped on the side was a label indicating what was supposed to be inside: Ten T65 assault rifles."
 CHI.H3.111.a: "You’re better off not knowing what’s inside..."
 CHI.H3.21.t: "Operation: Mandate of Justice"
 CHI.H3.21.d: "Inside the dimly lit combat information center, everyone was staring intently at the small LCD screens in front of them. The captain and executive officer scanned the sailors in the cramped room back and forth. The flashing red warning lights reflected on Chen Chien-jen's screen, and the enemy markers on the radar occasionally blended into the flashing lights. His eyes ached terribly, but he didn't dare drop his guard at a time like this.\n\nFive seconds to impact! Four... three... two... one.\n\n\"Target hit! Our missile successfully hit the enemy target!\" Chen Chien-jen reported the combat result loudly. His peers in the fire control team breathed a sigh of relief. The captain and everyone in the combat center applauded together, celebrating the successful live-fire drill of the PDTO multinational joint exercise and the successful combat test of the Hsiung Feng IV missile.\n\nOf course, holding such a large-scale exercise in the East China Sea could not avoid provoking strong reactions from the Chinese Communist Party. Expressing \"tough\" diplomatic stances through various channels was just an appetizer; the real trouble was the omnipresent harassment at the borders of the exercise zone. AWACS planes in the sky, spy ships on the sea surface, and submarines underwater frequently \"mistakenly entered\" the exercise area. To maintain order, the multinational fleet formed by Japan, Australia, India, and Taiwan regularly patrolled the borders of the exercise zone to ensure the smooth progress of the military drills.\n\nIn the early hours of the previous week, Chen Chien-jen and his crew had just driven away a Chinese Ro-Ro ship that intentionally strayed into the western side of the exercise zone. On the radar, a fleet of several PLA fighter jets patrolled continuously outside the zone. The captain ordered the entire ship to maintain combat readiness at the request of the joint command. It wasn't until several hours later, when friendly fighter jets arrived, that Chen Chien-jen and the others could return to their bunks to rest—and this scenario would repeat itself dozens of times over the remaining seven days of the exercise.\n\nFortunately, the directorate had just announced the official end of the exercise. These grassroots sailors could finally return to port in Taiwan and enjoy a hot meal! The high command of the PDTO navy would also need some time to discuss the various issues discovered during the entire exercise. Chen Chien-jen stretched his back; at least they would have one or two weeks of leave. After returning, they would undergo targeted training and reinforcement based on the issues found."
 CHI.H3.21.a: "Four Nations, One Heart; Together, We Can Cleave Gold."
 CHI.H4.1.t: "Victory in Great Asian War"
 CHI.H4.1.d: "The flames of the Great Asian War swept across the nations of East Asia, forcing civilians and everything they possessed to become fuel for the ambitions of men reaching toward distant horizons. Amid seemingly endless war, lives were reduced to yet another row of figures on casualty reports. Whatever ideals had once been invoked to set the Asia-Pacific ablaze, all of it is over now. The great ship that promised steady progress was ultimately torn apart by the wolves of the sea; the dream that intelligent agents might unite mankind was shattered beyond repair; and the storms raging across the Pacific finally extinguished the fires of vengeance. China's last defeat in Taiwan had already proven to the Communist leadership the resilience of Taiwan and the nations of East Asia. Then, the People's Liberation Army had still been able to withdraw from Taiwan with some measure of dignity and turn inward to confront the chaos consuming the mainland. This time, there would be no such consolation. This defeat has shattered the ambitions of the People's Republic of China once and for all. Whatever Beijing may have hoped to achieve, it has learned the final truth: it is no match for the Pacific alliance.\n\nFor Taiwan, however, today's victory carries another meaning entirely. After decades of democratization and localization, the word “Recovery” had come to sound antiquated, burdened by memories of martial law and an age that seemed increasingly distant. The enormous gulf in industrial and military power had long forced the old veterans who retreated to Taiwan to make their peace with an island they had once neither understood nor ever expected to call home. Yet when news of the Chinese Communist surrender spread across Taiwan, the entire island erupted. It was not merely because the Sword of Damocles that had hung above them for generations had finally shattered upon the ground. For the first time in the history of the Republic of China on Taiwan, its people had finally tasted what “Recovery” truly meant.\n\nFrom this day forward, Taiwan will no longer need a Silicon Shield. It will no longer need bargaining chips. It will no longer need to survive by watching the expressions of greater powers and guessing what they might permit. Our strength speaks for itself. Our place in the world no longer requires justification. At long last, we have truly won the right to determine our own destiny. For now, let the people celebrate. Reconstruction can wait until tomorrow. As for where we go from here..."
 CHI.H4.1.a: "Victory Is Ours!"
 CHI.H4.2.t: "The Second Northern Expedition"
 CHI.H4.2.d: "In the past, the National Revolutionary Army marched west against Lu Rongting, east against Chen Jiongming, and north against Sun Chuanfang and Zhang Zongchang, finally declaring the end of the Warlord Era when Zhang Xueliang announced the Northeast Flag Replacement. No one expected that many years later, the army of the Nationalist government would once again launch a war of unification from its starting point in Guangzhou. Following the total collapse of Communist China, various local strongmen across the mainland seized the opportunity to declare independence. Surviving PLA generals gathered local remnants to carve out their own fiefdoms, and there were even remaining CCP members in Beijing who, taking advantage of the PDTO withdrawal, claimed that New China had not yet fallen. All of this is the result of the Republic of China's inability to rapidly reclaim the entire mainland. We will step by step take back everything we have lost, sweeping the shadow of dictatorial tyranny into the garbage bin of history!"
 CHI.H4.2.a: "The Revolution Remains Unfinished so We Must Press On."
 CHI.H4.3.t: "Cadre Training"
 CHI.H4.3.d: "District Executive Liu Chunqiao stared blankly at the rapidly flashing slides before him. Rationality told him it was best to jot down some key points in his notebook, but his right hand simply couldn't pull out the ballpoint pen clenched in his mouth. He raised his cup to take a sip of water, trying to ease his anxiety. The classroom was uncharacteristically silent. The lecturer on stage was speaking endlessly about the fundamental principles of the Constitution of the Republic of China and its legislative basis, and not a single colleague beside him was slacking off.\n\nHe drained the last drop of water from his cup and pretended to copy down the key points of one of the slides. Even when he took the civil service exams over ten years ago, he had never been this serious and solemn. This felt entirely different from writing essays or compiling bureaucratic articles. Perhaps their batch of cadres required special attention? Sent to Taiwan-or rather, the \"Free Area of the Republic of China'-in a state of half-detention and half-freedom, they were undergoing a new style of bureaucratic training. During this period, all food, clothing, housing, and transportation were covered by the ROC government, but they were only allowed to move freely within designated areas. If they wanted to visit other counties or cities, they had to report their full itinerary beforehand. If they failed to return on time, they would face imprisonment and... lifetime deprivation of civil rights.\n\nThe clock on the projector screen ticked away. Next week was midterm week. This group of civil servants, nearly fifty years old with kids already in college, had to adhere to a university-style schedule just like their children. The only difference was that there were no clubs and no nightlife-only the options of grinding for credits and semester grades. Fortunately, they occasionally had the chance to go down to the grassroots level and study their specific workflows. Chunqiao still remembered interning at a district office with a colleague he usually disliked. That colleague had treated the public with either total indifference or bureaucratic runarounds. A few days after the higher-ups received a public complaint, that colleague was transferred away-reportedly stripped of his public office and sent back to the mainland. He wondered which was better: being trapped on this tiny island for ten weeks of training, or being sent straight home to farm?\n\nThe dismissal bell chimed right on cue, echoing through the classroom. Chunqiao put away his notebook and followed his thirty or forty classmates as they filed out. After lunch, he still had an Administrative Law class to attend. Walking down the lush, tree-lined avenue under a cloudless sky, he wondered how his elderly mother back in Guangdong was doing. With the situation on the mainland currently a total mess, he could only hope that the letter and dry rations he sent a few days earlier would reach her safely..."
 CHI.H4.3.a: "\"I should probably grab some food first.\""
 CHI.H4.4.t: "A Long Road Ahead"
 CHI.H4.4.d: "\"Why can't I use my own seal when stamping? How will anyone know I was the one who voted?!\" a grandfather in his sixties raised his hand and asked. Below the stage, a crowd of equally elderly grandpas and grandmas chimed in, chattering in a chaotic discussion. On stage, Liu Chuanyu gestured for everyone to calm down. Hosting democratic voting seminars for three consecutive days had left him and his colleagues exhausted. While he understood why these mainland immigrants were confused by the electoral process of Western direct democracy, if explaining how to vote to these few dozen elders was this difficult, he couldn't imagine the chaotic scenes that would unfold when universal suffrage was reinstated across the mainland.\n\n\"When voting, there will be a seal provided in the voting booth by the Election Commission...\" Chuanyu clicked a few slides back on the presentation. \"Take the seal and stamp it in the designated box for your chosen candidate. If you do not stamp inside the box as shown, or if you use a seal not provided by the Commission, sign your name, or make any other marks, the ballot is immediately invalidated. Similarly, openly revealing your ballot inside the voting booth violates the rules and will also invalidate it.\" The moment he finished speaking, the audience grew even more restless, with more and more people raising their hands to voice their opinions. Chuanyu sighed softly; it looked like these seminars would have to continue for a few more days...\n\nMeanwhile, on the other side of things, multiple officials from the Ministry of Education were also stressing over elections. Only they were facing elementary, middle, and high school students. These ambitious youths would become the crucial backbone of the future Republic of China, and ensuring they understood and actively participated in its political operations was the long-term goal. But at this stage, relying solely on textbooks for \"political tutelage\" would likely take over a decade to show any initial results. The best approach was to send teachers or specialists directly into schools to replace the old classroom hierarchy with Taiwan's system. All political ideology classes were replaced with civics classes, and students were given time to elect their own class presidents, vice presidents, sanitation officers, and other roles. Though doing this wouldn't necessarily instantly turn the students into qualified citizens of a democratic society."
 CHI.H4.4.a: "One step at a time..."
 CHI.H4.5.t: "The End of the Journey"
 CHI.H4.5.d: "As the smoke of war cleared across the deserts, plateaus, and grasslands, the Republic of China had seized all territories previously controlled by the Chinese Communist Party, restoring our nation's control and governance over the sovereign territories defined in the Constitution.\n\nAcross China today, reconstruction efforts and democratic training have already begun. Local government institutions are gradually restoring their functions, and the police and military have maintained order exceptionally well. We can finally announce to the world that the Republic of China has reclaimed the motherland and gained a new lease on life.\n\nPresident Han has announced that government ministries will return to the statutory capital, Nanjing. On the day of the relocation, a grand celebration and military parade will be held. He will personally lead officials from various departments to the Sun Yat-sen Mausoleum on Purple Mountain to pay their respects to the Founding Father, to General Cai E, and to the two Presidents Chiang, offering solace to the countless individuals throughout history who died for the Republic of China, for China's democracy and freedom, and for resisting tyranny. Concurrently, following the last wishes of the late President Chiang Kai-shek, the coffins of the Chiang father and son will be moved from Cihu and reinterred at Purple Mountain.\n\nSince Dr. Sun Yat-sen took office as the Provisional President of the Republic of China in Nanjing in 1912, the Republic has endured Yuan Shikai's chaotic rule, the infighting of the Beiyang warlords, the Nanjing-Wuhan split, the Japanese invasion, the CCP's seizure of the mainland, the retreat to Taiwan, and Taiwan's democratization. After all this, it has finally returned to Nanjing.\n\nAfter countless periods of chaos and dictatorship across the Chinese land, the Chinese people can finally hold their heads high with pride and declare themselves to be free individuals enjoying the Three Principles of the People: Nationalism, Democracy, and the People's Livelihood."
 CHI.H4.5.a: "The long road home."
 CHI.H4.6.t: "Democracy 101"
 CHI.H4.6.d: "Following the Republic of China's return to the mainland, the greatest challenge lies in how to integrate 1.37 billion people into a democratic society. If the mainland people are allowed to vote without first learning about democracy, the result will only be a spectacle of bread and circuses. They do not understand what a ballot represents; they do not know it is their weapon. If they willingly surrender their votes to the wealthy and politicians for petty favors, our elections will devolve into something akin to ancient Rome-riddled with widespread vote-buying and utter corruption. Therefore, democratic training for the mainland populace must come first.\n\nHowever, Taiwan's democratic training was an ongoing process spanning decades; even during the martial law period, grassroots democracy was maintained, and the people's understanding of democracy progressed steadily, whether fast or slow. The mainland, on the other hand, not only has an enormous population, but due to the Communist Party's dictatorial rule, only the citizens of a few ultra-tier-1 cities like Shanghai, Shenzhen, and Guangzhou possess a basic understanding of democracy. This means we cannot cultivate the people's democratic consciousness using the same methods we did in Taiwan. It would require a massive amount of time, manpower, and resources; the immense financial burden would drag the nation down before political tutelage could even be completed. More importantly, we simply do not have that much time.\n\nFortunately, even the CCP did not dare publicly declare democracy a bad thing, resorting instead to dressing up their rule as \"democratic centralism.\" This ensures our work does not start entirely from scratch. Furthermore, the people of three regions in China-Taiwan, Hong Kong, and Macau-possess actual democratic experience. Using the people of these three regions as guides, we will employ all means necessary, even including some coercive measures, to forcefully and rapidly instill democratic experience into the minds of the mainland people. We do not ask for them to possess a stellar democratic consciousness; having basic democratic literacy is enough. At the very least, they must not sell their votes for a few hundred dollars."
 CHI.H4.6.a: "For now, just cram it in."
 CHI.H4.7.t: "Midnight Express"
 CHI.H4.7.d: "It was a pitch-black night, with only a few flickering streetlights along the road accompanying travelers home. Han Kuo-yu sat inside a stretched black limousine. Feeling drowsy, he habitually loosened his tie. He and his presidential motorcade had just driven non-stop southward along the highway from Beijing, passing through Shanghai, Nanjing, Guangzhou, and Fujian... The Republic of China had finally achieved reunification, and this president from Taiwan was now under the scrutiny of billions of eyes, all expecting him to bring the Chinese people their long-awaited restoration.\n\n\"Mr. President, why don't you rest for a while? I brought you some sleeping pills...\" The bodyguard sitting across from him smoothly pulled a pillbox from his pocket; only two pills remained in the silver packaging. Han Kuo-yu took the box. For the past few days, he had been traveling non-stop between major cities to inspect reconstruction progress. With Han's stamina, maintaining his man-of-the-people image in Taiwan was something he could barely manage. But having to shake hands with thousands of people, pose for photos, and host seminars every day... even if his mind could handle it, his body-having long passed seventy years of age-simply could not hold up.\n\nPresident Han tossed the sleeping pills onto the seat beside him. He was too tired. In the past, he never could have imagined he would reach this point-from governing a tiny island to ruling the entire begonia-shaped leaf of China. The people loved him, supported him, and recognized him as the irreplaceable President of the Republic of China. It was their trust in \"Director Han\" that had supported him every step of the way to this very moment.\n\nGazing at the endlessly changing streetlights outside the window... Han Kuo-yu knew in his heart that the public's passion for \"Director Han\" would eventually fade. Next time, and the time after that, and the time after that, more and more people would imitate his style in campaigns. They would be younger, more attractive, and President Han would not be able to beat them. He had once considered grooming a successor, but was that really the legacy Director Han wanted to leave for the Republic of China?\n\nPeople cycled endlessly through passions. If there were no longer a powerful external enemy, would the Chinese people once again turn their guns on their compatriots?"
 CHI.H4.7.a: "May China be finally Free!"
 CHI.H4.91.t: "The Mongolian Question"
 CHI.H4.91.d: "The endless grasslands sped past the window. Horses of various colors lived carefree on the sparsely populated wilderness; some running, some playing, though most chose to lie down and rest. Occasionally, a herdsman or two would drive a flock of sheep along, as if riding upon a fluffy cloud.\n\nChen Qiusheng closed his leather notebook. He had recorded enough of his observations for the day. He thumped his stiff back-a lingering ailment from his youth spent running all over the world carrying bags for his boss. Now, he was the boss, but he didn't feel much more relaxed. The original itinerary had them taking off from Taoyuan Airport, laying over at Beijing Capital Airport, and flying directly to Chinggis Khaan International Airport. However, after discussions between the President and his staff, it was decided that the situation in China was still unstable, and border security had yet to be properly resolved. Therefore, a last-minute decision was made: land in Beijing and transfer to a diplomatic train heading to the Mongolian capital. But since the Mongolian side had failed to respond to any inquiries since agreeing to the diplomatic talks, and had denied entry for the ROC train, Chen Qiusheng's diplomatic delegation had to disembark in Hohhot and switch to a motorcade to reach Ulaanbaatar.\n\nTwelve hours had passed, and Chen Qiusheng had spent them either reviewing the negotiation terms or writing notes. The latter helped greatly to soothe his anxiety and chronic insomnia, but eventually, the ugly duckling had to face the swans. He tightly gripped the hundred-plus-page submission treaty in his hands. Covering everything from sovereignty and territory to transportation, postal services, education, and the economy, the treaty contained no provisions for a special administrative region or autonomous ethnic zone; rather, it dictated a total merger into the central system of the Republic of China. Would they really accept a treaty that, in modern terms, was tantamount to treason?\n\n\"Boss, we're almost there,\" an assistant said, patting his shoulder and pointing at a Mongolian-language road sign in the distance.\n\n\"Has the Mongolian side contacted us yet?\" Chen Qiusheng placed a copy of the treaty into his briefcase and looked at the vehicles ahead. A total of six SUVs carrying bodyguards escorted the convoy. The car Boss Chen rode in was a Hongqi sedan, supposedly a favorite among mainland officials during peacetime. The back seat was indeed spacious, but even stretching his legs comfortably couldn't ease his anxiety. He was here on a mission, carrying the future dreams of the Republic of China on his shoulders. For Mongolia, however, this was a gamble they were almost guaranteed to lose. If they decided to fight to the bitter end, these bodyguards alone wouldn't be able to stop an attack by regular armed forces...\n\nThe convoy stopped at an intersection. The commanding officer on duty approached to greet the driver, pointing at the fierce Tiger armored vehicles flanking the road. The interpreters and diplomats explained that the soldiers were stationed there by order of the Mongolian government-an escort detail tasked with 'safeguarding' the delegation's entry into Ulaanbaatar."
 CHI.H4.91.a: "Hopefully this can be resolved peacefully!"
 CHI.H4.92.t: "Five Peoples, One Republic, None to Be Forsaken!"
 CHI.H4.92.d: "The convoy followed the lead military vehicle into Ulaanbaatar. Honestly, Chen Qiusheng originally assumed the Mongolian capital would only have a few high-rise buildings, with the rest being single-story houses or yurts. Its level of prosperity was probably on par with Taipei and New Taipei from ten years ago. Right now, they were speeding down the highway, over a dozen SUVs and military vehicles majestically entering the city center. Traffic police were stationed along the route, regulating on-ramps and intersections. The ride was incredibly smooth; even though the speedometer had climbed past 100 kilometers per hour, there was no noticeable shaking. Boss Chen genuinely admired the CCP's standard of infrastructure. The men deciding the fate of China and Mongolia were tearing down a highway built by the CCP...\n\nIt wasn't long before they arrived at their accommodation for the night: the Ulaanbaatar Hotel. The accompanying military vehicles stopped outside the main gate, only leaving after the entire diplomatic convoy had driven into the hotel's driveway. The convoy halted. The bodyguards in the front and rear vehicles disembarked first, only opening the doors for the delegation to step out after securing the area. Chen Qiusheng gulped slightly. A red carpet, protocol officers, and media from China, Mongolia, and Russia crowded the surroundings, kept separated along the sides of the red carpet by a velvet rope. They were surprisingly restrained; the only sounds were the endless flashes and camera shutters. Chen Qiusheng nodded to the media on both sides and walked briskly into the state guesthouse lobby. The Mongolian Foreign Minister was waiting inside.\n\n\"My dearest friend!\" The Foreign Minister opened his arms and embraced Chen Qiusheng. The latter was momentarily startled by the sudden enthusiasm but quickly returned the hug. Guided by protocol officers, both sides, along with their respective delegations, entered the conference room. Chen Qiusheng and the Mongolian Foreign Minister took their seats. The former produced a copy of the agreement stamped with Traditional Chinese and the official seal, while the latter instructed his assistant to present the Mongolian version. The final, minor details would be ironed out here-though the major issues requiring negotiation had already reached a consensus. Tonight's meeting was merely to confirm some details and check for typos.\n\nThe next morning, Chen Qiusheng took a special car to Sükhbaatar Square. The roads on both sides were packed with enthusiastic crowds, holding the flags of the Republic of China and Mongolia high. Signs written in both Chinese and Mongolian read \"Long Live Sino-Mongolian Friendship!\" Even the square in front of the Presidential Palace was overflowing with people. Almost the entire capital's police force had been deployed to maintain order, with traffic police working hard to clear a path so Chen Qiusheng's convoy could reach the palace as quickly as possible.\n\nAt 11:12 AM today, Chen Qiusheng and the Mongolian President signed the diplomatic documents in front of the world. In reality, Mongolia had already become a part of the Republic of China. However, due to the current instability on the mainland, Chinese representative Chen Qiusheng signed the documents for now. Once [CHI.GetLeader]'s government affairs have settled down, a formal ceremony will be held by the leaders of both sides to complete the legal handover."
 CHI.H4.92.a: "The Begonia Is Whole Once More."
 CHI.H4.93.t: "The Descendants of Genghis Khan Will Never Bow！"
 CHI.H4.93.d: "The convoy followed the military vehicle ahead towards Ulaanbaatar. The lead car exited the highway and entered the urban district. Over a dozen SUVs advanced slowly through the capital's congested streets. The vehicles stopped at an intersection to wait for the red light. The flow of cars quickly passed, and pedestrians hurried across the intersection, most with their heads down. Occasionally, a few would look up at the convoy, only scurrying away after receiving a stern rebuke from a rolled-down window in the lead car.\n\nThe convoy continued toward its destination, but they were getting further and further away from the Presidential Palace and the state guesthouse. A sliver of unease began to rise in Chen Qiusheng's heart, stomach acid churning within him. He asked his assistant to hand him his water bottle. After taking a few sips, Chen Qiusheng caught a glimpse of the situation outside from the corner of his eye. The crowd on the streets was growing larger. They shouted angrily at the convoy, attempting to break through the military and police cordon. The police, armed with riot shields, struggled to control the furious mob. As the convoy pushed forward, the situation only worsened. The sounds of shoving and insults penetrated the glass into the car, though no one could clearly make out what they were saying. Chen Qiusheng glanced at the accompanying interpreter, who remained silent.\n\nIt took more than ten minutes to push through layers of obstacles before finally arriving at their destination. Tonight's negotiation venue had been chosen to be a military base. The angry mob outside had already blocked the camp's main gate completely. Sentries worked alongside the police to control the crowd, their hands gripping their rifles tightly. The car stopped, and Chen Qiusheng quickly hopped out. His instincts told him that the longer he stayed here, the more dangerous it would be. A soldier led him deep into the camp, with the delegation hurriedly following behind their boss. A military green tent, two iron tables, ten folding chairs, and a few Mongolian representatives-was this where they were supposed to discuss matters of state tonight?\n\n\"Hello, I am Chen Qiusheng, the representative of the Republic of China's delegation.\" He shook the Mongolian representative's hand, expertly sporting a polite smile. The noise outside grew louder. Chen Qiusheng pulled out a folding chair and sat down, intending to begin detailing the terms of the treaty as soon as possible. But the two sides had only spoken for a little over ten minutes when several heavily armed bodyguards burst into the conference room, gasping for air.\n\n\"What's wrong? What happened?\" Chen Qiusheng asked, standing up from his seat, though he already knew the answer in his heart...\n\n\"Boss, the situation outside is completely out of control! We need to leave immedi-\" Before the sentence could be finished, a brick smashed through the tent and landed on the table. The angry roars of the mob drowned out everything else. Discarding all diplomatic etiquette, Chen Qiusheng grabbed his briefcase and bolted from the conference room. The bodyguards behind him escorted the delegation as they sprinted toward the convoy, hoping to escape Ulaanbaatar before the situation spiraled into total chaos.\n\nBut it was too late. The moment they closed the car doors, they were besieged by the rioters. Wooden clubs and iron pipes smashed furiously against the windows as the mob surrounded Chen Qiusheng's car. The driver attempted to slam the gas pedal and break through the encirclement but was repeatedly blocked by the rioters. Watching the car windows shatter into spiderweb patterns, Chen Qiusheng glanced at the nearby Mongolian soldiers, hoping they would help break the siege. But they appeared entirely unmoved, simply allowing the rioters to attack the delegation's car..."
 CHI.H4.93.a: "So, the spirit of Genghis Khan still refuses to kneel."
 CHI.H4.94.t: "Should We Agree to Reunification?"
 CHI.H4.94.d: "Aaaah, baby, you’re a traitor, a spy, a great warlord, an anti-Party element, an ambitious schemer, a capitalist roader, a capitulationist, a revisionist, a vicious tyrant, a black-line figure, a counterrevolutionary, a black scholar, a black hand, an accomplice of the black gang, an empiricist, a democrat, a champion of the middle way, and a political chameleon!"
 CHI.H4.94.a: "Meow? (Agree to merger)"
 CHI.H4.94.b: "Hah!! (Disagree to merger)"
 CHI.201.t: "Once More, the Republic of China Sets Foot on the Mainland."
 CHI.201.d: "The Presidential Palace in Nanjing held a global press conference today, announcing that following the unconditional surrender of the final warlord faction on the Chinese mainland, the protracted civil war has officially come to an end.\n\nFollowing the conclusion of the \"Great Asian War,\" the original political order on the mainland collapsed, with various armed factions carving out territories one after another. The ROC government subsequently launched the \"Second North Expedition War\" from bases such as Guangdong. With military and logistical support provided by allies in the Pacific Defense Treaty Organization, they systematically defeated the warlords across the regions, ultimately regaining control over the primary areas of the Chinese mainland.\n\nAnalysts point out that the Republic of China's transformation from its pyrrhic victory in the 2023 Taiwan Strait War to its current position as the dominant power across the strait represents a monumental shift. The Nanjing government's reestablishment of control over the mainland will have a profound impact on the security landscape of East Asia and the future international order."
 CHI.201.a: "Merit is the glory of an hour; steadfast virtue is the work of eternity."
 CHI.201.b: "The East Asian Dragon Rises Again"
 CHI.202.t: "Tibet Returns to the Central Realm"
 CHI.202.d: "Honestly, Chen Haoren never imagined that his talents would be showcased here. Holding his rifle and carrying a dark green backpack, he patrolled along the ridgeline. His patrol partner was a young man in his twenties who, despite having only left camp ten minutes ago, was already gasping for air. The kid's stamina couldn't even compare to forty-something-year-old Old Chen. Fortunately, their backpacks held military-issued compressed oxygen tanks, providing a 60-minute supply for two during each patrol.\n\nChen Haoren led his companion to a relatively flat area to rest. After taking off his backpack, he pulled out two oxygen bottles, giving one to the young man and keeping the other for himself. Chen Haoren took just a few quick breaths before putting the bottle away. Having grown up in a tribal village, he was well-accustomed to extreme high-altitude, low-oxygen environments. His performance in high-intensity activities like physical training, weight-bearing marches, and combat drills far exceeded that of his peers, though he still had to re-acclimate to the plateau environment during their training in Sichuan.\n\nHaoren gazed into the distance toward downtown Lhasa. The Potala Palace still stood tall in the distance. The ROC armed forces and the Indian military had fired tens of thousands of artillery shells fighting over this strategic location. Today's Lhasa had long lost its original tranquility and peace, replaced by cries and blood, with various historic monuments utterly destroyed in the fierce combat.\n\nHowever, the good news was that the government had already reached a settlement with India, agreeing to withdraw from the Tibet region and return South Tibet and all other disputed territories. When this news broke, the joy of most soldiers was palpable, celebrating Tibet's return to the Republic of China!\n\nFor Chen Haoren, the feeling was more of relief. After all, being stationed three thousand kilometers away from his hometown for three months in Tibet was anything but easy. Indian border troops would still occasionally cross the border to infiltrate, and if you didn't stay on extremely high alert, the next one to die would definitely be you. Fortunately, today was their final day.\n\nChen Haoren and his partner finished the remainder of their patrol route. That evening, they gathered with their entire brigade at the Lhasa railway station to relieve other units. Following the sea of green uniforms, Chen Haoren boarded the train in an orderly fashion. Next, they would endure a grueling 30-plus-hour train ride to Chengdu, where they would finally transfer to a C-130 at a military airport and return to Taiwan to enjoy their well-deserved leave."
 CHI.202.a: "Territory has no price tag; hard-seat direct to Lhasa!"
 CHI.H4.100.t: "China and the Republic of China"
 CHI.H4.100.d: "Some say that China's modern history is a history of suffering for the Chinese people.\n\nIn 1840, the Opium War forced open the Qing Dynasty's long-closed ports, initiating a tragic history of Western powers colonizing the Chinese people. The Qing court lost massive amounts of territory in countless wars and treaties, while foreign capitalists mercilessly bled and plundered the interests that rightly belonged to the Chinese.\n\nOn New Year's Day, 1912, Dr. Sun Yat-sen was sworn in as the Provisional President in Nanjing, formally establishing the Republic of China. Puyi issued the edict of abdication on February 12th, successfully transitioning China from the old imperial era to a republican government. Yet, the republican system was fraught with loopholes, and Yuan Shikai and the Beiyang warlords fought bitterly for power. China in the early Republic bore not a shred of democracy; there was only the blood of revolutionaries and displaced refugees.\n\nAt this time, China was like a porcelain vase shattered on the ground, fractured and divided.\n\nOn December 29, 1928, the Northeast Flag Replacement occurred. The Republic of China finally achieved the great cause of unification, although this unification was largely formal. Factions within the Kuomintang fought amongst themselves, the CCP lurked and roamed, waiting for opportunities, and living conditions were abysmal. Yet for the Nanjing government, accomplishing these feats was already a significant leap forward. But Japan glared covetously at the Northeast, desiring to incorporate it-and indeed all of China-into their so-called \"Greater East Asia Co-Prosperity Sphere.\" History granted the Chinese people barely a decade to catch their breath...\n\nOn August 15, 1945, Japan announced its unconditional surrender, marking a pyrrhic victory in the eight-year War of Resistance. Thirty-five million Chinese soldiers and civilians built a red Great Wall of flesh and blood to block militarism. The Kuomintang's frontline combat, combined with the Communist Party's guerrilla harassment, worked together to drive out the invaders. However, after the war, the contradictions between the Nationalists and Communists were once again brought to the surface. The two sides tore off all pretenses, each vowing to eradicate the traitors who had harmed the nation!\n\nOn October 1, 1949, Mao Zedong formally announced the establishment of the People's Republic of China in Beijing. The disastrous defeats in three major campaigns forced Chiang Kai-shek to seek a new base to continue resisting the Communist Party. And so, Taiwan became the next stop for the retreating Nationalist army. This departure would last for seventy years.\n\nThrough nearly two hundred years of the crucible of war, how many revolutionaries threw away their pens to join the military with burning passion, and how many families lost their children? How many schemers treated the people like grass, and how many idealists brought hell down to earth?\n\nFortunately, all of this ends now. South to the Paracel Islands, north to Mongolia; west to Xinjiang, east to the East China Sea, the Republic of China has thoroughly defeated those ambitious schemers who sought to overthrow China. The people rejoice, knowing they no longer have to suffer for their livelihood. They also no longer need to worry about being trapped in an identity crisis.\n\nBecause there is only one China in this world, and it is called the \"Republic of China.\""
 CHI.H4.100.a: "Long live China!"
 CHI.H4.101.t: "Negotiate a Territorial Transfer with Japan"
 CHI.H4.101.d: "Earlier today, [CHI.GetLeader] held a press reception at the Presidential Palace in Nanjing to celebrate China's reunification. The Republic of China has finally realized its century-long dream, bringing the Chinese people back under the Blue Sky, White Sun, and a Wholly Red Earth. However, the practical situation is somewhat... unique.\n\nFollowing the end of the Great Asian War, PDTO forces withdrew from the entirety of China. However, after the collapse of the CCP regime, they deployed troops back onto the mainland under the pretext of \"protecting local expatriates and assets.\" Given the state of total chaos at the time, such military intervention and occupation did have some justification; having allies manage and maintain order in those areas shared a significant administrative burden while our forces were busy reclaiming the motherland.\n\nThough nominally under joint administration, the Japanese were primarily responsible for maintaining order. The residents within the Japanese-controlled zones are highly dissatisfied with this. Japan's historical atrocities in China have made it impossible for the people in these occupied areas to turn a blind eye to the Japanese garrison. Whenever a Japanese military camp attempted to raise the Japanese flag, 'enthusiastic masses' would tear it down and throw it on the ground within a few days. Japanese soldiers with poor discipline were frequently found dead deep in the alleyways of small towns. Under our coordination, the Maritime Self-Defense Force warships were required to temporarily stow their Rising Sun flags when docking, yet large crowds still cursed at the Japanese cargo ships. Port workers even attempted to mix homemade explosives into ammunition crates to sabotage the MSDF's temporary port armories on the mainland.\n\nWhile civil-military relations in major cities remain relatively stable, the underlying conflicts have never truly been resolved. A single spark could trigger a violent clash at any moment.\n\nThis press reception was convened precisely to address this issue. The Presidential Palace spokesperson and relevant Foreign Ministry officials spoke in turn, stating that they are currently in consultations with the Japanese side to discuss the transfer of occupied territories and the withdrawal of stationed troops. To consider the sentiments of mainland residents and ensure the safety of Japanese personnel, all negotiations will be held in Taipei, Taiwan. Our side will guarantee the accommodation, transportation, and safety of the Japanese delegation during this period until a consensus is reached by both sides."
 CHI.H4.101.a: "A call from Taiwan..."
 CHI.H4.104.t: "Should We Agree to Transfer Our Occupation Zones on the Mainland?"
 CHI.H4.104.d: "I just threw this together. Nobody’s actually going to read it... right?\n\nAnyway, it’s about whether we should hand back our occupation zones on the mainland. Your call."
 CHI.H4.104.a: "Meow? (Agree to hand over)."
 CHI.H4.104.b: "Hah!! (Disagree to hand over)"
 CHI.H4.102.t: "Japan Relinquishes All Territories and Ports in China"
 CHI.H4.102.d: "Earlier today, the Japanese diplomatic delegation departed from the Grand Hotel, driving out in a low-profile convoy that sped toward the Presidential Palace as quickly as possible. Ketagalan Boulevard was packed with massive crowds, mostly comprised of our mainland compatriots from the Japanese-occupied zones. Since the start of the negotiations, large numbers of residents had crossed the border into Nanjing to petition, expressing how cruel the Japanese troops were to the local populace and demanding that the Japanese flag never again fly over national soil.\n\nDue to the sheer number of items requiring negotiation and confirmation, the talks dragged on, leading some residents who had grown tired of waiting to take the Mini Three Links to Taipei in protest. They gathered around the Presidential Palace and the Grand Hotel, with their representatives declaring, 'As long as the Japanese troops don't leave, we won't leave!'\n\nThe number of people arriving in Taiwan skyrocketed from an initial 1,000. At its peak, nearly ten thousand people protested in front of the Presidential Palace, causing severe traffic jams in the surrounding area. The Japanese diplomatic convoy was even trapped on Chongqing South Road for a time, unable to move. During this standoff, the protesters continually hurled objects at the Japanese convoy-eggs, shoes, and bricks smashed against the cars. It took over ten minutes, under the joint cover of Taipei and New Taipei traffic police, for the Japanese convoy to successfully break through the blockade and enter the Presidential Palace.\n\nSimultaneously, a large press corps gathered in Taipei to follow the negotiations' progress. Reporters frequently interviewed the protesting residents outside the Presidential Palace, whose opinions inadvertently placed immense pressure on us. However, judging by the gloomy expressions of the Japanese delegation shown on television, they were clearly under even greater pressure.\n\nFinally, this morning, both sides formally signed an agreement. All Japanese-occupied zones on the mainland will be entirely handed over to the Republic of China's administration. The administrative records and public assets in the Japanese-controlled areas will be received by the ROC government, and the stationed troops will gradually withdraw within 30 days. To appease the mainland residents, the withdrawal of Japanese troops will be entirely supervised by the ROC Armed Forces. Convoys and ports will all be guarded by our soldiers until the very last Japanese soldier boards the evacuation ships.\n\nHowever, the situation in Shanghai is particularly complex. The Japanese seem reluctant to give up this lucrative economic port and financial hub, obstructing the takeover by the ROC Armed Forces and our local officials on the grounds that 'the local situation is complicated and immediate withdrawal is impossible.' The complex dynamics concerning Shanghai will require further negotiations at a later date to finalize."
 CHI.H4.102.a: "Long live the Republic of China!"
 CHI.H4.103.t: "Japan Refuses to Return Mainland Territories!"
 CHI.H4.103.d: "Tokyo has brazenly rejected our legitimate demand for the return of Manchuria and the leased ports along the Chinese coast. It appears that peaceful negotiations are no longer possible. The Republic of China will now be forced to resort to the final instrument of statecraft: military force."
 CHI.H4.103.a: "What..."
 CHI.CT.12.t: "The Passing of Lee Teng-hui"
 CHI.CT.12.d: "Taipei Veterans General Hospital formally announced today that former President Lee Teng-hui has passed away from multiple organ failure. Dr. Lin Yung-yang, director of the critical care medicine department, stated that the former president's family was by his side before his passing. The pioneer of Taiwan's democratization ultimately reached the end of his life naturally. Looking back on the life of Mr. Lee Teng-hui, who was born during the Japanese colonial period, he studied at Kyoto Imperial University and National Taiwan University before earning his doctorate in agricultural economics at Cornell University in the United States. Upon returning to Taiwan, he was recruited by then-Premier Chiang Ching-kuo as a Minister without Portfolio in charge of agricultural economics. He gradually entered the core leadership of the Kuomintang, ultimately taking office as the President of the Republic of China following Chiang Ching-kuo's death.\n\nThe assessment of his various political achievements and reforms from thirty years ago is complex. However, whether it was ending the Period of National Mobilization for Suppression of the Communist Rebellion or abolishing the Betrayers' Punishment Act, there is no doubt that former President Lee took a massive step forward on the path of Taiwan's democratic reform. Yet, in his diplomatic stance, he proposed rather unique arguments. Despite being a KMT member, he advocated for 'Taiwan Independence' and a pro-Japan stance. At the same time, Lee Teng-hui characterized cross-strait relations as a special state-to-state relationship, severely striking a blow to cross-strait cooperation in the 1990s and indirectly leading to the 1996 Taiwan Strait Missile Crisis.\n\nMr. Lee Teng-hui's governing direction over the past few decades has sparked intense controversy both inside and outside of Taiwan, directly or indirectly influencing cross-strait interactions and political discourse in the first two decades of the 21st century. The death of former President Lee marks the end of an era. The wheels of history roll forward, and some know where to steer them..."
 CHI.CT.12.a: "Rest well, President Lee."
 CHI.CT.12.b: "The mob boss is finally dead."
 CHI.CT.13.t: "Paint My Eyebrows for Me"
 CHI.CT.13.d: "To Junjian:\n\nI received all your letters from the other day, and I am very comforted to know that you are doing well in the army. Everything is fine at home; things are proceeding as usual, so you don't need to worry.\n\nYesterday, mother called to ask how I was doing. As she chattered about bits and pieces, remembering when you were still here, she let out a sigh with every sentence. While feeling melancholy, I happened to see the photo of us at the café. You were wearing an oversized white short-sleeved shirt and that souvenir baseball cap we bought in America, holding my arm and smiling at me. It felt like I could almost touch that moment again. The café posted a notice and closed down last month; now, it's just a fenced-off construction site. I went there last month to reminisce about the past, but sadly I was all alone. Not being able to see your silly smile left me feeling lost and sorrowful.\n\nAh-Zhu celebrated his first birthday last week. He's babbling now and unknowingly learned to say \"Mama.\" The whole family was delighted. But since you aren't here, I told him he absolutely mustn't learn from his father, who is so far away from me. It makes me so anxious! Mother comforted me, but not being able to see your face and only knowing how you're doing from your handwriting is truly monotonous. You said in your letter that your phone broke and you could only communicate by mail-what rotten luck! Several letters have arrived without a picture of you, just greetings. So bad! So bad! In your next letter, you must include a photo. Mother also says she misses you. When she calls at night, she tells me about your childhood. Even though I didn't experience it with you, it's as vivid as if I was there.\n\nDo you still remember when we went to look at the sea? Around the summer solstice, we drove to the beach in Su'ao. It wasn't far from home, and the trunk wasn't full of essentials, so I could pick up lots of rocks and put them inside. I remember one time, after a walk there, we ate red bean shaved ice. You said it was too sweet and pushed it all to me. You only opened your mouth when I fed you with the little wooden spoon, and afterward, you even called me naughty for forcing you to eat it. You're the naughty one! You're the naughty one! Thinking about it now, you were just teasing me on purpose. I was pregnant then, and my brain capacity was all taken up by Ah-Zhu, which is why I didn't realize it! While doing chores, I found a photo from that time in your old clothes. You were smiling so foolishly, like a happy idiot. But I married you, you naive fool, so let me ask you: what does that make me? Don't you dare say I'm a fool too!\n\nThinking about society today, surrounded by a flood of information... actually, putting down the screen and pouring our hearts out to each other on this thin piece of paper feels pretty good, doesn't it? It reminds me of a poem by Mu Xin: 'In the past, the daylight was slow / carriages, horses, and mail were slow / a lifetime was only enough to love one person.' I used to read poetry just for fun, skimming through and jotting down interesting sentences without delving into their deeper meanings. But writing this letter today, I finally understand. I have to marvel-being born in such an era, to be able to meet you in the sea of people, get to know you, understand you, and marry you, is truly our good fortune.\n\nLately, I've been learning to stargaze. Yilan's neon lights are so complex that if you looked down from the sky, you wouldn't be able to tell which side was the galaxy. I think I must be Ursa Major, and you are Ursa Minor. We just quietly roam here, never stopping even at dawn, until the next sunset, when we lean on the moon and quietly watch the afterglow burn from the sky to the sea. Oh, right, the sunset! I took Ah-Zhu out for a walk last night, and he pointed at the sun with his mouth open, bouncing and dancing. That was probably the first time he'd seen the sunset since he learned to speak. When we got home, he scribbled on some paper and drew many sunsets. I'm enclosing them with this letter so you can see your son's masterpieces, hahaha!\n\nI'm also sending a recent photo of Ah-Zhu along with this.\n\nBinyi\nApril 22nd"
 CHI.CT.13.a: "I love you so dearly; I cannot bear to part from you."
 CHI.CT.14.t: "For you, I tend the hearth."
 CHI.CT.14.d: "To Binyi:\n\nI have received all the letters you sent recently. The affairs of the battalion are complicated and the regulations are a mess. I couldn't reply in time because I had official duties; to delay them would ruin important matters. I am doing well. My superiors and peers all get along with me. I have enough to eat and a place to sleep, so you don't need to worry.\n\nLast night I was on duty for night patrol. The moon was bright and the stars were sparse. Thinking of what you wrote in your letter-that Yilan's night view looks like a galaxy-I imagine where the water meets the sky in Yilan must be exactly like that. Thinking about it makes me feel even more emotional. It's a pity, a true pity, that I can't watch it with you. What you said is indeed true. We are like those dazzling constellations in the sky, roaming the boundless universe. Perhaps the hearts between you and me are a thousand times hotter than the sun.\n\nLately, I often go look at the sea during my free time. Many stars emerge from the sparkling waves, and faintly, I see your silhouette. The hem of your light blue dress sways on the beach in Su'ao. We walk along the beach, and you smile blankly. From a pile of dark, messy rocks, you pick up those oddly shaped stones you consider treasures with hands as soft as silk, pulling me along to admire them. I remember one time, you found an almost pure white stone on the beach. You were as excited as a five- or six-year-old child and asked me to take you to eat red bean shaved ice as a reward. That day you said the red bean shaved ice was incredibly delicious. I wanted to see more of your silly face, so I pushed my portion to you. Who knew you would 'force' me to eat it? I had no choice but to obey. After all, a soldier's nature is to follow orders, hahaha! I thought you wouldn't notice my intentions, but I didn't expect you to figure it out just a year later. You really are my clever little treasure! It seems it's all Ah-Zhu's fault for eating nearly a year of your brain, but I imagine he must have inherited your 'cleverness' too! Hahaha!\n\nSpeaking of Ah-Zhu, I have safely received all the photos in your letter. Ah-Zhu looks so energetic; when he smiles, he looks a bit like you. Time flies like a fleeting shadow; I didn't realize Ah-Zhu is already a year old. It's all thanks to you and Mother taking care of him. As a father, I haven't fulfilled my responsibilities, and I feel deeply ashamed. Being so far from home, living on the line between life and death, makes me miss the past even more. Our youth seemed inexhaustible back then. But when it comes to national affairs, how can an adopted son stay out of it? I must first repay my country's kindness, and then cautiously follow my father's dying wish. Our romantic feelings for each other must be tearfully set aside. I know very well that you are deep in your boudoir, lonely and troubled, but I have no perfect solution. I've only brought hardship to you and Mother, causing you to dream of me often late at night. I am neither a good husband nor a good son.\n\nYou mentioned in your letter that the café we used to frequent has closed. Do you know if the owner can still be reached? I have a few old debts with him from years ago. Being in the camp, I can't pay them back myself. I'd like to ask you to contact the owner for me, and if you can reach him, please be sure to pay off the debts on my behalf. I've known him for many years, as you well know. Things change so quickly, it's truly unexpected! My thoughts are running wild, and I don't know where to start.\n\nWhat you said is correct. In this society overflowing with information, we are like two small wandering boats. Through a complex stroke of fate in this vast world, we met, understood each other, tied the knot, and built our own little safe haven together. It really wasn't easy! Not easy at all! The subtle, complicated glimpses of scholars, poets, heroes, and beauties in those books don't seem much different from us. Perhaps we are those people, and it all started with the words \"I love you.\" We are so lucky!\n\nIt's late at night, so I'll stop the chatter here. You don't need to worry about me. I've reported the phone issue to my unit, so don't be anxious.\n\nI'm enclosing a photo from the camp with my reply. Don't miss me too much.\n\nJunjian\nApril 30th"
 CHI.CT.14.a: "The stars above shine upon both our hearts."
 CHI.CT.15.t: "Telegram and Citation"
 CHI.CT.15.d: "To Ms. Xia Song Binyi:\nWe were shocked and deeply saddened to learn that the head of your esteemed household, the late Mr. Xia Junjian, tragically and heroically sacrificed his life for the country during the Battle of the Taiwan Strait. Hearing this news brought profound grief and immense sorrow.\n\nUpon review, during his life, the late Mr. Xia Junjian was a loyal and patriotic dependent of a veteran. His heroic sacrifice serves as an exemplary model for all. The Ministry has requested and received direct orders from the highest command to posthumously promote him to Second Lieutenant in the Army and award him a Commendation Decree to honor his loyalty and martyrdom.\n\nThe Ministry extends its deepest condolences and sympathy to the bereaved family for the tragic loss of your eldest pillar. Regarding all matters related to pensions and subsequent funeral arrangements, a dedicated commissioner has been assigned with full authority to assist the family, ensuring comprehensive and compassionate care to comfort his heroic spirit.\n\n\nKinmen Defense Command, Republic of China\n\nMay 4, 112th Year of the Republic of China (2023)"
 CHI.CT.15.a: "Hereby commending Army Second Lieutenant Xia Junjian, who fell in service to the nation..."
 CHI.CT.16.t: "The White Dove Flies On"
 CHI.CT.16.d: "The martyrs' cemetery was the same as always, and the early summer sun was so fierce it bordered on cruel. It wasn't even noon yet, and cool breezes flowed through the dancing shadows of the trees, lifting the hem of Song Binyi's sky-blue dress. Just like walking on the beach in Su'ao in the summer, she carried a photo of Xia Junjian, her steps light. In the photo, Xia Junjian's eyes were resolute, his lips curled into a slight smile, looking even more dashing in his military uniform. Mother Xia followed closely behind Song Binyi, wearing a long black dress, her expression relaxed, as if she were merely handling a trivial matter. Two soldiers in dress uniforms escorted Xia Junjian's flag-draped urn behind them, their expressions solemn, sorrowful, and meticulous. It was quiet all around; occasionally, the distant chirping of birds drifted on the wind, only to be deflected by the soldiers' neat and steady goose-stepping. The walk wasn't long. They passed through the mottled light, paths, and tree shadows. The fallen leaves beneath their feet rustled softly, as if whispering something, and finally arrived at Xia Junjian's grave.\n\nThe burial ceremony was extremely simple. There was no grand military band, nor dazzling flashes from reporters' cameras. There was only the low hum of the wind sweeping through the pine forest and the solemn expressions of a few soldiers. Sunlight trickled through the gaps in the leaves, casting a faint halo on the tombstone, as if offering some silent comfort. When the ceremony ended, Song Binyi reluctantly placed the photo in front of his grave. He was smiling, as if smiling at her. Looking at her son's black-and-white photo frame, his mother finally couldn't hold on any longer. She was so heartbroken she fainted; had it not been for the two soldiers supporting her, she would have collapsed to the ground. When Song Binyi snapped out of her daze, Uncle Lu had already arrived. Though he was over eighty, he was well-built, with white teeth and black hair-old but vigorous. Uncle Lu and Xia's father were old comrades-in-arms who had gone through life-and-death struggles together. They retreated from the mainland to Taiwan together and stayed in touch until Xia's father passed away.\n\nUncle Lu took off his military cap, approached Song Binyi, and exchanged a few pleasantries. But when he spoke of Xia Junjian, his throat choked up. He remained silent for a while before slowly speaking: \"It was my decision to hide the news of Junjian's sacrifice from you. It hasn't been long since old Xia passed away. If you found out about Junjian's sacrifice so soon, I was afraid you wouldn't be able to bear it.\" His voice was low and hoarse, like sandpaper worn down by the years, and every word carried a heavy weight.\n\nSong Binyi looked into Uncle Lu's eyes, her expression calm. Uncle Lu tightened his grip on the brim of his cap and continued, \"We searched for Junjian's remains for a long time... it took us half a year... He was a good kid, a good soldier! Just like his father, they are both martyrs!\" At this point, his eyes grew slightly red, but he refused to let the tears fall, simply blinking hard, as if suppressing an emotion buried deep within for a long time.\n\nListening to Uncle Lu recall Xia Junjian's performance and daily life in the army, Song Binyi's thoughts drifted away with the wind. In a daze, she saw Xia Junjian's figure walking toward her on the summer beach in Su'ao. He was carrying a woven bag filled with strange cobblestones. The sea breeze blew through his hair, carrying the scent of red bean shaved ice. It was a brilliant summer; the sound of the waves mixed with the cheers and joy of children. Her dress was already soaked by the waves, the deep blue reflecting her tear-filled face. Xia Junjian reached out, wiped away her tears, left a light kiss on her cheek, and turned to walk deep into the sea.\n\nLeaving only Song Binyi heartbroken in the red bean shaved ice-scented sea breeze.\n\nThe wind blew from afar, carrying a hint of salty moisture, as if it had truly blown from that beach to this silent cemetery. She stood frozen in place for a long time until Uncle Lu gently patted her shoulder, bringing her back to reality. The photo on the tombstone was still smiling, as if he had never left.\n\nShe crouched down, reached out, and gently touched the cold stone tablet with her fingertips. The roughness and coolness beneath her fingertips felt just like that summer-the last trace of warmth he left when his fingers brushed her cheek.\n\n\"Junjian...\" she called to him softly. Her voice was as light as a sigh, scattering into the wind.\n\nThere were no tears.\n\nShe simply looked quietly at the photo, at his face forever frozen at twenty-two. He would never grow old, never frown, never frantically wipe her tears because she was crying. He would forever be paused right after that kiss, paused at the step where he turned toward the sea.\n\nAnd she had to keep moving forward.\n\nSong Binyi stood up and dusted off her dress. She didn't look back; she simply placed the photo gently beneath the tombstone, pressing it down with a cobblestone she had brought back from Su'ao beach.\n\nThe stone had been warmed by the sun, as if he were still there.\n\nShe turned and walked into the mottled light and shadows. Her steps were still light, as if she were merely attending a late appointment.\n\nThe wind picked up, and a white dove flew across the sky above the cemetery, its wings cutting through the blue without leaving a single trace.\n\nJust as if he had never left, and had never returned."
 CHI.CT.16.a: "My dear, keep moving forward. Don’t turn back because of me."
 CHI.H4.111.t: "The Tuva Problem"
 CHI.H4.111.d: "The Republic of Tuva. If you aren't very familiar with history, you might not know this country. Although its territory is much larger than Luxembourg's, being wedged between China and Russia has left it quite obscure historically. The average person would hardly notice the existence of such a small country in Central Asia.\n\nThe present-day Republic of Tuva was once a vassal state during the Tang Dynasty, known as the Dubo Prefecture, and was later controlled by various Turkic states and the Qing Dynasty. Following the Xinhai Revolution, Imperial Russia attempted to instigate independence in Tuva. Changing hands several times in the early 20th century, the Republic of Tuva was eventually incorporated into the Soviet Union, becoming a part of the Russian Federation after the collapse of Soviet Russia.\n\nThe Republic of Tuva was essentially a prize seized by Russia while the Republic of China was weak. Now, with our desire for national restoration close at hand, we must ride this momentum to reclaim our historical territories.\n\nThe good news is that our intelligence operatives have successfully crossed the border into the Republic of Tuva and have already made contact with insiders in both the political and police spheres. Upon our command, the local Tuvan armed police can immediately seize control of the government and the local [tuva_old_owner.GetName] garrison.\n\nHowever, our friendly northern neighbor certainly won't let this go easily. Once we have full control of the Republic of Tuva, the ROC Armed Forces must quickly rotate in to take over defense duties from the original garrison. If we fail to stop a military invasion from our neighbor, the consequences will be unimaginable..."
 CHI.H4.111.a: "We’ll need to choose our moment wisely."
 CHI.H4.112.t: "Conflict in Tuva"
 CHI.H4.112.d: "Reality never gives us a moment to catch our breath. Just as our forces were rotating with the Tuvan defense forces and taking over military assets, the Polar Bear from the north was glaring covetously at us. Although our spies surprisingly succeeded in seizing military and political control of the Republic of Tuva, our foundation is not yet fully secure, and dissidents opposed to Chinese rule over Tuva have not been completely apprehended. Every second we let them roam free increases the danger of our situation.\nJudging from the commotion on the border, they've clearly contacted reinforcements through channels unknown to us. Convoys that had just crossed into Tuva immediately changed direction and rushed straight to the border, while reserve units still preparing instantly dropped their logistical tasks and entered a state of combat readiness.\nMartial law has been declared across the entirety of Tuva. The situation on the border remains unclear; perhaps the opposition is merely launching harassing attacks to express protest? But we cannot take any chances. If we lose the upper hand in this border conflict, the consequences will be unpredictable."
 CHI.H4.112.a: "All Forces to Maximum Readiness!"
 CHI.H4.113.t: "Tuva Is Ours!"
 CHI.H4.113.d: "When the flames of war on the border subsided and the ROC soldiers stepped out of their fortifications, they were met with a vast expanse of white snow, dotted with blood and khaki uniforms. We have won! The soldiers dug out a few national flags from the supply crates, hastily erected a makeshift flagpole near their positions, and raised the flag. These flags were originally meant to be flown over Tuvan government buildings and military bases.\nAfter learning that the border was secure, the ROC military quickly lifted martial law and reopened municipal offices at all levels. The people of Tuva can finally breathe a sigh of relief and focus on celebrating this hard-won peace and reunification."
 CHI.H4.113.a: "Piece by Piece, the Chinese Begonia Is Reunited."
 CHI.H4.114.t: "The Battle for Tuva Is Lost"
 CHI.H4.114.d: "We failed. We failed. When the flames of war on the border subsided and the ROC soldiers stepped out of their fortifications, they were met only with the bodies of their comrades and devastation all around. We failed. President [CHI.GetLeader] was too arrogant to believe we could stand against [tuva_old_owner.GetName], the controllers of Tannu Tuva.\nUpon learning of the armistice between our nation and [tuva_old_owner.GetName], the ROC forces silently loaded the bodies of their fallen comrades, along with their equipment, into trucks to be transported back across the border. Perhaps we should thank [tuva_old_owner.GetName] for their mercy in allowing us to collect the remains of our soldiers.\nPerhaps Tannu Uriankhai-or rather, the people and land of Tuva-were never meant to belong to the Republic of China after all."
 CHI.H4.114.a: "What an embarrassment."
 CHI.H4.115.t: "The Guns Fall Silent"
 CHI.H4.115.d: "Following days of continuous, bloody combat in the mountain passes by the brave soldiers of the ROC Armed Forces, the underprepared and under-supplied [tuva_old_owner.GetName] army was finally forced to retreat from the border valleys due to worsening mountain weather. After suffering heavy losses, our frontlines finally secured a precious window of opportunity to lead the remaining forces in a retreat to this temporarily calm basin and reorganize our shattered units.\n\nAlthough the situation in Tuva has turned from dangerous to safe for now, considering that the temporarily retreating [tuva_old_owner.GetName] forces could launch a counterattack at any moment, we must remain cautiously on guard at our outposts and not relax for even a second..."
 CHI.H4.115.a: "Whet the blades and ready the steeds; sleep upon our arms until dawn..."
 CHI.TW.21.t: "Demands from Hong Kong and Macau"
 CHI.TW.21.d: "Following our nation's regained control over the southern mainland, opinion leaders from Hong Kong and Macau-such as Mr. Jimmy Lai, Mr. Alan Leong, and Mr. Albert Ho from Hong Kong, and Mr. Ho Iat Seng from Macau-have submitted requests to the ROC government seeking autonomous city status.\n\nAfter deliberations, President [CHI.GetLeader] made the final decision: \"Our nation is a democracy, and there is ample precedent for local autonomy in democratic societies. We also have experience with indigenous autonomy. We cannot completely ignore the will of the local people like a dictatorial regime. Hong Kong and Macau have their own unique historical and cultural statuses. The Communist Party has already shown us what happens when you force their integration with China. Of course, it is absolutely impossible for Hong Kong and Macau to become independent like Luxembourg or San Marino, but we can grant them a status similar to the free cities of Europe in the past. Naturally, as a democratic society, the people's wishes must come first. Let us hold a referendum in each of the two cities. If the local people truly desire it, we will not refuse.\"\n\nFollowing President [CHI.GetLeader]'s decision, a voting event was quickly organized in both cities."
 CHI.TW.21.a: "We shall await good tidings."
 CHI.TW.211.t: "Democratic Self-Government"
 CHI.TW.211.d: "Hong Kong approved the request for autonomy with 67% of the vote. Macau reached a staggering 99%, which analysts attribute to its ecological niche as a casino city making the people of Macau desire autonomy even more.\n\nSubsequently, the Legislative Yuan and President [CHI.GetLeader] swiftly approved the autonomy requests submitted by Hong Kong and Macau, allowing the two cities to establish their own administrative bodies and councils. This made the people of Hong Kong and Macau deeply feel the difference between our nation and the CCP, further deepening their sense of identity with the Republic of China."
 CHI.TW.211.a: "Long live Democracy!"
 CHI.H4.93_news.t: "The Republic of China Invades Mongolia"
 CHI.H4.93_news.d: "Earlier today, the Republic of China Armed Forces launched an unannounced strike against multiple military and civilian facilities within Mongolia. Armored units stationed at the border ignored all warnings and rapidly advanced across the frontier. Concurrently, heads of various ROC government ministries held an emergency joint press conference, broadcast live on television, YouTube, Bilibili, and other multimedia platforms. During the conference, an official from the Ministry of Foreign Affairs declared, \"To restore the Republic of China, Mongolia must return the territory it has illegally occupied since the founding of the Republic.\" A spokesperson for the Ministry of National Defense stated that military operations would cease immediately if the Mongolian government agreed to peacefully hand over the occupied territories.\n\nThe international community expressed strong dissatisfaction with this military invasion. The Foreign Ministries of Japan and South Korea immediately held press conferences, severely condemning the Republic of China's violation of a sovereign state. It remains unknown whether Japan, South Korea, or other nations will take further countermeasures.\n\nAt present, foreign governments have been unable to contact their diplomatic missions in the Mongolian capital, Ulaanbaatar, and numerous news media outlets are still scrambling to reach their local correspondents. Some scholars fear that this invasion could be the Republic of China's first tentative step toward outward expansion..."
 CHI.H4.93_news.a: "China has never changed."
 CHI.H4.xizang_war_news.t: "The Sino-Indian War Erupts"
 CHI.H4.xizang_war_news.d: "Not long after the flames of the Great Asian War subsided, a new blaze has ignited in South Asia. The Republic of China and India, who previously cooperated to defeat the CCP, have now plunged into conflict over territorial disputes in the Tibet region. It remains unclear which side fired the first shot; spokespersons from both China and India accuse the other of being the aggressor who fired first, claiming they were merely acting in legitimate self-defense to protect their territory.\n\nThe PDTO has attempted to call for an immediate ceasefire, but neither China nor India has responded. No one knows where this all-out war, involving over 3 billion people, will lead."
 CHI.H4.xizang_war_news.a: "Old grudges, new hatreds... the reckoning never ends."
 CHI.TW.1.t: "The Regret Left Unspoken"
 CHI.TW.1.d: "As the sun set, the slanting rays shone on this small piece of land as usual. This was typically the time high school students got out of class, with couples walking hand in hand in twos and threes, their shirts wrapping their youthful affections and love. Zhu Minxuan would always remember that boy's hand. Every time the bell rang, she would grab her backpack and rush to the school gate, just so she could find him first.\n\nMinxuan always hoped to escape this prison of test papers and textbooks with him forever. She put down the sandbag and wiped the sweat from her face with her sleeve. The white school uniform from back then had now become a green-and-white camouflage field uniform. Minxuan had returned to her alma mater in a way she never expected. After failing her college entrance exams, her family sent her to a military academy to enlist. The boy went up north to study, and separated by distance, they rarely kept in touch. She wondered how he was doing.\n\nShe piled up large numbers of sandbags at all the school's entrances and exits, following the company commander's orders to clear out the desks and chairs from the remaining classrooms. Some were moved to the temporary company command post, while the rest were thrown onto the street as barricades. The sky gradually grew dark. The last classroom was finally cleared! Minxuan let out a long sigh of relief, but out of the corner of her eye, she caught a glimpse of something oddly white among the pile of desks and chairs, standing out glaringly under the dim streetlights. She picked it up. It was a letter, with only three crooked characters written on it: 'To Minxuan.'\n\nMinxuan knew she shouldn't be reading letters while preparing for battle, but she couldn't help tearing open the envelope. Inside was that familiar handwriting. She had often complained about this messy 'calligraphy' whenever she copied his homework.\n\nHalfway through reading, Minxuan realized that most of the letter was already soaked. Tears and sweat mixed with her emotions, pouring out in this moment. The feelings he had been too shy to express back then were only discovered now...\n\nThe explosion from a landing missile violently threw her against the wall. She slumped powerlessly to the ground, the letter slipping from her hand. Her vision was dyed a dark red, and her consciousness gradually faded... The love she was too shy to confess in the past... might never be fulfilled."
 CHI.TW.1.a: "What is but dust to an age can become a mountain upon one life."
 CHI.TW.2.t: "The Blue Sky, Defiled"
 CHI.TW.2.d: "Huang Xianren looked with complex eyes at the screen showing the surviving ROC soldiers boarding the evacuation transports. He knew this day had finally come. It seemed he had no choice but to leave Kinmen, this land he had guarded for untold years. The Republic of China's rule of over seventy years was coming to an end. The evacuation of Kinmen's citizens had already been completed beforehand, though some citizens refused to leave their homeland, refusing to evacuate and willing to live and die with Kinmen.\n\n\"Report, the remaining citizens of Kinmen, they spontaneously...\"\n\n\"Spontaneously did what?\" Huang Xianren turned his head to look at the general in charge of the evacuation who had come to report.\n\n\"They spontaneously held a flag-raising ceremony and held up national flags to bid farewell to the ROC comrades.\"\n\n\"Let them. Kinmen has endured Communist landings and the 823 Artillery Bombardment, always serving as the frontline against communism. Kinmen's history is tortuous but glorious. Perhaps, this time...\"\n\nHuang Xianren ultimately couldn't bring himself to say it. Perhaps this evacuation meant parting with Kinmen forever. Perhaps the Republic of China would now be completely separated from the mainland. The cross-strait relations bound by blood and kinship had already dissolved into infinite hatred amidst the smoke of Communist artillery fire.\n\n\"They... they hung the national flags upside down!\"\n\n\"What?!\""
 CHI.TW.2.a: "The White Sun Sets..."
 CHI.TW.3.t: "The Reds Are Upon Us!"
 CHI.TW.3.d: "Before dawn had fully broken, sirens pierced the silence. Radar showed anomalous activity, followed by continuous missile warnings and communication jamming. Within minutes, air defense systems across the region were fully activated, and military bases entered the highest state of alert.\n\nForces on the other side of the strait began a massive operation. Air and naval power advanced simultaneously. War was no longer just speculation; it was a reality unfolding right now.\n\nThe coastal areas and outer islands bore the brunt of the pressure. Communications became intermittent, and some frontline outposts had already lost contact with the command chain. Ports and airports entered emergency operation modes, civil aviation was completely suspended, and transportation nodes quickly shifted to military priority.\n\nIn the cities, air raid sirens wailed one after another. Civilians rushed into shelters, schools suspended classes, and businesses shut down. The entire society transitioned into a wartime rhythm in a very short time. Confusion and uncertainty spread as people tried to piece together the developing situation from fragmented news.\n\nThe nation has entered a state of war. All relevant agencies are fully mobilized, urging the public to remain calm and follow instructions.\n\nJapan and Australia began activating coordinated defense mechanisms, and military and diplomatic activities in the region escalated sharply. The Pacific Defense Treaty Organization faces the most severe test since its inception.\n\nYears of preparation and anticipation are finally being put to the test in this moment.\n\nRegardless of the outcome, this day will change the future of this island."
 CHI.TW.3.a: "The Strait Boils Over"
 CHI.TW.4.t: "Unity in an Hour of Crisis"
 CHI.TW.4.d: "As the situation in the Taiwan Strait rapidly deteriorated and the shadow of war loomed over the entire island, the major political parties, which had previously engaged in fierce confrontations in parliament and on the streets, gradually realized that this crisis had transcended the scope of everyday political competition.\n\nAs the external threat approached step by step, long-standing internal divisions began to seem inappropriate. Whether it was the ruling party or the opposition forces, despite their ideological differences and historical grievances, they knew that in the face of an impending full-scale conflict, division would only weaken the overall defense capability.\n\nUnder pressure and mediation from various sides, the party leaders finally sat down at the negotiating table. After days of negotiations, the government announced the formation of a 'Wartime Coalition Government.' Some opposition figures would enter the decision-making and oversight systems, jointly participating in the formulation of policies related to national defense, the economy, and civilian livelihood.\n\nThe atmosphere on the streets began to undergo a subtle change. Supporters of various parties, who had previously argued endlessly in comment sections, gradually set aside their contradictions to face the real enemy. The public expressed approval of the parties' willingness to put aside their differences, seeing it as a manifestation of a mature democracy in a crisis.\n\nWhen external threats close in, the differences between parties are no longer important."
 CHI.TW.4.a: "Forge a Cross-Party Front..."
 CHI.TW.7.t: "Victory in Arabia!"
 CHI.TW.7.d: "The flames of war on the Arabian Peninsula have finally died down.\nStarting in 2020, the issue of royal succession caused by the king's death quickly evolved into a five-faction civil war. Foreign powers all stepped in to intervene, and Taiwan was no exception.\n\nAs the war swept across the entire peninsula, the Republic of China and the European Union decided to support the Republican government, providing humanitarian and military aid. Our country sent volunteers to the yellow sands to fight religious extremists and royalists, and helped Saudi Arabia build an army, just as we did in the 1970s.\n\nNow, the fighting has finally come to an end. The Republican government controls the major cities and transportation hubs, and the remaining armed groups have surrendered or dispersed. The old order of the Kingdom of Saudi Arabia has officially ended, and a brand new Arabian Republic is being built on the ruins. Let us cheer for yet another country shedding feudalism and dictatorship, just as China shed the Manchu system.\n\nMay the Saudi people forever bathe in freedom and democracy."
 CHI.TW.7.a: "Operation Desert, concluded."
 CHI.TW.6.t: "Mobilize the Reserves"
 CHI.TW.6.d: "The sirens came without warning.\n\nIn a short period, a massive number of missiles launched from the other side of the strait, precision-striking ports, airports, railway hubs, and major industrial facilities. Explosions and power outages swept across the island almost simultaneously. The transportation network was paralyzed, communications in some areas were cut off, and factories were forced to halt operations.\n\nThis was a carefully calculated 'preemptive paralysis.' The enemy intended to cripple our mobilization capabilities and logistical operations before the war officially broke out, depriving the nation of its reaction speed at the most critical moment.\n\nFacing this sudden strike, the government announced after an emergency meeting:\n\nFully activate the reserve mobilization mechanism.\n\nReservists across the country began receiving notices. Some were at their jobs, some had just returned home, and others hadn't even recovered from the shock of the first wave of explosions-text messages, radio broadcasts, and local agency notices went out simultaneously, instructing them to report to designated assembly points.\n\nMobilization did not go smoothly. Blocked roads, suspended trains, and fuel shortages in some areas made the assembly process far more difficult than anticipated. Local governments and the military urgently coordinated alternative routes, utilizing all available resources to transport personnel to still-functioning bases and temporary assembly points.\n\nPanic and unease spread initially, but an increasing number of people realized that this was no longer a simple act of intimidation. Volunteers appeared on the streets to help direct traffic, businesses began cooperating with government dispatching, and civilian forces spontaneously filled the gaps left by a system that hadn't yet recovered.\n\nOur allies also closely monitored the situation. The frequency of intelligence exchange increased significantly, and military activities in the region escalated sharply. All signs indicated that this conflict was heading in an irreversible direction.\n\nChina's actions have gone far beyond the scope of military exercises. Now, everyone in Taiwan knows:\n\nWar is near."
 CHI.TW.6.a: "A storm is coming..."
 CHI.TW.9.t: "Revive the Chinese Nation"
 CHI.TW.9.d: "The Republic of China has finally won the Taiwan Strait War. We have severed the Chinese Communist Party's claws attempting to reach into the Taiwan Strait. Although the CCP will inevitably attempt to make a comeback, we have won a temporary breathing space and dealt a heavy blow to their rule. The ROC Armed Forces return in triumph, the citizens celebrate, and Taiwan's democracy and freedom are stronger than ever at this moment, while the Communist forces across the strait can only swallow the bitter fruit of defeat. As the good news of victory arrives, our international standing has improved, and the humiliation of the ROC being replaced by the CCP at the United Nations has been washed away.\n\nJapan has immediately announced the establishment of diplomatic relations with the Republic of China, and our loyal friends like Australia and New Zealand have quickly followed suit, recognizing the ROC's international status as an independent sovereign state. Although fighting for the legal representation of China remains difficult, the Republic of China has taken a massive step forward in the international community!"
 CHI.TW.9.a: "From Now On: North Korea and South Korea, North China and South China."
 CHI.TW.10.t: "The Real China"
 CHI.TW.10.d: "“Effective immediately, our government recognizes the Republic of China as an independent sovereign state, acknowledges the Republic of China as one of only two legitimate representatives of China, supports the Republic of China’s participation in the United Nations as an observer state, and supports the restoration of certain rights and privileges it lost following 1971...”\n\n“Forgive me, but I must correct you. The Republic of China would not be joining the United Nations. It would be restoring its rightful place within it. We were among the founding members of the United Nations, our name is written into the Charter itself, and the Republic of China was one of the original permanent members of the Security Council. Since 1912, the Republic of China has been a lawful representative of China, and that legitimacy has never ceased to exist.”"
 CHI.TW.10.a: "\"The Real China\""
 CHI.TW.11.t: "Reliable Allies"
 CHI.TW.11.d: "The People’s Liberation Army has already seized Kinmen. With the outlying island fallen, an assault upon Taiwan itself is no longer a distant possibility, but an imminent and unavoidable reality. We have prepared for this moment as best we can. Yet in this darkest hour, our allies have answered with the strongest support they could offer. The Japan Self-Defense Forces have already arrived in Taiwan, taking up defensive positions alongside the Republic of China Armed Forces and preparing to face the coming assault together. Australian forces have yet to reach the island, but civilian supplies, ammunition, and military equipment continue to pour into Taiwan without pause. At the very moment when the island seemed most isolated, the arrival of allied aid has breathed new strength into its defenses. Taiwan does not stand alone, and with that knowledge, its resolve has hardened. Whatever comes across the Strait, we will face it together."
 CHI.TW.11.a: "Long live Pacific friendship!"
 CHI.TW.13.t: "A Torn Society"
 CHI.TW.13.d: "The war is over, but the hatred has not subsided in the slightest.\n\nUnder the impact of prolonged war and economic depression, the animosity accumulated in society began looking for an outlet. Some highly emotional groups aimed their spears at mainland Chinese spouses and their families living in Taiwan. They were suspected, labeled, and even viewed as potential 'internal threats.'\n\nSporadic conflicts started as mere verbal confrontations and harassment but quickly escalated into more serious violent incidents. Street attacks, property destruction, doxxing, and hate speech on the internet emerged one after another, and some areas even saw organized exclusionary actions. For many mainland spouses who were originally just ordinary family members, life after the war became far more dangerous and uncertain.\n\nLaw enforcement agencies began stepping up patrols and interventions, investigating and arresting those involved in violent acts. The authorities urged the public to remain calm, emphasizing that vigilante justice and collective hatred in any form would not be tolerated. However, some segments of public opinion continued to incite unrest, questioning whether the government was being too lenient.\n\nSociety split noticeably. Some argued that stricter screening and restrictive measures should be taken to prevent potential risks, while others emphasized that treating an entire group as the enemy would only repeat the logic of war and erode the society's original foundational values.\n\nThe international community has also been monitoring these developments. Human rights organizations urged the government to protect vulnerable groups and prevent retaliatory actions from spreading, while our Japanese and Australian allies watched to see if these incidents would affect post-war reconstruction and political stability."
 CHI.TW.13.a: "Can’t the nationalists give it a rest for once?!"
 CHI.TW.14.t: "The Legislative Yuan Returns to Chaos"
 CHI.TW.14.d: "During the most critical moments of the Taiwan Strait War, the major political parties temporarily laid down their long-standing political differences and formed a cross-party coalition, jointly supporting the government through the most difficult years. During that time, the Legislative Yuan saw less mutual attacks and more joint statements; legislators from different parties sat at the same table, searching for a minimum consensus for the survival of the nation.\nBut now, the war and reconstruction are both over. As the enemy retreated and the state of emergency was gradually lifted, the biggest reason for maintaining the coalition vanished as well.\nIn what seemed like an ordinary legislative session, a familiar scene reappeared in the chamber.\n\n\"This budget is simply a waste of taxpayers' money!\"\n\"At least we proposed a plan. What have you done besides object?\"\n\"Please maintain order in the chamber!\"\n\nThe speaker struck the gavel repeatedly, but it could barely suppress the clamor in the room.\nPeople pounded tables, waved documents, and loudly accused their opponents in front of media cameras. The united cross-party cooperation of wartime seemed like merely a brief interlude.\n\nWith the end of reconstruction and the approach of the 2024 elections, the cross-party wartime coalition announced its dissolution, and the political parties resumed normal political operations and competition.\nSomeone watching the Legislative Yuan broadcast on TV couldn't help but laugh out loud: \"They're fighting again. Legislators are always so energetic, no matter when.\"\n\nFor ordinary citizens, although the arguments in the Legislative Yuan are just like before, this time those familiar bickering sounds bring an unprecedented sense of peace and relief. Everyone understands that these seemingly comical arguments are the democracy the Taiwanese people gambled their lives to protect."
 CHI.TW.14.a: "Not even a moment of peace..."
 CHI.TW.8.t: "Once Again on the World Stage"
 CHI.TW.8.d: "On the post-war streets of Taipei, amidst the ruins of what used to be Section 3 of Zhongshan North Road, two newly completed estates stand tall. These are the newly re-established Embassy of Japan and the Embassy of Australia to the Republic of China. After the start of the Taiwan Strait War, both nations re-established ambassadorial-level diplomatic relations with the Republic of China, and the personnel from the former Japan-Taiwan Exchange Association and the Australian Office were appointed as embassy diplomats. In the post-war reconstruction plan, government departments decided to prioritize rebuilding the embassies on their original sites from before diplomatic ties were severed in 1972. This signifies our breaking free from the CCP's diplomatic blockade and stepping back onto the world diplomatic stage once more. The ambassadors of both countries held a grand ceremony on the same day to celebrate the official establishment and operation of the embassies. The President also attended the ceremony, demonstrating the friendship and unity of the PDTO nations and expressing gratitude for the two countries' help during the war and post-war reconstruction.\n\nBeside these two embassies, the embassy of our traditional ally, Paraguay, is also undergoing intense reconstruction. Zhongshan North Road will once again become Taipei's diplomatic district."
 CHI.TW.8.a: "The Republic of China Returns to the World Stage"
 CHI.TW.18.t: "The Birthrate Crisis Deepens"
 CHI.TW.18.d: "The war is over, but its lingering effects are far more severe than we imagined.\n\nDuring the long Taiwan Strait War, massive casualties, family separations, and economic stagnation further worsened the already severe low birth rate problem. Many young people of childbearing age either went to the battlefield or lost their homes and stable lives in the crossfire. Post-war reconstruction pressures and high living costs have forced countless families to repeatedly delay their plans to have children.\n\nOnce densely populated towns are beginning to see vacant housing, and rural areas face the dilemma of school closures and insufficient medical resources. The population loss and migration caused by the war have created an even more severe fault line in Taiwan's demographic structure. Over the next few decades, the number of young people entering the labor market will decrease drastically.\n\nIf we do not curb this trend soon, Taiwanese society may collapse before the next crisis even arrives."
 CHI.TW.18.a: "The nation is bleeding..."
 CHI.TW.22.t: "Controlling the South China Sea Islands"
 CHI.TW.22.d: "As the Taiwan Strait War ended in China's defeat, the Chinese military began a hasty withdrawal from Taiwan, Penghu, Kinmen, and Matsu. The invasion forces originally deployed in coastal areas are being redeployed, and massive military resources are being diverted elsewhere to control the chaotic domestic situation.\n\nHowever, the impact of the defeat extended beyond military setbacks; China's domestic political landscape has plunged into unprecedented turmoil, with various factions vying for power, and the central government's ability to control local and overseas territories has dropped sharply. The once seemingly impregnable defense lines are now weakening as political chaos ensues.\n\nPDTO decision-makers quickly noticed this. Control of the South China Sea islands would allow PDTO to further grasp the South China Sea shipping lanes and check China's military activities in the region, so PDTO did not intend to miss this rare opportunity.\n\nBefore the operation began, the PDTO fleet subjected the military facilities on the islands to prolonged, intensive naval bombardment. The fierce firepower destroyed multiple defensive positions and communication facilities, making it difficult for the island's defenders to organize an effective resistance.\n\nSubsequently, ROC forces launched an amphibious landing under the cover of Japanese and Australian naval and air power. Compared to the brutal fighting in the Taiwan Strait War, this operation could almost be called smooth. The Chinese defenders, having lost central support, were unable to organize a large-scale counterattack. Some units chose to retreat, while others laid down their weapons after their resistance failed.\n\nBeijing, with its attention focused on stabilizing the political situation and suppressing rebellions in the west, had no time to worry about the South China Sea islands. Aside from issuing simple condemnations, they took no further action."
 CHI.TW.22.a: "After seventy-three long years, we have returned at last."
 CHI.TW.23.t: "The Gathering Storm"
 CHI.TW.23.d: "Beijing, the 20th National Congress officially convenes.\n\nThe whole world awaits an answer. After years of tense cross-strait relations, escalating military standoffs, and increasing warnings from the international community, some still believed there might be a peaceful path forward. As long as there was a change in the power structure, as long as the new generation of leaders was willing to rethink cross-strait relations, this crisis might still be resolved at the last minute.\n\nHowever, the results of the congress quickly provided the answer. Xi Jinping secured supreme leadership again with an overwhelming majority, breaking long-standing political conventions, and China's political direction became even clearer.\n\nFor Taiwan, what this means goes without saying. Over the past few years, China has continuously increased military pressure and suppressed Taiwan's diplomatic space. Now, with the supreme power structure fully consolidated, any hope that China would change its Taiwan policy through political transition has been completely shattered. Xi Jinping will undoubtedly attempt to achieve his 'Great Rejuvenation of the Chinese Nation' while the First Island Chain is at its weakest.\n\nThe seventy-year cross-strait situation has entered its final stage.\n\nNo matter what, war is now inevitable."
 CHI.TW.23.a: "The storm approaches..."
 CHI.TW.24.t: "The Impenetrable Air Defense"
 CHI.TW.24.d: "Mr. President, our country has recently suffered missile attacks from the Communist Party. The PLA Rocket Force bombarded our command centers, military factories, military airbases, and key transportation hubs. However, the air defense network enhancements in key areas, funded by special recent allocations, have proven effective. The impact of the missile strikes was greatly reduced, and they surely failed to achieve the Communist Party's expected targets."
 CHI.TW.24.a: "'God Bless Taiwan.'"
 CHI.TW.25.t: "Beijing or Peiping?"
 CHI.TW.25.d: "Beijing has finally returned to our hands.\n\nAfter a long period of war and turmoil, this ancient city has once again welcomed a new regime. Flags on the streets were rehung, closed shops gradually reopened, and people cautiously took to the streets, trying to adapt to this brand new era.\n\nHowever, a seemingly simple question sparked a debate among the public.\n\nShould this city continue to be called 'Beijing' (Northern Capital), or should it revert to 'Peiping' (Northern Peace)?\n\nThose who support the name change argue that the name 'Beijing' has too deep a connection to the CCP regime, and reverting to 'Peiping' symbolizes this city bidding farewell to the past and becoming a city that belongs to the people once again.\n\nBut not all Beijing residents support the name change.\n\n\"I grew up in Beijing.\"\n\n\"To us, this is Beijing. If you change the name, do our memories have to change with it?\"\n\nOne elderly man said in an interview.\n\nA similar debate emerged among the youth. Some believe that changing it to 'Peiping' can thoroughly break from the past, while others believe that the name itself does not symbolize the Communist regime.\n\nThe local government is therefore caught in a dilemma.\n\nChanging the name could serve as a symbol of the new era, but it might also make some residents feel that their life memories are being invalidated; keeping 'Beijing' means continuing a name already heavily laden with political symbolism.\n\nUltimately, after collecting opinions from all sides and conducting public opinion polls, the central government decided-"
 CHI.TW.25.a: "Restore the Name ‘Peiping,’ and March into a New Era"
 CHI.TW.25.b: "“Keep it, Honor Its Legacy"
 CHI.TW.27.t: "Evacuation from America - The Airport"
 CHI.TW.27.d: "In the Greater Los Angeles area of the United States, the local Monterey Park, Diamond Bar, and Rowland Heights areas are the main residential hubs for Taiwanese Americans on the West Coast. After Congress refused to negotiate and various internal factions in the US openly split, various countries began evacuation operations, and our country was naturally no exception.\n\nAlthough our country has many flights and shipping routes in the US, we do not have available armed forces like the embassy guards of other nations, and our Navy cannot travel to the US to provide escort. Therefore, our country can only use civilian ships and flights for preliminary evacuation, while discussing with Japan, South Korea, and even mainland China to travel alongside their evacuation forces.\n\nAt Ontario International Airport, aboard two China Airlines flights, Captain Zhang Weiwu was using a wrench to unscrew the mounting bolts under the seats, and every man on the plane was doing the same. When a seat could be moved, two flight attendants would carry it to the cabin door and toss it straight out. Every time a seat hit the tarmac, a small cheer would erupt from the Taiwanese expatriates waiting in the airport. They knew that for every seat removed, two more people could board the plane. Finally, the captain gave the order to board. The crew and several burly local Chinese gang members, who had volunteered to help maintain order, assisted the expatriates in boarding. Although there were troublesome individuals-like those demanding to bring their entire life savings, those throwing tantrums about bringing their PC towers, and the elderly who couldn't stand and had to lie on stretchers, taking up the space of three people-the vast majority boarded the plane in an orderly fashion."
 CHI.TW.27.a: "Welcome home."
 CHI.TW.28.t: "Evacuation from America - The Port"
 CHI.TW.28.d: "The Port of Los Angeles and the Port of Long Beach. These two busiest ports in Los Angeles host numerous cargo ships from Taiwan's Evergreen Marine and cruise ships with Taiwanese routes like MSC Cruises. Naturally, these two ports became critical sea transport evacuation hubs for many countries around the world, including our own. However, precisely because of this, the local Crips and Bloods gangs had long set their sights on this area after Los Angeles descended into chaos. Areas protected by the armed forces of various embassies were fine, but our country, lacking armed forces in the US, could only rely on armed veterans and locally hired mercenaries to protect the evacuation zone.\n\nOld Wei turned 60 this year. In fact, yesterday was supposed to be his 60th birthday. He was an experienced retired military officer who came to the US to live with his daughter after retiring. After the US descended into chaos, his 60th birthday banquet went down the drain. He arrived at the evacuation zone with his daughter and grandson, only to find that although there were veterans and mercenaries holding weapons to maintain order and block the gangs, there was no order or registration to speak of. Furthermore, the veterans and mercenaries couldn't stand each other. Undeterred by his age, he stepped forward, first winning over the veterans with his credentials and ability, and then reaching an agreement with the mercenary captain, finally uniting both sides to defend the evacuation zone. Over the past week, seven or eight ships had already left the coast, but there were still over ten thousand Chinese stranded here. Old Wei stood by the fence, looking at the gang-ravaged city, and sighed heavily. Perhaps it was for the city where he had lived for nearly ten years.\n\nOld Wei lowered his head, preparing to pull a cigarette from his pack, when he suddenly felt a sting on his scalp, followed by the sound of a gunshot. He immediately realized a bullet had just grazed his scalp. If he hadn't lowered his head at precisely the right moment, he would probably be dead. He quickly crawled behind the concrete wall next to him. By the time he got behind the wall, heavy gunfire had already erupted all around. Ignoring the blood dripping from his head, he peeked out and saw that it seemed the Bloods had launched an attack on this evacuation zone. They had long been eyeing this zone full of wealthy Chinese without regular armed forces to protect them. They had actually deployed snipers and brought grenade launchers; they must have breached a police station or a National Guard armory.\n\nOld Wei's side only had light weapons, their heaviest firepower being an aging M60 light machine gun, and they were low on ammo. The veterans and mercenaries fell one by one, and the originally sixty-strong evacuation zone defense force was reduced to its last 24 men. And the Bloods were preparing to launch another attack, massing slightly further away.\n\nJust as Old Wei and his men prepared for a final stand, the sound of rotors echoed in the sky. An S-70C helicopter flew in from the horizon. A minute later, a rumble came from the horizon, and several naval artillery shells blew the massing gang members to pieces, sending the lucky survivors fleeing in panic. Though Old Wei was old, his eyesight was still good. He thought he saw a familiar flag on the tail of the helicopter. He remembered the Dunmu Fleet was supposedly near the Republic of the Marshall Islands recently. If the government had ordered them to divert immediately upon hearing of the US splintering, it made sense they would arrive right about now.\n\nMinutes after the helicopter flew away, a massive fleet appeared on the horizon. This fleet, composed of over a dozen various ships capable of taking everyone away, sailed toward the bay escorted by three destroyers flying the Blue Sky and White Sun flag. A thunderous cheer erupted from the docks of the evacuation zone."
 CHI.TW.28.a: "A Salute to the Defenders of the Port"
 CHI.TW.29.t: "The Immigrant Problem"
 CHI.TW.29.d: "Mr. President, we have loaded all of our citizens onto the evacuation fleet and will return via the Los Angeles-Hawaii-Japan-Taiwan route. However, there are many non-citizen ethnic Chinese among the waiting crowds in our evacuation fleet who hope to evacuate together, including mainlanders, Hong Kongers, Macanese, and even overseas Chinese holding US citizenship. The evacuation fleet is asking whether they should evacuate the other Chinese as well? If we dump some supplies overboard and reduce the space per person, the fleet might be able to take everyone."
 CHI.TW.29.a: "Forget the color of the passport. We’re all compatriots."
 CHI.TW.29.b: "Saving Taiwanese people is enough."
 CHI.TW.30.t: "Taipei Combat Report"
 CHI.TW.30.d: "\n\n\n                                              £GFX_MND_event_texticon3   \n\n\n\n\nTo: Ministry of National Defense and General Staff Headquarters\n\nEarly this morning, under the cover of massive artillery fire and drone suppression, the Communist army launched a full-scale offensive against downtown Taipei. The enemy's main force breached the outer defenses from the direction of the Tamsui River estuary and Xinzhuang, and executed forced crossings around Guandu and Shezi. The city's communication and power facilities were hit in succession, and Songshan Airport and its surrounding positions fell under continuous fire coverage. The Japan Self-Defense Forces, alongside our armored and mechanized infantry units, organized a counterattack along the Shilin and Neihu line; South Korean volunteer forces held the Zhongshan and Wanhua districts, covering the evacuation of civilians.\n\nDespite fierce resistance from all units, multiple bridges and transportation hubs were destroyed as planned, but the enemy's numerical and firepower superiority was obvious, gradually cutting off contact between the city districts. Our command system suffered severe interference under the intensive strikes, and supply lines were severed. By evening, the municipal core area and the positions around the Presidential Office were lost in succession. The remaining units are retreating toward Yangmingshan and the Nangang hills, preparing to rely on the mountainous terrain to continue the resistance.\n\nBased on the above, downtown Taipei has now been lost. All participating units are reorganizing their formations to await further combat orders."
 CHI.TW.30.a: "Withdraw into the Mountains and Continue the Resistance"
 CHI_taibei_invade2_tt: "§RTaipei is expected to suffer the following losses:§!"
 CHI.TW.31.t: "Taichung Combat Report"
 CHI.TW.31.d: "\n\n\n                                              £GFX_MND_event_texticon3   \n\n\n\n\nTo: Ministry of National Defense and General Staff Headquarters\n\nSince last night, the Communist army concentrated long-range firepower and air assault forces to continuously suppress the Taichung area, advancing with penetrating thrusts from the coastal line and the Dajia River direction. The enemy quickly seized the outer positions of Ching Chuan Kang Airport, then pushed south along the city's elevated expressways with armored and mechanized infantry, intending to split our defense system. A detachment of the Japan Self-Defense Forces, along with our garrison units, firmly held the core facilities of the port and industrial zones, while the Australian Defence Force established anti-armor positions along the Dadu Mountain line to cover the main force's redeployment.\n\nDuring the engagement, city communications were frequently interrupted, and some bridges and interchanges were blown up as planned to delay the enemy's advance. However, the enemy's firepower advantage was significant, advancing from multiple routes to gradually compress our defensive depth. Ching Chuan Kang Airport and the port facilities fell in succession, and the municipal core plunged into chaos under continuous bombardment. By evening, the enemy completed the encirclement of the urban area; our chain of command was severely damaged, and supply lines were cut.\n\nBased on the above, downtown Taichung has now been lost. All participating units are retreating toward Daxue Mountain and the western foothills of the Central Mountain Range, relying on the mountainous terrain to reorganize combat strength while maintaining coordination with allied forces to await further combat instructions."
 CHI.TW.31.a: "Preserve the people and lose the land, and both may yet be saved"
 CHI_taizhong_invade2_tt: "§RTaichung is expected to suffer the following losses:§!"
 CHI.TW.32.t: "Kaohsiung Combat Report"
 CHI.TW.32.d: "\n\n\n                                              £GFX_MND_event_texticon3   \n\n\n\n\nTo: Ministry of National Defense and General Staff Headquarters\n\nThis morning, the Communist army launched a general offensive against the Kaohsiung area, coordinated with long-range firepower and naval and air forces. Enemy ships conducted suppressive fire from offshore, while drones and missiles continuously struck the port's oil depots, communication nodes, and positions around Zuoying. A joint force of our military and the Australian Defence Force built defenses relying on the port's warehousing facilities, city arterial roads, and the high ground of Shoushan, attempting to use defense in depth to consume the enemy's strength and cover the transfer of vital equipment.\n\nAfter several hours of fighting, enemy armored and mechanized infantry units penetrated from the direction of Nanzih and Fengshan, gradually cutting off contact with the urban area. Multiple facilities in the port caught fire under artillery bombardment, and cross-port bridges were blown up according to plan, yet it was still difficult to halt the enemy's relentless pressure. An Australian detachment conducted anti-armor blocking actions along the Daliao line, while our garrison units engaged in street combat in the municipal core. The fighting was fierce, and casualties continued to mount.\n\nBy evening, the enemy secured control of Kaohsiung Port and the city's main administrative facilities. Our supply lines were completely severed, and the command system suffered severe damage.\n\nBased on the above, downtown Kaohsiung has now been lost. All units are retreating toward Qishan and the southern section of the Central Mountain Range, relying on the mountainous terrain to reorganize combat strength while maintaining coordination with allied forces to await further combat instructions."
 CHI.TW.32.a: "Worst case, we'll fight a guerrilla war."
 CHI_gaoxiong_invade2_tt: "§RKaohsiung is expected to suffer the following losses:§!"
 CHI.TW.33.t: "Hualien Combat Report"
 CHI.TW.33.d: "\n\n\n                                              £GFX_MND_event_texticon3   \n\n\n\n\nTo: Ministry of National Defense and General Staff Headquarters\n\nEarly this morning, the Communist army launched multi-pronged assaults along the Suhua Highway and the coastline, and continuously suppressed Hualien Port and airport facilities with long-range firepower. Utilizing air superiority and drone reconnaissance, the enemy conducted precision strikes against our command nodes and supply lines, interrupting battlefield communications multiple times. Our garrison units, in coordination with the Australian Defence Force and a detachment of the Japan Self-Defense Forces, constructed defensive positions around the port, the airport, and the Meilun Mountain line to cover the evacuation of civilians from the city and attempt to delay the enemy's pace of advance.\n\nAs enemy armored units breached the northern defense line, the main berths of Hualien Port and the airport runways fell in succession. Multiple bridges and tunnels along the Suhua line were damaged in the fighting, completely paralyzing the transportation system. The Japanese and Australian allied forces executed a covering retreat toward Taroko, while our forces engaged in street combat in the city to buy time, but under continuous suppressive fire and numerical disadvantage, our defense lines were gradually compressed.\n\nBased on the above, by evening, downtown Hualien and its critical facilities have been taken by the enemy. The remaining units are retreating deep into the Central Mountain Range, relying on the mountainous terrain to reorganize combat strength while maintaining coordination with allied forces to await further combat instructions."
 CHI.TW.33.a: "As long as we hold, there is hope."
